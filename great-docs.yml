# great-docs.yml — Great Docs configuration for sportsdataverse-py
#
# Why an explicit `reference:` instead of auto-discovery?
# `import sportsdataverse` dynamically registers ~2,940 public names at import
# time (2,678 functions, 163 submodules) via make_league_module(). Great Docs'
# auto-discovery validates every name through griffe's dynamic loader (~2s per
# name → ~90 min), so a full `init`/`build` times out. We instead pin an
# explicit, curated per-sport reference of the canonical public surface, which
# skips the per-symbol validation loop and renders in a few minutes. See
# docs-quarto/README.md for the full evaluation.

module: sportsdataverse
display_name: sportsdataverse
parser: google
dynamic: true

# ── Theming ──────────────────────────────────────────────────────────────────
navbar_style: slate
content_style: sky
dark_mode_toggle: true
attribution: true

logo: assets/logo.png
# Brand favicon copied verbatim from the Docusaurus site (docs/static/img/
# favicon.ico) so the browser-tab icon matches. Without this Great Docs
# auto-generates one from the logo; pinning it keeps the two sites identical.
favicon: assets/favicon.ico

# `navbar_style: slate` (the dark gradient above) is the brand backdrop the
# cyan glow sits on — matching the Docusaurus dark navbar. We deliberately do
# NOT set a solid `navbar_color`: it would override the slate gradient. The
# #427FD4 / #39F8FF brand-cyan family lives in the glow (assets/head.html).

# Brand parity with the Docusaurus site (docs/docusaurus.config.ts +
# docs/src/css/custom.css): Plausible analytics, the Bungee/Chivo/Lato/Fira
# font stack, and the cyan "glow" animation are all injected into <head> from
# assets/head.html so the two sites read as one brand.
include_in_header:
  # `file:` (not a bare string) so Quarto reads the file into <head>; a bare
  # string is normalized to a literal-text entry and would inject the path itself.
  - file: assets/head.html

hero:
  enabled: true
  tagline: "Tidy play-by-play, box score, schedule, roster, and odds data across the SportsDataverse — NBA, WNBA, NFL, CFB, MBB, WBB, MLB, and NHL."

# ── GitHub + source links ────────────────────────────────────────────────────
repo: https://github.com/sportsdataverse/sportsdataverse-py
github_style: widget

# Source links are disabled: "View source" generation runs a full unscoped
# export discovery (the same ~2s/name griffe walk over all 2,774 names) that
# the explicit `reference:` was chosen to avoid. Re-enable only if you are
# willing to pay the multi-minute discovery cost.
source:
  enabled: false

# Changelog pulls from GitHub Releases at build time; keep off for the offline
# evaluation build so the build never blocks on network/token.
changelog:
  enabled: false

sidebar_filter:
  enabled: true
  min_items: 10

# ── User guide + tutorials ───────────────────────────────────────────────────
# Two explicit sidebar sections. "User guide" is the executable getting-started
# pair (cells run live against ESPN at build time). "Tutorials" are the 15
# per-sport walkthroughs ported from the Docusaurus site (docs/docs/tutorials/);
# their cells are `#| eval: false` so the build stays fast + non-flaky (they hit
# live ESPN / native / odds APIs). Regenerate the tutorial .qmd files with
# `python tools/convert_tutorials_to_qmd.py` when the source tutorials change.
user_guide:
  - section: "User guide"
    contents:
      # No numeric prefix: Great Docs derives the navbar "User Guide" landing
      # link from the first page's stem, and a numeric prefix breaks it.
      - getting-started.qmd
      - scoreboards-and-schedules.qmd
  - section: "Tutorials"
    contents:
      - 02-quickstart.qmd
      - 03-cfb-intro.qmd
      - 04-nfl-intro.qmd
      - 05-nba-intro.qmd
      - 06-wbb-intro.qmd
      - 07-mbb-intro.qmd
      - 08-nhl-intro.qmd
      - 09-wnba-intro.qmd
      - 10-mlb-intro.qmd
      - 11-pwhl-intro.qmd
      - 12-junior-hockey-intro.qmd
      - 13-odds-intro.qmd
      - 14-soccer-intro.qmd
      - 15-cricket-intro.qmd
      - 16-other-espn-leagues-intro.qmd

# ── Generated API reference ──────────────────────────────────────────────────
# The `reference:` block below is GENERATED from tools/codegen/endpoints/
# leagues.yaml — do NOT hand-edit between the markers. It pins the high-value
# espn_<prefix>_<short> entry points per league across every sport (only names
# that are real importable top-level exports of `sportsdataverse`), plus the
# preserved NFL-loaders + play-by-play/config tail sections.
#
#   Regenerate:  python tools/codegen/generate.py --great-docs
#   Drift check: python tools/codegen/generate.py --great-docs --check
#

# >>> generated reference (python tools/codegen/generate.py --great-docs)
