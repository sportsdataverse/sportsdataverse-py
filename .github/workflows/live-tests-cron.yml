# Weekly drift detector for the live-API tests in tests/test_espn_live.py
# (and any other test gated by SDV_PY_LIVE_TESTS=1).
#
# The main tests.yml already runs the live suite on every PR + push to
# main + workflow_dispatch. This workflow adds the *schedule* leg so
# upstream API drift surfaces even when the repo is quiet — e.g. ESPN
# silently renames a column, NHL EDGE goes 404, MLB Stats API moves an
# endpoint. On failure, the workflow opens (or updates) a single
# tracking issue labeled `live-tests:drift`, instead of opening a new
# issue every week.
#
# Triggers:
#   * schedule  — every Monday 13:00 UTC (08:00 ET) so a Mon-AM regression
#                 is visible before downstream users hit it.
#   * workflow_dispatch — manual trigger when you want to verify drift
#                         outside the schedule cadence.
name: live-tests-cron
on:
  schedule:
    - cron: "0 13 * * 1" # Every Monday at 13:00 UTC
  workflow_dispatch:
permissions:
  contents: read # each job below widens only what it needs
concurrency:
  group: live-tests-cron
  cancel-in-progress: false
jobs:
  live:
    name: pytest --live (ubuntu / py3.13.2)
    runs-on: ubuntu-latest
    # Runs the tests and notebooks (project + third-party code), so it holds a read-only token:
    # any step can read a job's token from the runner, so write access lives in the jobs below.
    permissions:
      contents: read
    outputs:
      pytest_status: ${{ steps.run-pytest.outcome }}
      render_status: ${{ steps.render.outcome }}
      render_failed: ${{ steps.render.outputs.failed }}
      has_changes: ${{ steps.tutorial-changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          # No token on disk while project and third-party code runs.
          persist-credentials: false
      - name: Install uv
        # setup-uv stopped publishing major/minor tags at v8 for supply-chain
        # hardening (https://github.com/astral-sh/setup-uv/releases/tag/v8.0.0).
        # Pin to an immutable patch tag; @v8 / @v8.0 no longer resolve.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python 3.13.2
        run: uv python install 3.13.2
      - name: Install project + extras + dep groups
        run: uv sync --all-extras --all-groups --frozen --python 3.13.2
      - name: Run live tests
        id: run-pytest
        env:
          SDV_PY_LIVE_TESTS: "1"
        # --maxfail=10 keeps the report focused on the first cluster of
        # failures rather than running through 30+ flaky timeouts.
        # tee the output so the next step can grep it for the failure
        # summary that lands in the tracking issue.
        run: |
          set -o pipefail
          # -W default: upstream-data warnings report here; the PR jobs enforce pytest.ini's `error`.
          uv run --frozen pytest --maxfail=10 -rN -W default 2>&1 | tee pytest-live.log
      - name: Run example notebooks (nbmake)
        # !cancelled(): run even when the live tests failed, so a drift week still gets the notebook signal.
        if: ${{ !cancelled() }}
        # The example notebooks hit the same live APIs. Flakiness here shouldn't
        # mask the core live-test drift signal (the tracking issue keys off the
        # live tests and the tutorial render), so this leg is informational: continue-on-error with a
        # separate uploaded log. A reproducible notebook break still surfaces here.
        continue-on-error: true
        env:
          SDV_PY_LIVE_TESTS: "1"
          # Optional: when the ODDS_API_KEY repo secret is set, the betting-odds
          # notebook executes against The Odds API; when unset it resolves to an
          # empty string and the notebook's key-guard renders a "set ODDS_API_KEY"
          # note instead (still passes). No key is ever committed.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -o pipefail
          uv run --frozen pytest --nbmake examples/notebooks/ -q -rN -W default 2>&1 | tee pytest-notebooks.log
      - name: Render notebook tutorials
        # Re-execute the example notebooks and render them (with outputs) to
        # docs/docs/tutorials/. Only from main: a dispatch from another branch would
        # otherwise build the refresh PR on top of that branch's unmerged commits.
        id: render
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          SDV_PY_LIVE_TESTS: "1"
          # Optional: set the ODDS_API_KEY repo secret to refresh the betting-odds
          # tutorial with live outputs; unset -> it re-renders the key-guarded
          # fallback. A quota/transient odds failure only marks the render failed
          # below; it can't block the refresh of the other tutorials.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          # render_notebooks.py exits 1 if ANY of the 15 live notebooks flakes, but it
          # still writes the pages that DID render (a failed notebook keeps its prior
          # page). Record the failure for the drift issue instead of failing here, so
          # one weekly flake never skips publishing the pages that did render.
          set -o pipefail
          if ! uv run --frozen python tools/codegen/render_notebooks.py 2>&1 | tee render-notebooks.log; then
            echo "failed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect tutorial changes
        id: tutorial-changes
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        # git status, not git diff: a new notebook renders an untracked page.
        run: |
          if [ -n "$(git status --porcelain -- docs/docs/tutorials)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload rendered tutorials
        if: ${{ !cancelled() && steps.tutorial-changes.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: rendered-tutorials
          path: docs/docs/tutorials
          if-no-files-found: error
          retention-days: 7
      - name: Upload notebook render log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-notebooks-log
          path: render-notebooks.log
          if-no-files-found: warn
          retention-days: 30
      - name: Upload notebook execution log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-notebooks-log
          path: pytest-notebooks.log
          if-no-files-found: warn
          retention-days: 30
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-live-log
          path: pytest-live.log
          if-no-files-found: warn
          retention-days: 30

  # Publishes the rendered tutorials on a fresh runner that executes no project code.
  publish:
    name: tutorials refresh PR
    needs: live
    if: ${{ !cancelled() && needs.live.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tutorials-refresh branch
      pull-requests: write # open the tutorials-refresh PR
    steps:
      - uses: actions/checkout@v5
      - name: Download the rendered tutorials
        uses: actions/download-artifact@v8
        with:
          name: rendered-tutorials
          path: docs/docs/tutorials
      - name: Open / update the refresh PR
        # main is PR-only, so push a refresh branch and open/update a PR.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- docs/docs/tutorials)" ]; then
            echo "No tutorial changes to publish."
            exit 0
          fi
          branch="auto/tutorials-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add docs/docs/tutorials
          git commit -m "docs(tutorials): refresh executed notebook pages"
          git push -f origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number -q '.[0].number')" ]; then
            gh pr create --head "$branch" --base main \
              --title "docs(tutorials): weekly refresh of executed notebook pages" \
              --body "Automated re-execution + render of \`examples/notebooks/\` to \`docs/docs/tutorials/\` by \`render_notebooks.py\` (live-tests-cron). Review the output diffs and merge to refresh the rendered tutorials."
          fi

  report:
    name: drift tracking issue
    needs: live
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write # open / update / close the drift tracking issue
    steps:
      - name: Download the logs
        continue-on-error: true # a missing log is reported in the issue body
        uses: actions/download-artifact@v8
        with:
          pattern: "*-log"
          merge-multiple: true
      # Open or update the drift tracking issue on failure. One issue
      # per drift event — subsequent failures comment on the same issue
      # so we don't fan out into a stream of duplicates. Closing the
      # issue (e.g. after fixing the regression) resets state.
      - name: Open / update drift tracking issue
        # Also opens when only the tutorial render failed (that step records it instead of failing).
        # main only (a branch dispatch tests that branch, not main); a timed-out pytest step ends 'cancelled'.
        if: >-
          ${{ github.ref == 'refs/heads/main' && (needs.live.outputs.pytest_status == 'failure'
          || needs.live.outputs.pytest_status == 'cancelled' || needs.live.outputs.render_failed == '1') }}
        uses: actions/github-script@v9
        env:
          LOG_FILE: ${{ needs.live.outputs.pytest_status != 'success' && 'pytest-live.log' || 'render-notebooks.log' }}
        with:
          script: |
            const fs = require('fs');
            const logFile = process.env.LOG_FILE;
            let logTail = '';
            try {
              const log = fs.readFileSync(logFile, 'utf8');
              // Last 4 KB of the log -- usually contains the summary lines
              // plus enough context to identify which assertions failed.
              logTail = log.slice(-4000);
            } catch (e) {
              logTail = `(could not read ${logFile}: ${e.message})`;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `Scheduled live-tests run on **${today}** failed.`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `<details><summary>Last 4KB of ${logFile}</summary>`,
              ``,
              '```',
              logTail,
              '```',
              ``,
              `</details>`,
              ``,
              `Likely causes:`,
              `- An upstream API renamed / removed a field a parser depends on.`,
              `- ESPN, MLB Stats API, NHL api-web, or Baseball Savant changed a URL pattern.`,
              `- A live-only assertion bound to a date / season ID needs updating.`,
              ``,
              `**Resolve by**: fixing the parser / wrapper, then closing this issue. The next cron run that goes green will leave the issue closed.`,
            ].join('\n');

            // Find an open drift issue. The label name is the dedup key.
            const label = 'live-tests:drift';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 5,
            });
            if (open.data.length > 0) {
              const issue = open.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                body: `Re-occurred on ${today}.\n\n${body}`,
              });
              core.info(`Commented on existing drift issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                title: `Live-tests drift detected (${today})`,
                body:  body,
                labels: [label],
              });
              core.info(`Opened new drift issue #${created.data.number}`);
            }

      # Close the tracking issue when the run goes green. Without this the
      # workflow only ever OPENS issues -- the body above promises "the next
      # cron run that goes green will leave the issue closed", and nothing
      # executed that, so a fixed drift stayed open indefinitely and the
      # tracker filled with resolved issues (#416 sat open for a week after
      # d7a8c7829 fixed it).
      - name: Close drift tracking issue on green
        # A completed render is required: a branch dispatch skips it, which proves nothing.
        if: >-
          ${{ needs.live.outputs.pytest_status == 'success' && needs.live.outputs.render_status == 'success'
          && needs.live.outputs.render_failed != '1' }}
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'live-tests:drift';
            const today = new Date().toISOString().slice(0, 10);
            // paginate: listForRepo returns ONE page, so a plain call would
            // leave every drift issue past the page size open.
            const found = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            // The issues endpoint also returns pull requests. A PR carrying the
            // drift label is not a tracking issue and must not be closed here.
            const open = found.filter((i) => !i.pull_request);
            if (open.length === 0) {
              core.info('No open drift issue to close.');
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                body: `Live tests went green on ${today} — closing automatically.\n\nRun: ${runUrl}\n\nIf the drift returns, the next failing run reopens tracking by filing a fresh issue with the \`${label}\` label.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed drift issue #${issue.number}`);
            }
