# Weekly drift detector for the live-API tests in tests/test_espn_live.py
# (and any other test gated by SDV_PY_LIVE_TESTS=1).
#
# live-tests.yml already runs the live suite on every push to main and
# on workflow_dispatch (never on PRs). This workflow adds the *schedule* leg so
# upstream API drift surfaces even when the repo is quiet — e.g. ESPN
# silently renames a column, NHL EDGE goes 404, MLB Stats API moves an
# endpoint. On failure, the workflow opens (or updates) a single
# tracking issue labeled `live-tests:drift`, instead of opening a new
# issue every week.
#
# Triggers:
#   * schedule  — every Monday 13:00 UTC (08:00 ET) so a Mon-AM regression
#                 is visible before downstream users hit it.
#   * workflow_dispatch — manual trigger when you want to verify drift
#                         outside the schedule cadence.
name: live-tests-cron
on:
  schedule:
    - cron: "0 13 * * 1" # Every Monday at 13:00 UTC
  workflow_dispatch:
permissions:
  contents: read # each job below widens only what it needs
concurrency:
  group: live-tests-cron
  cancel-in-progress: false
jobs:
  live:
    name: pytest --live (ubuntu / py3.13.2)
    runs-on: ubuntu-latest
    # Runs the tests and notebooks (project + third-party code), so it holds a read-only token:
    # any step can read a job's token from the runner, so write access lives in the job below.
    # The tutorial render + refresh PR live in tutorials-refresh.yml, not here.
    permissions:
      contents: read
    outputs:
      pytest_status: ${{ steps.run-pytest.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          # No token on disk while project and third-party code runs.
          persist-credentials: false
      - name: Install uv
        # setup-uv stopped publishing major/minor tags at v8 for supply-chain
        # hardening (https://github.com/astral-sh/setup-uv/releases/tag/v8.0.0).
        # Pin to an immutable patch tag; @v8 / @v8.0 no longer resolve.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python 3.13.2
        run: uv python install 3.13.2
      - name: Install project + extras + dep groups
        run: uv sync --all-extras --all-groups --frozen --python 3.13.2
      - name: Run live tests
        id: run-pytest
        env:
          SDV_PY_LIVE_TESTS: "1"
        # --maxfail=10 keeps the report focused on the first cluster of
        # failures rather than running through 30+ flaky timeouts.
        # tee the output so the next step can grep it for the failure
        # summary that lands in the tracking issue.
        run: |
          set -o pipefail
          # -W default: upstream-data warnings report here; the PR jobs enforce pytest.ini's `error`.
          # A command-line -W outranks pytest.ini's filterwarnings, so the two known kloppy notices
          # (its unclosed spool buffer, see pytest.ini, and its StatsBomb licence notice) are re-ignored after it.
          uv run --frozen pytest --maxfail=10 -rN -W default -W "ignore:Unclosed file <kloppy.infra.io.buffered_stream.BufferedStream:ResourceWarning" -W "ignore::UserWarning:kloppy._providers.statsbomb" 2>&1 | tee pytest-live.log
      - name: Run example notebooks (nbmake)
        # !cancelled(): run even when the live tests failed, so a drift week still gets the notebook signal.
        if: ${{ !cancelled() }}
        # The example notebooks hit the same live APIs. Flakiness here shouldn't
        # mask the core live-test drift signal (the tracking issue keys off the
        # live tests), so this leg is informational: continue-on-error with a
        # separate uploaded log. A reproducible notebook break still surfaces here.
        continue-on-error: true
        env:
          SDV_PY_LIVE_TESTS: "1"
          # Optional: when the ODDS_API_KEY repo secret is set, the betting-odds
          # notebook executes against The Odds API; when unset it resolves to an
          # empty string and the notebook's key-guard renders a "set ODDS_API_KEY"
          # note instead (still passes). No key is ever committed.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -o pipefail
          uv run --frozen pytest --nbmake examples/notebooks/ -q -rN -W default -W "ignore:Unclosed file <kloppy.infra.io.buffered_stream.BufferedStream:ResourceWarning" -W "ignore::UserWarning:kloppy._providers.statsbomb" 2>&1 | tee pytest-notebooks.log
      - name: Upload notebook execution log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-notebooks-log
          path: pytest-notebooks.log
          if-no-files-found: warn
          retention-days: 30
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-live-log
          path: pytest-live.log
          if-no-files-found: warn
          retention-days: 30

  report:
    name: drift tracking issue
    needs: live
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write # open / update / close the drift tracking issue
    steps:
      - name: Download the logs
        continue-on-error: true # a missing log is reported in the issue body
        uses: actions/download-artifact@v8
        with:
          pattern: "*-log"
          merge-multiple: true
      # Open or update the drift tracking issue on failure. One issue
      # per drift event — subsequent failures comment on the same issue
      # so we don't fan out into a stream of duplicates. Closing the
      # issue (e.g. after fixing the regression) resets state.
      - name: Open / update drift tracking issue
        # main only (a branch dispatch tests that branch, not main); a timed-out pytest step ends 'cancelled'.
        # A failed tutorial render shows as a red tutorials-refresh run instead.
        if: >-
          ${{ github.ref == 'refs/heads/main' && (needs.live.outputs.pytest_status == 'failure'
          || needs.live.outputs.pytest_status == 'cancelled') }}
        uses: actions/github-script@v9
        env:
          LOG_FILE: pytest-live.log
        with:
          script: |
            const fs = require('fs');
            const logFile = process.env.LOG_FILE;
            let logTail = '';
            try {
              const log = fs.readFileSync(logFile, 'utf8');
              // Last 4 KB of the log -- usually contains the summary lines
              // plus enough context to identify which assertions failed.
              logTail = log.slice(-4000);
            } catch (e) {
              logTail = `(could not read ${logFile}: ${e.message})`;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `Scheduled live-tests run on **${today}** failed.`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `<details><summary>Last 4KB of ${logFile}</summary>`,
              ``,
              '```',
              logTail,
              '```',
              ``,
              `</details>`,
              ``,
              `Likely causes:`,
              `- An upstream API renamed / removed a field a parser depends on.`,
              `- ESPN, MLB Stats API, NHL api-web, or Baseball Savant changed a URL pattern.`,
              `- A live-only assertion bound to a date / season ID needs updating.`,
              ``,
              `**Resolve by**: fixing the parser / wrapper, then closing this issue. The next cron run that goes green will leave the issue closed.`,
            ].join('\n');

            // Find an open drift issue. The label name is the dedup key.
            const label = 'live-tests:drift';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 5,
            });
            if (open.data.length > 0) {
              const issue = open.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                body: `Re-occurred on ${today}.\n\n${body}`,
              });
              core.info(`Commented on existing drift issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                title: `Live-tests drift detected (${today})`,
                body:  body,
                labels: [label],
              });
              core.info(`Opened new drift issue #${created.data.number}`);
            }

      # Close the tracking issue when the run goes green. Without this the
      # workflow only ever OPENS issues -- the body above promises "the next
      # cron run that goes green will leave the issue closed", and nothing
      # executed that, so a fixed drift stayed open indefinitely and the
      # tracker filled with resolved issues (#416 sat open for a week after
      # d7a8c7829 fixed it).
      - name: Close drift tracking issue on green
        # main only: a branch dispatch tests that branch, which proves nothing about main.
        if: >-
          ${{ github.ref == 'refs/heads/main' && needs.live.outputs.pytest_status == 'success' }}
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'live-tests:drift';
            const today = new Date().toISOString().slice(0, 10);
            // paginate: listForRepo returns ONE page, so a plain call would
            // leave every drift issue past the page size open.
            const found = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            // The issues endpoint also returns pull requests. A PR carrying the
            // drift label is not a tracking issue and must not be closed here.
            const open = found.filter((i) => !i.pull_request);
            if (open.length === 0) {
              core.info('No open drift issue to close.');
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                body: `Live tests went green on ${today} — closing automatically.\n\nRun: ${runUrl}\n\nIf the drift returns, the next failing run reopens tracking by filing a fresh issue with the \`${label}\` label.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed drift issue #${issue.number}`);
            }
