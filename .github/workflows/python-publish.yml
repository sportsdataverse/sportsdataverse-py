# Build the sdist + wheel via uv build (PEP 517 backend = setuptools, per
# pyproject.toml [build-system]) and publish to PyPI on every release.
#
# Uses PyPI Trusted Publishing (OIDC) instead of an API token — register
# the GitHub Actions identity in PyPI's project settings:
#   https://docs.pypi.org/trusted-publishers/
# Project: sportsdataverse · Workflow filename: python-publish.yml
# Environment: pypi (matches the `environment:` block below).
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Set up Python
        run: uv python install 3.13.2
      - name: Build sdist + wheel
        run: uv build
      - name: Upload build artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only publish on actual GitHub Release events, not workflow_dispatch
    # dry-runs. workflow_dispatch still produces and uploads the artifacts
    # via the build job above so a maintainer can sanity-check before
    # cutting the real release.
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/sportsdataverse
    permissions:
      # Required for PyPI Trusted Publishing (OIDC).
      id-token: write
    steps:
      - name: Download build artifacts from the build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # The token is unused under Trusted Publishing — kept blank so
          # the action falls through to OIDC.
          packages-dir: dist
          skip-existing: true
          verbose: true
