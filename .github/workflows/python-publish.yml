# Build the sdist + wheel via PEP 517 and upload to PyPI on release.

name: Upload Python Package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Build sdist + wheel (PEP 517 via pyproject.toml)
      run: |
        python -m build
    - name: Upload to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        twine upload dist/*
