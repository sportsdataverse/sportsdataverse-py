# Verifies that the conda recipe at recipe/meta.yaml still builds + smoke-
# tests the package. Runs on PRs that touch the recipe or pyproject.toml,
# and on every release. Does NOT upload to anaconda.org — conda-forge
# feedstock automation handles publishing.
name: conda-build
on:
  pull_request:
    paths:
      - "recipe/**"
      - "pyproject.toml"
      - ".github/workflows/conda-build.yml"
  push:
    branches: [main]
    paths:
      - "recipe/**"
      - "pyproject.toml"
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: conda build (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13.2"]
    defaults:
      run:
        # `bash -el {0}` activates the conda env per step.
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Miniforge (mamba)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: sdv-conda-build
          python-version: ${{ matrix.python-version }}
          auto-update-conda: false
          channels: conda-forge
          channel-priority: strict
      # conda-verify is intentionally NOT installed: latest 3.4.2 caps at
      # python<3.12 so it's unsolvable in a py3.13 env. The recipe is
      # `noarch: python` and well-formed; conda-build's own structural
      # checks are sufficient.
      - name: Install conda-build
        run: mamba install -y conda-build
      - name: Build sportsdataverse conda package
        run: conda build recipe/ --no-anaconda-upload --output-folder dist_conda
      - name: Install + smoke-import built package
        run: |
          mamba install -y -c ./dist_conda sportsdataverse
          python -c "import sportsdataverse; \
            import sportsdataverse.cfb; \
            import sportsdataverse.mbb; \
            import sportsdataverse.nba; \
            import sportsdataverse.nfl; \
            import sportsdataverse.nhl; \
            import sportsdataverse.wbb; \
            import sportsdataverse.wnba; \
            print('conda install + import OK')"
      - name: Upload built package as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportsdataverse-conda-py${{ matrix.python-version }}
          path: dist_conda/noarch/*.conda
          if-no-files-found: warn
          retention-days: 14
