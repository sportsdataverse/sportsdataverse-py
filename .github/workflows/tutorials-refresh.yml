# Re-executes the example notebooks and renders them (with outputs) to docs/docs/tutorials/,
# then opens or updates the `auto/tutorials-refresh` PR. It runs no test suite: the live-API
# drift tests are live-tests-cron.yml's job, and a render should not wait two hours behind them.
#
# Triggers:
#   * schedule          — every Monday 13:00 UTC, alongside live-tests-cron.
#   * workflow_dispatch — refresh the tutorials now (from main only; see the render step).
name: tutorials-refresh
on:
  schedule:
    - cron: "0 13 * * 1" # Every Monday at 13:00 UTC
  workflow_dispatch:
permissions:
  contents: read # each job below widens only what it needs
concurrency:
  group: tutorials-refresh
  cancel-in-progress: false
jobs:
  render:
    name: render notebook tutorials
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Executes the notebooks (project + third-party code), so it holds a read-only token:
    # any step can read a job's token from the runner, so write access lives in `publish`.
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.tutorial-changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          # No token on disk while project and third-party code runs.
          persist-credentials: false
      - name: Install uv
        # setup-uv stopped publishing major/minor tags at v8; pin an immutable patch tag.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python 3.13.2
        run: uv python install 3.13.2
      - name: Install project + extras + dep groups
        run: uv sync --all-extras --all-groups --frozen --python 3.13.2
      - name: Route stats.nba.com / stats.wnba.com through a ProxyBonanza IP
        # Both hosts hang on cloud runner IPs, so the NBA / WNBA tutorials' stats cells go through one IP
        # from the org's ProxyBonanza pool (org secrets PROXY_KEY + PROXY_PKG), via the runtime's
        # SDV_PY_NBA_STATS_PROXY. Without the secrets those cells time out and print a skip line.
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          PROXY_KEY: ${{ secrets.PROXY_KEY }}
          PROXY_PKG: ${{ secrets.PROXY_PKG }}
        run: |
          if [ -z "$PROXY_KEY" ] || [ -z "$PROXY_PKG" ]; then
            echo "::warning::PROXY_KEY / PROXY_PKG not available; stats.nba.com cells will skip"
            exit 0
          fi
          pkg=$(curl -fsS --max-time 30 -H "Authorization: $PROXY_KEY" "https://api.proxybonanza.com/v1/userpackages/$PROXY_PKG.json")
          login=$(jq -r .data.login <<<"$pkg")
          pass=$(jq -r .data.password <<<"$pkg")
          ipport=$(jq -r '.data.ippacks | .[(now | floor) % length] | "\(.ip):\(.port_http)"' <<<"$pkg")
          # Mask before anything can echo them.
          echo "::add-mask::$login"
          echo "::add-mask::$pass"
          echo "::add-mask::$ipport"
          echo "SDV_PY_NBA_STATS_PROXY=http://$login:$pass@$ipport" >> "$GITHUB_ENV"
      - name: Route stats.ncaa.org through a Decodo residential IP
        # stats.ncaa.org bans aggressively, so every request to it goes through a proxy: a US sticky
        # residential Decodo session (org secrets DECODO_USER_NAME + DECODO_PASSWORD), read by the NCAA
        # fetch layer as SDV_PY_NCAA_PROXY_URL. The `-session-` id in the username is what pins the IP.
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          DECODO_USER_NAME: ${{ secrets.DECODO_USER_NAME }}
          DECODO_PASSWORD: ${{ secrets.DECODO_PASSWORD }}
        run: |
          if [ -z "$DECODO_USER_NAME" ] || [ -z "$DECODO_PASSWORD" ]; then
            echo "::warning::DECODO_USER_NAME / DECODO_PASSWORD not available; stats.ncaa.org cells will skip"
            exit 0
          fi
          echo "::add-mask::$DECODO_USER_NAME"
          echo "::add-mask::$DECODO_PASSWORD"
          session="user-$DECODO_USER_NAME-country-us-session-$(openssl rand -hex 6)-sessionduration-30"
          echo "::add-mask::$session"
          echo "SDV_PY_NCAA_PROXY_URL=http://$session:$DECODO_PASSWORD@gate.decodo.com:7000" >> "$GITHUB_ENV"
      - name: Render notebook tutorials
        # Only from main: a dispatch from another branch would otherwise build the refresh PR
        # on top of that branch's unmerged commits.
        id: render
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          SDV_PY_LIVE_TESTS: "1"
          # Optional: set the ODDS_API_KEY repo secret to refresh the betting-odds tutorial with
          # live outputs; unset -> it re-renders the key-guarded fallback.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          # render_notebooks.py exits 1 if ANY of the 19 live notebooks flakes, but it still writes
          # the pages that DID render (a failed notebook keeps its prior page). Record the failure
          # and fail the job at the end, after the pages that did render are uploaded for `publish`.
          set -o pipefail
          if ! uv run --frozen python tools/codegen/render_notebooks.py 2>&1 | tee render-notebooks.log; then
            echo "failed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect tutorial changes
        id: tutorial-changes
        if: ${{ steps.render.outcome == 'success' }}
        # git status, not git diff: a new notebook renders an untracked page.
        run: |
          if [ -n "$(git status --porcelain -- docs/docs/tutorials)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload rendered tutorials
        if: ${{ steps.tutorial-changes.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: rendered-tutorials
          path: docs/docs/tutorials
          if-no-files-found: error
          retention-days: 7
      - name: Upload notebook render log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-notebooks-log
          path: render-notebooks.log
          if-no-files-found: warn
          retention-days: 30
      - name: Fail when a notebook did not render
        if: ${{ steps.render.outputs.failed == '1' }}
        run: |
          echo "::error::at least one notebook failed to render; its page kept the previous render (see render-notebooks-log)"
          exit 1

  # Publishes the rendered tutorials on a fresh runner that executes no project code.
  publish:
    name: tutorials refresh PR
    needs: render
    # !cancelled(): a partly failed render still publishes the pages that did render.
    if: ${{ !cancelled() && needs.render.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tutorials-refresh branch
      pull-requests: write # open the tutorials-refresh PR
    steps:
      - uses: actions/checkout@v5
      - name: Download the rendered tutorials
        uses: actions/download-artifact@v8
        with:
          name: rendered-tutorials
          path: docs/docs/tutorials
      - name: Open / update the refresh PR
        # main is PR-only, so push a refresh branch and open/update a PR.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- docs/docs/tutorials)" ]; then
            echo "No tutorial changes to publish."
            exit 0
          fi
          branch="auto/tutorials-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add docs/docs/tutorials
          git commit -m "docs(tutorials): refresh executed notebook pages"
          git push -f origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number -q '.[0].number')" ]; then
            gh pr create --head "$branch" --base main \
              --title "docs(tutorials): weekly refresh of executed notebook pages" \
              --body "Automated re-execution + render of \`examples/notebooks/\` to \`docs/docs/tutorials/\` by \`render_notebooks.py\` (tutorials-refresh). Review the output diffs and merge to refresh the rendered tutorials."
          fi
