# Test suite, split into a fast offline job and a slower live-API job.
#
# WHY THE SPLIT (2026-08-27): the single combined job ran 60-100 minutes and was
# routinely cancelled by the next merge before it finished, so in practice the
# suite verified nothing. Profiling found the cost was NOT spread across 6,000
# tests -- four codegen tests were 2,222s of a 2,755s offline run (81%), almost
# all of it the SAME doc render repeated four to five times. That is fixed in
# tests/codegen/conftest.py; the jobs below carry the rest.
#
#   offline  ubuntu, parallel, no live network. Fast enough to run on PRs, which
#            restores the pre-2026-08-12 merge-time signal.
#   live     macOS, live APIs. Keeps the platform the narrowing kept -- it is the
#            only job that exercises the xgboost/libomp import path -- and keeps
#            the live coverage, off the critical path.
#
# SCOPE (still narrowed, unchanged by this split): the suite runs on 3.13.2 only and
# Windows is NOT exercised; the `floor-import` job below imports the package on the
# 3.10 floor so a 3.11+-only construct cannot ship again, and runs the parser tests
# there on pandas 2. Restore a full version
# sweep by re-adding a matrix `include:` block.
#
# Uses `uv sync --all-extras --all-groups` against the committed uv.lock.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_tests:
        description: "Set SDV_PY_LIVE_TESTS=1 to include live API tests"
        required: false
        default: "true"

# Cancel superseded runs on the same ref. On main this used to mean each merge
# killed the previous run mid-flight and the suite never completed on any commit;
# it is survivable now only because the offline job finishes in minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  offline:
    name: pytest (offline, parallel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        # setup-uv stopped publishing major/minor tags at v8 for supply-chain
        # hardening (https://github.com/astral-sh/setup-uv/releases/tag/v8.0.0).
        # Pin to an immutable patch tag; @v8 / @v8.0 no longer resolve.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.13.2
      - name: Install project + extras + dep groups
        run: uv sync --all-extras --all-groups --frozen --python 3.13.2
      # -n auto: measured 1.79x on a 1,439-test subset. pytest-xdist was already a
      # declared dependency in three groups and simply never used.
      #
      # --dist loadgroup is load-bearing, not a tuning knob: a session fixture is
      # scoped to a WORKER, so without it the three codegen tests that share one
      # render can land on three workers and each re-renders, silently undoing the
      # saving. The xdist_group marker pins them to one worker.
      #
      # No --cov here: coverage instruments every call and this job exists for fast
      # feedback. It runs in the live job, which is not on the critical path.
      # Excluded here because codegen.yml ALREADY runs it, on ubuntu, on the same
      # triggers -- running it again costs ~11 min per CI run for no extra signal:
      #   tests/codegen/                     <- codegen.yml "Codegen test suite"
      # (that includes tests/codegen/test_check.py::test_codegen_drift_clean, the
      # subprocess generate.py --check, which codegen.yml deselects because its own
      # "Codegen drift check" step already runs --check). This is a CI-level dedupe only. A bare `uv run pytest` locally still runs
      # everything, and the pre-push hook still gates the drift check.
      #
      # HOW "offline" IS ENFORCED -- there is deliberately no `-m` marker filter here.
      # Live tests are gated by `skipif` (tests/conftest.py: skip_if_no_live and the
      # per-host SDV_PY_* variants), which reads the env var at COLLECTION time, so
      # simply not setting SDV_PY_LIVE_TESTS in this job skips every live test. A
      # marker filter would be a second, weaker gate that an ungated test slips past.
      # Verified offline under bubblewrap with --unshare-net: 0 network-reaching tests
      # as of 2026-09-18. If you add a test that fetches, gate it in conftest.py or
      # mock the fetch -- do not add a marker here.
      #
      # The one `-m` here is not a network gate: `whole_game` (pytest.ini) marks the
      # oracle-anchored whole-game suites, which run every committed capture through its
      # processor (tests/cfb/test_cfb_whole_game_oracle.py added ~3 min, +43%, to this
      # step). They run in the `whole-game` job below, in parallel; the two jobs together
      # are the offline suite, and every test runs in exactly one of them.
      - name: Run tests (offline)
        run: >
          uv run --frozen pytest -n auto --dist loadgroup --maxfail=10 -q
          -m "not whole_game"
          --ignore=tests/codegen

  whole-game:
    name: pytest (whole-game oracles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.13.2
      - name: Install project + extras + dep groups
        run: uv sync --all-extras --all-groups --frozen --python 3.13.2
      # --dist loadgroup is load-bearing here too: each capture's tests share an
      # xdist_group, so a worker processes a game once and every check on it reads the cache.
      - name: Run the whole-game oracle suites
        run: uv run --frozen pytest -n auto --dist loadgroup -q -m whole_game

  floor-import:
    name: import on the 3.10 floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.10
      # The package once stopped importing on the 3.9 floor without CI noticing
      # (a `set[int] | str | None` evaluated at def time). tests/test_import_sweep.py
      # imports every module under sportsdataverse/ in a subprocess, so a 3.11+-only
      # construct anywhere in the package fails here. Every extra is installed so the
      # sweep imports the extra-gated modules too (it treats a missing optional
      # extra as a skip, not a failure, which would otherwise leave them unchecked).
      - name: Install project + extras + dep groups on 3.10
        run: uv sync --all-extras --all-groups --frozen --python 3.10
      - name: Import every module on 3.10
        run: uv run --python 3.10 --frozen pytest tests/test_import_sweep.py -q -p no:cacheprovider
      # 3.10 resolves pandas 2 (3.13 resolves pandas 3), and pd.json_normalize differs between
      # them: pandas 2 reads a row that is not an object as an empty row instead of raising, which
      # once hid every parser's schema-drift warning (WB-1). The offline parser tests are the
      # pandas-2 coverage; they need no network and run in about a minute.
      - name: Parser tests on 3.10 (pandas 2)
        run: uv run --python 3.10 --frozen pytest tests/test_*parsers.py -n auto -q -p no:cacheprovider

  live:
    name: pytest (live APIs)
    # Only on main and manual runs: live endpoints are third-party and flaky, and a
    # PR author cannot act on an upstream outage.
    if: github.event_name != 'pull_request'
    # Ubuntu: nothing here is platform-specific, and the macOS runners were the flaky part.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.13.2
      - name: Install project + extras + dep groups
        run: uv sync --all-extras --all-groups --frozen --python 3.13.2
      - name: Run tests (live API tests included)
        env:
          SDV_PY_LIVE_TESTS: ${{ github.event.inputs.live_tests != 'false' && '1' || '' }}
          # Bound the retry budget. The library default is 15 retries at a 30s
          # timeout -- correct for a scraper that must not lose a game, badly wrong
          # here, where one unreachable host can park a single call for 15 x 30s
          # plus backoff. A CI failure should surface in seconds, not minutes.
          SDV_PY_HTTP_RETRIES: "3"
          SDV_PY_HTTP_TIMEOUT: "15"
        # -W default: warnings report here rather than fail; the PR jobs enforce pytest.ini's `error`.
        # A command-line -W outranks pytest.ini's filterwarnings, so the two known kloppy notices
        # (its unclosed spool buffer, see pytest.ini, and its StatsBomb licence notice) are re-ignored after it.
        run: uv run --frozen pytest -n auto --dist loadgroup --maxfail=10 -W default -W "ignore:Unclosed file <kloppy.infra.io.buffered_stream.BufferedStream:ResourceWarning" -W "ignore::UserWarning:kloppy._providers.statsbomb" --cov=sportsdataverse --cov-report=term-missing:skip-covered
