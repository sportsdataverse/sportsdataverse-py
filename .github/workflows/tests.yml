# Run the offline test subset on every PR and on workflow_dispatch. Live tests
# (gated by SDV_PY_LIVE_TESTS=1) stay off in CI to avoid hitting third-party
# APIs from PR forks.

name: Test Python Package
on: [pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package + test extras (PEP 517 build via pyproject.toml)
      run: |
        python -m pip install --upgrade pip
        pip install ".[tests]"
    - name: Run offline tests
      run: |
        pytest ./tests/cfb
        pytest ./tests/mbb
