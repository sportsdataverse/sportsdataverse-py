# Columns of NFLPlayProcess(...).plays_frame allowed to differ across the 31 committed captures
# (read by tests/nfl/test_nfl_schema_allowlist.py; provenance: tests/nfl/fixtures/README.md).
#
#   kind: dtype     a different dtype in some captures
#   kind: presence  absent from some captures
#
# Every row names the open finding that owns it. The list may only shrink: the test pins the
# committed set and fails on a row that no capture needs any more, so the fix PR deletes its rows.
# Measured on HEAD 36f7a02f1b (2026-10-11), with the download-on-demand nfl4th boosters off (the
# hermetic run). prob_2pt's dtype mix (C-M7, fixed in task 2.17) needs them, so it has a test of
# its own (test_prob_2pt_has_one_documented_dtype), not a row here.

# C-L10's source row (adv-C-processing-003) names these 15 columns with teamParticipants (whose
# struct field order task 2.17 pinned): ESPN passthrough fields (and one column derived from them)
# that exist only when the feed carries them.
- column: wallclock
