# --- C-M13 / C-NF-2: the CFB opening-kickoff team can be inverted unnoticed ------------------------
- id: cfb-first-half-kickoff-team-swap
  finding: C-M13
  file: sportsdataverse/cfb/cfb_pbp.py
  # the live frame expression (cfb_pbp.py:2865-2873) that start/end.pos_team_receives_2H_kickoff read;
  # block scalars: the first line sets the indent, the later lines keep their 16 spaces
  snippet: |-
    .then(pl.col("homeTeamId"))
                    .otherwise(pl.col("awayTeamId"))
                    .alias("firstHalfKickoffTeamId"),
  mutant: |-
    .then(pl.col("awayTeamId"))
                    .otherwise(pl.col("homeTeamId"))
                    .alias("firstHalfKickoffTeamId"),
  test: tests/cfb/test_cfb_whole_game_oracle.py -k "first_half_kickoff_team and (400547699 or 400547865)"
  expected: kill
  note: >-
    C-NF-2. The row used to mutate the pbp_txt["firstHalfKickoffTeamId"] np.where at :3323-3330, a
    dict key nothing reads or returns, so no test could ever kill it (tier C M13's "survives 242
    tests" was measured there). The swap of the live expression makes the home-kicked captures
    right, so their strict-xfail truth tests XPASS (red). Task 2.6 deletes the dead np.where block
    and flips the test to a plain assert, which then kills the swap on every capture.

