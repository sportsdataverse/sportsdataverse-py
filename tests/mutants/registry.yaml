# Mutation registry: the "mutation that must go red" line of every gate in the quality program's
# ledgers (ClaudeCowork plans/2026-10-08-sdv-py-quality-refactor/gates/*.md), run by
# tools/run_mutants.py (CI: .github/workflows/quality.yml `mutants` job).
#
# Row fields:
#   id        unique slug
#   group     optional label for `--only <group>` and the "<group>: k/n mutants killed" summary
#   finding   the audit finding id (CONSOLIDATED-TIER-{A,B,C}.md row)
#   file      source file, relative to the repo root
#   snippet   text that occurs EXACTLY ONCE in `file` (never a line number)
#   mutant    the replacement text
#   test      the pytest target that must go red (a file or node id, `-k` allowed)
#   expected  `kill` -- the job fails if `test` stays green under `mutant`
#             `{survive_until: <task>}` -- the audit measured that `test` stays green today; the
#             row documents the gap until that plan task lands its killing test (then flip the
#             row to `kill`, pointing `test` at it). An early kill is reported, never fatal.
#   note      why the row exists / what flips it
#
# Seeding rule: every `MUTATION:` line of a ledger gate gets a row in the PR that lands that
# gate's test (1.1-1.5 implementers add theirs; the 11 ledger lines without a row today are
# 1.1-1.5 deliverables whose killing test does not exist yet). An unapplicable row (drifted or
# duplicated snippet, missing test, non-compiling mutant) fails the job whatever `expected`
# says: fix the row in the PR that moved the code.
#
# Every row was run on the branch point (36f7a02f1b): each `kill` row is killed, each
# `survive_until` row survives (see the PR body of `ci: mutation registry and job`). The rows 1.1
# added or flipped were run on its head (PR #758 body).

