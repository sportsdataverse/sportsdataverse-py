# --- C-M13: the CFB second-half-kickoff team can be inverted unnoticed ---------------------------
- id: cfb-first-half-kickoff-team-swap
  finding: C-M13
  file: sportsdataverse/cfb/cfb_pbp.py
  # block scalars: the first line sets the indent, the np.where arms keep their 12 spaces
  snippet: |-
    == init["homeTeamId"]),
                init["homeTeamId"],
                init["awayTeamId"],
  mutant: |-
    == init["homeTeamId"]),
                init["awayTeamId"],
                init["homeTeamId"],
  test: tests/cfb/test_cfb_pbp_offline.py
  expected:
    survive_until: "2.6"
  note: >-
    rt-C-processing-001 (517 passed). 1.2 adds the strict-xfail truth test on 400547866 (C-NF-2);
    it kills this swap once 2.6 ports the game-wide constant and flips it to a plain assert.

