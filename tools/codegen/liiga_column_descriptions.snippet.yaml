    called its timeout.'
  ice_rink_city: City where the rink is located.
  ice_rink_id: Liiga's id of the rink (ice arena).
  ice_rink_latitude: Rink latitude, decimal degrees.
  ice_rink_longitude: Rink longitude, decimal degrees.
  ice_rink_name: Name of the rink (ice arena).
  ice_rink_street_address: Street address of the rink.
  ice_rink_zip: Postal code of the rink.
  periods: 'JSON list of the game''s periods: index, home and away goals, category,
    start and end second.'
