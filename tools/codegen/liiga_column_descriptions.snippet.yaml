  game_id: 'Game id, unique only within a season: key a game as (season, game_id).'
  game_time: 'Seconds from the start of the game. Regular season: 3900 (65:00) = the
    end of the 5-minute overtime; playoff overtime runs past it.'
  game_week: Game week of the season.
