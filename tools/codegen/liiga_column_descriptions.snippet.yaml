liiga_game_goals:
  assist1_first_name: First assist's first name.
  assist1_last_name: First assist's last name.
  assist1_player_id: First assist's player id.
  assist1_season_assists: First assister's season assist count after this goal.
  assist2_first_name: Second assist's first name.
  assist2_last_name: Second assist's last name.
  assist2_player_id: Second assist's player id.
  assist2_season_assists: Second assister's season assist count after this goal.
  away_team_score: Away score after the event.
  event_id: Event id within the game.
  game_id: 'Game id, unique only within a season: key a game as (season, game_id).'
  game_time: 'Seconds from the start of the game. Regular season: 3900 (65:00) = the
    end of the 5-minute overtime; playoff overtime runs past it.'
  goal_types: 'Goal type codes, comma-separated Finnish abbreviations: YV power play,
    AV short-handed, TM empty net, RL penalty shot (others undocumented).'
  goals_so_far_in_season: Scorer's season goal count after this goal.
  home_team_score: Home score after the event.
  log_time: Wall-clock time the event was logged, ISO 8601 UTC.
  minus_jerseys: Jersey NUMBERS of the other team's skaters on ice for the goal, space-separated.
  period: 'Period number: 1-3 are regulation, 4 and up overtime (or the shootout).'
  plus_jerseys: Jersey NUMBERS of this team's skaters on ice for the goal, space-separated.
  scorer_first_name: Scorer's first name.
  scorer_last_name: Scorer's last name.
  scorer_player_id: Scorer's player id.
  season: Season END year (2026 = 2025-26).
  side: 'Which team of the game the row belongs to: home or away.'
  team_id: Team id, the number of Liiga's `<num>:<slug>` team key (sent as that string,
    a bare integer or a digit string depending on the route).
  team_slug: Team slug, the part of Liiga's `<num>:<slug>` team key after the colon
    (e.g. hpk).
  video_clip_playlist_url: URL of the goal's video clip playlist; null in every capture.
  video_clip_url: URL of the goal's video clip; null in every capture.
  video_thumbnail_url: URL of the goal video's thumbnail image; null in every capture.
  winning_goal: Game-winning goal.
liiga_game_lineups:
  alternate_captain: True when the player is an alternate captain (A).
  awards: Player awards of the game (stars).
  captain: True when the player is the team captain (C).
  country_of_birth: Country of birth, 3-letter code.
  date_of_birth: Date of birth, YYYY-MM-DD.
  extra_description: Extra profile text for the player; null in every capture (meaning
    unverified).
  extra_rookie_picture: Flag for an extra rookie picture on the player's profile (meaning
    unverified).
  extra_strengths: Extra profile field for the player's strengths; null in every capture
    (unverified).
  first_name: Player's first name.
  game_id: 'Game id, unique only within a season: key a game as (season, game_id).'
  handedness: Shoots LEFT or RIGHT.
  height: Player's height in centimetres.
  injured: True when the player is listed as injured.
  jersey: Jersey (sweater) number the player wore.
  last_name: Player's last name.
  line: Line number 1-4; null for goalkeepers and extras.
  nationality: Nationality, 3-letter code.
  picture_url: URL of the player's photo.
  place_of_birth: Player's place of birth (town or city).
  player_id: Player id; the same number in lineups, rosters, stat tables and the profile
    (fihaId).
  removed: Removed from the roster.
  role: 'Position: CENTER, LEFT_WING, RIGHT_WING, LEFT_DEFENSEMAN, RIGHT_DEFENSEMAN,
    SEVENTH_DEFENSEMAN, GOALIE.'
  role_code: 'Position code, Finnish: KH = centre, VL/OL = left/right wing, VP/OP
    = left/right defence, 7. P = seventh defenceman, MV = goalkeeper.'
  rookie: True when Liiga flags the player as a rookie.
  season: Season END year (2026 = 2025-26).
  side: 'Which team of the game the row belongs to: home or away.'
  sponsors: Player's sponsors; null in every capture (unverified).
  suspended: True when the player is listed as suspended.
  team_id: Team id, the number of Liiga's `<num>:<slug>` team key (sent as that string,
