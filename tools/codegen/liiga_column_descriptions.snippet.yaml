liiga_teams:
  contact_info: Club contact details as HTML, in Finnish (company, address, phone).
  country_code: Club's country, 3-letter code (e.g. FIN).
  country_name: Club's country name, e.g. Finland.
  current_venue_capacity: Capacity of the team's current home arena (spectators).
  externals: JSON list of the club's external links (url, label), e.g. its ticket
    shops.
  general_info: Club history and facts as an HTML table, in Finnish (founding year,
    titles, ...).
  locality: Club's home locality; null in every capture (unverified).
  logo: Team logo image URL (old.liiga.fi media).
  name: Club name as Liiga lists it, e.g. HIFK or K-Espoo.
  short_name: Team abbreviation.
  team_id: Team id, the number of Liiga's `<num>:<slug>` team key (sent as that string,
    a bare integer or a digit string depending on the route).
  team_slug: Team slug, the part of Liiga's `<num>:<slug>` team key after the colon
    (e.g. hpk).
  teamtournamentstats: Team totals per season and tournament, snake_case, percentages
    and averages sent as STRINGS.
  url: Club website URL.
