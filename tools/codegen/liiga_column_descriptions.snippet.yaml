  away_team_slug: Away team slug (e.g. tps).
  away_time_out: 'Away team: second of the game (from game start) at which the team
    called its timeout.'
  current_period: Last period played (3 = regulation; 4 and up = overtime periods
    or the shootout; 2026 values 3, 4, 5, 7).
  ended: Game has ended.
  finished_type: 'How the game ended: ENDED_DURING_REGULAR_GAME_TIME, ENDED_DURING_EXTENDED_GAME_TIME
