# Example call arguments for the autodoc Returns-schema capture
# (`generate.py --autodoc-schemas`). Keyed by `{league}.{fn}` (use `global` for
# package-level functions). Each value is the kwargs dict passed to the live
# function so its output DataFrame can be introspected for the Returns col table.
#
# Best-effort only: a function absent here gets a no-arg `{}` attempt, and any
# call failure falls back to the docstring Returns prose. IDs are real, completed
# games / known athletes (sourced from the captured scoreboard/leaders fixtures)
# so the calls return non-empty frames.

