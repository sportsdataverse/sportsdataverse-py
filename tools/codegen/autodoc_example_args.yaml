# --- HockeyTech / PWHL (hand-written API wrappers) ---
# game_id=2 is a completed 2025 PWHL regular-season game with shifts/TOI/Corsi/PBP data.
# pwhl_game_info and pwhl_player_box return 0 cols for older game IDs (endpoint limitation).
# pwhl_transactions and pwhl_playoff_bracket have upstream parse errors; captured what works.
pwhl:
  pwhl_schedule: {season: 2025}
  pwhl_pbp: {game_id: 2}
  pwhl_standings: {season: 2025}
  pwhl_teams: {season: 2025}
  pwhl_team_roster: {team_id: 1, season: 2025}
  pwhl_player_stats: {player_id: 27}
  pwhl_leaders: {season: 2025}
  pwhl_season_id: {}
  pwhl_scorebar: {}
  pwhl_stats: {season: 2025}
  pwhl_game_shifts: {game_id: 2}
  pwhl_player_toi: {game_id: 2}
  pwhl_game_corsi: {game_id: 2}
  pwhl_player_search: {name: "Poulin"}
  # pwhl_game_info: returns 0-col frame for completed games (endpoint limitation)
  # pwhl_player_info: returns 0-col frame (endpoint limitation)
  # pwhl_player_game_log: upstream parse error (non-dict items)
  # pwhl_streaks: returns 0-row frame (off-season)
  # pwhl_transactions: upstream parse error (non-dict items)
  # pwhl_playoff_bracket: upstream parse error (non-dict items)
  # pwhl_game_summary: returns dict of frames, not a single DataFrame -- excluded

# OHL game_id=27225 is a completed game with PBP data (older season, same HockeyTech format).
