# Ligue Magnus (magnus) returns-table descriptions, for integration to merge into
# manual_column_descriptions.yaml (keyed by schema = schema_prefix "magnus_" + short).
# Translated from sdv-internal-refs/ligue-magnus/ligue-magnus-returns.md. Delete this file after the merge.
magnus_competitions:
  competition_id: Ligue Magnus competition id (Int64); one per season, the key get_phases and get_rencontres take (1 = 2020-21
    ... 240 = 2026-27).
  season: Season by its END year (2027 = 2026-27), the federation's saison field.
  competition: Competition name as published (sponsor name included, e.g., "Synerglace Ligue Magnus").
  competition_type_id: 'Competition type id: 1 = Ligue Magnus, 2 = Division 1.'
  competition_type_code: Competition type code (NA for the Ligue Magnus).
  competition_type: Competition type label (e.g., "Ligue Magnus").
  external_url: External site linked from the competition (streaming partner).
  published: Whether the competition is published on the league site.
magnus_phases:
  phase_id: Phase id (Int64), the value the phase_id argument of magnus_teams, magnus_rounds, magnus_round_games, magnus_standings
    and magnus_schedule takes. Ids change every season.
  phase: Phase name in French (e.g., "Saison régulière" = regular season).
  phase_type_code: 'Phase type code: C (championnat, round robin) or T (tableau, playoff bracket).'
  visible: Whether the phase is shown on the public site.
  competition: Name of the competition (season) the phase belongs to.
  n_teams: Number of teams in the phase.
  overtime: Whether tied games go to overtime in the phase.
  games_per_matchup: Games each pair of teams plays in the phase.
magnus_teams:
  team_id: Team id (Int64 join key), stable across seasons; joins home_team_id / away_team_id of the schedule and team_id
    of the standings.
  team: Team display name (e.g., "Rapaces de Gap").
  team_abbreviation: Team abbreviation (e.g., "GAP").
  team_short_name: Short team label (e.g., "GAP", "ANGLET").
  team_label: Back-office label, "<club code> - <NAME> <level>"; use team for display.
  gender: 'Gender of the team: M (men; the only value observed).'
  logo_url: Team logo URL.
  club_id: Id of the club (legal entity) behind the team (Int64).
  club: Name of the club (legal entity).
  club_code: Federation club code (e.g., "93006S").
  competition_ids: Competition ids the team has entered, all seasons and levels (list of Int64).
magnus_schedule:
  game_id: Game id (Int64 join key), the game_id argument of magnus_game, magnus_pbp, magnus_lineups and magnus_shootout.
  season: Season by its END year (2027 = 2026-27).
  competition_id: Competition (season) id (Int64).
  phase_id: Phase id (Int64; regular season, playoffs, relegation).
  phase: Phase name in French (e.g., "Saison régulière").
  round: Round (journée) number within the phase.
  game_datetime: Scheduled start, Europe/Paris time (get_rencontres publishes local time, a round body UTC; both are converted).
  status: 'Game state: final, in_progress or scheduled.'
  decision: 'How a final game was decided: regulation, overtime or shootout; null until the game is final (round bodies carry
    no decision, so null there too).'
  home_team_id: Team id of the home team (Int64).
  home_team: Display name of the home team.
  home_team_abbreviation: Abbreviation of the home team.
  away_team_id: Team id of the away team (Int64).
  away_team: Display name of the away team.
  away_team_abbreviation: Abbreviation of the away team.
  home_score: Goals of the home team (shootout winner included in the final score); null until the game starts (unplayed games
    publish a 0-0 placeholder).
  away_score: Goals of the away team; null until the game starts.
  home_team_participant_id: Team participant id of the home team in this phase (Int64; its own key space, joins team_participant_id
    of the standings; not a team id).
  away_team_participant_id: Team participant id of the away team in this phase (Int64; joins team_participant_id of the standings).
  venue_id: Rink id (Int64).
  venue: Rink name.
  game_label: Game label as published ("HOME / AWAY").
magnus_round_games:
  game_id: Game id (Int64 join key), the game_id argument of magnus_game, magnus_pbp, magnus_lineups and magnus_shootout.
  season: Season by its END year (2027 = 2026-27).
  competition_id: Competition (season) id (Int64).
  phase_id: Phase id (Int64; regular season, playoffs, relegation).
  phase: Phase name in French (e.g., "Saison régulière").
  round: Round (journée) number within the phase.
  game_datetime: Scheduled start, Europe/Paris time (get_rencontres publishes local time, a round body UTC; both are converted).
  status: 'Game state: final, in_progress or scheduled.'
  decision: 'How a final game was decided: regulation, overtime or shootout; null until the game is final (round bodies carry
    no decision, so null there too).'
  home_team_id: Team id of the home team (Int64).
  home_team: Display name of the home team.
  home_team_abbreviation: Abbreviation of the home team.
  away_team_id: Team id of the away team (Int64).
  away_team: Display name of the away team.
  away_team_abbreviation: Abbreviation of the away team.
  home_score: Goals of the home team (shootout winner included in the final score); null until the game starts (unplayed games
    publish a 0-0 placeholder).
  away_score: Goals of the away team; null until the game starts.
  home_team_participant_id: Team participant id of the home team in this phase (Int64; its own key space, joins team_participant_id
    of the standings; not a team id).
  away_team_participant_id: Team participant id of the away team in this phase (Int64; joins team_participant_id of the standings).
  venue_id: Rink id (Int64).
  venue: Rink name.
  game_label: Game label as published ("HOME / AWAY").
magnus_rounds:
  round_id: Round id (Int64).
  round: Round (journée) number within the phase, the round argument of magnus_round_games and magnus_schedule.
  round_label: Round label; null in every observed body.
  phase_id: Phase id (Int64).
  phase: Phase name in French.
  competition_id: Competition (season) id (Int64).
  season: Season by its END year (2027 = 2026-27).
  start_date: First date of the round.
  end_date: Last date of the round.
magnus_standings:
  rank: Rank in the standings table.
  team_id: Team id (Int64 join key).
  team: Short team name as the table publishes it (e.g., "MARSEILLE").
  team_abbreviation: Team abbreviation.
  team_participant_id: Team participant id in this phase (Int64; joins home_team_participant_id / away_team_participant_id
    of the schedule).
  games_played: Games played.
  wins: Wins in regulation.
  ot_wins: Wins in overtime or a shootout.
  ot_losses: Losses in overtime or a shootout.
  losses: Losses in regulation.
  ties: Tied games.
  points: Table points.
  goals_for: Goals scored.
  goals_against: Goals allowed.
  penalty_minutes: Penalty minutes.
  last_results: 'Form guide: the last results as W (win), L (loss) or T (tie) letters, in the order the table lists them.'
  standings_id: Standings table id (Int64).
magnus_game:
  game_id: Game id (Int64 join key).
  competition: Competition name as published.
  phase: Phase name in French.
  round: Round (journée) number.
  game_datetime: Start time, Europe/Paris.
  status: 'Game state: final, in_progress or scheduled.'
  home_team_id: Team id of the home team (Int64).
  home_team: Display name of the home team.
  home_team_abbreviation: Abbreviation of the home team.
  away_team_id: Team id of the away team (Int64).
  away_team: Display name of the away team.
  away_team_abbreviation: Abbreviation of the away team.
  home_score: Goals of the home team (the final score, shootout included).
  away_score: Goals of the away team (the final score, shootout included).
  home_team_participant_id: Team participant id of the home team in this phase (Int64; joins the standings).
  away_team_participant_id: Team participant id of the away team in this phase (Int64; joins the standings).
  has_shootout: Whether the game went to a shootout.
  n_periods: Number of regulation periods.
  period_minutes: Length of a regulation period in minutes.
  attendance: Spectators.
  venue: Rink name.
magnus_pbp:
  game_id: Game id (Int64 join key).
  event_id: Event id as published, the raw type plus a number (e.g., "BUT99238"); unique within a game.
  event_type: 'Event type in English: goal, penalty, shot, faceoff, goalie_change or timeout.'
  event_type_raw: 'Event type as published: BUT, SANCTION, TIR, ENGA, REMPLACANT or TEMPS_MORT.'
  period: Period derived from the elapsed seconds (4 = overtime). A faceoff at 1200 / 2400 / 3600 opens the next period; any
    other event at a boundary belongs to the period ending there.
  period_seconds: Elapsed seconds within the period.
  game_seconds: Elapsed game seconds (the sheet's temps).
  team_id: Team id of the event's team (Int64; for a faceoff, the winning team).
  team_abbreviation: Abbreviation of the event's team.
  player_id: Person id (Int64, stable across games) of the acting player; the scorer, the shooter, the penalised player or
    the faceoff winner. Null on goalie changes, timeouts and bench penalties.
  player_name: Name of the acting player (SURNAME First).
  assist1_player_id: Person id of the first assist on a goal (Int64).
  assist1_player_name: Name of the first assist on a goal.
  assist2_player_id: Person id of the second assist on a goal (Int64).
  assist2_player_name: Name of the second assist on a goal.
  goalie_player_id: Person id of the goalie the goal or shot was against (Int64).
  goalie_player_name: Name of the goalie the goal or shot was against.
  faceoff_home_player_id: Person id of the home faceoff taker (Int64).
  faceoff_away_player_id: Person id of the away faceoff taker (Int64).
  strength_code: 'Strength when a goal was scored: EG (even strength), SUP1 (power play, one man up); other codes unobserved.'
  penalty_code: Infraction code (e.g., CIN = slashing).
  penalty: Infraction label in French (e.g., "Cinglage (coup de crosse)").
  penalty_minutes: Penalty length in minutes.
  penalty_start_seconds: Elapsed game seconds when the penalty starts.
  penalty_end_seconds: Elapsed game seconds when the penalty ends.
  goalie_in_player_id: Person id of the goalie entering on a goalie change (Int64; never observed populated).
  goalie_out_player_id: Person id of the goalie leaving on a goalie change (Int64).
  on_ice_plus_player_ids: Person ids of the scoring team's players on ice at a goal, goalie included (list of Int64).
  on_ice_minus_player_ids: Person ids of the conceding team's players on ice at a goal (list of Int64).
magnus_lineups:
  game_id: Game id (Int64 join key).
  team_id: Team id (Int64).
  home_away: home or away.
  player_id: Person id (Int64; joueurs[].id = personne.id), stable across games; the player key of every Magnus frame.
  player_participant_id: The player's roster entry in THIS game (Int64; changes every game), the key the sheet's on-ice lists
    and MVPs use; never join across games on it.
  player_name: Player name (SURNAME First).
  jersey_number: Jersey number worn in this game (string as published).
  registered_jersey_number: Registered jersey number of the person; can differ from the one worn.
  licence_number: FFHG licence number (string; keeps leading zeros).
  position_code: 'Position code: A (attaquant), D (défenseur), GB (gardien de but).'
  position: 'Position in English: forward, defence or goalie.'
  captaincy: C (captain) or A (alternate captain); null otherwise.
  is_mvp: Whether the player was named his team's MVP of the game.
  photo_url: Photo thumbnail URL of the player.
magnus_shootout:
  game_id: Game id (Int64 join key).
  attempt_id: Shootout attempt id (Int64).
  shootout_round: Shootout round of the attempt (one attempt per team per round); not a jersey number.
  team_id: Team id of the shooting team (Int64).
  team_abbreviation: Abbreviation of the shooting team.
  shooter_player_id: Person id of the shooter (Int64); null on rounds not needed.
  shooter_name: Name of the shooter.
  goalie_player_id: Person id of the goalie facing the attempt (Int64).
  goalie_name: Name of the goalie facing the attempt.
  scored: Whether the attempt scored; null on rounds not needed.
