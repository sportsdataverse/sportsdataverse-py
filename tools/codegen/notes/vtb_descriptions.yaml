vtb_infobasket_best_player_parameters:
  name: Leader-category name, English (double spaces as sent).
  param: Leader-category id; pass it as `param` to /Widget/BestPlayers or /Widget/BestTeams.
vtb_infobasket_best_players:
  game_count: Games the value is averaged over.
  game_id: Infobasket GameID of the game (the v2 matches' match_id); global across
    seasons.
  is_same: True when the row ties the previous one.
  param_group: Category group; 0 in the samples.
  param_id: Leader-category id (the `param` of the parameter lists).
  param_label: Leader category label in the requested language (lang).
  param_name: Leader category name (ParamName), e.g. 'Points'.
  param_short_name: Leader category short label, e.g. 'Points in a game'.
  person_first_name_en: First name, English.
  person_first_name_ru: First name, Russian.
  person_full_name_en: Full name, 'Last First', English.
  person_full_name_ru: Full name, 'Last First', Russian.
  person_gender: 'Person gender: 1 on every sampled (male) person.'
  person_id: 'Infobasket person id (PersonID): one person (player, coach or official)
    across clubs and seasons. Joins to /Widget/PlayerPage/{personId} (players) and
    /Widget/CoachPage/{personId} (coaches).'
  person_last_name_en: Last name, English.
  person_last_name_ru: Last name, Russian.
  pre_res: The value as displayed, a string (e.g. '1070' for 10.70 without separator;
    format unverified).
  rank: Rank in the leader list.
  res: The leader's value (a per-game average for 'in a game' categories).
  season: 'Season END year (2026 = 2025-26): the season the request asked for, stamped
    by the runtime.'
  team_id: Infobasket TeamID (2650 = Lokomotiv Kuban); the v2 teamId. Not a club-record
    id and not a registration id.
  team_name_en: The the team's name in English (as the competition names it).
  team_name_ru: The the team's name in Russian (as the competition names it).
  team_region_name_en: The the team's region or city in English (as the competition
    names it).
  team_region_name_ru: The the team's region or city in Russian (as the competition
    names it).
  team_short_name_en: The the team's short name in English (as the competition names
    it).
  team_short_name_ru: The the team's short name in Russian (as the competition names
    it).
vtb_infobasket_best_team_parameters:
  name: Leader-category name, English (double spaces as sent).
  param: Leader-category id; pass it as `param` to /Widget/BestPlayers or /Widget/BestTeams.
vtb_infobasket_best_teams:
  game_count: Games the value is averaged over.
  game_id: Infobasket GameID of the game (the v2 matches' match_id); global across
    seasons.
  is_same: True when the row ties the previous one.
  param_group: Category group; 0 in the samples.
  param_id: Leader-category id (the `param` of the parameter lists).
  param_label: Leader category label in the requested language (lang).
  param_name: Leader category name (ParamName), e.g. 'Points'.
  param_short_name: Leader category short label, e.g. 'Points in a game'.
  pre_res: The value as displayed, a string (e.g. '1070' for 10.70 without separator;
    format unverified).
  rank: Rank in the leader list.
  res: The leader's value (a per-game average for 'in a game' categories).
  season: 'Season END year (2026 = 2025-26): the season the request asked for, stamped
    by the runtime.'
  team_id: Infobasket TeamID (2650 = Lokomotiv Kuban); the v2 teamId. Not a club-record
    id and not a registration id.
  team_name_en: The the team's name in English (as the competition names it).
  team_name_ru: The the team's name in Russian (as the competition names it).
  team_region_name_en: The the team's region or city in English (as the competition
    names it).
  team_region_name_ru: The the team's region or city in Russian (as the competition
    names it).
  team_short_name_en: The the team's short name in English (as the competition names
    it).
  team_short_name_ru: The the team's short name in Russian (as the competition names
    it).
vtb_infobasket_box_score:
  assist: Assists. The wire's null is 0 here (null counts are filled).
  birth_date: 'Birth date (ISO 8601 date) of a player: public bio, kept; coaches''
    and officials'' birth data is never output.'
  blocks: Blocked shots. The wire's null is 0 here (null counts are filled).
  country_code_ioc: 'Nationality code: ISO 3166 alpha-2 in most rows (''RU'', ''US''),
    IOC alpha-3 in some (''BLR'').'
  country_name_en: Nationality code (same as CountryCodeIOC), not a name.
  country_name_ru: Nationality code (same as CountryCodeIOC), not a name.
  def_rebound: Defensive rebounds. The wire's null is 0 here (null counts are filled).
  display_number: Shirt number as displayed ('0' and '00' differ).
  first_name_en: First name in English.
  first_name_ru: First name in Russian.
  foul: Personal fouls committed. The wire's null is 0 here (null counts are filled).
  game_id: Infobasket GameID of the game (the v2 matches' match_id); global across
    seasons.
  goal1: Free throws made. The wire's null is 0 here (null counts are filled).
  goal2: 2-point field goals made. The wire's null is 0 here (null counts are filled).
  goal3: 3-point field goals made. The wire's null is 0 here (null counts are filled).
  height: Height in centimetres.
  is_captain: 1 for the team captain, else 0.
  is_home: True for team 1, the team listed first (team A, the home side in the calendar);
    the body has no explicit home flag (unverified).
  is_start: True for a starter.
  last_name_en: Last name in English.
  last_name_ru: Last name in Russian.
  off_rebound: Offensive rebounds. The wire's null is 0 here (null counts are filled).
  opponent_foul: Fouls drawn. The wire's null is 0 here (null counts are filled).
  person_id: 'Infobasket person id (PersonID): one person (player, coach or official)
    across clubs and seasons. Joins to /Widget/PlayerPage/{personId} (players) and
    /Widget/CoachPage/{personId} (coaches).'
  person_name_en: Name 'Last First' in English.
  person_name_ru: Name 'Last First' in Russian.
  played_time: 'Playing time as ''minutes:seconds'' (team rows sum the five players:
    ''200:00'' = 40 minutes x 5).'
  player_number: Shirt number as an integer (-1 when none).
  plus_minus: 'Plus-minus: point differential while on the court. Null where the host
    sends none.'
  points: Points. The wire's null is 0 here (null counts are filled).
  pos_id: 'Position code: players 1 point guard, 2 shooting guard, 3 small forward,
    4 power forward, 5 centre; coaches 1000 head coach, 1001 assistant; officials
    101-103 referees, 104 commissioner, 111-123 table officials (exact roles unverified).'
  rank_en: Sporting title, English; empty or null in the samples.
  rank_ru: Sporting title, Russian; empty or null in the samples.
  rebound: Total rebounds. The wire's null is 0 here (null counts are filled).
  seconds: Playing time in seconds.
  shot1: Free throws attempted. The wire's null is 0 here (null counts are filled).
  shot1_percent: Free-throw percentage (0-100); parsed to a number (the wire sends
    a comma-decimal string, null when there were no attempts).
  shot2: 2-point field goals attempted. The wire's null is 0 here (null counts are
    filled).
  shot2_percent: 2-point percentage (0-100); parsed to a number (the wire sends a
    comma-decimal string, null when there were no attempts).
  shot3: 3-point field goals attempted. The wire's null is 0 here (null counts are
    filled).
  shot3_percent: 3-point percentage (0-100); parsed to a number (the wire sends a
    comma-decimal string, null when there were no attempts).
  start_mark: '''+'' for a starter, else empty.'
  steal: Steals. The wire's null is 0 here (null counts are filled).
  team_id: Infobasket TeamID (2650 = Lokomotiv Kuban); the v2 teamId. Not a club-record
    id and not a registration id.
  team_number: 'Side of the player''s team: 1 team A (home), 2 team B (away).'
  turnover: Turnovers. The wire's null is 0 here (null counts are filled).
  weight: Weight in kilograms.
vtb_infobasket_calendar:
  arena_en: Arena name, English.
  arena_id: Infobasket arena id; equals the v2 API `venueId` (11687 = SK Basket-Hall,
    Krasnodar).
  arena_ru: Arena, Russian ('СК' = sports complex).
  comp_id: 'Season-level Infobasket CompID of the season (50714 = 2025-26): the id
    every season-keyed route takes.'
  comp_name_en: Stage name (e.g. 'Regular Season'), English.
  comp_name_ru: Stage name, Russian ('Регулярный чемпионат' = 'Regular Season', 'Группа
    А' = 'Group A').
  comp_team_name_aen: Team name as registered in the competition of team A (home),
    English.
  comp_team_name_aru: Team name as registered in the competition of team A (home),
    Russian.
  comp_team_name_ben: Team name as registered in the competition of team B (away),
    English.
  comp_team_name_bru: Team name as registered in the competition of team B (away),
    Russian.
  game_attendance: Spectators at the game (null when not recorded).
  game_date: Game date as an ISO 8601 date (YYYY-MM-DD); the wire sends DD.MM.YYYY.
  game_date_time: Tip-off instant as an ISO 8601 string in Moscow time with its +03:00
    offset (the wire sends a .NET /Date(ms)/ value).
  game_date_time_moscow: Tip-off instant as an ISO 8601 string in Moscow time with
    its +03:00 offset (the wire's second .NET date; equal to game_date_time in every
    sample).
  game_id: Infobasket game id (GameID); equals the v2 API `matchId`. Joins to /Widget/GetOnline/{gameId}
    and /Widget/GamePage/{gameId}.
  game_number: Game number within the competition, e.g. 'RS-002' (RS = regular season);
    playoff games use the series code.
  game_status: 'Game status in the calendar code set: 0 planned, 1 completed, 2 live.'
  game_time: Tip-off local time, 'HH:MM'.
  game_time_msk: Tip-off time in Moscow time ('HH:MM' on calendar rows, 'HH.MM' in
    GetOnline).
  gender: 'Competition gender: 0 on every VTB sample (men). Other values unverified.'
  has_time: True when a tip-off time is set.
  league_name_en: League name, English.
  league_name_ru: League name, Russian ('Единая лига ВТБ' / 'Чемпионат Единой лиги
    ВТБ' = 'VTB United League' / 'VTB United League Championship').
  league_short_name_en: League short name, English.
  league_short_name_ru: League short name, Russian ('ВТБ' = 'VTB').
  region_en: City or region of the game's venue in English.
  region_ru: City or region of the game's venue in Russian.
  region_team_name_aen: Team's city or region of team A (home), English.
  region_team_name_aru: Team's city or region of team A (home), Russian.
  region_team_name_ben: Team's city or region of team B (away), English.
  region_team_name_bru: Team's city or region of team B (away), Russian.
  score_a: Final score of team A (home).
  score_b: Final score of team B (away).
  season: 'Season END year (2026 = 2025-26): the season the request asked for, stamped
    by the runtime.'
  short_team_name_aen: Team short name of team A (home), English.
  short_team_name_aru: Team short name of team A (home), Russian.
  short_team_name_ben: Team short name of team B (away), English.
  short_team_name_bru: Team short name of team B (away), Russian.
  team_a_id: 'Team A (home) TeamID. Infobasket team id (TeamID): one club''s entry
    in a competition family (Lokomotiv Kuban = 2650). Joins to /Widget/Team*/{teamId}
    and equals the v2 API `teamId`.'
  team_b_id: 'Team B (away) TeamID. Infobasket team id (TeamID): one club''s entry
    in a competition family (Lokomotiv Kuban = 2650). Joins to /Widget/Team*/{teamId}
    and equals the v2 API `teamId`.'
  team_name_aen: Team name with city in brackets of team A (home), English.
  team_name_aru: Team name with city in brackets of team A (home), Russian.
  team_name_ben: Team name with city in brackets of team B (away), English.
  team_name_bru: Team name with city in brackets of team B (away), Russian.
  tv_en: TV channels, in English.
  tv_ru: TV channels, in Russian.
vtb_infobasket_coach:
  person_first_name_en: First name, English.
  person_first_name_ru: First name, Russian.
  person_gender: 'Person gender: 1 on every sampled (male) person.'
  person_height: Height in centimetres.
  person_id: 'Infobasket person id (PersonID): one person (player, coach or official)
    across clubs and seasons. Joins to /Widget/PlayerPage/{personId} (players) and
    /Widget/CoachPage/{personId} (coaches). The scope check compares it with the request.'
  person_last_name_en: Last name, English.
  person_last_name_ru: Last name, Russian.
  person_status: Person record status (1 active, 0 otherwise); meaning unverified.
  person_weight: Weight in kilograms.
vtb_infobasket_comp_issue:
  comp_abc_name_en: Stage abbreviation ('1/4-1' = quarter-final 1), English.
  comp_abc_name_ru: Stage abbreviation ('1/4-1' = quarter-final 1), Russian.
  comp_gender: 'Competition gender: 0 on every sample (men).'
  comp_id: Stage CompID (the id vtb_infobasket_standings, _cross_table and _playoff
    take).
  comp_round: Playoff round as the number of series in it (4 = quarter-finals, 2 =
    semi-finals, 1 = final); 0 outside the playoff.
  comp_short_name_en: Stage name, English.
  comp_short_name_ru: Stage name, Russian.
  comp_sort: Sort order among sibling stages.
  comp_state: 'Stage state code: 0 or 2 seen (2 on finished stages, but some finished
    stages show 0); unverified.'
  comp_type: 'Stage type code: 0 season, regular season or group; 10 playoff container;
    5 and 7 playoff series; -5 seen in season lists. Meanings inferred from the stage
    names, unverified.'
  is_public: True when the site shows the stage.
  level: 'Depth in the stage tree: 1 = a stage of the season, 2 = a series or group
    below it.'
  note_en: 'Unobserved: null in every sample, so its type and meaning are unconfirmed.'
  note_ru: 'Unobserved: null in every sample, so its type and meaning are unconfirmed.'
  parent_comp_id: CompID of the parent stage (0 at the top).
  season: 'Season END year (2026 = 2025-26): the season the request asked for, stamped
    by the runtime.'
  season_comp_id: 'Season-level Infobasket CompID of the season (50714 = 2025-26):
    the id every season-keyed route takes.'
vtb_infobasket_cross_table:
  comp_id: 'Stage CompID the request asked for (50720 = the 2025-26 regular season):
    a stage below the season, not an END year.'
  game_date: 'Day and month of the game as the host sends them (''04.04.''): there
    is no year in this route.'
  game_id: Infobasket game id (GameID); equals the v2 API `matchId`. Joins to /Widget/GetOnline/{gameId}
    and /Widget/GamePage/{gameId}.
  game_status: 'Game status in the game-record code set: 21 on every completed game
    sampled (not the calendar''s 0/1/2).'
  home_team: 'Which side was at home: 1 the row team, 2 the opponent.'
  plus_minus: Point difference from the row team's side.
  score: Final score 'row team:opponent'. Every game appears twice, once from each
    side.
  score1: Points of team 1, parsed from the 'a:b' score string.
  score2: Points of team 2, parsed from the 'a:b' score string.
  team1_id: 'TeamID of the row team. Infobasket team id (TeamID): one club''s entry
    in a competition family (Lokomotiv Kuban = 2650). Joins to /Widget/Team*/{teamId}
    and equals the v2 API `teamId`.'
  team1_place: Standings place of the row team.
  team2_id: 'TeamID of the opponent. Infobasket team id (TeamID): one club''s entry
    in a competition family (Lokomotiv Kuban = 2650). Joins to /Widget/Team*/{teamId}
    and equals the v2 API `teamId`.'
  team2_place: Standings place of the opponent.
  win_team: 'Which side won: 1 the row team, 2 the opponent.'
vtb_infobasket_game:
  arena_id: Infobasket arena id; equals the v2 API `venueId` (11687 = SK Basket-Hall,
    Krasnodar).
  attendance: Spectators at the game (null when not recorded).
  comp_id: 'Stage CompID of the game (50720 = the 2025-26 regular season): a stage
    below the season.'
  comp_name_en: Stage name (e.g. 'Regular Season'), English.
  comp_name_ru: Stage name, Russian ('Регулярный чемпионат' = 'Regular Season').
  field_goal_value: Points for a made 2-point shot (2).
  free_throw_value: Points for a made free throw (1).
  from_date: 'Unobserved: null in every sample, so its type and meaning are unconfirmed.'
  game_date: Game date (ISO), local.
  game_date_time: Tip-off as an ISO 8601 string in Moscow time (+03:00), from Online.GameTime.
  game_id: Infobasket GameID of the game (the v2 matches' match_id); global across
    seasons.
  game_number: Game number within the competition, e.g. 'RS-002' (RS = regular season);
    playoff games use the series code.
  game_status: 'Game status: 0 planned, 1 completed, 2 live (the site''s widget code).
    Samples are completed games.'
  game_time: Tip-off time of day as 'HH.MM' (a dot, local time).
  game_time_msk: Tip-off time of day as 'HH.MM' in Moscow time.
  gender: Competition gender code from the host (1 male, 0 unspecified).
  has_time: True when a tip-off time is set.
  has_video: True when a video embed is attached.
  intervals_minutes: Break lengths in minutes after each period, comma separated ('2,15,2,2').
  is3x3: True for a 3x3 competition (False in every sample).
  is_online: True while the game is live; False for a completed game.
  league_name_en: League name, English.
  league_name_ru: League name, Russian ('Единая лига ВТБ' = 'VTB United League').
  league_short_name_en: League short name, English.
  league_short_name_ru: League short name, Russian.
  left_team_number: Team number drawn on the left in the widget (1 in every sample).
  long_shot_value: Points for a made 3-point shot (3).
  max_period: Last period played (4 = regulation; 5+ = overtime).
  period_count: Regulation periods (4).
  period_extra_seconds: Overtime length in seconds (300 = 5 minutes).
  period_minutes: Period lengths in minutes, comma separated ('10,10,10,10').
  personal_fouls: Personal fouls that disqualify a player (5).
  players_on_court: Players per team on the court (5).
  region_id: Infobasket region (city) id of the venue.
  score_a: Final points of team A (listed first).
  score_b: Final points of team B.
  season_comp_id: Season-level CompID of the game (the body calls it LeagueID).
  team_a_id: Infobasket TeamID of team A, the team listed first (the home side in
    the calendar).
  team_a_name_en: The team A (the home side in the calendar)'s name in English (as
    the competition names it).
  team_a_name_ru: The team A (the home side in the calendar)'s name in Russian (as
    the competition names it).
  team_a_region_name_en: The team A (the home side in the calendar)'s region or city
    in English (as the competition names it).
  team_a_region_name_ru: The team A (the home side in the calendar)'s region or city
    in Russian (as the competition names it).
  team_a_short_name_en: The team A (the home side in the calendar)'s short name in
    English (as the competition names it).
  team_a_short_name_ru: The team A (the home side in the calendar)'s short name in
    Russian (as the competition names it).
  team_b_id: Infobasket TeamID of team B, the team listed second (the away side).
  team_b_name_en: The team B (the away side)'s name in English (as the competition
    names it).
  team_b_name_ru: The team B (the away side)'s name in Russian (as the competition
    names it).
  team_b_region_name_en: The team B (the away side)'s region or city in English (as
    the competition names it).
  team_b_region_name_ru: The team B (the away side)'s region or city in Russian (as
    the competition names it).
  team_b_short_name_en: The team B (the away side)'s short name in English (as the
    competition names it).
  team_b_short_name_ru: The team B (the away side)'s short name in Russian (as the
    competition names it).
  team_fouls: Team-foul setting per period, comma separated (4 or 5 seen; exact meaning
    unverified).
  tv_en: TV channels, in English.
  tv_ru: TV channels, in Russian ('Матч ТВ' = Match TV).
  venue_en: Venue, 'City, Arena', in English.
  venue_ru: Venue, 'City, Arena', in Russian.
vtb_infobasket_game_page:
  arena_full_name_en: Arena full name in English.
  arena_full_name_ru: Arena full name in Russian.
  arena_name_en: Arena name in English.
  arena_name_ru: Arena name in Russian.
  comp_id: Always 0 on this thin header; use vtb_infobasket_game for the stage.
  comp_name_en: 'Unobserved: null in every sample, so its type and meaning are unconfirmed.'
  comp_name_ru: 'Unobserved: null in every sample, so its type and meaning are unconfirmed.'
  game_arena: Arena id of the game. Infobasket arena id; equals the v2 API `venueId`
    (11687 = SK Basket-Hall, Krasnodar).
  game_attendance: Spectators at the game (null when not recorded).
  game_date: Game date as an ISO 8601 string in Moscow time (+03:00), midnight.
  game_date_time: Tip-off as an ISO 8601 string in Moscow time (+03:00).
  game_forfeit: 1 when the game was forfeited, else 0.
  game_id: Infobasket game id (GameID); equals the v2 API `matchId`. Joins to /Widget/GetOnline/{gameId}
    and /Widget/GamePage/{gameId}. The scope check compares it with the request.
  game_number: Game number within the competition, e.g. 'RS-002' (RS = regular season);
    playoff games use the series code.
  game_region: Region (city) id of the game.
  game_rules: Rules code (1 in the samples; unverified).
  game_stats_status: Stats status of the game; 0 in the samples.
  game_status: 'Game status: 0 planned, 1 completed, 2 live (the site''s widget code).
    Samples are completed games.'
  game_time: Tip-off as an ISO 8601 string in Moscow time (+03:00).
  game_time_moscow_string: Tip-off time in Moscow time, 'HH:MM'.
  gender: 'Competition gender: 0 on every VTB sample (men). Other values unverified.'
  league_id: Season-level competition id of the game (50714 = VTB 2025-26); 0 in GamePage.
  league_name_en: 'Unobserved: null in every sample, so its type and meaning are unconfirmed.'
  league_name_ru: 'Unobserved: null in every sample, so its type and meaning are unconfirmed.'
  league_short_name_en: 'Unobserved: null in every sample, so its type and meaning
    are unconfirmed.'
  league_short_name_ru: 'Unobserved: null in every sample, so its type and meaning
    are unconfirmed.'
  region_name_en: City or region in English.
  region_name_ru: City or region in Russian.
vtb_infobasket_game_staff:
  country_code_ioc: Country code as the host sends it (ISO alpha-2 in most rows, IOC
    alpha-3 in some).
  game_id: Infobasket GameID of the game (the v2 matches' match_id); global across
    seasons.
  person_id: 'Infobasket person id (PersonID): one person (player, coach or official)
    across clubs and seasons. Joins to /Widget/PlayerPage/{personId} (players) and
    /Widget/CoachPage/{personId} (coaches). 0 on team and placeholder rows.'
  person_name_en: Name in English, as 'Last First'.
  person_name_ru: Name in Russian, as 'Last First'.
  pos_id: Position code of the coach or official (coach 1000 head / 1001 assistant;
    referees 101-103, commissioner 104, table officials 111-123).
  role: 'English role of the person: head coach, assistant coach, referee, commissioner,
    table official (from start_type and pos_id).'
  start_id: Line-up slot id within this game; not a person id.
  start_type: 'Line-up row type: 3 coach, 4 official.'
  team_id: Infobasket TeamID (2650 = Lokomotiv Kuban); the v2 teamId. Not a club-record
    id and not a registration id.
  team_number: 'Side: 1 team A (home), 2 team B (away), 0 neither (officials, the
    placeholder row).'
vtb_infobasket_pbp:
  game_id: Infobasket GameID of the game (the v2 matches' match_id); global across
    seasons.
  parent_play_id: 'play_id of the parent play (a made shot''s children: shot type,
    assist, possession change).'
  person_id: Infobasket PersonID of the player of the line-up slot; null for a play
    with no player.
  play_flag: Play flag; 0 in every sample (meaning unverified).
  play_id: Play id within the game (the row-0 header play included); parent_play_id
    points at another play_id.
  play_period: 'Period: 1-4 quarters, 5+ overtimes.'
  play_second: Time ELAPSED in the period, in tenths of a second (6000 = 600 s = end
    of a 10-minute quarter). Game clock = period length - PlaySecond/10.
  play_sort_order: Order among plays sharing the same play_second.
  play_type: English label of play_type_id from the site widget's table (null for
    a code the table lacks).
  play_type_id: Play type code (see play_type; the full table is in vtb-returns.md).
  play_x: Shot x in decimetres across the court, -75..75, origin at the basket centre
    (orientation from the renderer, unverified).
  play_y: Shot y in decimetres from the basket toward midcourt (about -16 baseline,
    124 midcourt).
