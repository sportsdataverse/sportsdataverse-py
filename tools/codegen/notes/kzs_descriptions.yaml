kzs_pbp:
  action_number: 1-based position of the action in the feed, which is in game order.
  action_type: Action type (code table).
  area: 'Court zone of the action (code table): set on shots, and from 2020-21 on
    located fouls and turnovers; '''' on rows without a location and on every shot
    of early 2015-16 games.'
  clock: 'Time remaining in the period, ''MM:SS:CC'' (minutes, seconds, hundredths):
    ''09:56:00'' = 9:56 left.'
  match_id: 'Match id: the federation key of a game, global across seasons (joins
    kzs_matches and kzs_match).'
  match_team_id: 'Match-team id: this team''s entry in this one match (unique per
    match and side). Joins to play-by-play `matchTeamId`; NOT a team id.'
  match_team_player_first_name: The acting player's given name, as entered for this
    match.
  match_team_player_id: 'Match-player id: the player''s entry in this one match; NOT
    the player id. No captured route is keyed by it: join on `playerId` on the same
    row.'
