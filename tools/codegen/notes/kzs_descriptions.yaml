kzs_box_score:
  assists: The player's assists.
  assists_turnover_ratio: 'The player''s assist-to-turnover ratio (0 in every sample:
    not computed).'
  blocks_against: The player's own shots that were blocked.
  blocks_in_favor: The player's shots blocked (blocks made).
  captain: Games as captain.
  defensive_rating: 'The player''s defensive rating (0 in every sample: not computed).'
  defensive_rebounds: The player's defensive rebounds.
  efficiency: The player's efficiency as the feed computes it (equal to `pIR` on 2025-26
    team lines).
  efficiency_custom: The player's custom efficiency as the federation computes it
    (equal to `efficiency` on player rows; 0 on team lines).
  efficiency_game_score: 'The player''s game score (0 in every sample: not computed).'
  f_t_perc: The player's free-throw percentage, 0-100.
  f_ta: The player's free throws attempted.
  f_tm: The player's free throws made.
  fast_break_points_attempted: 'The player''s fast-break attempts (0 in every sample:
    not computed).'
  fast_break_points_made: 'The player''s fast-break makes (0 in every sample: not
    computed).'
  fg_a: The player's field goals attempted.
  fg_m: The player's field goals made.
  fg_perc: The player's field-goal percentage, 0-100.
  foul_commited: The player's fouls committed.
  foul_received: The player's fouls drawn.
  jersey_number: Shirt number worn, sent as a string ('1', '55').
  m_vp_votes: The player's MVP votes (0 in every sample).
  match_id: 'Match id: the federation key of a game, global across seasons (joins
    kzs_matches and kzs_match).'
  match_team_player_firstname: The player's given name, as entered for this match
    (lower-case n in this route).
  match_team_player_lastname: The player's family name, as entered for this match
    (lower-case n in this route).
  match_team_player_year_of_birth: Birth year from the match entry, sent as a string
    ('2002'); the profile `person.yearOfBirth` is an integer.
  minus: 'The player''s points allowed on court (0 in every sample: not computed).'
  minutes: The player's minutes played, decimal minutes (39.67 = 39 min 40 s); the
    team line sums its players (225.0 = 5 x 45 with overtime).
  offensive_rating: 'The player''s offensive rating (0 in every sample: not computed).'
  offensive_rebounds: The player's offensive rebounds.
  p_er: 'The player''s PER (0 in every sample: not computed).'
  p_ir: The player's PIR, performance index rating ((points + rebounds + assists +
    steals + blocks + fouls drawn) - (missed field goals + missed free throws + turnovers
    + shots blocked + fouls committed)).
  photo_uuid: 'Player photo: image file id, served at https://api.kzs.si/public/images/{uuid}.'
  played: True when the player got on court.
  player_id: Player id (KZS player registry). Joins to /players/{playerId}, box-score
    and play-by-play `playerId`.
  plus: 'The player''s points scored on court (0 in every sample: not computed).'
  plus_minus: 'The player''s plus-minus: points scored minus allowed while on court
    (team line: the final margin).'
  points: The player's points.
  points_fast_break: The player's fast-break points.
  points_in_the_paint: The player's points in the paint.
  points_in_the_paint_attempted: 'The player''s paint attempts (0 in every sample:
    not computed).'
  points_in_the_paint_made: 'The player''s paint makes (0 in every sample: not computed).'
  points_second_chance: The player's second-chance points.
  second_chance_points_attempted: 'The player''s second-chance attempts (0 in every
    sample: not computed).'
  second_chance_points_made: 'The player''s second-chance makes (0 in every sample:
    not computed).'
  starting_lineup: True when the player started.
  steals: The player's steals.
  team_id: 'Team id: one club team in one season (joins kzs_teams); not the match-team
    id and not the club id.'
  team_name: Name of the team for the season, sponsor included.
  team_side: 'Which side of the match the row belongs to: home (the organiser, firstTeam
    on the wire) or away.'
  three_p_perc: The player's three-point percentage, 0-100.
  three_pa: The player's three-point field goals attempted.
  three_pm: The player's three-point field goals made.
  total_rebounds: The player's total rebounds.
  true_shooting_attempts: 'The player''s true-shooting attempts (0 in every sample:
    not computed).'
  true_shooting_percentage: 'The player''s true-shooting percentage (0 in every sample:
    not computed).'
  turnovers: The player's turnovers.
  two_p_perc: The player's two-point percentage, 0-100.
  two_pa: The player's two-point field goals attempted.
  two_pm: The player's two-point field goals made.
  usage_percentage: 'The player''s usage percentage (0 in every sample: not computed).'
kzs_competition:
  category: 'Age category: ABSOLUTE (senior) or U8-U23 / ANY (code table in kzs-returns.md).'
  competition_id: 'Competition id: one per competition per season (men''s top league
    2025-26 = 579, 2026-27 = 608). Joins to /competitions/{competitionId} and the
    `competitionId` query params.'
  gender: MALE or FEMALE.
  name: Competition name, Slovenian (glossary in kzs-returns.md).
  rank: 'Tier: FIRST-FOURTH or TOURNAMENT (code table).'
  season: 'Season of the record: opaque id and ''START/END'' name.'
  season_active: Same as `isActive`.
  season_id: 'Season id: OPAQUE, not a year (1 = 2000/2001 ... 27 = 2026/2027, 31
    = 1991/1992). The season `name` is ''START/END''; the sdv season is the END year
    (the second half of `name`).'
  season_is_active: True for the current season only (2026/2027 on 2026-10-12).
  season_name: Season, 'START/END' (2025/2026); sdv season = the END year.
  social_medias: 'Unobserved: null, or an empty array, in every sample, so its type
    and meaning are unconfirmed.'
  type: Competition type (code table).
