    in the other player rows. Genius LiveStats `data.json` carries no person id, so
    the join to Genius play-by-play is by name, team and jersey number (unverified).
  ranking: Rank in this statistic, 1 = best; ties share a rank and skip the next (1,
    1, 1, 4). The list is the top 5 rows, no more.
  season: 'Season: the calendar year it is played in (May to August) = the sdv END
    year (2025). Taken from the request (the body does not echo it); null for the
    all-time table and for a bare body.'
  statistic: 'Statistic this leader row ranks, the body''s key for the list: POINTS,
    REBOUNDS, ASSISTS, TARGET_SCORES and the other names the request asked for.'
  team_abbreviated_name: Three-letter code of the player's team ('OTT', 'VAN').
  team_id: 'CEBL team id (its own key space; not a Genius id). Joins /teams/ `id`,
