cebl_games:
  away_team_id: 'CEBL team id (its own key space; not a Genius id). Joins /teams/
    `id`, the games'' `home_team_id` / `away_team_id`, `team_id` in player rows and
    the `team_id` / `vs_team_id` params. A relocated or renamed franchise has a second
    id: the Stats Hub groups 15+56 (Saskatchewan Rattlers, Saskatoon Mamba), 17+53
    (Calgary Surge, Guelph Nighthawks), 19+55 (Brampton, Hamilton Honey Badgers) and
    16+54 (Vancouver, Fraser Valley Bandits). The away team.'
  away_team_logo_url: Away team logo URL.
  away_team_name: Away team full English name.
  away_team_score: 'Away team final score. On the 3 cancelled games: null, 0 or a
    partial score; before tip-off unobserved.'
  away_team_stats_url_en: Away team's cebl.ca stats page (English).
  away_team_stats_url_fr: Away team's cebl.ca stats page (French).
  broadcast_partner_logo_urls: Logo URLs of the game's broadcasters (TSN+, CEBL+,
    ...); 2 to 7 per game.
  cebl_stats_url_en: 'The game page on cebl.ca, `https://www.cebl.ca/game?id={matchId}`:
    `id` is the Genius match id, not this row''s `id`.'
  cebl_stats_url_fr: The French cebl.ca game page (`https://www.cebl.ca/fr-ca/game?id={matchId}`).
  competition: REGULAR (regular season) or FINALS (playoffs).
  game_id: 'CEBL game id (its own key space: 568 in 2019, 8 digits from 2025, e.g.
    14708701). No route is keyed by it; the Genius match id is in `stats_url_en`.'
  genius_match_id: Genius LiveStats match id parsed from the stats URL (the join to
    the genius family, organisation CEBL, where play-by-play and shots live). Derived
    from the URL, not fetched; null when the URL is absent.
  home_team_id: 'CEBL team id (its own key space; not a Genius id). Joins /teams/
    `id`, the games'' `home_team_id` / `away_team_id`, `team_id` in player rows and
    the `team_id` / `vs_team_id` params. A relocated or renamed franchise has a second
    id: the Stats Hub groups 15+56 (Saskatchewan Rattlers, Saskatoon Mamba), 17+53
    (Calgary Surge, Guelph Nighthawks), 19+55 (Brampton, Hamilton Honey Badgers) and
    16+54 (Vancouver, Fraser Valley Bandits). The home team.'
  home_team_logo_url: Home team logo URL.
  home_team_name: Home team full English name.
  home_team_score: 'Home team final score. On the 3 cancelled games: null, 0 or a
    partial score; before tip-off unobserved.'
  home_team_stats_url_en: Home team's cebl.ca stats page (English).
  home_team_stats_url_fr: Home team's cebl.ca stats page (French).
  period: Last period played when the API sets it (seen only on a cancelled game,
    which carried period 3); null on a finished game.
  season: 'Season of the game: the year of start_time_utc (the calendar year = the
    sdv END year).'
  start_time_utc: Scheduled tip-off, ISO 8601 in UTC ('2025-05-11T22:00:00Z').
  stats_url_en: 'Genius LiveStats box-score page, `https://fibalivestats.dcd.shared.geniussports.com/u/CEBL/{matchId}/`.
    The segment after `/u/CEBL/` is the Genius match id: the join to genius-livestats/
    (org CEBL), whose `data/{matchId}/data.json` holds the box score, play-by-play
    and shot chart. Only match 2600563 is banked there; the others are derived, and
    cancelled (CANELLED) games carry a filled-in URL whose `data.json` is unverified.'
  stats_url_fr: The same Genius LiveStats page in French (`.../u/CEBL/{matchId}/index_fr_FR.html`).
  status: 'Game status. Observed: COMPLETE (final) and CANELLED (sic: cancelled; 1
    game in 2025, 2 in 2026). The Stats Hub also knows SCHEDULED, IN_PROGRESS, DELAYED
    and FINISHED.'
  tickets_url_en: Ticket-sales page for the game (English).
  tickets_url_fr: Ticket-sales page for the game (French).
  venue_name: Arena name ('Edmonton EXPO Centre').
cebl_news:
  html_content: Article body as HTML (upstream schema; unobserved, no article was
    ever served).
  image_url: Article image URL (upstream schema; unobserved, no article was ever served).
  language: Language code of the request ('en'); the body does not echo it.
  news_id: 'CEBL news article id; null when the API gives none. Unobserved: the route
    answered an empty list on every probe.'
  published_at_utc: Publication time in UTC (upstream schema; unobserved, no article
    was ever served).
  title: Article headline (upstream schema; unobserved, the route answered an empty
    list on every probe).
cebl_player:
  age: Age in whole years on the day of the request (computed by the API); null when
    the birth date is unknown.
  birth_date: Date of birth, YYYY-MM-DD (players' public bio field); null when unknown.
  full_name: Player's full name.
  jersey_number: Jersey number, as a string of up to 2 characters ('0', '00' and '1'
    are distinct); null when unknown.
  nationality: 'Nationality: an upper-case English country name (''CANADA'', ''UNITED
    STATES'', ''SOUTH SUDAN''); null when unknown.'
  photo_url: Player headshot URL on the Genius Sports image CDN (images.statsengine.playbyplay.api.geniussports.com).
  player_id: CEBL player id (its own key space). Joins /players/{player_id}/ and `id`
    in the other player rows. Genius LiveStats `data.json` carries no person id, so
    the join to Genius play-by-play is by name, team and jersey number (unverified).
  position: 'Playing position: G (guard), F (forward), C (center), or a combination
    such as ''C/F''; null when unknown.'
  team_icon_url: Icon URL (without the name) of the player's team.
  team_id: 'CEBL team id (its own key space; not a Genius id). Joins /teams/ `id`,
    the games'' `home_team_id` / `away_team_id`, `team_id` in player rows and the
    `team_id` / `vs_team_id` params. A relocated or renamed franchise has a second
    id: the Stats Hub groups 15+56 (Saskatchewan Rattlers, Saskatoon Mamba), 17+53
    (Calgary Surge, Guelph Nighthawks), 19+55 (Brampton, Hamilton Honey Badgers) and
    16+54 (Vancouver, Fraser Valley Bandits). The player''s latest team.'
  team_name_en: Full English name of the player's team.
  team_name_fr: Full French name of the player's team.
  team_short_name_en: Short English name (city) of the player's team.
  team_short_name_fr: Short French name (city) of the player's team.
  team_stats_url_en: cebl.ca stats page of the player's team (English).
  team_stats_url_fr: cebl.ca stats page of the player's team (French).
cebl_player_gamelog:
  assists: Assists in the game. An integer.
  blocks: Shots blocked in the game. An integer.
  defensive_rebounds: Defensive rebounds in the game. An integer.
  field_goal_percentage: 'Field-goal percentage, 0-100 with 1 decimal (''44.7''):
    made / attempted over the game. A string.'
  field_goals_attempted: Field goals attempted (2- and 3-pointers) in the game. An
    integer.
  field_goals_made: Field goals made (2- and 3-pointers) in the game. An integer.
  fouls: Personal fouls committed in the game. An integer.
  free_throw_percentage: 'Free-throw percentage, 0-100 with 1 decimal (''44.7''):
    made / attempted over the game. A string.'
  free_throws_attempted: Free throws attempted in the game. An integer.
  free_throws_made: Free throws made in the game. An integer.
  game_date: Tip-off of the game, ISO 8601 in UTC (same as the game's `start_time_utc`).
  game_stats_url_en: 'cebl.ca game page, `https://www.cebl.ca/game?id={matchId}`:
    `id` is the Genius match id (the join to genius-livestats/).'
  game_stats_url_fr: French cebl.ca game page (`https://www.cebl.ca/fr-ca/game?id={matchId}`).
  genius_match_id: Genius LiveStats match id parsed from the stats URL (the join to
    the genius family, organisation CEBL, where play-by-play and shots live). Derived
    from the URL, not fetched; null when the URL is absent.
  is_target_scorer: True when the player made the basket that reached the Elam Ending
    target score and ended the game.
  matchup: '''{TEAM} {team score} {vs or @} {opponent score} {OPP}'': the player''s
    team code and score first; `vs` = a home game, `@` = an away game (''OTT 91 @
    95 BHB'').'
  minutes: Minutes played as decimal minutes (26.4), not mm:ss; the API sends a string.
  offensive_rebounds: Offensive rebounds in the game. An integer.
  player_id: CEBL player id of the log asked for (from the request; the body does
    not echo it).
  points: Points scored in the game. An integer.
  rebounds: Total rebounds in the game; the API sends it as a string ('5'), cast to
    Int64.
  season: 'Season of the game: the year of game_date (the calendar year = the sdv
    END year).'
  steals: Steals in the game. An integer.
  team_abbreviated_name: Three-letter code of the player's team in that game ('OTT').
  team_stats_url_en: cebl.ca stats page of the player's team in that game (English).
  team_stats_url_fr: cebl.ca stats page of the player's team in that game (French).
  three_point_percentage: 'Three-point percentage, 0-100 with 1 decimal (''44.7''):
    made / attempted over the game. A string.'
  three_points_attempted: Three-pointers attempted in the game. An integer.
  three_points_made: Three-pointers made in the game. An integer.
  turn_overs: Turnovers in the game. An integer.
cebl_player_leaders:
  competition: 'Competition filter of the request: REGULAR or FINALS; null when both
    were asked. The body does not echo it.'
  full_name: Player's full name.
  mode: 'Table mode of the request: TOTALS (sums over the selected games) or PER_GAME
    (per-game averages); the body does not echo it.'
  photo_url: Player headshot URL on the Genius Sports image CDN (images.statsengine.playbyplay.api.geniussports.com).
