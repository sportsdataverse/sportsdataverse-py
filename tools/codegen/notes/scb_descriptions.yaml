  home_streak: 'Current streak: W or L; empty when none.'
  home_streak_count: Length of the current streak.
  home_team_id: Club id; equal to `seasonTeamId` in every sample. Joins to /teams/{teamId}.
  home_team_name: Team name as listed that season (sponsor names included, e.g. 'EWE
    Baskets Oldenburg').
  home_tlc: Three-letter club code.
  home_total_games: Games the home team has played so far (the API sends it as a string).
  is_free_tv: Shown on free-to-air TV.
  is_hidden: True when the API hides the game (0/1 on /games, a boolean on the header).
  is_tbd: Date or time not yet fixed.
  latest_period: Number of the last period played (4 = Q4, 5 = OT1, ...); the API
    sends `Q4` on /games and 4 on /games/recent. Null before the game.
  league: 'League the row belongs to: `bbl` (men) or `dbbl` (women); BBL and DBBL
    game ids overlap, so a game is (league, game_id).'
  live_stream_url: Live-stream link (DBBL games link YouTube); empty when none.
  match_day: Round number within the stage (Spieltag).
  referee1_first_name: Official's given name.
  referee1_id: 'Official id; joins to /referees `refId` (= its `id`). /referees lists
    only the current officials (44), so older games'' officials can be missing there:
    all 40 of 2026-27''s matched, 6 of 10 of 2008-09''s.'
  referee1_last_name: Official's family name.
  referee2_first_name: Official's given name.
  referee2_id: 'Official id; joins to /referees `refId` (= its `id`). /referees lists
    only the current officials (44), so older games'' officials can be missing there:
    all 40 of 2026-27''s matched, 6 of 10 of 2008-09''s.'
  referee2_last_name: Official's family name.
  referee3_first_name: Official's given name.
  referee3_id: 'Official id; joins to /referees `refId` (= its `id`). /referees lists
    only the current officials (44), so older games'' officials can be missing there:
    all 40 of 2026-27''s matched, 6 of 10 of 2008-09''s.'
  referee3_last_name: Official's family name.
  scheduled_time: Scheduled tip-off, ISO 8601 UTC.
  season: Season END year (2026 = 2025-26), the sdv key; the API's `season_id` plus
    one.
  season_id: Season, START year (2026 = 2026-27).
  spectators: Attendance; 0 when not recorded.
  stage: 'Stage: MAIN_ROUND (Hauptrunde, regular season), PLAYINS, FIRST_ROUND, SECOND_ROUND,
    ROUND_OF_16 (Achtelfinale), ROUND_OF_8 (Viertelfinale), SEMI_FINALS, FINALS, THIRD_PLACE_GAME,
    QUALIFICATION, GROUP_STAGE.'
  stat_status: 'Live-stats feed status code. Observed: E (ended; German Ende), N (not
    started), 1 (old games), empty string. Meaning inferred.'
  status: 'Game status: PRE (scheduled), LIVE, POST (ended, not yet official), OFFICIAL
    (final).'
  top_score: Points of the game's top scorer; null before the game.
  top_scorer_first_name: Player's given name.
  top_scorer_last_name: Player's family name.
  top_scorer_real_player_id: 'Global person id: the same across clubs and seasons.
    Joins to `realPlayerId` everywhere.'
  top_scorer_season_player_id: 'Season-player id. BBL: a string equal to `id`. DBBL:
    an INTEGER that matches /seasons/{seasonId} `seasonPlayerId` (5 of 5 rows checked,
    2026-27). Joins to /season-players/{seasonPlayerId}.'
  tv_channel: TV channel(s) showing the game, comma-joined (a list on some routes,
    an empty string when none).
  tv_type: TV coverage type; empty or null in every sample.
  venue_address: Postal address, German.
  venue_capacity: Arena capacity, spectators.
  venue_id: Arena id, stable across seasons (Uber Arena = 2 in both 2025-26 and 2026-27);
    a different key space from /teams `seasonVenues.id`, and no captured route is
    keyed by it. A string in /games and /games/{gameId}, an integer in /games/recent.
  venue_is_main: The club's main arena.
  venue_name: Name of the arena the game is played in; `venue_id` is its stable arena
    id.
scb_game_actions:
  action_id: Action id, an integer unique across games of a league.
  action_identifier: Provider action key `<n>:<seq>` (opaque; the first part is not
    the period).
  assisting_season_player_id: Season-player id of the assisting player; only on assisted
    made shots. Joins to box-score `seasonPlayer.id` and action `seasonPlayerId`.
  game_id: Game id, a string; unique within a league only (BBL and DBBL overlap),
    and not chronological.
  game_time: 'Game clock as HH:MM:SS: in an action, the time LEFT in the period (00:10:00
    at the start of a 10-minute quarter); in a game header, 00:00:00 in every sample.'
  guest_team_points: Guest score after this action; only on scoring actions.
  home_team_points: Home score after this action; only on scoring actions.
  is_successful: Made / successful (shots, free throws); for other types see the action-type
    table.
  league: 'League the row belongs to: `bbl` (men) or `dbbl` (women); BBL and DBBL
    game ids overlap, so a game is (league, game_id).'
  order_id: Chronological sequence of the action within the game.
  period: 'Period: 1-4 quarters, 5+ overtimes.'
  qualifiers: Action qualifiers (shot kind, rebound side, foul kind, turnover kind);
    see the qualifier table.
  real_time: 'Wall-clock time of the action, ISO 8601 UTC. Pre-2011 games carry a
    placeholder: local midnight of the game day (23:00 UTC the day before) on every
    row.'
  season_player_id: 'Season-player id: one player''s engagement with one club (kept
    across seasons while he stays, new after a move; see README). Joins to box-score
    `seasonPlayer.id`, action `seasonPlayerId` and /season-players/{seasonPlayerId}.
    Null on team and period rows.'
  season_team_id: Season-team id; equal to the club `teamId` in every sample (BBL
    2005-2026, DBBL 2024-2026).
  seconds_left: 'Seconds left in the period at the action: `game_time` as seconds.'
  shot_x: Shot x on the site's half-court chart (0-280 across, 140 through the rim);
    null without a location. Scale and orientation unverified.
  shot_y: Shot y along the court from behind the baseline (rim near 45, arc top near
    147); null without a location. Scale and orientation unverified.
  side: '`home` or `guest` (the away side), for the team the row belongs to.'
  type: Action type; see the action-type table. Records and videos use their own `type`
    (see those routes).
scb_game_players:
  assists: The player's assists in the game.
  blocks: The player's blocked shots in the game.
  defensive_rebounds: The player's defensive rebounds in the game.
  double_double: The player's double-doubles in the game.
  efficiency: The player's efficiency (EFF = PTS + REB + AST + STL + BLK - missed
    FG - missed FT - TO; checked on a 2026 box score) in the game.
  field_goals_attempted: The player's field goals attempted in the game.
  field_goals_made: The player's field goals made in the game.
  field_goals_recomputed: True when the API's field-goal totals disagreed with its
    2-point plus 3-point parts (2005-06 box scores) and were recomputed from the parts.
  field_goals_success_percent: The player's field-goal percentage in the game, 0-100
    (one decimal); 0 when no attempts.
  first_name: Player's given name.
  fouls_committed: The player's fouls committed in the game.
  fouls_received: The player's fouls drawn in the game.
  free_throws_attempted: The player's free throws attempted in the game.
  free_throws_made: The player's free throws made in the game.
  free_throws_success_percent: The player's free-throw percentage in the game, 0-100
    (one decimal); 0 when no attempts.
  game_id: Game id, a string. Joins to /games/{gameId}.
  is_starting_five: Started the game.
  last_name: Player's family name.
  league: 'League the row belongs to: `bbl` (men) or `dbbl` (women); BBL and DBBL
    game ids overlap, so a game is (league, game_id).'
  offensive_rebounds: The player's offensive rebounds in the game.
  opponent_team_name: Opponent's name.
  plus_minus: The player's plus-minus (point margin while on court); null when the
    API sends an empty string (2005-06).
  points: The player's points in the game.
  position: 'Position: POINT_GUARD, SHOOTING_GUARD, SMALL_FORWARD, POWER_FORWARD,
    CENTER.'
  real_player_id: 'Global person id: the same across clubs and seasons. Joins to `realPlayerId`
    everywhere.'
  season: Season END year (2026 = 2025-26), the sdv key; the API's `season_id` plus
    one.
  season_id: Season, START year (2026 = 2026-27).
  season_player_id: 'Season-player id: one player''s engagement with one club (kept
    across seasons while he stays, new after a move; see README). Joins to box-score
    `seasonPlayer.id`, action `seasonPlayerId` and /season-players/{seasonPlayerId}.'
  season_team_id: Season-team id; equal to the club `teamId` in every sample (BBL
    2005-2026, DBBL 2024-2026).
  seconds_played: The player's playing time in SECONDS in the game.
  shirt_number: Jersey number. A number or a numeric string across rows.
  side: '`home` or `guest` (the away side), for the team the row belongs to.'
  steals: The player's steals in the game.
  team_id: Club id; equal to `seasonTeamId` in every sample. Joins to /teams/{teamId}.
  team_name: Team name as listed that season (sponsor names included, e.g. 'EWE Baskets
    Oldenburg').
  team_tlc: Three-letter club code.
  three_point_shot_success_percent: The player's 3-point field-goal percentage in
    the game, 0-100 (one decimal); 0 when no attempts.
  three_point_shots_attempted: The player's 3-point field goals attempted in the game.
  three_point_shots_made: The player's 3-point field goals made in the game.
  total_rebounds: The player's rebounds (offensive + defensive) in the game.
  triple_double: The player's triple-doubles in the game.
  turnovers: The player's turnovers in the game.
  two_point_shot_success_percent: The player's 2-point field-goal percentage in the
    game, 0-100 (one decimal); 0 when no attempts.
  two_point_shots_attempted: The player's 2-point field goals attempted in the game.
  two_point_shots_made: The player's 2-point field goals made in the game.
