scb_game:
  commissioner_first_name: Official's given name.
  commissioner_id: 'Official id; joins to /referees `refId` (= its `id`). /referees
    lists only the current officials (44), so older games'' officials can be missing
    there: all 40 of 2026-27''s matched, 6 of 10 of 2008-09''s.'
  commissioner_last_name: Official's family name.
  competition: 'Competition: BBL, BBL_CUP (Pokal), ALLSTAR, CHAMPIONS_CUP on the BBL
    host; DBBL, DBBL_CUP on the DBBL host.'
  game_id: Game id, a string; unique within a league only (BBL and DBBL overlap),
    and not chronological.
  game_progress: 'Live progress code: E (ended), empty or null before the game. Meaning
    inferred.'
  guest_is_foreign: The team is not in this league (cup opponents from the ProA /
    ProB).
  guest_last10_losses: Losses in the last 10 games.
  guest_last10_victories: Wins in the last 10 games.
  guest_ot1_score: Guest team points in overtime 1; 0 when not played (null from OT5
    on in old seasons).
  guest_ot2_score: Guest team points in overtime 2; 0 when not played (null from OT5
    on in old seasons).
  guest_ot3_score: Guest team points in overtime 3; 0 when not played (null from OT5
    on in old seasons).
