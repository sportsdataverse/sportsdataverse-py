  guest_streak: 'Current streak: W or L; empty when none.'
  guest_streak_count: Length of the current streak.
  guest_team_id: Club id; equal to `seasonTeamId` in every sample. Joins to /teams/{teamId}.
  guest_team_name: Team name as listed that season (sponsor names included, e.g. 'EWE
