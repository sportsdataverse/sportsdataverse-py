    a team in ONE competition, so a club has a new id every season (Antwerp = 3 in
    2021-22, 506 in 2025-26, 541 in 2026-27). uu_team_id is the stable club key.'
  defensive_foul: 'Fouls DRAWN (suffered), despite the name: equals the opponent''s
    foul count up to scorer corrections. Per-game mean over the games played (fractional).'
  defensive_rebound: Defensive rebounds. Per-game mean over the games played (fractional).
  dunk_all: Dunks attempted. Per-game mean over the games played (fractional).
  dunk_made: Dunks made (a subset of the two-point field goals). Per-game mean over
    the games played (fractional).
  dunk_percent: Dunk percentage 0-100; 0 when none were attempted. Per-game mean over
    the games played (fractional).
  first_name: Given name of the player as entered in the CMS.
  foul: Personal fouls committed. Per-game mean over the games played (fractional).
  free_throw_all: Free throws attempted. Per-game mean over the games played (fractional).
  free_throw_made: Free throws made. Per-game mean over the games played (fractional).
  free_throw_percent: Free-throw percentage 0-100. Per-game mean over the games played
    (fractional).
  games_started: Games started (a count, not a mean).
  last_name: Family name of the player as entered in the CMS.
  minute: Minutes played; for a team total, the sum over its players (200 + 25 per
    overtime). Per-game mean over the games played (fractional).
  nationality_code: 'Nationality code in FIBA style (USA, BEL, NED): DIRTY, with lower-case
    variants, ''/''-joined pairs (USA/BEL), the empty string and ''HOL''; normalise
    before joining.'
  offensive_rebound: Offensive rebounds. Per-game mean over the games played (fractional).
  played_games: Games the player played in the season.
  player_id: 'Player id (key space: sportpress persons): stable across seasons and
    teams, distinct from roster_id. Not a Genius or FIBA person id.'
  points: Points scored (2 x two-pointers + 3 x three-pointers + free throws). Per-game
    mean over the games played (fractional).
  roster_id: 'Roster id (key space: sportpress roster entries): one player on one
    competition team in one season, so a player has a new roster_id for every team
    and season. player_id is the person.'
  steal: Steals (balls taken from an opponent). Per-game mean over the games played
    (fractional).
  three_point_all: Three-point field goals attempted. Per-game mean over the games
    played (fractional).
  three_point_made: Three-point field goals made. Per-game mean over the games played
    (fractional).
  three_point_percent: Three-point percentage 0-100. Per-game mean over the games
    played (fractional).
  throw_all: All field goals attempted, two- plus three-pointers (the provider calls
    them 'throw'). Per-game mean over the games played (fractional).
  throw_made: All field goals made, two- plus three-pointers (the provider calls them
    'throw'). Per-game mean over the games played (fractional).
  throw_percent: Field-goal percentage 0-100. Per-game mean over the games played
    (fractional).
  total_rebound: Total rebounds (offensive plus defensive). Per-game mean over the
    games played (fractional).
  turnover: Turnovers committed. Per-game mean over the games played (fractional).
  two_point_all: Two-point field goals attempted. Per-game mean over the games played
    (fractional).
  two_point_made: Two-point field goals made. Per-game mean over the games played
    (fractional).
  two_point_percent: Two-point percentage 0-100. Per-game mean over the games played
    (fractional).
  value: 'Efficiency rating (PIR with fouls drawn): points + rebounds + assists +
    steals + blocks + fouls drawn - missed field goals - missed free throws - turnovers.
    Per-game mean over the games played (fractional).'
sportpress_team_rankings:
  category: 'Ranking category: efficiency, points, total_rebound, block, assist, steal,
    two_point_percent, three_point_percent or free_throw_percent.'
  competition_id: 'Competition id (key space: sportpress competitions): ONE season
    of the league (24 = 2025-26, 25 = 2026-27). Not the season number. The key of
    the standings, ranking, slider and box routes.'
  competition_team_id: 'Competition-team id (key space: sportpress competition teams):
    a team in ONE competition, so a club has a new id every season (Antwerp = 3 in
    2021-22, 506 in 2025-26, 541 in 2026-27). uu_team_id is the stable club key.'
  rank: Place in the category list, 1 = the leader (the list is sorted best first).
  team: 'Team display name including the sponsor; varies with language and playoff
    suffixes: never join on it.'
  team_short_name: Three-letter club code (ANT, MON, ...), stable across seasons in
    the samples.
  value: The team's per-game mean (or percentage 0-100) in the row's category.
sportpress_team_roster:
  active: True for a current roster entry; the lists hold current entries only.
  birth_date: Date of birth as shown on the public player page; null when unknown.
  competition_team_id: 'Competition-team id (key space: sportpress competition teams):
    a team in ONE competition, so a club has a new id every season (Antwerp = 3 in
    2021-22, 506 in 2025-26, 541 in 2026-27). uu_team_id is the stable club key.'
  first_name: Given name of the player as entered in the CMS.
  height: Height in cm; null when unknown.
  jersey: Shirt number as text; the box score sends it as an integer, so a zero-padded
    '00' is already lost there.
  last_name: Family name of the player as entered in the CMS.
  nationality_code: 'Nationality code in FIBA style (USA, BEL, NED): DIRTY, with lower-case
    variants, ''/''-joined pairs (USA/BEL), the empty string and ''HOL''; normalise
    before joining.'
  player_id: 'Player id (key space: sportpress persons): stable across seasons and
    teams, distinct from roster_id. Not a Genius or FIBA person id.'
  position: 'Position code: point_guard, shooting_guard, small_forward, power_forward,
    center, and the hybrids point_guard-shooting_guard, shooting_guard-small_forward,
    small_forward-power_forward, power_forward-center.'
  position_id: 'Position id (key space: sportpress positions; 3 = small_forward).'
  roster_id: 'Roster id (key space: sportpress roster entries): one player on one
    competition team in one season, so a player has a new roster_id for every team
    and season. player_id is the person.'
  weight: Weight in kg; null when unknown.
sportpress_ui_strings:
  key: Dotted UI string key such as 'statistics.individual.points'; 302 keys per language.
  language: 'ISO 639-1 code of the UI language: en, fr (French) or nl (Dutch).'
  text: The UI text in that language; 11 keys label statistics columns, the rest are
    menus and buttons.
