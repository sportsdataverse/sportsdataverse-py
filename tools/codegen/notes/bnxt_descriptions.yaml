sportpress_club_seasons:
  season: Season END year in which the clubs (countries) have teams; includes 2021
    = 2020-21.
sportpress_competition_staff:
  competition_id: Competition id of the team the staff member works for.
  competition_team_id: 'Competition-team id (key space: sportpress competition teams):
    a team in ONE competition, so a club has a new id every season (Antwerp = 3 in
    2021-22, 506 in 2025-26, 541 in 2026-27). uu_team_id is the stable club key.'
  name: Staff member name 'First Last' (free text).
  staff_id: 'Staff member id (key space: sportpress staff).'
  title_id: 'Staff title id: 1 = Head coach; Assistant coach has its own id.'
  title_name: 'Staff title in English: Head coach or Assistant coach.'
sportpress_competition_teams:
  club_id: 'Country of the team (key space: sportpress clubs): 1 = Belgium, 2 = Netherlands.
    The provider calls the country a club.'
  club_name: Country name in English, Belgium or Netherlands.
  competition_id: 'Competition id the team plays in (key space: sportpress competitions);
    the competition_id the route was asked for.'
  competition_team_id: 'Competition-team id (key space: sportpress competition teams):
    a team in ONE competition, so a club has a new id every season (Antwerp = 3 in
    2021-22, 506 in 2025-26, 541 in 2026-27). uu_team_id is the stable club key.'
  season: Season END year of the team's competition.
  team: 'Team display name including the sponsor; varies with language and playoff
    suffixes: never join on it.'
  team_short_name: Three-letter club code (ANT, MON, ...), stable across seasons in
    the samples.
  uu_team_id: 'Stable club key across seasons (key space: sportpress clubs-as-teams);
    competition_team_id changes every season, this does not.'
sportpress_game_box:
  assist: Assists (passes leading directly to a made basket).
  birth_date: Date of birth as shown on the public player page; null when unknown.
  block: Shots blocked by the player.
  block_against: Own shots blocked by an opponent.
  competition_id: Competition id the box score was asked for; checked against the
    game.
  competition_team_id: 'Competition-team id (key space: sportpress competition teams):
    a team in ONE competition, so a club has a new id every season (Antwerp = 3 in
    2021-22, 506 in 2025-26, 541 in 2026-27). uu_team_id is the stable club key.'
  defensive_foul: 'Fouls DRAWN (suffered), despite the name: equals the opponent''s
    foul count up to scorer corrections.'
  defensive_rebound: Defensive rebounds.
  dunk_all: Dunks attempted.
  dunk_made: Dunks made (a subset of the two-point field goals).
  dunk_percent: Dunk percentage 0-100; 0 when none were attempted.
  first_name: Given name of the player as entered in the CMS.
  foul: Personal fouls committed.
  free_throw_all: Free throws attempted.
  free_throw_made: Free throws made.
  free_throw_percent: Free-throw percentage 0-100.
  game_id: Game id the box score was asked for (the body does not echo it).
  jersey: Shirt number as text; the box score sends it as an integer, so a zero-padded
    '00' is already lost there.
  last_name: Family name of the player as entered in the CMS.
  minute: Minutes played; for a team total, the sum over its players (200 + 25 per
    overtime).
  nationality_code: 'Nationality code in FIBA style (USA, BEL, NED): DIRTY, with lower-case
    variants, ''/''-joined pairs (USA/BEL), the empty string and ''HOL''; normalise
    before joining.'
  offensive_rebound: Offensive rebounds.
  player_id: 'Player id (key space: sportpress persons): stable across seasons and
    teams, distinct from roster_id. Not a Genius or FIBA person id.'
  plusminus: 'Plus/minus: the score margin while the player (or team) was on court;
    for a team total it is the game margin.'
  points: Points scored (2 x two-pointers + 3 x three-pointers + free throws).
  position: 'Playing position: point_guard, shooting_guard, small_forward, power_forward
    or center.'
  position_id: 'Playing position id (key space: sportpress positions); null on 21
    of 14,142 sampled lines.'
  roster_id: Roster id of the line; null when the line has no player (15 of 14,142
    sampled lines).
  starter: True when the player was in the starting five.
  steal: Steals (balls taken from an opponent).
  team: 'Team display name including the sponsor; varies with language and playoff
    suffixes: never join on it.'
  team_short_name: Three-letter club code (ANT, MON, ...), stable across seasons in
    the samples.
  team_side: 'Side of the game the row belongs to: home or away (the provider''s is_home,
    or side 1 / 2).'
  three_point_all: Three-point field goals attempted.
  three_point_made: Three-point field goals made.
  three_point_percent: Three-point percentage 0-100.
  throw_all: All field goals attempted, two- plus three-pointers (the provider calls
    them 'throw').
  throw_made: All field goals made, two- plus three-pointers (the provider calls them
    'throw').
  throw_percent: Field-goal percentage 0-100.
  total_rebound: Total rebounds (offensive plus defensive).
  turnover: Turnovers committed.
  two_point_all: Two-point field goals attempted.
  two_point_made: Two-point field goals made.
  two_point_percent: Two-point percentage 0-100.
  value: 'Efficiency rating (PIR with fouls drawn): points + rebounds + assists +
    steals + blocks + fouls drawn - missed field goals - missed free throws - turnovers.'
sportpress_game_film:
  away_score: Running away score AFTER the event; the maximum is the final score.
  birth_date: Date of birth as shown on the public player page; null when unknown.
  competition_id: Competition id the film was asked for; checked against the game.
  competition_team_id: 'Competition-team id (key space: sportpress competition teams):
    a team in ONE competition, so a club has a new id every season (Antwerp = 3 in
    2021-22, 506 in 2025-26, 541 in 2026-27). uu_team_id is the stable club key.'
  event_code: 'Provider event code: 1000 made shot, 1001 missed shot, 1002 defensive
    rebound, 1003 offensive rebound, 1004 steal, 1005 turnover, 1006 foul drawn, 1007
    foul committed, 1008 assist, 1009 block, 1011 substitution, 1101 period marker;
    2xxx team events (meaning unverified).'
  event_subcode: 'Provider sub-type of the event: for shots 1, 2 and 5 = two-pointer,
    3 = three-pointer, 4 = free throw; turnover and foul sub-types are unnamed by
    the provider.'
  first_name: Given name of the player as entered in the CMS.
  game_id: Game id the film was asked for (the body does not echo it).
  home_score: Running home score AFTER the event; the maximum is the final score.
  last_name: Family name of the player as entered in the CMS.
  minute: Whole minutes ELAPSED in the period (not clock remaining).
  nationality_code: 'Nationality code in FIBA style (USA, BEL, NED): DIRTY, with lower-case
    variants, ''/''-joined pairs (USA/BEL), the empty string and ''HOL''; normalise
    before joining.'
  order: Event sequence number in the game, strictly increasing from 0.
  period: 'Period of the event: 1-4 quarters, 5 and up overtimes.'
  player2_first_name: Given name of the second player; substitutions only.
  player2_id: Player id of the second player; filled on substitutions only.
  player2_last_name: Family name of the second player; substitutions only.
  player_id: Player id of the actor; null on team events and period markers.
  second: Seconds elapsed within that minute.
  team: 'Team display name including the sponsor; varies with language and playoff
    suffixes: never join on it.'
  team_short_name: Three-letter club code (ANT, MON, ...), stable across seasons in
    the samples.
  team_side: 'Side of the game the row belongs to: home or away (the provider''s is_home,
    or side 1 / 2).'
  x: Court x position of the event in the provider's integer court coordinates (0
    on events with none); the coordinate system and orientation are unverified.
  y: Court y position of the event in the provider's integer court coordinates (0
    on events with none); the coordinate system and orientation are unverified.
sportpress_game_find:
  arena: Name of the arena where the game is played.
  away_competition_team_id: 'Away side. Competition-team id (key space: sportpress
    competition teams): a team in ONE competition, so the same club has a new id every
    season (Antwerp = 3 in 2021-22, 506 in 2025-26, 541 in 2026-27). Joins competitors,
    rosters, box scores, film and standings. The stable club key across seasons is
    `uu_team_id`.'
  away_score: Away side. Final points of the side, including overtime.
  away_team: 'Away side. Display name incl. the sponsor. Teams of the playoff phases
    carry a '' playoff'' suffix (2025-26), and standings names vary with X-Localization
    (''Partena Professional Okapi Aalst Playoff'' (en) vs ''Okapi Aalst Playoff''
    (nl, fr)): never join on it.'
  away_team_short_name: Away side. Three-letter club code (CHA, OOS, ANT, MON, LIM,
    ...), stable across seasons in the samples.
  competition_id: 'Competition id (key space: sportpress competitions): ONE season
    of the league (24 = 2025-26, 25 = 2026-27). Not the season number. The key of
    the standings, ranking, slider and box routes.'
  game_id: 'Game id (key space: sportpress games), unique across seasons: the key
    of every game route.'
  game_time: Tip-off as a naive datetime. The source carries no offset; the league's
    local time is assumed and unverified.
  home_competition_team_id: 'Home side. Competition-team id (key space: sportpress
    competition teams): a team in ONE competition, so the same club has a new id every
    season (Antwerp = 3 in 2021-22, 506 in 2025-26, 541 in 2026-27). Joins competitors,
    rosters, box scores, film and standings. The stable club key across seasons is
    `uu_team_id`.'
  home_score: Home side. Final points of the side, including overtime.
  home_team: 'Home side. Display name incl. the sponsor. Teams of the playoff phases
    carry a '' playoff'' suffix (2025-26), and standings names vary with X-Localization
    (''Partena Professional Okapi Aalst Playoff'' (en) vs ''Okapi Aalst Playoff''
    (nl, fr)): never join on it.'
  home_team_short_name: Home side. Three-letter club code (CHA, OOS, ANT, MON, LIM,
    ...), stable across seasons in the samples.
  last_game_id: Latest finished meeting of the same two teams in the competition,
    which can be LATER than this game; null when none.
  next_game_id: Next meeting of the same two teams; null in every sample.
  period_name: Name of the period the game is in or ended in; 'Extra2' means the second
    overtime.
  phase_id: 'Phase id (key space: sportpress phases), a stage of one competition such
    as the regular season or the playoffs; new every season.'
  phase_name: Phase name as entered in the CMS ('Regular season 2026-27').
  round_name: Round label as entered in the CMS; often empty.
  round_priority: Sort order of the round within the phase (provider's priority);
    meaning of the values is unverified.
  season: Season END year (2026 = 2025-26), the sdv convention and the API's own season
    key.
  status: 'Game status: finished, or ready for an upcoming game.'
