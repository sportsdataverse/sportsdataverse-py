aba_calendar:
  away_abbr: Away club's three-letter code.
  away_score: Away final score; null like home_score for a game not played yet (live
    2026-27 page, not banked).
  away_team: Away club name; null like home_team while a pairing is not set (live
    2026-27 page, not banked).
  date: Game date, from the date-and-time line (the first date of a window); null
    for 'TBA'.
  date_to: Last date of a 'dd.mm.yyyy - dd.mm.yyyy' window printed before a game is
    scheduled; null on a game with a single date.
  game_no: 'Game number, per season AND league: it restarts at 1 for every season
    and league, so a game''s key is (game_no, season, league_id). Unplayed playoff
    games leave gaps. The {gameNo} of the match route.'
  group: Group letter ('A', 'B') from the Group column, which exists only in seasons
    with groups; null after the groups (Top8, Play-out, playoffs) and where the page
    has no Group column.
  home_abbr: Home club's three-letter code ('PAR', 'CZV'), from the mobile copy of
    the cell.
  home_score: 'Home final score. Null for a game not played yet (empty Result cell):
    seen on the live 2026-27 page (282 of 302 games), which is NOT banked.'
  home_team: 'Home club name as the site prints it now (see the match page''s game.home_team).
    Null while a playoff pairing is not set ('' : ''): seen on the live 2026-27 page
    (122 of 302 games), which is NOT banked, so no committed sample shows it.'
  league: 'League label: aba (ABA League, lea 1) or aba2 (ABA League 2, lea 2), the
    wrapper''s league argument.'
  league_id: 'League code, the site''s lea: 1 = ABA League, 2 = ABA League 2.'
  local_place: City of local_time ('Dubai', 'Cluj-Napoca'); null when the arena is
    in Central Europe.
  local_time: Arena-local tip-off 'hh:mm' when the arena is outside Central Europe
    ('(19:00 Dubai local time)'); null otherwise.
  round: Round or phase label, the accordion panel title ('ROUND 1', 'Top8 - R1',
    'Quarter-finals, Round 1', 'Finals, Round 4').
  season: 'Season END year (2026 = 2025-26): the site''s START-year key sez (25) plus
    2001.'
  season_label: Season label as the page prints it ('2025/26' on the match page, 'Season
    2025/26' on the calendar and standings pages).
  time: Tip-off 'hh:mm' in time_zone. Null when only a date window or 'TBA' is printed
    (live 2026-27 page, NOT banked).
  time_zone: '''CET'' = Central European wall-clock time INCLUDING summer time (CET
    in winter, CEST in summer; the label never changes); ''local'' = arena local time
    (''Local time'', ABA League 2). Null with a date window or ''TBA'' (live 2026-27
    page, NOT banked).'
  when: 'Date and Time cell verbatim: ''Monday, 06.10.2025 18:00 CET'', with ''(19:00
    Dubai local time)'' for arenas outside Central Europe, ''Local time'' on ABA League
    2, a date window or ''TBA'' before scheduling.'
aba_game:
  attendance: 'Spectators (the users icon). The parser sets null when the page prints
    none (never seen: every banked page prints it; null is part of the record contract).'
  away_city: Away club city (local spelling).
  away_score: Away final score.
  away_team: Away club name as the site prints it now (see home_team).
  away_team_id: 'ABA team id (key space: aba-liga.com clubs, the same id in every
    season and in both leagues, e.g. Partizan = 22 in 2008-09 and 2025-26, Krka =
    10). The first number of /team/{id}/{sez}/{lea}/0/{slug}/ and of the logo images/club/{size}/{id}.png.
    Joins match game.*_team_id / players / teams / pbp, standings rows and the player
    page. Not a player id.'
  commissioner: Game commissioner's name ('Commissioner:' line); 2008-09 adds an IOC-style
    country code in parentheses ('(SRB)'). Null when not printed.
  competition: 'Competition name as printed, sponsor included and applied to every
    season: ''AdmiralBet ABA League'' (2017-18 and 2025-26), ''Regional League'' (2008-09),
    ''2. ABA liga'' (ABA League 2).'
  date: Game date, from the date-and-time line (the first date of a window); null
    for 'TBA'.
  date_to: Last date of a 'dd.mm.yyyy - dd.mm.yyyy' window printed before a game is
    scheduled; null on a game with a single date.
  game_no: 'Game number, per season AND league: it restarts at 1 for every season
    and league, so a game''s key is (game_no, season, league_id). Unplayed playoff
    games leave gaps. The {gameNo} of the match route.'
  group: Group letter of a two-group regular season ('A', 'B'). ABSENT when the season
    has no groups (2008-09, 2017-18 and ABA League 2 samples).
  home_city: 'Home club city (local spelling: ''Beograd'', ''Novo Mesto'').'
  home_score: Home final score.
  home_team: 'Home club name as the site prints it NOW: a club''s current name is
    applied to every season (2008-09 shows ''Partizan Mozzart Bet''); a club that
    no longer plays keeps its last name (2008-09 ''Petrol Olimpija''). Join on the
    team id.'
  home_team_id: 'ABA team id (key space: aba-liga.com clubs, the same id in every
    season and in both leagues, e.g. Partizan = 22 in 2008-09 and 2025-26, Krka =
    10). The first number of /team/{id}/{sez}/{lea}/0/{slug}/ and of the logo images/club/{size}/{id}.png.
    Joins match game.*_team_id / players / teams / pbp, standings rows and the player
    page. Not a player id.'
  league: 'League label: aba (ABA League, lea 1) or aba2 (ABA League 2, lea 2), the
    wrapper''s league argument.'
  league_id: 'League code, the site''s lea: 1 = ABA League, 2 = ABA League 2.'
  local_place: City of local_time ('Dubai', 'Cluj-Napoca'); null when the arena is
    in Central Europe.
  local_time: Arena-local tip-off 'hh:mm' when the arena is outside Central Europe
    ('(19:00 Dubai local time)'); null otherwise.
  referees: Referees' names in page order (crew chief first), joined with '; ' (2008-09
    adds an IOC-style country code in parentheses). Names only.
  round: 'Round / phase label as the page prints it: ''ROUND 1'', ''Top8 - R2'', ''Quarter-finals,
    Round 1'', ''Finals, Round 4'', ''Semifinal''. Same vocabulary as calendar games[].round.'
  season: 'Season END year (2026 = 2025-26): the site''s START-year key sez (25) plus
    2001.'
  season_label: Season label as the page prints it ('2025/26' on the match page, 'Season
    2025/26' on the calendar and standings pages).
  time: Tip-off time 'hh:mm' in time_zone.
  time_zone: '''CET'' = Central European wall-clock time INCLUDING summer time (the
    label never changes; the Dubai local times prove CEST in October/June, CET in
    winter); ''local'' = the arena''s local time (ABA League 2 prints ''Local time'').'
  venue: 'Arena name (''Venue: ...''). ABSENT on the 2008-09 sample (the page has
    no venue line).'
  when: Date-and-time line verbatim (English weekday, dd.mm.yyyy, hh:mm, time-zone
    label).
aba_pbp:
  action: text without its parenthesised qualifier; see the action table below the
    route. Null on team rows (they print only '(qualifier)') and bare-clock rows.
  away_score: Away score after this event, as home_score.
  clock: Clock in the period, 'mm:ss' REMAINING (counts down from 10:00; overtime
    from 05:00). Null on the starting-lineup rows and on game / period start and end
    markers.
  game_no: 'Game number, per season AND league: it restarts at 1 for every season
    and league, so a game''s key is (game_no, season, league_id). Unplayed playoff
    games leave gaps. The {gameNo} of the match route.'
  home_score: 'Home score after this event: only set on scoring events (the page prints
    the score only there); null otherwise. Carry it forward for a running score.'
  jersey: Jersey number as printed; the play-by-play omits it on some rows (all starting-lineup
    rows and many home rows), so it is null there.
  league: 'League label: aba (ABA League, lea 1) or aba2 (ABA League 2, lea 2), the
    wrapper''s league argument.'
  league_id: 'League code, the site''s lea: 1 = ABA League, 2 = ABA League 2.'
  period: '1-4 = quarters, 5 = overtime (the #q5 tab; every overtime of the game).'
  player_id: 'ABA player id (global: one person keeps one id across seasons and both
    leagues, e.g. Carlik Jones = 4807), cast to an integer. Join on it, never on the
    printed name.'
  player_name: 'Name as the play-by-play prints it: ''SURNAME I'' upper case (the
    trailing ''.'' belongs to the event text on the page and is dropped).'
  qualifier: The parenthesised part of text (shot type, rebound side, free-throw 'n
    of m', foul or turnover type); see the qualifier table. Null when the text has
    none.
  season: 'Season END year (2026 = 2025-26): the site''s START-year key sez (25) plus
    2001.'
  seconds_left: The clock as whole seconds REMAINING in the period (08:34 = 514),
    derived by the parser; null where the clock is.
  seq: 1-based position in game order across the whole game (after the reversal).
  side: 'Which column the event sits in: ''home'', ''away'', or null for game/period
    markers and bare-clock rows. A timeout row gets the side of its team badge.'
  team_id: 'ABA club id (global: the same id in every season and in both leagues,
    e.g. Partizan = 22 in 2008-09 and 2025-26). Joins every frame that carries it;
    the calendar has club names only.'
  text: 'Event text in English after the player''s name: ''<action> (<qualifier>)'',
    ''in starting lineup'', or the whole text of a team / game row (''(defensive)'',
    ''Timeout'', ''start of 1. quarter''). Null on bare-clock rows (''10:00'' with
    nothing else, opening some periods).'
aba_periods:
  away_points: Away points scored IN the period (not cumulative).
  game_no: 'Game number, per season AND league: it restarts at 1 for every season
    and league, so a game''s key is (game_no, season, league_id). Unplayed playoff
    games leave gaps. The {gameNo} of the match route.'
  home_points: Home points scored IN the period (not cumulative).
  league: 'League label: aba (ABA League, lea 1) or aba2 (ABA League 2, lea 2), the
