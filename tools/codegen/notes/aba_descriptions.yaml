  league_id: 'League code, the site''s lea: 1 = ABA League, 2 = ABA League 2.'
  name: Full name from the h1, 'First Last' (checked against the expected name).
  nationality: Sporting nationality, a three-letter code as printed ('SSD' = South
    Sudan; IOC/FIBA-style codes).
  player_id: 'ABA player id (global: one person keeps one id across seasons and both
    leagues, e.g. Carlik Jones = 4807), cast to an integer. Join on it, never on the
