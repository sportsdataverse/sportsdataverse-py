aba_box_players:
  assists: Assists made (the Ass column).
  blocks: Shots blocked by this player or team (Blck Fv, 'in favour'). Null on did-not-play
    rows (played = false).
  blocks_against: Own shots blocked by an opponent (Blck Ag, 'against'). Null on did-not-play
    rows (played = false).
  fg2_att: 2-point field goals attempted (FG2 A). Null on did-not-play rows (played
    = false).
  fg2_made: 2-point field goals made (FG2 M). Null on did-not-play rows (played =
    false).
  fg2_pct: 2-point percentage, 0-100 with one decimal; 0 when no attempt. Null on
    did-not-play rows (played = false).
  fg3_att: 3-point field goals attempted (FG3 A). Null on did-not-play rows (played
    = false).
  fg3_made: 3-point field goals made (FG3 M). Null on did-not-play rows (played =
    false).
  fg3_pct: 3-point percentage, 0-100 with one decimal; 0 when no attempt. Null on
    did-not-play rows (played = false).
  fg_pct: Field-goal percentage over 2- and 3-point attempts, 0-100 with one decimal
    (FG2 + FG3 made / attempted); 0 when no attempt. Header 'overall %'. Null on did-not-play
    rows (played = false).
  fouls: Fouls committed (Foul Cm). Null on did-not-play rows (played = false).
  fouls_drawn: Fouls drawn / received (Foul Rv). Null on did-not-play rows (played
    = false).
  ft_att: Free throws attempted (FT A). Null on did-not-play rows (played = false).
  ft_made: Free throws made (FT M). Null on did-not-play rows (played = false).
  ft_pct: Free-throw percentage, 0-100 with one decimal; 0 when no attempt. Null on
    did-not-play rows (played = false).
  game_no: 'Game number, per season AND league: it restarts at 1 for every season
    and league, so a game''s key is (game_no, season, league_id). Unplayed playoff
    games leave gaps. The {gameNo} of the match route.'
  jersey: Jersey number worn in the game (the box lists players by jersey number).
  league: 'League label: aba (ABA League, lea 1) or aba2 (ABA League 2, lea 2), the
    wrapper''s league argument.'
  league_id: 'League code, the site''s lea: 1 = ABA League, 2 = ABA League 2.'
  minutes: Minutes played, 'mm:ss' text. '00:00' on did-not-play rows.
  on_court_at_end: 'On court at the final buzzer: the box prints the name in bold
    (matches the substitutions in the play-by-play on every sample). Null for the
    whole game when no name is bold (box-only seasons).'
  played: False on a did-not-play row (minutes '00:00' and one empty cell across the
    stat columns); its stat columns are null.
  player_id: 'ABA player id (global: one person keeps one id across seasons and both
    leagues, e.g. Carlik Jones = 4807), cast to an integer. Join on it, never on the
    printed name.'
  player_name: 'Name as the box prints it: ''Surname I.'' (diacritics kept).'
  plus_minus: Plus/minus while on court (+/-). 0 on every row of the 2008-09 sample
    (not tracked then). Null on did-not-play rows (played = false).
  points: Points scored (overall Pts). Null on did-not-play rows (played = false).
  pts_fast_break: Fast-break points (Points from FstBr). Null where the season has
    no such column (2008-09) and on did-not-play rows.
  pts_paint: Points in the paint (Points from Paint). Null where the season has no
    such column (2008-09) and on did-not-play rows.
  pts_second_chance: Second-chance points (Points from 2ndCh). Null where the season
    has no such column (2008-09) and on did-not-play rows.
  reb_def: Defensive rebounds (Rebs D). Null on did-not-play rows (played = false).
  reb_off: Offensive rebounds (Rebs O). Null on did-not-play rows (played = false).
  reb_tot: Total rebounds (Rebs T). Null on did-not-play rows (played = false).
  season: 'Season END year (2026 = 2025-26): the site''s START-year key sez (25) plus
    2001.'
  side: '''home'' or ''away'' (the home team is listed first everywhere on the site).'
  starter: 'In the starting five: the box marks it with ''*'' (matches the play-by-play
    ''in starting lineup'' rows on every sample). Null for the whole game when no
    row carries a ''*'' (box-only seasons, 2008-09 sample).'
  steals: Steals made (the St column).
  team_id: 'ABA club id (global: the same id in every season and in both leagues,
    e.g. Partizan = 22 in 2008-09 and 2025-26). Joins every frame that carries it;
    the calendar has club names only.'
  turnovers: Turnovers (To). Null on did-not-play rows (played = false).
  valuation: 'Valuation (Val, ''rank Value''): the efficiency rating (PIR-style index)
    the site ranks players by. Null on did-not-play rows (played = false).'
