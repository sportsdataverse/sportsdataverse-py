  season: 'Season END year (2026 = 2025-26): the site''s START-year key sez (25) plus
    2001.'
  side: 'Which team took the shot: home or away (the site''s ekipa, a string ''1''
    / ''2'').'
  x: Shot x as a PERCENTAGE (0-100) of the court LENGTH from the LEFT baseline of
    the site's 1000x535 px full-court image. Home shoots at x < 50 and away at x >
    50. The site sends it as a string in one half of a game and a number in the other;
    cast to float.
  y: Shot y as a PERCENTAGE (0-100) of the court WIDTH, drawn upward from the bottom
    edge (the line through both baskets is 50). Whether 'up' is the scorer's table
    side is unverified.
aba_standings:
  games: Games played (GP).
  group: Group heading under the phase ('Group A', 'Group B'); null when the table
    has no group heading.
  league: 'League label: aba (ABA League, lea 1) or aba2 (ABA League 2, lea 2), the
    wrapper''s league argument.'
  league_id: 'League code, the site''s lea: 1 = ABA League, 2 = ABA League 2.'
  losses: Games lost in this table (the L column).
  point_diff: Point difference (Diff), points_for - points_against.
  points_against: Points allowed (right side of 'Overall').
  points_for: Points scored (left side of 'Overall' 'for:against').
  rank: Position in this table (#).
  season: 'Season END year (2026 = 2025-26): the site''s START-year key sez (25) plus
    2001.'
  season_label: Season label as the page prints it ('2025/26' on the match page, 'Season
    2025/26' on the calendar and standings pages).
  standing_points: 'Standings points (Points): 2 per win and 1 per loss (FIBA), e.g.
    21-3 = 45.'
  table: 'Title of the table''s phase heading (h2): ''Top 8 Season 2025/26'', ''Play-out
    Season 2025/26'', ''Regular Season 2025/26''.'
  team_id: 'ABA club id (global: the same id in every season and in both leagues,
    e.g. Partizan = 22 in 2008-09 and 2025-26). Joins every frame that carries it;
    the calendar has club names only.'
  team_name: Club name as the site prints it now (see the match page's game.home_team).
  wins: Games won in this table (the W column).
