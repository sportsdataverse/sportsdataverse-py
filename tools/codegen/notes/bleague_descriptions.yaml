  fg2_attempted: Two-point field goals attempted.
  fg2_made: Two-point field goals made.
  fg2_pct: Two-point percentage 0-100.
  fg3_attempted: Three-point field goals attempted.
  fg3_made: Three-point field goals made.
  fg3_pct: Three-point percentage 0-100.
  fg_attempted: Field goals attempted (PTA).
  fg_made: Field goals made (PTM).
  fg_pct: Field-goal percentage 0-100, one decimal.
  fouls: Fouls committed.
  fouls_drawn: Fouls drawn (被ファウル).
  ft_attempted: Free throws attempted.
  ft_made: Free throws made.
  ft_pct: Free-throw percentage 0-100.
  lead_changes: Lead changes in the period category (LeadCount); the same on both
    side rows.
  lead_last: Lead statistic (LeadLast), integer; meaning unverified (7 for the home
    side on all checked games).
  lead_last_away: Away score-like value tied to lead_last; meaning unverified.
  lead_last_home: Home score-like value tied to lead_last; meaning unverified. A string
    on v2 quarter / game rows.
  max_lead: Largest lead of the team in the period category (0 if it never led).
  paint_points: Points in the paint (inside-the-paint 2PT points; 2x the players'
    PT2IN count on v2).
  period_category: 'Period category: 1-4 = quarters 1-4, 15 = first half, 16 = second
    half, 18 = whole game. Overtime codes are unverified.'
  points_off_turnover: Points off turnovers (ポインツオフターンオーバー).
  reb: Total rebounds.
  reb_def: Defensive rebounds.
  reb_off: Offensive rebounds.
  schedule_key: 'B.LEAGUE ScheduleKey (key space: B.LEAGUE games, ONE global integer
    sequence across B1, B2, B3 and every season). The {schedule_key} every game wrapper
    takes and the schedule page''s list-item id.'
  season: Season END year (2026 = 2025-26), the feed's Year (the START year) plus
    one.
  second_chance_points: Second-chance points (セカンドチャンス).
  steals: Steals made by the team in the period category.
  team_id: 'B.LEAGUE TeamID as text (key space: B.LEAGUE clubs, stable across seasons
    AND club renames: 703 = Tochigi Brex in 2016-17 = Utsunomiya Brex in 2025-26).
    The feed sends a string on v2 and an integer on v1; both are text here. Not a
    player id.'
  team_name_e: Team name in English, uppercase.
  team_name_j: Team name in Japanese.
  team_side: 'Side of the game the row belongs to: home or away.'
  ties: Times the score was tied in the period category (TieCount); the same on both
    side rows.
  turnovers: Turnovers committed by the team in the period category.
