bleague_game_info:
  attendance: Announced attendance.
  away_losing_count: Away team losing streak (v1 header only); null in every observed
    body.
  away_score: Away team final score.
  away_score_p1: Away team points scored IN period 1 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  away_score_p10: Away team points scored IN period 10 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  away_score_p11: Away team points scored IN period 11 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  away_score_p12: Away team points scored IN period 12 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  away_score_p13: Away team points scored IN period 13 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  away_score_p14: Away team points scored IN period 14 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  away_score_p2: Away team points scored IN period 2 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  away_score_p3: Away team points scored IN period 3 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  away_score_p4: Away team points scored IN period 4 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  away_score_p5: Away team points scored IN period 5 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  away_score_p6: Away team points scored IN period 6 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  away_score_p7: Away team points scored IN period 7 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  away_score_p8: Away team points scored IN period 8 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  away_score_p9: Away team points scored IN period 9 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  away_team_id: 'Away team id. B.LEAGUE TeamID as text (key space: B.LEAGUE clubs,
    stable across seasons AND club renames: 703 = Tochigi Brex in 2016-17 = Utsunomiya
    Brex in 2025-26). The feed sends a string on v2 and an integer on v1; both are
    text here. Not a player id.'
  away_team_name_e: Away team name in English, uppercase.
  away_team_name_j: Away team name in Japanese (official name).
  away_team_short_name_e: Away team short name in English (e.g. A TOKYO).
  away_team_short_name_j: Away team short name in Japanese (e.g. A東京).
  away_team_sub_name_e: Away team sub name in English (v1 header only); usually empty.
  away_team_sub_name_j: Away team sub name in Japanese (v1 header only); usually empty.
  away_winning_count: Away team winning streak (v1 header only); null in every observed
    body.
  box_exists: True when the box score exists.
  code: 'Feed/organisation code repeated on every row: 546 on v2, 6 on v1; meaning
    unverified.'
  commissioner_id: Commissioner (コミッショナー) id as text; null when none is assigned.
  commissioner_name_e: Commissioner name in English (v1 header only).
  commissioner_name_j: Commissioner name in Japanese (names only; no contact data
    is published).
  convention_class: Competition class code (1 on every sample); meaning unverified.
  convention_key: 'ConventionKey as text (key space: competition-seasons, 大会): v2
    ''514'' = B1 2025-26, v1 102 = B3 2025-26. Key on (feed, convention_key); the
    feeds may number independently.'
  convention_name_e: Competition name in English; empty (null) on early v1 bodies.
  convention_name_j: Competition name in Japanese (e.g. りそなグループ B.LEAGUE 2025-26 B1リーグ戦
    = B1 regular season).
  convention_title_e: Competition title in English (v1 header only).
  convention_title_j: Competition title in Japanese (v1 header only).
  court: Court number at the venue (v1 header only).
  current_period: Period the context was last written in (the last period for a final
    game).
  event: 'Competition type (v1 header only): 2 B1 league, 3 B1 Championship, 4 B1
    relegation playoffs, 5 all-star, 7 B2 league, 8 B2 playoffs, 11 B1-B2 promotion/relegation,
    15 B3 league, 32 B3 playoffs; null on v2.'
  feed: 'Source feed of the row: v2 (v2_genius_contexts, B1/B2 from 2020-21) or v1
    (v1_contexts: B3, B1/B2 2018-2020, and the 2016-17 / 2017-18 game-page embed).
    The feeds differ in id types, dates and some codes.'
  game_datetime: Scheduled tip-off as a UTC instant (the feed's JST wall clock minus
    nine hours).
  game_end_time: Actual end as a UTC instant (v1 header only).
  game_ended: True when the game has ended; the runtime serves only games where this
    and record_fixed are true.
  game_no: Game number within the competition (v1 header only); null on v2.
  game_start_time: Actual start as a UTC instant (v1 header only; epoch seconds on
    the 2016-17 embed).
  home_losing_count: Home team losing streak (v1 header only); null in every observed
    body.
  home_score: Home team final score.
  home_score_p1: Home team points scored IN period 1 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  home_score_p10: Home team points scored IN period 10 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  home_score_p11: Home team points scored IN period 11 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  home_score_p12: Home team points scored IN period 12 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  home_score_p13: Home team points scored IN period 13 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  home_score_p14: Home team points scored IN period 14 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  home_score_p2: Home team points scored IN period 2 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  home_score_p3: Home team points scored IN period 3 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  home_score_p4: Home team points scored IN period 4 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  home_score_p5: Home team points scored IN period 5 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  home_score_p6: Home team points scored IN period 6 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  home_score_p7: Home team points scored IN period 7 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  home_score_p8: Home team points scored IN period 8 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  home_score_p9: Home team points scored IN period 9 (not cumulative). v2 headers
    carry four slots, v1 fourteen; an unplayed period is 0 on v1 and null on v2.
  home_team_id: 'Home team id. B.LEAGUE TeamID as text (key space: B.LEAGUE clubs,
    stable across seasons AND club renames: 703 = Tochigi Brex in 2016-17 = Utsunomiya
    Brex in 2025-26). The feed sends a string on v2 and an integer on v1; both are
    text here. Not a player id.'
  home_team_name_e: Home team name in English, uppercase.
  home_team_name_j: Home team name in Japanese (official name).
  home_team_short_name_e: Home team short name in English (e.g. A TOKYO).
  home_team_short_name_j: Home team short name in Japanese (e.g. A東京).
  home_team_sub_name_e: Home team sub name in English (v1 header only); usually empty.
  home_team_sub_name_j: Home team sub name in Japanese (v1 header only); usually empty.
  home_win: True when the home team won (v1 header only); null on v2.
  home_winning_count: Home team winning streak (v1 header only); null in every observed
    body.
  humidity: Humidity; null in every observed body, so its dtype is an assumption.
  interleague: True for an inter-league game (v1 header only).
  max_period: Number of periods the game had (4 plus overtimes).
  pbp_exists: True when play-by-play exists.
  picture_exists: True when photos exist (v1 header only).
  record_fixed: True when the record is finalised (no more corrections expected).
  referee_id: 'Crew-chief referee RefereeID as text (key space: officials; stability
    unverified).'
  referee_name_e: Crew-chief referee name in English (v1 header only).
  referee_name_j: Crew-chief referee name in Japanese (名 only; no contact data is
    published).
  report: Game report text (v1 header only); usually empty (null).
  report_exists: True when a game report text exists (v1 header only).
  rest_time: Clock remaining when last written (v1 header only; 0 for a final game).
  round: Round (節, Setu) within the competition-season; playoffs use 100+ (101). Integer.
  schedule_class_name_e: Schedule class name in English (v1 header only); usually
    empty.
  schedule_class_name_j: Schedule class name in Japanese (v1 header only); usually
    empty.
  schedule_class_short_name_e: Schedule class short name in English (v1 header only);
    usually empty.
  schedule_class_short_name_j: Schedule class short name in Japanese (v1 header only);
    usually empty.
  schedule_conference: Conference code (v1 header only); meaning unverified.
  schedule_key: 'B.LEAGUE ScheduleKey (key space: B.LEAGUE games, ONE global integer
    sequence across B1, B2, B3 and every season). The {schedule_key} every game wrapper
    takes and the schedule page''s list-item id.'
  schedule_state: Schedule state code (v1 header only; 2 on the final-game sample);
    meaning unverified.
  season: Season END year (2026 = 2025-26), the feed's Year (the START year) plus
    one.
  stadium_cd: 'StadiumCD as text (key space: B.LEAGUE venues; stability unverified).'
  stadium_name_e: Venue name in English; often empty (null).
  stadium_name_j: Venue name in Japanese (e.g. TOYOTA ARENA TOKYO, AGF鈴鹿体育館 = AGF
    Suzuka Gymnasium).
  sub_referee_id1: Second referee RefereeID as text.
  sub_referee_id2: Third referee RefereeID as text.
  sub_referee_name_e1: Second referee name in English (v1 header only).
  sub_referee_name_e2: Third referee name in English (v1 header only).
  sub_referee_name_j1: Second referee name in Japanese.
  sub_referee_name_j2: Third referee name in Japanese.
  temperature: Temperature; null in every observed body, so its dtype is an assumption.
  weather: Weather text (v1 header only); null in every observed body.
  year: Season START year as the site stores it (2025 = 2025-26); season is the END
    year.
bleague_leaders:
  category: 'Leader category code, decoded by matching count to the box score: 1 points,
    2 assists, 3 steals, 4 blocks, 5 rebounds, 8 shots blocked.'
  category_name: English name of category (points, assists, steals, blocks, rebounds,
    blocks_received); null for an unknown code.
  count: The player's value in the category for the period category.
  feed: 'Source feed of the row: v2 (v2_genius_contexts, B1/B2 from 2020-21) or v1
    (v1_contexts: B3, B1/B2 2018-2020, and the 2016-17 / 2017-18 game-page embed).
    The feeds differ in id types, dates and some codes.'
  period_category: 'Period category: 1-4 = quarters 1-4, 15 = first half, 16 = second
    half, 18 = whole game. Overtime codes are unverified.'
  player_id: 'B.LEAGUE PlayerID as text (key space: B.LEAGUE persons, stable across
    seasons and clubs: Makoto Hiejima = ''8589''). A string on v2, an integer on v1;
    both are text here. Null where the row names no player.'
  player_name_j: Player name in Japanese (katakana for foreign players); null on team
    and game-level rows.
  player_no: Shirt number as text, so '00' and '0' stay distinct; null on team and
    game-level rows.
  rank: Rank within the team for the category (1 = best; ties share a rank).
  reb_def_count: Defensive-rebound count carried on the row (filled for the rebounds
    category).
  reb_off_count: Offensive-rebound count carried on the row (filled for the rebounds
    category).
  schedule_key: 'B.LEAGUE ScheduleKey (key space: B.LEAGUE games, ONE global integer
    sequence across B1, B2, B3 and every season). The {schedule_key} every game wrapper
    takes and the schedule page''s list-item id.'
  season: Season END year (2026 = 2025-26), the feed's Year (the START year) plus
    one.
  team_id: 'B.LEAGUE TeamID as text (key space: B.LEAGUE clubs, stable across seasons
    AND club renames: 703 = Tochigi Brex in 2016-17 = Utsunomiya Brex in 2025-26).
    The feed sends a string on v2 and an integer on v1; both are text here. Not a
    player id.'
  team_name_j: Team name in Japanese (official name, e.g. アルバルク東京 = Alvark Tokyo).
  team_side: 'Side of the game the row belongs to: home or away.'
  tie_order: Order within a tied rank (1 = first listed).
bleague_pbp:
  action: English slug for action_code (fg3_made, ft_missed, rebound_def, foul_personal,
    player_in, ...). The team-rebound codes 18 / 19 follow the feed column; null for
    a code no sample contains.
  action_code: 'ActionCD1, the primary action code: 1 / 2 3PT made / missed, 3 / 5
    2PT outside the paint made / missed, 4 / 6 inside the paint, 7 / 8 free throw,
    9 / 10 defensive / offensive rebound, 11 block, 12 assist, 13 turnover, 14 steal,
    15 foul drawn, 16 and-one, 17 team turnover, 18 / 19 team rebounds (SWAPPED between
    feeds), 22-25 fouls, 80-85 game and clock events, 86 / 87 player in / out, 88
    timeout, 89 substitution (v1).'
  area: English zone slug for area_code (restricted_area, paint, baseline_mid_range,
    wing_mid_range, top_of_key_mid_range, corner_3, wing_3, top_3, deep_3); mirrored
    codes share a slug.
  area_code: 'Shot-zone code 1-13 read from the site''s shot-chart SVG: 1 restricted
    area, 2 rest of the paint, 3 / 7 baseline mid-range, 4 / 6 wing mid-range, 5 top-of-the-key
    mid-range, 8 / 12 corner 3, 9 / 11 wing 3, 10 top 3, 13 deep band. Of each pair
    the first is the side far along the baseline. Also set on turnover and foul rows;
    2022-23 onward.'
  away_score: Away running score after the event, split from score.
  clock_seconds: Game clock remaining in the period in whole seconds (8:50 = 530),
    derived from rest_time.
  code: 'Feed/organisation code repeated on every row: 546 on v2, 6 on v1; meaning
    unverified.'
  edited_at: When the event was last edited, as a UTC instant; null when never edited.
  event_no: Event sequence number, ascending in game order. v2 counts in steps of
    1000 (inserted corrections may fall in between); v1 counts 1, 2, 3...
  feed: 'Source feed of the row: v2 (v2_genius_contexts, B1/B2 from 2020-21) or v1
    (v1_contexts: B3, B1/B2 2018-2020, and the 2016-17 / 2017-18 game-page embed).
    The feeds differ in id types, dates and some codes.'
  game_end: True on the game-end row on v1 and the embed; false on EVERY v2 row, the
    game-end row (81) included, so use action instead.
  home_score: Home running score after the event, split from score.
  period: 'Period number: 1-4 regulation; overtime numbering is unverified (no overtime
    sample).'
  period_end: True on the closing row of a period (ActionCD1 83).
  play_text: 'Play description in Japanese: ''#{shirt} {surname} {action} ({running
    count})''. ○ = made, × = missed, フリースロー = free throw, ブロック = block, ディフェンス / オフェンスリバウンド
    = defensive / offensive rebound, → = substitution out to in (v1).'
  player2_id: Second actor PlayerID as text; on a v1 substitution the player coming
    in. v1 / embed only.
  player2_name_j: Second actor's name in Japanese (v1 / embed only).
  player2_no: Shirt number of the second actor (v1 / embed only).
  player_id: 'Primary actor PlayerID as text (key space: B.LEAGUE persons). On a v1
    substitution it is the player going out. Null on team rows and game-level rows.'
  player_name_j: Player name in Japanese (katakana for foreign players); null on team
    and game-level rows.
  player_no: Shirt number as text, so '00' and '0' stay distinct; null on team and
    game-level rows.
  qualifier2: English slug for qualifier_code2 (jump_shot, layup, dunk, free_throws_awarded_N,
    fast_break, second_chance, shooting_foul, ...); null when unknown.
  qualifier3: English slug for qualifier_code3; null when unknown.
  qualifier_code2: ActionCD2, a secondary qualifier (shot type, free throws awarded
    on a fouls, scoring context, 24 s violation); one code space shared with qualifier_code3.
    Null when the row has none.
  qualifier_code3: ActionCD3, a tertiary qualifier (scoring context on made shots,
    shooting foul / foul-out on fouls); same code space as qualifier_code2.
  recorded_at: When the event was logged, as a UTC instant (v2 stores UTC text, v1
    a JST-offset .NET date, the embed epoch seconds).
  rest_time: Game clock REMAINING in the period as the feed's 'mm:ss' text (counts
    down from 10:00).
  schedule_key: 'B.LEAGUE ScheduleKey (key space: B.LEAGUE games, ONE global integer
    sequence across B1, B2, B3 and every season). The {schedule_key} every game wrapper
    takes and the schedule page''s list-item id.'
  score: Running score 'home-away' after the event (e.g. '2-4'); null on player-in
    rows and v1 substitutions.
  season: Season END year (2026 = 2025-26), the feed's Year (the START year) plus
    one.
  side: 'Basket the play is charted at: ''left'' (x near 0) or ''right'' (x near 100);
    flips at half-time. Present from 2025-26 only; earlier seasons leave it null and
    the end must be inferred from x.'
  success: 'Outcome flag: true = made / successful, false = missed; true on non-shot
    rows. v2 from 2022-23 only.'
  team_id: 'B.LEAGUE TeamID as text (key space: B.LEAGUE clubs, stable across seasons
    AND club renames: 703 = Tochigi Brex in 2016-17 = Utsunomiya Brex in 2025-26).
    The feed sends a string on v2 and an integer on v1; both are text here. Not a
    player id.'
  team_name_j: Acting team name in Japanese; null on game-level rows and official
    timeouts.
  team_side: Side of the acting team from HomeAway (1 home, 2 away); null on game-level
    rows and official timeouts.
  x: 'Event x: percent (0-100) of the court LENGTH from the ''left'' baseline (baskets
    near 5 and 95). Metres (x / 100 x 28) are an inference. 2022-23 onward on v2 only.'
  y: 'Event y: percent (0-100) of the court WIDTH (baskets at 50). Which sideline
    is y = 0 is unverified; metres (y / 100 x 15) are an inference. 2022-23 onward
    on v2 only.'
bleague_period_scores:
  feed: 'Source feed of the row: v2 (v2_genius_contexts, B1/B2 from 2020-21) or v1
    (v1_contexts: B3, B1/B2 2018-2020, and the 2016-17 / 2017-18 game-page embed).
    The feeds differ in id types, dates and some codes.'
  period: 'Period number: 1-4 regulation; overtime numbering is unverified (no overtime
    sample).'
  points: Points the team scored IN this period (not cumulative); from the header's
    score slots.
  schedule_key: 'B.LEAGUE ScheduleKey (key space: B.LEAGUE games, ONE global integer
    sequence across B1, B2, B3 and every season). The {schedule_key} every game wrapper
    takes and the schedule page''s list-item id.'
  season: Season END year (2026 = 2025-26), the feed's Year (the START year) plus
    one.
  team_id: 'B.LEAGUE TeamID as text (key space: B.LEAGUE clubs, stable across seasons
    AND club renames: 703 = Tochigi Brex in 2016-17 = Utsunomiya Brex in 2025-26).
    The feed sends a string on v2 and an integer on v1; both are text here. Not a
    player id.'
  team_side: 'Side of the game the row belongs to: home or away.'
bleague_player_box:
  assists: Assists credited to the player or team (AS).
  ast_to: Assist-to-turnover ratio (0 when no turnovers). v2 from 2022-23 only; null
    on half rows.
  blocks: Blocks made (BS).
  blocks_received: Shots of this player or team that were blocked (被ブロック, BSON).
  category: 'Row category: 1 = player, 2 = team / coaches row (team-credited stats;
    on v1 it names the head coach), 3 = team totals (合計). One row per (category, player,
    period category).'
  def_rtg: Defensive rating. v2 from 2022-23 only; on team and totals rows 0 in every
    sample, never filled.
  display_order: Display order of the row (v1 only), integer; null on v2.
  dunks: Dunks made (PT2DUNK); v1 box rows only, null on v2.
  efficiency: 'Efficiency rating (貢献度), era-dependent: v2 = points + rebounds + assists
    + steals + blocks + fouls drawn - missed FG - missed FT - turnovers - fouls -
    shots blocked (PIR); v1 omits fouls drawn, fouls and shots blocked.'
  efg: Effective field-goal percentage as a FRACTION 0-1 (3PT weighted 1.5x); the
    site multiplies by 100. v2 from 2022-23 only.
  feed: 'Source feed of the row: v2 (v2_genius_contexts, B1/B2 from 2020-21) or v1
    (v1_contexts: B3, B1/B2 2018-2020, and the 2016-17 / 2017-18 game-page embed).
    The feeds differ in id types, dates and some codes.'
  fg2_attempted: Two-point field goals attempted.
  fg2_made: Two-point field goals made.
  fg3_attempted: Three-point field goals attempted.
  fg3_made: Three-point field goals made (v2 placeholder '' on quarter team rows becomes
    null).
  fouls: Personal fouls committed (F).
  fouls_drawn: Fouls drawn (被ファウル, FD).
  ft_attempted: Free throws attempted.
  ft_made: Free throws made.
  net_rtg: Net rating. v2 from 2022-23 only; on team and totals rows 0 in every sample,
    never filled.
  off_rtg: Offensive rating. v2 from 2022-23 only; on team and totals rows 0 in every
    sample, never filled.
  on_court: True for the five players on court when the context was last written (for
    a final game, at the final buzzer); the same value on every period row of the
    player. Null on v2 team and totals rows.
  period_category: 'Period category: 1-4 = quarters 1-4, 15 = first half, 16 = second
    half, 18 = whole game. Overtime codes are unverified.'
  play_time: Minutes played as the feed's 'mm:ss'; 'DNP' = did not play. Totals rows
    hold 5 x the period length ('200:00' for the game).
  player_id: 'B.LEAGUE PlayerID as text (key space: B.LEAGUE persons, stable across
    seasons and clubs: Makoto Hiejima = ''8589''). A string on v2, an integer on v1;
    both are text here. Null where the row names no player.'
  player_name_e: Player name in English ('Makoto Hiejima'); null on team and totals
    rows.
  player_name_j: Player name in Japanese (katakana for foreign players); null on team
    and game-level rows.
  player_no: Shirt number as text, so '00' and '0' stay distinct; null on team and
    game-level rows.
  plus_minus: 'Plus/minus: team point difference while on court. v2 from 2022-23 only;
    null on totals and half rows.'
  points: Points scored. The v2 feed sends '' (a placeholder, not 0) on the team row
    of quarters; null here.
  poss: Possessions. v2 from 2022-23 only; on team and totals rows 0 in every sample,
    never filled.
  pt2in: 'Inside-the-paint figure: on v2 a COUNT of made inside-the-paint 2PT (the
    summary holds 2x that in points); on v1 points in the paint (0 on B3, whose 2PT
    shots are never split by paint).'
  pt2nd: Second-chance figure (セカンドチャンス); smaller than the summary's second-chance
    points, so likely made baskets; unverified.
  ptfb: Fast-break figure (ファストブレイク); equals the summary's fast-break points on the
    one game checked, but whether it counts points or baskets is unverified.
  ptpft: Points off turnovers (ポインツオフターンオーバー); v1 box rows only, null on v2.
  reb: Total rebounds.
  reb_def: Defensive rebounds (DR).
  reb_off: Offensive rebounds (OR).
  schedule_key: 'B.LEAGUE ScheduleKey (key space: B.LEAGUE games, ONE global integer
    sequence across B1, B2, B3 and every season). The {schedule_key} every game wrapper
    takes and the schedule page''s list-item id.'
  season: Season END year (2026 = 2025-26), the feed's Year (the START year) plus
    one.
  seconds_played: Time on court in seconds, parsed from play_time (50:00 = 3000);
    null for DNP and blank.
  starter: True when the player started; false for the bench; null on team and totals
    rows. (The feed sends 1 / null on v2 and a boolean on v1.)
  steals: Steals credited to the player or team (ST).
  team_id: 'B.LEAGUE TeamID as text (key space: B.LEAGUE clubs, stable across seasons
    AND club renames: 703 = Tochigi Brex in 2016-17 = Utsunomiya Brex in 2025-26).
    The feed sends a string on v2 and an integer on v1; both are text here. Not a
    player id.'
  team_name_e: Team name in English, uppercase ('ALVARK TOKYO').
  team_name_j: Team name in Japanese (official name, e.g. アルバルク東京 = Alvark Tokyo).
  team_side: 'Side of the game the row belongs to: home or away.'
  ts: True-shooting percentage as a FRACTION 0-1; the site multiplies by 100. v2 from
    2022-23 only.
  turnovers: Turnovers (TO).
  usg: Usage rate in PERCENT 0-100. v2 from 2022-23 only; absent on totals rows.
bleague_schedule:
  away_score: Away final score; null for a game without one.
  away_team: Away club short name in Japanese as the page prints it (三遠 = San-en).
  away_team_id: 'Away club TeamID as text, mapped from the page''s club filter. B.LEAGUE
    TeamID as text (key space: B.LEAGUE clubs, stable across seasons AND club renames:
    703 = Tochigi Brex in 2016-17 = Utsunomiya Brex in 2025-26). The feed sends a
    string on v2 and an integer on v1; both are text here. Not a player id.'
  date: Local game date, derived from the requested month and day (September to June;
    months 7-12 fall in the season's START year).
  event: 'Competition type of the page: 2 B1 league, 3 B1 Championship, 4 B1 relegation
    playoffs, 5 all-star, 7 B2 league, 8 B2 playoffs, 11 B1-B2 promotion/relegation,
    15 B3 league, 32 B3 playoffs.'
  home_score: Home final score; null for a game without one.
  home_team: Home club short name in Japanese as the page prints it (大阪 = Osaka).
  home_team_id: 'Home club TeamID as text, mapped from the page''s club filter. B.LEAGUE
    TeamID as text (key space: B.LEAGUE clubs, stable across seasons AND club renames:
    703 = Tochigi Brex in 2016-17 = Utsunomiya Brex in 2025-26). The feed sends a
    string on v2 and an integer on v1; both are text here. Not a player id.'
  prefecture: Prefecture of the venue in Japanese (大阪府 = Osaka Prefecture); null when
    the page gives none.
  round: Round number parsed from round_label; null when the label is not 第N節.
  round_label: Round label as printed, 第N節 (round N); playoffs print other labels.
  schedule_key: 'B.LEAGUE ScheduleKey (key space: B.LEAGUE games, ONE global integer
    sequence across B1, B2, B3 and every season). The {schedule_key} every game wrapper
    takes and the schedule page''s list-item id.'
  season: Season END year (2026 = 2025-26), the feed's Year (the START year) plus
    one.
  state: Score-state label on the page (FINAL for a finished game); null when absent.
  tab: 'Division tab: 1 = B1, 2 = B2, 3 = B3.'
  tip_time: Tip-off time 'HH:MM' in JST (no offset on the page); null when absent.
  venue: Venue name in Japanese, abbreviated by the page (おおきに = Osaka Edion Arena).
bleague_schedule_clubs:
  event: 'Competition type of the page: 2 B1 league, 3 B1 Championship, 4 B1 relegation
    playoffs, 5 all-star, 7 B2 league, 8 B2 playoffs, 11 B1-B2 promotion/relegation,
    15 B3 league, 32 B3 playoffs.'
  name: Club short name in Japanese as the schedule page prints it (北海道 = Hokkaido).
  season: Season END year (2026 = 2025-26), the feed's Year (the START year) plus
    one.
  tab: 'Division tab: 1 = B1, 2 = B2, 3 = B3.'
  team_id: 'B.LEAGUE TeamID as text (key space: B.LEAGUE clubs, stable across seasons
    AND club renames: 703 = Tochigi Brex in 2016-17 = Utsunomiya Brex in 2025-26).
    The feed sends a string on v2 and an integer on v1; both are text here. Not a
    player id.'
bleague_schedule_days:
  date: Local date of a game day in the requested month (a date strip entry).
  event: 'Competition type of the page: 2 B1 league, 3 B1 Championship, 4 B1 relegation
    playoffs, 5 all-star, 7 B2 league, 8 B2 playoffs, 11 B1-B2 promotion/relegation,
    15 B3 league, 32 B3 playoffs.'
  season: Season END year (2026 = 2025-26), the feed's Year (the START year) plus
    one.
  tab: 'Division tab: 1 = B1, 2 = B2, 3 = B3.'
bleague_schedule_events:
  event_id: Competition type code (see event); the page's event filter value.
  label: Competition label in Japanese (B1リーグ = B1 league, オールスターゲーム = all-star game,
    B1チャンピオンシップ = B1 Championship).
  season: Season END year (2026 = 2025-26), the feed's Year (the START year) plus
    one.
  selected: True for the competition the page was asked for.
  tab: 'Division tab: 1 = B1, 2 = B2, 3 = B3.'
bleague_score_track:
  away_points: Away running total after the event.
  event_index: Index of the scoring event, 0 = the 0-0 start row, then 1, 2... (the
    score track's x axis; NOT a clock).
  feed: 'Source feed of the row: v2 (v2_genius_contexts, B1/B2 from 2020-21) or v1
    (v1_contexts: B3, B1/B2 2018-2020, and the 2016-17 / 2017-18 game-page embed).
    The feeds differ in id types, dates and some codes.'
  home_points: Home running total after the event.
  period: 'Period number: 1-4 regulation; overtime numbering is unverified (no overtime
    sample).'
  schedule_key: 'B.LEAGUE ScheduleKey (key space: B.LEAGUE games, ONE global integer
    sequence across B1, B2, B3 and every season). The {schedule_key} every game wrapper
    takes and the schedule page''s list-item id.'
  season: Season END year (2026 = 2025-26), the feed's Year (the START year) plus
    one.
bleague_shots:
  area: English zone slug for area_code (restricted_area, paint, baseline_mid_range,
    wing_mid_range, top_of_key_mid_range, corner_3, wing_3, top_3, deep_3); mirrored
    codes share a slug.
  area_code: 'Shot-zone code 1-13 read from the site''s shot-chart SVG: 1 restricted
    area, 2 rest of the paint, 3 / 7 baseline mid-range, 4 / 6 wing mid-range, 5 top-of-the-key
    mid-range, 8 / 12 corner 3, 9 / 11 wing 3, 10 top 3, 13 deep band. Of each pair
    the first is the side far along the baseline. Also set on turnover and foul rows;
    2022-23 onward.'
  clock_seconds: Game clock remaining in the period in whole seconds (8:50 = 530),
    derived from rest_time.
  event_no: Event sequence number, ascending in game order. v2 counts in steps of
    1000 (inserted corrections may fall in between); v1 counts 1, 2, 3...
  feed: 'Source feed of the row: v2 (v2_genius_contexts, B1/B2 from 2020-21) or v1
    (v1_contexts: B3, B1/B2 2018-2020, and the 2016-17 / 2017-18 game-page embed).
    The feeds differ in id types, dates and some codes.'
  in_paint: True for a two-point shot inside the paint, false outside; null for threes
    and on the B3 feed, whose 2PT codes do not split by paint.
  made: True when the shot was made (ActionCD1 odd for threes and 3 / 4), false when
    missed.
  period: 'Period number: 1-4 regulation; overtime numbering is unverified (no overtime
    sample).'
  player_id: 'Primary actor PlayerID as text (key space: B.LEAGUE persons). On a v1
    substitution it is the player going out. Null on team rows and game-level rows.'
  player_name_j: Player name in Japanese (katakana for foreign players); null on team
    and game-level rows.
  player_no: Shirt number as text, so '00' and '0' stay distinct; null on team and
    game-level rows.
  qualifier2: English slug for the shot's ActionCD2 (jump_shot, layup, dunk); null
    when unknown.
  qualifier3: English slug for the shot's ActionCD3 (fast_break, points_off_turnover,
    second_chance, ...); null when none.
  rest_time: Game clock REMAINING in the period as the feed's 'mm:ss' text (counts
    down from 10:00).
  schedule_key: 'B.LEAGUE ScheduleKey (key space: B.LEAGUE games, ONE global integer
    sequence across B1, B2, B3 and every season). The {schedule_key} every game wrapper
    takes and the schedule page''s list-item id.'
  score: Running score 'home-away' after the event (e.g. '2-4'); null on player-in
    rows and v1 substitutions.
  season: Season END year (2026 = 2025-26), the feed's Year (the START year) plus
    one.
  shot_type: 3pt or 2pt, from ActionCD1 (1-2 three-point, 3-6 two-point).
  side: 'Basket the play is charted at: ''left'' (x near 0) or ''right'' (x near 100);
    flips at half-time. Present from 2025-26 only; earlier seasons leave it null and
    the end must be inferred from x.'
  team_id: 'B.LEAGUE TeamID as text (key space: B.LEAGUE clubs, stable across seasons
    AND club renames: 703 = Tochigi Brex in 2016-17 = Utsunomiya Brex in 2025-26).
    The feed sends a string on v2 and an integer on v1; both are text here. Not a
    player id.'
  team_side: Side of the acting team from HomeAway (1 home, 2 away); null on game-level
    rows and official timeouts.
  x: 'Event x: percent (0-100) of the court LENGTH from the ''left'' baseline (baskets
    near 5 and 95). Metres (x / 100 x 28) are an inference. 2022-23 onward on v2 only.'
  y: 'Event y: percent (0-100) of the court WIDTH (baskets at 50). Which sideline
    is y = 0 is unverified; metres (y / 100 x 15) are an inference. 2022-23 onward
    on v2 only.'
bleague_standings:
  away_record: Away record W-L (アウェー).
  division_title: Division-title mark (地区優勝) as printed; null when none ('--').
  games_behind: Games behind the table leader (差).
  home_record: Home record W-L (ホーム).
  last_n: 'Length of the recent-form window the page shows: 5 or 10 games (過去5試合 /
    過去10試合).'
  last_n_record: Record W-L over the last_n games.
  losses: Games lost (負) so far this season in the table.
  point_diff: Point differential (得失点差).
  points_against: Points allowed (失点) over the season to date.
  points_for: Points scored (得点) over the season to date.
  rank: Rank in that table (順位); a club in a division table also appears in the wild-card
    table.
  season: Season END year (2026 = 2025-26), the feed's Year (the START year) plus
    one.
  season_label: Season label of the selected option (2025-26).
  section: 'Table heading in Japanese: 東地区 East, 中地区 Central, 西地区 West, ワイルドカード wild
    card.'
  section_en: English name of section for the four known headings; null for any other
    heading.
  streak: 'Current streak (連勝/連敗) as printed: W5 = five straight wins, L1 = one loss.'
  tab: 'Division tab: 1 = B1, 2 = B2, 3 = B3.'
  team: Club name in Japanese as the standings page prints it (千葉ジェッツ = Chiba Jets).
  team_id: 'B.LEAGUE TeamID as text (key space: B.LEAGUE clubs, stable across seasons
    AND club renames: 703 = Tochigi Brex in 2016-17 = Utsunomiya Brex in 2025-26).
    The feed sends a string on v2 and an integer on v1; both are text here. Not a
    player id.'
  team_short: Club short name in Japanese (千葉J).
  win_pct: Win percentage (勝率) as a 0-1 fraction.
  wins: Games won (勝) so far this season in the table.
bleague_team_box:
  assists: Assists credited to the player or team (AS).
  ast_to: Assist-to-turnover ratio (0 when no turnovers). v2 from 2022-23 only; null
    on half rows.
  blocks: Blocks made (BS).
  blocks_received: Shots of this player or team that were blocked (被ブロック, BSON).
  category: 'Row category: 1 = player, 2 = team / coaches row (team-credited stats;
    on v1 it names the head coach), 3 = team totals (合計). One row per (category, player,
    period category).'
  def_rtg: Defensive rating. v2 from 2022-23 only; on team and totals rows 0 in every
    sample, never filled.
  display_order: Display order of the row (v1 only), integer; null on v2.
  dunks: Dunks made (PT2DUNK); v1 box rows only, null on v2.
  efficiency: 'Efficiency rating (貢献度), era-dependent: v2 = points + rebounds + assists
    + steals + blocks + fouls drawn - missed FG - missed FT - turnovers - fouls -
    shots blocked (PIR); v1 omits fouls drawn, fouls and shots blocked.'
  efg: Effective field-goal percentage as a FRACTION 0-1 (3PT weighted 1.5x); the
    site multiplies by 100. v2 from 2022-23 only.
  feed: 'Source feed of the row: v2 (v2_genius_contexts, B1/B2 from 2020-21) or v1
    (v1_contexts: B3, B1/B2 2018-2020, and the 2016-17 / 2017-18 game-page embed).
    The feeds differ in id types, dates and some codes.'
