  fg3_att_total: Season total of 3-point attempts (三分出手).
  fg3_made_avg: Per-game average of 3-point makes (三分命中).
  fg3_made_total: Season total of 3-point makes (三分命中).
  fg3_pct: 3-point percentage 0-100 (三分命中率; same value as average and total).
  ft_att_avg: Per-game average of free-throw attempts (罰球出手).
  ft_att_total: Season total of free-throw attempts (罰球出手).
  ft_made_avg: Per-game average of free-throw makes (罰球命中).
  ft_made_total: Season total of free-throw makes (罰球命中).
  ft_pct: Free-throw percentage 0-100 (罰球命中率; same value as average and total).
  games: Games played (出賽).
  jersey: Shirt number as a string (the player's number in the latest game).
  minutes_avg: Minutes per game 'mm:ss' (上場時間).
  minutes_total: Total minutes 'mmm:ss' (上場時間).
  name_zh: Player name as printed (Traditional Chinese, or a transliteration for foreign
    players).
  pf_avg: Per-game average of personal fouls (犯規).
  pf_total: Season total of personal fouls (犯規).
  player_page_id: The 8-character page id of /player/{id} (e.g. '1JbPozLB'). The box
    random_id on 2022-23+ rows; NOT the box player_id.
