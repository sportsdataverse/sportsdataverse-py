  player_zh: 'Acting player''s name as printed; null on team rows (a team rebound,
    timeout or shot-clock violation). The page prints no player ids: join to the box
    on side, jersey and name_zh.'
  points: Points scored by the play from the '+2' / '+3' / '+1' tag; null when the
    tag is a bare '+'.
  score_away: Away score after the play, from the 'A - H' cell (AWAY first, unlike
    the box); null on plays that print no score (substitutions, rebounds, jump balls).
  score_home: Home score after the play, from the 'A - H' cell; null when the play
    prints no score.
  seconds_left: The clock as whole seconds remaining in the period (08:34 = 514),
    derived by the parser.
  seq: Position of the play in game order, 1-based (the fragment lists plays oldest
    first within the fragment).
  side: 'Side of the acting team: away or home (the fragment places the play in the
    away or home column).'
  synergy_play_id: Synergy Sports play uuid of the clip (the site links Synergy);
