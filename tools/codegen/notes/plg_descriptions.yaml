    halves where the home team attacks x < 50. Null on plays without a location. Court
    28.75 m long.'
  y: 'Shot / play y: PERCENT (0-100) of the court WIDTH in the physical frame (baskets
    at y = 50); y_vendor = 100 - y in the halves where the home team attacks x < 50.
