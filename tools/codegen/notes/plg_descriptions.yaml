  ft_number: Which free throw of the trip this is (1, 2 or 3), from 第一罰 / 第二罰 / 第三罰;
    null on every other play.
  gid: 'P. LEAGUE+ game id on the site: ONE global integer sequence over every stage
    and season (1-12 = 2020-21 pre-season, 13 = the 2020-21 opener, 197 = the 2022-23
    opener, 662 = the 2025-26 opener), with gaps; a row id, not a count. The {gid}
    of /game/{gid}.'
  jersey: Shirt number of the acting player as printed; null on team rows and where
    the name is printed without a number.
  nice_play: True when the site stars the play (a nice_play row class and a starred
    clip).
