  points_total: Season total of points (得分).
  reb_avg: Per-game average of total rebounds (籃板).
  reb_def_avg: Per-game average of defensive rebounds (防板).
  reb_def_total: Season total of defensive rebounds (防板).
  reb_off_avg: Per-game average of offensive rebounds (攻板).
  reb_off_total: Season total of offensive rebounds (攻板).
  reb_total: Season total of total rebounds (籃板).
  season: 'Season END year (2025 = the site''s slug ''2024-25''): the first year of
    the slug plus one.'
  season_slug: 'The site''s season slug as printed: the START year, then the END year''s
    last two digits (''2024-25'').'
  stage: 'Stage slug: pre-season (熱身賽, exhibition games before the season), regular-season
