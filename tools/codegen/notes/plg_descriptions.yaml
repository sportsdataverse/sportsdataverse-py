pleague_box_players:
  ast: Assists. Null on did-not-play rows.
  ast_ratio: 'Assist ratio 0-100: assists per 100 of the player''s own plays. The
    common formula AST / (FGA + 0.5 x FTA + AST + TOV) reproduces it on 919 of 1,174
    rows, so the exact formula is unverified (2022-23 on).'
  blk: Blocks made. Null on did-not-play rows.
  drtg: 'Defensive rating: the opponent''s points per 100 of its possessions while
    the player was on court, lower is better (2022-23 on). Null on did-not-play rows.'
  eff: 'Efficiency: points + rebounds + assists + steals + blocks - missed field goals
    - missed free throws - turnovers (verified on every 2020-21 and 2021-22 row).
    Null on did-not-play rows.'
  efg_pct: Effective field-goal percentage 0-100, (FGM + 0.5 x 3PM) / FGA x 100 (verified).
    2020-21 and 2021-22 rows only; null from 2022-23.
  fg2_att: 2-point field goals attempted, from the site's 'made-attempted' string.
    Null on did-not-play rows.
  fg2_made: 2-point field goals made, from the site's 'made-attempted' string. Null
    on did-not-play rows.
  fg2_pct: 2-point field-goal percentage, 0-100 (the site sends a number or a string).
    Null on did-not-play rows.
  fg3_att: 3-point field goals attempted, from the site's 'made-attempted' string.
    Null on did-not-play rows.
  fg3_made: 3-point field goals made, from the site's 'made-attempted' string. Null
    on did-not-play rows.
  fg3_pct: 3-point field-goal percentage, 0-100. Null on did-not-play rows.
  ft_att: Free throws attempted, from the site's 'made-attempted' string. Null on
    did-not-play rows.
  ft_made: Free throws made, from the site's 'made-attempted' string. Null on did-not-play
    rows.
  ft_pct: Free-throw percentage, 0-100. Null on did-not-play rows.
  gid: 'P. LEAGUE+ game id on the site: ONE global integer sequence over every stage
    and season (1-12 = 2020-21 pre-season, 13 = the 2020-21 opener, 197 = the 2022-23
    opener, 662 = the 2025-26 opener), with gaps; a row id, not a count. The {gid}
    of /game/{gid}.'
  jersey: Shirt number as printed, a string ('0', '00' and '10' differ).
  minutes: Minutes played 'mm:ss'. Null on did-not-play rows.
  name_zh: Player name as printed (Traditional Chinese, or a transliteration for foreign
    players).
  netrtg: Net rating, ortg minus drtg (exact on every checked row; 2022-23 on). Null
    on did-not-play rows.
  off_possessions: The team's offensive possessions while the player was on court
    (the base of ortg; 2022-23 on). Null on did-not-play rows.
  opp_off_possessions: The opponent's offensive possessions while the player was on
    court (the base of drtg; 2022-23 on). Null on did-not-play rows.
  opp_pts_fast_break: Opponent fast-break points while the player was on court (2022-23
    on). Null on did-not-play rows.
  opp_pts_off_turnover: Opponent points off turnovers while the player was on court
    (2022-23 on). Null on did-not-play rows.
  opp_pts_paint: Opponent points in the paint while the player was on court (2022-23
    on). Null on did-not-play rows.
  opp_pts_second_chance: Opponent second-chance points while the player was on court
    (2022-23 on). Null on did-not-play rows.
  ortg: 'Offensive rating: the team''s points scored per 100 offensive possessions
    while the player was on court (2022-23 on; null before). Null on did-not-play
    rows.'
  pace: 'Pace: 48 x the team''s offensive possessions / minutes on court, the team''s
    possessions per 48 minutes with this player on court (verified on 1,124 of 1,149
    rows; 2022-23 on). Null on did-not-play rows.'
  person_id: 'Preciser person uuid (key space: the analytics vendor''s persons): the
    join between a box row and a pleague_preciser_shots row. Present on played rows
    from 2022-23; null on 2020-21 and 2021-22 rows and did-not-play rows (the refs
    notes report some 2025-26 finals boxes without it; gid 716 has it).'
  pf: Personal fouls committed. Null on did-not-play rows.
  played: True when the player has court time; false on a 'DNP' (did not play) row,
    whose statistics are null.
  player_id: 'P. LEAGUE+ player-team membership id on the site (key space: the member
    id the player page passes to trackPlayer(), e.g. 40 = Lai Ting-En), cast to an
    integer. NOT the 8-character page id. Join box rows on it, never on the printed
    name.'
  plus_minus: 'Plus/minus: the team''s points minus the opponent''s while the player
    was on court (signed). Null on did-not-play rows.'
  points: Points scored. Null on did-not-play rows.
  position: Position code on some 2020-21 and 2021-22 rows ('G' guard, 'F' forward,
    'C' centre); null on the rest and from 2022-23.
  random_id: 'The 8-character page id of /player/{id} (same space as player_page_id).
    Reliable from 2022-23 only: on 2020-21 and 2021-22 rows it is wrong for most players
    (gid 13 gives Lai Ting-En the page of Kao Kuo-Hao), so never join across eras
    on it.'
  reb: Total rebounds (offensive plus defensive). Null on did-not-play rows.
  reb_def: Defensive rebounds. Null on did-not-play rows.
  reb_off: Offensive rebounds. Null on did-not-play rows.
  seconds: 'Playing time in whole seconds: the site''s seconds column in 2020-21 and
    2021-22, derived from minutes from 2022-23. Null on did-not-play rows.'
  side: 'Which team the row belongs to: home or away. The box lists home first, the
    play-by-play and the schedule list away first.'
  starter: True for a starter (the site's '〇' marker). Null on did-not-play rows.
  stl: Steals. Null on did-not-play rows.
  to_ratio: 'Turnover ratio 0-100: turnovers per 100 of the player''s own plays; same
    unverified formula family as ast_ratio (917 of 1,174 rows; 2022-23 on).'
  tov: Turnovers committed. Null on did-not-play rows.
  ts_pct: True-shooting percentage 0-100, PTS / (2 x (FGA + 0.44 x FTA)) x 100 (verified).
    2020-21 and 2021-22 rows only; null from 2022-23.
  usage_pct: Usage percentage as the site prints it, 0-100; the standard usage formula
    reproduces it on only 685 of 3,932 rows, so the formula is unverified. 2020-21
    and 2021-22 rows only.
pleague_box_teams:
  ast: Team assists in the game (the total row).
  blk: Team blocks made in the game.
  fg2_att: Team 2-point field goals attempted.
  fg2_made: Team 2-point field goals made.
  fg2_pct: Team 2-point percentage, 0-100.
  fg3_att: Team 3-point field goals attempted.
  fg3_made: Team 3-point field goals made.
  fg3_pct: Team 3-point percentage, 0-100.
  ft_att: Team free throws attempted.
  ft_made: Team free throws made.
  ft_pct: Team free-throw percentage, 0-100.
  gid: 'P. LEAGUE+ game id on the site: ONE global integer sequence over every stage
    and season (1-12 = 2020-21 pre-season, 13 = the 2020-21 opener, 197 = the 2022-23
    opener, 662 = the 2025-26 opener), with gaps; a row id, not a count. The {gid}
    of /game/{gid}.'
  minutes: Team minutes 'mm:ss' ('240:00' = 5 players x 48 min; more with overtime).
  pf: Team personal fouls.
  plus_minus: Sum of the players' plus/minus (2020-21 and 2021-22 only; null from
    2022-23).
  points: Team points; equals the final score (the runtime checks it).
  reb: Team total rebounds, including team rebounds that no player row carries (so
    it can exceed the sum of the player rows).
  reb_def: Team defensive rebounds.
  reb_off: Team offensive rebounds.
  seconds: 'Team seconds on court (14400 = 240 minutes): the site''s value in 2020-21
    and 2021-22, derived from minutes from 2022-23.'
  side: 'Which team the row belongs to: home or away. The box lists home first, the
    play-by-play and the schedule list away first.'
  stl: Team steals in the game.
  tov: Team turnovers.
pleague_game:
  away_logo: 'Away team logo url as printed by the page: protocol-relative (''//d36fypkbmmogz6.cloudfront.net/upload/p_team/logo_{team}_{epoch}.png'');
    some game pages print a malformed ''https:////d36...''. The trailing number is
    the upload time.'
  away_name_en: Away team's English name on that date; renames change it. Null on
    2020-21 game pages (no English name is printed).
  away_name_zh: 'Away team''s name on that date in Traditional Chinese (short or long
    form; 勇士 = Braves, 領航猿 = Pilots, 攻城獅 = Lioneers, 夢想家 = Dreamers, 鋼鐵人 = Steelers,
    國王 = Kings, 獵鷹 = Ghosthawks, 洋基工程 = Yankey Ark). Printed names change by season
    (short and long forms, renames): key on the id, not the name.'
  away_score: Away team's final points (0 on a future game).
  date: Game date from the header, Asia/Taipei (UTC+8) local time.
  finished: True when the status badge is 已完賽 (finished); always true for a served
    game.
  game_label_zh: 'Stage and game number as printed in the header: ''例行賽G1'' = regular
    season game 1 (''例行賽G01'' on 2020-21 pages); 季後賽 = playoffs, 總冠軍賽 = finals.'
  gid: 'P. LEAGUE+ game id on the site: ONE global integer sequence over every stage
    and season (1-12 = 2020-21 pre-season, 13 = the 2020-21 opener, 197 = the 2022-23
    opener, 662 = the 2025-26 opener), with gaps; a row id, not a count. The {gid}
    of /game/{gid}.'
  home_logo: 'Home team logo url as printed by the page: protocol-relative (''//d36fypkbmmogz6.cloudfront.net/upload/p_team/logo_{team}_{epoch}.png'');
    some game pages print a malformed ''https:////d36...''. The trailing number is
    the upload time.'
  home_name_en: Home team's English name on that date; renames change it. Null on
    2020-21 game pages (no English name is printed).
  home_name_zh: 'Home team''s name on that date in Traditional Chinese (short or long
    form). Printed names change by season (short and long forms, renames): key on
    the id, not the name.'
  home_score: Home team's final points (0 on a future game).
  overtimes: Number of overtime periods played (overtime cells with points on the
    page).
  status_zh: 'Status badge: 已完賽 = finished. The only value the wrappers serve (anything
    else raises AssetFetchError).'
  time: Tip-off 'HH:MM' from the header, Asia/Taipei (UTC+8) local time.
  uuid: 'Preciser game uuid (key space: the analytics vendor''s games, a version-1
    uuid), embedded in the game page as getPlayByPlay(''uuid''); keys the play-by-play
    and every pleague_preciser wrapper. Null before 2022-23 (the page embeds an empty
    string: no play-by-play or vendor data).'
  venue_zh: Venue (arena) name in Traditional Chinese.
pleague_officials:
  gid: 'P. LEAGUE+ game id on the site: ONE global integer sequence over every stage
    and season (1-12 = 2020-21 pre-season, 13 = the 2020-21 opener, 197 = the 2022-23
    opener, 662 = the 2025-26 opener), with gaps; a row id, not a count. The {gid}
    of /game/{gid}.'
  name_zh: 'Official''s name in Traditional Chinese. Names only: the page carries
    no ids or contact data.'
  official_no: 1-based position of the official in the printed line (referee first).
  role: 'Role translated: referee (主裁判, the crew chief), first_umpire (第一檢查員, literally
    ''first inspector''), second_umpire (第二檢查員). Null for a role this table does not
    know.'
  role_zh: 'Official''s role as printed: 主裁判 = referee, 第一檢查員 = first umpire, 第二檢查員
    = second umpire.'
