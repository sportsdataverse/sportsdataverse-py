  text_zh: The whole printed text of the play, e.g. '#35 辛巴 灌籃得分' = '#35 {player}
    dunk, made'.
  tryspot_player_id: Player id in the clip vendor's key space (an integer such as
    59476); NOT the box player_id.
  video_created_at: When the clip was created, UTC ISO 8601 with milliseconds.
  video_stat_category: 'The clip''s own stat label (ast, blk, ft_made, ft_miss, pfoul,
    reb_d, reb_o, stl, three_made, three_miss, timeout, turnover, two_made, two_miss):
    it names the PLAY the clip shows, not always this row''s action (a rebound row
    carries the missed shot''s clip).'
  video_uuid: 'Clip uuid (key space: the clip vendor tryspot); null on plays without
    a clip (about 3 in 4). The clip urls are never kept: they carry a vendor access
    key.'
  x: 'Shot / play x: PERCENT (0-100) of the court LENGTH in the PHYSICAL court frame
    (not normalised per team): baskets near x = 5 and x = 95, teams swap ends at half-time.
