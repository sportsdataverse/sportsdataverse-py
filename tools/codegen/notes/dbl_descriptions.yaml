  home_team_founded_on: Year the club was founded ('' when unknown).
  home_team_icon: Home team logo URL.
  home_team_instance_id: Site instance id of the home club (platform key space).
  home_team_names_code: Three-letter team code (HOL, RAN ...); codes changed between
