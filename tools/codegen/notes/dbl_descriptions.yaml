  away_team_names_long_site: Long team name as the club's own site shows it.
  away_team_names_short: Short name of the team.
  away_team_names_short_site: Short team name as the club's own site shows it.
  away_team_score: Points scored by the away team.
  away_team_uuid: Away team uuid (platform key space); joins /sports-v2/teams/{team_uuid}.
  game_info_arena_name: Name of the arena (venue).
  game_info_ext_id: Genius match id (Int64; the same number as gameday game_source_id).
  game_info_game_uuid: Game uuid (platform key space).
  game_info_overtime: Whether the game went to overtime.
  game_info_round_label: Round label ('').
  game_info_round_number: Round number (0).
  game_info_series_code: Series code (DBL).
  game_info_series_display_name: Series display name (Basketligaen).
  game_info_series_name: Series name (Basketligaen).
  game_info_shootout: 'Unobserved: null in every sample and every full body. When
