sportality_pbp:
  away_abbreviation: Away team abbreviation.
  away_place: 'Side of the away block: always away.'
  away_score: Points scored by the away team.
  away_team_code: Away team code as Genius spells it.
  away_team_id: Genius team id of the away team (Genius key space; Int64).
  away_team_name: Name of the away team.
  away_team_number: Team number in the game; away is 2.
  coordinates_x: Shot or event x coordinate in Genius court units (Float64); origin
