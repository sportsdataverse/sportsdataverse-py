  coordinates_y: Shot or event y coordinate in Genius court units (Float64); origin
    and orientation unverified.
  event_abbreviation: Team abbreviation.
  event_id: Genius event number within the game (Int64), increasing through the game.
  event_place: 'Side of the team the event belongs to: home or away.'
  event_team_code: Team code as Genius spells it.
  event_team_id: Genius team id (Genius key space; Int64).
  event_team_name: Name of the team.
  event_team_number: Team number in the game (1 home, 2 away).
  event_uuid: Event uuid (UUID v5 derived from the event; unique per event).
  game_id: Genius match id (Int64), the join to the genius family; on play-by-play
    lines, an integer elsewhere.
  game_source_id: Genius match id (Int64), the same number as game_id and sports-v2
    game_info_ext_id.
  game_state: 'Game state at the event: ongoing during play, GameEnded on the final
    line. Values: `GameEnded` = game over (the final line of a complete feed); `ongoing`
    = game in progress.'
  game_type: Game type of the game ('' on every line seen).
  game_uuid: Platform game uuid (c4hh5nig6t); every gameday route takes it.
  home_abbreviation: Home team abbreviation.
  home_place: 'Side of the home block: always home.'
  home_score: Points scored by the home team.
  home_team_code: Home team code as Genius spells it (mixed case, 'Hol').
  home_team_id: Genius team id of the home team (Genius key space; Int64).
  home_team_name: Name of the home team.
  home_team_number: Team number in the game; home is 1.
  instance_id: Site instance id of the club or league (platform key space, '<code><n>_<code>'
    such as hol2_hol; the league itself is dbl1_dbl).
  is_successful: 1 when the action succeeded (a made shot or free throw, a recorded
    rebound ...). ABSENT, not 0, for a missed shot, so count misses as rows without
    it.
  period: 'Period: 0 = the whole game, 1-4 the quarters, 5 and up overtime.'
  period_time: 'Marker lines only: 0 (an integer), the start of the period.'
  period_type: 'REGULAR or OVERTIME; absent on the period marker lines. Values: `OVERTIME`
    = overtime period; `REGULAR` = regulation period.'
  player_family_name: Family name (this route says familyName; the others lastName).
  player_first_name: Given (first) name(s) of the player.
  player_id: Genius person id (Int64). A string key in the players maps, an integer
    in play-by-play and box-score rows; cast here so the frames join, and join the
    genius family.
  player_pno: Genius shirt-table number of the player.
  player_team_number: Team number in the game (1 home, 2 away).
  qualifiers: Event qualifiers joined by ';' (a list in recent games, a ';'-joined
    string or null in older ones).
  real_world_time: Wall-clock time of the event, ISO 8601 UTC.
  revision: Revision counter of the event.
  round: Round number (0).
  source: Feed that produced the line (genius-basketball-stream-reader).
  start_date_and_time: Start of the game ('' on every line seen).
  sub_type: 'Refinement of `type` (the shot type, rebound kind, foul kind, ...); null
    on types that have none. Values: `1of1` = free throw 1 of 1; `1of2` = free throw
    1 of 2; `1of3` = free throw 1 of 3; `24sec` = shot-clock violation; `2of2` = free
    throw 2 of 2; `2of3` = free throw 2 of 3; `3of3` = free throw 3 of 3; `3sec` =
    three-second violation; `5sec` = five-second violation; `8sec` = eight-second
    violation; `adjustment` = clock adjustment; `alleyoop` = alley-oop shot; `alleyoopdunk`
    = alley-oop dunk; `backcourt` = backcourt violation; `badpass` = bad pass; `ballhandling`
    = ball-handling error; `benchTechnical` = technical foul on the bench; `coachTechnical`
    = technical foul on the coach; `defensive` = defensive rebound; `disqualifying`
    = disqualifying foul; `disruptive` = disruptive foul (unverified); `doubledribble`
    = double dribble; `drivinglayup` = driving layup; `dunk` = dunk; `end` = end of
    the period or game; `eurostep` = euro-step layup; `fadeaway` = fadeaway jump shot;
    `flagrant` = flagrant foul; `floatingjumpshot` = floating jump shot; `full` =
    full timeout; `heldball` = held ball; `hookshot` = hook shot; `in` = player enters;
    `jumpshot` = jump shot; `layup` = layup; `lodgedball` = lodged ball; `lost` =
    lost the jump ball; `offensive` = offensive rebound or offensive foul; `offensivegoaltending`
    = offensive goaltending; `officials` = official timeout; `other` = other; `out`
    = player leaves; `outofbounds` = out of bounds; `outofboundsrebound` = rebound
    off an out-of-bounds ball (unverified); `personal` = personal foul; `pullupjumpshot`
    = pull-up jump shot; `reverselayup` = reverse layup; `start` = start of the period
    or game, or clock start; `startperiod` = start of a period (jump ball line); `stepbackjumpshot`
    = step-back jump shot; `stop` = clock stop; `technical` = technical foul; `throwIn`
    = throw-in violation (unverified); `tipindunk` = tip-in dunk; `tipinlayup` = tip-in
    layup; `travel` = traveling; `turnaroundjumpshot` = turnaround jump shot; `unsportsmanlike`
    = unsportsmanlike foul; `won` = won the jump ball.'
  time: Clock REMAINING in the period as mm:ss:cc (cc looks like hundredths of a second,
    only ever 00, 10, 30, 50 ... seen; unverified). Absent on the per-period marker
    lines.
  type: 'Event type: one line per action; shots are the shooter''s line, assists,
    blocks, steals and fouls drawn are further lines. Values: `2pt` = two-point attempt
    (made when isSuccessful = 1); `3pt` = three-point attempt (made when isSuccessful
    = 1); `assist` = assist on the previous made shot; `block` = block; `clock` =
    clock start, stop or adjustment; `foul` = foul committed; `foulon` = foul drawn
    (fouled player); `freethrow` = free-throw attempt; `game` = game start / end line;
    `headcoachchallenge` = head coach challenge; `jumpball` = jump ball or held ball;
    `period` = period start / end line; `rebound` = rebound; `steal` = steal; `substitution`
    = substitution (in or out); `timeout` = timeout; `turnover` = turnover.'
  updated_time: When the feed last updated the event, ISO 8601 UTC.
