  home_team_names_code_site: Team code as the club's own site shows it.
  home_team_names_full: Full name of the team.
  home_team_names_full_site: Full team name as the club's own site shows it.
  home_team_names_long: Long name of the team.
  home_team_names_long_site: Long team name as the club's own site shows it.
  home_team_names_short: Short name of the team.
  home_team_names_short_site: Short team name as the club's own site shows it.
  home_team_score: Points scored by the home team.
  home_team_uuid: Home team uuid (platform key space); joins /sports-v2/teams/{team_uuid}.
  instance_context_site_team_is_away_team: Whether the requesting site's own team
