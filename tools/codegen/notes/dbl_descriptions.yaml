sportality_athlete_career:
  2_p_perc: Two-point percentage, 0-100.
  3_p_perc: Three-point percentage, 0-100.
  3_pa: Three-pointers attempted (total, or a percentage string in the checked rows;
    unverified).
  3_pm: Three-pointers made (total).
  apg: Assists per game.
  blkpg: Blocks per game.
  drpg: Defensive rebounds per game.
  ft_perc: Free-throw percentage, 0-100.
  g: Games played in the ssgt.
  gps: Games started (0 on every row seen).
  info_age_format: 'Unit of the value (years). Values: `years` = years.'
  info_age_value: Age in whole years.
  info_career_stats: Career totals (always empty here).
  info_first_name: Given (first) name(s) of the player.
  info_full_name: Full display name of the player.
  info_gender: Gender of the person as recorded by the site (male in every row seen).
  info_height_format: 'Unit of the value (cm). Values: `cm` = centimetres.'
  info_height_value: Height of the player in centimetres.
  info_is_in_squad: Whether the player is in the team's current squad.
  info_jersey_number: Jersey number ('N/A' on career rows).
  info_last_name: Family name (surname) of the player.
  info_nationality: ISO 3166-1 alpha-2 country code.
  info_player_id: Genius person id (Genius key space; an integer).
  info_position: Position code (G, F, C, SG, SF ...).
  info_position_code: 'Position code (''N/A'' on career rows). Values: `N/A` = not
    applicable (career rows).'
  info_season_stats: Season totals (always empty here).
  info_shoots: Shooting hand (null).
  info_ssgt_uuid: ssgt uuid of the career row (platform key space).
  info_statistics_provider: Stats provider of the data (genius-basketball = Genius
    Sports LiveStats).
  info_team_code: Three-letter team code.
  info_team_id: Genius team id (Genius key space; an integer here).
  info_team_instance_id: Site instance id of the club (platform key space).
  info_team_name: Name of the team.
  info_team_uuid: Team uuid (platform key space); joins /sports-v2/teams/{team_uuid}.
  info_uuid: Athlete uuid on player tables, team uuid on team tables (platform key
    space).
  info_weight_format: 'Unit of the value (kg). Values: `kg` = kilograms.'
  info_weight_value: Weight of the player in kilograms.
  mpg: Minutes per game, 'M.m' string.
  orpg: Offensive rebounds per game.
  pfpg: Personal fouls per game.
  plus_minus_pg: Plus/minus per game.
  ppg: Points per game.
  rpg: Rebounds per game.
  stpg: Steals per game.
  topg: Turnovers per game.
sportality_athlete_details:
  athlete_uuid: Platform athlete uuid (rosters and athlete routes key on it); not
    the Genius person id; null where the site has none.
  created_at: Creation timestamp.
  created_by: Creating site instance.
  creator_site: 'Unobserved: null in every sample and every full body. When filled:
    Creating site (null).'
  deleted: Soft-delete flag.
  first_name: Given (first) name(s) of the player.
  gender: Gender of the person as recorded by the site (male in every row seen).
  height: Height of the player in centimetres.
  last_modified: Last-modified timestamp.
  last_name: Family name (surname) of the player.
  metadata: Free metadata (always empty).
  nationality: ISO 3166-1 alpha-2 country code.
  player_id: Genius person id (Int64). A string key in the players maps, an integer
    in play-by-play and box-score rows; cast here so the frames join, and join the
    genius family.
  shoots: Shooting hand ('').
  weight: Weight of the player in kilograms.
sportality_athlete_profile:
  age_format: 'Unit of the value (years). Values: `years` = years.'
  age_value: Age in whole years.
  career_stats: The player's career totals as field/value pairs.
  first_name: Given (first) name(s) of the player.
  full_name: Full display name of the player.
  gender: 'Gender of the team or player: male or female (every record on this host
    is male).'
  height_format: 'Unit of the value (cm). Values: `cm` = centimetres.'
  height_value: Height of the player in centimetres.
  is_in_squad: Whether the player is in the team's current squad.
  jersey_number: Jersey (shirt) number of the player.
  last_name: Family name (surname) of the player.
  media_alt: Image alt text ('').
  media_focal_point: Focal point record (empty).
  media_photographer: Photographer credit ('').
  media_srcset: Responsive image set (imgix CDN URLs with widths).
  media_url: Portrait image URL (imgix CDN).
  media_url_img_original_proportion: Portrait URL at its original proportions.
  media_url_placeholder_image: Placeholder image URL ('').
  media_videourl: Video URL ('').
  nationality: ISO 3166-1 alpha-2 country code.
  position: Playing position.
  position_code: 'Position code (G, F, C, or a finer code such as SG on the profile
    route). Values: `G` = guard.'
  season_stats: The player's current-season totals as field/value pairs (GP, PAvg,
    ...).
  shoots: Shooting hand (empty or null for every player seen).
  statistics_provider: Stats provider of the data (genius-basketball = Genius Sports
    LiveStats).
  team_code: Platform team code (HOL, RAN).
  team_instance_id: Site instance id of the club (platform key space).
  team_media: URL of the team logo image.
  team_name: Name of the team.
  team_uuid: Platform team uuid.
  uuid: Platform uuid of this record (10-character lowercase key space of its record
    type; joins the route that serves it).
  weight_format: 'Unit of the value (kg). Values: `kg` = kilograms.'
  weight_value: Weight of the player in kilograms.
sportality_boxscore:
  2_p: Two-pointers as 'made-attempted'.
  2_p_perc: Two-point percentage, 0-100.
  3_p: Three-pointers as 'made-attempted'.
  3_p_perc: Three-point percentage, 0-100.
  ast: Number of assists credited.
  blk: Number of blocked shots made.
  blkr: Blocks received (shots of the player that were blocked).
  def: Defensive rebounds.
  f_on: Fouls on (fouls drawn).
  fg: Field goals as 'made-attempted'.
  fg_perc: Field-goal percentage, 0-100.
  first_name: Given (first) name(s) of the player.
  ft: Free throws as 'made-attempted'.
  ft_perc: Free-throw percentage, 0-100.
  full_name: Full display name of the player.
  last_name: Family name (surname) of the player.
  mins: Minutes played as 'MM:SS' (null on the bench and totals rows).
  nr: Jersey number (null on the bench and totals rows).
  'off': Offensive rebounds.
  period: 'Period of the line: 0 = the whole game (the only value seen).'
  pf: Personal fouls.
  player_id: Genius person id (Int64). A string key in the players maps, an integer
    in play-by-play and box-score rows; cast here so the frames join, and join the
    genius family.
  plus_minus: Plus/minus while on court.
  pos: Position code of the line (G, F, C; null on the bench and totals rows).
  pts: Number of points scored.
  reb: Total rebounds.
  row_type: 'Kind of row: player, team_coach (the bench row: team rebounds, turnovers
    and fouls charged to the team or coach) or team_totals.'
  stl: Number of steals.
  team_id: 'Genius team id (Int64): in gameday bodies, an integer in standings and
    stats tables.'
  team_name: Name of the team.
  team_side: 'home or away: the side the row belongs to.'
  to: Number of turnovers committed.
