  league_id: League id (per-bucket competition key space); joins to the `{league_id}`
    path param.
  league_part_id: 'League part id (league-part key space, per bucket: one stage of
    a competition, e.g. ICEHL 56 = 2026/27 regular season); joins to `league_part_id`
    in league-matches and the `{league_part_id}` path param.'
  league_part_name: League part name, e.g. `ICEHL 2026/27` or `... - Playoffs`; splits
    regular season from playoffs where one league id holds both.
  match_id: Match id (per-bucket match key space); joins to the {match_id} path param
    of the game wrappers.
  overtime_count: Number of overtime periods played; null in the samples.
  real_end_date: Actual end, local `YYYY-MM-DD HH:MM:SS`.
  real_start_date: Actual start, local `YYYY-MM-DD HH:MM:SS`; `0000-00-00 00:00:00`
    placeholder before the game.
  round: Round number as a string (`"1"`, `"249"`); DEL values carry a leading U+FEFF
    byte-order mark, empty string in Denmark.
  season: Season by its END year (2027 = 2026/27); the body's START-year key plus
    one.
  second_period_score_guest: Visiting team goals in that span.
  second_period_score_home: Home team goals in that span.
  shooting: True when the game was decided by a shootout.
  start_date: Scheduled face-off, local `YYYY-MM-DD HH:MM:SS`; DEL playoff placeholders
    read `0000-00-00 ...`.
  status: 'Match status: `BEFORE_MATCH`, `LIVE`, `AFTER_MATCH`.'
  third_period_score_guest: Visiting team goals in that span.
  third_period_score_home: Home team goals in that span.
  tickets_url: URL of the ticket shop for the match.
metal_standings:
  complete: True when the standings include every finished game.
  games: Games played.
  goals_away: Goals scored in away games.
  group_id: Group id (group key space); null when the stage has no groups, so unobserved
    here.
  group_name: Group name; empty string when the stage has no groups.
  last10: Form over the last ten games as a result string; empty string in the samples.
  live: True while the team is playing a live game.
  live_game_score: Score of the live game; null when none, so unobserved here.
  losts: Losses in regulation time.
  losts_ot: Losses after overtime or shootout.
  name: Team display name.
  only_ot_losts: Losses in overtime.
  only_ot_wins: Wins in overtime.
  only_so_losts: Losses in a shootout.
  only_so_wins: Wins in a shootout.
  part_team_id: 'Team-in-league-part id (its own key space: one team in one league
    part); no other captured file carries it.'
  points: Table points.
  points_away: Table points from away games.
  position: Table position, 1 = first.
  position_change: Change in table position since the previous round.
  ppg: Points per game.
  qualified: True when the team has clinched qualification.
  score1: Goals the team scored (goals for).
  score2: Goals against.
  shortcut: Three-letter team code.
  team_id: Team id (per-bucket team key space); joins to home_id / guest_id in the
    schedule.
  team_original: Team's registered name.
  ties: Ties (0 under current rules).
  wins: Wins in regulation (DEL, EIHL, Denmark) or all wins (ICEHL, see `winsReg`);
    definition per bucket unverified.
  wins_ot: Wins after overtime or shootout.
  wins_reg: Wins in regulation time.
metal_top_scorers:
  assists: Assists credited to the player in the league-season.
  birthdate: Birth date `YYYY-MM-DD`.
  goals: Goals the player scored in the league-season.
  name: Player first name.
  player_id: Player id (player key space, per bucket, stable across games and seasons);
    joins to `playerId` in rosters, events, boxscores and leaderboards.
  points: Points, goals + assists.
  shots: Shots on goal.
  surname: Player last name.
  team_id: Team id (team key space, per bucket, stable across seasons); joins to `league-matches`
    `home.id` / `guest.id` and the `{team_id}` path param.
  team_name: Team display name.
  team_shortcut: Three-letter team code.
