del_faceoffs:
  id: Face-off id (face-off key space); no other captured file joins to it.
  loser_id: Player id (playerId key space) of the faceoff loser (DEL spells the key
    losser, ICEHL looser).
  loser_name: Full name of the faceoff loser.
  position: 'Face-off dot: `BULY_CENTRAL` or `BULY_{HOME|AWAY}_{DEFENSE|BLUE}_{LEFT|RIGHT}`.'
  position_shortcut: Short dot code, e.g. `C`, `HDL` (home defence left), `HDR`.
  realtime: Wall-clock local time, `YYYY-MM-DD HH:MM:SS`.
  time: Seconds of game time from the opening face-off (0-3600 in regulation, continuing
    through overtime).
  winner_id: Player id (player key space, per bucket, stable across games and seasons);
    joins to `playerId` in rosters, events, boxscores and leaderboards.
  winner_name: Player full name.
del_game_info:
  actual_time_alias: 'Short game-state code: `K` = finished.'
  actual_time_name: Display label of the game state, e.g. `end` / `Ende`.
  best_players_home_id: Player id (player key space, per bucket, stable across games
    and seasons); joins to `playerId` in rosters, events, boxscores and leaderboards.
  best_players_home_name: Player full name.
  best_players_visitor_id: Player id (player key space, per bucket, stable across
    games and seasons); joins to `playerId` in rosters, events, boxscores and leaderboards.
  best_players_visitor_name: Player full name.
  last_event_time: Game second of the latest event (3600 = end of regulation).
  number_of_viewers: Spectators at the game (attendance).
  overtime_count: Number of overtime periods; null in the samples.
  referees_head_referee1_id: Official (referee/linesman) person id, its own key space;
    not a player id; no other captured file joins to it.
  referees_head_referee1_name: Official's full name.
  referees_head_referee2_id: Official (referee/linesman) person id, its own key space;
    not a player id; no other captured file joins to it.
  referees_head_referee2_name: Official's full name.
  referees_line_referee1_id: Official (referee/linesman) person id, its own key space;
    not a player id; no other captured file joins to it.
  referees_line_referee1_name: Official's full name.
  referees_line_referee2_id: Official (referee/linesman) person id, its own key space;
    not a player id; no other captured file joins to it.
  referees_line_referee2_name: Official's full name.
  results_contumacy: True when the result was awarded by forfeit.
  results_extra_time: True when the game went to overtime.
  results_score_final_score_guest: Visiting team goals in that span.
  results_score_final_score_home: Home team goals in that span.
  results_score_first_period_score_guest: Visiting team goals in that span.
  results_score_first_period_score_home: Home team goals in that span.
  results_score_second_period_score_guest: Visiting team goals in that span.
  results_score_second_period_score_home: Home team goals in that span.
  results_score_third_period_score_guest: Visiting team goals in that span.
  results_score_third_period_score_home: Home team goals in that span.
  results_shooting: True when the game was decided by a shootout.
  stadium: Name of the arena the game was played in.
  team_bilance_home_win: Wins of that team in the head-to-head record (unverified).
  team_bilance_visitor_win: Wins of that team in the head-to-head record (unverified).
  team_info_home_id: Team id (team key space, per bucket, stable across seasons);
    joins to `league-matches` `home.id` / `guest.id` and the `{team_id}` path param.
  team_info_home_name: Team display name.
  team_info_home_shortcut: Three-letter team code.
  team_info_visitor_id: Team id (team key space, per bucket, stable across seasons);
    joins to `league-matches` `home.id` / `guest.id` and the `{team_id}` path param.
  team_info_visitor_name: Team display name.
  team_info_visitor_shortcut: Three-letter team code.
  trainers_home_head_coach_id: Coach person id, its own key space; not a player id;
    no other captured file joins to it.
  trainers_home_head_coach_name: Head coach full name.
  trainers_visitor_head_coach_id: Coach person id, its own key space; not a player
    id; no other captured file joins to it.
  trainers_visitor_head_coach_name: Head coach full name.
del_goalie_box:
  average: Goals-against average per 60 minutes.
  goals_against: Goals the goalie allowed.
  jersey: Jersey number.
  lost_matches: Games the goalie lost.
  matches: Games played (1 in a per-game file).
  minutes_in_play: Share of the team's game time in goal, percent (100.0 = the whole
    game).
  name: Goalie first name.
  player_id: Player id (player key space, per bucket, stable across games and seasons);
    joins to `playerId` in rosters, events, boxscores and leaderboards.
  saves: Shots on goal the goalie stopped.
  saves_percent: Save percentage x 100 (e.g. `85.71`).
  seconds_per_game: Time in goal per game, seconds.
  surname: Goalie last name.
  team_id: Team id (team key space, per bucket, stable across seasons); joins to `league-matches`
    `home.id` / `guest.id` and the `{team_id}` path param.
  team_name: Team display name.
  team_shortcut: Three-letter team code.
  time_on_ice: Time in goal, seconds.
  won_matches: Games the goalie won.
  zeros: 'Shutouts by the goalie (`zeros`: games with no goal allowed).'
del_pbp:
  assist1_jersey: Jersey number of the first assist.
  assist1_name: Full name of the first assist.
  assist1_player_id: Player id (playerId key space) of the first assist.
  assist2_jersey: Jersey number of the second assist.
  assist2_name: Full name of the second assist.
  assist2_player_id: Player id (playerId key space) of the second assist.
  balance: 'Goal strength: `EQ` even, `PP1` / `PP2` power play, `SH1` / `SH2` shorthanded.'
  codename: Penalty code, e.g. `HOOK`, `TRIP`, `ROUGH`, `BOARD`, `DELAY`.
  create_time: Game second at which the event was entered (unverified).
  current_score: Score after the goal, as `home:visitor` text, e.g. `1:0`.
  decision_after_review: Final call after the review.
  disciplined_bm: True when the penalty was a bench minor.
  disciplined_functionary: True when the penalty was assessed to a team official.
  duration: Penalty length in seconds (120 = minor).
  empty_net: True when the goal went into an empty net.
  event_id: Event id within its event type.
  event_index: Row order of the event within the game (0-based), across periods.
  event_type: 'Event type: goal, penalty, goalkeeperChange, timeout, periodStart,
    periodEnd, videoReview, ...'
  extra_attacker: True when the scoring team had an extra attacker on (goalie pulled).
  goal_review: Video review subject, e.g. a goal (EIHL `videoReview` events).
  goalie_jersey: Jersey number of the goalie entering the game (goalkeeperChange).
  goalie_name: Full name of the goalie entering the game (goalkeeperChange).
  goalie_player_id: Player id (playerId key space) of the goalie entering the game
    (goalkeeperChange).
  minus_player_ids: Comma-separated player ids (playerId key space) of the conceding
    team's players on ice.
  on_ice_decision: Call on the ice before the review.
  outgoing_goalie_jersey: Jersey number of the goalie leaving the game (goalkeeperChange).
  outgoing_goalie_name: Full name of the goalie leaving the game (goalkeeperChange).
  outgoing_goalie_player_id: Player id (playerId key space) of the goalie leaving
    the game (goalkeeperChange).
  penalized_jersey: Jersey number of the penalized player.
  penalized_name: Full name of the penalized player.
  penalized_player_id: Player id (playerId key space) of the penalized player.
  penalty_from_real_time: Penalty start, local wall clock YYYY-MM-DD HH:MM:SS.
  penalty_from_scoreboard_time: Penalty start, game second.
  penalty_to_real_time: Penalty end, local wall clock YYYY-MM-DD HH:MM:SS.
  penalty_to_scoreboard_time: Penalty end, game second.
  period: 'Period key as the body sends it: 1, 2, 3, OT (overtime) or SO (shootout).'
  period_number: 'Period number: 1-3, 4 = overtime, 5 = shootout.'
  plus_player_ids: Comma-separated player ids (playerId key space) of the scoring
    team's players on ice.
  real_time: Wall-clock local time, `YYYY-MM-DD HH:MM:SS`.
  reason_for_review: Why the play was reviewed (free text).
  replaced_jersey: Jersey number of the player serving the penalty in the penalized
    player's place.
  replaced_name: Full name of the player serving the penalty in the penalized player's
    place.
  replaced_player_id: Player id (playerId key space) of the player serving the penalty
    in the penalized player's place.
  scoreboard_time: Seconds of game time from the opening face-off (0-3600 in regulation,
    continuing through overtime).
  scorer_jersey: Jersey number of the goal scorer.
  scorer_name: Full name of the goal scorer.
  scorer_player_id: Player id (playerId key space) of the goal scorer.
  shooting: True for a goal scored on a penalty shot.
  team_id: Team id (team key space, per bucket, stable across seasons); joins to `league-matches`
    `home.id` / `guest.id` and the `{team_id}` path param.
  team_shortcut: Three-letter team code.
  team_side: 'Team of the row: home or visitor.'
  technical: True for a technical penalty (unverified).
  time: Game second of the event from the opening face-off (0-3600 in regulation,
    continuing through overtime).
del_player_box:
  active: True when the player is active on the team.
  assists: 'assists in total (assists_home + assists_away: the body splits it by home
    and away games).'
  assists_away: 'Split by venue: `home` = in the player''s home games, `away` = in
    away games.'
  assists_home: 'Split by venue: `home` = in the player''s home games, `away` = in
    away games.'
  birth_country: Player's country of birth (name).
  blocked_shots_by_player: Opponent shots this player blocked.
  date_of_birth: Birth date `YYYY-MM-DD`.
  faceoffs_count: Face-offs the player took (this game, or to date in the season /
    league-part files).
  faceoffs_losses: Face-offs the player lost (this game, or to date in the season
    / league-part files).
  faceoffs_win: Face-offs the player won (this game, or to date in the season / league-part
    files).
  firstname: First name of the player in this row.
  games: Games played.
  goals: 'goals in total (goals_home + goals_away: the body splits it by home and
    away games).'
  goals_away: 'Split by venue: `home` = in the player''s home games, `away` = in away
    games.'
  goals_home: 'Split by venue: `home` = in the player''s home games, `away` = in away
    games.'
  gw_goals: Game-winning goals.
  height: Height in cm; `0` placeholder when unknown.
  holema_id: Unobserved (null in every sample); an external registry id by its name,
    key space unknown, joins to nothing captured.
  jersey: Jersey number.
  name: Player full name.
  nationality: Nationality, country name.
  nationality_short: Nationality, three-letter code (`CAN`, `GER`; `UK` for Britain).
  negative: 'Minus: on ice for goals against at even strength or on the power play.'
  penalty_minutes: Penalty minutes assessed to the player (this game, or to date in
    the season / league-part files).
  penalty_minutes_per_game: Average penalty minutes per game played.
  player_id: Player id (playerId key space, per bucket, stable across games and seasons).
  points: 'points in total (points_home + points_away: the body splits it by home
    and away games).'
  points_away: 'Split by venue: `home` = in the player''s home games, `away` = in
    away games.'
  points_home: 'Split by venue: `home` = in the player''s home games, `away` = in
    away games.'
  points_per_game: Average goals plus assists per game played.
  position: 'Position code: `GK` goalie, `DE` defence, `FW` / `FO` forward (FO meaning
    unverified).'
  positive: 'Plus: on ice for goals for at even strength or shorthanded.'
  pp_goals: Power-play goals.
  sh_goals: Shorthanded goals.
  shifts: Shifts the player took (this game, or to date in the season / league-part
    files).
  shifts_per_game: Average shifts per game played.
  shot_efficiency: Shooting percentage, goals / shots on goal x 100.
  shots_attempts: Shot attempts (on goal + missed + blocked).
  shots_blocked: This player's shot attempts that were blocked.
  shots_missed: This player's shot attempts that missed the net.
  shots_on_goal: 'shots_on_goal in total (shots_on_goal_home + shots_on_goal_away:
    the body splits it by home and away games).'
  shots_on_goal_away: 'Split by venue: `home` = in the player''s home games, `away`
    = in away games.'
  shots_on_goal_home: 'Split by venue: `home` = in the player''s home games, `away`
    = in away games.'
  stick: 'Handedness: `left` or `right`; null when unknown.'
  surname: Player last name.
  team_shortcut: Three-letter team code.
  time_on_ice: Time on ice, whole seconds (`0` when not tracked).
  time_on_ice_per_game: Time on ice per game, seconds.
  time_on_ice_pp: Time on ice on the power play (`PP`) or shorthanded (`SH`), whole
    seconds.
  time_on_ice_sh: Time on ice on the power play (`PP`) or shorthanded (`SH`), whole
    seconds.
  weight: Weight in kg; `0` placeholder when unknown.
del_roster:
  captain: True for the team captain.
  jersey: Jersey number.
  match_player_id: Match-player id (one row per player per game; a different key space
    from the player id); joins to `matchPlayerId` in the same game's roster and events
    only.
  name: Player first name.
  player_id: Player id (player key space, per bucket, stable across games and seasons);
    joins to `playerId` in rosters, events, boxscores and leaderboards.
  position: 'Position code: `GK` goalie, `DE` defence, `FW` / `FO` forward (FO meaning
    unverified).'
  slot: 'Line slot, three digits <group><line><position>: group 1 = goalies (101,
    102), 2 = defence pairs, 3 = forward lines.'
  starting_six: True for the six players who started the game.
  surname: Player last name.
  team_side: 'Team of the row: home or visitor.'
del_schedule:
  actual_time_alias: 'Short game-state code: `K` = finished (Czech `konec`), `0` =
    not started.'
  actual_time_name: Display label of the game state in the bucket's language, e.g.
    `end`, `Ende`, `before game`.
  contumacy: True when the result was awarded by forfeit.
  extra_time: True when the game went to overtime.
  final_score_guest: Visiting team goals in that span.
  final_score_home: Home team goals in that span.
  first_period_score_guest: Visiting team goals in that span.
  first_period_score_home: Home team goals in that span.
  guest_id: Team id (team key space, per bucket, stable across seasons); joins to
    `league-matches` `home.id` / `guest.id` and the `{team_id}` path param.
  guest_name: Team display name.
  guest_shortcut: Three-letter team code.
  home_id: Team id (team key space, per bucket, stable across seasons); joins to `league-matches`
    `home.id` / `guest.id` and the `{team_id}` path param.
  home_name: Team display name.
  home_shortcut: Three-letter team code.
  last_event_time: Game second of the latest event, of game time from the opening
    face-off (0-3600 in regulation, continuing through overtime).
  league: League display name, e.g. `DEL`, `EIHL`, `Metal Ligaen`.
  league_id: League id (per-bucket competition key space); joins to the `{league_id}`
    path param.
  match_id: Match id (per-bucket match key space); joins to the {match_id} path param
    of the game wrappers.
  overtime_count: Number of overtime periods played; null in the samples.
  overtime_score_guest: Visiting team goals in overtime (present once a game of the
    season went to overtime).
  overtime_score_home: Home team goals in overtime (present once a game of the season
    went to overtime).
  real_end_date: Actual end, local `YYYY-MM-DD HH:MM:SS`.
  round: Round number as a string (`"1"`, `"249"`); DEL values carry a leading U+FEFF
    byte-order mark, empty string in Denmark.
  season: Season by its END year (2027 = 2026/27); the body's START-year key plus
    one.
  second_period_score_guest: Visiting team goals in that span.
  second_period_score_home: Home team goals in that span.
  shooting: True when the game was decided by a shootout.
  shootout_score_guest: Visiting team shootout goals (present once a game of the season
    went to a shootout).
  shootout_score_home: Home team shootout goals (present once a game of the season
    went to a shootout).
  start_date: Scheduled face-off, local `YYYY-MM-DD HH:MM:SS`; DEL playoff placeholders
    read `0000-00-00 ...`.
  status: 'Match status: `BEFORE_MATCH`, `LIVE`, `AFTER_MATCH`.'
  third_period_score_guest: Visiting team goals in that span.
  third_period_score_home: Home team goals in that span.
del_shifts:
  duration: Shift length in seconds (end_time - start_time).
  end_real_time: Shift end, local wall clock.
  end_time: Shift end, game second.
  player_id: Player id (player key space, per bucket, stable across games and seasons);
    joins to `playerId` in rosters, events, boxscores and leaderboards.
  player_name: Player full name.
  shift_id: Shift id within the shift files.
  start_real_time: Shift start, local wall clock.
  start_time: Shift start, game second.
  team_id: Team id (team key space, per bucket, stable across seasons); joins to `league-matches`
    `home.id` / `guest.id` and the `{team_id}` path param.
  team_name: Team display name.
del_shots:
  coordinate_x: 'Shot x along the rink LENGTH, centre ice = 0, about -100..100 (units
    unverified, plausibly percent of half-length). Normalised to the attacking direction:
    each team keeps one sign for the whole game, the home team positive in the three
    sample games. DEL sends two-decimal floats, ICEHL and EIHL whole numbers (`-71.0`).'
  coordinate_y: Shot y across the rink WIDTH, centre line = 0, about -100..100 (units
    and which board is positive unverified). DEL two-decimal floats, ICEHL and EIHL
    whole numbers.
  date: Game date `YYYY-MM-DD`.
  first_name: First name of the shooter.
  home_id: Team id (team key space, per bucket, stable across seasons); joins to `league-matches`
    `home.id` / `guest.id` and the `{team_id}` path param.
  home_name: Team display name.
  home_shortcut: Three-letter team code.
  is_goal: True when the shot result code is 4 (goal).
  jersey: Jersey number.
  last_name: Last name of the shooter.
  match_id: Match id (per-bucket match key space); joins to the {match_id} path param
    of the game wrappers.
  match_shot_resutl_id: 'Shot result code (the provider''s typo kept): `4` = goal;
    `1` / `2` / `3` probably on goal / missed / blocked (unverified). A code, not
    a joinable id.'
  player_id: Player id (player key space, per bucket, stable across games and seasons);
    joins to `playerId` in rosters, events, boxscores and leaderboards.
  polygon: Rink area of the shot, `{home|away}_{top|center|bottom|defense}_polygon`
    (DEL).
  real_date: Wall-clock local time, `YYYY-MM-DD HH:MM:SS`.
  shot_id: Shot id within the shot files.
  shot_result_id: 'Shot result code, the same value as match_shot_resutl_id: 4 = goal
    (verified); 1, 2 and 3 (on goal / missed / blocked in the widgets) are unverified.'
  team_id: Team id (team key space, per bucket, stable across seasons); joins to `league-matches`
    `home.id` / `guest.id` and the `{team_id}` path param.
  team_side: 'Team of the row: home or visitor.'
  time: Seconds of game time from the opening face-off (0-3600 in regulation, continuing
    through overtime).
  visitor_id: Team id (team key space, per bucket, stable across seasons); joins to
    `league-matches` `home.id` / `guest.id` and the `{team_id}` path param.
  visitor_name: Team display name.
  visitor_shortcut: Three-letter team code.
  xg: Expected-goals value of the shot (ICEHL and EIHL only; null elsewhere).
  xg_type: Shot-danger class from the xG model, e.g. LD / MD / HD (ICEHL and EIHL
    only; null elsewhere).
del_standings:
  bonus: Bonus or deduction points (DEL).
  datetime: Standings computed at, local time, `YYYY-MM-DD HH:MM:SS`.
  games: Games played.
  league_part_id: 'League part id (league-part key space, per bucket: one stage of
    a competition, e.g. ICEHL 56 = 2026/27 regular season); joins to `league_part_id`
    in league-matches and the `{league_part_id}` path param.'
  league_part_name: League part name, e.g. `DEL 2026/27`.
  losses: Losses in regulation time.
  losses_ot: Losses after overtime or shootout.
  name: Team display name.
  only_ot_losts: Losses in overtime.
  only_ot_wins: Wins in overtime.
  only_so_losts: Losses in a shootout.
  only_so_wins: Wins in a shootout.
  part_team_id: 'Team-in-league-part id (its own key space: one team in one league
    part); no other captured file carries it.'
  points: Table points.
  position: Table position, 1 = first.
  ppg: Points per game.
  score1: Goals the team scored (goals for).
  score2: Goals against.
  shortcut: Three-letter team code.
  state: Standings state flag (e.g. live or final; values unverified).
  team_id: Team id (per-bucket team key space); joins to home_id / guest_id in the
    schedule.
  ties: Ties (0 under current rules).
  wins: Wins in regulation (DEL, EIHL, Denmark) or all wins (ICEHL, see `winsReg`);
    definition per bucket unverified.
  wins_ot: Wins after overtime or shootout.
