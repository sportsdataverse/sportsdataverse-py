lkl_game_info:
  arena: Arena name as printed on the game page header.
  attendance: Attendance text as printed ('1097 žiūrovai' = 1097 spectators).
  attendance_count: Attendance as an integer, parsed from the attendance text; null
    when the page has none.
  away_assistant_coach: 'Away assistant coach''s full name (same caveat as the head
    coach: current staff on old games).'
  away_coach: 'Away head coach''s full name as stored for the team: on old games the
    CURRENT coach, not the historical one.'
  away_short_name: Away three-letter team code ('RYT'); can be the club's current
    code on old games.
  away_slug: 'Away team slug (key space: lkl.lt clubs; the {slug} of lkl.lt/komandos/{slug});
    joins the team slugs of lkl_results and lkl_standings.'
  away_team: 'Away team name as of that game (historical: ''Lietuvos Rytas'' in 2007-08).'
  away_team_id: 'Away team id (key space: lkl.lt clubs, stable across seasons and
    renamings; joins the team_id of every other frame). Not the Genius team id.'
  away_winner: True when the away team won the game.
  game_id: 'lkl.lt game id (key space: LKL games; the {gameId} of every route). Not
    sequential by season before 2018-19; not the Genius matchId. A frame parsed from
    a bare body has a null game_id when the body does not echo it (the runtime stamps
    it under _request).'
  game_status: 'Game state label in Lithuanian: ''Pasibaigė'' = finished, the only
    value served (the runtime refuses an unfinished game).'
  has_actions: True when the game has play-by-play events (2024-25 onward); false
    on older games.
  home_assistant_coach: 'Home assistant coach''s full name (same caveat as the head
    coach: current staff on old games).'
  home_coach: 'Home head coach''s full name as stored for the team: on old games the
    CURRENT coach, not the historical one.'
  home_short_name: Home three-letter team code ('RYT'); can be the club's current
    code on old games.
  home_slug: 'Home team slug (key space: lkl.lt clubs; the {slug} of lkl.lt/komandos/{slug});
    joins the team slugs of lkl_results and lkl_standings.'
  home_team: 'Home team name as of that game (historical: ''Lietuvos Rytas'' in 2007-08).'
  home_team_id: 'Home team id (key space: lkl.lt clubs, stable across seasons and
    renamings; joins the team_id of every other frame). Not the Genius team id.'
  home_winner: True when the home team won the game.
  is_streaming: True while a live stream is on; false on finished games.
  referees: 'Referee names, comma-separated, crew chief first; ''Nepaskelbta'' = not
    announced (old games). Names only: the site publishes no official''s contact or
    birth data.'
  start_date: Game date (Europe/Vilnius), parsed from the page header 'YYYY m. <month>
    D d., HH:MM'.
  start_time: Tip-off 'HH:MM' local time (Europe/Vilnius by the site's wording; the
    page carries no offset).
lkl_game_players:
  game_id: 'lkl.lt game id (key space: LKL games; the {gameId} of every route). Not
    sequential by season before 2018-19; not the Genius matchId. A frame parsed from
    a bare body has a null game_id when the body does not echo it (the runtime stamps
    it under _request).'
  jersey: Shirt number as a string (so '00' and '0' stay distinct).
  player: Full player name as the game page prints it.
  player_id: 'lkl.lt player id (key space: lkl.lt persons, stable across seasons).
    Joins the shot chart''s player_id; the box score, leaders and play-by-play carry
    the slug, which this frame maps.'
  slug: 'Player slug (key space: lkl.lt persons; the {slug} of lkl.lt/zaidejai/{slug}).
    Join key to the player_slug of the box score, leaders and play-by-play.'
  team_id: 'lkl.lt team id (key space: lkl.lt clubs, STABLE across seasons and renamings:
    6 = Rytas). Joins lkl_game_info home_team_id / away_team_id; not the Genius team
    id. Null on a frame parsed from a bare body.'
  team_side: 'Side of the game the row belongs to: home or away (the game page''s
    teams_info side; the box score, leaders and plays say home / away, and gameStatistics
    is keyed by team id so the runtime supplies the side).'
lkl_game_score:
  away_score: Away team points on the score line.
  clock: 'Clock text, NOT a state flag: an old game keeps ''1 KĖLINYS - 10:00'' after
    the final; a finished overtime game reads ''1 pratęsimas - 00:00''.'
  game_id: 'lkl.lt game id (key space: LKL games; the {gameId} of every route). Not
    sequential by season before 2018-19; not the Genius matchId. A frame parsed from
    a bare body has a null game_id when the body does not echo it (the runtime stamps
    it under _request).'
  home_score: Home team points on the score line.
lkl_game_stats:
  away_graph_length: 'Bar length in percent: shooting rows = the percentage as a string
    (''71.4''); counting rows = this side''s share of the two values, 0-100, a number
    (43 vs 37 -> 53.75).'
  away_percentage: 'Shooting rows only (absent on counting rows): percentage with
    ONE decimal and a % sign (''71.4%'').'
  away_value: 'Shooting rows: ''made/attempted'' string (''25/35''); counting rows:
    integer.'
  away_winning: True when this side's bar is highlighted as the better one (both false
    on a tie).
  game_id: 'lkl.lt game id (key space: LKL games; the {gameId} of every route). Not
    sequential by season before 2018-19; not the Genius matchId. A frame parsed from
    a bare body has a null game_id when the body does not echo it (the runtime stamps
    it under _request).'
  group: 'Bar group the tab also shows the line in: shooting (2PT, 3PT, free throws)
    or main (rebounds, assists, steals); null for lines only in the full list.'
  home_graph_length: 'Bar length in percent: shooting rows = the percentage as a string
    (''71.4''); counting rows = this side''s share of the two values, 0-100, a number
    (43 vs 37 -> 53.75).'
  home_percentage: 'Shooting rows only (absent on counting rows): percentage with
    ONE decimal and a % sign (''71.4%'').'
  home_value: 'Shooting rows: ''made/attempted'' string (''25/35''); counting rows:
    integer.'
  home_winning: True when this side's bar is highlighted as the better one (both false
    on a tie).
  label: 'Row label in LITHUANIAN: ''Metimai iš žaidimo'' = field goals, ''Dvitaškiai
    metimai'' = 2PT, ''Tritaškiai metimai'' = 3PT, ''Baudų metimai'' = free throws,
    ''Atkovoti kamuoliai'' = rebounds, ''Atkovoti kamuoliai gynyboje'' = defensive
    rebounds, ''Atkovoti kamuoliai puolime'' = offensive rebounds, ''Rezultatyvūs
    perdavimai'' = assists, ''Perimti kamuoliai'' = steals, ''Blokai'' = blocks, ''Klaidos''
    = turnovers, ''Pražangos'' = fouls, ''Taškai'' = points, ''Taškai po klaidų''
    = points off turnovers, ''Taškai greitose atakose'' = fast-break points, ''Taškai
    antru bandymu'' = second-chance points, ''Atsarginių žaidėjų taškai'' = bench
    points.'
  stat: English code for the site's Lithuanian label (field_goals, two_pointers, three_pointers,
    free_throws, rebounds, assists, steals, blocks, turnovers, fouls, points, ...);
    null for a label this package does not know.
lkl_lead_chart:
  clock: 'Clock REMAINING in the period as the site''s ''mm:ss:00'' text (a trailing
    '':00''): ''10:00:00'' is the period start.'
  column_height: 'Bar height for the site''s chart: |diff| / maxDiff x 50 (percent
    of the chart).'
  diff: Home minus away score at that chart point (signed integer).
  game_id: 'lkl.lt game id (key space: LKL games; the {gameId} of every route). Not
    sequential by season before 2018-19; not the Genius matchId. A frame parsed from
    a bare body has a null game_id when the body does not echo it (the runtime stamps
    it under _request).'
  period: 'Period number: 1-4 regulation, 5 the first overtime, 6 the second.'
  score_away: Away cumulative score at that point (the site sends a string).
  score_home: Home cumulative score at that point (the site sends a string).
lkl_leaders:
  category: 'Leader category: points, total_rebounds, assists, efficiency, steals
    or blocks.'
  category_label: Category label in Lithuanian ('Pelnomi taškai' = points scored,
    'Naudingumas' = efficiency rating).
  game_id: 'lkl.lt game id (key space: LKL games; the {gameId} of every route). Not
    sequential by season before 2018-19; not the Genius matchId. A frame parsed from
    a bare body has a null game_id when the body does not echo it (the runtime stamps
    it under _request).'
  player: Player name as the site prints it in this route (the box score short form
    'I. Surname', other routes the full name).
  player_id: 'lkl.lt player id (key space: lkl.lt persons, stable across seasons).
    Resolved from the player slug through the game roster the runtime stamps from
    the game page; null on a bare body or a slug the roster lacks.'
  player_slug: 'lkl.lt player slug (key space: lkl.lt persons; the {slug} of lkl.lt/zaidejai/{slug},
    stable across seasons). Join key to lkl_game_players.slug.'
  rank: 'Place in the team''s category list: 1 = the category leader, 2 and up = the
    runners-up in the order the site lists them (up to 4).'
  team_id: 'lkl.lt team id (key space: lkl.lt clubs, STABLE across seasons and renamings:
    6 = Rytas). Joins lkl_game_info home_team_id / away_team_id; not the Genius team
    id. Null on a frame parsed from a bare body.'
  team_side: 'Side of the game the row belongs to: home or away (the game page''s
    teams_info side; the box score, leaders and plays say home / away, and gameStatistics
    is keyed by team id so the runtime supplies the side).'
  value: The player's count in the row's category.
lkl_pbp:
  clock: Game clock REMAINING in the period as 'mm:ss' (it counts down from 10:00,
    from 05:00 in overtime).
  clock_seconds: The clock REMAINING as whole seconds (08:34 = 514), derived by the
    parser.
  description: Event text in Lithuanian, one fixed phrase per type and subtype ('3
    taškų metimas pataikytas' = 3-point shot made).
  event_num: Play sequence number the parser assigns, 1 = the first play of the game
    (the site lists plays newest first per period, with no id).
  game_id: 'lkl.lt game id (key space: LKL games; the {gameId} of every route). Not
    sequential by season before 2018-19; not the Genius matchId. A frame parsed from
    a bare body has a null game_id when the body does not echo it (the runtime stamps
    it under _request).'
  is_points_info: True on lines that changed the score (made shots and free throws).
  period: 'Period of the play. Regulation lines carry it in the site''s body; overtime
    lines come as one merged list without it, so the parser derives it (oldest overtime
    = 5, each period-end line closes one): checked on a one-overtime game only, so
    multi-overtime numbering is unverified.'
  period_type: regular for periods 1-4, overtime from period 5.
  player: Player name as the site prints it in this route (the box score short form
    'I. Surname', other routes the full name).
  player_id: 'lkl.lt player id (key space: lkl.lt persons, stable across seasons).
    Resolved from the player slug through the game roster the runtime stamps from
    the game page; null on a bare body or a slug the roster lacks.'
  player_slug: 'lkl.lt player slug (key space: lkl.lt persons; the {slug} of lkl.lt/zaidejai/{slug},
    stable across seasons). Join key to lkl_game_players.slug.'
  score_away: Away points after the play (on every line, not only scoring lines).
  score_home: Home points after the play (on every line, not only scoring lines).
  subtype: 'Event subtype (English code; '''' when none). 2pt/3pt: shot kind (jumpshot,
    layup, drivinglayup, reverselayup, dunk, alleyoop, alleyoopdunk, tipinlayup, tipindunk,
    hookshot, fadeaway, floatingjumpshot, pullupjumpshot, stepbackjumpshot, turnaroundjumpshot,
    eurostep). freethrow: ''NofM'' = attempt N of M (1of1, 1of2, 2of2, 1of3, 2of3,
    3of3). rebound: offensive / defensive. foul: personal, offensive, technical, benchTechnical.
    turnover: badpass, ballhandling, offensive, outofbounds, travel, backcourt (backcourt
    violation), 3sec, 24sec. substitution: in / out. timeout: full (team), officials.
    jumpball: startperiod, won, lost, heldball. headcoachchallenge: the challenged
    call (foul, outofbounds). period / game: start, end.'
  success: 'Shots and free throws: true = made. Every other type: always true.'
  team_id: 'lkl.lt team id (key space: lkl.lt clubs, STABLE across seasons and renamings:
    6 = Rytas). Joins lkl_game_info home_team_id / away_team_id; not the Genius team
    id. Null on a frame parsed from a bare body.'
  team_side: 'Side of the acting team (the line''s is_home flag): home or away.'
  type: 'Event type (English code): 2pt, 3pt, freethrow, rebound, assist, steal, block,
    turnover, foul, foulon (foul drawn), substitution, timeout, jumpball, headcoachchallenge,
    period, game.'
lkl_period_scores:
  game_id: 'lkl.lt game id (key space: LKL games; the {gameId} of every route). Not
    sequential by season before 2018-19; not the Genius matchId. A frame parsed from
    a bare body has a null game_id when the body does not echo it (the runtime stamps
    it under _request).'
  period: 'Period number: 1-4 regulation, 5 the first overtime, 6 the second.'
  period_type: regular for periods 1-4, overtime from period 5.
  points: Points the team scored IN this period (not cumulative); keyed by period
    in the site's quarter_scores.
  team_id: 'lkl.lt team id (key space: lkl.lt clubs, STABLE across seasons and renamings:
    6 = Rytas). Joins lkl_game_info home_team_id / away_team_id; not the Genius team
    id. Null on a frame parsed from a bare body.'
  team_side: 'Side of the game the row belongs to: home or away (the game page''s
    teams_info side; the box score, leaders and plays say home / away, and gameStatistics
    is keyed by team id so the runtime supplies the side).'
lkl_player_box:
  assists: 'Cell: Assists (RP, Rezultatyvūs perdavimai).'
  blocks: 'Cell: Blocks made (BL, Blokai).'
  blocks_received: 'Cell: Shots of this player/team that were blocked (GB, Gauti blokai).'
  defensive_rebounds: 'Cell: Defensive rebounds (AKG, Atkovoti kamuoliai gynyboje).'
  efficiency: 'Cell: Efficiency rating (EF, Efektyvumas; see gameStatistics efficiency).'
  fg2_attempted: Two-point field goals attempted.
  fg2_made: Two-point field goals made.
  fg2_pct: Two-point percentage, 0-100 (one-decimal string on the site; 0 when there
    were no attempts).
  fg3_attempted: Three-point field goals attempted.
  fg3_made: Three-point field goals made.
  fg3_pct: Three-point percentage, 0-100 (one-decimal string on the site; 0 when there
    were no attempts).
  fg_attempted: Field goals attempted, 2PT + 3PT.
  fg_made: Field goals made, 2PT + 3PT (the 'made' half of the 'made/attempted' cell).
  fg_pct: Field-goal percentage, 0-100 (the site's one-decimal string; 0 when there
    were no attempts).
  fouls: 'Cell: Personal fouls committed (AP, Asmeninės pražangos).'
  fouls_on: 'Cell: Fouls drawn (IP, Išprovokuotos pražangos).'
  ft_attempted: Free throws attempted.
  ft_made: Free throws made.
  ft_pct: Free-throw percentage, 0-100 (one-decimal string on the site; 0 when there
    were no attempts).
  game_id: 'lkl.lt game id (key space: LKL games; the {gameId} of every route). Not
    sequential by season before 2018-19; not the Genius matchId. A frame parsed from
    a bare body has a null game_id when the body does not echo it (the runtime stamps
    it under _request).'
  is_active: False in every sample, finished games included; by name the player is
    on court right now (live games), unverified.
  is_captain: True for the team captain.
  is_starter: True for the five starters.
  jersey: 'Cell: Shirt number, a STRING (''77''); page column # (Marškinėlių numeris).'
  offensive_rebounds: 'Cell: Offensive rebounds (AKP, Atkovoti kamuoliai puolime).'
  player: Player name as the site prints it in this route (the box score short form
    'I. Surname', other routes the full name).
  player_id: 'lkl.lt player id (key space: lkl.lt persons, stable across seasons).
    Resolved from the player slug through the game roster the runtime stamps from
    the game page; null on a bare body or a slug the roster lacks.'
  player_slug: 'lkl.lt player slug (key space: lkl.lt persons; the {slug} of lkl.lt/zaidejai/{slug},
    stable across seasons). Join key to lkl_game_players.slug.'
  plus_minus: 'Cell: Plus/minus while on court (+/- rodiklis).'
  points: 'Cell: Points (TŠK, Taškai).'
  seconds_played: 'Time on court in seconds (the page''s ''mm:ss'' minutes: 32:54
    = 1974).'
  steals: 'Cell: Steals (PK, Perimti kamuoliai).'
  team_id: 'lkl.lt team id (key space: lkl.lt clubs, STABLE across seasons and renamings:
    6 = Rytas). Joins lkl_game_info home_team_id / away_team_id; not the Genius team
    id. Null on a frame parsed from a bare body.'
  team_side: 'Side of the game the row belongs to: home or away (the game page''s
    teams_info side; the box score, leaders and plays say home / away, and gameStatistics
    is keyed by team id so the runtime supplies the side).'
  total_rebounds: 'Cell: Total rebounds (AK, Atkovoti kamuoliai).'
  turnovers: 'Cell: Turnovers (KL, Klaidos).'
lkl_results:
  arena: Arena name ('Arena dar nežinoma' = arena not yet known, on some 2007-08 games).
  away_code: Away three-letter team code.
  away_name: Away team name as printed.
  away_score: Away team points in the game (the final score).
  away_slug: 'Away team: Team slug (key space: lkl.lt clubs; the {slug} of https://lkl.lt/komandos/{slug};
    one per club, stable across renamings: ''rytas'' for Lietuvos Rytas / Rytas).
    The results and standings rows carry only this; the game page teams_info gives
    slug + id.'
  city: City, from 'Arena , City'; null when the venue line has no city (2007-08 'Arena
    dar nežinoma').
  date: Game date from the site's Lithuanian day header; checked to fall in the season
    (Aug 1 - Jul 31).
  game_id: 'lkl.lt game id (key space: LKL games; the {gameId} of every route). Not
    sequential by season before 2018-19; not the Genius matchId. A frame parsed from
    a bare body has a null game_id when the body does not echo it (the runtime stamps
    it under _request).'
  home_code: Home three-letter team code ('LIE').
  home_name: 'Home team name as printed (the logo alt text; the CURRENT club name
    even on old games: 2007-08 ''Rytas'').'
  home_score: Home team points in the game (the final score).
  home_slug: 'Home team: Team slug (key space: lkl.lt clubs; the {slug} of https://lkl.lt/komandos/{slug};
    one per club, stable across renamings: ''rytas'' for Lietuvos Rytas / Rytas).
    The results and standings rows carry only this; the game page teams_info gives
    slug + id.'
  season_end_year: Season END year (2026 = 2025-26), read from the season label 'YYYY-YYYY
    m. sezonas'.
  season_id: 'Results season id (key space: lkl.lt championships; LKL 2026-27 = 49436).
    From 2016-17 it is the Genius LiveStats competition id (leagueId 110).'
  time: Tip-off 'HH:MM', Europe/Vilnius.
  weekday: Weekday of the header, translated to English ('šeštadienis' -> 'Saturday').
  winner_highlighted: 'Which side''s score the page sets in bold: home or away (the
    winner).'
lkl_shots:
  area: Court zone code (e.g. inthepaint, underbasket, outsideleft); left and right
    are from the shooter's view, so zones are point-symmetric between the two baskets.
  game_id: 'lkl.lt game id (key space: LKL games; the {gameId} of every route). Not
    sequential by season before 2018-19; not the Genius matchId. A frame parsed from
    a bare body has a null game_id when the body does not echo it (the runtime stamps
    it under _request).'
  made: True when the shot was made, false when missed.
  period: 'Period number: 1-4 regulation, 5 the first overtime, 6 the second.'
  period_type: regular for periods 1-4, overtime from period 5.
  player_id: 'lkl.lt player id (key space: lkl.lt persons, stable across seasons).
    Resolved from the player slug through the game roster the runtime stamps from
    the game page; null on a bare body or a slug the roster lacks.'
  player_slug: 'lkl.lt player slug (key space: lkl.lt persons; the {slug} of lkl.lt/zaidejai/{slug},
    stable across seasons). Join key to lkl_game_players.slug.'
  shot_id: 'Shot event id (key space: lkl.lt shot events, increasing over time); joins
    nothing else and is not the Genius action number.'
  side: 'Basket half the shot is at: LEFT (x < 50) or RIGHT, except backcourt heaves
    (area backcourt).'
  team_id: 'lkl.lt team id (key space: lkl.lt clubs, STABLE across seasons and renamings:
    6 = Rytas). Joins lkl_game_info home_team_id / away_team_id; not the Genius team
    id. Null on a frame parsed from a bare body.'
  team_side: 'Side of the shooter''s team (the line''s is_home flag): home or away.'
  type: 2pt or 3pt (free throws are not in the chart).
  x: 'Court x position: percent (0-100) of the LENGTH of a horizontal full court from
    the left baseline (baskets near 5 and 95). Teams switch baskets at half-time;
    metres (x / 100 x 28) are an inference.'
  y: 'Court y position: percent (0-100) of the court WIDTH (baskets at 50). Metres
    (y / 100 x 15) are an inference; which sideline is y = 0 is unverified.'
lkl_standings:
  last5: Last five results (Paskutinės 5) as W / L letters in the order the page renders
    them, left to right; fewer than five early in a season; null in the final table.
  lost: Losses (Pr., pralaimėjimai); null in the final table.
  played: Games played (Rng., rungtynės); null in the final table.
  points_against_avg: Points allowed per game (second number of Tšk. vid.); null in
    the final table.
  points_for_avg: Points scored per game (first number of Tšk. vid.); null in the
    final table.
  position: Rank in the table (Poz.); in the final table the final place.
  season_end_year: Season END year (2026 = 2025-26), read from the season label 'YYYY-YYYY
    m. sezonas'.
  season_id: 'STANDINGS season id (a separate small key space: 35 = 2026-27, 1 = 2016-17,
    24 = 1993-94); NOT the results season id.'
  streak: 'Current streak (Serija) as a signed integer: 27 = 27 wins in a row, -1
    = one loss. Null outside the full table.'
  table: 'Which table the row comes from: full (overall), home, away or final (the
    final ranking).'
  team_name: Team name as printed for that season ('Lietuvos Rytas' in 2007-08).
  team_slug: 'Team slug (key space: lkl.lt clubs; the {slug} of https://lkl.lt/komandos/{slug};
    one per club, stable across renamings: ''rytas'' for Lietuvos Rytas / Rytas).
    The results and standings rows carry only this; the game page teams_info gives
    slug + id.'
  win_pct: Win percentage 0-100 (Laim.%); null in the home, away and final tables
    and when the site prints '-' (2007-08).
  won: Wins (Per., pergalės); null in the final table.
lkl_summary:
  away_graph_length: 'Bar length in percent: shooting rows = the percentage as a string
    (''71.4''); counting rows = this side''s share of the two values, 0-100, a number
    (43 vs 37 -> 53.75).'
  away_percentage: 'Shooting rows only (absent on counting rows): percentage with
    ONE decimal and a % sign (''71.4%'').'
  away_value: 'Shooting rows: ''made/attempted'' string (''25/35''); counting rows:
    integer.'
  away_winning: True when this side's bar is highlighted as the better one (both false
    on a tie).
  game_id: 'lkl.lt game id (key space: LKL games; the {gameId} of every route). Not
    sequential by season before 2018-19; not the Genius matchId. A frame parsed from
    a bare body has a null game_id when the body does not echo it (the runtime stamps
    it under _request).'
  group: 'Always null here: the flat comparison list has no groups (lkl_game_stats
    labels them).'
  home_graph_length: 'Bar length in percent: shooting rows = the percentage as a string
    (''71.4''); counting rows = this side''s share of the two values, 0-100, a number
    (43 vs 37 -> 53.75).'
  home_percentage: 'Shooting rows only (absent on counting rows): percentage with
    ONE decimal and a % sign (''71.4%'').'
  home_value: 'Shooting rows: ''made/attempted'' string (''25/35''); counting rows:
    integer.'
  home_winning: True when this side's bar is highlighted as the better one (both false
    on a tie).
  label: 'Row label in LITHUANIAN: ''Metimai iš žaidimo'' = field goals, ''Dvitaškiai
    metimai'' = 2PT, ''Tritaškiai metimai'' = 3PT, ''Baudų metimai'' = free throws,
    ''Atkovoti kamuoliai'' = rebounds, ''Atkovoti kamuoliai gynyboje'' = defensive
    rebounds, ''Atkovoti kamuoliai puolime'' = offensive rebounds, ''Rezultatyvūs
    perdavimai'' = assists, ''Perimti kamuoliai'' = steals, ''Blokai'' = blocks, ''Klaidos''
    = turnovers, ''Pražangos'' = fouls, ''Taškai'' = points, ''Taškai po klaidų''
    = points off turnovers, ''Taškai greitose atakose'' = fast-break points, ''Taškai
    antru bandymu'' = second-chance points, ''Atsarginių žaidėjų taškai'' = bench
    points.'
  stat: English code for the site's Lithuanian label (field_goals, two_pointers, three_pointers,
    free_throws, rebounds, assists, steals, blocks, turnovers, fouls, points, ...);
    null for a label this package does not know.
lkl_team_box:
  assists: Team assists in the game (count).
  bench_points: Points by players who did not start.
  biggest_lead: This team's biggest lead in points (0 when it never led).
  biggest_scoring_run: This team's longest unanswered scoring run, in points.
  blocks: Blocks made by the team in the game (count).
  blocks_received: Shots of this team that were blocked.
  defensive_rebounds: Team defensive rebounds in the game (count).
  efficiency: 'Team efficiency rating (Efektyvumas), a PIR-style index (points + rebounds
    + assists + steals + blocks + fouls drawn - missed shots - turnovers - shots blocked
    - fouls). The exact formula is unverified: game 11590 home gives 121 where that
    formula gives 122.'
  fast_break_points: Fast-break points; 0 on the 2007-08 sample.
  field_goals_2pt_percentage: Two-point percentage, 0-100 float (the site sends a
    two-decimal string).
  field_goals_3pt_percentage: Three-point percentage, 0-100 float (the site sends
    a two-decimal string).
  field_goals_attempted_2pt: Two-point field goals attempted.
  field_goals_attempted_3pt: Three-point field goals attempted.
  field_goals_attempted_total: Field goals attempted, 2PT + 3PT.
  field_goals_made_2pt: Two-point field goals made.
  field_goals_made_3pt: Three-point field goals made.
  field_goals_made_total: Field goals made, 2PT + 3PT.
  field_goals_percentage: Field-goal percentage, 0-100 float (the site sends a two-decimal
    string).
  fouls: Fouls committed.
  fouls_on: Fouls drawn (fouls committed on this team).
  free_throws_attempted: Free throws attempted by the team in the game (count).
  free_throws_made: Free throws made by the team in the game (count).
  free_throws_percentage: Free-throw percentage, 0-100 float (the site sends a two-decimal
    string).
  game_id: 'lkl.lt game id (key space: LKL games; the {gameId} of every route). Not
    sequential by season before 2018-19; not the Genius matchId. A frame parsed from
    a bare body has a null game_id when the body does not echo it (the runtime stamps
    it under _request).'
  lead_changes: Lead changes in the game (the same value on both rows).
  offensive_rebounds: Team offensive rebounds in the game (count).
  points: 'Team points: the final score (the capture banks finished games only).'
  points_in_paint: Points in the paint; 0 on the 2007-08 sample.
  points_off_turnovers: Points off the opponent's turnovers; 0 on the 2007-08 sample
    (not tracked then).
  second_chance_points: Second-chance points (after an offensive rebound); 0 on the
    2007-08 sample.
  seconds_played: Summed playing time of all the team's players in seconds (12000
    = 5 x 40:00; 13500 with one overtime).
  steals: Team steals in the game (count).
  team_id: 'lkl.lt team id (key space: lkl.lt clubs, STABLE across seasons and renamings:
    6 = Rytas). Joins lkl_game_info home_team_id / away_team_id; not the Genius team
    id. Null on a frame parsed from a bare body.'
  team_side: 'Side of the game the row belongs to: home or away (the game page''s
    teams_info side; the box score, leaders and plays say home / away, and gameStatistics
    is keyed by team id so the runtime supplies the side).'
  tie_results: Times the score was tied (the same value on both rows).
  time_leading: Seconds this team led during the game (the site sends it as a string;
    1892 = 31:32).
  total_rebounds: Team rebounds, offensive + defensive (count).
  turnovers: Team turnovers in the game (count).
