  status: Player status in the site's language (Actif, Blesse).
  team_name: Team name in the site's language.
  website_id: Site config id the body came from (12 LNB, 14 LNBP, 3 NBL1, 13 El Salvador,
    22 Panama, 236 Austria, 326 Montenegro), read from the body's links.self.
atrium_seasons:
  abbreviation_local: Local abbreviation of the season; null in every body seen.
  competition_id: Competition UUID; pass it as competition_id to pick one of several
    seasons of an END year.
  competition_name: Competition name in the site's language; the same name can appear
    for several years.
  is_default_season: True for the season the body is about (the site's default when
    none was asked).
  season_end_year: 'Season END year (the sdv key): the site''s year + 1 on LNB (site
    12), the calendar year on the other registered sites; null when the site is unregistered,
    lists no seasons or the body has no season list.'
  season_id: Season UUID; pass it as season_id to any season-scoped wrapper.
  season_name: Season name in the site's language, e.g. Betclic ELITE 2025.
  website_id: Site config id the body came from (12 LNB, 14 LNBP, 3 NBL1, 13 El Salvador,
    22 Panama, 236 Austria, 326 Montenegro), read from the body's links.self.
  year: 'The site''s own year of the season: the START year on LNB (site 12), the
    calendar year elsewhere.'
atrium_shots:
  away_score: Away team's running score after the event.
  bib: Jersey number of the player, as text; null for team events.
  clock: Time REMAINING in the period as an ISO 8601 duration (PT10M0S at the start).
  clock_seconds: Seconds remaining in the period, parsed from clock.
  description: The event's text in the site's language (e.g. Entre-deux remporte).
  entity_id: Team UUID the event is credited to.
  event_id: Event UUID of the shot; the same event in atrium_pbp.
  event_sub_type: 'Event detail: jumpShot, layup, offensive, defensive, in, out, 1Of2,
    personal, ...; null when none.'
  event_type: 'Event type: 2pt, 3pt, freeThrow, rebound, assist, steal, block, turnover,
    foul, substitution, timeOut, jumpBall, ... (language-independent).'
  fixture_id: Game UUID (fixture); the key of every game frame and of the fixture_detail
    routes.
  home_score: Home team's running score after the event.
  period_id: 'Period number: 1-4 regulation, 11, 12, ... overtimes (not 5).'
  person_id: Player UUID of the shooter.
  person_name: Name of the shooter.
  season_id: Season UUID of the game.
  sequence: 1-based position of the shot among the shots of the game (not the pbp
    sequence).
  side: 'Side of the game the row belongs to: home or away (from the fixture''s isHome
    flag).'
  success: True when the shot was made, false when missed.
  success_label: The made / missed label in the site's language; sent on shot events
    only.
  website_id: Site config id the body came from (12 LNB, 14 LNBP, 3 NBL1, 13 El Salvador,
    22 Panama, 236 Austria, 326 Montenegro), read from the body's links.self.
  x: Shot location along the 28 m court length as percent of the court (0-100, origin
    at a corner); the home team attacks the low-x basket all game; LNBP and NBL1 clamp
    rim attempts to 5 / 95.
  y: Shot location across the 15 m width as percent of the court (0-100); which sideline
    is 0 is unverified.
