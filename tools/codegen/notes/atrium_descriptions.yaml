atrium_box_score:
  active: True when the player is on the court in a live game.
  assists: Assists (player, this game).
  bib: Jersey number the player wears, as text.
  blocks: Shots blocked (player, this game).
  blocks_received: Own shots blocked by an opponent (LNB only) (player, this game).
  did_not_play_reason: Reason the player did not play; null in every body seen.
  efficiency: Efficiency rating, from the site's own formula (player, this game).
  entity_id: Team UUID the player is rostered with for this game.
  field_goals_attempted: Field goals attempted (LNBP only) (player, this game).
  field_goals_made: Field goals made, two- and three-pointers together (LNBP only)
    (player, this game).
  field_goals_percentage: Field-goal percentage, 0-100 (LNBP only) (player, this game).
  fixture_id: Game UUID (fixture); the key of every game frame and of the fixture_detail
    routes.
  fouls_drawn: Fouls drawn (committed against the player or team; LNBP only) (player,
    this game).
  fouls_total: Fouls committed (player, this game).
  free_throws_attempted: Free throws attempted (player, this game).
  free_throws_made: Free throws made (player, this game).
  free_throws_percentage: Free-throw percentage, 0-100 (player, this game).
  minutes: Time played as an ISO 8601 duration (PT7M23S); a team's is the sum over
    its players (PT200M) (player, this game).
  participated: True when the player entered the game; false rows have null statistics.
  person_id: Player UUID (person), shared across seasons and sites.
  person_name: Player name as the site prints it (upper case on LNBP and NBL1).
  plus_minus: Plus/minus, the point differential while on court (LNB only; null in
    some team lines) (player, this game).
  points: Points scored (player, this game).
  points_fast_break: Fast-break points (LNBP only) (player, this game).
  points_three_attempted: Three-point field goals attempted (player, this game).
  points_three_made: Three-point field goals made (player, this game).
  points_three_percentage: Three-point percentage, 0-100 (player, this game).
  points_two_attempted: Two-point field goals attempted (player, this game).
  points_two_made: Two-point field goals made (player, this game).
  points_two_percentage: Two-point percentage, 0-100 (player, this game).
  position: Position code on the roster (LNB, e.g. PG); null on LNBP.
  rebounds: Total rebounds (player, this game).
  rebounds_defensive: Defensive rebounds (player, this game).
  rebounds_offensive: Offensive rebounds (player, this game).
  season_id: Season UUID of the game.
  seconds_played: Time played in whole seconds, parsed from minutes (player, this
    game).
  side: 'Side of the game the row belongs to: home or away (from the fixture''s isHome
    flag).'
  starter: True when the player started the game.
  steals: Steals (player, this game).
  turnovers: Turnovers (player, this game).
  website_id: Site config id the body came from (12 LNB, 14 LNBP, 3 NBL1, 13 El Salvador,
    22 Panama, 236 Austria, 326 Montenegro), read from the body's links.self.
atrium_competition_player_stats:
  entity_id: Team UUID decoded from the widget link (team tables only; player tables
    name the team but carry no id).
  entity_name: Team name as the site prints it; for player rows of a stat table it
    is the player's team.
  person_id: Player UUID decoded from the widget link beside the name (the tables
    carry names only); null when the link is missing or undecodable, and always null
    in team and competition bodies.
  person_name: Player name as the site prints it; null in team tables.
  season_id: Season UUID of the table; null for the competition-scoped routes (their
    bodies carry none).
  stat_key: Statistic key as the API names it (pointsPerGame, fieldGoalsMade, ...),
    unchanged from header key.
  stat_label: Longer statistic label the site shows (code in the API), in the site's
    language.
  stat_name: Short column heading the site shows for the statistic (PTS, REB), in
    the site's language.
  table_key: 'Statistics table the row is from: averages, shootingstatistics, totals,
    ... (the set is per site).'
  table_label: The table's heading in the site's language (e.g. Moyennes).
  value: Numeric value of the statistic; null when the API sends a duration or text
    (see value_text).
  value_text: Non-numeric statistic value, e.g. an ISO 8601 duration such as PT12M2S
    for minutes per game.
  website_id: Site config id the body came from (12 LNB, 14 LNBP, 3 NBL1, 13 El Salvador,
    22 Panama, 236 Austria, 326 Montenegro), read from the body's links.self.
atrium_competition_team_stats:
  entity_id: Team UUID decoded from the widget link (team tables only; player tables
    name the team but carry no id).
  entity_name: Team name as the site prints it; for player rows of a stat table it
    is the player's team.
  person_id: Player UUID decoded from the widget link beside the name (the tables
    carry names only); null when the link is missing or undecodable, and always null
    in team and competition bodies.
  person_name: Player name as the site prints it; null in team tables.
  season_id: Season UUID of the table; null for the competition-scoped routes (their
    bodies carry none).
  stat_key: Statistic key as the API names it (pointsPerGame, fieldGoalsMade, ...),
    unchanged from header key.
  stat_label: Longer statistic label the site shows (code in the API), in the site's
    language.
  stat_name: Short column heading the site shows for the statistic (PTS, REB), in
    the site's language.
  table_key: 'Statistics table the row is from: averages, shootingstatistics, totals,
    ... (the set is per site).'
  table_label: The table's heading in the site's language (e.g. Moyennes).
  value: Numeric value of the statistic; null when the API sends a duration or text
    (see value_text).
  value_text: Non-numeric statistic value, e.g. an ISO 8601 duration such as PT12M2S
    for minutes per game.
  website_id: Site config id the body came from (12 LNB, 14 LNBP, 3 NBL1, 13 El Salvador,
    22 Panama, 236 Austria, 326 Montenegro), read from the body's links.self.
atrium_fixture:
  age_group: Age group of the competition, e.g. SENIOR.
  attendance: Spectators at the game; null when not reported.
  away_captain_person_id: Person UUID of the away team's captain; null when the body
    names none.
  away_code: Short code of the away team (e.g. PAB).
  away_entity_id: Team UUID of the away team.
  away_name: Name of the away team.
  away_result_status: Result status of the away team's score, e.g. CONFIRMED.
  away_score: Points scored by the away team (the API sends a string; Int64 here).
  competition_name: Name of the competition, in the site's language.
  discipline: Discipline label of the game; null in every body seen.
  external_id: 'The league''s own match number (LNB: the lnb.fr number); null elsewhere.'
  fixture_id: Game UUID (fixture); the key of every game frame and of the fixture_detail
    routes.
  fixture_type: 'Kind of game as sent: REGULAR, PLAYOFF, ... (the set is open).'
  fouls_before_bonus: Team fouls in a period before the bonus applies.
  home_captain_person_id: Person UUID of the home team's captain; null when the body
    names none.
  home_code: Short code of the home team (e.g. PAB).
  home_entity_id: Team UUID of the home team.
  home_name: Name of the home team.
  home_result_status: Result status of the home team's score, e.g. CONFIRMED.
  home_score: Points scored by the home team (the API sends a string; Int64 here).
  live_data_available: True when live data feeds are enabled for the game.
  live_video_available: True when a live video stream is attached.
  max_fouls_personal: Personal fouls that disqualify a player.
  maximum_players_on_court: Players a team has on court at once.
  maximum_roster_size: Largest roster a team may enter for the game.
  name: Fixture name; null on LNBP.
  number_of_periods: Regulation periods in the game (4).
  overtime_allowed: True when the game may go to overtime.
  overtime_length: Length of an overtime period, in minutes.
  period_length: Length of a regulation period, in minutes.
  season_id: Season UUID of the game.
  series: Playoff series the game belongs to as sent (JSON text when an object); null
    outside a series.
  shot_clock: Shot clock length, in seconds.
  start_time_local: Scheduled start, naive datetime in the venue's local time (timezone
    gives the zone; no offset sent).
  start_time_utc: Scheduled start, naive datetime in UTC (the API sends no offset).
  status: Status code of the game, e.g. CONFIRMED (final), as sent.
  status_label: Status of the game as the site words it in its own language (e.g.
    Termine, Final).
  timezone: IANA time zone of the venue (e.g. Europe/Paris, Mexico/General) that start_time_local
    is in.
  updated: When the record was last updated, naive datetime (no offset; zone unverified).
  venue: Name of the arena where the game is played.
  venue_id: Venue UUID; joins no other route.
  website_id: Site config id the body came from (12 LNB, 14 LNBP, 3 NBL1, 13 El Salvador,
    22 Panama, 236 Austria, 326 Montenegro), read from the body's links.self.
atrium_fixture_periods:
  away_entity_id: Team UUID of the away team, from the fixture's isHome flag.
  away_points: Points the away team scored in this period (not the running score).
  duration_minutes: Length of the period in minutes.
  elapsed_minutes_before_period: Minutes of game time played before the period starts
    (40 for the first overtime).
  ended: True once the period has ended.
  fixture_id: Game UUID (fixture); the key of every game frame and of the fixture_detail
    routes.
  home_entity_id: Team UUID of the home team, from the fixture's isHome flag.
  home_points: Points the home team scored in this period (not the running score).
  is_overtime: True for an overtime period.
  is_shootout: True for a shootout period.
  label: Short period label in the site's language (Q1, P1), as sent.
  period_id: 'Period number: 1-4 regulation, 11, 12, ... overtimes (not 5).'
  season_id: Season UUID of the game.
  started: True once the period has started.
  website_id: Site config id the body came from (12 LNB, 14 LNBP, 3 NBL1, 13 El Salvador,
    22 Panama, 236 Austria, 326 Montenegro), read from the body's links.self.
atrium_fixtures:
  attendance: Spectators at the game; null when not reported.
  away_code: Short code of the away team (e.g. PAB).
  away_draw: True when the game ended level for the away team.
  away_entity_id: Team UUID of the away team.
  away_name: Name of the away team.
  away_result_place: 'Result place of the away team: 1 for the winner, 2 for the loser.'
  away_result_status: Result status of the away team's score, e.g. CONFIRMED.
  away_score: Points scored by the away team (the API sends a string; Int64 here).
  away_secondary_score: Secondary score of the away team (unused in the samples; shown
    as text).
  away_shootout_attempts: Shootout attempts of the away team as sent (an empty string
    becomes null).
  competition_id: Competition UUID of the season.
  competition_name: Competition name in the site's language, e.g. Betclic ELITE or
    LIGA CALIENTE.MX LNBP.
  fixture_id: Game UUID (fixture); the key of every game frame and of the fixture_detail
    routes.
  fixture_type: 'Kind of game as sent: REGULAR, PLAYOFF, ... (the set is open).'
  home_code: Short code of the home team (e.g. PAB).
  home_draw: True when the game ended level for the home team.
  home_entity_id: Team UUID of the home team.
  home_name: Name of the home team.
  home_result_place: 'Result place of the home team: 1 for the winner, 2 for the loser.'
  home_result_status: Result status of the home team's score, e.g. CONFIRMED.
  home_score: Points scored by the home team (the API sends a string; Int64 here).
  home_secondary_score: Secondary score of the home team (unused in the samples; shown
    as text).
  home_shootout_attempts: Shootout attempts of the home team as sent (an empty string
    becomes null).
  name: Fixture name as the site prints it (e.g. Paris - Lyon-Villeurbanne); null
    on LNBP.
  pool: Pool the game belongs to; null when the competition has none.
  round: 'Round of the game as the site words it, e.g. Journee: 30.'
  round_code: Round code; null in every body seen.
  season_end_year: 'Season END year (the sdv key): the site''s year + 1 on LNB (site
    12), the calendar year on the other registered sites; null when the site is unregistered,
    lists no seasons or the body has no season list.'
  season_id: Season UUID the page is about (the site's default season when none was
    asked).
  series: Playoff series the game belongs to as sent (JSON text when an object); null
    outside a series.
  stage_code: Opaque 30-hex stage code of the game; null in every body seen.
  start_time_local: Scheduled start, naive datetime in the venue's local time (timezone
    gives the zone; no offset sent).
  start_time_utc: Scheduled start, naive datetime in UTC (the API sends no offset).
  status: Status code of the game, e.g. CONFIRMED (final), as sent.
  status_label: Status of the game as the site words it in its own language (e.g.
    Termine, Final).
  times_unconfirmed: True while the start time is not final.
  timezone: IANA time zone of the venue (e.g. Europe/Paris, Mexico/General) that start_time_local
    is in.
  venue: Name of the arena where the game is played.
  venue_id: Venue UUID; joins no other route.
  website_id: Site config id the body came from (12 LNB, 14 LNBP, 3 NBL1, 13 El Salvador,
    22 Panama, 236 Austria, 326 Montenegro), read from the body's links.self.
atrium_fixtures_ribbon:
  away_entity_id: Team UUID of the away team.
