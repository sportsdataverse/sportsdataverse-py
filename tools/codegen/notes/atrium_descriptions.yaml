atrium_team:
  color: 'Team colour from the banner, hex string with its #.'
  entity_id: Team UUID, decoded from the page's tab links (the body does not echo
    it elsewhere).
  logo_url: URL of the banner's team logo.
  name: Team name from the page banner.
  next_attendance: Spectators at the next scheduled game; null when not reported.
