atrium_team_stats:
  entity_id: Team UUID decoded from the widget link (team tables only; player tables
    name the team but carry no id).
  entity_name: Team name as the site prints it; for player rows of a stat table it
    is the player's team.
  person_id: Player UUID decoded from the widget link beside the name (the tables
    carry names only); null when the link is missing or undecodable, and always null
    in team and competition bodies.
  person_name: Player name as the site prints it; null in team tables.
  season_id: Season UUID of the table; null for the competition-scoped routes (their
    bodies carry none).
  stat_key: Statistic key as the API names it (pointsPerGame, fieldGoalsMade, ...),
    unchanged from header key.
  stat_label: Longer statistic label the site shows (code in the API), in the site's
    language.
  stat_name: Short column heading the site shows for the statistic (PTS, REB), in
    the site's language.
  table_key: 'Statistics table the row is from: averages, shootingstatistics, totals,
    ... (the set is per site).'
  table_label: The table's heading in the site's language (e.g. Moyennes).
  value: Numeric value of the statistic; null when the API sends a duration or text
    (see value_text).
  value_text: Non-numeric statistic value, e.g. an ISO 8601 duration such as PT12M2S
    for minutes per game.
  website_id: Site config id the body came from (12 LNB, 14 LNBP, 3 NBL1, 13 El Salvador,
    22 Panama, 236 Austria, 326 Montenegro), read from the body's links.self.
