  blocks: Shots blocked (team, this game).
  blocks_received: Own shots blocked by an opponent (LNB only) (team, this game).
  efficiency: Efficiency rating, from the site's own formula (team, this game).
  entity_id: Team UUID (from the fixture's isHome flag).
  extra_fouls_total: Fouls committed (team, credited to the team rather than a player).
  extra_rebounds: Total rebounds (team, credited to the team rather than a player).
  extra_rebounds_defensive: Defensive rebounds (team, credited to the team rather
    than a player).
  extra_rebounds_offensive: Offensive rebounds (team, credited to the team rather
    than a player).
  extra_turnovers: Turnovers (team, credited to the team rather than a player).
  field_goals_attempted: Field goals attempted (LNBP only) (team, this game).
  field_goals_made: Field goals made, two- and three-pointers together (LNBP only)
    (team, this game).
  field_goals_percentage: Field-goal percentage, 0-100 (LNBP only) (team, this game).
  fixture_id: Game UUID (fixture); the key of every game frame and of the fixture_detail
    routes.
  fouls_drawn: Fouls drawn (committed against the player or team; LNBP only) (team,
    this game).
  fouls_total: Fouls committed (team, this game).
  free_throws_attempted: Free throws attempted (team, this game).
  free_throws_made: Free throws made (team, this game).
  free_throws_percentage: Free-throw percentage, 0-100 (team, this game).
  minutes: Time played as an ISO 8601 duration (PT7M23S); a team's is the sum over
    its players (PT200M) (team, this game).
  plus_minus: Plus/minus, the point differential while on court (LNB only; null in
    some team lines) (team, this game).
