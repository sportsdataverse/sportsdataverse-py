atrium_leaders:
  entity_id: Team UUID of the leader's team.
  entity_name: Name of the leader's team.
  person_id: Player UUID of the leader.
  person_name: Name of the leader.
  rank: Position of the leader within the statistic, 1-based (the API lists the top
    5).
  season_id: Season UUID of the leaders.
  stat_key: Statistic the leader is ranked in (points, pointsPerGame, efficiency,
    doubleDouble, ...).
  stat_label: Longer statistic label the site shows (code in the API), in the site's
    language.
  stat_name: Short column heading the site shows for the statistic (PTS, REB), in
    the site's language.
  value: Numeric value of the statistic; null when the API sends a duration or text
    (see value_text).
  value_text: Non-numeric statistic value, e.g. an ISO 8601 duration such as PT12M2S
    for minutes per game.
  website_id: Site config id the body came from (12 LNB, 14 LNBP, 3 NBL1, 13 El Salvador,
    22 Panama, 236 Austria, 326 Montenegro), read from the body's links.self.
atrium_pbp:
  away_score: Away team's running score after the event.
  bib: Jersey number of the player, as text; null for team events.
  clock: Time REMAINING in the period as an ISO 8601 duration (PT10M0S at the start).
  clock_seconds: Seconds remaining in the period, parsed from clock.
  description: The event's text in the site's language (e.g. Entre-deux remporte).
  entity_id: Team UUID the event is credited to.
  event_id: Event UUID, shared with the same event in atrium_shots.
  event_sub_type: 'Event detail: jumpShot, layup, offensive, defensive, in, out, 1Of2,
    personal, ...; null when none.'
  event_type: 'Event type: 2pt, 3pt, freeThrow, rebound, assist, steal, block, turnover,
    foul, substitution, timeOut, jumpBall, ... (language-independent).'
  fixture_id: Game UUID (fixture); the key of every game frame and of the fixture_detail
    routes.
  home_score: Home team's running score after the event.
  period_id: 'Period number: 1-4 regulation, 11, 12, ... overtimes (not 5).'
  person_id: Player UUID; null for team events (time-outs, team rebounds).
  person_name: Player the event is credited to; null for team events (time-outs, team
    rebounds).
  season_id: Season UUID of the game.
  sequence: 1-based position of the event in the game (periods in order, events chronological).
  side: 'Side of the game the row belongs to: home or away (from the fixture''s isHome
    flag).'
  success: True when a shot or free throw was made, false when missed; null for other
    events.
  success_label: The made / missed label in the site's language; sent on shot events
    only.
  website_id: Site config id the body came from (12 LNB, 14 LNBP, 3 NBL1, 13 El Salvador,
    22 Panama, 236 Austria, 326 Montenegro), read from the body's links.self.
  x: Shot location along the 28 m court length as percent of the court (0-100, origin
    at a corner); the home team attacks the low-x basket all game; null for non-shots.
  y: Shot location across the 15 m width as percent of the court (0-100); which sideline
    is 0 is unverified; null for non-shots.
