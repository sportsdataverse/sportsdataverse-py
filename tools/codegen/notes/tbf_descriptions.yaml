tbf_daily_matches:
  activity_id: 'Activity id (faaliyet = activity; key space: TBF league-SEASONS, new
    every season: BSL 2026-27 = 22214, BSL 2025-26 = 20728, TBL 2026-27 = 22215, KBSL
    2026-27 = 22209). Cast to an integer from the 22214 / 22214.0 the API sends.'
  activity_name: Activity name ('BSL 2026-2027').
  away_score: Away points (null before the game).
  away_team: 'Team name as registered for that season, uppercase with Turkish letters
    (sponsor name: ''PİZZABULLS BORDO BANDIRMA'').'
  away_team_process_id: 'Team-season id (teamProcessId = takimIslemId, ''team registration'';
    key space: TBF team registrations, a NEW id per club per league-season: Tofaş
    = 265995 in BSL 2026-27). The TeamProcessId parameter of the /Team/ routes. Not
    the club id (takimID / teamId of the team lists).'
  broadcast_channel: Broadcaster ('beINSports', 'HT SPOR', 'Youtube / TBF TV'), or
    ''.
  competition: 'TBF league the row belongs to: bsl, tbl or kbsl (the request''s competition,
    or the league prefix the API reports).'
  gender: Gender in Turkish when sent; empty on get-daily-matches, so null.
  genius_id: 'Genius Sports LiveStats match id (TBF spells it genuisId); joins the
    genius family. Null when TBF stored none: every game before 2018-19, many 2021-25
    games and games not yet assigned one.'
  group_name: Competition group the app shows the game under (grup adi).
  has_overtime: 'Overtime flag (uzatma = overtime). Reliability unverified: false
    on every one of 64 BSL 2025-26 games checked.'
  home_score: Home points (null before the game).
  home_team: 'Team name as registered for that season, uppercase with Turkish letters
    (sponsor name: ''PİZZABULLS BORDO BANDIRMA'').'
  home_team_process_id: 'Team-season id (teamProcessId = takimIslemId, ''team registration'';
    key space: TBF team registrations, a NEW id per club per league-season: Tofaş
    = 265995 in BSL 2026-27). The TeamProcessId parameter of the /Team/ routes. Not
    the club id (takimID / teamId of the team lists).'
  match_code: TBF short game code ('1EA4917'); unique per game, meaning of the letters
    unverified.
  match_date: Tip-off date 'YYYY-MM-DD'; equals the MatchDate parameter (checked).
  match_id: 'TBF game id (key space: TBF games, ONE global sequence across leagues
    and seasons: 62552 in 2006-07, 346279 in 2026-27). The match_id argument of every
    game wrapper; the routes echo it as a string or null, the runtime stamps the integer
    asked for.'
  phase: Phase code as a string ('1' = first half of the regular season); see get-league-weeks
    devre_ID.
  province: Province (il) of the venue when sent, uppercase Turkish; null otherwise.
  season: Season END year (2027 = the 2026-2027 season), read from the 'YYYY-YYYY'
    label or the request; the sdv season key. Not the internal TBF season id (season_id).
  season_id: 'Internal TBF season id (key space: TBF seasons, global across leagues:
    174 = 2026-2027, 172 = 2025-2026; the odd ids are international UA- seasons).
    Never an sdv key: use season (END year).'
  season_label: Season label as TBF writes it, 'YYYY-YYYY' (start and end year).
  status: 'Game status text in Turkish: Oynandi = played, Oynanmadi = not played.'
  status_id: 'Game status code: 1 = played (Oynandi), 4 = not played (Oynanmadi),
    19 = fixture without a date and time. Cast to an integer from the 1 / 1.0 the
    API sends.'
  tipoff: Tip-off as a naive timestamp in Turkey local time (Europe/Istanbul, UTC+3);
    the API sends no offset.
  venue: Venue (salon) name.
  week: 'Week (hafta) label or number: ''N. Hafta'' on schedule rows, the number on
    standings rows, a playoff round name later in the season.'
tbf_game_header:
  activity_id: 'Activity id (faaliyet = activity; key space: TBF league-SEASONS, new
    every season: BSL 2026-27 = 22214, BSL 2025-26 = 20728, TBL 2026-27 = 22215, KBSL
    2026-27 = 22209). Cast to an integer from the 22214 / 22214.0 the API sends.'
  activity_name: Activity name ('BSL 2026-2027').
  attendance: Spectator count (matchSpectatorCount); 0 when not recorded.
  away_coach: Away head coach name, uppercase.
  away_score: Away final score.
  away_team: Away team name as registered for that season, uppercase with Turkish
    letters.
  away_team_process_id: 'Away team-season id (key space: TBF team registrations).'
  broadcast_channel: Broadcaster (matchBroadcastChannel), e.g. beINSports, or null.
  commissioner: Commissioner's (temsilci = representative) name.
  first_assistant_referee: First assistant referee's name.
  genius_id: 'Genius Sports LiveStats match id (TBF spells it genuisId); joins the
    genius family. Null when TBF stored none: every game before 2018-19, many 2021-25
    games and games not yet assigned one.'
  has_overtime: 'Overtime flag (uzatma = overtime). Reliability unverified: false
    on every one of 64 BSL 2025-26 games checked.'
  home_coach: Home head coach name, uppercase.
  home_score: Home final score.
  home_team: Home team name as registered for that season, uppercase with Turkish
    letters.
  home_team_process_id: 'Home team-season id (key space: TBF team registrations; the
    header calls it homeTeamProcessId).'
  match_code: TBF short game code ('1EA4917').
  match_id: 'TBF game id (key space: TBF games, ONE global sequence across leagues
    and seasons: 62552 in 2006-07, 346279 in 2026-27). The match_id argument of every
    game wrapper; the routes echo it as a string or null, the runtime stamps the integer
    asked for.'
  referee: 'Main referee''s name (names only: no contact or birth data is returned).'
  season: Season END year, read from the season label (seasonName).
  season_id: 'Internal TBF season id (key space: TBF seasons, global across leagues:
    174 = 2026-2027, 172 = 2025-2026; the odd ids are international UA- seasons).
    Never an sdv key: use season (END year).'
  season_label: Season label 'YYYY-YYYY' (seasonName).
  second_assistant_referee: Second assistant referee's name.
  status: 'Game status text in Turkish: Oynandi = played. Only finished games are
    served.'
  status_id: 'Game status code: 1 = played (Oynandi), 4 = not played (Oynanmadi),
    19 = fixture without a date and time. Cast to an integer from the 1 / 1.0 the
    API sends.'
  tipoff: Tip-off as a naive timestamp in Turkey local time (Europe/Istanbul, UTC+3).
  venue: Venue name (location) as TBF prints it.
tbf_game_leaders:
  category: Leader category code (leaderCategory), e.g. VerimlilikPuani = efficiency
    rating.
  category_label: Leader category label in Turkish (leaderCategoryDescription), e.g.
    Verimlilik Puani.
  jersey_number: Shirt number as a string, so '0' and '00' stay distinct.
  match_id: 'TBF game id (key space: TBF games, ONE global sequence across leagues
    and seasons: 62552 in 2006-07, 346279 in 2026-27). The match_id argument of every
    game wrapper; the routes echo it as a string or null, the runtime stamps the integer
    asked for.'
  player_id: 'TBF person id of the leader (key space: TBF persons; equals the box
    score player_id).'
  player_name: Player name as TBF prints it for that route (title case, Turkish letters
    kept).
  rank: Position in the category's list, 1 = best (top five per category).
  side: Side of the leader's team (isHome).
  value: The leader's value in the category (points, rebounds, ...).
tbf_game_players:
  is_active: True when the player is flagged active in the header (isActive).
  is_starter: True for a starter in the header roster (isStarter).
  jersey_number: Shirt number as a string, so '0' and '00' stay distinct.
  match_id: 'TBF game id (key space: TBF games, ONE global sequence across leagues
    and seasons: 62552 in 2006-07, 346279 in 2026-27). The match_id argument of every
    game wrapper; the routes echo it as a string or null, the runtime stamps the integer
    asked for.'
  player_name: Player name as the header roster lists it.
  side: 'Side of the game the row belongs to: home or away (from the route''s isHome
    flag or home / away block).'
  team: Team name for the roster row; empty in the samples, so null.
tbf_highlights:
  away_number: Away value as a number; null for a time value such as TimeLeading.
  away_value: 'Away value exactly as sent (a string: ''89'', or ''8:19'' for TimeLeading).'
  category: Statistic code (leaderCategory), e.g. PointsFromPaint, LeadChanges, TimeLeading.
  home_number: Home value as a number; null for a time value such as TimeLeading.
  home_value: 'Home value exactly as sent (a string: ''90'', or ''28:38'' for TimeLeading).'
  match_id: 'TBF game id (key space: TBF games, ONE global sequence across leagues
    and seasons: 62552 in 2006-07, 346279 in 2026-27). The match_id argument of every
    game wrapper; the routes echo it as a string or null, the runtime stamps the integer
    asked for.'
  title: Statistic name in Turkish (Ribaund = rebounds, Asist = assists, Top Kaybi
    = turnovers).
tbf_leaders_assists:
  category: 'Statistic of the wrapper: points, assists, blocks, rebounds, steals,
    minutes, threes, turnovers or efficiency.'
  competition: 'TBF league the row belongs to: bsl, tbl or kbsl (the request''s competition,
    or the league prefix the API reports).'
  games: Games played (macSayisi, sent as a string).
  kind: total = the server's top 20 by season TOTAL; average = the top 20 by PER-GAME
    average.
  person_id: 'TBF person id (oyuncuKodu, sent as a string; key space: TBF persons).'
  player_name: Player name as TBF prints it for that route (title case, Turkish letters
    kept).
  rank: Rank in the list, 1 = best (the API's order).
  season: Season END year (2027 = the 2026-2027 season), read from the 'YYYY-YYYY'
