tbf_pbp:
  action: Play type in Turkish exactly as TBF sends it (77 values seen).
  action_en: English gloss of the Turkish action, from the refs action vocabulary;
    null for an action not in it.
  action_number: Play sequence number (actionNumber); gaps are deleted or hidden actions.
    Rows are in the API's game order, and a period-end line can carry a LOWER number
    than the last play of the period (884 after 885 in the sample), so sort by period
    and clock, not by this number.
  away_score: Running away score after the play (the away half of the score text).
  clock: Game clock REMAINING in the period as 'mm:ss' (counts down from 10:00).
  home_score: Running home score after the play (the home half of the 'home-away'
    score text).
  jersey_number: Shirt number as a string, so '0' and '00' stay distinct.
  match_id: 'TBF game id (key space: TBF games, ONE global sequence across leagues
    and seasons: 62552 in 2006-07, 346279 in 2026-27). The match_id argument of every
    game wrapper; the routes echo it as a string or null, the runtime stamps the integer
    asked for.'
  period: 'Period number (quarterNumber): 1-4; overtime numbering is unverified.'
  period_type: 'Period type code: 1 = regulation, 2 = overtime (from the app code;
    no overtime game in the samples).'
  player_name: Acting player's name; null on game events. The feed carries no player
    id.
  seconds_remaining: Game clock remaining in the period, in seconds.
  side: Side of the acting team (isHome); null on game events (period start / end,
    game end).
tbf_period_scores:
  match_id: 'TBF game id (key space: TBF games, ONE global sequence across leagues
    and seasons: 62552 in 2006-07, 346279 in 2026-27). The match_id argument of every
    game wrapper; the routes echo it as a string or null, the runtime stamps the integer
    asked for.'
  period: 'Period number (quarter): 1-4 regulation; overtime numbering is unverified.'
  period_type: 'Period type code: 1 = regulation, 2 = overtime (from the app code;
    no overtime game in the samples).'
  points: Points the side scored IN the period (not cumulative).
  side: 'Side of the score: home (homeTeamScore) or away (awayTeamScore).'
tbf_player_box:
  assists: Assists in this game (asist).
  blocks: Shots this player blocked in this game (blok).
  blocks_received: Own shots blocked by an opponent (blocksReceived).
  def_rebounds: Defensive rebounds (savunma ribaundu).
  efficiency: 'Efficiency rating (verimlilik puani, PIR): points + rebounds + assists
    + steals + blocks + fouls drawn - missed shots - turnovers - fouls. An integer
