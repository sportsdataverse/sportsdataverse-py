cba_best_player:
  assists: Assists by the player in this game.
  blocked: Blocks by the player in this game.
  fouls: Personal fouls by the player in this game.
  free_throw_str: Free throws as the string 'made/attempted'.
  minutes: Minutes played (whole minutes).
  number: Jersey number as a string.
  player_img: Absolute URL of the player's photo; null when there is none.
  player_name: 'Full player name (Chinese, may include the first name: 贾卡尔-桑普森). Null
    on some rows (the short name is in playerNameStr).'
  player_name_str: 'Short display name (Chinese surname form: 桑普森).'
  points: Points scored by the player in this game.
  real_point_rate: 真实命中率 true-shooting percentage as a whole-percent string ('74%').
  rebounds: Total rebounds by the player in this game.
  schedule_id: 'CBA game id (key space: CBA games, ONE global 9-digit sequence 100xxxxxx
    across seasons and match types; the {scheduleId} of every game route). Stamped
    by the runtime from the request; null on a body parsed without it.'
  side: 'Side of the game the row belongs to: home (the API''s host / home block)
    or away (guest / visiting block).'
  steals: Steals by the player in this game.
  three_points_str: Three-point field goals as the string 'made/attempted'.
  turn_share: 回合占有率 possession share (see advance-count turnShare) as a whole-percent
    string ('16%').
  turnovers: Turnovers by the player in this game.
  two_points_str: Two-point field goals as the string 'made/attempted' ('3/5').
cba_best_stats:
  ctype: 'Statistic the row leads: points, assists, steals, rebounds, blocked (five
    rows per side in every sample). See the code table.'
  cvalue: The leader's value of ctype, as a STRING ('16').
  player_id: 'playerId (key space: CBA persons, stable across seasons and clubs; 3-9
    digits, older players have short ids (393433) and newer ones 100xxxxxx). Joins
    the player box routes, the season player lists and getPlayersByScheduleId. Not
    a team id. A STRING here (''100005271''), an integer on every box route.'
  player_name: Player name (Chinese). Null on rows whose name the report does not
    repeat (the same player's earlier row carries it).
  player_no: Jersey number as a string. Null where playerName is null.
  schedule_id: 'CBA game id (key space: CBA games, ONE global 9-digit sequence 100xxxxxx
    across seasons and match types; the {scheduleId} of every game route). Stamped
    by the runtime from the request; null on a body parsed without it.'
  seconds: The leader's time on court in SECONDS.
  side: 'Side of the game the row belongs to: home (the API''s host / home block)
    or away (guest / visiting block).'
  team_id: 'Unobserved: null in every sample (the side is the enclosing list).'
  type: 'Side flag: 0 on home rows, 2 on visiting rows (differs from advance-count,
    where the visiting side is 1).'
cba_game_info:
  count: 'Unverified: an integer shown in the report header (83 in the 2025-26 sample,
    99 in 2017-18). Not the play-by-play row count; plausibly possessions per team,
    which the bundle does not confirm.'
  guest_color: Visiting team colour as a '#RRGGBB' hex string.
  guest_score: Visiting team final points.
  guest_team_id: 'teamId (key space: CBA clubs; 5 digits 29115-29140 for the long-standing
    clubs, 9 digits for newer ones (100074683 = Ningbo); stable across seasons and
    club renames, but the display name changes with the sponsor: 29128 = 浙江广厦 ''Zhejiang
    Guangsha'' under many sponsor names, 浙江浙商证券 in 2025-26). Joins getTeam / teamList
    and the team and player routes. Not a player or schedule id. Visiting team.'
  guest_team_logo: Absolute URL of the visiting team logo.
  guest_team_name: Visiting team name (Chinese) at the time of the game. Names change
    with the sponsor, the id does not; teamId -> English glossary in cba_glossary.yaml.
  host_color: Home team colour as a '#RRGGBB' hex string (the game report's theme
    colour).
  host_score: Home team final points.
  host_team_id: 'teamId (key space: CBA clubs; 5 digits 29115-29140 for the long-standing
    clubs, 9 digits for newer ones (100074683 = Ningbo); stable across seasons and
    club renames, but the display name changes with the sponsor: 29128 = 浙江广厦 ''Zhejiang
    Guangsha'' under many sponsor names, 浙江浙商证券 in 2025-26). Joins getTeam / teamList
    and the team and player routes. Not a player or schedule id. Home team.'
  host_team_logo: Absolute URL of the home team logo.
  host_team_name: Home team name (Chinese) at the time of the game (e.g. 广东东莞银行 in
    2017-18). Names change with the sponsor, the id does not; teamId -> English glossary
    in cba_glossary.yaml.
  schedule_id: 'CBA game id (key space: CBA games, ONE global 9-digit sequence 100xxxxxx
    across seasons and match types; the {scheduleId} of every game route). Stamped
    by the runtime from the request; null on a body parsed without it.'
  schedule_time: Tip-off as 'YYYY-MM-DD HH:MM:SS' (China local time); equals schedules/day
    scheduleTime.
