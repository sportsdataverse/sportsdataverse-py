  p3pg: Three-pointers made per game (3PPG), a string; parsed to a number.
  position: Rank of the team in the phase (a string on the wire).
  ppg: Points per game, a string with two decimals; parsed to a number.
  rpg: Rebounds per game, a string; parsed to a number.
  season: Season END year (2025-26 = 2026, 1999-2000 = 2000) from league_title ('25-26
    Wリーグ'); null for an all-star game, cup or camp.
  season_full_name: 'league_title + phase (+ division) in Japanese: ''25-26 Wリーグ レギュラーシーズン
    プレミア'' = 2025-26 regular season, Premier division (''フューチャー'' = Future division,
    from 2024-25).'
  season_id: 'Season-phase id season_id (key space: phases WITHIN a league_id, e.g.
    169 = 25-26 regular season Premier, 170 = 25-26 regular season Future, 176 = 25-26
    playoff final). Not a year: one league_id has several season_ids. The season_ids
    parameter of /team-standings and /team-ranking and the season_id of /team/roster.'
  season_league_flg: 'Division layout flag: 1 = one table per division (Premier /
    Future), 2 = split by season_team_area (East / West, by the site''s JS), 0 = cup
    / group stage.'
  season_league_img: Division badge image path relative to https://www.wjbl.org.
  season_league_name: 'Phase / division label in Japanese: ''プレミア'' = Premier, ''フューチャー''
    = Future, ''グループステージ'' = group stage, ''2次ラウンド 下位リーグ'' = second round, lower league;
    empty for a single-table phase.'
  season_team_area: 'Unobserved: null in every sample, so no type and no meaning is
    claimed. (By the site''s standings JS: 0 = East, 1 = West conference when season_league_flg
    = 2.)'
  season_team_name: 'Team name as registered for the season, in Japanese (company
    + nickname: ''トヨタ自動車 アンテロープス'' = Toyota Antelopes).'
  season_team_short_name: Short team name for that season, Japanese ('トヨタ自動車' = Toyota).
  season_title: 'Phase title in Japanese: ''レギュラーシーズン'' = regular season, ''プレーオフ　ファイナル''
    / ''プレーオフ／ファイナル'' = playoff final, ''プレーオフ／セミファイナル'' = playoff semifinal (the
    separator varies by era).'
  season_tournament_text: Tournament text (HTML); empty in every sample.
  spg: Steals per game, a string; parsed to a number.
  team_entry_flg: 'Official-league participant flag (公式戦参加フラグ): 1 = a W League member
    team (the site links its roster), 0 = not (guest or all-star side). Integer.'
  team_id: 'Franchise id team_id (key space: W League franchises, STABLE across seasons
    and sponsor renames: 13 = Toyota Antelopes, 12 = Denso Iris, 8 = ENEOS Sunflowers;
    all-star sides have their own ids, e.g. 591). The team_id of /team/roster and
    of the site''s /team/roster/?team_id=. Not season_team_id.'
  tpg: Turnovers per game, a string; parsed to a number.
  unsatisfied: 'Unobserved: null in every sample, so no type and no meaning is claimed.
    (By the site''s JS: a column shown only when filled; meaning unverified.)'
  update_info: As-of note in Japanese, 'YYYY年M月D日現在' ('2026年2月8日現在' = as of 8 Feb
    2026).
  win: Wins (勝), integer.
  win_point: 'Unobserved: null in every sample, so no type and no meaning is claimed.
    (By the site''s JS: league points, a column shown only when filled.)'
  winning_rate: Winning percentage as a FRACTION 0-1 with three decimals, a string
    ('0.821'); parsed to a number.
