easl_game:
  attendance: Announced attendance of the game; null when not recorded.
  away_code_latin: 'Away team: three-letter club code (for example BRE); null or empty
    for some clubs.'
  away_code_local: 'Away team: alternative three-letter club code (for example TPP);
    null for most clubs. A club may have only one of codeLatin / codeLocal.'
  away_draw: 'Away team: true when the game has no winner YET or ever: true on every
    unplayed competitor, false on every finished one (a tie has never happened).'
  away_name: 'Away team: display name. Despite the field name this is the English
    / Latin-script name used on the league site.'
  away_name_native: 'Away team: alternative name: the native-script name of some Japanese
    clubs (for example 宇都宮ブレックス for Utsunomiya Brex), blank for most clubs; for players
    it usually equals nameFullLocal. Despite the field name it is not always Latin
    script. Null on some rows.'
  away_result_place: 'Away team: result place: 1 = winner, 2 = loser. The /matches
    list holds null here for fixtures not yet played; /matches/{fixtureId} is sampled
    for finished games only.'
  away_score: Away team final points (the wire sends a numeric string; cast to Int64);
    null before the game is played.
  away_team_id: 'Away team: teamId: DataCore team (entity) UUID v1 (key space: EASL
    teams, the same id as `entityId`; joins /teams, /standings team.id, fixture competitors,
    box and play-by-play teams). Not a player id.'
  fixture_id: 'fixtureId: DataCore fixture (game) UUID v1 (key space: EASL games;
    the {fixtureId} of every /matches route).'
  fixture_name: Fixture name for special games ('EASL Championship', 'Semifinals 2',
    'EASL Tip-Off 2026 Cebu'); null for ordinary group games.
  fixture_number: 'Fixture number YYSSNNN: two-digit start year, two-digit end year,
    three-digit sequence (2627001 = first game of 2026-27, 2526003 = third of 2025-26).
    Null on every 2023-24 fixture.'
  fixture_type: REGULAR (group stage), PLAYOFF (quarter- and semifinals) or FINAL
    (championship and third-place games). Missing from the DRAFT placeholders.
  home_code_latin: 'Home team: three-letter club code (for example BRE); null or empty
    for some clubs.'
  home_code_local: 'Home team: alternative three-letter club code (for example TPP);
    null for most clubs. A club may have only one of codeLatin / codeLocal.'
  home_draw: 'Home team: true when the game has no winner YET or ever: true on every
    unplayed competitor, false on every finished one (a tie has never happened).'
  home_name: 'Home team: display name. Despite the field name this is the English
    / Latin-script name used on the league site.'
  home_name_native: 'Home team: alternative name: the native-script name of some Japanese
    clubs (for example 宇都宮ブレックス for Utsunomiya Brex), blank for most clubs; for players
    it usually equals nameFullLocal. Despite the field name it is not always Latin
    script. Null on some rows.'
  home_result_place: 'Home team: result place: 1 = winner, 2 = loser. The /matches
    list holds null here for fixtures not yet played; /matches/{fixtureId} is sampled
    for finished games only.'
  home_score: Home team final points (the wire sends a numeric string; cast to Int64);
    null before the game is played.
  home_team_id: 'Home team: teamId: DataCore team (entity) UUID v1 (key space: EASL
    teams, the same id as `entityId`; joins /teams, /standings team.id, fixture competitors,
    box and play-by-play teams). Not a player id.'
  live_data_available: Whether live stats were collected for the game (present on
    a minority of fixtures; meaning unverified). Absent on some rows.
  live_video_available: Whether live video was available (false on all 146 fixtures
    of the four seasons).
  pool_abb: Pool abbreviation (A, B, C). Playoff and DRAFT fixtures of the /matches
    list carry the placeholder pool, whose abb is empty or 'N/A'.
  pool_code: 'Pool (group) id: a 30-character hex string, equal to pool.id; null on
    playoff and DRAFT fixtures.'
  pool_id: 'Pool id: a 30-character hex string; null for playoff games (''Unknown
    Pool'').'
  pool_name: 'Pool name: ''Group A'', ''Group B'', ''Group C'' or the placeholder
    ''Unknown Pool''.'
  season: 'Always null here: the game route carries no season; join season_id to easl_seasons.'
  season_id: 'Always null here: the game route carries no season.'
  stage_code: 'Stage id: a 30-character hex string. Absent on some rows.'
  stage_id: Stage reference '<season UUID>:<stage code>' on team-fixture rows only
    (its first half scopes the fixture to a season); null on the other fixture routes,
    which send the stage_code, stage_name and stage_order trio.
  stage_name: 'Stage name: ''Group Stage'', ''Final Four'' or ''EASL Playoffs''. Absent
    on some rows.'
  stage_order: Ordinal of the stage within the season (1 = Group Stage, 2 = EASL Playoffs).
    Absent on some rows.
  start_time_local: Scheduled tip-off in the venue's local time, 'YYYY-MM-DDTHH:MM:SS'
    with no zone (19:10 local = 10:10 UTC in Tokyo). DRAFT fixtures carry a date at
    00:00:00.
  start_time_utc: Scheduled tip-off in UTC, 'YYYY-MM-DDTHH:MM:SS' with no zone marker.
    The /matches list holds null here on DRAFT fixtures; the single-fixture sample
    is a finished game.
  status: CONFIRMED = finished with a final box score; SCHEDULED = future; DRAFT =
    a placeholder with no teams or time.
  venue_abbreviation_latin: 'Not yet populated upstream: null in every full body observed
    (2026-10-12), so its meaning is unverified; the 2026-27 bodies start filling some
    of these columns, so it is typed from its family (String).'
  venue_abbreviation_local: 'Not yet populated upstream: null in every full body observed
    (2026-10-12), so its meaning is unverified; the 2026-27 bodies start filling some
    of these columns, so it is typed from its family (String).'
  venue_alternate_name_latin: 'Not yet populated upstream: null in every full body
    observed (2026-10-12), so its meaning is unverified; the 2026-27 bodies start
    filling some of these columns, so it is typed from its family (String).'
  venue_city: City of the arena.
  venue_country_code: 'ISO 3166-1 alpha-3 country code of the arena: JPN, TWN, PHL,
    KOR, MAC, HKG, MNG, CHN. The /matches list holds null here on DRAFT fixtures (empty
    venue).'
  venue_name: Arena name. Absent on some rows.
  venue_name_latin: Venue name in Latin script; null on most rows.
  venue_state: State or province of the arena (Philippine games, for example Cebu).
easl_health:
  message: Human-readable status text ('EASL Basketball API is running').
  status: 'Server status: ''OK''.'
  timestamp: Server time, ISO 8601 with milliseconds and Z (UTC).
easl_leaders:
  category: 'Leader category, the wire key of the group: pointsPerGame, reboundsPerGame,
    assistsPerGame, stealsPerGame, blocksPerGame, pointsThreeMade, pointsThreePercentage,
    fieldGoalsPercentage or freeThrowsPercentage.'
  jersey_number: Jersey number as a string ('00', '0' and '75' are distinct).
  player_id: 'playerId: DataCore person UUID v1 (key space: EASL persons, the same
    id as the box score''s `personId`; joins /players, leaders and play-by-play players).
    Not a team id.'
  player_name: Player display name in 'FAMILY Given' form with the family name upper-cased
    (OSAKABE Taiki), in Latin script.
  player_name_latin: 'Alternative name: equal to nameFullLocal for 257 of 552 players,
    otherwise null; never non-Latin in the observed data.'
  player_status: 'Registration state of the player in the database: ACTIVE, INACTIVE
    or UNREGISTERED.'
  position: 'Playing position: G, F, C, PG, SG, SF, PF or GF (guard-forward).'
  rank: Rank inside the category, 1 = best, in the delivered order (the server lists
    the top 5).
  season: 'Season END year (2026 = EASL 25-26): stamped by easl_runtime from the request,
    null when the body is parsed bare.'
  season_id: DataCore season UUID v1 of the leader row.
  team_code_latin: Three-letter club code (for example BRE); null or empty for some
    clubs.
  team_code_local: Alternative three-letter club code (for example TPP); null for
    most clubs. A club may have only one of codeLatin / codeLocal.
  team_id: 'teamId: DataCore team (entity) UUID v1 (key space: EASL teams, the same
    id as `entityId`; joins /teams, /standings team.id, fixture competitors, box and
    play-by-play teams). Not a player id.'
  team_name: Display name. Despite the field name this is the English / Latin-script
    name used on the league site.
  team_name_native: 'Alternative name: the native-script name of some Japanese clubs
    (for example 宇都宮ブレックス for Utsunomiya Brex), blank for most clubs; for players
    it usually equals nameFullLocal. Despite the field name it is not always Latin
    script. Null on some rows.'
  value: 'The leader''s value in the category: a per-game average, a count (pointsThreeMade)
    or a percentage (0-100). Float64.'
easl_pbp:
  description: 'Event text. Shots read ''<2pt|3pt> <shot type> missed[ (modifier)]''
    for EVERY field-goal attempt, made or not: the word ''missed'' is always there
    and the result is the change of `scores` (see the divergence notes). Shot types:
    Jump shot, Layup, Driving layup, Pull-up jump shot, Floating jump shot, Tip-in,
    Fadeaway, Step-back jump shot, Turnaround jump shot, Hook shot, Dunk, Reverse
    layup, Alley-oop, Alley-oop dunk, Euro step (none on 23 rows: ''3pt missed'').
    Modifiers: in the paint, second chance, from turnover, fast break, blocked. Free
    throws read ''Free throw K of M made'' (M = 1, 2 or 3) for every attempt, also
    always ''made''. Other events (complete list): Assist; Block; Steal; Substitution
    in; Substitution out; Defensive rebound; Defensive rebound (team); Offensive rebound;
    Offensive rebound (team); Foul; Foul (N FT); Foul drawn; Foul drawn (N FT); Personal
    foul; Personal foul (N FT); Personal foul (shooting); Personal foul (shooting)
    (N FT); Offensive foul; Offensive foul (charge); Technical foul; Technical foul
    (N FT); Bench technical foul; Bench technical foul (N FT); Coach technical foul;
    Coach technical foul (N FT); Unsportsmanlike foul; Unsportsmanlike foul (N FT);
    Disqualifying foul (N FT); Jump ball won; Jump ball won (held ball); Jump ball
    lost; Full timeout; Short timeout; Media timeout; Commercial timeout; Officials
    timeout; Officials timeout (mandatory); Coach''s challenge (pending); Coach''s
    challenge (complete) - upheld; Coach''s challenge (complete) - overturned; Instant
    replay review (complete) - upheld; Instant replay review (complete) - overturned;
    Turnover - Bad pass; Ball handling; Traveling; Out of bounds; Offensive; Backcourt
    violation; Double dribble; Carrying; Offensive goaltending; 3 second violation;
    5 second violation; 5 second violation (team); 8 second violation (team); Shot
    clock violation (team); Other; Other (team). N FT = free throws awarded.'
  event_number: 1-based position of the event in the delivered array, which is the
    only usable order (sequence is not monotonic).
  event_time: When the event was logged, wall-clock 'YYYY-MM-DDTHH:MM:SS.mmm' in UTC
    with no zone marker. There is NO game clock (time remaining) in this feed.
  fixture_id: DataCore fixture (game) UUID v1 from the request.
  jersey_number: Jersey number as a string; null on one event. Absent on some rows.
  opponent_score: The other team's running score as of this event; null on events
    with no team.
  period_id: 'Period: 1-4 regulation, 11 = first overtime (12 = second overtime appears
    in team totals).'
  period_label: Q1-Q4 for periods 1-4; OT1, OT2 ... for overtimes (the server numbers
    the first overtime 11 in team totals; periods 5-10 are read as OT{n-4}, unverified).
  player_id: DataCore person UUID v1 of the acting player; null for team events (team
    rebounds, timeouts).
  player_name: Player display name in 'FAMILY Given' form with the family name upper-cased
    (OSAKABE Taiki), in Latin script. Absent on some rows.
  player_name_latin: 'Alternative name: equal to nameFullLocal for 257 of 552 players,
    otherwise null; never non-Latin in the observed data. Absent on some rows.'
  points_scored: 'Points the event team gained since the previous event (change of
    its running score): the made shot''s value. The description always says ''missed'',
    so count points here, not strings; the running score lags on some games, which
    shifts points to a later event.'
  received_time: 'When the event was received upstream, Unix epoch MILLISECONDS (UTC):
    a median 1.6 s after eventTime (5th to 95th percentile -0.6 s to +55 s over 30,874
    events); meaning unverified.'
  sequence: 'Event sequence number from the scorer''s system: NOT in game order (the
    delivered array order is), and not always unique within a game (35 of 106 games
    repeat values).'
  team1_id: First team of the body's teams array (the fixture's competitors order,
    arbitrary home/away); team1_score belongs to it.
  team1_score: Running score of team1_id as of this event.
  team2_id: Second team of the body's teams array; team2_score belongs to it.
  team2_score: Running score of team2_id as of this event.
  team_id: DataCore team UUID v1 of the acting team; null on events with no team.
  team_score: The event team's running score as of this event (the running score lags
    the true score on a minority of events); null on events with no team.
easl_player:
  created_at: When the sync server inserted the row, 'YYYY-MM-DD HH:MM:SS' (a different
    format from updatedAt; zone unstated, UTC assumed).
  dob: Date of birth, 'YYYY-MM-DD' (a public biography field; 1980-10-05 to 2023-10-16
    in the data, so the latest values are implausible); 5 players have none.
  gender: MALE on all 552 rows.
  height_cm: Height in centimetres; 43 of 552 players have none.
  height_feet: 'Not yet populated upstream: null in every full body observed (2026-10-12),
    so its meaning is unverified; the 2026-27 bodies start filling some of these columns,
    so it is typed from its family (String).'
  jersey_number: Jersey number as a string. Present ONLY in the roster variant of
    /players (seasonId + teamId) and on /players/{playerId}; missing from the unfiltered
    list. Absent on some rows.
  name: Player display name in 'FAMILY Given' form with the family name upper-cased
    (OSAKABE Taiki), in Latin script.
  name_abbreviated: 'Not yet populated upstream: null in every full body observed
    (2026-10-12), so its meaning is unverified; the 2026-27 bodies start filling some
    of these columns, so it is typed from its family (String).'
  name_latin: 'Alternative name: equal to nameFullLocal for 257 of 552 players, otherwise
    null; never non-Latin in the observed data.'
  nationality: ISO 3166-1 alpha-3 code of the player's nationality; 36 codes occur,
    KOR 119, USA 102, JPN 81, PHL 80, TWN 61, CHN 22, MNG 16, HKG 15, MAC 13 ('PHI'
    also appears once, a non-ISO spelling of PHL).
  organization_id: 'DataCore organisation id: b1e0z (EASL).'
  player_id: 'playerId: DataCore person UUID v1 (key space: EASL persons, the same
    id as the box score''s `personId`; joins /players, leaders and play-by-play players).
    Not a team id.'
  player_row_id: The sync server's own integer row id of the player (not a DataCore
    id).
  position: Playing position (G, F, C, PG, SG, SF, PF, GF). Present ONLY in the roster
    variant of /players (seasonId + teamId) and on /players/{playerId}; missing from
    the unfiltered list. Absent on some rows.
  status: 'Registration state of the player in the database: ACTIVE, INACTIVE or UNREGISTERED.'
  updated_at: When the sync server last synced the row, ISO 8601 with milliseconds
    and Z (UTC).
  weight_kg: Weight in kilograms; many players have none.
  weight_lbs: 'Not yet populated upstream: null in every full body observed (2026-10-12),
    so its meaning is unverified; the 2026-27 bodies start filling some of these columns,
    so it is typed from its family (Int64).'
easl_player_box:
  assists: 'Assists: passes that directly lead to a made field goal. Null on some
    rows.'
  assists_defensive: Defensive assists (DataCore column; meaning unverified). Null
    on some rows.
  assists_turnover_ratio: Assists divided by turnovers (a ratio, not a percentage).
    Null on some rows.
  bib: Jersey number as a string ('00' and '0' are distinct).
  blocks: Shots blocked (made by this player or team). Null on some rows.
  blocks_received: The team's or player's own shots that were blocked by an opponent.
    Null on some rows.
  double_double: 'Double-double flag: 1 when exactly two of points, rebounds, assists,
    steals, blocks reached 10 in the game, else 0 (a triple-double is counted in tripleDouble
    instead). In a season line it is a count of such games.'
  dunks: Dunks made. Null on some rows.
  efficiency: 'NBA-style efficiency: points + rebounds + assists + steals + blocks
    - missed field goals - missed free throws - turnovers (verified on all 2,143 played
    player-games).'
  efficiency_custom: Custom efficiency slot (DataCore column; meaning unverified).
    Null on some rows.
  field_goals_attempted: Field goals attempted (2- and 3-point shots; free throws
    excluded). Null on some rows.
  field_goals_effective_percentage: 'Effective field-goal percentage on a 0-100 scale:
    (FGM + 0.5 x 3PM) / FGA x 100; can exceed 100 on small samples. Null on some rows.'
  field_goals_made: Field goals made (2- and 3-point shots). Null on some rows.
  field_goals_percentage: Field-goal percentage on a 0-100 scale (made / attempted
    x 100). Null on some rows.
  fixture_id: DataCore fixture (game) UUID v1 of the box row.
  fouls_coach_disqualifying: Disqualifying fouls on the coach. Null on some rows.
  fouls_coach_technical: Technical fouls on the coach. Null on some rows.
  fouls_disqualifying: Disqualifying fouls. Null on some rows.
  fouls_disruptive: Disruptive fouls (DataCore column; filled from 2026-27). Null
    on some rows.
  fouls_drawn: Fouls drawn (committed against this player or team by an opponent).
    Null on some rows.
  fouls_flagrant: Flagrant fouls (DataCore column; filled from 2026-27). Null on some
    rows.
  fouls_offensive: Offensive fouls committed. Counted separately from foulsPersonal.
    Null on some rows.
  fouls_personal: Personal fouls committed (offensive, technical and unsportsmanlike
    fouls are separate columns). Null on some rows.
  fouls_technical: Technical fouls committed by the player or team. Null on some rows.
  fouls_technical_cat1: Technical fouls of category 1 (DataCore column; filled from
    2026-27). Null on some rows.
  fouls_technical_cat2: Technical fouls of category 2 (DataCore column; filled from
    2026-27). Null on some rows.
  fouls_total: 'Fouls charged in total: personal + technical + unsportsmanlike + offensive
    (matches 2,142 of 2,143 played player-games; the exception is unexplained).'
  fouls_unsportsmanlike: Unsportsmanlike fouls committed. Null on some rows.
  free_throws_attempted: Free throws attempted. Null on some rows.
  free_throws_made: 'Free throws made: a game count on the box-score and team-total
    routes, a season total on the season statistics routes.'
  free_throws_percentage: Free-throw percentage on a 0-100 scale. Null on some rows.
  index_of_success: 'Index of success: efficiency + fouls drawn - personal fouls -
    technical fouls - blocks received (verified on all 2,143 played player-games).
    It differs from pir only in which fouls it subtracts.'
  is_player: True on every row (team officials are never listed).
  is_team_official: False on every row.
  max_assists: 'Highest assists in a single game: in a game row it equals assists;
    in a season line it is the best game. Null on some rows.'
  max_free_throws_made: Highest free throws made in a single game (equals freeThrowsMade
    in a game row).
  max_points: Highest points in a single game (equals points in a game row).
  max_points_four_made: Highest 4-point shots made in a game (DataCore column; EASL
    has no 4-point line; filled from 2026-27). Null on some rows.
  max_points_three_made: Highest 3-pointers made in a single game. Null on some rows.
  max_points_two_made: Highest 2-pointers made in a single game. Null on some rows.
  max_rebounds: Highest rebounds in a single game. Null on some rows.
  max_rebounds_defensive: Highest defensive rebounds in a single game. Null on some
    rows.
  max_rebounds_offensive: Highest offensive rebounds in a single game. Null on some
    rows.
  max_steals: Highest steals in a single game. Null on some rows.
  minus: Points the opponents scored while the player was on the court. Null on some
    rows.
  minutes: Playing time as an ISO 8601 duration PT{m}M{s}S with the minutes NOT wrapped
    at 60 (PT27M53S; a team's is the sum of its players', PT200M for a 40-minute game,
    PT250M with one overtime). Null on some rows.
  minutes_played: Playing time in minutes (decimal), parsed from the ISO 8601 minutes
    statistic (PT35M11S = 35.1833).
  pir: 'Performance index rating: efficiency + fouls drawn - total fouls - blocks
    received (verified on all 2,143 played player-games).'
  played: True when the player has playing time (minutes present); False for the rostered
    players who did not play (their counting stats are null).
  player_id: 'playerId: DataCore person UUID v1 (key space: EASL persons, the same
    id as the box score''s `personId`; joins /players, leaders and play-by-play players).
    Not a team id.'
  player_name: Player display name in 'FAMILY Given' form with the family name upper-cased
    (OSAKABE Taiki), in Latin script. Absent on some rows.
  player_name_latin: 'Alternative name: equal to nameFullLocal for 257 of 552 players,
    otherwise null; never non-Latin in the observed data. Absent on some rows.'
  plus: Points the player's team scored while he was on the court. Null on some rows.
  plus_minus: 'plus - minus: the team''s point margin while the player was on the
    court. Null on some rows.'
  points: 'Points scored: a game count on the box-score and team-total routes, a season
    total on the season statistics routes.'
  points_fast_break: Points scored on fast breaks. Null on some rows.
  points_fast_break_attempted: Fast-break field goals attempted. Null on some rows.
  points_fast_break_made: Fast-break field goals made. Null on some rows.
  points_four_attempted: 4-point shots attempted (DataCore column; EASL has no 4-point
    line; filled from 2026-27). Null on some rows.
  points_four_made: 4-point shots made (see pointsFourAttempted). Null on some rows.
  points_four_percentage: 'Not yet populated upstream: null in every full body observed
    (2026-10-12), so its meaning is unverified; the 2026-27 bodies start filling some
    of these columns, so it is typed from its family (Float64).'
  points_from_turnover: Points scored off opponent turnovers. Null on some rows.
  points_in_the_paint: Points scored in the paint. Null on some rows.
  points_in_the_paint_attempted: Field goals attempted in the paint. Null on some
    rows.
  points_in_the_paint_made: Field goals made in the paint. Null on some rows.
  points_second_chance: Points scored on second-chance possessions (after an offensive
    rebound). Null on some rows.
  points_second_chance_attempted: Second-chance field goals attempted. Null on some
    rows.
  points_second_chance_made: Second-chance field goals made. Null on some rows.
  points_three_attempted: 3-point field goals attempted. Null on some rows.
  points_three_made: 3-point field goals made. Null on some rows.
  points_three_percentage: 3-point percentage on a 0-100 scale. Null on some rows.
  points_two_attempted: 2-point field goals attempted. Null on some rows.
  points_two_made: 2-point field goals made. Null on some rows.
  points_two_percentage: 2-point percentage on a 0-100 scale. Null on some rows.
  position: 'Playing position: G, F, C, PG, SG, SF, PF or GF; null on some rows.'
  power_play_points: Power-play points (an ice-hockey column; meaning in basketball
    unverified). Null on some rows.
  power_play_points_awarded: Power-play points awarded (an ice-hockey column; meaning
    in basketball unverified). Null on some rows.
  rebounds: 'Total rebounds: offensive + defensive. Team''s totals include team rebounds.
    Null on some rows.'
  rebounds_defensive: Defensive rebounds. Null on some rows.
  rebounds_defensive_percentage: Share of available defensive rebounds taken while
    on the court, on a 0-100 scale; values above 100 (up to 108.9) occur, so the definition
    is unverified. Null on some rows.
  rebounds_offensive: Offensive rebounds. Null on some rows.
  rebounds_offensive_percentage: Share of available offensive rebounds taken while
    on the court, 0-100 scale (up to 91.4 observed); definition unverified. Null on
    some rows.
  rebounds_percentage: Share of all available rebounds taken while on the court, 0-100
    scale; definition unverified. Null on some rows.
  starter: True for a starter (five per team).
  steals: Steals. Null on some rows.
  team_id: 'The player''s team: DataCore team (entity) UUID v1 (the wire''s entityId).'
  team_name: The player's team display name, joined from the body's teams array.
  team_name_native: The player's team name in native script, joined from the body's
    teams array; blank for most clubs.
  triple_double: 'Triple-double flag: 1 when three or more of points, rebounds, assists,
    steals, blocks reached 10, else 0.'
  true_shooting_attempts: 'Not yet populated upstream: null in every full body observed
    (2026-10-12), so its meaning is unverified; the 2026-27 bodies start filling some
    of these columns, so it is typed from its family (Float64).'
  true_shooting_percentage: 'Not yet populated upstream: null in every full body observed
    (2026-10-12), so its meaning is unverified; the 2026-27 bodies start filling some
    of these columns, so it is typed from its family (Float64).'
  turnovers: Turnovers committed by players. Null on some rows.
  turnovers_percentage: 'Not yet populated upstream: null in every full body observed
    (2026-10-12), so its meaning is unverified; the 2026-27 bodies start filling some
    of these columns, so it is typed from its family (Float64).'
  usage_rate: 'Usage rate on a 0-100 scale: share of the team''s possessions used
    while on the court (up to 136 observed); definition unverified. Null on some rows.'
easl_player_stats:
