easl_teams:
  age_group: 'Age group: SENIOR; null on some inactive teams.'
  code_latin: Three-letter club code (for example BRE); null or empty for some clubs.
  code_local: Alternative three-letter club code (for example TPP); null for most
    clubs. A club may have only one of codeLatin / codeLocal.
  created_at: When the sync server inserted the row, 'YYYY-MM-DD HH:MM:SS' (a different
    format from updatedAt; zone unstated, UTC assumed).
  facebook_username: Club Facebook handle; most clubs have none. Null on some rows.
  gender: 'Competition gender of the team: MALE (the EASL is a men''s competition).'
  instagram_username: Club Instagram handle; some clubs have none. Null on some rows.
  logo: Club logo URL on the Sportradar DataCore asset CDN (images.dc.connect.sportradar.com/b1e0z/...).
  name: Display name. Despite the field name this is the English / Latin-script name
    used on the league site.
  name_native: 'Alternative name: the native-script name of some Japanese clubs (for
    example 宇都宮ブレックス for Utsunomiya Brex), blank for most clubs; for players it usually
    equals nameFullLocal. Despite the field name it is not always Latin script. Null
    on some rows.'
  organization_id: 'DataCore organisation id: b1e0z (EASL).'
  primary_color: Club colour as a 6-digit hex string without '#'; '000000' is a placeholder
    on several clubs.
  secondary_color: Club colour as a 6-digit hex string without '#'; '000000' is a
    placeholder on several clubs.
  standard: 'Competition standard: ELITE.'
  status: ACTIVE for teams in the current season (the only ones /teams lists), INACTIVE
    for historical teams (only via /teams/{teamId}).
  team_id: 'teamId: DataCore team (entity) UUID v1 (key space: EASL teams, the same
    id as `entityId`; joins /teams, /standings team.id, fixture competitors, box and
    play-by-play teams). Not a player id.'
  team_row_id: The sync server's own integer row id of the team (not a DataCore id;
    inactive teams interleave, so ids of /teams rows have gaps).
  tertiary_color: Club colour as a 6-digit hex string without '#'; '000000' is a placeholder
    on several clubs.
  twitter_username: Club X / Twitter handle; most clubs have none. Null on some rows.
  updated_at: When the sync server last synced the row, ISO 8601 with milliseconds
    and Z (UTC).
  website: Club website URL; most clubs have none. Null on some rows.
  wikipedia_url: 'Not yet populated upstream: null in every full body observed (2026-10-12),
    so its meaning is unverified; the 2026-27 bodies start filling some of these columns,
    so it is typed from its family (String).'
