  minutes_played: Playing time in minutes (play_min + play_sec / 60), derived.
  offr: Offensive rebounds (action 209). Season total for the competition (glkey).
  pcode: KBL player code (six-digit string).
  play_min: Minutes of playing time; add `playSec` seconds. Season total for the competition
