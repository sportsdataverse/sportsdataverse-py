    207 + 208 rows (checked per team on S47G01N49). This game, team total.'
  fgt: Field goals made, two- and three-point (fg + threep). This game, team total.
  fgt_a: Field-goal attempts, two- and three-point (fgA + threepA). This game, team
    total.
  foul: Personal fouls (wft + woft). This game, team total.
  foulout: Players fouled out (unverified). This game, team total.
  ft: Free throws made (action 203). This game, team total.
  ft_a: Free-throw attempts, made + missed (203 + 204). This game, team total.
  game_code: 'Competition inside the season, two digits: 01 regular season, 03 playoffs,
    04 final, 07 EASL, 08 D-League stage 2, 10 All-Star, 11/13 cups, 14 Open Match
    Day.'
  game_no: 'Game number inside the competition (glkey): the N part of the gmkey.'
  gd: Good-defense plays (action 221). This game, team total.
  gmkey: 'Game key S{seasonCode}G{gameCode}N{gameNo} (e.g. S47G01N49): the id of every
    game route and game frame.'
  idf: Illegal-defense violations (action 219; an early-KBL rule, so non-zero only
    in old seasons). This game, team total.
  inout: Times the player entered the game, the start included (checked on the 2025-26
    sample game); a team row sums its players. This game, team total.
  inout1: Times the player was substituted out before the end (checked on the 2025-26
    sample game); a team row sums its players. This game, team total.
  max_conti_score_cn: 'Longest scoring run: the most consecutive points without an
    opponent score. This game, team total.'
  max_lead_score_cn: Largest lead, in points. This game, team total.
  minutes_played: Playing time in minutes (play_min + play_sec / 60), derived.
  netrtg: 'Net rating: offrtg - defrtg. This game, team total.'
  offr: Offensive rebounds (action 209). This game, team total.
  offrtg: 'Offensive rating: points scored per 100 possessions (estimated). This game,
    team total.'
  oreb_rt: Offensive-rebound percentage, 0-100. This game, team total.
  pace: Possessions per 40 minutes (estimated; a player row covers his minutes on
    court). This game, team total.
  play_min: Minutes of playing time summed over the players (200 = 5 x 40 in regulation);
    add playSec. This game, team total.
  play_sec: Seconds part of the playing time (0-59), added to `playMin`. This game,
    team total.
  poss: Possessions (estimated). This game, team total.
  pp: Field goals made in the paint. This game, team total.
  pp_a: Field-goal attempts in the paint. This game, team total.
  pscore: Points in the paint (2 * pp). This game, team total.
  rb: Total rebounds (offr + defr; team rebounds are `teamR`). This game, team total.
  reb_rt: Total-rebound percentage, 0-100. This game, team total.
  sast: Screen assists (action 226; tracked in recent seasons only, 0 before). This
    game, team total.
  score: Points. This game, team total.
  score_high_time_cn: Seconds the team led (the two teams' values sum to less than
    the 2,400-second game when it was tied or level at times). This game, team total.
  season: Season END year (2026 = 2025-26), derived from season_code through the crosswalk
    (kbl_codes.SEASONS).
  season_code: 'KBL season code: one sequential number over every season and D-League
    edition (47 = 2025-26, 48 = the 2025 D-League).'
  sec_chance_score_cn: Second-chance points. This game, team total.
  stl: Steals (action 212). This game, team total.
  team_code: 'KBL team code (2-digit string, e.g. ''50'' = Changwon LG). Joins to
    /common/teamList `teamCode`, game `tcodeH`/`tcodeA`, `t` in text-cast. Not stable
    across ownership changes: the Anyang club is ''40'' (SBS) in 1997-98 and ''70''
    today. D-League sides have their own codes (`teamCodeD`).'
  team_r: Team rebounds (action 218). This game, team total.
  tf: Probably technical fouls (unverified; 0 in most rows). This game, team total.
  tfb: Team fast breaks (action 217). This game, team total.
  threep: Three-point field goals made (action 205). This game, team total.
  threep_a: Three-point attempts, made + missed (205 + 206). This game, team total.
  to: Turnovers (action 214). This game, team total.
  tov_rt: 'Turnover rate: turnovers per 100 possessions, 0-100. This game, team total.'
  ts_rt: True-shooting percentage, 0-100. This game, team total.
  tto: Team turnovers (action 223). This game, team total.
  turnover_score_cn: Points off turnovers. This game, team total.
  wft: Fouls that awarded free throws (action 215). This game, team total.
  woft: Fouls that awarded no free throws (action 216). This game, team total.
kbl_team_tracks:
  game_code: 'Competition inside the season, two digits: 01 regular season, 03 playoffs,
    04 final, 07 EASL, 08 D-League stage 2, 10 All-Star, 11/13 cups, 14 Open Match
    Day.'
  game_number: '1-based game number in the team''s season: the n-th entry of the team''s
    rank track.'
  glkey: 'Competition key S{seasonCode}G{gameCode} (e.g. S47G01 = 2025-26 regular
    season): the id of the season routes.'
  rank: 'Standing (1 = first): after the game_number-th game on the rank track, the
    current rank on the standings routes.'
  season: Season END year (2026 = 2025-26), derived from season_code through the crosswalk
    (kbl_codes.SEASONS).
  season_code: 'KBL season code: one sequential number over every season and D-League
    edition (47 = 2025-26, 48 = the 2025 D-League).'
  team_code: 'KBL team code (2-digit string, e.g. ''50'' = Changwon LG). Joins to
    /common/teamList `teamCode`, game `tcodeH`/`tcodeA`, `t` in text-cast. Not stable
    across ownership changes: the Anyang club is ''40'' (SBS) in 1997-98 and ''70''
    today. D-League sides have their own codes (`teamCodeD`).'
  team_name: Team short name in English (e.g. 'KT').
kbl_teams:
  team_code: 'KBL team code (2-digit string, e.g. ''50'' = Changwon LG). Joins to
    /common/teamList `teamCode`, game `tcodeH`/`tcodeA`, `t` in text-cast. Not stable
    across ownership changes: the Anyang club is ''40'' (SBS) in 1997-98 and ''70''
    today. D-League sides have their own codes (`teamCodeD`).'
  team_code_d: Team code of the club's D-League (reserve) side, in the same team-code
    space as `teamCode`.
  team_name: Team short name (Korean, no space, e.g. '창원LG' = Changwon LG); the English
    form is `teamNameEn`.
  team_name_en: Team short name in English.
  team_name_full: Team full name (Korean).
  team_name_full_en: Team full name in English (e.g. 'CHANGWON LG SAKERS').
