  ast: Assists (action 211). Season total for the competition (glkey).
  back_num: Jersey number (string).
  bs: Blocked shots (action 213). Season total for the competition (glkey).
  defr: Defensive rebounds (action 210). Season total for the competition (glkey).
  dfl: Deflections (action 227; tracked in recent seasons only, 0 before). Season
