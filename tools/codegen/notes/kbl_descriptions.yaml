kbl_current_standings:
  away_losses: Losses in the team's away games.
  away_wins: Wins in the team's away games.
  conti_loss: Current losing streak (0 when the last game was a win).
  conti_win: Current winning streak (0 when the last game was a loss).
  draws: Draws (always 0 in basketball).
  home_losses: Losses in the team's home games.
  home_wins: Wins in the team's home games.
  last_five: 'The last five results as a comma-separated string, most recent first:
    1 win, 0 loss.'
  losses: Losses (a count on this route).
  max_loss: Longest losing streak of the season.
  max_win: Longest winning streak of the season.
  rank: Standing (1 = first).
  team_code: 'KBL team code (2-digit string, e.g. ''50'' = Changwon LG). Joins to
    /common/teamList `teamCode`, game `tcodeH`/`tcodeA`, `t` in text-cast. Not stable
    across ownership changes: the Anyang club is ''40'' (SBS) in 1997-98 and ''70''
    today. D-League sides have their own codes (`teamCodeD`).'
  team_name: 'Team short name (Korean, e.g. ''창원 LG'' = Changwon LG), as it was at
    the time. English names: /common/teamList `teamNameEn` / `teamNameFullEn`, joined
    on the team code.'
  team_name_full: Team full name (Korean, e.g. '창원 LG 세이커스' = Changwon LG Sakers).
  win_diff: Games behind the leader.
  wins: Wins (a count on this route; on /league/rank/{glkey} win is a boolean about
    the latest game).
kbl_game:
  away_coaches: JSON list of the away assistant coaches' names (staff appear by name
    only).
  away_manager: Away head coach's name (officials and coaches appear by name only).
  away_score: Away team final points, summed from the period scores (the header carries
    no totals).
  away_team_code: 'Away team code. KBL team code (2-digit string, e.g. ''50'' = Changwon
    LG). Joins to /common/teamList `teamCode`, game `tcodeH`/`tcodeA`, `t` in text-cast.
    Not stable across ownership changes: the Anyang club is ''40'' (SBS) in 1997-98
    and ''70'' today. D-League sides have their own codes (`teamCodeD`).'
  away_team_name: 'Away team short name (Korean, e.g. ''창원 LG'' = Changwon LG). English
    names: /common/teamList `teamNameEn` / `teamNameFullEn`, joined on the team code.'
  away_team_name_full: Away team full name (Korean).
  crowds: Attendance of the game (spectators).
  detail_url: Path of the game page on www.kbl.or.kr.
  game_code: 'Competition type within the season (2-digit string; code table in the
    README and below): 01 regular season, 03 playoffs, 04 final, ...'
  game_date: Game date (KST).
  game_end: End time, HHMM (KST); '0000' or blanks when not recorded.
  game_no: Game number within the competition (glkey); the N part of the gmkey.
  game_start: Tip-off time, HHMM (KST).
  game_time: Duration of the game in minutes.
  glkey: 'Competition key `S{seasonCode}G{gameCode}` (e.g. S47G01 = 2025-26 regular
    season): the id of the /leagues and /league/rank routes.'
  gmkey: 'Game key `S{seasonCode}G{gameCode}N{gameNo}` (e.g. S47G01N49): the id of
    every /match/{gmkey} route.'
  highlight_url: URL of the game's page on Naver Sports.
  home_coaches: JSON list of the home assistant coaches' names (staff appear by name
    only).
  home_manager: Home head coach's name (officials and coaches appear by name only).
  home_score: Home team final points, summed from the period scores (the header carries
    no totals).
  home_team_code: 'Home team code. KBL team code (2-digit string, e.g. ''50'' = Changwon
    LG). Joins to /common/teamList `teamCode`, game `tcodeH`/`tcodeA`, `t` in text-cast.
    Not stable across ownership changes: the Anyang club is ''40'' (SBS) in 1997-98
    and ''70'' today. D-League sides have their own codes (`teamCodeD`).'
  home_team_name: 'Home team short name (Korean, e.g. ''고양 소노'' = Goyang Sono). English
    names: /common/teamList `teamNameEn` / `teamNameFullEn`, joined on the team code.'
  home_team_name_full: Home team full name (Korean).
  is_ended: '1 when the game is over. Unreliable: 0 on every finished game through
    2005-06 and on some later ones (e.g. S45G01N95''s header); the capture treats
    a past-dated game with scores as final.'
  is_started: 1 when the game has started. Unreliable for old games (0 on finished
    1997-2006 games in /match/list).
  overtimes: Number of overtime periods played (0 for a game decided in regulation).
  playing_quarter: 'Period in progress: ''X'' when none (before or after the game),
    else e.g. ''Q4'' or ''EQ1''. Can stay stale after the game (the overtime sample
    says ''EQ1'').'
  referee_main: Crew chief's name (officials appear by name only).
  referees_sub: JSON list of the umpires' names (officials appear by name only).
  season: Season END year (2026 = 2025-26), derived from season_code through the crosswalk
    (kbl_codes.SEASONS).
  season_category_name: 'Category name in Korean: ''정규시즌'' regular season, ''플레이오프''
    playoffs, ''챔피언결정전'' championship final, ''D리그 1차'' / ''D리그 2차'' D-League stage
    1 / 2, ''올스타게임'' All-Star Game, ''컵대회'' cup, ''KBL컵대회'' KBL Cup, ''EASL'', ''OPEN
    MATCH DAY''.'
  season_code: 'KBL season code: sequential over every season and D-League edition
    (2 = 1997-98, 47 = 2025-26); the crosswalk to the sdv END year is in the README.'
  season_grade: 'Division: 1 = the KBL itself, 2 = the KBL D-League (reserve league).'
  season_name: 'Season label: ''YYYY-YYYY'' for a KBL season (e.g. ''2025-2026''),
    ''1997'' for the 1997 inaugural season, or the D-League edition name (e.g. ''2010KBLWINTER'',
    ''2024 KBL D리그'' = 2024 KBL D-League).'
  stadium_name: Venue short name (Korean).
  stadium_name_en: Venue name in English; an empty string, or the Korean name, for
    some old venues.
  stadium_name_full: Venue full name (Korean).
  tv: Broadcaster name(s), e.g. 'tvN SPORTS', 'SPOTV2 / SPOTV ON'.
  tv_code: Broadcaster code(s), comma-separated (e.g. 'T24,T25'); the site uses it
    instead of `tv` from seasonCode 45.
  week_day: 'Day of the week in Korean: 월 Mon, 화 Tue, 수 Wed, 목 Thu, 금 Fri, 토 Sat,
    일 Sun.'
kbl_game_leaders:
  game_code: 'Competition inside the season, two digits: 01 regular season, 03 playoffs,
    04 final, 07 EASL, 08 D-League stage 2, 10 All-Star, 11/13 cups, 14 Open Match
    Day.'
  game_no: 'Game number inside the competition (glkey): the N part of the gmkey.'
  gmkey: 'Game key S{seasonCode}G{gameCode}N{gameNo} (e.g. S47G01N49): the id of every
    game route and game frame.'
  part: 'Category code: score points, rb rebounds, ast assists, stl steals, bs blocks.'
  pcode: KBL player code (six-digit string) of the team's leader in the category.
  play_min: Minutes the leader played this game; add play_sec seconds.
  play_sec: Seconds part of the leader's playing time (0-59).
  player_name: Leader's name in Korean (foreign players in Hangul transliteration).
  player_name_en: Leader's name in English / romanized.
  season: Season END year (2026 = 2025-26), derived from season_code through the crosswalk
    (kbl_codes.SEASONS).
  season_code: 'KBL season code: one sequential number over every season and D-League
    edition (47 = 2025-26, 48 = the 2025 D-League).'
  side: 'Side of the leader: home or away.'
  team_name: The leader's team short name (Korean).
  value: The leader's total in the category in this game.
kbl_pbp:
  action: English meaning of action_code (kbl_codes.ACTIONS), translated from the
    site's Korean label; null for an unknown code.
  action_code: Action code (string, e.g. '201'); table in the returns md.
  action_ko: The site's own Korean label of action_code (e.g. 2점슛성공 = two-point field
    goal made).
  action_number: 1-based position of the event in the feed, which is in game order
    (the wire's n is 0 on every row of some games).
  clock_seconds_left: Seconds left in the period (minutes_left * 60 + seconds_left);
    quarters are 10 minutes, overtimes 5.
  event_number: Sequence number of the event in the game (1-based); 0 on every row
    of some games (e.g. S45G01N95), so order by array position.
  foul: English meaning of foul_code (e.g. TCF = technical foul). No sampled row carries
    a foul code, so this is unverified.
  foul_code: 'Foul type code (the site reads an f field; no sampled row carries it):
    PNF personal, TCF technical, FRF unsportsmanlike, FTF fighting, PCF punching,
    EBF elbow.'
  game_code: 'Competition inside the season, two digits: 01 regular season, 03 playoffs,
    04 final, 07 EASL, 08 D-League stage 2, 10 All-Star, 11/13 cups, 14 Open Match
    Day.'
  game_no: 'Game number inside the competition (glkey): the N part of the gmkey.'
  gmkey: 'Game key S{seasonCode}G{gameCode}N{gameNo} (e.g. S47G01N49): the id of every
    game route and game frame.'
  minutes_left: Minutes remaining in the period (10-minute quarters, 5-minute overtimes).
  period: 'Period number: 1-4 for the quarters, 5, 6, ... for the overtimes (the wire
    says X1 in the play-by-play, EQ1 in the match chart).'
  period_label: 'Period label: Q1-Q4, then OT1, OT2, ... (normalised from the wire''s
    X1 / EQ1 / eq1).'
  player_name: Player name in Korean; absent on team and game events.
  player_name_en: Player name in English / romanized; absent on team and game events.
  points: 'Points the event scored: 2 for a made two-point shot or dunk (201, 207),
    3 for a made three (205), 1 for a made free throw (203); null otherwise.'
  season: Season END year (2026 = 2025-26), derived from season_code through the crosswalk
    (kbl_codes.SEASONS).
  season_code: 'KBL season code: one sequential number over every season and D-League
    edition (47 = 2025-26, 48 = the 2025 D-League).'
  seconds_left: Seconds part of the time remaining (0-59).
  substitution: English meaning of substitution_code on substitution-out rows (e.g.
    106_1 = fouled out, five fouls); null otherwise.
  substitution_code: Substitution sub-type code on substitution-out (102) rows (e.g.
    '101_0'); table in the returns md.
  team_code: Team code of the acting team (the KBL team code, as `tcodeH`/`tcodeA`);
    '' (or ' ' in 1997-98) on game events such as period start/end.
kbl_period_scores:
  game_code: 'Competition inside the season, two digits: 01 regular season, 03 playoffs,
    04 final, 07 EASL, 08 D-League stage 2, 10 All-Star, 11/13 cups, 14 Open Match
    Day.'
  game_no: 'Game number inside the competition (glkey): the N part of the gmkey.'
  gmkey: 'Game key S{seasonCode}G{gameCode}N{gameNo} (e.g. S47G01N49): the id of every
    game route and game frame.'
  period: 'Period number: 1-4 for the quarters, 5, 6, ... for the overtimes (the wire
    says X1 in the play-by-play, EQ1 in the match chart).'
  period_label: 'Period label: Q1-Q4, then OT1, OT2, ... (normalised from the wire''s
    X1 / EQ1 / eq1).'
  score: Points the side scored in the period.
  season: Season END year (2026 = 2025-26), derived from season_code through the crosswalk
    (kbl_codes.SEASONS).
  season_code: 'KBL season code: one sequential number over every season and D-League
    edition (47 = 2025-26, 48 = the 2025 D-League).'
  side: 'Which side of the game the row belongs to: home or away.'
  team_code: 'Team code: the KBL club in that season (two-digit string with a leading
    zero, e.g. ''50'' = Changwon LG). Joins kbl_teams team_code; not stable across
    ownership changes (the Anyang club is ''40'' in 1997-98, ''70'' today).'
kbl_player_box:
  ast: Assists (action 211). This game.
  ast_ratio: 'Assist ratio: assists per 100 possessions used. This game.'
  ast_rt: 'Assist rate: share of teammates'' field goals assisted while on court,
    0-100. This game.'
  ast_to: Assist-to-turnover ratio. This game.
  back_num: Jersey number (string).
  bs: Blocked shots (action 213). This game.
  defr: Defensive rebounds (action 210). This game.
  defrtg: 'Defensive rating: points allowed per 100 possessions (estimated). This
    game.'
  dfl: Deflections (action 227; tracked in recent seasons only, 0 before). This game.
  dk: Dunks made (action 207); included in `fg`. This game.
  dk_a: Dunk attempts (made + missed, actions 207 + 208). This game.
  dreb_rt: Defensive-rebound percentage, 0-100. This game.
  ef: Meaning unverified (0 in every game sample; non-zero in some season totals).
    This game.
  efg_rt: Effective field-goal percentage, 0-100. This game.
  fb: Fast breaks credited to the player (action 217 rows that name a player, as in
    1997-98); 0 in recent seasons, where fast breaks are team rows (`tfb`). This game.
  fg: 'Two-point field goals made, dunks included: 201 + 207 rows (score = 2*fg +
    3*threep + ft holds on every sampled box). This game.'
  fg_a: 'Two-point field-goal attempts, made + missed, dunks included: 201 + 202 +
    207 + 208 rows (checked per team on S47G01N49). This game.'
  fgt: Field goals made, two- and three-point (fg + threep). This game.
  fgt_a: Field-goal attempts, two- and three-point (fgA + threepA). This game.
  fo: Fouls drawn (the player rows of a team sum to the opponent's `foul`, checked
    on the 2025-26 sample game). This game.
  foul: Personal fouls (wft + woft). This game.
  ft: Free throws made (action 203). This game.
  ft_a: Free-throw attempts, made + missed (203 + 204). This game.
  game_code: 'Competition inside the season, two digits: 01 regular season, 03 playoffs,
    04 final, 07 EASL, 08 D-League stage 2, 10 All-Star, 11/13 cups, 14 Open Match
    Day.'
  game_no: 'Game number inside the competition (glkey): the N part of the gmkey.'
  gd: Good-defense plays (action 221). This game.
  gmkey: 'Game key S{seasonCode}G{gameCode}N{gameNo} (e.g. S47G01N49): the id of every
    game route and game frame.'
  home_away: 'Side (string): ''1'' home, ''2'' away; ''3'' on both teams'' rows in
    the 1997-98 sample, so join on `player.tcode` instead.'
  idf: Illegal-defense violations (action 219; an early-KBL rule, so non-zero only
    in old seasons). This game.
  inout: Times the player entered the game, the start included (checked on the 2025-26
    sample game); a team row sums its players. This game.
  inout1: Times the player was substituted out before the end (checked on the 2025-26
    sample game); a team row sums its players. This game.
  margin_cn: 'Plus-minus: the point margin while the player was on court. This game.'
  minutes_played: Playing time in minutes (play_min + play_sec / 60), derived.
  netrtg: 'Net rating: offrtg - defrtg. This game.'
  offr: Offensive rebounds (action 209). This game.
  offrtg: 'Offensive rating: points scored per 100 possessions (estimated). This game.'
  oreb_rt: Offensive-rebound percentage, 0-100. This game.
  pace: Possessions per 40 minutes (estimated; a player row covers his minutes on
    court). This game.
  pcode: KBL player code (6-digit string). Joins to `pcode` on every route and to
    `playerNo` in /league/round-mvp.
  per: Player efficiency rating (KBL's formula; scale unverified). This game.
  pie: 'Player impact estimate: share of the game''s positive events, as a percentage.
    This game.'
  play_min: Minutes of playing time; add `playSec` seconds. This game.
  play_sec: Seconds part of the playing time (0-59), added to `playMin`. This game.
  player_flag: 'Player type (string): ''0'' domestic, ''1'' foreign import, ''2''
    Asian-quota player.'
  player_name: Player name in Korean (foreign players in Hangul transliteration).
  player_name_en: Player name in English / romanized (sometimes Hangul for former
    players, e.g. 'CJ 레슬리').
  pos: 'Position code (string): C center, FD forward, GD guard, FC forward-center,
    GF guard-forward; table in the returns md.'
  poss: Possessions (estimated). This game.
  pp: Field goals made in the paint. This game.
  pp_a: Field-goal attempts in the paint. This game.
  pscore: Points in the paint (2 * pp). This game.
  rb: Total rebounds (offr + defr; team rebounds are `teamR`). This game.
  reb_rt: Total-rebound percentage, 0-100. This game.
  sast: Screen assists (action 226; tracked in recent seasons only, 0 before). This
    game.
  score: Points. This game.
  season: Season END year (2026 = 2025-26), derived from season_code through the crosswalk
    (kbl_codes.SEASONS).
  season_code: 'KBL season code: one sequential number over every season and D-League
    edition (47 = 2025-26, 48 = the 2025 D-League).'
  started: 1 when the player started the game, else 0.
  stl: Steals (action 212). This game.
  team_code: 'KBL team code (2-digit string, e.g. ''50'' = Changwon LG). Joins to
    /common/teamList `teamCode`, game `tcodeH`/`tcodeA`, `t` in text-cast. Not stable
    across ownership changes: the Anyang club is ''40'' (SBS) in 1997-98 and ''70''
    today. D-League sides have their own codes (`teamCodeD`).'
  team_name: 'Team short name (Korean, e.g. ''창원 LG'' = Changwon LG), as it was at
    the time. English names: /common/teamList `teamNameEn` / `teamNameFullEn`, joined
    on the team code.'
  tf: Probably technical fouls (unverified; 0 in most rows). This game.
  threep: Three-point field goals made (action 205). This game.
  threep_a: Three-point attempts, made + missed (205 + 206). This game.
  to: Turnovers (action 214). This game.
  to_ratio: 'Turnover ratio: turnovers per 100 possessions used. This game.'
  tov_rt: 'Turnover rate: turnovers per 100 possessions, 0-100. This game.'
  ts_rt: True-shooting percentage, 0-100. This game.
  usg_rt: 'Usage rate: share of team possessions used while on court, 0-100. This
    game.'
  wft: Fouls that awarded free throws (action 215). This game.
  woft: Fouls that awarded no free throws (action 216). This game.
