  game_number: 'Game number within the round or pairing (a string: ''1'', ''A'').'
  game_play_by_play_status_code: 'Play-by-play availability flag: VALID or EMPTY.
    UNRELIABLE: World Cup 2014 and EuroBasket 2017 say EMPTY but their game pages
    carry full play-by-play; always check the page.'
  game_result_additional_information: Free-text result note (forfeit, overtime remark);
    null when none.
  game_result_status_code: 'Result validation status: VALID.'
  game_statistic_status_code: 'Box-score validation status: VALID.'
  group_id: Group id (GDAP key space).
  group_pairing_code: Group letter (group play) or pairing number (knockout bracket
    slot).
  has_time_game_date_time: False when only the date is known (the time part is then
    00:00:00).
  host_city: City of the venue.
  host_country: Country of the venue (name; a FIBA code in getgdapgameswithleaderdetailsbyteamid).
  host_country_code: FIBA code of the venue's country.
  iana_time_zone: IANA time zone of the venue.
  is_live: True while the game is being played.
  is_played_behind_closed_doors: True when played without spectators.
  is_postponed: True when the game was postponed.
  live_game_status: 'Live state code: 999 on every finished game; 5 seen on a finished
    2024 youth game; mapping unverified.'
  round_end_date: Round end, local date-time (23:59:59.9999999 on the last day).
  round_game_system: Pairing system label (Single, Home and Away, Best of 3).
  round_game_system_code: 'Pairing system code: S single game, HA home and away, BOF3
    best of three.'
  round_round_code: Round code (GP group phase, QF, SF, F final, RS regular season,
    CL17-32 classification...).
  round_round_id: Round id (GDAP key space, unique across competitions); the first
    segment of gameName.
  round_round_kind: Standard Round or Qualifiers.
  round_round_name: Round label (Group Phase, Quarter-Finals, Final...).
  round_round_number: Round number within the competition (1-based).
  round_round_order: Display order of the round.
  round_round_status_code: 'Round status: COMPL completed, PROGR in progress, CLOS
    closed.'
  round_round_type: 'Round type label: Group Round, Non Group Round, Super Round (getgdapgamesbycompetitionid
    uses the code G/NG here).'
  round_start_date: Round start, local date-time.
  spectators: Attendance at the game, as recorded by FIBA.
  statistic_system: 'Live-stats system that scored the game: OVR (FIBA''s Olympic/World
    Cup system), FLS (FIBA LiveStats), null before about 2006.'
  status_code: 'Game status code: VALID (validated result), CLOS (closed, pre-2000
    rows).'
  team_a_code: 'Team code (national: FIBA country code; club: a club abbreviation
    such as OOST).'
  team_a_from: How team A qualified for this slot ('Winner of Game 87', '1st of group
    C'); null in group play.
  team_a_official_name: 'Official name of team A: the country for a national team,
    the club for a club team.'
  team_a_organisation_id: 'Organisation id, stable across competitions and seasons:
    the national federation for a national team (64 = Germany), the club for a club
    team (396 = Filou Oostende). Same key space as nationalFederationId, clubId, play-by-play
    oId and the game page''s T_<id>.'
  team_a_score: Final score of team A.
  team_a_short_name: 'Short name of team A: the country code for a national team,
    the club''s short name for a club.'
  team_a_team_id: 'Competition team id: one per team per competition (Germany = 279569
    at the 2023 World Cup, 281545 at Paris 2024). Joins getgdapcompetitionteamrosterbyteamid
    / getgdapcompetitionteamstatisticsbyteamid gdapTeamId; not an organisationId.'
  team_b_code: 'Team code (national: FIBA country code; club: a club abbreviation
    such as NANT).'
  team_b_from: How team B qualified for this slot ('Winner of Game 88', '2nd of group
    A'); null in group play.
  team_b_official_name: 'Official name of team B: the country for a national team,
    the club for a club team.'
  team_b_organisation_id: 'Organisation id, stable across competitions and seasons:
