fiba_gdap_awards:
  award_code: Award code (ALLSTAR, MVP...).
  award_date: Date awarded, YYYY-MM-DD.
  award_label: Extra label; null in every sample.
  award_level: 'Level the award is given at: Competition.'
  award_level_id: 'Id of the object the award is attached to: the competitionId when
    awardLevel is Competition.'
  award_name: Award name (All-Star 5, MVP...).
  competition_end_date: Last day of the competition, YYYY-MM-DD.
  competition_id: 'FIBA competition id (GDAP key space): one per edition (2023 World
    Cup = 208182, BCL 2024-25 = 208850); gdapCompetitionId.'
  competition_official_name: Official name of the competition edition the award was
    given in.
  competition_season: 'Season key, three rules: the END year for club competitions
    (BCL 2024-25 = 2025) and the event year for national-team events (World Cup 2023
    = 2023), both equal to the sdv season key; qualifiers carry the TARGET tournament
    year, not the year played (World Cup 2027 qualifiers played in 2025 = 2027, EuroBasket
    2029 pre-qualifiers = 2029), whose sdv mapping is an open Phase B decision.'
  player_date_of_birth: Awarded player's date of birth, YYYY-MM-DD.
  player_first_name: Awarded player's first name.
  player_id: 'FIBA person id, global across competitions and roles (player, coach,
    official): roster personId = play-by-play pId = game-page P_<id> = gdapPlayerId.'
  player_last_name: Awarded player's last name.
  player_nationality: Awarded player's nationality, FIBA code.
  teams: Teams the awarded player played for in the competition. Stored as a JSON
    string.
fiba_gdap_competition:
  age_category: Age category (Senior, Under 16...).
  competition_category_age_type: 'Age type code: S senior, U16.'
  competition_category_code: Category code (WC World Cup, OLY Olympic Tournament,
    CCC-1 continental club tier 1).
  competition_category_is_league: True for league-format club competitions.
  competition_category_name: Name of the competition's category (FIBA Basketball World
    Cup, Olympic Basketball Tournament...).
  competition_code: Competition code (WMM men's World Cup, WOLYM, BCL, ELW...).
  competition_id: 'FIBA competition id (GDAP key space): one per edition (2023 World
    Cup = 208182, BCL 2024-25 = 208850); gdapCompetitionId.'
  competition_marketing_name_code: Family code; null in every sample.
  competition_marketing_name_competition_marketing_name_id: Competition family id
    (201 = World Cup, 112 = BCL tier 1, 211 = EuroLeague Women); the <histId> of /en/history/
    pages.
  competition_marketing_name_marketing_name: Competition family name; slugified it
    is the <histSlug> of /en/history/ pages.
  competition_type: National Teams or Clubs.
  discipline: Discipline (Basketball; 3x3 is a separate platform).
  end: Last day, YYYY-MM-DD.
  fiba_zone: FIBA zone the competition belongs to (World, Europe, Americas...).
  gender: 'Men or Women: the gender of the competition.'
  hosts: Host countries with their cities. Stored as a JSON string.
  official: Official-status label.
  official_flag_item_code: 'Official-status code: O = official.'
  official_flag_item_name: Official-status label.
  official_name: Edition title (FIBA Basketball World Cup; Paris 2024 Men's Olympic
    Basketball Tournament).
  season: 'Season key, three rules: the END year for club competitions (BCL 2024-25
    = 2025) and the event year for national-team events (World Cup 2023 = 2023), both
    equal to the sdv season key; qualifiers carry the TARGET tournament year, not
    the year played (World Cup 2027 qualifiers played in 2025 = 2027, EuroBasket 2029
    pre-qualifiers = 2029), whose sdv mapping is an open Phase B decision.'
  start: First day, YYYY-MM-DD.
  status: 'Competition status: In Progress, Completed, Closed.'
  zone_information_top_zone_code: Parent zone code; always null in the samples, values
    unverified.
  zone_information_top_zone_id: Parent zone id; null for top zones.
  zone_information_top_zone_official_name: Parent zone name; always null in the samples,
    values unverified.
  zone_information_zone_code: Zone code (W, E, AF, AM, AS, OC).
  zone_information_zone_id: FIBA zone id (1 = World, 23 = Europe; zone table key space).
  zone_information_zone_official_name: Official name of the competition's FIBA zone
    (FIBA Europe, FIBA Americas, World).
