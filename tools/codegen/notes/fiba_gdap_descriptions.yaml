  venue_capacity: Venue capacity (0 = unknown).
  venue_id: Venue id (GDAP key space; 0 = unknown).
  venue_name: Name of the arena the game is played in.
  window_code: Qualifier window code; null otherwise.
  window_name: Qualifier window name; null otherwise.
