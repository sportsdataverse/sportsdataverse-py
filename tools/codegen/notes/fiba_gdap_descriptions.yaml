    (T00:00:00 when hasTimeGameDateTime is false).
  game_date_time_utc: Tip-off in UTC, ISO 8601 without the Z.
  game_id: 'FIBA game id, global across competitions (GDAP key space): gdapGameId,
    the <gameId> of a game-page URL.'
