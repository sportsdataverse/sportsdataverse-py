  shots_3p_total_sum: Season total of 3-point field goals attempted.
  slam_dunk_sum: Season total of dunks.
  start_formation: Games the player started, in the request's championship series.
  suffered_fouls_sum: Season total of fouls drawn.
  team_id: Team-season id (re-issued every season); join lba_teams for the stable
    club_id.
  total_matches: Team games while the player was listed (inferred).
  total_rebound_sum: Season total of total rebounds.
lba_teams:
  club_code: Club code (`TVB`, `TS`); whether it is stable across seasons is unverified.
  club_id: 'Club id: the cross-season join key for team ids (only here and in the
    `team` headers); stability across seasons is unverified.'
  logo_key: 'Image key: the image is `{cdn_url}/{key}`, resized copies `{cdn_url}/variants/{key}/thumb`
    or `/large` (the site''s getApiImageUrl).'
  name: Team name of that season (sponsor name).
  season: 'Season END year (2027 = 2026-27): the row''s START year + 1.'
  team_id: Team id (one team-season).
  updated_at: Timestamp, ISO-8601 with the Italian offset.
  year: Season START year (2026 = 2026-27); sdv END year = year + 1.
lba_teams_leaderboard:
  attempts: Shots attempted in the zone, parsed from num.
  category: Category of this row (the `cat` param, e.g. `points`).
  logo_key: 'Image key: the image is `{cdn_url}/{key}`, resized copies `{cdn_url}/variants/{key}/thumb`
    or `/large` (the site''s getApiImageUrl).'
  minutes: 'Minutes per game (players: decimal string `28.67`) / total minutes (teams:
    integer).'
  name: Given name (players) / team name (teams).
  score: Value in the category under the `ob` order (default `avg` = per game); players
    send a decimal string, teams a number.
  score_40_min: Value per 40 minutes.
  season: 'Season END year (2027 = 2026-27): the row''s START year + 1.'
  short_name: Short name of the team, e.g. BC Roma.
  sponsor_name: Sponsor name (empty or null in the samples).
  team_id: Team id (team-season).
  total_played_matches: Games the team has played, counted for the leaderboard.
  total_points: Points scored (offensive) or allowed (defensive) in the season.
  tv_name: Short team name for TV graphics.
  year: Season START year (2026 = 2026-27); sdv END year = year + 1.
