tpbl_player_shots:
  division_id: 'TPBL division id (key space: TPBL divisions, one competition phase
    of one season; 1, 2, 5, 6, 7 = 2024-25, 8, 9, 11, 12, 35 = 2025-26, 655, 656 =
    2026-27): the {division_id} of every division route. Not the GoHoops division
    id.'
  is_made: True when the shot went in.
  offense_basket: 'Basket the player''s team attacked: 0 = the hoop at x = 1575, 1
    = the hoop at x = 26425.'
  player_id: 'TPBL player id (key space: TPBL players; one per person across seasons
    and teams): the {player_id} of the player routes. Not the GoHoops person id and
    not the roster id.'
  point_x: Shot position in MILLIMETRES, 0-28000 along the court length (a 28 m court).
    The hoops sit at x = 1575 (offense_basket 0) and x = 26425 (offense_basket 1),
    y = 7500. Same frame as the team list, where it was verified; here it is only
    checked to stay on the court.
  point_y: Shot position in MILLIMETRES, 0-15000 across the court (a 15 m court).
    The hoops sit at x = 1575 (offense_basket 0) and x = 26425 (offense_basket 1),
    y = 7500. The direction of y is unverified.
tpbl_referees:
  game_id: 'TPBL game id (key space: TPBL games on api.tpbl.basketball): the {game_id}
    of the game routes. Not sequential by date (2024-25 = 1-1367, 2025-26 = 1371-8641,
    2026-27 = 27535-27667). The box score echoes no game id, so a box frame parsed
    without the request stamp has a null game_id.'
  gohoops_referee_id: 'GoHoops referee id (key space: GoHoops referees). Not the TPBL
    referee id.'
  name: 'Referee name in Traditional Chinese. Names only: no contact or birth data
    is published.'
  referee_id: 'TPBL referee id (key space: TPBL referees on api.tpbl.basketball).
    Not the GoHoops referee id.'
  role: 'Crew role enum: BASKETBALL_CHIEF_REFEREE = crew chief, BASKETBALL_FIRST_ASSISTANT_REFEREE
    = first assistant (umpire 1), BASKETBALL_SECOND_ASSISTANT_REFEREE = second assistant
    (umpire 2).'
  sequence: 'Position in the crew as the API lists it: 1 = the chief referee.'
tpbl_roster:
  alt_name: Romanized name (e.g. 'Chian Kuang-Chien'); '' when none.
  division_id: 'TPBL division id (key space: TPBL divisions, one competition phase
    of one season; 1, 2, 5, 6, 7 = 2024-25, 8, 9, 11, 12, 35 = 2025-26, 655, 656 =
    2026-27): the {division_id} of every division route. Not the GoHoops division
    id.'
  gohoops_event_id: 'GoHoops event id (key space: GoHoops events, one per TPBL season;
    319 = 2024-25, 490 = 2025-26, 613 = 2026-27). Not the TPBL season id and not the
    GoHoops season id.'
  gohoops_person_id: 'GoHoops person id (key space: GoHoops persons; one per human).
    Not the TPBL player id and not the roster id.'
  gohoops_roster_id: 'GoHoops roster id (key space: GoHoops rosters = one player registered
    with one squad in one season; it changes when the player changes season or team).
    The key of the box score players: join tpbl_box_players to tpbl_roster on it.
    Not the TPBL player id and not the person id.'
  gohoops_season_id: 'GoHoops season id (key space: GoHoops seasons, the id system
    the API echoes beside its own; 101 = 2024-25, 213 = 2025-26, 275 = 2026-27). Not
    the TPBL season id.'
  gohoops_squad_id: 'GoHoops squad id (key space: GoHoops squads = one team in one
    season: 8209-8215 in 2024-25, 11931-11937 in 2025-26, 15536-15542 in 2026-27;
    it changes every season).'
  height_cm: Height in centimetres.
  is_listing: True when the player is shown on the team's public roster page.
  national_identity: 'Player category: ''Local'' (Taiwanese), '''' when unset (foreign
    and naturalized categories use other strings).'
  national_identity_detail: Free-text detail on the category; '' in every sample.
  nationality: 'Nationality text: ''Local'' for a Taiwan-born player, '''' when unset.'
  number: Jersey number as text (so '0' and '00' stay distinct).
  player: Player name (Traditional Chinese, or a transliteration for foreign players).
  player_id: 'TPBL player id (key space: TPBL players; one per person across seasons
    and teams): the {player_id} of the player routes. Not the GoHoops person id and
    not the roster id.'
  position: 'Playing position as a PascalCase enum: PointGuard, ShootingGuard, SmallForward,
    PowerForward, Center, and the combinations PointGuardAndShootingGuard, ShootingGuardAndSmallForward,
    SmallForwardAndPowerForward and PowerForwardAndCenter; '''' when unset.'
  registered: True when the player is registered with the squad.
  team: Team name in Traditional Chinese with the sponsor (高雄全家海神 = Kaohsiung Aquas,
    福爾摩沙夢想家 = Formosa Dreamers, 新竹御嵿攻城獅 = Hsinchu Lioneers, 桃園台啤永豐雲豹 = Taoyuan Leopards,
    新北中信特攻 = New Taipei CTBC DEA, 新北國王 = New Taipei Kings, 臺北台新戰神 = Taipei Mars).
  team_id: 'TPBL team id (key space: TPBL teams = franchises, 2-8 so far; stable across
    seasons): the {team_id} of the division team routes. Not the GoHoops franchise
    id and not the squad id.'
  weight_kg: Weight in kilograms (a number; fractions possible).
tpbl_seasons:
  ended_at: Season end, 'YYYY-MM-DD 00:00:00' text (the planned end for a season in
    progress).
  gohoops_season_id: 'GoHoops season id (key space: GoHoops seasons, the id system
    the API echoes beside its own; 101 = 2024-25, 213 = 2025-26, 275 = 2026-27). Not
    the TPBL season id.'
  name: 'Season label in Traditional Chinese: ''2024-2025 賽季'' = ''season 2024-2025''.'
  season: 'Season END year, read from the label ''2024-2025 賽季'' (賽季 = season): 2025
    for 2024-25.'
  season_id: 'TPBL season id (key space: TPBL seasons on api.tpbl.basketball; 1 =
    2024-25, 2 = 2025-26, 3 = 2026-27): the {season_id} of the season game list and,
    equal to it, the {event_id} of /events/{event_id}/*. Not the GoHoops season id.'
  started_at: Season start, 'YYYY-MM-DD 00:00:00' text. Preseason games can be played
    before it (the 2026-27 start is 2026-10-17, its first games were played 2026-10-09).
  status: 'Season status: COMPLETED or IN_PROGRESS.'
tpbl_standings:
