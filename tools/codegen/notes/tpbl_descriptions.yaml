tpbl_box_player_periods:
  assists: Assists by the player in this quarter.
  back_court_turnovers: Turnovers of type 'back-court violation' by the player in
    this quarter.
  bad_pass_turnovers: Turnovers of type 'bad pass' by the player in this quarter.
  ball_handling_turnovers: Turnovers of type 'ball-handling error' by the player in
    this quarter.
  blocks: Blocked shots by the player in this quarter.
  carry_turnovers: Turnovers of type 'carrying' by the player in this quarter.
  defensive_fouls: Fouls committed on defense by the player in this quarter.
  defensive_rebounds: Defensive rebounds by the player in this quarter.
  disqualifying_fouls: Disqualifying fouls by the player in this quarter.
  double_dribble_turnovers: Turnovers of type 'double dribble' by the player in this
    quarter.
  efg: 'Effective field-goal percentage by the player in this quarter, 0-100 as a
    string with one decimal rounded half up: (FGM + 0.5 x 3PM) / FGA; ''0.0'' without
    attempts.'
  entered: 'Always true here: only quarters in which the player was on court are rows.'
  fast_break_points: Points scored on the fast break by the player in this quarter.
  field_goals_attempted: Field goals attempted by the player in this quarter.
  field_goals_attempted_in_the_paint: Field goals attempted in the paint by the player
    in this quarter.
  field_goals_attempted_on_fast_break: Field goals attempted on the fast break by
    the player in this quarter.
  field_goals_attempted_on_second_chance: Field goals attempted on a second chance
    (after an offensive rebound) by the player in this quarter.
  field_goals_made: Field goals made by the player in this quarter.
  field_goals_made_in_the_paint: Field goals made in the paint by the player in this
    quarter.
  field_goals_made_on_fast_break: Field goals made on the fast break by the player
    in this quarter.
  field_goals_made_on_second_chance: Field goals made on a second chance (after an
    offensive rebound) by the player in this quarter.
  field_goals_missed: Field goals missed by the player in this quarter.
  field_goals_missed_in_the_paint: Field goals missed in the paint by the player in
    this quarter.
  field_goals_missed_on_fast_break: Field goals missed on the fast break by the player
    in this quarter.
  field_goals_missed_on_second_chance: Field goals missed on a second chance (after
    an offensive rebound) by the player in this quarter.
  field_goals_percentage: Field goals percentage by the player in this quarter, 0-100
    as a string with one decimal ('57.1'); '0.0' without attempts.
  five_seconds_turnovers: Turnovers of type 'five-second violation' by the player
    in this quarter.
  fouls: 'Fouls charged by the player in this quarter: personal + technical + unsportsmanlike
    + disqualifying; equals defensive_fouls + offensive_fouls (checked on 4,237 played
    player lines of 189 games).'
  free_throws_attempted: Free throws attempted by the player in this quarter.
  free_throws_made: Free throws made by the player in this quarter.
  free_throws_missed: Free throws missed by the player in this quarter.
  free_throws_percentage: Free throws percentage by the player in this quarter, 0-100
    as a string with one decimal ('57.1'); '0.0' without attempts.
  game_id: 'TPBL game id (key space: TPBL games on api.tpbl.basketball): the {game_id}
    of the game routes. Not sequential by date (2024-25 = 1-1367, 2025-26 = 1371-8641,
    2026-27 = 27535-27667). The box score echoes no game id, so a box frame parsed
    without the request stamp has a null game_id.'
  gohoops_person_id: 'GoHoops person id (key space: GoHoops persons; one per human).
    Not the TPBL player id and not the roster id.'
  gohoops_roster_id: 'GoHoops roster id (key space: GoHoops rosters = one player registered
    with one squad in one season; it changes when the player changes season or team).
    The key of the box score players: join tpbl_box_players to tpbl_roster on it.
    Not the TPBL player id and not the person id.'
  gohoops_squad_id: 'GoHoops squad id (key space: GoHoops squads = one team in one
    season: 8209-8215 in 2024-25, 11931-11937 in 2025-26, 15536-15542 in 2026-27;
    it changes every season).'
  is_starting: True when the player was in the starting five of the game.
  number: Jersey number as text (so '0' and '00' stay distinct).
  offensive_foul_turnovers: Turnovers of type 'offensive foul' by the player in this
    quarter.
  offensive_fouls: Fouls committed on offense by the player in this quarter.
  offensive_goal_tending_turnovers: Turnovers of type 'offensive goaltending' by the
    player in this quarter.
  offensive_rebounds: Offensive rebounds by the player in this quarter.
  other_turnovers: Turnovers of type 'other' by the player in this quarter.
  out_of_bounds_turnovers: Turnovers of type 'out of bounds' by the player in this
    quarter.
  period: 'Quarter number of the row: 1-4 regulation, 5 = the first overtime, 6 =
    the second.'
  personal_fouls: Personal fouls by the player in this quarter (excludes technical,
    unsportsmanlike and disqualifying fouls).
  pir: 'Performance Index Rating by the player in this quarter: efficiency - fouls
    (verified on all 4,237 played player lines of 189 games).'
  player: Player name (Traditional Chinese, or a transliteration for foreign players).
  player_id: 'TPBL player id (key space: TPBL players; one per person across seasons
    and teams): the {player_id} of the player routes. Not the GoHoops person id and
    not the roster id.'
  plus_minus: 'Plus/minus: the team''s point differential while the player was on
    court (standard definition; not independently checked).'
  points_in_paint: Points scored in the paint by the player in this quarter.
  points_off_turnovers: Points scored off opponent turnovers by the player in this
    quarter.
  position: 'Playing position as a PascalCase enum: PointGuard, ShootingGuard, SmallForward,
    PowerForward, Center, and the combinations PointGuardAndShootingGuard, ShootingGuardAndSmallForward,
    SmallForwardAndPowerForward and PowerForwardAndCenter; '''' when unset.'
  rebounds: Total rebounds by the player in this quarter (offensive + defensive).
  roster_status: 'Roster registration status as an upper-case enum: ''OFFICIAL'' in
    the 2026-27 preseason game; null in the 2024-25 and 2025-26 box scores (an era
    difference in the feed).'
  score: Points scored by the player in this quarter. The stat keys are absent for
    a player who did not enter the game (11 keys in all); a few players who did not
    play carry them with time_on_court 0.
  second_chance_points: Points scored on second chances (after an offensive rebound)
    by the player in this quarter.
  side: 'Side of the game: home or away (the API lists the home team first and never
    infers it from the venue).'
  status: 'Registration status of the player on the squad as of the request, not at
    game time: ''official'', or ''withdrawn'' / ''WITHDRAWN'' (one state in two spellings:
    the player left the squad later; most withdrawn players still played).'
  steals: Steals by the player in this quarter.
  team: Team name in Traditional Chinese with the sponsor (高雄全家海神 = Kaohsiung Aquas,
    福爾摩沙夢想家 = Formosa Dreamers, 新竹御嵿攻城獅 = Hsinchu Lioneers, 桃園台啤永豐雲豹 = Taoyuan Leopards,
    新北中信特攻 = New Taipei CTBC DEA, 新北國王 = New Taipei Kings, 臺北台新戰神 = Taipei Mars).
  team_id: 'TPBL team id (key space: TPBL teams = franchises, 2-8 so far; stable across
    seasons): the {team_id} of the division team routes. Not the GoHoops franchise
    id and not the squad id.'
