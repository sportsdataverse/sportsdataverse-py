# Source registry: which provider (data source) or helper category every public
# function belongs to. ORDER IS TABLE ORDER on every rendered docs page.
#
# One source = one provider. Resolution per public function (tools/codegen/sources.py):
#   1. `functions:` glob on the function name
#   2. `modules:` glob on obj.__module__
#   3. the ESPN API / flat-API stem / release base the codegen already knows
#      (generated wrappers and loaders never need a modules: glob)
# Exactly one entry must match within a tier. Zero across all tiers ->
# UnknownSource; two within the same tier -> AmbiguousSource. Both fail
# `generate.py --check` and tests/codegen/test_sources.py. No allowlist.
#
# `modules:` globs must stay DISJOINT, and must not catch a GENERATED module
# (`*_espn_ext`, a flat-API stem module such as `soccer/fifa.py`, `*_loaders`):
# those resolve by stem in tier 3, and a tier-2 glob over them would file a
# provider's own wrappers under whichever glob happened to match first.

providers:
  espn:
    label: ESPN
    home: https://www.espn.com
    auth: none
    espn_apis: [espn_site_v2, espn_web_v3, espn_core_v2, espn_fitt_v3, espn_cdn]
    modules:
      - sportsdataverse._common_espn
      - sportsdataverse._common_espn_player_stats
      - sportsdataverse._espn_basketball_pbp
      - sportsdataverse.espn_snapshots
      - sportsdataverse.find
      - sportsdataverse.discover
      - sportsdataverse.scrape.espn.*
      - sportsdataverse.*.*_schedule
      - sportsdataverse.*.*_teams
      - sportsdataverse.*.*_game_rosters
      - sportsdataverse.*.*_player_stats
      - sportsdataverse.*.*_team_roster
      - sportsdataverse.*.*_game_officials
      - sportsdataverse.*.*_play_participants
      - sportsdataverse.football.espn_box
      - sportsdataverse.football.espn_text
      - sportsdataverse.football.aaf.*
      - sportsdataverse.football.ufl.*
      - sportsdataverse.football.xfl.*
      - sportsdataverse.football.cfl.*
      - sportsdataverse.cricket.cricket_espn_ext
      - sportsdataverse.*.*_team_stats

  nfl_com:
    label: NFL.com Shield API
    home: https://api.nfl.com
    auth: WEB_DESKTOP bearer token
    flat_apis: [nfl_api]
    modules:
      - sportsdataverse.nfl.nfl_api_runtime
      - sportsdataverse.nfl.nfl_games

