# Source registry: which provider (data source) or helper category every public
# function belongs to. ORDER IS TABLE ORDER on every rendered docs page.
#
# One source = one provider. Resolution per public function (tools/codegen/sources.py):
#   1. `functions:` glob on the function name
#   2. `modules:` glob on obj.__module__
#   3. the ESPN API / flat-API stem / release base the codegen already knows
#      (generated wrappers and loaders never need a modules: glob)
# Exactly one entry must match within a tier. Zero across all tiers ->
# UnknownSource; two within the same tier -> AmbiguousSource. Both fail
# `generate.py --check` and tests/codegen/test_sources.py. No allowlist.
#
# `modules:` globs must stay DISJOINT, and must not catch a GENERATED module
# (`*_espn_ext`, a flat-API stem module such as `soccer/fifa.py`, `*_loaders`):
# those resolve by stem in tier 3, and a tier-2 glob over them would file a
# provider's own wrappers under whichever glob happened to match first.

providers:
  espn:
    label: ESPN
    home: https://www.espn.com
    auth: none
    espn_apis: [espn_site_v2, espn_web_v3, espn_core_v2, espn_fitt_v3, espn_cdn]
    flat_apis: [espn_content]  # content.core.api.espn.com/v1 news (sportsdataverse.providers.espn_content)
    modules:
      - sportsdataverse._common_espn_player_stats
      - sportsdataverse._espn_basketball_pbp
      - sportsdataverse.espn_snapshots
      - sportsdataverse.scrape.espn.*
      - sportsdataverse.cfb.cfb_schedule
      - sportsdataverse.mbb.mbb_schedule
      - sportsdataverse.mlb.mlb_schedule
      - sportsdataverse.nba.nba_schedule
      - sportsdataverse.nfl.nfl_schedule
      - sportsdataverse.nhl.nhl_schedule
      - sportsdataverse.wbb.wbb_schedule
      - sportsdataverse.wnba.wnba_schedule
      - sportsdataverse.cfb.cfb_teams
      - sportsdataverse.mbb.mbb_teams
      - sportsdataverse.mlb.mlb_teams
      - sportsdataverse.nba.nba_teams
      - sportsdataverse.nfl.nfl_teams
      - sportsdataverse.nhl.nhl_teams
      - sportsdataverse.wbb.wbb_teams
      - sportsdataverse.wnba.wnba_teams
      - sportsdataverse.cfb.cfb_game_rosters
      - sportsdataverse.mbb.mbb_game_rosters
      - sportsdataverse.mlb.mlb_game_rosters
      - sportsdataverse.nba.nba_game_rosters
      - sportsdataverse.nfl.nfl_game_rosters
      - sportsdataverse.nhl.nhl_game_rosters
      - sportsdataverse.wbb.wbb_game_rosters
      - sportsdataverse.wnba.wnba_game_rosters
      - sportsdataverse.cfb.cfb_player_stats
      - sportsdataverse.mbb.mbb_player_stats
      - sportsdataverse.mlb.mlb_player_stats
      - sportsdataverse.nba.nba_player_stats
      - sportsdataverse.nfl.nfl_player_stats
      - sportsdataverse.nhl.nhl_player_stats
      - sportsdataverse.wbb.wbb_player_stats
      - sportsdataverse.wnba.wnba_player_stats
      - sportsdataverse.wbb.wbb_game_officials
      - sportsdataverse.wnba.wnba_game_officials
      - sportsdataverse.cfb.cfb_play_participants
      - sportsdataverse.nfl.nfl_play_participants
      - sportsdataverse.football.espn_box
      - sportsdataverse.football.espn_text
      - sportsdataverse.football.aaf.*
      - sportsdataverse.football.ufl.*
      - sportsdataverse.football.xfl.*
      - sportsdataverse.football.cfl.*
      - sportsdataverse.cricket.cricket_espn_ext
      - sportsdataverse.wbb.wbb_team_stats
      - sportsdataverse.wnba.wnba_team_stats
      # Hand-written ESPN functions that once shared a name with a generated site-v2 wrapper and
      # resolved through it; the wrapper is now ``*_site`` (B-M31), so they need their own rule.
      - sportsdataverse.wbb.wbb_standings
      - sportsdataverse.wbb.wbb_team_roster
      - sportsdataverse.wnba.wnba_draft
      - sportsdataverse.wnba.wnba_standings
      - sportsdataverse.wnba.wnba_team_roster
    functions:
      - espn_*_pbp

