# Curated Python->R function-name equivalents where the names diverge from
# strict identity (which generate.py handles automatically). Verified to exist in
# the target package's r_exports.yaml. Shape: {league: {python_fn: r_fn}}.
# - NFL: sdv's canonical `load_nfl_*` loaders map to nflreadr's bare `load_*` (nflreadpy-style).
# MLB wrappers were renamed from `mlb_api_*` to `mlb_*` in 0.0.65+ and now match
# baseballr's names exactly — generate.py handles identity automatically; no mlb: section needed.
mbb:
  # hoopR names diverging from sdv-py's (hoopR-cran-parity-audit 06, 2026-10-30). KenPom: hoopR
  # splits a page into one function per table, so a Python function that returns the whole page
  # links the R function for its main table.
  espn_mbb_player_core: espn_basketball_player_core
  espn_mbb_summary: espn_mbb_game_all
  helper_mbb_play_by_play: helper_espn_mbb_pbp
