# Curated Python->R function-name equivalents where the names diverge from
# strict identity (which generate.py handles automatically). Verified to exist in
# the target package's r_exports.yaml. Shape: {league: {python_fn: r_fn}}.
# - NFL: sdv's canonical `load_nfl_*` loaders map to nflreadr's bare `load_*` (nflreadpy-style).
