  topscorer_market_value: PostFinance Top Scorer game market value
  topscorer_market_value_trend: 'Market-value trend: 1 up, 0 flat, -1 down'
  topscorer_point_average: PostFinance Top Scorer game score per game
  topscorer_points: PostFinance Top Scorer game score (an app fantasy rating, not
    on-ice points)
  weight: 'Weight; unobserved: null or empty in every sampled row'
