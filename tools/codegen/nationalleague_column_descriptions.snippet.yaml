  shb: Own shots blocked by an opponent
  shi: Number of shifts played
  shigp: Shifts per game
  shm: Shots that missed the net
  shm_per_game: Missed shots per game
  show_rank: 'App flag: show the row''s rank'
  shp: Shots that hit the post
  shp_per_game: Post hits per game
  so: Number of shutouts (games without a goal conceded)
  sog: Number of shots on goal
  sog_per_game: Shots on goal per game
  sogslot: Shots on goal from the slot
  sogslot_per_game: Slot shots on goal per game
  svs: Number of saves made by the goaltender
  svs_per_game: Goaltender saves per game played
  svs_pslot: Slot save percentage, 100 * (saslot - sagoslot) / saslot
  team_id: SIHF team id (Int64; e.g. 101151 = HC Davos). The same key space as the
    sihf family's team_id.
  team_name: Team name as the league app displays it
  team_short_name: Team abbreviation
  team_stats: 'Per-team split for a player who changed teams; unobserved: null or
    empty in every sampled row'
  tgs: Team's total game time, seconds (about 3600 per game incl. overtime)
  toi: Time on ice, seconds
  toi_average: Time on ice per game, seconds
  toi_eq: Even-strength time on ice, seconds
  toi_eq_per_game: Even-strength time on ice per game, seconds
  toi_percentage: Share of the team's game time in goal, 100 * sep / tgs (verified)
  toi_pk: Shorthanded time on ice, seconds
  toi_pk_per_game: Shorthanded time on ice per game, seconds
  toi_pp_per_game: Power-play time on ice per game, seconds
  toipp: Power-play time on ice, seconds (lower-case pp, unlike the box score's toiPp)
  toishi: Time on ice per shift, seconds
  topscorer_amount: CHF amount credited to the team's Top Scorer jersey holder (non-zero
