    on a 30 x 60 m rink.
  pos_x_percentage: posX / 30 (verified on 475 shots)
  pos_y: Distance in metres from the end boards of the attacked end, 0-60 along the
    rink length. Shots are mirrored to one attacking end (inferred); above 30 is a
    shot from beyond centre; the goal line is 4 m out.
  pos_y_percentage: pos_y / 24, the depth of the app's zone drawing; above 1 for long
    shots.
  shot_type: 'Outcome: SOG (saved shot on goal), MISS, POST, BLOCK, GOAL'
