  unix_start: Wall-clock start of the game video, Unix epoch seconds
  video_time: Seconds into the game video (= unix - unixStart; verified on 475 shots)
  xg: Expected goals of this shot, 0-1. Non-zero from the 2023 season (one sampled
    game per season; 0 in the 2021 and 2022 games); always 0 on a BLOCK.
  xg_sum: Running sum of this team's xg up to and including this shot
