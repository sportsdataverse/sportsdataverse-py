  face_offs_percentage: Faceoff win percentage, 0-100; -1 with no faceoffs
  first_goalkeeper: Team's first-choice goaltender
  first_name: First (given) name of the player
  fk: 'Games started in goal (inferred: fk <= gp; 42 of 44 for the 2026 games-played
