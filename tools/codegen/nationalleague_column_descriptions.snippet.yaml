nl_lineups:
  first_goalkeeper: Starting goaltender
  first_name: First (given) name of the player
  game_id: SIHF game id `<season(4)><competition(4)><sequence(6)>` (Int64; e.g. 20261105000325,
    1105 = National League). The same id as the sihf family's game_id; its first four
    digits are the season END year.
  is_captain: Whether the player is the team captain
  is_topscorer: Wears the team's PostFinance Top Scorer jersey
  last_name: Last (family) name of the player
  line: Line number, an integer (goalkeepers 1-2 = first / backup)
  number: Sweater number, a string
  player_id: SIHF licence number (Int64; e.g. 305519 = Tobias Geisser). Joins the
    sihf family's player_id and every SIHF *LicenceNr.
  position: goalkeeper, defender or forwarder (sic)
  team_id: SIHF team id (Int64; e.g. 101151 = HC Davos). The same key space as the
    sihf family's team_id.
  team_side: 'home or away: the side of the team this row belongs to.'
  unit: 'Lineup group: goalkeeper, or the line number 1-4 as a string.'
nl_pbp:
  action: 'Event type: goal, foul (penalty), in / out (goaltender enters / leaves),
    revokedGoal'
  assist1_first_name: 'First assist: first name'
  assist1_last_name: 'First assist: last name'
  assist1_number: 'First assist: sweater number, a string'
  assist1_total: First assister's assists this season including this one
  assist2_first_name: 'Second assist: first name'
  assist2_last_name: 'Second assist: last name'
  assist2_number: 'Second assist: sweater number, a string'
  assist2_total: Second assister's assists this season including this one
  away_team_result: Away score after the event
  event_index: 1-based position of the event in the game's timeline.
  foul_minutes: Penalty minutes; 0 on non-penalty events
  foul_type: SIHF penalty code (116-125 in the sample); 0 on non-penalty events
  game_id: SIHF game id `<season(4)><competition(4)><sequence(6)>` (Int64; e.g. 20261105000325,
    1105 = National League). The same id as the sihf family's game_id; its first four
    digits are the season END year.
  game_seconds: Elapsed game time of the event in seconds, from the MMSS `time` (822
    = 8:22 -> 502).
  goal_situation: Goal kind; 'normal' on every sampled event
  home_team: Event belongs to the home team
  home_team_result: Home score after the event
  overtime: Overtime period number; 0 in regulation
  period: Period number, an integer (the parent `third` is a string)
  player_first_name: Shooter's first name, from the game's lineup.
  player_last_name: Shooter's last name, from the game's lineup.
  player_number: Shooter's sweater number, from the game's lineup (a string).
  player_total: Scorer's goals this season including this one; 0 on non-goal events
  review_goal_counts: Goal stood after review
  review_successful: 'Video-review outcome; unobserved: null or empty in every sampled
    row'
  revoked_goal_sub_type: Revoked-goal reason code (1 on the revoked goal, 0 elsewhere)
  revoked_goal_type: Revoked-goal category code (1 on every sampled event)
  situation: 'Goal tags, comma-separated: EQ (even strength), PP1 (power play), GWG
    (game-winning goal); null on non-goals'
  team_id: SIHF team id (Int64; e.g. 101151 = HC Davos). The same key space as the
    sihf family's team_id.
  team_side: 'home or away: the side of the team this row belongs to.'
  time: Game clock elapsed as an MMSS string without separator ('822' = 8:22, '5954'
    = 59:54)
  video_time: Seconds into the game video; 0 when there is no clip
  video_vimeo_id: 'Clip of this event. Vimeo video id (Int64): vimeo.com/<id>.'
nl_player_box:
  a: Assists (a1 + a2)
  a1: First (primary) assists credited
  a2: Second (secondary) assists credited
  bks: Opponent shots blocked
  faceoffs: 'Faceoffs taken (upstream `fo`: fow + fol). Not penalties.'
  faceoffs_percentage: Faceoff win percentage (upstream `foPercentage`); -1 without
    faceoffs.
  first_name: First (given) name of the player
  fol: Number of faceoffs lost
  fow: Number of faceoffs won
  g: Number of goals scored
  ga: 'Goals against: number of goals conceded'
  gaa: Goals-against average; 0 in every sampled row, even for goaltenders who conceded
  game_id: SIHF game id `<season(4)><competition(4)><sequence(6)>` (Int64; e.g. 20261105000325,
    1105 = National League). The same id as the sihf family's game_id; its first four
    digits are the season END year.
  last_name: Last (family) name of the player
  mi: 'Minus count: on ice for a goal against'
  mip: Goaltender time played, hundredths of a minute (6000 = 60:00; = seconds / 0.6)
  name: First and last name
  number: Sweater number, a string
  pim: Penalty minutes
  pl: 'Plus count: on ice for an even-strength or shorthanded goal for'
  pl_mi: Plus/minus (pl - mi)
  player_id: SIHF licence number (Int64; e.g. 305519 = Tobias Geisser). Joins the
    sihf family's player_id and every SIHF *LicenceNr.
  position: goalkeeper, defender or forwarder (sic)
  pts: Points (goals + assists)
  sa: Shots on goal against
  save_percentage: Save percentage, 0-100
  shb: Own shots blocked by an opponent
  shm: Shots that missed the net
  short_name: Initial and last name, e.g. 'S. Aeschlimann'
  shp: Shots that hit the post
  sog: Number of shots on goal
  svs: Number of saves made by the goaltender
  team_id: SIHF team id (Int64; e.g. 101151 = HC Davos). The same key space as the
    sihf family's team_id.
  team_side: 'home or away: the side of the team this row belongs to.'
  toi: Time on ice, seconds
  toi_eq: Even-strength time on ice, seconds
  toi_pk: Shorthanded time on ice, seconds
  toi_pp: Power-play time on ice, seconds
nl_player_season:
  a1: First (primary) assists credited
  a2: Second (secondary) assists credited
  aeq: Even-strength assists
  apk: Shorthanded assists
  app: Power-play assists
