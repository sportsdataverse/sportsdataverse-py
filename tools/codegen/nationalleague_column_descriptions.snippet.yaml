  pg: Not determined; 0 on every 2026 row
  pim: Penalty minutes
  pl: 'Plus count: on ice for an even-strength or shorthanded goal for'
  player_id: SIHF licence number (Int64; e.g. 305519 = Tobias Geisser). Joins the
    sihf family's player_id and every SIHF *LicenceNr.
  plus_minus: Plus/minus (pl - mi; verified)
  pm: Not determined; 0 on every 2026 row
  points: Points (g + assists; verified)
  points_per_game: Points per game
  position: goalkeeper, defender or forwarder (sic); one of 502 rows in the full 2026
    body has the integer 0
  ps: Shootout shots taken
  ps_percentage: Shootout success percentage, 0-100
  psag: Shootout goals against (equals ps on goaltender rows)
  psg: Goals scored in shootouts
  psgwg: Game-deciding shootout goals; 0 on every 2026 row
  psm: Shootout misses (inferred; ps = psg + psm fails for 67 of 447 skaters)
  pssvs: Saves made in shootouts
  pssvs_percentage: Shootout save percentage, 0-100; -1 with no shootout shots faced
  pswg: Shootout winners (inferred)
  pwg: Not determined; 0 on every 2026 row
  sa: Shots on goal against
  sa_per_game: Shots on goal against per game
  sab: Shots against that were blocked
  sag: Shots on goal against that were saved (= svs on every 2026 goaltender row)
  sago: Shots on goal against that went in (= ga on every 2026 goaltender row)
  sagoslot: Slot shots against that went in
  sam: Shots against that missed the net
  samgp: Missed shots against per game
  sap: Shots against that hit the post
  sapgp: Post hits against per game
  saslot: Slot shots against
  saslotgp: Slot shots against per game
  save_percentage: Save percentage, 0-100
  sep: Goaltender time played, seconds
  sgo: Not determined. Equals gff + gfd on every team row; skater values are close
