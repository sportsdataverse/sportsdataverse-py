nl_current_games:
  arena: Name of the arena the game is played in
  away_team_coach: 'Away head coach name; filled in a game''s `overview`, null in
    the season lists; unobserved: null, absent or empty in every sampled row'
  away_team_id: Away team. SIHF team id (Int64; e.g. 101151 = HC Davos). The same
    key space as the sihf family's team_id.
  away_team_name: Away team display name
  away_team_result: Away team goals (final or current score; 0 before the game)
  away_team_short_name: Away team abbreviation
  base_status: Coarse game state; equal to status in every sampled game
  date: Scheduled start, ISO 8601 with UTC offset
  game_id: SIHF game id `<season(4)><competition(4)><sequence(6)>` (Int64; e.g. 20261105000325,
    1105 = National League). The same id as the sihf family's game_id; its first four
    digits are the season END year.
  game_time: Elapsed game minutes; 0 on every game in the season lists, 60 in a finished
    game's overview
  has_highlight: A highlight video exists
  has_my_sports: Broadcast on MySports
  highlight_vimeo_video_id: 'Highlights video. Vimeo video id (Int64): vimeo.com/<id>.'
  home_team_coach: 'Home head coach name; filled in a game''s `overview`, null in
    the season lists; unobserved: null, absent or empty in every sampled row'
  home_team_id: Home team. SIHF team id (Int64; e.g. 101151 = HC Davos). The same
    key space as the sihf family's team_id.
  home_team_name: Home team display name
  home_team_result: Home team goals (final or current score; 0 before the game)
  home_team_short_name: Home team abbreviation (e.g. HCD)
  is_current: Game belongs to the current game day
  is_current_for_team: Game is the team's current game (team-scoped views)
  is_exhibition: Exhibition game, not NL competition (competition code other than
    1105)
  is_overtime: Game went to overtime
  is_shootout: Game went to a shootout
  referees: 'Officials as ''#<number> <name>'' strings (referees and linesmen; one
    entry in some games); unobserved: null, absent or empty in every sampled row'
  show_game_time: 'App flag: show gameTime'
  spectators: Attendance (Int64; the API sends a digit string).
  status: 'Game state: finished, canceled, beforeStartOfPlay (others appear live)'
  tv_partner: Broadcaster logo image URLs
  vimeo_video_id: 'Full-game video. Vimeo video id (Int64): vimeo.com/<id>.'
