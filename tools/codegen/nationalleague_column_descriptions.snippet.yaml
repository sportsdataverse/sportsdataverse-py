  fo10: 10-minute misconducts
  fo2: Minor (2-minute) penalties
  fo5: Major (5-minute) penalties
  fogp: Faceoffs taken per game
  fol: Number of faceoffs lost
  fol_per_game: Faceoffs lost per game
  foldz: Defensive-zone faceoffs lost
  folnz: Neutral-zone faceoffs lost
  foloz: Offensive-zone faceoffs lost
  fopdz: Defensive-zone faceoff win percentage, 0-100
  fopnz: Neutral-zone faceoff win percentage, 0-100
  fopoz: Offensive-zone faceoff win percentage, 0-100
  fot: Faceoffs taken (fow + fol)
  fow: Number of faceoffs won
  fow_per_game: Faceoffs won per game
  fowdz: Defensive-zone faceoffs won
  fownz: Neutral-zone faceoffs won
  fowoz: Offensive-zone faceoffs won
  g: Number of goals scored
  ga: 'Goals against: number of goals conceded'
  ga_per_game: Goals against per game (ga / gp; verified)
  geq: Even-strength goals
  gl: Goaltender losses (incl. overtime and shootout)
  glit: Losses in regulation time (gl = glit + overtime/shootout losses; verified)
  gm: Game misconducts
  goal_efficiency: Shooting percentage, 100 * g / sog (verified); -1 with no shots
  got: Overtime goals (a subset of g)
  gp: Number of games played
  gpk: Shorthanded goals
  gpp: Power-play goals
  gw: Goaltender wins (incl. overtime and shootout)
  gw_shutout: Not determined; equals gw on goaltender rows
  gwg: Game-winning goals
  gwgk: Not determined; 0 on every 2026 row
  gwit: Wins in regulation time (gw = gwit + overtime/shootout wins; verified)
  ha: Hat tricks (inferred; at most 2 in 2026)
  hand: 'Shooting or catching hand; unobserved: null or empty in every sampled row'
  height: 'Height; unobserved: null or empty in every sampled row'
  is_captain: Whether the player is the team captain
  is_topscorer: Wears the team's PostFinance Top Scorer jersey (one per team)
  last_name: Last (family) name of the player
  lcrid: Not determined (small integer, 0-4 in 2026)
  mi: 'Minus count: on ice for a goal against'
  mip: Goaltender time played, hundredths of a minute (6000 = 60:00; = seconds / 0.6)
  mp: Match penalties
  nationality: 'Nationality; unobserved: null or empty in every sampled row'
  noc: Not determined (small integer, 0-2 in 2026)
  number: Sweater number, a string
  ot_a: Overtime assists; 0 on every 2026 row
  ot_a1: Overtime first assists; 0 on every 2026 row
  ot_a2: Overtime second assists; 0 on every 2026 row
  ot_g: Overtime goals in the overtime table; 0 on every 2026 row
  ot_p: Overtime points; 0 on every 2026 row
  ot_rank: Overtime-scoring rank; 0 on the 2026 rows (filled in 2027)
  ot_toi: Overtime time on ice, seconds; 0 on every 2026 row
  otl: Goaltender overtime or shootout losses
  otw: Goaltender overtime or shootout wins
  penalties: 'Penalties taken (upstream `fo`: fo2 + fo5 + fo10 + gm + mp). Not faceoffs:
