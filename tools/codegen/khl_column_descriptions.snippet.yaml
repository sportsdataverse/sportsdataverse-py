khl_game_header:
  approved: 1 = result confirmed by the league
  arena: Arena name in Russian
  arena_city: Arena city in Russian
  arena_city_en: Arena city in English
  arena_en: Arena name in English
  arena_id: khl.ru arena id
  attendance: Attendance (numeric string)
  away_club_id: Visitor CLUB id (stable across seasons; joins webcaster team khl_id)
  away_score: Visitor goals (final, shootout winner counted)
  away_team_season_id: Visitor team-season id (one per tournament; joins nothing in
    the webcaster API)
  date: Game date YYYY-MM-DD (Moscow time)
  dayofweek: Day of week, 1 = Sunday (6 = Friday 2026-03-20)
  full_date: Start time, unix seconds (UTC)
  game_id: khl.ru game id; equals webcaster event khl_id / match_id
  gmttime_sft: Offset of Moscow time from GMT, hours (unverified)
  home_city_en: Home club city in English
  home_club_id: Home CLUB id (stable across seasons; joins webcaster team khl_id)
  home_name_en: Home club name in English
  home_name_l3: Home club 3-letter code in Russian
  home_name_l3_en: Home club 3-letter code in English
  home_score: Home goals (final, shootout winner counted)
  home_team_season_id: Home team-season id (one per tournament; joins nothing in the
    webcaster API)
  msktime_sft: Offset of local time from Moscow time, hours (unverified)
  number: Game number within the tournament
  ots: 'How the game ended: empty = regulation, OT = overtime, SO = shootout'
  round: Playoff round number
  roundname: Round label in Russian ('Неделя 29' = Week 29)
  roundname_en: Round label in English
  score: Final score 'home:visitor'
  time: Game clock mm:ss (game-elapsed); period marker rows keep their wall-clock
    HH:MM
  tournament_id: 'khl.ru tournament (stage) id, tnId: 1369 = 2025-26 regular season,
    1370 its playoff; equals webcaster stage khl_id'
  type: Game state/type code (sogame = finished in a shootout)
  visitor_city_en: Visiting club city in English
  visitor_name_en: Visiting club name in English
  visitor_name_l3: Visiting club 3-letter code in Russian
  visitor_name_l3_en: Visiting club 3-letter code in English
  win: True when this club won
