  home_team_team_id: Team code (e.g. FHC) in gameday and standings payloads; not the
    team uuid.
  home_team_team_name: Team display name (e.g. Frölunda HC).
  state: StatNet game state (GameEnded seen).
  time_period: Period (1-3, 4 = overtime, 5 = shootout).
  time_period_time: Time in period (MM:SS). Clock/duration as an mm:ss string.
shl_game_summary:
  best_scorers: Top scorers of the game.
