    team uuid.
  away_team_team_name: Team display name (e.g. Frölunda HC).
  game_uuid: Platform game uuid (bdhvuc5tex); every gameday route takes it.
  home_goals: Home goals after this event (running score).
  home_team_game_id: StatNet game number (StatNet key space, e.g. 22003); keys stats-info
