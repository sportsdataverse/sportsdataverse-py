shl_athlete_career:
  ga: Number of goals conceded (goals against).
  gaa: Goals against average (per 60 minutes). Numeric, but sent as a string in some
    rows and as a number in others.
  gp: Number of games played.
  gpi: Games played with ice time.
  info_age_format: 'Unit of value: years.'
  info_age_value: Age of the player in whole years.
  info_birth_date: Date of birth (YYYY-MM-DD).
  info_career_stats: Career stat rows of the player (empty in the sample).
  info_first_name: Given (first) name of the player.
  info_full_name: Given name and surname.
  info_gender: Sex of the athlete or team (male / female).
  info_height_format: 'Unit of value: cm.'
  info_height_value: Height of the player in centimetres.
  info_is_in_squad: Whether the player is in the current squad.
  info_jersey_number: Jersey (shirt) number of the player.
  info_last_name: Surname (family name) of the player.
  info_nationality: Nationality (ISO country code).
  info_player_id: 'isa (StatNet) player id as an INTEGER. Join trap: play-by-play
    sends the same id as a STRING (player.playerId, pop/nep, assists) and map keys
    are strings; cast before joining.'
  info_position: Position code (CE = centre, LW, RW, D, GK, F); N/A in the athlete
    game logs.
  info_position_code: Position code (GK, D, F; CE / LW / RW in stats rows); N/A when
    unknown.
  info_season_stats: Current-season stat rows of the player (empty in the sample).
  info_shoots: Shooting side (L / R; Left / Right).
  info_ssgt_uuid: 'ssgt uuid (platform key space: one season + series + game type);
    label via layout-info seasonSeriesGameTypeTeams[].'
  info_statistics_provider: Stats provider of the data (statnet seen).
  info_team_code: Team code of the player's team (e.g. FHC).
  info_team_id: Team code (e.g. FHC) in gameday and standings payloads; not the team
    uuid.
  info_team_instance_id: Club site instance id (e.g. fhc1_fhc).
  info_team_name: Team name (e.g. Frölunda HC); empty in some rows.
  info_team_uuid: Team uuid (platform key space, e.g. 087a-087aTQv9u); joins to /sports-v2/teams/{team_uuid}
    and schedule homeTeamInfo/awayTeamInfo.uuid. Not the team code.
  info_uuid: Athlete uuid (platform key space) in player and goalie modules, team
    uuid in team modules; joins to the athlete routes or /sports-v2/teams/{team_uuid}.
  info_weight_format: 'Unit of value: kg.'
  info_weight_value: Weight of the player in kilograms.
  l: 'Goalie losses: games the goalie was charged with the loss, overtime and shootout
    losses included.'
  so: Number of shutouts (games without a goal against).
  svs: Number of saves made by the goalie.
  svs_perc: Save %. Numeric, but sent as a string in some rows and as a number in
    others.
  t: 'Goalie ties: games that ended level with the goalie credited a tie; 0 in every
    sampled row, as overtime and shootouts now decide every game.'
  w: 'Goalie wins: games the goalie was credited with the win, overtime and shootout
    wins included.'
shl_athlete_details:
  athlete_data_contact_info: Contact info (null in captures).
  athlete_data_created_at: Record creation time (ISO 8601; often null).
  athlete_data_created_by: Record creator (site instance id; often null).
  athlete_data_creator_site: Site that created the record (null in captures).
  athlete_data_date_of_birth: Date of birth (YYYY-MM-DD).
  athlete_data_deleted: Soft-delete flag of the record (false in every sample).
  athlete_data_first_name: Given (first) name of the player.
  athlete_data_gender: Sex of the athlete or team (male / female).
  athlete_data_height: Height of the player in centimetres.
  athlete_data_last_modified: Record last-modified time (ISO 8601).
  athlete_data_last_name: Surname (family name) of the player.
  athlete_data_metadata: Free-form metadata.
  athlete_data_nationality: Nationality (ISO country code).
  athlete_data_player_ext_ids: External ids of the athlete (isa, ramses_legacy, ramses_generic_legacy,
    ramses_merged).
  athlete_data_shoots: Shooting side (L / R; Left / Right).
  athlete_data_uuid: Athlete uuid (platform key space; qQ9-... or 10-char form); joins
    to the athlete routes and stats-info stats[].info.uuid. Not the isa or ramses_legacy
    id.
  athlete_data_weight: Weight of the player in kilograms.
shl_athlete_game_log:
  date: Date of the game (YYYY-MM-DD).
  ga: Number of goals conceded (goals against).
  gaa: Goals against average (per 60 minutes). Numeric, but sent as a string in some
    rows and as a number in others.
  gp: Number of games played.
  gpi: Games played with ice time.
  gs: Games started (goalie log).
  guest_team: Away team SHORT NAME (e.g. Luleå), not a code.
  guest_team_icon: Away team logo URL.
  home_team: Home team SHORT NAME (e.g. Frölunda; may carry a trailing space), not
    a code.
  home_team_icon: Home team logo URL.
  info_birth_date: Date of birth (YYYY-MM-DD).
  info_career_stats: Career stat rows of the player (empty in the sample).
  info_first_name: Given (first) name of the player.
  info_full_name: Given name and surname.
  info_gender: Sex of the athlete or team (male / female).
  info_is_in_squad: Whether the player is in the current squad.
  info_jersey_number: Jersey (shirt) number of the player.
  info_last_name: Surname (family name) of the player.
  info_nationality: Nationality (ISO country code).
  info_player_id: 'isa (StatNet) player id as an INTEGER. Join trap: play-by-play
    sends the same id as a STRING (player.playerId, pop/nep, assists) and map keys
    are strings; cast before joining.'
  info_position: Position code (CE = centre, LW, RW, D, GK, F); N/A in the athlete
    game logs.
  info_position_code: Position code (GK, D, F; CE / LW / RW in stats rows); N/A when
    unknown.
  info_season_stats: Current-season stat rows of the player (empty in the sample).
  info_shoots: Shooting side (L / R; Left / Right). '-' placeholder in every sample.
  info_ssgt_uuid: 'ssgt uuid (platform key space: one season + series + game type);
    label via layout-info seasonSeriesGameTypeTeams[].'
  info_statistics_provider: Stats provider of the data (statnet seen).
  info_team_name: Team name (e.g. Frölunda HC); empty in some rows. Empty string in
    every sample (placeholder).
  l: 1 when the goalie was charged with the loss in this game (overtime and shootout
    included), else 0.
  series: Series id in the career log.
  so: Number of shutouts (games without a goal against).
  soga: Shots on goal against.
  svs: Number of saves made by the goalie.
  svs_perc: Save %. Numeric, but sent as a string in some rows and as a number in
    others.
  t: 1 when the goalie was credited a tie in this game, else 0; 0 in every sampled
    row, as overtime and shootouts now decide every game.
  w: 1 when the goalie was credited with the win in this game (overtime and shootout
    included), else 0.
shl_athlete_profile:
  age_format: 'Unit of value: years.'
  age_value: Age of the player in whole years.
  birth_date: Date of birth (YYYY-MM-DD).
  career_stats: Career stat rows of the player (empty in the sample).
  first_name: Given (first) name of the player.
  full_name: Given name and surname.
  gender: Sex of the athlete or team (male / female).
  height_format: 'Unit of value: cm.'
  height_value: Height of the player in centimetres.
  is_in_squad: Whether the player is in the current squad.
  jersey_number: Jersey (shirt) number of the player.
  last_name: Surname (family name) of the player.
  media_alt: Image alt text. Empty string in every sample (placeholder).
  media_focal_point: Image crop focal point.
  media_photographer: Image credit. Empty string in every sample (placeholder).
  media_srcset: Responsive image srcset.
  media_url: Portrait URL on the imgix CDN.
  media_url_img_original_proportion: Image URL, original proportion.
  media_url_placeholder_image: Placeholder image URL. Empty string in every sample
    (placeholder).
  media_videourl: Link to a club video. Empty string in every sample (placeholder).
  nationality: Nationality (ISO country code).
  position: Position label in Swedish (Målvakt = goalkeeper).
  position_code: Position code (GK, D, F; CE / LW / RW in stats rows); N/A when unknown.
  season_stats: Current-season stat rows of the player (empty in the sample).
  shoots: Shooting side (L / R; Left / Right).
  team_code: StatNet team code (SAIK, FHC).
  team_instance_id: Club site instance id (e.g. fhc1_fhc).
  team_media: Media URL or string.
  team_name: Name of the team.
  team_uuid: Platform team uuid.
  uuid: Athlete uuid (platform key space, qQ9-... or 10-char form); joins to the athlete
    routes and stats-info stats[].info.uuid. Not the isa or ramses_legacy id.
  weight_format: 'Unit of value: kg.'
  weight_value: Weight of the player in kilograms.
shl_athlete_seasons:
  label: 'Display label (season list: 2025/2026).'
  name: Season label (e.g. 2025/2026).
  value: Season START year (2025 = 2025/2026); the season= param of playerProfile_seasonGameLog.
    Numeric value sent as a string.
shl_boxscore:
  a: Number of assists credited.
  first_name: Given (first) name of the player.
  fo_perc: Face-off win %.
  fol: Face-offs lost.
  fow: Number of face-offs won.
  full_name: Given name and surname.
  g: Number of goals scored.
  ga: Number of goals conceded (goals against).
  hits: Body checks delivered.
  last_name: Surname (family name) of the player.
  line: Line (unit) number the player was listed on.
  nr: Jersey (shirt) number of the player.
  period: 'Period: 0 = the whole game, 1-3 the periods, 4 and up overtime.'
  pim: Penalty minutes.
  player_id: isa (StatNet) player id, Int64. Play-by-play sends it as a string, every
    other route as an integer; it is cast here so the frames join.
  plus_minus: Plus/minus in the game.
  pos: Position code in this game (e.g. CE, LW, RW, D, GK).
  position_group: skater or goalie (goalies come from the body's gkStats rows).
  ppg: Power-play goals.
  ppsog: Power-play shots on goal.
  sog: Number of shots on goal.
  soga: Shots on goal against.
  spga: Unverified goalie column (box score).
  svs: Number of saves made by the goalie.
  svs_perc: Save percentage of the game as a FRACTION 0-1 (e.g. '0.9655...'); integer
    0 for a goalie without shots. Numeric, but sent as a string in some rows and as
    a number in others.
  sw: Number of shots that missed the net.
  team_id: Team code (e.g. FHC) in gameday and standings payloads; not the team uuid.
  team_side: 'Side of the game: home or away.'
  toi: Time on ice (mm:ss). Clock/duration as an mm:ss string.
shl_game_header:
  away_team_address: Club postal address.
  away_team_email: Contact email address of the club.
  away_team_founded_on: Club founding date. Numeric value sent as a string.
  away_team_icon: URL of the team logo image.
  away_team_instance_id: Club site instance id (e.g. fhc1_fhc).
  away_team_names_code: Display abbreviation; differs from the team code for some
    clubs (SKE vs SAIK, ÖRE vs OHK).
  away_team_names_code_site: Display abbreviation on the site; 'Herr' = men's team
    (e.g. 'DIF Herr').
  away_team_names_full: Full club name ('Herr' = men's team).
  away_team_names_full_site: Full club name as shown on the site ('Herr' = men's team).
  away_team_names_long: Long club name ('Herr' = men's team).
  away_team_names_long_site: Long club name as shown on the site ('Herr' = men's team).
  away_team_names_short: Short club name ('Herr' = men's team).
  away_team_names_short_site: Short club name as shown on the site ('Herr' = men's
    team).
  away_team_score: Goals scored by the team in the game.
  away_team_uuid: Team uuid (platform key space, e.g. 087a-087aTQv9u); joins to /sports-v2/teams/{team_uuid}
    and schedule homeTeamInfo/awayTeamInfo.uuid. Not the team code.
  game_info_arena_name: Name of the arena hosting the game.
  game_info_ext_id: StatNet game number as a string (StatNet key space); equals gameday
    gameId. Numeric value sent as a string.
  game_info_game_uuid: Game uuid (platform key space, e.g. bdhvuc5tex); joins to schedule
    gameInfo[].uuid and every gameday/{game_uuid} route. The StatNet number of the
    same game is gameId.
  game_info_overtime: Whether the game went to overtime.
  game_info_round_label: Round label (often empty). Empty string in every sample (placeholder).
  game_info_round_number: Schedule round (1 = first game day of the season).
  game_info_series_code: Series code of the game (SHL).
  game_info_series_display_name: Series label shown on the site (SHL).
  game_info_series_name: Series label of the game (SHL).
  game_info_shootout: Whether the game went to a shootout.
  game_info_start_date_time: Scheduled start, local time (Europe/Stockholm).
  game_info_state: Game state with an underscore (post_game seen); the schedule spells
    it post-game.
  home_team_address: Club postal address.
  home_team_email: Contact email address of the club.
  home_team_founded_on: Club founding date. Numeric value sent as a string.
  home_team_icon: URL of the team logo image.
  home_team_instance_id: Club site instance id (e.g. fhc1_fhc).
  home_team_names_code: Display abbreviation; differs from the team code for some
    clubs (SKE vs SAIK, ÖRE vs OHK).
  home_team_names_code_site: Display abbreviation on the site; 'Herr' = men's team
    (e.g. 'DIF Herr').
  home_team_names_full: Full club name ('Herr' = men's team).
  home_team_names_full_site: Full club name as shown on the site ('Herr' = men's team).
  home_team_names_long: Long club name ('Herr' = men's team).
  home_team_names_long_site: Long club name as shown on the site ('Herr' = men's team).
  home_team_names_short: Short club name ('Herr' = men's team).
  home_team_names_short_site: Short club name as shown on the site ('Herr' = men's
    team).
  home_team_score: Goals scored by the team in the game.
  home_team_uuid: Team uuid (platform key space, e.g. 087a-087aTQv9u); joins to /sports-v2/teams/{team_uuid}
    and schedule homeTeamInfo/awayTeamInfo.uuid. Not the team code.
  instance_context_site_team_is_away_team: Whether the site's team is the away team.
  instance_context_site_team_is_home_team: Whether the site's team is the home team.
  instance_context_site_team_is_in_game: Whether the site's team plays in the game.
  series_uuid: Series uuid (platform key space; SHL = qQ9-bb0bzEWUk); the seriesUuid
    param of game-schedule.
  ssgt_uuid: 'ssgt uuid (platform key space: one season + series + game type); label
    via layout-info seasonSeriesGameTypeTeams[].'
shl_game_overview:
  away_goals: Away goals after this event (running score).
  away_team_game_id: StatNet game number (StatNet key space, e.g. 22003); keys stats-info
    games{} and equals sports-v2 game-info extId. Not the game uuid.
  away_team_game_source_id: StatNet game key, date-HOME-AWAY (e.g. 20250913-FHC-LHC);
