columns:
- description: Game date.
  name: date
  type: character
- description: Series id in the career log.
  name: series
  type: character
- description: Home team SHORT NAME (e.g. Frölunda; may carry a trailing space), not
    a code.
  name: home_team
  type: character
- description: Home team logo URL.
  name: home_team_icon
  type: character
- description: Away team SHORT NAME (e.g. Luleå), not a code.
  name: guest_team
  type: character
- description: Away team logo URL.
  name: guest_team_icon
  type: character
- description: Games played.
  name: gp
  type: numeric
- description: Games played with ice time.
  name: gpi
  type: numeric
- description: Games started (goalie log).
  name: gs
  type: numeric
- description: Wins (meaning differs by table; see the module or route).
  name: w
  type: numeric
- description: Ties (meaning differs by table; see the module or route).
  name: t
  type: numeric
- description: Losses (meaning differs by table; see the module or route).
  name: l
  type: numeric
- description: Shutouts.
  name: so
  type: numeric
- description: Goals against.
  name: ga
  type: numeric
- description: Goals against average (per 60 minutes). Numeric, but sent as a string
    in some rows and as a number in others.
  name: gaa
  type: numeric
- description: Shots on goal against.
  name: soga
  type: numeric
- description: Saves.
  name: svs
  type: numeric
- description: Save %. Numeric, but sent as a string in some rows and as a number
    in others.
  name: svs_perc
  type: numeric
- description: Given name and surname.
  name: info_full_name
  type: character
- description: Given name.
  name: info_first_name
  type: character
- description: Surname.
  name: info_last_name
  type: character
- description: Date of birth (YYYY-MM-DD).
  name: info_birth_date
  type: character
- description: Nationality (ISO country code).
  name: info_nationality
  type: character
- description: Sex of the athlete or team (male / female).
  name: info_gender
  type: character
- description: Shirt number.
  name: info_jersey_number
  type: character
- description: Position code (CE = centre, LW, RW, D, GK, F); N/A in the athlete game
    logs.
  name: info_position
  type: character
- description: Position code (GK, D, F; CE / LW / RW in stats rows); N/A when unknown.
  name: info_position_code
  type: character
- description: Shooting side (L / R; Left / Right). '-' placeholder in every sample.
  name: info_shoots
  type: character
- description: Team name (e.g. Frölunda HC); empty in some rows. Empty string in every
    sample (placeholder).
  name: info_team_name
  type: character
- description: Current-season stat rows of the player (empty in the sample).
  name: info_season_stats
  type: character
- description: Career stat rows of the player (empty in the sample).
  name: info_career_stats
  type: character
- description: Stats provider of the data (statnet seen).
  name: info_statistics_provider
  type: character
- description: Whether the player is in the current squad.
  name: info_is_in_squad
  type: logical
- description: 'isa (StatNet) player id as an INTEGER. Join trap: play-by-play sends
    the same id as a STRING (player.playerId, pop/nep, assists) and map keys are strings;
    cast before joining.'
  name: info_player_id
  type: integer
- description: 'ssgt uuid (platform key space: one season + series + game type); label
    via layout-info seasonSeriesGameTypeTeams[].'
  name: info_ssgt_uuid
  type: character
kind: dataframe
schema: shl_athlete_game_log
