schema: live_player_statistics
kind: dataframe
columns:
- name: game_id
  type: character
  description: NFL.com Shield GUID for the game.
- name: offset
  type: integer
  description: Live-feed sequence position the statistics reflect; advances as the game is played.
- name: side
  type: character
  description: 'Which side of the game the row belongs to: away or home.'
- name: team_id
  type: character
  description: NFL.com Shield GUID of the team.
- name: gsis_player_id
  type: character
  description: NFL GSIS player id (00-00xxxxx), the key nflverse data joins on.
- name: gsis_player_jersey_number
  type: character
  description: Player's jersey number as recorded in GSIS.
- name: gsis_player_name
  type: character
  description: Player name as recorded in GSIS (e.g. P.Mahomes).
- name: person_id
  type: character
  description: NFL.com Shield GUID of the player (person).
