columns:
- description: Game number within the season (1-based; Utf8 join key).
  name: game_code
  type: character
- description: Round number within the season.
  name: round
  type: integer
- description: Short alias of the round.
  name: round_alias
  type: character
- description: Display name of the round.
  name: round_name
  type: character
- description: Whether the game has been played.
  name: played
  type: logical
- description: Scheduled tip-off (ISO 8601, venue local time).
  name: date
  type: character
- description: Whether the game date is confirmed.
  name: confirmed_date
  type: logical
- description: Whether the tip-off time is confirmed.
  name: confirmed_hour
  type: logical
- description: UTC offset of the venue, in hours.
  name: local_time_zone
  type: integer
- description: Scheduled tip-off in venue local time (ISO 8601).
  name: local_date
  type: character
- description: Scheduled tip-off in UTC (ISO 8601).
  name: utc_date
  type: character
- description: 'Home side: results of the last five games, oldest first (W / L), JSON-encoded.'
  name: local_last5_form
  type: character
- description: 'Away side: results of the last five games, oldest first (W / L), JSON-encoded.'
  name: road_last5_form
  type: character
- description: 'Season: display name.'
  name: season_name
  type: character
- description: 'Season code: competition code + start year, e.g. E2025 for 2025-26
    (Utf8 join key).'
  name: season_code
  type: character
- description: 'Season: short display alias.'
  name: season_alias
  type: character
- description: 'Season: competition code (E = EuroLeague, U = EuroCup; Utf8 join key).'
  name: season_competition_code
  type: character
- description: 'Season: start year of the season.'
  name: season_year
  type: integer
- description: 'Season: start date (ISO 8601).'
  name: season_start_date
  type: character
- description: 'Group: provider identifier for the entity (Utf8 join key).'
  name: group_id
  type: character
- description: 'Group: display order within the roster.'
  name: group_order
  type: integer
- description: 'Group: display name.'
  name: group_name
  type: character
- description: 'Group: group name as stored by the engine.'
  name: group_raw_name
  type: character
- description: Phase type code (RS = regular season, PO = playoffs, ...).
  name: phase_type_code
  type: character
- description: 'Phase type: short display alias.'
  name: phase_type_alias
  type: character
- description: 'Phase type: display name.'
  name: phase_type_name
  type: character
- description: 'Phase type: whether the phase is played in groups.'
  name: phase_type_is_group_phase
  type: logical
- description: 'Home side: club: euroLeague code of the entity (competition, season,
    club, person or venue; Utf8 join key).'
  name: local_club_code
  type: character
- description: 'Home side: club: display name.'
  name: local_club_name
  type: character
- description: 'Home side: club: abbreviated display name.'
  name: local_club_abbreviated_name
  type: character
- description: 'Home side: club: editorial (long-form) display name.'
  name: local_club_editorial_name
  type: character
- description: 'Home side: club: three-letter broadcast abbreviation of the club.'
  name: local_club_tv_code
  type: character
- description: 'Home side: club: whether the club is a placeholder rather than a real
    club.'
  name: local_club_is_virtual
  type: logical
- description: 'Home side: club: URL of the club crest image.'
  name: local_club_images_crest
  type: character
- description: 'Home side: final score of the side.'
  name: local_score
  type: integer
- description: 'Home side: score of the side as counted for the standings.'
  name: local_standings_score
  type: integer
- description: 'Away side: club: euroLeague code of the entity (competition, season,
    club, person or venue; Utf8 join key).'
  name: road_club_code
  type: character
- description: 'Away side: club: display name.'
  name: road_club_name
  type: character
- description: 'Away side: club: abbreviated display name.'
  name: road_club_abbreviated_name
  type: character
- description: 'Away side: club: editorial (long-form) display name.'
  name: road_club_editorial_name
  type: character
- description: 'Away side: club: three-letter broadcast abbreviation of the club.'
  name: road_club_tv_code
  type: character
- description: 'Away side: club: whether the club is a placeholder rather than a real
    club.'
  name: road_club_is_virtual
  type: logical
- description: 'Away side: club: URL of the club crest image.'
  name: road_club_images_crest
  type: character
- description: 'Away side: final score of the side.'
  name: road_score
  type: integer
- description: 'Away side: score of the side as counted for the standings.'
  name: road_standings_score
  type: integer
kind: dataframe
schema: game_report
