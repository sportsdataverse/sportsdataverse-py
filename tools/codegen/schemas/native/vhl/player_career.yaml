columns:
- description: Player id, read from the page's own /players/{id}/games/ tab link;
    equals the requested id or the capture refuses.
  name: player_id
  type: integer
- description: Season END year (2026 = 2025/26).
  name: season
  type: integer
- description: 'Season stage: regular or playoff.'
  name: stage
  type: character
- description: Tournament id of the season stage (2025/26 regular season = 1374, playoffs
    = 1375); vhl_tn maps season + stage to it.
  name: tn
  type: integer
- description: 'Team-season id (khl/ terminology): one id per team per tournament,
    from the KHL''s sequence (khl/: Spartak = 14934 in 1369; here Metallurg = 15017
    in 1374). The {id} of /calendar/{tn}/0/{id}/ and /stats/players/{tn}/all/{id}/.
    Not the stable club id (*_club_id) and not the team page id. With tn, the bridge
    from a player to every tournament team he played for.'
  name: team_season_id
  type: integer
- description: Team short name (Latin; the report tables' form).
  name: team
  type: character
- description: Jersey number worn for that team that season (#).
  name: jersey
  type: integer
- description: Games played (GP).
  name: games_played
  type: integer
- description: Goals (G).
  name: goals
  type: integer
- description: Assists (A).
  name: assists
  type: integer
- description: Points, goals + assists (PTS).
  name: points
  type: integer
- description: Plus/minus (+/-).
  name: plus_minus
  type: integer
- description: Penalty minutes (PIM).
  name: penalty_minutes
  type: integer
- description: Even-strength goals (ESG).
  name: even_strength_goals
  type: integer
- description: Power-play goals (PPG).
  name: power_play_goals
  type: integer
- description: Shorthanded goals (SHG).
  name: shorthanded_goals
  type: integer
- description: Overtime goals (OTG).
  name: overtime_goals
  type: integer
- description: Game-winning goals (GWG).
  name: game_winning_goals
  type: integer
- description: Shootout-deciding goals (SDS; the legend says 'Shootouts deciding shots').
  name: shootout_deciding_goals
  type: integer
- description: Shots on goal (SOG).
  name: shots_on_goal
  type: integer
- description: Shooting percentage, goals / shots on goal x 100 (%SOG); 0-100 scale;
    null when the page shows '-'.
  name: shot_pct
  type: numeric
- description: Shots on goal per game (S/G).
  name: shots_per_game
  type: numeric
- description: Faceoffs taken (FO).
  name: faceoffs
  type: integer
- description: Faceoffs won (FOW).
  name: faceoffs_won
  type: integer
- description: Faceoff win percentage (%FO); 0-100 scale; null when the page shows
    '-' (no faceoffs taken).
  name: faceoff_pct
  type: numeric
- description: Average time on ice per game (TOI/G), 'm:ss' / 'mm:ss' string; null
    when the page shows '-'.
  name: toi_per_game
  type: character
- description: Average shifts per game (Sft/G); integer in a one-game report, decimal
    in season tables.
  name: shifts_per_game
  type: numeric
- description: Body checks delivered (Hits).
  name: hits
  type: integer
- description: Blocked shots (BLS).
  name: blocked_shots
  type: integer
- description: Goalie wins (W).
  name: wins
  type: integer
- description: Goalie losses (L).
  name: losses
  type: integer
- description: Shootouts played (SOP).
  name: shootouts_played
  type: integer
- description: Shots on goal faced (the SOG column of goalie tables).
  name: shots_against
  type: integer
- description: Goals allowed (GA).
  name: goals_against
  type: integer
- description: Saves (Sv).
  name: saves
  type: integer
- description: Save percentage (%Sv); 0-100 scale (93.8 = 93.8 %); null when the page
    shows '-'.
  name: save_pct
  type: numeric
- description: Goals-against average (GAA) = 60 x GA / TOI minutes; null when the
    page shows '-'.
  name: gaa
  type: numeric
- description: Shutouts (SO).
  name: shutouts
  type: integer
- description: Time on ice (TOI), 'mm:ss' string; minutes run past 59 over a season
    ('2314:48'); null when the page shows '-'.
  name: toi
  type: character
kind: dataframe
schema: vhl_player_career
