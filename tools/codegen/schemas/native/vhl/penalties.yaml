columns:
- description: 'Game id (the calendar''s game_id; the report''s and the broadcast''s
    idgame). The report and broadcast pages do not print it: it comes from the request.'
  name: game_id
  type: integer
- description: Season END year (2026 = 2025/26).
  name: season
  type: integer
- description: 'Season stage: regular or playoff.'
  name: stage
  type: character
- description: Official game number (from '№984'); checked against the request.
  name: game_number
  type: integer
- description: 'Side of the game the row belongs to: home or away.'
  name: team_side
  type: character
- description: Team page id (vhlru.ru /en/teams/{team_page_id}/), stable across seasons;
    for report rows the page id of the row's side.
  name: team_page_id
  type: integer
- description: Team short name (Latin; the report tables' form).
  name: team
  type: character
- description: Elapsed game time of the penalty 'mm:ss'.
  name: time
  type: character
- description: Player id of the penalised player; null for a bench (team) penalty.
  name: player_id
  type: integer
- description: Penalised player name; null for a bench (team) penalty.
  name: player
  type: character
- description: Penalised player's jersey number.
  name: player_jersey
  type: integer
- description: Penalty length in minutes (the unlabelled third column).
  name: minutes
  type: integer
- description: Infraction in English ('hooking'); null when the site leaves it blank.
  name: infraction
  type: character
kind: dataframe
schema: vhl_penalties
