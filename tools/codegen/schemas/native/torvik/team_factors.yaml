schema: team_factors
kind: dataframe
columns:
- name: team_name
  type: character
  description: Torvik team name.
- name: e_fg_percent
  type: numeric
  description: Effective field-goal percentage on offense.
- name: rk
  type: integer
  description: National rank of offensive eFG%.
- name: e_fg_percent_def
  type: numeric
  description: Effective field-goal percentage allowed on defense.
- name: rk_2
  type: integer
  description: National rank of defensive eFG% allowed.
- name: ftr
  type: numeric
  description: Free-throw rate on offense (FTA per FGA).
- name: rk_3
  type: integer
  description: National rank of offensive free-throw rate.
- name: ftr_def
  type: numeric
  description: Free-throw rate allowed on defense.
- name: rk_4
  type: integer
  description: National rank of defensive free-throw rate allowed.
- name: or_percent
  type: numeric
  description: Offensive rebound percentage.
- name: rk_5
  type: integer
  description: National rank of offensive rebound percentage.
- name: dr_percent
  type: numeric
  description: Defensive rebound percentage.
- name: rk_6
  type: integer
  description: National rank of defensive rebound percentage.
- name: to_percent
  type: numeric
  description: Turnover percentage on offense.
- name: rk_7
  type: integer
