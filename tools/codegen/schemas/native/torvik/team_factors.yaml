- name: x2p_percent
  type: numeric
  description: Two-point percentage on offense.
- name: rk_11
  type: integer
  description: National rank of offensive two-point percentage.
- name: x2p_percent_d
  type: numeric
  description: Two-point percentage allowed on defense.
- name: rk_12
  type: integer
  description: National rank of two-point percentage allowed.
- name: ft_percent
  type: numeric
  description: Free-throw percentage.
- name: rk_13
  type: integer
  description: National rank of free-throw percentage.
- name: ft_percent_d
  type: numeric
