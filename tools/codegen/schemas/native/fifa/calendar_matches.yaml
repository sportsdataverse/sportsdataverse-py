  type: character
- description: 'Match status code (FIFA integer enum: 0 = played, 1 = to be played).'
  name: match_status
  type: integer
- description: Result-type code (FIFA integer enum).
  name: result_type
  type: integer
- description: Match number within the season.
  name: match_number
  type: integer
- description: Whether the kick-off time is confirmed.
  name: time_defined
