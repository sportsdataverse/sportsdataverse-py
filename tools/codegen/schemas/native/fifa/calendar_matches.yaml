columns:
- description: FIFA competition id (17 = FIFA World Cup; Utf8 join key).
  name: id_competition
  type: character
- description: FIFA season id (285023 = FIFA World Cup 2026; Utf8 join key).
  name: id_season
  type: character
- description: Stage id within the season (Utf8 join key).
  name: id_stage
  type: character
- description: Group id within the stage (Utf8 join key).
  name: id_group
  type: character
- description: Attendance.
  name: attendance
  type: character
- description: FIFA match id (Utf8 join key).
  name: id_match
  type: character
- description: Match day (round) within the stage.
  name: match_day
  type: character
- description: Localised stage name (e.g. First Stage), JSON list of `{Locale, Description}`
    objects.
  name: stage_name
  type: character
- description: Localised group name (e.g. Group A), JSON list of `{Locale, Description}`
    objects.
  name: group_name
  type: character
- description: Localised competition name, JSON list of `{Locale, Description}` objects.
  name: competition_name
  type: character
- description: Localised season name, JSON list of `{Locale, Description}` objects.
  name: season_name
  type: character
- description: Localised short season name, JSON list of `{Locale, Description}` objects
    (often empty).
  name: season_short_name
  type: character
- description: Kick-off in UTC (ISO 8601).
  name: date
  type: character
- description: Kick-off in venue local time (ISO 8601; the trailing Z is not a UTC
    marker).
  name: local_date
  type: character
- description: 'Home team: goals scored.'
  name: home_team_score
  type: integer
- description: 'Away team: goals scored.'
  name: away_team_score
  type: integer
- description: Home team aggregate score over two legs (null for a single-leg tie).
  name: aggregate_home_team_score
  type: character
- description: Away team aggregate score over two legs (null for a single-leg tie).
  name: aggregate_away_team_score
  type: character
- description: 'Home team: penalty shoot-out score (null when there was no shoot-out).'
  name: home_team_penalty_score
  type: character
- description: 'Away team: penalty shoot-out score (null when there was no shoot-out).'
  name: away_team_penalty_score
  type: character
- description: Time of the last period change (null in the captures).
  name: last_period_update
  type: character
- description: Leg number of a two-legged tie (null for a single-leg match).
  name: leg
  type: character
- description: IsHomeMatch flag from the API (null in the captures).
  name: is_home_match
  type: character
- description: IsTicketSalesAllowed flag from the API (null in the captures).
  name: is_ticket_sales_allowed
  type: character
- description: Match clock as displayed, e.g. 98'.
  name: match_time
  type: character
- description: Second-half timing field (null in the captures).
  name: second_half_time
  type: character
- description: First-half timing field (null in the captures).
  name: first_half_time
  type: character
- description: Stoppage time added to the first half, in minutes.
  name: first_half_extra_time
  type: character
- description: Stoppage time added to the second half, in minutes.
  name: second_half_extra_time
  type: character
- description: Team id of the winner (Utf8; null for a draw or an unplayed match).
  name: winner
  type: character
- description: URL of the match report (null in the captures).
  name: match_report_url
  type: character
- description: Draw placeholder for the home slot, e.g. A1 (group A, position 1).
  name: place_holder_a
  type: character
- description: Draw placeholder for the away slot, e.g. A2 (group A, position 2).
  name: place_holder_b
  type: character
- description: Ball-possession block (null when not tracked).
  name: ball_possession
  type: character
- description: Match officials, JSON list (OfficialId, OfficialType, IdCountry, localised
