columns:
- description: Season END year (2026 = 2025/26).
  name: season
  type: integer
- description: Rank in the table.
  name: rank
  type: integer
- description: Display code of the team (AIK, MoDo, MORA, NVIF, ÖIK), not the StatNet
    id.
  name: team_code
  type: character
- description: Games played.
  name: gp
  type: integer
- description: Wins in total, overtime and shootout wins included (otw and sow are
    subsets).
  name: wins_total
  type: integer
- description: Losses in total, overtime and shootout losses included (otl and sol
    are subsets).
  name: losses_total
  type: integer
- description: Games or situations leading (StatNet 'Leading'; meaning unverified).
  name: leading
  type: integer
- description: Games or situations trailing (StatNet 'Trailing'; meaning unverified).
  name: trailing
  type: integer
- description: Goals.
  name: g
  type: integer
- description: Goals against.
  name: ga
  type: integer
- description: Games in which the team scored the first goal (inferred from the label;
    unverified).
  name: gfg
  type: integer
- description: Overtime wins.
  name: otw
  type: integer
- description: Overtime losses.
  name: otl
  type: integer
- description: Shootout wins.
  name: sow
  type: integer
- description: Shootout losses.
  name: sol
  type: integer
- description: Points per game.
  name: p_gp
  type: numeric
- description: Goals for per game (number).
  name: gpg
  type: numeric
- description: Goals against per game (number).
  name: gapg
  type: numeric
- description: 'Standings points: 3 per regulation win, 2 per overtime/shootout win,
    1 per overtime/shootout loss (2025 IFB: 102 + 14 + 3 = 119).'
  name: points
  type: integer
kind: dataframe
schema: ha_team_stats
