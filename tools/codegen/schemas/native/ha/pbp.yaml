columns:
- description: StatNet game number (23401 = 2026/27 game 1); the play-by-play request
    key.
  name: statnet_game_number
  type: integer
- description: StatNet team id of the home team (AIK, MODO, MIK).
  name: home_statnet_id
  type: character
- description: StatNet team id of the away team.
  name: away_statnet_id
  type: character
- description: Period number.
  name: period
  type: integer
- description: Period label ('Period 1').
  name: period_label
  type: character
- description: 'Event type: Shot, Goal, Penalty, GoalkeeperEvent or Timeout.'
  name: event_type
  type: character
- description: Seconds into the period.
  name: time
  type: integer
- description: 'Goalkeeper event: true when the goalkeeper enters, false when he leaves.'
  name: is_entering
  type: logical
- description: Team label as shown on the card (the display team code).
  name: team_name
  type: character
- description: Display code of the team (AIK, MoDo, MORA, NVIF, ÖIK), not the StatNet
    id.
  name: team_code
  type: character
- description: StatNet team id (AIK, MODO, MIK, NYB, OSIK), not the display code.
  name: team_statnet_id
  type: character
- description: StatNet player id (the same id space as SHL's isa id, verified on one
    player).
  name: player_statnet_id
  type: integer
- description: 'Player: first name of the player.'
  name: player_first_name
  type: character
- description: 'Player: family name of the player.'
  name: player_family_name
  type: character
- description: 'Player: jersey number of the player.'
  name: player_jersey_number
  type: integer
- description: Shot outcome, goal strength (EQ), penalty text or timeout note.
  name: event_description
  type: character
- description: Score after the goal, home-away.
  name: running_score
  type: character
- description: Scorer's season goals after this goal.
  name: scorer_season_goals
  type: integer
- description: Goal scored on a penalty shot.
  name: is_penalty_shot
  type: logical
- description: First assist, by name (no id).
  name: assist1_name
  type: character
- description: First assist's jersey number in this game.
  name: assist1_jersey_today
  type: integer
- description: First assist's season assists after this goal.
  name: assist1_season_assists
  type: integer
- description: Second assist, by name (no id).
  name: assist2_name
  type: character
- description: Second assist's jersey number in this game.
  name: assist2_jersey_today
  type: integer
- description: Second assist's season assists after this goal.
  name: assist2_season_assists
  type: integer
kind: dataframe
schema: ha_pbp
