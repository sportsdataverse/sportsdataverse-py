columns:
- description: Rank in the table.
  name: rank
  type: integer
- description: Player name (the table carries no player id).
  name: player_name
  type: character
- description: Display code of the team (AIK, MoDo, MORA, NVIF, ÖIK), not the StatNet
    id.
  name: team_code
  type: character
- description: StatNet team id (AIK, MODO, MIK, NYB, OSIK), not the display code.
  name: team_statnet_id
  type: character
- description: Jersey number of the player.
  name: jersey_number
  type: integer
- description: 'Playing position: F forward, D defence (G goalkeeper on goalie metrics).'
  name: position
  type: character
- description: Metric code (echo of the request metric).
  name: metric
  type: character
- description: Value of the metric (a count, a percentage or a clock, as text).
  name: metric_value
  type: character
- description: StatNet player id (the same id space as SHL's isa id, verified on one
    player).
  name: player_statnet_id
  type: integer
- description: First name of the player.
  name: first_name
  type: character
- description: Family name of the player.
  name: family_name
  type: character
- description: Player slug; joins ha_players.
  name: slug
  type: character
- description: Headshot URL (medium rendition).
  name: headshot
  type: character
- description: Small headshot URL.
  name: headshot_small
  type: character
- description: Medium headshot URL.
  name: headshot_medium
  type: character
- description: Team logo URL.
  name: team_logo
  type: character
- description: Team label as shown on the card (the display team code).
  name: team_name
  type: character
- description: Team primary colour (hex).
  name: team_main_color
  type: character
kind: dataframe
schema: ha_leaders
