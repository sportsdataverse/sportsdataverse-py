columns:
- description: Family name of the player.
  name: family_name
  type: character
- description: First name of the player.
  name: first_name
  type: character
- description: CMS (Strapi) record id of the player (not the StatNet id).
  name: player_cms_id
  type: integer
- description: CMS (Strapi) document id of the player.
  name: player_document_id
  type: character
- description: Headshot URL (large rendition).
  name: headshots_large
  type: character
- description: Headshot URL (small rendition).
  name: headshots_small
  type: character
- description: Headshot URL (thumb rendition).
  name: headshots_thumb
  type: character
- description: Headshot URL (medium rendition).
  name: headshots_medium
  type: character
- description: Playing position code (CE centre, LW left wing, ...); positionName
    spells it out in English.
  name: position_code
  type: character
- description: Jersey number of the player.
  name: jersey_number
  type: integer
- description: Birth date, YYYY-MM-DD.
  name: birth_date
  type: character
- description: Nationality, IOC/ISO alpha-3 code (SWE, NOR).
  name: country
  type: character
- description: Height in cm.
  name: height
  type: integer
- description: Weight in kg.
  name: weight
  type: integer
- description: 'Shoots / catches: L or R.'
  name: shoots
  type: character
- description: Youth (development) club.
  name: youth_team
  type: character
- description: Rookie flag.
  name: is_rookie
  type: logical
- description: Card label 'TEAM \| POS JERSEY \| Family name'.
  name: team_player
  type: character
- description: Player slug; joins ha_leaders.
  name: slug
  type: character
- description: Playing position, English label (Center, Left Wing, ...).
  name: position_name
  type: character
- description: CMS (Strapi) record id of the team (81 = AIK).
  name: team_cms_id
  type: integer
- description: CMS (Strapi) document id of the team.
  name: team_document_id
  type: character
- description: Display code of the team (AIK, MoDo, MORA, NVIF, ÖIK), not the StatNet
    id.
  name: team_code
  type: character
- description: Primary colour of the team (hex).
  name: team_main_color_hex
  type: character
- description: Team label as shown on the card (the display team code).
  name: team_name
  type: character
- description: Logo URL of the team.
  name: team_logo_url
  type: character
kind: dataframe
schema: ha_players
