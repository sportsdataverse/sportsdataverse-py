columns:
- description: Seasons (END year) the player appears in.
  name: active_seasons
  type: character
- description: Map team id -> seasons (END year) with that team.
  name: team_seasons
  type: character
- description: Map team name -> team as `<num>:<slug>`.
  name: team_list
  type: character
- description: 'Birth place: country: code.'
  name: birth_locality_country_code
  type: character
- description: 'Birth place: country: rink name.'
  name: birth_locality_country_name
  type: character
- description: 'Birth place: rink name.'
  name: birth_locality_name
  type: character
- description: Date of birth, YYYY-MM-DD.
  name: date_of_birth
  type: character
- description: Player id; the same number in lineups, rosters, stat tables and the
    profile (fihaId).
  name: player_id
  type: integer
- description: First name.
  name: first_name
  type: character
- description: Last name.
  name: last_name
  type: character
- description: Shoots LEFT or RIGHT.
  name: handedness
  type: character
- description: Height, cm.
  name: height
  type: integer
- description: Suspended.
  name: is_suspended
  type: logical
- description: Removed from the roster.
  name: is_removed
  type: logical
- description: 'Nationality: code.'
  name: nationality_code
  type: character
- description: 'Nationality: rink name.'
  name: nationality_name
  type: character
- description: Weight, kg.
  name: weight
  type: integer
- description: 'Team directory: a map keyed by team as `<num>:<slug>` (e.g. `1368624751:k-espoo`),
    one row per current or past team.'
  name: teams
  type: character
kind: dataframe
schema: player
