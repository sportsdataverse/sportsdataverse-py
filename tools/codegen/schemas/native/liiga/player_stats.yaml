- description: Player is on the team now.
  name: current
  type: logical
- description: 'Is u 2 #0.'
  name: is_u20
  type: logical
- description: Golden helmets (player, summed over the season range).
  name: golden_helmets
  type: integer
- description: Alumni points (player, summed over the season range).
  name: alumni_points
  type: integer
- description: Goals.
  name: goals
  type: integer
- description: Assists (player, all-time).
  name: assists
  type: integer
- description: Points (player, all-time).
  name: points
  type: integer
- description: On ice for goals for (the + of plus/minus).
  name: plus
  type: integer
- description: On ice for goals against (the - of plus/minus).
  name: minus
  type: integer
- description: plus minus minus.
  name: plus_minus
