    per-shot xG.'
  name: expected_goals
  type: numeric
- description: Contest won (player, summed over the season range).
  name: contest_won
  type: integer
- description: Contest lost (player, summed over the season range).
  name: contest_lost
  type: integer
- description: Goals to empty goal (goalkeeper, this period).
  name: goals_to_empty_goal
  type: integer
- description: Time on ice (player, summed over the season range). Seconds per game.
  name: time_on_ice_avg
  type: numeric
- description: Contest won percentage (player, summed over the season range). Percent,
