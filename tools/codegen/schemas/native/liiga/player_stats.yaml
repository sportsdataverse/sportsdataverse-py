columns:
- description: Player id; the same number in lineups, rosters, stat tables and the
    profile (fihaId).
  name: player_id
  type: integer
- description: Team id, the number of Liiga's `<num>:<slug>` team key (sent as that
    string, a bare integer or a digit string depending on the route).
  name: team_id
  type: integer
- description: Team display name.
  name: team_name
  type: character
- description: Team abbreviation.
  name: team_short_name
  type: character
- description: 'Position: CENTER, LEFT_WING, RIGHT_WING, LEFT_DEFENSEMAN, RIGHT_DEFENSEMAN,
    SEVENTH_DEFENSEMAN, GOALIE.'
  name: role
  type: character
- description: First name.
  name: first_name
  type: character
- description: Last name.
  name: last_name
  type: character
- description: Nationality, 3-letter code.
  name: nationality
  type: character
- description: Tournament.
  name: tournament
  type: character
- description: Photo URL.
  name: picture_url
  type: character
- description: Earlier teams of a player traded during the tournament.
  name: previous_teams_for_tournament
  type: character
- description: Injured.
  name: injured
  type: logical
- description: Jersey number.
  name: jersey
  type: integer
- description: Last season (player, summed over the season range).
  name: last_season
  type: integer
- description: Goalkeeper.
