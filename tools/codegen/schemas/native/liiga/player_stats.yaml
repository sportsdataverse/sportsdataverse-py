  name: contest_won_percentage
  type: numeric
- description: Goals minus expectedGoals over the season range (4 goals on 5.0956
    xG = -1.0956).
  name: xge
  type: numeric
- description: Shot percentage (player, all-time). Percent, 0-100.
  name: shot_percentage
  type: numeric
