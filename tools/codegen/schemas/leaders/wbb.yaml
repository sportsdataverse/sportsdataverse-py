schema: leaders
kind: dataframe
columns:
- name: rank
  type: integer
  description: 'Place of the athlete in ESPN''s leaderboard order (the requested category or sort), counted across pages:
    (page - 1) * limit + position on the page.'
- name: athlete_id
  type: integer
  description: ESPN id of the athlete, the key the athlete endpoints (athlete_overview, athlete_stats) take.
- name: athlete_uid
  type: character
  description: ESPN composite athlete uid (s:<sport>~l:<league>~a:<athlete id>), kept as text.
- name: athlete_display_name
  type: character
  description: Athlete's full display name.
- name: athlete_short_name
  type: character
  description: Athlete's abbreviated name (e.g. 'B. Nix').
- name: athlete_first_name
  type: character
  description: Athlete's first name.
- name: athlete_last_name
  type: character
  description: Athlete's last name.
- name: athlete_position
  type: character
  description: Athlete's position abbreviation (e.g. QB, G, C).
- name: athlete_status
  type: character
  description: Athlete's ESPN status name (e.g. Active, Inactive) as ESPN reports it at request time, not for the requested
    season.
- name: team_id
  type: integer
  description: ESPN id of the team the athlete played for in the requested season.
- name: team_abbreviation
  type: character
  description: Abbreviation of the athlete's team in the requested season (ESPN teamShortName, e.g. ORE).
- name: team_name
  type: character
  description: Nickname of the athlete's team in the requested season (ESPN teamName, e.g. Ducks).
