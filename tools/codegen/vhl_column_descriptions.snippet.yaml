vhl_game_info:
  attendance: Attendance (from '910 sp').
  away_city: Away team city.
  away_coach: Away head coach, 'Surname Given'.
  away_score: Away final goals.
  away_short: Away team short name (the report tables' form).
  away_team: Away team name (Latin, FULL form).
  away_team_page_id: 'Away team page id. Team page id (vhlru.ru only): the {team_id}
    of /en/teams/{team_id}/ (Toros = 390). Neither a club id nor a team-season id;
    it joins nothing else (bridge: the calendar row of the same game_id).'
  date: Game date, ISO 'YYYY-MM-DD', parsed from date_text.
  date_text: Date line verbatim; RUSSIAN month and weekday even on /en/ ('18 Март
    2026, Среда, 17:00'). The <time datetime> attribute is a constant placeholder
    (2020-01-23 18:00) and is ignored.
  decision: OT or SO when the game went past regulation; null otherwise.
  game_id: 'Game id (the calendar''s game_id; the report''s and the broadcast''s idgame).
    The report and broadcast pages do not print it: it comes from the request.'
  game_number: Official game number (from '№984'); checked against the request.
  home_city: Home team city.
  home_coach: Home head coach, 'Surname Given'.
  home_score: Home final goals.
  home_short: Home team short name (the report tables' form).
  home_team: 'Home team name (Latin, FULL form: ''Kristall S''; the report''s tables
    use the short ''Kristall'').'
  home_team_page_id: 'Home team page id. Team page id (vhlru.ru only): the {team_id}
    of /en/teams/{team_id}/ (Toros = 390). Neither a club id nor a team-season id;
    it joins nothing else (bridge: the calendar row of the same game_id).'
  linesman1: First linesman, 'Surname Given'.
  linesman1_number: First linesman's sweater number.
  linesman2: Second linesman, 'Surname Given'.
  linesman2_number: Second linesman's sweater number.
  local_time: Start time 'HH:MM' from date_text; local time zone unverified (likely
    Moscow).
  period_scores: 'Score of each period ''home:away'', overtime and shootout included
    (SO game: ''0:2'',''0:0'',''2:0'',''0:0'',''0:1'').'
  referee1: First referee, 'Surname Given'.
  referee1_number: First referee's sweater number.
  referee2: Second referee, 'Surname Given'.
  referee2_number: Second referee's sweater number.
  score: Final score 'home:away' (the shootout counts as one goal).
  season: Season END year (2026 = 2025/26).
  stage: 'Season stage: regular or playoff.'
  tn: Tournament id of the season stage (2025/26 regular season = 1374, playoffs =
    1375); vhl_tn maps season + stage to it.
vhl_goalie_box:
  assists: 'Assists (A) credited to the player in the row''s scope: the game in a
    box score, the season stage in stats and career rows.'
  captaincy: Unobserved in samples (null in every capture); type and meaning unverified.
  gaa: Goals-against average (GAA) = 60 x GA / TOI minutes; null when the page shows
    '-'.
  game_id: 'Game id (the calendar''s game_id; the report''s and the broadcast''s idgame).
    The report and broadcast pages do not print it: it comes from the request.'
  game_number: Official game number (from '№984'); checked against the request.
  games_played: Games played (GP).
  goals_against: Goals allowed (GA).
  jersey: Jersey number (integer).
  losses: Goalie losses (L).
  penalty_minutes: Penalty minutes (PIM).
  player: Player name, 'Surname Given' (Latin on /en/ pages).
  player_id: 'Player id: the {player_id} of /en/players/{player_id}/, stable across
    seasons and teams; also the photo id on img.khl.ru. Same numeric sequence as khl.ru
    player ids; whether it equals the same person''s khl.ru id is unverified.'
  save_pct: Save percentage (%Sv); 0-100 scale (93.8 = 93.8 %); null when the page
    shows '-'.
  saves: 'Saves (Sv): shots on goal the goalie stopped in the row''s scope (the game,
    or the season stage in stats and career rows).'
  season: Season END year (2026 = 2025/26).
  shootouts_played: Shootouts played (SOP).
  shots_against: Shots on goal faced (the SOG column of goalie tables).
  shutouts: 'Shutouts (SO): games in the row''s scope in which the goalie allowed
    no goal.'
  stage: 'Season stage: regular or playoff.'
  team: Team short name (Latin; the report tables' form).
  team_page_id: Team page id (vhlru.ru /en/teams/{team_page_id}/), stable across seasons;
    for report rows the page id of the row's side.
  team_side: 'Side of the game the row belongs to: home or away.'
  toi: Time on ice in this game, 'mm:ss'; null for a dressed goalie who did not play
    ('-').
  wins: Goalie wins (W).
