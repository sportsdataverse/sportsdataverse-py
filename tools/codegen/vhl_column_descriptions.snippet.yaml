vhl_goals:
  assist1: First assist name; null when unassisted.
  assist1_id: Player id of the first assist; null when unassisted.
  assist1_jersey: First assist jersey number.
  assist1_season_total: The first assist's season assist count after this goal (the
    '(14)' suffix).
  assist2: Second assist name; null when none.
  assist2_id: Player id of the second assist; null when none.
  assist2_jersey: Second assist jersey number.
  assist2_season_total: The second assist's season assist count after this goal.
  away_on_ice: Jersey numbers of the away players on ice at the goal (goalie included);
    the column header is the away team's short name. Empty on the shootout row.
  game_id: 'Game id (the calendar''s game_id; the report''s and the broadcast''s idgame).
    The report and broadcast pages do not print it: it comes from the request.'
  game_number: Official game number (from '№984'); checked against the request.
  goal_number: Goal number in the game (G).
  home_on_ice: 'Jersey numbers of the home players on ice at the goal (goalie included);
    the column header is the home team''s short name. Shootout row: the goalie only.'
  period: 'Period (Per) as printed: ''1'', ''2'', ''3'', overtime unverified, ''РБ''
    (Cyrillic even on /en/: shootout, решающий бросок).'
  score: Score after the goal 'home:away' (Score).
  scorer: Goal scorer's name, 'Surname Given' as the report prints it.
  scorer_id: 'Player id of the scorer: the {player_id} of /en/players/{player_id}/,
    stable across seasons and teams; also the photo id on img.khl.ru. Same numeric
    sequence as khl.ru player ids; whether it equals the same person''s khl.ru id
    is unverified.'
  scorer_jersey: Scorer jersey number.
  scorer_season_total: The scorer's season goal count after this goal (the '(13)'
    suffix); null on the shootout row.
  season: Season END year (2026 = 2025/26).
  stage: 'Season stage: regular or playoff.'
  strength: 'Goal strength code (PMG): eq (even), ppg (power play), shg (shorthanded);
    null on the shootout row.'
  team_page_id: Team page id (vhlru.ru /en/teams/{team_page_id}/), stable across seasons;
    for report rows the page id of the row's side.
  team_side: 'Side of the game the row belongs to: home or away.'
  time: Elapsed game time 'mm:ss' from the opening faceoff (Time); the shootout row
    says '65:00'.
vhl_pbp:
  away_team: Away team name in Cyrillic.
  clock: 'What time means: game (elapsed mm:ss), minute (''58 мин''), wall (local
    wall clock, game_state rows); null when there is no time.'
  event_index: Order of the event on the page, 0 = the first listed (the broadcast
    lists the latest event first).
  game_id: 'Game id (the calendar''s game_id; the report''s and the broadcast''s idgame).
    The report and broadcast pages do not print it: it comes from the request.'
  game_number: Official game number ('Игра номер 984'); checked against the request.
  home_team: Home team name in Cyrillic.
  kind: 'Event kind from the CSS modifier: game_state (ga), comment (co), goal (go),
    penalty (pn), goalie_change (gc), video_review (vr), shootout_attempt (bu).'
  kind_code: Raw CSS modifier of .game-event-item--<code>.
  player_ids: Player ids linked in the event text (//vhlru.ru/players/{id}/), scorer
    first; empty for most kinds.
  score: 'Score ''home-away'' (dash, not colon) after a goal; on a shootout attempt,
    the shootout score printed beside it (before or after that attempt: unverified).'
  season: Season END year (2026 = 2025/26).
  stage: 'Season stage: regular or playoff.'
  strength: 'strength_code in English: even, power_play, shorthanded, penalty_shot_or_shootout.'
  strength_code: 'Goal strength code in Cyrillic: РАВ (even), БОЛ (power play), МЕН
    (shorthanded, unobserved), БУЛ (penalty shot / shootout); empty string seen as
    null.'
  text: Event text verbatim in RUSSIAN (team, players, infraction, period stats);
    not translated.
  time: 'Time label verbatim: ''mm:ss'' elapsed game time, ''NN мин'' (minute of a
    comment), or ''HH:MM'' wall clock on game_state events; null when absent. See
    clock.'
