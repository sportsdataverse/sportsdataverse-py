  fg_made_30_39: Number of successful field goals made from 30–39 yards during the game or season period.
  fg_made_40_49: Number of successful field goals made from 40–49 yards during the game or season period.
  fg_made_50_59: Number of successful field goals made from 50–59 yards during the game or season period.
  fg_made_60_: Number of successful field goals made from 60 yards or longer during the game or season period.
  fg_made_distance: Cumulative distance in yards of all successful field goals made during the game or season period.
  fg_made_list: List of distances (in yards) of each successful field goal made during the game or season period.
  fg_missed: Total number of field goal attempts missed (not blocked) by the team's kicker during the period.
  fg_missed_0_19: Number of field goal attempts from 0–19 yards that were missed (not blocked) during the period.
  fg_missed_20_29: Number of field goal attempts from 20–29 yards that were missed (not blocked) during the period.
  fg_missed_30_39: Number of field goal attempts from 30–39 yards that were missed (not blocked) during the period.
  fg_missed_40_49: Number of field goal attempts from 40–49 yards that were missed (not blocked) during the period.
  fg_missed_50_59: Number of field goal attempts from 50–59 yards that were missed (not blocked) during the period.
  fg_missed_60_: Number of field goal attempts from 60 yards or longer that were missed (not blocked) during the period.
  fg_missed_distance: Cumulative distance in yards of all missed field goal attempts during the game or season period.
  fg_missed_list: List of distances (in yards) of each missed field goal attempt during the game or season period.
  fumble_recovery_opp: Number of fumbles recovered by the team that were originally lost by the opposing team.
  fumble_recovery_own: Number of fumbles recovered by the team that were originally fumbled by their own players.
  fumble_recovery_tds: Number of touchdowns scored by the team on fumble recoveries during the game or season period.
  fumble_recovery_yards_opp: Total yards gained on returns of fumbles recovered from the opposing team during the period.
  fumble_recovery_yards_own: Total yards gained (or lost) on recoveries of the team's own fumbles during the period.
  gwfg_att: Number of game-winning field goal attempts made in the final moments to win the game.
  gwfg_blocked: Number of game-winning field goal attempts that were blocked by the opposing defense.
  gwfg_distance: Distance in yards of the game-winning field goal attempt (or attempts) during the period.
  gwfg_made: Number of successful game-winning field goals made to secure a victory in the final moments.
  gwfg_missed: Number of game-winning field goal attempts that were missed (no good) in the final moments.
  kickoff_return_yards: Total yards gained by the team on kickoff returns during the game or season period.
  kickoff_returns: Total number of kickoff returns recorded by the team during the game or season period.
  misc_yards: Miscellaneous yards not attributed to passing, rushing, or standard return categories during the period.
  opponent_team: Team abbreviation or identifier of the opposing team faced during the game or period.
  passing_cpoe: Completion percentage over expectation (CPOE) for the team's passing attack during the period, relative to a model-based baseline.
  passing_interceptions: Total number of interceptions thrown by the team's passers during the game or season period.
  pat_att: Total number of point-after-touchdown (PAT / extra point) attempts by the team's kicker during the period.
  pat_blocked: Number of point-after-touchdown attempts that were blocked by the opposing defense during the period.
  pat_made: Total number of successful point-after-touchdown kicks made by the team's kicker during the period.
  pat_missed: Number of point-after-touchdown attempts that were missed (not blocked) during the period.
  pat_pct: Percentage of point-after-touchdown attempts that were successfully converted during the period.
  sack_yards_lost: Total offensive yards lost by the team on plays where the quarterback was sacked during the period.
  sacks_suffered: Total number of times the team's quarterback was sacked by the opposing defense during the period.
  timeouts: Number of timeouts remaining or used by the team during the game or period.
