    skated leaderboard leader, per NHL EDGE tracking.
  leaders_total_distance_skated_distance_skated_metric: Cumulative skating distance (in kilometres) recorded by the total
    distance skated leaderboard leader, per NHL EDGE tracking.
  leaders_total_distance_skated_player_first_name_default: First name of the skater leading the total distance skated leaderboard,
    in the default display language.
  leaders_total_distance_skated_player_headshot: URL of the headshot image for the total distance skated leaderboard leader.
  leaders_total_distance_skated_player_id: Unique NHL identifier for the skater atop the total distance skated leaderboard.
  leaders_total_distance_skated_player_last_name_default: Last name of the skater leading the total distance skated leaderboard,
    in the default display language.
  leaders_total_distance_skated_player_position: Ice position (e.g., C, LW, RW, D) of the total distance skated leaderboard
    leader.
  leaders_total_distance_skated_player_slug: URL-safe slug identifying the total distance skated leaderboard leader on the
    NHL website.
  leaders_total_distance_skated_player_sweater_number: Jersey number worn by the skater leading the total distance skated
    leaderboard.
  leaders_total_distance_skated_player_team_abbrev: Three-letter abbreviation of the team the total distance skated leaderboard
    leader plays for.
  leaders_total_distance_skated_player_team_common_name_default: Common team name of the total distance skated leaderboard
    leader's club, in the default language.
  leaders_total_distance_skated_player_team_place_name_with_preposition_default: Team place name with grammatical preposition
    in the default language for the total distance skated leader's team.
  leaders_total_distance_skated_player_team_place_name_with_preposition_fr: Team place name with grammatical preposition in
    French for the total distance skated leader's team.
  leaders_total_distance_skated_player_team_team_logo_dark: URL of the dark-background version of the team logo for the total
    distance skated leaderboard leader's club.
  leaders_total_distance_skated_player_team_team_logo_light: URL of the light-background version of the team logo for the
    total distance skated leaderboard leader's club.
  seasons_with_edge_stats: List of NHL seasons for which this skater has NHL EDGE player-tracking statistics available.
skater_shot_speed_detail:
  hardest_shots: Serialized list or JSON array of the player's hardest individual shot efforts, including speed and context
    metadata from NHL EDGE puck tracking.
  shot_speed_details_avg_shot_speed_imperial: Player's average shot speed across all tracked shot attempts for the season,
    measured in miles per hour (imperial).
  shot_speed_details_avg_shot_speed_league_avg_imperial: League-average shot speed across all qualifying skaters' tracked
    attempts for the season, measured in miles per hour (imperial).
  shot_speed_details_avg_shot_speed_league_avg_metric: League-average shot speed across all qualifying skaters' tracked attempts
    for the season, measured in kilometers per hour (metric).
  shot_speed_details_avg_shot_speed_metric: Player's average shot speed across all tracked shot attempts for the season, measured
    in kilometers per hour (metric).
  shot_speed_details_avg_shot_speed_percentile: Percentile rank of the player's average shot speed relative to all qualifying
    skaters in the NHL EDGE shot-speed dataset.
  shot_speed_details_shot_attempts70_to80_league_avg: League-average number of shot attempts falling in the 70–80 mph speed
    band among qualifying skaters for the season.
  shot_speed_details_shot_attempts70_to80_percentile: Percentile rank of the player's count of shot attempts in the 70–80
    mph speed band relative to all qualifying skaters in the NHL EDGE dataset.
  shot_speed_details_shot_attempts70_to80_value: Number of the player's tracked shot attempts for the season with a recorded
    speed between 70 and 80 mph.
  shot_speed_details_shot_attempts80_to90_league_avg: League-average number of shot attempts falling in the 80–90 mph speed
    band among qualifying skaters for the season.
  shot_speed_details_shot_attempts80_to90_percentile: Percentile rank of the player's count of shot attempts in the 80–90
    mph speed band relative to all qualifying skaters in the NHL EDGE dataset.
  shot_speed_details_shot_attempts80_to90_value: Number of the player's tracked shot attempts for the season with a recorded
    speed between 80 and 90 mph.
  shot_speed_details_shot_attempts90_to100_league_avg: League-average number of shot attempts falling in the 90–100 mph speed
    band among qualifying skaters for the season.
  shot_speed_details_shot_attempts90_to100_percentile: Percentile rank of the player's count of shot attempts in the 90–100
    mph speed band relative to all qualifying skaters in the NHL EDGE dataset.
  shot_speed_details_shot_attempts90_to100_value: Number of the player's tracked shot attempts for the season with a recorded
    speed between 90 and 100 mph.
  shot_speed_details_shot_attempts_over100_league_avg: League-average number of shot attempts with a recorded speed above
    100 mph among qualifying skaters for the season.
  shot_speed_details_shot_attempts_over100_percentile: Percentile rank of the player's count of shot attempts exceeding 100
    mph relative to all qualifying skaters in the NHL EDGE dataset.
  shot_speed_details_shot_attempts_over100_value: Number of the player's tracked shot attempts for the season with a recorded
    speed exceeding 100 mph.
  shot_speed_details_top_shot_speed_imperial: Player's single highest recorded shot speed for the season measured in miles
    per hour (imperial), from NHL EDGE puck-tracking.
  shot_speed_details_top_shot_speed_league_avg_imperial: League-average highest shot speed among qualifying skaters for the
    season, measured in miles per hour (imperial).
  shot_speed_details_top_shot_speed_league_avg_metric: League-average highest shot speed among qualifying skaters for the
    season, measured in kilometers per hour (metric).
  shot_speed_details_top_shot_speed_metric: Player's single highest recorded shot speed for the season measured in kilometers
    per hour (metric), from NHL EDGE puck-tracking.
  shot_speed_details_top_shot_speed_overlay_away_team_abbrev: Three-letter abbreviation for the away team in the game where
    the player recorded their top shot speed this season.
  shot_speed_details_top_shot_speed_overlay_away_team_score: Away team's final score in the game where the player recorded
    their season-high shot speed.
  shot_speed_details_top_shot_speed_overlay_game_date: Date (YYYY-MM-DD) of the game in which the player recorded their top
    shot speed for the season.
  shot_speed_details_top_shot_speed_overlay_game_outcome_last_period_type: Type of period that ended the game where the player
    set their top shot speed (e.g., 'REG', 'OT', 'SO').
  shot_speed_details_top_shot_speed_overlay_game_type: Numeric code for the game type of the game in which the player recorded
    their top shot speed (e.g., 2 = regular season).
  shot_speed_details_top_shot_speed_overlay_home_team_abbrev: Three-letter abbreviation for the home team in the game where
    the player achieved their top shot speed this season.
  shot_speed_details_top_shot_speed_overlay_home_team_score: Home team's final score in the game where the player recorded
    their season-high shot speed.
  shot_speed_details_top_shot_speed_overlay_period_descriptor_max_regulation_periods: Maximum number of regulation periods
    defined for the game type in which the player recorded their top shot speed.
  shot_speed_details_top_shot_speed_overlay_period_descriptor_number: Period number in which the player released their top-speed
    shot during the referenced game.
  shot_speed_details_top_shot_speed_overlay_period_descriptor_period_type: Period type label (e.g., 'REG', 'OT') for the period
    in which the player recorded their top shot speed.
  shot_speed_details_top_shot_speed_overlay_player_first_name_default: Player's first name as stored in the NHL api-web system,
    included in the overlay for the top-shot-speed event.
  shot_speed_details_top_shot_speed_overlay_player_last_name_default: Player's last name as stored in the NHL api-web system,
    included in the overlay for the top-shot-speed event.
  shot_speed_details_top_shot_speed_overlay_time_in_period: Time elapsed within the period (MM:SS) when the player released
    their top-speed shot for the season.
  shot_speed_details_top_shot_speed_percentile: Percentile rank of the player's top shot speed relative to all qualifying
    skaters in the NHL EDGE shot-speed dataset.
skater_skating_distance_detail:
  skating_distance_details: JSON-serialized per-game breakdown of total distance skated by the player during the tracking
    period.
  skating_distance_last10: JSON-serialized rolling summary of total distance skated by the player across the last 10 games.
skater_skating_speed_detail:
  skating_speed_details_bursts18_to20_league_avg: League-average number of skating speed bursts in the 18-20 mph band per
    game, used as the baseline for percentile calculation.
  skating_speed_details_bursts18_to20_percentile: Percentile rank among all NHL skaters for frequency of skating speed bursts
    in the 18-20 mph speed band.
  skating_speed_details_bursts18_to20_value: Average number of skating bursts per game in which the skater's speed fell in
    the 18-20 mph range.
  skating_speed_details_bursts20_to22_league_avg: League-average number of skating speed bursts in the 20-22 mph band per
    game, used as the baseline for percentile calculation.
  skating_speed_details_bursts20_to22_percentile: Percentile rank among all NHL skaters for frequency of skating speed bursts
    in the 20-22 mph speed band.
  skating_speed_details_bursts20_to22_value: Average number of skating bursts per game in which the skater's speed fell in
    the 20-22 mph range.
  skating_speed_details_bursts_over22_league_avg: League-average number of skating speed bursts exceeding 22 mph per game,
    used as the baseline for this skater's percentile.
  skating_speed_details_bursts_over22_percentile: Percentile rank among all NHL skaters for frequency of skating speed bursts
    exceeding 22 mph per game.
  skating_speed_details_bursts_over22_value: Average number of skating bursts per game in which the skater reached or exceeded
    22 mph during the tracking period.
  skating_speed_details_max_skating_speed_imperial: Skater's maximum recorded skating speed in miles per hour captured by
    EDGE tracking during the tracking period.
  skating_speed_details_max_skating_speed_league_avg_imperial: League-average maximum skating speed in miles per hour, used
    as the baseline for this skater's max-speed percentile.
  skating_speed_details_max_skating_speed_league_avg_metric: League-average maximum skating speed in kilometers per hour,
    used as the baseline for this skater's max-speed percentile.
  skating_speed_details_max_skating_speed_metric: Skater's maximum recorded skating speed in kilometers per hour captured
    by EDGE tracking during the tracking period.
  skating_speed_details_max_skating_speed_overlay_away_team_abbrev: Abbreviation of the away team in the game where the skater's
    maximum skating speed was recorded.
  skating_speed_details_max_skating_speed_overlay_away_team_score: Score of the away team at the conclusion of the game in
    which the skater's maximum skating speed was recorded.
  skating_speed_details_max_skating_speed_overlay_game_date: Date on which the game occurred where the skater's maximum skating
    speed was recorded.
  skating_speed_details_max_skating_speed_overlay_game_outcome_last_period_type: Type of the final period that determined
    the outcome of the game where the max speed was recorded (REG, OT, or SO).
  skating_speed_details_max_skating_speed_overlay_game_type: NHL game type code (e.g., 2 = regular season, 3 = playoffs) for
    the game where the skater's maximum speed was recorded.
  skating_speed_details_max_skating_speed_overlay_home_team_abbrev: Abbreviation of the home team in the game where the skater's
    maximum skating speed was recorded.
  skating_speed_details_max_skating_speed_overlay_home_team_score: Score of the home team at the conclusion of the game in
    which the skater's maximum skating speed was recorded.
  skating_speed_details_max_skating_speed_overlay_period_descriptor_max_regulation_periods: Number of regulation periods in
    the game format where the skater's maximum skating speed was recorded.
  skating_speed_details_max_skating_speed_overlay_period_descriptor_number: Period number within the game in which the skater's
    maximum skating speed was recorded.
  skating_speed_details_max_skating_speed_overlay_period_descriptor_period_type: Period type (REG, OT) identifying the phase
    of the game when the skater's maximum skating speed was recorded.
  skating_speed_details_max_skating_speed_overlay_player_first_name_default: First name of the skater for whom the maximum
    skating speed overlay data is displayed.
  skating_speed_details_max_skating_speed_overlay_player_last_name_default: Last name of the skater for whom the maximum skating
    speed overlay data is displayed.
  skating_speed_details_max_skating_speed_overlay_time_in_period: Elapsed time within the period (mm:ss) at which the skater's
    career or season maximum skating speed was recorded.
  skating_speed_details_max_skating_speed_percentile: Percentile rank among all NHL skaters for maximum skating speed recorded
    during the tracking period.
  top_skating_speeds: JSON-serialized list of the skater's top individual speed bursts, typically the ten highest speed readings
    recorded during the tracking period.
standings:
  advanced: Whether the team has advanced/qualified.
  against: Runs/goals against.
  conference_home_sequence: Team's rank within its conference based solely on home-game results in the NHL api-web standings.
  conference_l10_sequence: Team's rank within its conference based on performance in the last 10 games played, as reported
    by the NHL api-web standings endpoint.
  conference_road_sequence: Team's rank within its conference based solely on road-game results in the NHL api-web standings.
  deductions: Points deducted.
  division_games_behind: Number of games the team trails the division leader in the standings, expressed as a decimal (e.g.,
    0.5 for half a game back).
  division_home_sequence: Team's rank within its division based solely on home-game results in the NHL api-web standings.
  division_l10_sequence: Team's rank within its division based on performance in the last 10 games played, as reported by
    the NHL api-web standings endpoint.
  division_losses: Number of games the team has lost against opponents within their own division.
  division_percent: The team's winning percentage in division games, calculated as division wins divided by total division
    games played.
  division_record: The team's composite win-loss-tie record against division opponents, serialized as a numeric value.
  division_road_sequence: Team's rank within its division based solely on road-game results in the NHL api-web standings.
  division_tied: Number of games the team has tied against opponents within their own division.
  division_ties: Number of games the team has tied against opponents within their own division.
  division_wins: Number of games the team has won against opponents within their own division.
  for: Runs/goals for.
  games_played: Matches played.
  goal_against: Total number of goals allowed by the team across all games played in the current standings snapshot.
  goal_differential_pctg: Team's goal differential normalized to a per-game (or percentage) basis, as published in the NHL
    standings feed.
  goal_for: Total number of goals scored by the team across all games played in the current standings snapshot.
  goals_for_pctg: Team's share of total goals scored in all games involving this team, calculated as goals-for divided by
    (goals-for + goals-against).
  group: Conference/group/table the row belongs to, flattened from the standings children hierarchy.
  home_games_played: Number of home games the team has completed in the current season as of this standings snapshot.
  home_goal_differential: Net goal differential (goals-for minus goals-against) accumulated across all home games played in
    the current season.
  home_goals_against: Total number of goals allowed by the team in home games during the current season.
  home_goals_for: Total number of goals scored by the team in home games during the current season.
  home_regulation_plus_ot_wins: Number of home wins achieved in regulation or overtime (excluding shootout decisions) in the
    current season.
  home_regulation_wins: Number of home wins achieved in regulation time (within 60 minutes) in the current season.
  l10_games_played: Number of games included in the team's last-10-games performance window (typically 10, may be lower early
    in the season).
  l10_goal_differential: Net goal differential (goals-for minus goals-against) across the team's most recent 10 games.
  l10_goals_against: Total goals allowed by the team across its most recent 10 games.
  l10_goals_for: Total goals scored by the team across its most recent 10 games.
  l10_points: Total standings points earned by the team across its most recent 10 games.
  l10_regulation_plus_ot_wins: Number of wins in regulation or overtime (excluding shootouts) within the team's most recent
    10 games.
  l10_regulation_wins: Number of regulation-time wins within the team's most recent 10 games.
  l10_ties: Number of tied results recorded within the team's most recent 10 games (applicable to seasons using tie rules).
  league_home_sequence: Team's rank league-wide based solely on home-game results in the NHL api-web standings.
  league_l10_sequence: Team's rank league-wide based on performance in the last 10 games played, as reported by the NHL api-web
    standings endpoint.
  league_road_sequence: Team's rank league-wide based solely on road-game results in the NHL api-web standings.
  losses: Number of matches the team has lost.
  magic_number_division: Combination of wins needed by the team (or losses needed by the division leader) for the team to
    clinch a division title.
  magic_number_wildcard: Combination of wins needed by the team (or losses needed by the next wildcard team) for the team
    to clinch a wildcard playoff berth.
  match_points: Competition points (cricket).
  matches_lost: Matches lost (cricket).
  matches_played: Matches played (cricket).
  matches_won: Matches won (cricket).
  netrr: Net run rate (cricket).
  noresult: Matches with no result (cricket).
  note: Standings note (e.g. qualification/relegation marker).
  overall: Overall record summary as published by ESPN.
  place_name_default: Default-language city or place name associated with the team's market (e.g., "Toronto"), as returned
    by the NHL api-web standings endpoint.
  place_name_fr: French-language city or place name associated with the team's market, as returned by the NHL api-web standings
    endpoint.
  playoff_percent: Estimated or model-derived probability that the team will qualify for the playoffs, expressed as a decimal
    between 0 and 1.
  point_differential: Goal difference (for minus against).
  points: Competition points.
  points_against: Goals conceded.
  points_diff: Difference between total points scored for and against the team across all games played.
  points_for: Goals (or runs) scored by the team.
  ppg: Points per game.
  qualified: Qualification flag (cricket).
  rank: Position within the group/table.
  rank_change: Change in rank versus the previous update.
  reg_losses: Number of losses the team has suffered in regulation time (excluding overtime and shootout losses).
  reg_wins: Number of wins the team has earned in regulation time (excluding overtime and shootout wins).
  regulation_plus_ot_win_pctg: Fraction of games won in regulation or overtime (excluding shootout decisions), used as a tiebreaker
    metric in NHL standings.
  regulation_win_pctg: Fraction of games won in regulation time only, used as a secondary tiebreaker in NHL standings.
  road_games_played: Number of road games the team has completed in the current season as of this standings snapshot.
  road_goal_differential: Net goal differential (goals-for minus goals-against) accumulated across all road games played in
    the current season.
  road_goals_against: Total number of goals allowed by the team in road games during the current season.
  road_goals_for: Total number of goals scored by the team in road games during the current season.
  road_points: Total standings points earned by the team in road games during the current season.
  road_regulation_plus_ot_wins: Number of road wins achieved in regulation or overtime (excluding shootout decisions) in the
    current season.
  road_regulation_wins: Number of road wins achieved in regulation time (within 60 minutes) in the current season.
  rot_losses: Number of losses the team has suffered in overtime or the shootout (non-regulation losses).
  rot_wins: Number of wins the team has earned in overtime or the shootout (non-regulation wins).
  team: Display name of the team in this standings row.
  team_abbrev_default: Default three-letter abbreviation for the team (e.g., "TOR"), as provided by the NHL api-web standings
    endpoint.
  team_abbreviation: Team abbreviation.
  team_id: ESPN numeric identifier for the team.
  ties: Number of matches the team has drawn.
  total: Aggregate/summary value as published by ESPN.
  vs ap top 25: The team's win-loss record against opponents ranked in the AP Top 25 poll.
  vs division: The team's win-loss(-tie) record against opponents within their own division, serialized as a numeric value.
  vs usa ranked teams: The team's win-loss record against opponents ranked in the USA Today Coaches Poll.
  waivers_sequence: Team's position in the NHL waiver-claim priority order for the current season, determined by reverse standings
    order.
  wild_card_percent: The team's winning percentage in games that count toward wildcard standings positioning.
  win_pctg: Team's overall win percentage (wins divided by games played), as reported by the NHL api-web standings endpoint.
  wins: Number of matches the team has won.
summary:
  accurate_crosses: Number of crosses into the opponent's area completed successfully by the team.
  accurate_long_balls: Number of long-ball passes completed successfully by the team during the match.
  accurate_passes: Number of passes completed successfully by the team during the match.
  adj_qbr: ESPN's Adjusted Quarterback Rating for the player, measuring overall passing efficiency on a 0-100 scale.
  against: Total runs or score conceded by the team across all matches in the group or stage.
  athlete: Reference or identifier string for the athlete associated with this row in the box score.
  away_aggregate_score: Aggregate score for the away team across both legs of the two-legged tie.
  away_shootout_score: Number of penalties scored by the away team in a shootout to decide the tie.
  balls_faced: Total number of balls faced by the batter during their innings.
  captain: Indicates whether the player was designated as a team captain for this game.
  category_slug: Machine-readable slug identifying the statistical category the player entry belongs to in the box score.
  competition_date: Date and time of the competition as recorded in the game header.
  competition_id: ESPN numeric identifier for the primary competition (game) in the header.
  competition_name: Full name of the competition or tournament to which this series match belongs.
  completions/passing_attempts: Pass completion ratio for the player in the box score, expressed as completions divided by
    pass attempts.
  conceded: Total runs conceded by the bowler during their spell in this innings.
  cross_pct: Percentage of the team's crossing attempts that were accurate during the match.
  defensive_touchdowns: Number of touchdowns scored by the player via defensive plays such as interception or fumble returns.
  did_score: Boolean flag indicating whether the penalty kick or shootout attempt resulted in a goal.
  dismissal: Method by which the batter was dismissed in this innings (e.g., caught, bowled, run out).
  display_order: Numeric order in which the team or entry is displayed within the box score table.
  drive_sequence: Sequential position of the drive within the game's broadcast or play-by-play listing.
  economy_rate: Average runs conceded per over by the bowler in this innings.
  effective_clearance: Number of defensive clearances that successfully removed the ball from the danger area for the team.
  effective_tackles: Number of tackles by the team that successfully dispossessed the opposing player.
  end_clock_display_value: Game clock time displayed at the end of the drive or scoring sequence.
  end_period_number: Period or quarter number in which the drive or sequence ended.
  even_strength_saves: Number of saves made by the goaltender during even-strength play in the game.
  even_strength_time_on_ice: Total time the player spent on the ice during even-strength situations in the game.
  extra_points_made/extra_point_attempts: Extra point conversion ratio for the player, expressed as extra points made divided
    by attempts.
  extras: Additional runs awarded to the batting side from wides, no-balls, byes, or leg byes in this innings.
  field_goals_made/field_goal_attempts: Field goal conversion ratio for the player, expressed as field goals made divided
    by attempts.
  for: Total runs or score accumulated by the team across all matches in the group or stage.
  formation_place: Starting formation position or role assigned to the player within the team lineup for the match.
  fouls_committed: Total number of fouls committed by the team during the match.
  fours: Number of boundaries hit for four runs by the batter in this innings.
  fow_type: Type classification for this fall-of-wicket entry (e.g., caught, bowled, run out).
  full_innings.part_innings: Innings pitched expressed as full innings and fractional partial innings for the pitcher in the
    box score.
  fumbles: Number of fumbles committed by the player in the box score.
  game_note: Optional editorial note or context annotation attached to the game in the header.
  gross_avg_punt_yards: Average gross punt distance before accounting for returns, recorded for the player in the game.
  hits_at_bats: Hitting performance ratio expressed as hits divided by at-bats for the player in the box score.
  home_aggregate_score: Aggregate score for the home team across both legs of the two-legged tie.
  home_shootout_score: Number of penalties scored by the home team in a shootout to decide the tie.
  hurries: Number of times the player pressured the opposing passer into an early or errant throw.
  innings_number: Innings number within the match to which this batting or bowling entry belongs.
  interception_touchdowns: Number of touchdowns scored by the player on interception return plays.
  is_final: Boolean flag indicating whether the game has reached a final or completed status.
  is_national: Boolean flag indicating whether the broadcast is a nationally distributed feed.
  kick_return_touchdowns: Number of touchdowns scored on kick returns by the player in the box score.
  league_abbreviation: Abbreviation for the league or competition the game belongs to.
  league_id: ESPN numeric identifier for the league or competition.
  league_midsize_name: Medium-length display name for the league or competition as shown in the game header.
  links_api_artwork_href: API endpoint URL for artwork or imagery associated with the article.
  links_sportscenter_href: URL for the article's page on ESPN's SportsCenter platform.
  links_web_self_dsi_href: Data-source-identified URL for the web page of the associated article content.
  links_web_self_href: URL for the canonical web page of the associated article or editorial content.
  long_field_goal_made: Distance of the longest successful field goal kicked by the player in the game.
  long_kick_return: Longest single kick return yardage recorded by the player in the game.
  long_punt: Distance of the longest individual punt executed by the player in the game.
  long_punt_return: Longest single punt return yardage recorded by the player in the game.
  long_reception: Longest single reception recorded by the player in the game.
  long_rushing: Longest single rushing gain recorded by the player in the game.
  longball_pct: Percentage of long-ball attempts by the team that were accurate during the match.
  maidens: Number of maiden overs bowled by the bowler in this innings, in which no runs were conceded.
  main_stat_label: Human-readable label for the primary statistic displayed for the player in the box score.
  main_stat_value: Value of the primary statistic displayed for the player in the box score.
  match_note: Optional editorial note or special circumstance annotation attached to this match in the series.
  match_points: Total competition points accumulated by the team based on match outcomes in the group or stage.
  matches_lost: Total number of matches lost by the team in the current stage or competition group.
  matches_played: Total number of matches played by the team in the current stage or competition group.
  matches_won: Total number of matches won by the team in the current stage or competition group.
  nbw: Combined no-balls and wides bowled by the bowler in this innings.
  netrr: Net Run Rate for the team, a tiebreaker metric used in cricket group standings.
  noresult: Number of matches that ended without a result (e.g., rain-affected or abandoned) for the team.
  offsides: Total number of offside calls against the team during the match.
  on_base_pct: Percentage of plate appearances in which the player reached base safely in the game.
  overs: Number of overs bowled by the bowler in this innings.
  partnership_overs: Number of overs faced during the batting partnership for this fall-of-wicket record.
  partnership_runs: Total runs scored during the batting partnership for this fall-of-wicket record.
  pass_pct: Percentage of passes attempted by the team that were completed successfully.
  passes_defended: Number of pass plays disrupted or broken up by the defensive player in the game.
  passing_touchdowns: Number of touchdown passes thrown by the player in the box score.
  penalty_kick_goals: Number of goals scored by the team from penalty kicks during the match.
  penalty_kick_shots: Number of penalty kick attempts taken by the team during the match.
  perspective_team_id: ESPN identifier for the team whose perspective is used to orient the series or match result display.
  pitches: Total number of pitches thrown or faced by the player in the box score.
  pitches_strikes: Combined count of pitches thrown and strikes recorded for the pitcher in the box score.
  player1_name: Name of the first batter in the batting partnership for this fall-of-wicket entry.
  player1_runs: Runs contributed by the first player in the batting partnership.
  player2_name: Name of the second batter in the batting partnership for this fall-of-wicket entry.
  player2_runs: Runs contributed by the second player in the batting partnership.
  possession_pct: Percentage of total ball possession time held by the team during the match.
  power_play_saves: Number of saves made by the goaltender during power-play situations in the game.
  power_play_time_on_ice: Total time the player spent on the ice during power-play situations in the game.
  punt_return_touchdowns: Number of touchdowns scored on punt returns by the player in the box score.
  punt_yards: Total yardage of all punts executed by the player in the game.
  punts: Total number of punts executed by the player in the box score.
  punts_inside20: Number of punts by the player that were downed or stopped inside the opposing team's 20-yard line.
  qb_hits: Number of times the player made contact with the opposing quarterback after or during a pass attempt.
  qb_rating: Traditional passer rating for the quarterback in the box score, calculated from completions, yards, touchdowns,
    and interceptions.
  qualified: Boolean qualification flag indicating whether the team has secured advancement from the current group or stage.
  rb_is: Runs batted in and other secondary hitting statistics for the player in the box score.
  receiving_targets: Number of passing targets directed at the receiver during the game.
  receiving_touchdowns: Number of receiving touchdowns scored by the player in the box score.
  red_cards: Total number of red cards received by the team during the match.
  round_name: Name or label for the round or stage of the competition in which this series match is played.
  runs_total: Total runs scored by the team or batting side in this innings.
  rushing_touchdowns: Number of rushing touchdowns scored by the player in the box score.
  sacks_sack_yards_lost: Combined sack statistics for the player, including sack count and total yards lost by the opposing
    offense.
  season_type: ESPN season-phase numeric code (1=pre-season, 2=regular season, 3=postseason, 4=off-season).
  shootout_shots_against: Number of shootout attempts faced by the goaltender in the game's shootout.
  short_handed_saves: Number of saves made by the goaltender while the team was shorthanded in the game.
  short_handed_time_on_ice: Total time the player spent on the ice while the team was at a numerical disadvantage (shorthanded)
    in the game.
  shot_id: ESPN identifier for an individual shootout or penalty kick attempt.
  shot_info_abbreviation: Abbreviated description of the shot type associated with a scoring event in the box score.
  shot_number: Sequential number of the penalty kick or shootout attempt within the series.
  shot_pct: Percentage of the team's shot attempts that were on target during the match.
  shots_missed: Number of shots taken by the player that did not result in a goal or save attempt in the game.
  shots_on_target: Number of the team's shot attempts that were on target, requiring a save or resulting in a goal.
  sixes: Number of boundaries hit for six runs by the batter in this innings.
  slug_avg: Slugging average reflecting the total bases per at-bat recorded by the player in the box score.
  solo_tackles: Number of unassisted tackles recorded by the player in the box score.
  standings: Condensed standings reference or link included in the game header for the relevant league.
  start_clock_display_value: Game clock time displayed at the start of the drive or scoring sequence.
  start_period_number: Period or quarter number in which the drive or sequence began.
  station_key: Machine-readable key identifying the broadcasting station airing the game.
  strength_abbreviation: Abbreviated label for the strength-of-play situation at the time of the scoring event (e.g., even
    strength, power play).
  strikeouts: Number of strikeouts recorded by the player, either as a batter or pitcher, in the box score.
  subbed_in: Indicates whether the player entered the game as a substitute, or the minute of substitution.
  subbed_out: Indicates whether the player was substituted out of the game, or the minute of substitution.
  sudden_death_clock: Clock duration or time limit for sudden-death overtime periods as defined in the game format.
  sudden_death_periods: Number of sudden-death overtime periods defined in the game format rules.
  tackle_pct: Percentage of the team's tackle attempts that were effective in winning possession.
  team_entry_id: ESPN identifier for the team entry associated with this shootout or penalty record.
  team_name: Full display name of the team.
  team_participants: Teams or participants associated with a specific drive or sequence in the broadcast record.
  time_display: Human-readable game clock time at which a match event occurred.
  time_elapsed_display_value: Human-readable duration of time elapsed during the drive or scoring sequence.
  time_value: Numeric game clock value at which a match event occurred.
  total_clearance: Total number of defensive clearances made by the team during the match.
  total_crosses: Total number of crossing attempts made by the team during the match.
  total_kicking_points: Total points contributed by the player through field goals and extra points in the game.
  total_long_balls: Total number of long-ball passes attempted by the team during the match.
  total_passes: Total number of passes attempted by the team during the match.
  total_shots: Total number of shot attempts taken by the team during the match.
  total_tackles: Total tackles recorded by the player, including both solo and assisted tackles.
  touchbacks: Number of punts or kick-offs by the player that resulted in the opposing team starting from their own end zone.
  venue_address_country: Country of the venue where the game was played.
  venue_address_zip_code: Postal zip code of the venue where the game was played.
  venue_country: Country name for the venue where the game was played.
  venue_short_name: Abbreviated or shortened display name for the venue where the game was played.
  vs. conf.: Team's record against conference opponents, shown as part of the standings snapshot in the box score.
  walks: Number of base-on-balls (walks) recorded by the player in the box score.
  wicket_name: Name or label identifying the wicket at which this batting partnership ended.
  wickets: Number of wickets taken by the bowler in this innings.
  won_corners: Total number of corner kicks earned by the team during the match.
  yards_per_kick_return: Average yards gained per kick return by the player in the box score.
  yards_per_pass_attempt: Average passing yards gained per pass attempt by the player in the box score.
  yards_per_punt_return: Average yards gained per punt return by the player in the box score.
  yards_per_reception: Average receiving yards gained per reception by the player in the box score.
  yellow_cards: Total number of yellow cards received by the team during the match.
  ytd_goals: Year-to-date goal total for the player entering or through this game.
