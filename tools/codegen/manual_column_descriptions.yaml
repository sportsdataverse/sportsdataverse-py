cat_goalie_detail:
  player_games_played: Number of games in which the goalie appeared during the relevant tracking period.
  player_goals_against_avg: Goalie's goals-against average — goals allowed per 60 minutes of ice time — for the tracking period.
  player_losses: Number of regulation losses credited to the goalie during the tracking period.
  player_overtime_losses: Number of overtime or shootout losses credited to the goalie during the tracking period.
  player_save_pctg: Goalie's save percentage, expressed as the proportion of shots on goal stopped.
  player_shoots_catches: Side on which the goalie catches — L (left) or R (right).
  player_wins: Number of regulation and overtime wins credited to the goalie during the tracking period.
  seasons_with_edge_stats: JSON-serialized list of NHL season identifiers for which EDGE puck-and-player tracking data is
    available for this goalie.
  shot_location_details: JSON-serialized per-zone shot-location tracking breakdown showing where shots were attempted against
    the goalie.
  shot_location_summary: JSON-serialized summary of shot-location tracking data aggregated across all zones for the goalie.
  stats_games_above900_league_avg: League-average games-above-.900-save-percentage rate used as the baseline for this goalie's
    percentile calculation.
  stats_games_above900_percentile: Percentile rank among all NHL goalies for games played in which the goalie posted a save
    percentage above .900.
  stats_games_above900_value: Number of games the goalie posted a save percentage above .900 during the tracking period.
  stats_goal_differential_per60_league_avg: League-average goals-saved-above-expected per 60 minutes used as the baseline
    for this goalie's percentile.
  stats_goal_differential_per60_percentile: Percentile rank among all NHL goalies for goals-saved-above-expected per 60 minutes
    of ice time.
  stats_goal_differential_per60_value: Goalie's goals-saved-above-expected per 60 minutes, measuring performance relative
    to shot quality faced.
  stats_goal_support_avg_league_avg: League-average goal support (goals scored for the goalie per game) used as the baseline
    for percentile calculation.
  stats_goal_support_avg_percentile: Percentile rank among all NHL goalies for average offensive goal support received per
    game started.
  stats_goal_support_avg_value: Average number of goals scored for the goalie per game started during the tracking period.
  stats_goals_against_avg_league_avg: League-average goals-against average used as the baseline for this goalie's GAA percentile
    calculation.
  stats_goals_against_avg_percentile: Percentile rank among all NHL goalies for goals-against average (lower GAA = higher
    percentile).
  stats_goals_against_avg_value: Goalie's goals-against average for the tracking period.
  stats_point_pctg_league_avg: League-average team point percentage in games the goalie started, used as the baseline for
    percentile calculation.
  stats_point_pctg_percentile: Percentile rank among all NHL goalies for team point percentage in games the goalie started.
  stats_point_pctg_value: Fraction of available standings points the goalie's team earned in games the goalie started.
cat_skater_detail:
