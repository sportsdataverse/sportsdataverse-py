  fg_missed_40_49: Number of field goal attempts missed from 40–49 yards.
  fg_missed_50_59: Number of field goal attempts missed from 50–59 yards.
  fg_missed_60_: Number of field goal attempts missed from 60 yards or longer.
  fg_missed_distance: Total cumulative distance in yards of all missed field goal attempts by the team.
  fg_missed_list: Comma-separated list of distances (in yards) for each missed field goal attempt by the team.
