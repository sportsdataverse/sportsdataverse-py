# Hand-curated return-table column descriptions consumed at render time by
# tools/codegen/generate.py:_table_cell_desc. Keyed by the schema YAML's
# `schema:` field; `_global` is the table-agnostic fallback. NEVER edit
# descriptions into schemas/**.yaml — those are overwritten blank on capture.
# See docs/superpowers/specs/2026-06-17-sdv-py-returns-table-descriptions-design.md
_global: {}

# ESPN scoreboard (shared schema key; entries cover the soccer/cricket scoreboard
# columns, which differ from the generic basketball/football scoreboard shape).
scoreboard:
  event_id: "ESPN event id for the match."
  date: "Match start timestamp (ISO 8601, UTC)."
  name: "Full event name (e.g. 'Team A at Team B')."
  short_name: "Abbreviated event name (e.g. 'TA @ TB')."
  home_team: "Home team display name."
  home_team_id: "Home team ESPN id."
  home_score: "Home team's score. For cricket, the innings string (e.g. '161/5 (18/20 ov, target 156)')."
  away_team: "Away team display name."
  away_team_id: "Away team ESPN id."
  away_score: "Away team's score. For cricket, the innings string."
  status: "Status type name (e.g. STATUS_FINAL, STATUS_SCHEDULED, STATUS_IN_PROGRESS)."
  status_detail: "Human-readable status detail (e.g. 'Final', the over/innings summary)."
  venue: "Venue full name."
  neutral_site: "Whether the match is played at a neutral venue."

# ESPN standings (shared schema key; covers the soccer table and cricket points-table columns).
standings:
  group: "Conference/group/table the row belongs to, flattened from the standings children hierarchy."
  team: "Team display name."
  team_id: "Team ESPN id."
  team_abbreviation: "Team abbreviation."
  rank: "Position within the group/table."
  note: "Standings note (e.g. qualification/relegation marker)."
  games_played: "Matches played."
  wins: "Matches won."
  losses: "Matches lost."
  ties: "Matches drawn."
  points: "Competition points."
  points_for: "Goals scored."
  points_against: "Goals conceded."
  point_differential: "Goal difference (for minus against)."
  ppg: "Points per game."
  rank_change: "Change in rank versus the previous update."
  advanced: "Whether the team has advanced/qualified."
  deductions: "Points deducted."
  overall: "Overall record summary as published by ESPN."
  matches_played: "Matches played (cricket)."
  matches_won: "Matches won (cricket)."
  matches_lost: "Matches lost (cricket)."
  noresult: "Matches with no result (cricket)."
  match_points: "Competition points (cricket)."
  netrr: "Net run rate (cricket)."
  qualified: "Qualification flag (cricket)."
  for: "Runs/goals for."
  against: "Runs/goals against."
  total: "Aggregate/summary value as published by ESPN."

# ESPN teams (shared schema key; covers the soccer teams-list columns).
teams:
  team_id: "Team ESPN id."
  display_name: "Team display name."
  abbreviation: "Team abbreviation."
  location: "Team location/city."
  name: "Team short name."
  short_display_name: "Short team display name."
  nickname: "Team nickname."
  slug: "URL slug for the team."
  uid: "ESPN universal id for the team."
  color: "Primary team color (hex)."
  alternate_color: "Secondary team color (hex)."
  is_active: "Whether the team is currently active."
  is_all_star: "Whether the team is an all-star side."

# ESPN team_roster (shared schema key; covers the soccer roster columns).
team_roster:
  athlete_id: "Athlete ESPN id."
  uid: "ESPN universal id for the athlete."
  first_name: "Athlete first name."
  last_name: "Athlete last name."
  display_name: "Athlete display name."
  short_name: "Athlete short name."
  jersey: "Jersey number."
  age: "Athlete age in years."
  date_of_birth: "Athlete date of birth (ISO 8601)."
  height: "Athlete height in inches."
  display_height: "Athlete height, formatted for display."
  weight: "Athlete weight in pounds."
  display_weight: "Athlete weight, formatted for display."
  position: "Position abbreviation."
  position_name: "Full position name."
  birth_city: "Athlete birth city."
  birth_country: "Athlete birth country."
  citizenship: "Athlete citizenship."
  gender: "Athlete gender."
  slug: "URL slug for the athlete."
  status: "Roster status (e.g. Active)."

# ESPN league/team/player news (shared schema key).
news:
  id: "Article id."
  now_id: "ESPN 'now' feed id."
  content_key: "Internal content key."
  data_source_identifier: "Source-system identifier."
  type: "Article type (Story, Media, HeadlineNews, etc.)."
  headline: "Article headline."
  description: "Article summary/description."
  last_modified: "Last-modified timestamp (ISO 8601)."
  published: "Publish timestamp (ISO 8601)."
  images: "Article images (list, stringified)."
  categories: "Article categories (list, stringified)."
  premium: "Whether the article is premium/paywalled."
  byline: "Author byline."
  links_web_href: "Web article URL."
  links_mobile_href: "Mobile article URL."
  links_api_self_href: "API self link."
  links_app_sportscenter_href: "SportsCenter app deep link."

# ESPN injuries (shared schema key).
injuries:
  id: "Athlete id."
  display_name: "Athlete display name."
  injuries: "Injury entries for the athlete (list of dicts, stringified): status, type, details, dates."

# ESPN team schedule (shared schema key).
team_schedule:
  id: "ESPN event id."
  date: "Event timestamp (ISO 8601, UTC)."
  name: "Full event name."
  short_name: "Abbreviated event name."
  time_valid: "Whether the event time is confirmed."
  competitions: "Competition detail (list of dicts, stringified): competitors, venue, status."
  links: "Related links (list, stringified)."
  season_year: "Four-digit season year."
  season_display_name: "Season display name."
  season_type_id: "Season type id."
  season_type_type: "Season type numeric code."
  season_type_name: "Season type name (e.g. Regular Season)."
  season_type_abbreviation: "Season type abbreviation."
