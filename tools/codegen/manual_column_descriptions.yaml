nfl_ngs_statboard:
  avgAirDistance: Average air distance in yards on all pass attempts, measuring how far the ball travels through the air regardless
    of direction.
  avgAirYardsDifferential: Average difference between intended air yards and completed air yards, measuring accuracy relative
    to target depth.
  avgAirYardsToSticks: Average air yards relative to the first-down marker on pass attempts, where positive values indicate
    throws beyond the sticks.
  avgCompletedAirYards: Average air yards on completed passes only, measuring depth of actual completions.
  avgIntendedAirYards: Average depth of target on all pass attempts, regardless of completion.
  avgTimeToThrow: Average time in seconds from snap to release for the passer, as tracked by NFL Next Gen Stats.
  completionPercentage: Actual completion percentage for the passer during the period covered.
  completionPercentageAboveExpectation: Completion percentage above the model-expected completion rate (CPAE), measuring accuracy
    relative to difficulty of throws attempted.
  expectedCompletionPercentage: Model-expected completion percentage based on factors such as target depth, separation, and
    defensive coverage as calculated by NFL Next Gen Stats.
  gamesPlayed: Number of games played by the passer during the period covered.
  maxAirDistance: Maximum air distance in yards recorded on any single pass attempt during the period covered.
  maxCompletedAirDistance: Maximum air distance in yards recorded on any single completed pass during the period covered.
  passTouchdowns: Total passing touchdowns thrown by the passer during the period covered.
  passYards: Total passing yards accumulated by the passer during the period covered.
  passerRating: NFL passer rating (0–158.3 scale) for the passer during the period covered.
  playerName: Display name of the passer as returned at the top-level statboard row.
  player_currentTeamId: NFL Next Gen Stats team identifier for the team the player is currently rostered on.
  player_displayName: Full display name of the player as used in NFL Next Gen Stats records.
  player_esbId: ESPN-Elias Sports Bureau (ESB) identifier for the player.
  player_firstName: First name of the player.
  player_footballName: Football name used by the player, which may differ from the legal first name.
  player_gsisId: NFL GSIS (Game Statistics and Information System) identifier, the primary nflverse player key.
  player_gsisItId: NFL GSIS internal tracking integer identifier for the player.
  player_jerseyNumber: Jersey number worn by the player.
  player_lastName: Last name of the player.
  player_ngsPosition: Player's position as classified by the NFL Next Gen Stats system.
  player_ngsPositionGroup: Broader position group the player belongs to as classified by the NFL Next Gen Stats system.
  player_positionGroup: Broad position group for the player (e.g., 'QB', 'WR') in the NGS player record.
  player_season: NFL season year associated with this player's statboard record.
  player_shortName: Shortened display name for the player (e.g., 'P.Mahomes').
  player_smartId: NFL Next Gen Stats smart (UUID-style) identifier for the player.
  player_status: Current roster status of the player (e.g., 'ACT' for active, 'IR' for injured reserve).
  player_uniformNumber: Uniform number worn by the player, stored as a string to preserve leading zeros if applicable.
  seasonType: Season segment covered by this statboard record (e.g., 'REG' for regular season, 'POST' for playoffs).
  teamId: NFL Next Gen Stats team identifier for the passer's team at the time of this record.
nfl_ngs_statboard_leaders:
  avgAirDistance: Average air distance (in yards) the ball traveled on all pass attempts, from NFL Next Gen Stats.
  avgAirYardsDifferential: Average difference between intended air yards and completed air yards per attempt, indicating whether
    the passer throws short or long relative to the targeted depth.
  avgAirYardsToSticks: Average air yards relative to the first-down marker on pass attempts, from NFL Next Gen Stats (negative
    = short of sticks, positive = past sticks).
  avgCompletedAirYards: Average air yards on completed passes only, from NFL Next Gen Stats.
  avgCushion: Average distance (in yards) between the receiver and the nearest defender at the snap, from NFL Next Gen Stats
    receiver tracking.
  avgExpectedYAC: Average yards after catch expected based on game situation and receiver location, from NFL Next Gen Stats
    models.
  avgIntendedAirYards: Average intended air yards per pass attempt (including incompletions), from NFL Next Gen Stats.
  avgSeparation: Average separation (in yards) between the receiver and the nearest defender at the moment of catch or incompletion,
    from NFL Next Gen Stats.
  avgTimeToLos: Average time (in seconds) for the ball carrier to reach the line of scrimmage on rush attempts, from NFL Next
    Gen Stats.
  avgTimeToThrow: Average time in seconds from snap to throw for the passer, from NFL Next Gen Stats.
  avgYAC: Average yards after catch per reception, from NFL Next Gen Stats receiver tracking.
  avgYACAboveExpectation: Average yards after catch above statistical expectation (YAC - expected YAC), from NFL Next Gen
    Stats models.
  catchPercentage: Percentage of targets caught by the receiver, from NFL Next Gen Stats statboard leaders.
  completionPercentage: Percentage of pass attempts completed by the passer, from NFL Next Gen Stats statboard leaders.
  completionPercentageAboveExpectation: Passer's actual completion percentage minus their expected completion percentage based
    on target depth, coverage, and game context (CPOE), from NFL Next Gen Stats.
  expectedCompletionPercentage: Model-predicted completion percentage for the passer based on depth of target, receiver separation,
    and coverage, from NFL Next Gen Stats.
  expectedRushYards: Model-predicted rushing yards based on field position, personnel, and pre-snap alignment, from NFL Next
    Gen Stats.
  gamesPlayed: Number of games played by the player in the given season or time period.
  leader_esbId: ESB (NFL's Enterprise Subscriber Base) identifier for the player featured in the leader record.
