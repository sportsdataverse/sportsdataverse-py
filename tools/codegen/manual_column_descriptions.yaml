  gwfg_blocked: Number of game-winning field goal attempts that were blocked by the opposing defense.
  gwfg_distance: Distance in yards of the game-winning field goal attempt (or attempts) during the period.
  gwfg_made: Number of successful game-winning field goals made to secure a victory in the final moments.
  gwfg_missed: Number of game-winning field goal attempts that were missed (no good) in the final moments.
