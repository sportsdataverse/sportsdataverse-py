  matchup_fgm: Shooting metric for matchup fgm in the requested NBA or WNBA Stats split.
  matchup_fta: NBA or WNBA Stats value for matchup fta in the matchupsrollup result set.
  matchup_ftm: NBA or WNBA Stats value for matchup ftm in the matchupsrollup result set.
  matchup_min: NBA or WNBA Stats value for matchup minutes in the matchupsrollup result set.
  matchup_tov: Turnover or loose-ball metric for matchup turnovers in the requested NBA or WNBA Stats split.
  partial_poss: Estimated partial possessions credited to the stint or rotation interval.
  percent_of_time: Time value for percent of time in the NBA or WNBA Stats result set.
  player_pts: Scoring or score-margin metric for player points in the requested NBA or WNBA Stats split.
  sfl: NBA or WNBA Stats value for sfl in the matchupsrollup result set.
  team_pts: Scoring or score-margin metric for team points in the requested NBA or WNBA Stats split.
news:
