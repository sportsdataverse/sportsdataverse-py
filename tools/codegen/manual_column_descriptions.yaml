  avg_air_distance: Average air distance in yards on all pass attempts, measuring how far the ball travels through the air
    regardless of direction. Passing only.
  avg_air_yards_differential: Average difference between intended air yards and completed air yards, measuring accuracy relative
    to target depth. Passing only.
