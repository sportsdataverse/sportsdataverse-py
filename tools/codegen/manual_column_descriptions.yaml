playoff_series:
  bottom_seed_team_abbrev: Three-letter abbreviation of the lower-seeded team in this NHL playoff series (e.g., 'BOS').
  bottom_seed_team_id: Unique NHL api-web identifier for the lower-seeded team in this playoff series.
  game_outcome_ot_periods: Number of overtime periods played in the game that concluded this series or scheduled game, where applicable.
  series_letter: Single-letter label identifying this series within its playoff round (e.g., 'A', 'B'), as used by the NHL api-web.
  series_status_bottom_seed_wins: Number of wins accumulated by the lower-seeded team in this NHL playoff series to date.
  series_status_top_seed_wins: Number of wins accumulated by the higher-seeded team in this NHL playoff series to date.
  top_seed_team_abbrev: Three-letter abbreviation of the higher-seeded team in this NHL playoff series (e.g., 'TOR').
  top_seed_team_id: Unique NHL api-web identifier for the higher-seeded team in this playoff series.
schedule:
  schedule_date: Calendar date of the game in YYYY-MM-DD format as returned by the NHL api-web schedule endpoint.
  series_status_bottom_seed_team_abbrev: Three-letter team abbreviation for the lower-seeded team in the playoff series associated with this scheduled game.
  series_status_bottom_seed_wins: Number of wins accumulated by the lower-seeded team in the playoff series as of this scheduled game from the NHL api-web schedule endpoint.
  series_status_game_number_of_series: Sequential game number within the playoff series for this scheduled game (e.g., 1 through 7 for a best-of-seven) from the NHL api-web schedule endpoint.
  series_status_needed_to_win: Number of additional wins needed by the series leader to clinch and advance at the time of this scheduled game from the NHL api-web schedule endpoint.
  series_status_round: Playoff round number (1 through 4) for the series containing this scheduled game from the NHL api-web schedule endpoint.
  series_status_series_abbrev: Short abbreviation identifying the specific playoff series slot within the bracket for this scheduled game from the NHL api-web schedule endpoint.
  series_status_series_letter: Single-letter label assigned to the playoff series in the bracket structure for this scheduled game from the NHL api-web schedule endpoint.
  series_status_series_title: Human-readable display title for the playoff series containing this scheduled game (e.g., 'Eastern Conference Second Round').
  series_status_top_seed_team_abbrev: Three-letter team abbreviation for the higher-seeded team in the playoff series associated with this scheduled game.
  series_status_top_seed_wins: Number of wins accumulated by the higher-seeded team in the playoff series as of this scheduled game from the NHL api-web schedule endpoint.
  series_url: NHL api-web URL path to the dedicated page for the playoff series associated with this scheduled game.
schedule_postseason:
  schedule_date: The calendar date grouping postseason games in this response row, as returned by the MLB Stats API schedule endpoint.
schedule_tied:
  schedule_date: The calendar date grouping tied (suspended and resumed) games in this response row, as returned by the MLB Stats API schedule endpoint.
score:
  away_team_name_default: Default-language full team name for the away team in this game, as provided by the NHL api-web scoreboard endpoint.
  clock_in_intermission: Boolean flag indicating whether the game clock is paused during an intermission at the time the NHL api-web score payload was captured.
  clock_running: Boolean flag indicating whether the game clock is actively running at the time the NHL api-web score payload was captured.
  clock_seconds_remaining: Integer count of seconds remaining in the current period as reported by the NHL api-web score endpoint.
  clock_time_remaining: Remaining time in the current period in MM:SS format, as provided by the NHL api-web score endpoint.
  home_team_name_default: Default-language full team name for the home team in this game, as provided by the NHL api-web scoreboard endpoint.
  series_status_bottom_seed_team_abbrev: Three-letter abbreviation for the lower-seeded team in this playoff series, as reported by the NHL api-web score endpoint.
  series_status_bottom_seed_wins: Number of wins accumulated by the lower-seeded team in the current playoff series as of this game.
  series_status_game_number_of_series: Sequential game number within the playoff series (e.g., 1 through 7 for a best-of-seven round).
  series_status_needed_to_win: Number of additional wins required by the series leader to clinch the playoff round at the time of this game.
  series_status_round: Numeric identifier for the playoff round (e.g., 1 = First Round, 2 = Second Round) in which this game is being played.
  series_status_series_abbrev: Short abbreviation code identifying the specific playoff series matchup, as provided by the NHL api-web score endpoint.
  series_status_series_letter: Single-letter label (e.g., 'A', 'B') assigned to the playoff series by the NHL api-web score endpoint to distinguish simultaneous matchups within a round.
  series_status_series_title: Human-readable title describing the playoff series matchup (e.g., team abbreviations and round name), as returned by the NHL api-web score endpoint.
  series_status_top_seed_team_abbrev: Three-letter abbreviation for the higher-seeded team in this playoff series, as reported by the NHL api-web score endpoint.
  series_status_top_seed_wins: Number of wins accumulated by the higher-seeded team in the current playoff series as of this game.
  series_url: URL path to the NHL api-web series landing page providing full details about this playoff series matchup.
scoreboard:
  away_score: Away team's score. For cricket, the innings string.
  away_team: Away team display name.
  away_team_id: Away team ESPN id.
  date: Match start timestamp (ISO 8601, UTC).
  event_id: ESPN event id for the match.
  home_score: Home team's score. For cricket, the innings string (e.g. '161/5 (18/20 ov, target 156)').
  home_team: Home team display name.
  home_team_id: Home team ESPN id.
  name: Full event name (e.g. 'Team A at Team B').
  neutral_site: Whether the match is played at a neutral venue.
  short_name: Abbreviated event name (e.g. 'TA @ TB').
  status: Status type name (e.g. STATUS_FINAL, STATUS_SCHEDULED, STATUS_IN_PROGRESS).
  status_detail: Human-readable status detail (e.g. 'Final', the over/innings summary).
  venue: Full name of the venue where the match was played.
skater_detail:
  distance_max_game_imperial: Maximum distance skated by the player in their single best game of the season, measured in miles (imperial).
  distance_max_game_league_avg_imperial: League-average maximum single-game distance skated among all qualifying skaters, measured in miles (imperial).
  distance_max_game_league_avg_metric: League-average maximum single-game distance skated among all qualifying skaters, measured in kilometers (metric).
  distance_max_game_metric: Maximum distance skated by the player in their single best game of the season, measured in kilometers (metric).
  distance_max_game_overlay_away_team_abbrev: Three-letter abbreviation for the away team in the game where the player achieved their maximum single-game skating distance.
  distance_max_game_overlay_away_team_score: Away team's final score in the game where the player achieved their maximum single-game skating distance.
  distance_max_game_overlay_game_date: Date (YYYY-MM-DD) of the game where the player achieved their maximum single-game skating distance.
  distance_max_game_overlay_game_outcome_last_period_type: Type of period that ended the game where the player set their maximum single-game skating distance (e.g., 'REG', 'OT', 'SO').
  distance_max_game_overlay_game_outcome_ot_periods: Number of overtime periods played in the game where the player achieved their maximum single-game skating distance.
  distance_max_game_overlay_game_type: Numeric code for the game type (e.g., 2 = regular season, 3 = playoffs) of the max-distance game.
  distance_max_game_overlay_home_team_abbrev: Three-letter abbreviation for the home team in the game where the player achieved their maximum single-game skating distance.
  distance_max_game_overlay_home_team_score: Home team's final score in the game where the player achieved their maximum single-game skating distance.
  distance_max_game_overlay_period_descriptor_max_regulation_periods: Maximum number of regulation periods defined for the game type in which the player set their max-distance performance.
  distance_max_game_overlay_period_descriptor_number: Period number during which the player's max-distance game context is anchored in the NHL EDGE overlay data.
  distance_max_game_overlay_period_descriptor_period_type: Period type label (e.g., 'REG', 'OT') for the period referenced in the max-distance game overlay.
  distance_max_game_overlay_player_first_name_default: Player's first name as stored in the NHL api-web system, included in the overlay context for the max-distance game.
  distance_max_game_overlay_player_last_name_default: Player's last name as stored in the NHL api-web system, included in the overlay context for the max-distance game.
  distance_max_game_percentile: Percentile rank of the player's maximum single-game skating distance relative to all qualifying skaters in the NHL EDGE dataset.
  player_assists: Total regular-season assists recorded by the skater in the current NHL season, as returned in the EDGE skater detail.
  player_games_played: Total number of regular-season games played by the skater in the current NHL season, as returned in the EDGE skater detail.
  player_goals: Total regular-season goals scored by the skater in the current NHL season, as returned in the EDGE skater detail.
  player_shoots_catches: Handedness indicator for the skater showing the side they shoot from ('L' for left, 'R' for right).
  seasons_with_edge_stats: Comma-separated list or serialized array of seasons for which NHL EDGE player-tracking data is available for this skater.
  skating_speed_bursts_over20_league_avg_value: League-average number of skating speed bursts exceeding 20 mph recorded per game among qualifying skaters, for the current season.
  skating_speed_bursts_over20_percentile: Percentile rank of the player's count of skating speed bursts exceeding 20 mph relative to all qualifying skaters in the NHL EDGE dataset.
  skating_speed_bursts_over20_value: Number of distinct skating speed bursts exceeding 20 mph recorded for the player across the season in NHL EDGE tracking data.
  skating_speed_speed_max_imperial: Player's top recorded skating speed for the season measured in miles per hour (imperial), as captured by NHL EDGE player tracking.
  skating_speed_speed_max_league_avg_imperial: League-average top skating speed among qualifying skaters for the season, measured in miles per hour (imperial).
  skating_speed_speed_max_league_avg_metric: League-average top skating speed among qualifying skaters for the season, measured in kilometers per hour (metric).
  skating_speed_speed_max_metric: Player's top recorded skating speed for the season measured in kilometers per hour (metric), as captured by NHL EDGE player tracking.
  skating_speed_speed_max_overlay_away_team_abbrev: Three-letter abbreviation for the away team in the game where the player achieved their top skating speed this season.
  skating_speed_speed_max_overlay_away_team_score: Away team's final score in the game where the player achieved their season-high skating speed.
  skating_speed_speed_max_overlay_game_date: Date (YYYY-MM-DD) of the game in which the player recorded their top skating speed for the season.
  skating_speed_speed_max_overlay_game_outcome_last_period_type: Type of period that ended the game where the player set their top skating speed (e.g., 'REG', 'OT', 'SO').
  skating_speed_speed_max_overlay_game_type: Numeric code for the game type of the game in which the player recorded their top skating speed (e.g., 2 = regular season).
  skating_speed_speed_max_overlay_home_team_abbrev: Three-letter abbreviation for the home team in the game where the player achieved their top skating speed this season.
  skating_speed_speed_max_overlay_home_team_score: Home team's final score in the game where the player achieved their season-high skating speed.
  skating_speed_speed_max_overlay_period_descriptor_max_regulation_periods: Maximum number of regulation periods defined for the game type in which the player set their top skating speed.
  skating_speed_speed_max_overlay_period_descriptor_number: Period number in which the player recorded their top skating speed during the referenced game.
  skating_speed_speed_max_overlay_period_descriptor_period_type: Period type label (e.g., 'REG', 'OT') for the period in which the player hit their top skating speed.
  skating_speed_speed_max_overlay_player_first_name_default: Player's first name as stored in the NHL api-web system, included in the overlay for the top-skating-speed game.
  skating_speed_speed_max_overlay_player_last_name_default: Player's last name as stored in the NHL api-web system, included in the overlay for the top-skating-speed game.
  skating_speed_speed_max_overlay_time_in_period: Time elapsed within the period (MM:SS) when the player recorded their top skating speed for the season.
  skating_speed_speed_max_percentile: Percentile rank of the player's top skating speed relative to all qualifying skaters in the NHL EDGE dataset.
  sog_details: Serialized detail breakdown of shots on goal by game or other sub-category, as returned in the NHL EDGE skater detail payload.
  sog_summary: Serialized summary-level shots-on-goal statistics for the skater, as returned in the NHL EDGE skater detail payload.
  top_shot_speed_imperial: Player's highest recorded shot speed for the season measured in miles per hour (imperial), as captured by NHL EDGE puck-tracking.
  top_shot_speed_league_avg_imperial: League-average top shot speed among qualifying skaters for the season, measured in miles per hour (imperial).
  top_shot_speed_league_avg_metric: League-average top shot speed among qualifying skaters for the season, measured in kilometers per hour (metric).
  top_shot_speed_metric: Player's highest recorded shot speed for the season measured in kilometers per hour (metric), as captured by NHL EDGE puck-tracking.
  top_shot_speed_overlay_away_team_abbrev: Three-letter abbreviation for the away team in the game where the player recorded their top shot speed this season.
  top_shot_speed_overlay_away_team_score: Away team's final score in the game where the player recorded their season-high shot speed.
  top_shot_speed_overlay_game_date: Date (YYYY-MM-DD) of the game in which the player recorded their top shot speed for the season.
  top_shot_speed_overlay_game_outcome_last_period_type: Type of period that ended the game where the player set their top shot speed (e.g., 'REG', 'OT', 'SO').
  top_shot_speed_overlay_game_type: Numeric code for the game type of the game in which the player recorded their top shot speed (e.g., 2 = regular season).
  top_shot_speed_overlay_home_team_abbrev: Three-letter abbreviation for the home team in the game where the player achieved their top shot speed this season.
  top_shot_speed_overlay_home_team_score: Home team's final score in the game where the player recorded their season-high shot speed.
  top_shot_speed_overlay_period_descriptor_max_regulation_periods: Maximum number of regulation periods defined for the game type in which the player recorded their top shot speed.
  top_shot_speed_overlay_period_descriptor_number: Period number in which the player recorded their top shot speed during the referenced game.
  top_shot_speed_overlay_period_descriptor_period_type: Period type label (e.g., 'REG', 'OT') for the period in which the player hit their top shot speed.
  top_shot_speed_overlay_player_first_name_default: Player's first name as stored in the NHL api-web system, included in the overlay for the top-shot-speed game.
  top_shot_speed_overlay_player_last_name_default: Player's last name as stored in the NHL api-web system, included in the overlay for the top-shot-speed game.
  top_shot_speed_overlay_time_in_period: Time elapsed within the period (MM:SS) when the player released their top-speed shot for the season.
  top_shot_speed_percentile: Percentile rank of the player's top shot speed relative to all qualifying skaters in the NHL EDGE dataset.
  total_distance_skated_imperial: Total cumulative distance skated by the player across all tracked games in the season, measured in miles (imperial).
  total_distance_skated_league_avg_imperial: League-average total season skating distance among qualifying skaters, measured in miles (imperial).
  total_distance_skated_league_avg_metric: League-average total season skating distance among qualifying skaters, measured in kilometers (metric).
  total_distance_skated_metric: Total cumulative distance skated by the player across all tracked games in the season, measured in kilometers (metric).
  total_distance_skated_percentile: Percentile rank of the player's total season skating distance relative to all qualifying skaters in the NHL EDGE dataset.
  zone_time_details_defensive_zone_league_avg: League-average percentage of ice time spent in the defensive zone among qualifying skaters, used as a comparison baseline.
  zone_time_details_defensive_zone_pctg: Percentage of the player's total tracked ice time spent in the defensive zone, as measured by NHL EDGE zone-time tracking.
  zone_time_details_defensive_zone_percentile: Percentile rank of the player's defensive zone time percentage relative to all qualifying skaters in the NHL EDGE dataset.
  zone_time_details_neutral_zone_league_avg: League-average percentage of ice time spent in the neutral zone among qualifying skaters, used as a comparison baseline.
  zone_time_details_neutral_zone_pctg: Percentage of the player's total tracked ice time spent in the neutral zone, as measured by NHL EDGE zone-time tracking.
  zone_time_details_neutral_zone_percentile: Percentile rank of the player's neutral zone time percentage relative to all qualifying skaters in the NHL EDGE dataset.
  zone_time_details_offensive_zone_ev_league_avg: League-average percentage of even-strength ice time spent in the offensive zone among qualifying skaters, used as a comparison baseline.
  zone_time_details_offensive_zone_ev_pctg: Percentage of the player's even-strength ice time spent in the offensive zone, as measured by NHL EDGE zone-time tracking.
  zone_time_details_offensive_zone_ev_percentile: Percentile rank of the player's even-strength offensive zone time percentage relative to all qualifying skaters in the NHL EDGE dataset.
  zone_time_details_offensive_zone_league_avg: League-average percentage of all-situation ice time spent in the offensive zone among qualifying skaters, used as a comparison baseline.
  zone_time_details_offensive_zone_pctg: Percentage of the player's total tracked ice time spent in the offensive zone across all situations, as measured by NHL EDGE zone-time tracking.
  zone_time_details_offensive_zone_percentile: Percentile rank of the player's overall offensive zone time percentage relative to all qualifying skaters in the NHL EDGE dataset.
skater_shot_speed_detail:
  hardest_shots: Serialized list or JSON array of the player's hardest individual shot efforts, including speed and context metadata from NHL EDGE puck tracking.
  shot_speed_details_avg_shot_speed_imperial: Player's average shot speed across all tracked shot attempts for the season, measured in miles per hour (imperial).
  shot_speed_details_avg_shot_speed_league_avg_imperial: League-average shot speed across all qualifying skaters' tracked attempts for the season, measured in miles per hour (imperial).
  shot_speed_details_avg_shot_speed_league_avg_metric: League-average shot speed across all qualifying skaters' tracked attempts for the season, measured in kilometers per hour (metric).
  shot_speed_details_avg_shot_speed_metric: Player's average shot speed across all tracked shot attempts for the season, measured in kilometers per hour (metric).
  shot_speed_details_avg_shot_speed_percentile: Percentile rank of the player's average shot speed relative to all qualifying skaters in the NHL EDGE shot-speed dataset.
  shot_speed_details_shot_attempts70_to80_league_avg: League-average number of shot attempts falling in the 70–80 mph speed band among qualifying skaters for the season.
  shot_speed_details_shot_attempts70_to80_percentile: Percentile rank of the player's count of shot attempts in the 70–80 mph speed band relative to all qualifying skaters in the NHL EDGE dataset.
  shot_speed_details_shot_attempts70_to80_value: Number of the player's tracked shot attempts for the season with a recorded speed between 70 and 80 mph.
  shot_speed_details_shot_attempts80_to90_league_avg: League-average number of shot attempts falling in the 80–90 mph speed band among qualifying skaters for the season.
  shot_speed_details_shot_attempts80_to90_percentile: Percentile rank of the player's count of shot attempts in the 80–90 mph speed band relative to all qualifying skaters in the NHL EDGE dataset.
  shot_speed_details_shot_attempts80_to90_value: Number of the player's tracked shot attempts for the season with a recorded speed between 80 and 90 mph.
  shot_speed_details_shot_attempts90_to100_league_avg: League-average number of shot attempts falling in the 90–100 mph speed band among qualifying skaters for the season.
  shot_speed_details_shot_attempts90_to100_percentile: Percentile rank of the player's count of shot attempts in the 90–100 mph speed band relative to all qualifying skaters in the NHL EDGE dataset.
  shot_speed_details_shot_attempts90_to100_value: Number of the player's tracked shot attempts for the season with a recorded speed between 90 and 100 mph.
  shot_speed_details_shot_attempts_over100_league_avg: League-average number of shot attempts with a recorded speed above 100 mph among qualifying skaters for the season.
  shot_speed_details_shot_attempts_over100_percentile: Percentile rank of the player's count of shot attempts exceeding 100 mph relative to all qualifying skaters in the NHL EDGE dataset.
  shot_speed_details_shot_attempts_over100_value: Number of the player's tracked shot attempts for the season with a recorded speed exceeding 100 mph.
  shot_speed_details_top_shot_speed_imperial: Player's single highest recorded shot speed for the season measured in miles per hour (imperial), from NHL EDGE puck-tracking.
  shot_speed_details_top_shot_speed_league_avg_imperial: League-average highest shot speed among qualifying skaters for the season, measured in miles per hour (imperial).
  shot_speed_details_top_shot_speed_league_avg_metric: League-average highest shot speed among qualifying skaters for the season, measured in kilometers per hour (metric).
  shot_speed_details_top_shot_speed_metric: Player's single highest recorded shot speed for the season measured in kilometers per hour (metric), from NHL EDGE puck-tracking.
  shot_speed_details_top_shot_speed_overlay_away_team_abbrev: Three-letter abbreviation for the away team in the game where the player recorded their top shot speed this season.
  shot_speed_details_top_shot_speed_overlay_away_team_score: Away team's final score in the game where the player recorded their season-high shot speed.
  shot_speed_details_top_shot_speed_overlay_game_date: Date (YYYY-MM-DD) of the game in which the player recorded their top shot speed for the season.
  shot_speed_details_top_shot_speed_overlay_game_outcome_last_period_type: Type of period that ended the game where the player set their top shot speed (e.g., 'REG', 'OT', 'SO').
  shot_speed_details_top_shot_speed_overlay_game_type: Numeric code for the game type of the game in which the player recorded their top shot speed (e.g., 2 = regular season).
  shot_speed_details_top_shot_speed_overlay_home_team_abbrev: Three-letter abbreviation for the home team in the game where the player achieved their top shot speed this season.
  shot_speed_details_top_shot_speed_overlay_home_team_score: Home team's final score in the game where the player recorded their season-high shot speed.
  shot_speed_details_top_shot_speed_overlay_period_descriptor_max_regulation_periods: Maximum number of regulation periods defined for the game type in which the player recorded their top shot speed.
  shot_speed_details_top_shot_speed_overlay_period_descriptor_number: Period number in which the player released their top-speed shot during the referenced game.
  shot_speed_details_top_shot_speed_overlay_period_descriptor_period_type: Period type label (e.g., 'REG', 'OT') for the period in which the player recorded their top shot speed.
  shot_speed_details_top_shot_speed_overlay_player_first_name_default: Player's first name as stored in the NHL api-web system, included in the overlay for the top-shot-speed event.
  shot_speed_details_top_shot_speed_overlay_player_last_name_default: Player's last name as stored in the NHL api-web system, included in the overlay for the top-shot-speed event.
  shot_speed_details_top_shot_speed_overlay_time_in_period: Time elapsed within the period (MM:SS) when the player released their top-speed shot for the season.
  shot_speed_details_top_shot_speed_percentile: Percentile rank of the player's top shot speed relative to all qualifying skaters in the NHL EDGE shot-speed dataset.
standings:
  advanced: Whether the team has advanced/qualified.
  against: Runs/goals against.
  conference_home_sequence: Team's rank within its conference based solely on home-game results in the NHL api-web standings.
  conference_l10_sequence: Team's rank within its conference based on performance in the last 10 games played, as reported by the NHL api-web standings endpoint.
  conference_road_sequence: Team's rank within its conference based solely on road-game results in the NHL api-web standings.
  deductions: Points deducted.
  division_home_sequence: Team's rank within its division based solely on home-game results in the NHL api-web standings.
  division_l10_sequence: Team's rank within its division based on performance in the last 10 games played, as reported by the NHL api-web standings endpoint.
  division_road_sequence: Team's rank within its division based solely on road-game results in the NHL api-web standings.
  for: Runs/goals for.
  games_played: Matches played.
  goal_against: Total number of goals allowed by the team across all games played in the current standings snapshot.
  goal_differential_pctg: Team's goal differential expressed as a percentage of total goals scored by both teams, used as a secondary tiebreaker in NHL standings.
  goal_for: Total number of goals scored by the team across all games played in the current standings snapshot.
  goals_for_pctg: Team's share of total goals scored in all games involving this team, calculated as goals-for divided by (goals-for + goals-against).
  group: Conference/group/table the row belongs to, flattened from the standings children hierarchy.
  home_games_played: Number of home games the team has completed in the current season as of this standings snapshot.
  home_goal_differential: Net goal differential (goals-for minus goals-against) accumulated across all home games played in the current season.
  home_goals_against: Total number of goals allowed by the team in home games during the current season.
  home_goals_for: Total number of goals scored by the team in home games during the current season.
  home_regulation_plus_ot_wins: Number of home wins achieved in regulation or overtime (excluding shootout decisions) in the current season.
  home_regulation_wins: Number of home wins achieved in regulation time (within 60 minutes) in the current season.
  l10_games_played: Number of games included in the team's last-10-games performance window (typically 10, may be lower early in the season).
  l10_goal_differential: Net goal differential (goals-for minus goals-against) across the team's most recent 10 games.
  l10_goals_against: Total goals allowed by the team across its most recent 10 games.
  l10_goals_for: Total goals scored by the team across its most recent 10 games.
  l10_points: Total standings points earned by the team across its most recent 10 games.
  l10_regulation_plus_ot_wins: Number of wins in regulation or overtime (excluding shootouts) within the team's most recent 10 games.
  l10_regulation_wins: Number of regulation-time wins within the team's most recent 10 games.
  l10_ties: Number of tied results recorded within the team's most recent 10 games (applicable to seasons using tie rules).
  league_home_sequence: Team's rank league-wide based solely on home-game results in the NHL api-web standings.
  league_l10_sequence: Team's rank league-wide based on performance in the last 10 games played, as reported by the NHL api-web standings endpoint.
  league_road_sequence: Team's rank league-wide based solely on road-game results in the NHL api-web standings.
  losses: Number of matches the team has lost.
  match_points: Competition points (cricket).
  matches_lost: Matches lost (cricket).
  matches_played: Matches played (cricket).
  matches_won: Matches won (cricket).
  netrr: Net run rate (cricket).
  noresult: Matches with no result (cricket).
  note: Standings note (e.g. qualification/relegation marker).
  overall: Overall record summary as published by ESPN.
  place_name_default: Default-language city or place name associated with the team's market (e.g., "Toronto"), as returned by the NHL api-web standings endpoint.
  place_name_fr: French-language city or place name associated with the team's market, as returned by the NHL api-web standings endpoint.
  point_differential: Goal difference (for minus against).
  points: Competition points.
  points_against: Goals conceded.
  points_for: Goals (or runs) scored by the team.
  ppg: Points per game.
  qualified: Qualification flag (cricket).
  rank: Position within the group/table.
  rank_change: Change in rank versus the previous update.
  regulation_plus_ot_win_pctg: Fraction of games won in regulation or overtime (excluding shootout decisions), used as a tiebreaker metric in NHL standings.
  regulation_win_pctg: Fraction of games won in regulation time only, used as a secondary tiebreaker in NHL standings.
  road_games_played: Number of road games the team has completed in the current season as of this standings snapshot.
  road_goal_differential: Net goal differential (goals-for minus goals-against) accumulated across all road games played in the current season.
  road_goals_against: Total number of goals allowed by the team in road games during the current season.
  road_goals_for: Total number of goals scored by the team in road games during the current season.
  road_points: Total standings points earned by the team in road games during the current season.
  road_regulation_plus_ot_wins: Number of road wins achieved in regulation or overtime (excluding shootout decisions) in the current season.
  road_regulation_wins: Number of road wins achieved in regulation time (within 60 minutes) in the current season.
  team: Display name of the team in this standings row.
  team_abbrev_default: Default three-letter abbreviation for the team (e.g., "TOR"), as provided by the NHL api-web standings endpoint.
  team_abbreviation: Team abbreviation.
  team_id: ESPN numeric identifier for the team.
  ties: Number of matches the team has drawn.
  total: Aggregate/summary value as published by ESPN.
  waivers_sequence: Team's position in the NHL waiver-claim priority order for the current season, determined by reverse standings order.
  win_pctg: Team's overall win percentage (wins divided by games played), as reported by the NHL api-web standings endpoint.
  wins: Number of matches the team has won.
team_detail:
  distance_skated_total_imperial: Total cumulative skating distance logged by all skaters on this team across the season, expressed in miles (imperial), from NHL EDGE tracking data.
  distance_skated_total_league_avg_imperial: League-average cumulative skating distance for all teams over the same period as this team's totals, expressed in miles (imperial), from NHL EDGE tracking data.
  distance_skated_total_league_avg_metric: League-average cumulative skating distance for all teams over the same period as this team's totals, expressed in kilometers (metric), from NHL EDGE tracking data.
  distance_skated_total_metric: Total cumulative skating distance logged by all skaters on this team across the season, expressed in kilometers (metric), from NHL EDGE tracking data.
  distance_skated_total_rank: Team's league rank by total cumulative skating distance for the season, where rank 1 indicates the team with the most distance skated.
  seasons_with_edge_stats: Comma-separated list of season identifiers for which NHL EDGE player-tracking statistics are available for this team.
  shot_speed_shot_attempts_over90_rank: Team's league rank by number of shot attempts exceeding 90 mph in shot speed, with rank 1 indicating the highest count, from NHL EDGE tracking data.
  shot_speed_shot_attempts_over90_value: Total count of shot attempts recorded at a speed exceeding 90 mph by this team's players during the season, from NHL EDGE tracking data.
  shot_speed_top_shot_speed_imperial: Fastest recorded shot speed by any player on this team during the season, expressed in miles per hour, from NHL EDGE tracking data.
  shot_speed_top_shot_speed_league_avg_imperial: League-average of the top shot speed across all teams for the same period, expressed in miles per hour, from NHL EDGE tracking data.
  shot_speed_top_shot_speed_league_avg_metric: League-average of the top shot speed across all teams for the same period, expressed in kilometers per hour, from NHL EDGE tracking data.
  shot_speed_top_shot_speed_metric: Fastest recorded shot speed by any player on this team during the season, expressed in kilometers per hour, from NHL EDGE tracking data.
  shot_speed_top_shot_speed_overlay_away_team_abbrev: Three-letter abbreviation of the away team in the game where this team's top shot speed was recorded, from the NHL EDGE overlay context.
  shot_speed_top_shot_speed_overlay_away_team_score: Away team's final score in the game where this team's top shot speed was recorded, from the NHL EDGE overlay context.
  shot_speed_top_shot_speed_overlay_game_date: Calendar date of the game in which this team's top shot speed was recorded, from the NHL EDGE overlay context.
  shot_speed_top_shot_speed_overlay_game_outcome_last_period_type: Type of the final period played (e.g., REG, OT, SO) in the game where this team's top shot speed was recorded.
  shot_speed_top_shot_speed_overlay_game_outcome_ot_periods: Number of overtime periods played in the game where this team's top shot speed was recorded, or zero if decided in regulation.
  shot_speed_top_shot_speed_overlay_game_type: Numeric game-type code (e.g., 2 = regular season, 3 = playoffs) for the game in which this team's top shot speed was recorded.
  shot_speed_top_shot_speed_overlay_home_team_abbrev: Three-letter abbreviation of the home team in the game where this team's top shot speed was recorded, from the NHL EDGE overlay context.
  shot_speed_top_shot_speed_overlay_home_team_score: Home team's final score in the game where this team's top shot speed was recorded, from the NHL EDGE overlay context.
  shot_speed_top_shot_speed_overlay_period_descriptor_max_regulation_periods: Maximum number of regulation periods in the game format where this team's top shot speed was recorded (typically 3 for NHL).
  shot_speed_top_shot_speed_overlay_period_descriptor_number: Period number within the game during which this team's top shot speed was recorded, from the NHL EDGE overlay context.
  shot_speed_top_shot_speed_overlay_period_descriptor_period_type: Type label for the period (e.g., REG, OT) during which this team's top shot speed was recorded, from the NHL EDGE overlay context.
  shot_speed_top_shot_speed_overlay_player_first_name_default: Default-language first name of the player who recorded this team's top shot speed, from the NHL EDGE overlay context.
  shot_speed_top_shot_speed_overlay_player_last_name_default: Default-language last name of the player who recorded this team's top shot speed, from the NHL EDGE overlay context.
  shot_speed_top_shot_speed_overlay_time_in_period: Elapsed time within the period (MM:SS format) at which this team's top shot speed was recorded, from the NHL EDGE overlay context.
  shot_speed_top_shot_speed_rank: Team's league rank by top shot speed for the season, where rank 1 indicates the team whose fastest shot was the quickest in the league.
  skating_speed_bursts_over20_league_avg_value: League-average number of skating speed bursts exceeding 20 mph recorded per team over the same season window, from NHL EDGE tracking data.
  skating_speed_bursts_over20_rank: Team's league rank by total count of skating speed bursts exceeding 20 mph, where rank 1 indicates the most such bursts, from NHL EDGE tracking data.
  skating_speed_bursts_over20_value: Total count of skating speed bursts exceeding 20 mph recorded by this team's skaters during the season, from NHL EDGE tracking data.
  skating_speed_bursts_over22_rank: Team's league rank by total count of skating speed bursts exceeding 22 mph, where rank 1 indicates the most elite-speed bursts, from NHL EDGE tracking data.
  skating_speed_bursts_over22_value: Total count of skating speed bursts exceeding 22 mph recorded by this team's skaters during the season, from NHL EDGE tracking data.
  skating_speed_speed_max_imperial: Fastest skating speed reached by any player on this team during the season, expressed in miles per hour, from NHL EDGE tracking data.
  skating_speed_speed_max_league_avg_imperial: League-average of the maximum skating speed across all teams for the same period, expressed in miles per hour, from NHL EDGE tracking data.
  skating_speed_speed_max_league_avg_metric: League-average of the maximum skating speed across all teams for the same period, expressed in kilometers per hour, from NHL EDGE tracking data.
  skating_speed_speed_max_metric: Fastest skating speed reached by any player on this team during the season, expressed in kilometers per hour, from NHL EDGE tracking data.
  skating_speed_speed_max_overlay_away_team_abbrev: Three-letter abbreviation of the away team in the game where this team's top skating speed was recorded, from the NHL EDGE overlay context.
  skating_speed_speed_max_overlay_away_team_score: Away team's final score in the game where this team's top skating speed was recorded, from the NHL EDGE overlay context.
  skating_speed_speed_max_overlay_game_date: Calendar date of the game in which this team's top skating speed was recorded, from the NHL EDGE overlay context.
  skating_speed_speed_max_overlay_game_outcome_last_period_type: Type of the final period played (e.g., REG, OT, SO) in the game where this team's top skating speed was recorded.
  skating_speed_speed_max_overlay_game_type: Numeric game-type code (e.g., 2 = regular season, 3 = playoffs) for the game in which this team's top skating speed was recorded.
  skating_speed_speed_max_overlay_home_team_abbrev: Three-letter abbreviation of the home team in the game where this team's top skating speed was recorded, from the NHL EDGE overlay context.
  skating_speed_speed_max_overlay_home_team_score: Home team's final score in the game where this team's top skating speed was recorded, from the NHL EDGE overlay context.
  skating_speed_speed_max_overlay_period_descriptor_max_regulation_periods: Maximum number of regulation periods in the game format where this team's top skating speed was recorded (typically 3 for NHL).
  skating_speed_speed_max_overlay_period_descriptor_number: Period number within the game during which this team's top skating speed was recorded, from the NHL EDGE overlay context.
  skating_speed_speed_max_overlay_period_descriptor_period_type: Type label for the period (e.g., REG, OT) during which this team's top skating speed was recorded, from the NHL EDGE overlay context.
  skating_speed_speed_max_overlay_player_first_name_default: Default-language first name of the player who recorded this team's top skating speed, from the NHL EDGE overlay context.
  skating_speed_speed_max_overlay_player_last_name_default: Default-language last name of the player who recorded this team's top skating speed, from the NHL EDGE overlay context.
  skating_speed_speed_max_overlay_time_in_period: Elapsed time within the period (MM:SS format) at which this team's top skating speed was recorded, from the NHL EDGE overlay context.
  skating_speed_speed_max_rank: Team's league rank by maximum skating speed for the season, where rank 1 indicates the team whose fastest skater reached the highest speed in the league.
  sog_details: Serialized JSON-like string containing per-period or per-game shots-on-goal detail for this team, flattened from the NHL api-web team detail payload.
  sog_summary: Serialized summary string of total shots-on-goal across all periods for this team, flattened from the NHL api-web team detail payload.
  team_conference: Name of the NHL conference (e.g., Eastern, Western) to which this team belongs, as returned by the NHL api-web team detail endpoint.
  team_division: Name of the NHL division (e.g., Atlantic, Metro, Central, Pacific) to which this team belongs, as returned by the NHL api-web team detail endpoint.
  team_games_played: Total number of regular-season or playoff games this team has played in the current season, from the NHL api-web team detail endpoint.
  team_ot_losses: Total number of games this team has lost in overtime or a shootout (earning one standings point each) in the current season.
  zone_time_details_defensive_zone_league_avg: League-average percentage of time that teams spend in the defensive zone during five-on-five play, from NHL EDGE zone-time tracking data.
  zone_time_details_defensive_zone_pctg: Percentage of five-on-five ice time this team spends in its own defensive zone, as measured by NHL EDGE player-tracking data.
  zone_time_details_defensive_zone_rank: Team's league rank by defensive-zone time percentage, where rank 1 indicates the team that spends the most time in its own zone during five-on-five play.
  zone_time_details_neutral_zone_league_avg: League-average percentage of time that teams spend in the neutral zone during five-on-five play, from NHL EDGE zone-time tracking data.
  zone_time_details_neutral_zone_pctg: Percentage of five-on-five ice time this team spends in the neutral zone, as measured by NHL EDGE player-tracking data.
  zone_time_details_neutral_zone_rank: Team's league rank by neutral-zone time percentage, where rank 1 indicates the team that spends the most time in the neutral zone during five-on-five play.
