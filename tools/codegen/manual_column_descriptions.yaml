teams_stats:
  exemptions: A serialized list of any statistical exemption notes or flags associated with the team's stat splits (e.g., players exempt from qualifying thresholds).
teams_stats_leaders:
  leaders: Serialized representation of the statistical leaders entries for the team stat category returned by the MLB Stats API.
win_probability:
  about_at_bat_index: The sequential index of the at-bat within the game to which this win-probability observation belongs.
  about_captivating_index: A numeric score reflecting how compelling or exciting this plate appearance was, based on leverage and game-state context.
  about_end_time: The ISO 8601 timestamp marking the end of the play event within the win-probability game feed.
  about_half_inning: Indicates whether the win-probability observation occurred in the top or bottom half of the inning.
  about_has_out: Boolean flag indicating whether this play resulted in at least one out being recorded.
  about_has_review: Boolean flag indicating whether this play was subject to a manager's challenge or umpire review.
  about_inning: The inning number in which this win-probability observation was recorded.
  about_is_complete: Boolean flag indicating whether the at-bat associated with this win-probability row has concluded.
  about_is_scoring_play: Boolean flag indicating whether this play resulted in one or more runs being scored.
  about_is_top_inning: Boolean flag indicating whether this win-probability observation occurred in the top half of the inning.
  about_start_time: The ISO 8601 timestamp marking the start of the play event within the win-probability game feed.
  action_index: A serialized list of indices identifying action-type events (stolen bases, pickoffs, etc.) within the at-bat for this win-probability row.
  count_balls: The ball count in the current at-bat at the time this win-probability snapshot was recorded.
  count_outs: The number of outs in the current half-inning at the time this win-probability snapshot was recorded.
  count_strikes: The strike count in the current at-bat at the time this win-probability snapshot was recorded.
  credits: A serialized list of player credit records for this play, linking fielding, pitching, or batting achievements to specific player identifiers.
  drama_index: A numeric score quantifying the dramatic significance of this play within the game, based on win-probability swing and game leverage.
  flags: A serialized representation of situational boolean flags associated with this play (e.g., whether it was a big lead situation or a save opportunity).
  matchup_bat_side_code: A single-character code indicating the batter's handedness for this matchup in the win-probability feed (e.g., 'L', 'R', 'S').
  matchup_bat_side_description: The human-readable description of the batter's hitting side for this win-probability matchup row.
  matchup_batter_full_name: The full name of the batter whose plate appearance generated this win-probability observation.
  matchup_batter_hot_cold_zones: A serialized representation of the batter's hot and cold zone data applicable to this win-probability matchup.
  matchup_batter_id: The MLB Stats API (MLBAM) numeric identifier for the batter in this win-probability matchup row.
  matchup_batter_link: The MLB Stats API relative URL linking to the batter's player resource for this win-probability row.
  matchup_pitch_hand_code: A single-character code indicating the pitcher's throwing hand for this win-probability matchup (e.g., 'L' or 'R').
  matchup_pitch_hand_description: The human-readable description of the pitcher's throwing arm for this win-probability matchup row.
  matchup_pitcher_full_name: The full name of the pitcher who delivered pitches for this win-probability observation.
  matchup_pitcher_hot_cold_zones: A serialized representation of the pitcher's hot and cold zone data applicable to this win-probability matchup.
  matchup_pitcher_id: The MLB Stats API (MLBAM) numeric identifier for the pitcher in this win-probability matchup row.
  matchup_pitcher_link: The MLB Stats API relative URL linking to the pitcher's player resource for this win-probability row.
  matchup_post_on_first_full_name: The full name of the runner occupying first base at the conclusion of the play in this win-probability row.
  matchup_post_on_first_id: The MLB Stats API (MLBAM) numeric identifier for the runner on first base after the play in this win-probability row.
  matchup_post_on_first_link: The MLB Stats API relative URL linking to the player resource of the runner on first base after the play.
  matchup_post_on_second_full_name: The full name of the runner occupying second base at the conclusion of the play in this win-probability row.
  matchup_post_on_second_id: The MLB Stats API (MLBAM) numeric identifier for the runner on second base after the play in this win-probability row.
  matchup_post_on_second_link: The MLB Stats API relative URL linking to the player resource of the runner on second base after the play.
  matchup_post_on_third_full_name: The full name of the runner occupying third base at the conclusion of the play in this win-probability row.
  matchup_post_on_third_id: The MLB Stats API (MLBAM) numeric identifier for the runner on third base after the play in this win-probability row.
  matchup_post_on_third_link: The MLB Stats API relative URL linking to the player resource of the runner on third base after the play.
  matchup_splits_batter: A string describing the batter's situational split for this win-probability matchup (e.g., 'vs. Right').
  matchup_splits_men_on_base: A string describing the baserunner configuration applicable to the batter's situational split in this win-probability row.
  matchup_splits_pitcher: A string describing the pitcher's situational split for this win-probability matchup (e.g., 'vs. Left').
  pitch_index: A serialized list of indices identifying individual pitch events within the at-bat for this win-probability row.
  play_end_time: The ISO 8601 timestamp marking the conclusion of the play associated with this win-probability snapshot.
  play_events: A serialized representation of the sequence of pitch and action events comprising the at-bat for this win-probability row.
  result_away_score: The away team's cumulative run total at the conclusion of the play in this win-probability row.
  result_description: A human-readable text description of the play result as reported in the win-probability game feed.
  result_event: The short categorical label for the play outcome in the win-probability feed (e.g., 'Single', 'Home Run', 'Strikeout').
  result_event_type: The snake-cased type identifier for the play outcome in the win-probability feed (e.g., 'single', 'home_run').
  result_home_score: The home team's cumulative run total at the conclusion of the play in this win-probability row.
  result_is_out: Boolean flag indicating whether the batter was retired on the play recorded in this win-probability row.
  result_rbi: The number of runs batted in credited to the batter for the play in this win-probability row.
  result_type: The high-level category of the play result in the win-probability feed (e.g., 'atBat', 'action').
  review_details_challenge_team_id: The MLB Stats API numeric identifier for the team that initiated a replay challenge on this win-probability play.
  review_details_in_progress: Boolean flag indicating whether a replay review of this play was still underway at the time of data capture.
  review_details_is_overturned: Boolean flag indicating whether the original on-field ruling was reversed following the replay review for this play.
  review_details_review_type: The type of review mechanism applied to this play in the win-probability feed (e.g., 'managerChallenge', 'umpireReview').
  runner_index: A serialized list of indices identifying baserunner movement events during the play in this win-probability row.
  runners: A serialized representation of baserunner movement records for this play in the win-probability feed, capturing start/end base positions and event types.
