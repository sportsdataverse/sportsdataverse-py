# Hand-curated return-table column descriptions consumed at render time by
# tools/codegen/generate.py:_table_cell_desc. Keyed by the schema YAML's
# `schema:` field; `_global` is the table-agnostic fallback. NEVER edit
# descriptions into schemas/**.yaml — those are overwritten blank on capture.
# See docs/superpowers/specs/2026-06-17-sdv-py-returns-table-descriptions-design.md

_global: {}
boxscore:
  all_positions: All fielding positions played by the player during the game, as a list of position codes.
  game_status_is_current_batter: Indicates whether the player is currently at bat at the moment the boxscore was captured.
  game_status_is_current_pitcher: Indicates whether the player is currently pitching at the moment the boxscore was captured.
  game_status_is_on_bench: Indicates whether the player is currently on the bench (not in the active lineup) at time of capture.
  game_status_is_substitute: Indicates whether the player entered the game as a substitute for another player.
  parent_team_id: MLB Stats API identifier for the player's parent (MLB-level) organization, useful for tracking players on optional assignment.
  season_stats_batting_air_outs: Season-to-date number of outs recorded by the batter on balls hit in the air (fly balls and line drives caught).
  season_stats_batting_at_bats: Season-to-date number of official at-bats accumulated by the batter.
  season_stats_batting_at_bats_per_home_run: Season-to-date ratio of at-bats per home run, reflecting the batter's home run frequency.
  season_stats_batting_avg: Season-to-date batting average (hits divided by at-bats) for the batter.
  season_stats_batting_babip: Season-to-date Batting Average on Balls In Play (BABIP), measuring batting average excluding strikeouts and home runs.
  season_stats_batting_base_on_balls: Season-to-date total walks (bases on balls) drawn by the batter, including intentional walks.
  season_stats_batting_catchers_interference: Season-to-date number of times the batter reached base due to catcher's interference.
  season_stats_batting_caught_stealing: Season-to-date number of times the batter was caught stealing a base.
  season_stats_batting_caught_stealing_percentage: Season-to-date percentage of stolen base attempts that resulted in the batter being caught stealing.
  season_stats_batting_doubles: Season-to-date number of doubles hit by the batter.
  season_stats_batting_fly_outs: Season-to-date number of outs recorded by the batter on fly balls caught in the outfield.
  season_stats_batting_games_played: Season-to-date number of games in which the batter appeared.
  season_stats_batting_ground_into_double_play: Season-to-date number of times the batter grounded into a double play.
  season_stats_batting_ground_into_triple_play: Season-to-date number of times the batter grounded into a triple play.
  season_stats_batting_ground_outs: Season-to-date number of outs recorded by the batter on ground balls.
  season_stats_batting_ground_outs_to_airouts: Season-to-date ratio of ground outs to air outs, indicating the batter's tendency to hit the ball on the ground versus in the air.
  season_stats_batting_hit_by_pitch: Season-to-date number of times the batter was hit by a pitch.
  season_stats_batting_hits: Season-to-date total number of hits recorded by the batter.
  season_stats_batting_home_runs: Season-to-date number of home runs hit by the batter.
  season_stats_batting_intentional_walks: Season-to-date number of intentional walks (IBB) issued to the batter.
  season_stats_batting_left_on_base: Season-to-date number of runners left on base when the batter made an out or the inning ended.
  season_stats_batting_line_outs: Season-to-date number of outs recorded by the batter on line drives caught.
  season_stats_batting_obp: Season-to-date on-base percentage (OBP), measuring how often the batter reaches base per plate appearance.
  season_stats_batting_ops: Season-to-date on-base plus slugging percentage (OPS), a combined measure of a batter's ability to get on base and hit for power.
  season_stats_batting_pickoffs: Season-to-date number of times the batter was picked off base by a pitcher or catcher.
  season_stats_batting_plate_appearances: Season-to-date total number of plate appearances for the batter, including at-bats, walks, HBP, and sacrifices.
  season_stats_batting_pop_outs: Season-to-date number of outs recorded by the batter on pop-ups caught in the infield.
  season_stats_batting_rbi: Season-to-date number of runs batted in (RBI) credited to the batter.
  season_stats_batting_runs: Season-to-date number of runs scored by the batter.
  season_stats_batting_sac_bunts: Season-to-date number of sacrifice bunts executed by the batter.
  season_stats_batting_sac_flies: Season-to-date number of sacrifice flies hit by the batter that scored a run.
  season_stats_batting_slg: Season-to-date slugging percentage (SLG), measuring total bases per at-bat.
  season_stats_batting_stolen_base_percentage: Season-to-date percentage of stolen base attempts that were successful for the batter.
  season_stats_batting_stolen_bases: Season-to-date number of bases stolen by the batter.
  season_stats_batting_strike_outs: Season-to-date number of times the batter struck out.
  season_stats_batting_total_bases: Season-to-date total number of bases accumulated by the batter on hits.
  season_stats_batting_triples: Season-to-date number of triples hit by the batter.
  season_stats_fielding_assists: Season-to-date number of fielding assists recorded by the player (touching the ball before a putout by a teammate).
  season_stats_fielding_caught_stealing: Season-to-date number of baserunners caught stealing by the player (typically a catcher stat).
  season_stats_fielding_caught_stealing_percentage: Season-to-date percentage of stolen base attempts that the player (usually a catcher) threw out.
  season_stats_fielding_chances: Season-to-date total fielding chances for the player (putouts + assists + errors).
  season_stats_fielding_errors: Season-to-date number of fielding errors committed by the player.
  season_stats_fielding_fielding: Season-to-date fielding percentage for the player, calculated as (putouts + assists) / total chances.
  season_stats_fielding_games_started: Season-to-date number of games in which the player started at a fielding position.
  season_stats_fielding_passed_ball: Season-to-date number of passed balls charged to the player (catcher-specific).
  season_stats_fielding_pickoffs: Season-to-date number of pickoffs credited to the player as a fielder.
  season_stats_fielding_put_outs: Season-to-date number of putouts recorded by the player (directly retiring a baserunner or batter).
  season_stats_fielding_stolen_base_percentage: Season-to-date percentage of stolen base attempts against the player that were successful (catcher perspective).
  season_stats_fielding_stolen_bases: Season-to-date number of stolen bases allowed by the player while fielding (typically catcher).
  season_stats_pitching_air_outs: Season-to-date number of outs recorded by the pitcher on balls hit in the air.
  season_stats_pitching_at_bats: Season-to-date number of at-bats faced by the pitcher (excluding walks, HBP, and sacrifices).
  season_stats_pitching_balks: Season-to-date number of balks called against the pitcher.
  season_stats_pitching_balls: Season-to-date number of ball calls recorded against the pitcher.
  season_stats_pitching_base_on_balls: Season-to-date total walks (bases on balls) issued by the pitcher, including intentional walks.
  season_stats_pitching_batters_faced: Season-to-date total number of batters faced by the pitcher.
  season_stats_pitching_blown_saves: Season-to-date number of blown save opportunities for the pitcher.
  season_stats_pitching_catchers_interference: Season-to-date number of times the pitcher benefited from a catcher's interference call.
  season_stats_pitching_caught_stealing: Season-to-date number of baserunners caught stealing while the pitcher was on the mound.
  season_stats_pitching_caught_stealing_percentage: Season-to-date percentage of stolen base attempts that were thrown out while the pitcher was pitching.
  season_stats_pitching_complete_games: Season-to-date number of complete games pitched by the pitcher.
  season_stats_pitching_doubles: Season-to-date number of doubles allowed by the pitcher.
  season_stats_pitching_earned_runs: Season-to-date number of earned runs allowed by the pitcher.
  season_stats_pitching_era: Season-to-date Earned Run Average (ERA) for the pitcher, expressed as earned runs per nine innings.
  season_stats_pitching_fly_outs: Season-to-date number of outs recorded by the pitcher on fly balls.
  season_stats_pitching_games_finished: Season-to-date number of games in which the pitcher was the last pitcher used by their team.
  season_stats_pitching_games_pitched: Season-to-date number of games in which the pitcher appeared.
  season_stats_pitching_games_played: Season-to-date number of games the pitcher was active on the roster (may include non-pitching appearances).
  season_stats_pitching_games_started: Season-to-date number of games in which the pitcher was the starting pitcher.
  season_stats_pitching_ground_outs: Season-to-date number of outs recorded by the pitcher on ground balls.
  season_stats_pitching_ground_outs_to_airouts: Season-to-date ratio of ground ball outs to air ball outs allowed by the pitcher.
  season_stats_pitching_hit_batsmen: Season-to-date number of batters hit by a pitch thrown by the pitcher.
  season_stats_pitching_hit_by_pitch: Season-to-date number of hit-by-pitch events while the pitcher was pitching (alternate field name for hit_batsmen).
  season_stats_pitching_hits: Season-to-date number of hits allowed by the pitcher.
  season_stats_pitching_hits_per9_inn: Season-to-date hits allowed per nine innings pitched, a rate stat measuring hit prevention.
  season_stats_pitching_holds: Season-to-date number of holds recorded by the pitcher (relief appearance maintaining a lead without a save situation).
  season_stats_pitching_home_runs: Season-to-date number of home runs allowed by the pitcher.
  season_stats_pitching_home_runs_per9: Season-to-date home runs allowed per nine innings pitched.
  season_stats_pitching_inherited_runners: Season-to-date number of baserunners already on base when the pitcher entered the game.
  season_stats_pitching_inherited_runners_scored: Season-to-date number of inherited runners who eventually scored while or after the pitcher was pitching.
  season_stats_pitching_innings_pitched: Season-to-date total innings pitched, expressed as a decimal where each out is one-third of an inning.
  season_stats_pitching_intentional_walks: Season-to-date number of intentional walks (IBB) issued by the pitcher.
  season_stats_pitching_line_outs: Season-to-date number of outs recorded by the pitcher on line drives caught.
  season_stats_pitching_losses: Season-to-date number of losses charged to the pitcher.
  season_stats_pitching_number_of_pitches: Season-to-date total number of pitches thrown by the pitcher.
  season_stats_pitching_obp: Season-to-date on-base percentage allowed by the pitcher (opponents' OBP against this pitcher).
  season_stats_pitching_outs: Season-to-date total number of outs recorded by the pitcher.
  season_stats_pitching_passed_ball: Season-to-date number of passed balls that occurred while the pitcher was pitching.
  season_stats_pitching_pickoffs: Season-to-date number of pickoffs executed by the pitcher.
  season_stats_pitching_pitches_per_inning: Season-to-date average number of pitches thrown per inning by the pitcher.
  season_stats_pitching_pitches_thrown: Season-to-date total pitches thrown by the pitcher (may differ from number_of_pitches if strikes/balls are tracked separately).
  season_stats_pitching_pop_outs: Season-to-date number of outs recorded by the pitcher on pop-ups caught in the infield.
  season_stats_pitching_rbi: Season-to-date number of RBI allowed (runs batted in by opposing batters) while this pitcher was pitching.
  season_stats_pitching_runs: Season-to-date total runs (earned and unearned) allowed by the pitcher.
  season_stats_pitching_runs_scored_per9: Season-to-date total runs (including unearned) allowed per nine innings pitched.
  season_stats_pitching_sac_bunts: Season-to-date number of sacrifice bunts allowed by the pitcher.
  season_stats_pitching_sac_flies: Season-to-date number of sacrifice flies allowed by the pitcher.
  season_stats_pitching_save_opportunities: Season-to-date number of save opportunities the pitcher entered (leads of three runs or fewer in the seventh inning or later, or entering with the tying run on base).
  season_stats_pitching_saves: Season-to-date number of saves recorded by the pitcher.
  season_stats_pitching_shutouts: Season-to-date number of complete-game shutouts pitched.
  season_stats_pitching_stolen_base_percentage: Season-to-date percentage of stolen base attempts that were successful while the pitcher was on the mound.
  season_stats_pitching_stolen_bases: Season-to-date number of stolen bases allowed while the pitcher was pitching.
  season_stats_pitching_strike_outs: Season-to-date number of batters struck out by the pitcher.
  season_stats_pitching_strike_percentage: Season-to-date percentage of all pitches thrown that were strikes.
  season_stats_pitching_strikeout_walk_ratio: Season-to-date ratio of strikeouts to walks, measuring the pitcher's command and dominance.
  season_stats_pitching_strikeouts_per9_inn: Season-to-date strikeouts recorded per nine innings pitched (K/9), a rate measure of strikeout ability.
  season_stats_pitching_strikes: Season-to-date total number of strikes thrown by the pitcher.
  season_stats_pitching_triples: Season-to-date number of triples allowed by the pitcher.
  season_stats_pitching_walks_per9_inn: Season-to-date walks issued per nine innings pitched (BB/9), a rate measure of control.
  season_stats_pitching_whip: Season-to-date Walks plus Hits per Inning Pitched (WHIP), measuring baserunners allowed per inning.
  season_stats_pitching_wild_pitches: Season-to-date number of wild pitches thrown by the pitcher.
  season_stats_pitching_win_percentage: Season-to-date winning percentage for the pitcher (wins divided by decisions).
  season_stats_pitching_wins: Season-to-date number of wins credited to the pitcher.
  stats_batting_air_outs: Number of outs recorded by the batter on balls hit in the air during this game.
  stats_batting_at_bats: Number of official at-bats for the batter in this game.
  stats_batting_at_bats_per_home_run: At-bats per home run ratio for the batter in this game.
  stats_batting_base_on_balls: Number of walks (bases on balls) drawn by the batter in this game, including intentional walks.
  stats_batting_catchers_interference: Number of times the batter reached base due to catcher's interference in this game.
  stats_batting_caught_stealing: Number of times the batter was caught stealing in this game.
  stats_batting_doubles: Number of doubles hit by the batter in this game.
  stats_batting_fly_outs: Number of outs recorded by the batter on fly balls in this game.
  stats_batting_games_played: Number of games played indicator for this batter's boxscore row (typically 1 for a standard game appearance).
  stats_batting_ground_into_double_play: Number of times the batter grounded into a double play in this game.
  stats_batting_ground_into_triple_play: Number of times the batter grounded into a triple play in this game.
  stats_batting_ground_outs: Number of outs recorded by the batter on ground balls in this game.
  stats_batting_hit_by_pitch: Number of times the batter was hit by a pitch in this game.
  stats_batting_hits: Total number of hits recorded by the batter in this game.
  stats_batting_home_runs: Number of home runs hit by the batter in this game.
  stats_batting_intentional_walks: Number of intentional walks issued to the batter in this game.
  stats_batting_left_on_base: Number of runners left on base when the batter made an out or the inning ended in this game.
  stats_batting_line_outs: Number of outs recorded by the batter on line drives caught in this game.
  stats_batting_note: Supplementary note or annotation attached to the batter's boxscore line (e.g., indicating a special circumstance).
  stats_batting_pickoffs: Number of times the batter was picked off base in this game.
  stats_batting_plate_appearances: Total number of plate appearances for the batter in this game.
  stats_batting_pop_outs: Number of outs recorded by the batter on infield pop-ups in this game.
  stats_batting_rbi: Number of runs batted in (RBI) credited to the batter in this game.
  stats_batting_runs: Number of runs scored by the batter in this game.
  stats_batting_sac_bunts: Number of sacrifice bunts executed by the batter in this game.
  stats_batting_sac_flies: Number of sacrifice flies hit by the batter that scored a run in this game.
  stats_batting_stolen_base_percentage: Percentage of stolen base attempts that were successful for the batter in this game.
  stats_batting_stolen_bases: Number of stolen bases recorded by the batter in this game.
  stats_batting_strike_outs: Number of times the batter struck out in this game.
  stats_batting_summary: Condensed text summary of the batter's performance line (e.g., '2-4, HR, 2 RBI') for display purposes.
  stats_batting_total_bases: Total number of bases accumulated by the batter on hits in this game.
  stats_batting_triples: Number of triples hit by the batter in this game.
  stats_fielding_assists: Number of fielding assists recorded by the player in this game.
  stats_fielding_caught_stealing: Number of baserunners caught stealing by the player (typically a catcher) in this game.
  stats_fielding_caught_stealing_percentage: Percentage of stolen base attempts that the player threw out in this game.
  stats_fielding_chances: Total fielding chances for the player in this game (putouts + assists + errors).
  stats_fielding_errors: Number of fielding errors committed by the player in this game.
  stats_fielding_fielding: Fielding percentage for the player in this game, calculated as (putouts + assists) / total chances.
  stats_fielding_games_started: Indicator of whether the player started at a fielding position in this game.
  stats_fielding_passed_ball: Number of passed balls charged to the player (catcher-specific) in this game.
  stats_fielding_pickoffs: Number of pickoffs credited to the player as a fielder in this game.
  stats_fielding_put_outs: Number of putouts recorded by the player in this game.
  stats_fielding_stolen_base_percentage: Percentage of stolen base attempts against the player (catcher perspective) that were successful in this game.
  stats_fielding_stolen_bases: Number of stolen bases allowed by the player while fielding in this game.
  stats_pitching_air_outs: Number of outs recorded by the pitcher on balls hit in the air in this game.
  stats_pitching_at_bats: Number of at-bats faced by the pitcher (excluding walks, HBP, and sacrifices) in this game.
  stats_pitching_balks: Number of balks called against the pitcher in this game.
  stats_pitching_balls: Number of ball calls recorded against the pitcher in this game.
  stats_pitching_base_on_balls: Number of walks (bases on balls) issued by the pitcher in this game, including intentional walks.
  stats_pitching_batters_faced: Total number of batters faced by the pitcher in this game.
  stats_pitching_blown_saves: Number of blown save opportunities for the pitcher in this game.
  stats_pitching_catchers_interference: Number of catcher's interference calls that occurred while the pitcher was pitching in this game.
  stats_pitching_caught_stealing: Number of baserunners caught stealing while the pitcher was on the mound in this game.
  stats_pitching_complete_games: Indicator of whether the pitcher threw a complete game in this appearance.
  stats_pitching_doubles: Number of doubles allowed by the pitcher in this game.
  stats_pitching_earned_runs: Number of earned runs allowed by the pitcher in this game.
  stats_pitching_fly_outs: Number of outs recorded by the pitcher on fly balls in this game.
  stats_pitching_games_finished: Indicator of whether the pitcher was the last pitcher used by their team in this game.
  stats_pitching_games_pitched: Number of pitching appearances for the pitcher in this game (typically 1).
  stats_pitching_games_played: Number of games the pitcher appeared in for this boxscore row (typically 1).
  stats_pitching_games_started: Indicator of whether the pitcher was the starting pitcher in this game.
  stats_pitching_ground_outs: Number of outs recorded by the pitcher on ground balls in this game.
  stats_pitching_hit_batsmen: Number of batters hit by a pitch thrown by the pitcher in this game.
  stats_pitching_hit_by_pitch: Number of hit-by-pitch events while the pitcher was pitching in this game (alternate field for hit_batsmen).
  stats_pitching_hits: Number of hits allowed by the pitcher in this game.
  stats_pitching_holds: Number of holds recorded by the pitcher in this game.
  stats_pitching_home_runs: Number of home runs allowed by the pitcher in this game.
  stats_pitching_home_runs_per9: Home runs allowed per nine innings rate for the pitcher in this game.
  stats_pitching_inherited_runners: Number of baserunners already on base when the pitcher entered the game.
  stats_pitching_inherited_runners_scored: Number of inherited runners who scored while or after the pitcher was pitching in this game.
  stats_pitching_innings_pitched: Total innings pitched by the pitcher in this game, expressed as a decimal (each out counts as one-third of an inning).
  stats_pitching_intentional_walks: Number of intentional walks (IBB) issued by the pitcher in this game.
  stats_pitching_line_outs: Number of outs recorded by the pitcher on line drives caught in this game.
  stats_pitching_losses: Indicator of whether the pitcher was charged with the loss in this game.
  stats_pitching_note: Supplementary note or annotation attached to the pitcher's boxscore line (e.g., indicating a special circumstance).
  stats_pitching_number_of_pitches: Total number of pitches thrown by the pitcher in this game.
  stats_pitching_outs: Total number of outs recorded by the pitcher in this game.
  stats_pitching_passed_ball: Number of passed balls that occurred while the pitcher was pitching in this game.
  stats_pitching_pickoffs: Number of pickoffs executed by the pitcher in this game.
  stats_pitching_pitches_thrown: Total pitches thrown by the pitcher in this game (may differ from number_of_pitches depending on tracking method).
  stats_pitching_pop_outs: Number of outs recorded by the pitcher on infield pop-ups in this game.
  stats_pitching_rbi: Number of RBI allowed (runs batted in by opposing batters off this pitcher) in this game.
  stats_pitching_runs: Total runs (earned and unearned) allowed by the pitcher in this game.
  stats_pitching_runs_scored_per9: Total runs (including unearned) allowed per nine innings rate for the pitcher in this game.
  stats_pitching_sac_bunts: Number of sacrifice bunts allowed by the pitcher in this game.
  stats_pitching_sac_flies: Number of sacrifice flies allowed by the pitcher in this game.
  stats_pitching_save_opportunities: Number of save opportunities the pitcher entered in this game.
  stats_pitching_saves: Indicator of whether the pitcher recorded a save in this game.
  stats_pitching_shutouts: Indicator of whether the pitcher recorded a complete-game shutout in this game.
  stats_pitching_stolen_base_percentage: Percentage of stolen base attempts that were successful while the pitcher was on the mound in this game.
  stats_pitching_stolen_bases: Number of stolen bases allowed while the pitcher was pitching in this game.
  stats_pitching_strike_outs: Number of batters struck out by the pitcher in this game.
  stats_pitching_strike_percentage: Percentage of all pitches thrown that were strikes in this game.
  stats_pitching_strikes: Total number of strikes thrown by the pitcher in this game.
  stats_pitching_summary: Condensed text summary of the pitcher's performance line (e.g., '6.0 IP, 2 ER, 8 K') for display purposes.
  stats_pitching_triples: Number of triples allowed by the pitcher in this game.
  stats_pitching_wild_pitches: Number of wild pitches thrown by the pitcher in this game.
  stats_pitching_wins: Indicator of whether the pitcher was credited with the win in this game.
club_schedule_season:
  club_current_season: Indicator for whether the game falls within the current season for the requesting club (1 = current season, 0 otherwise).
  club_next_season: Indicator for whether the game belongs to the club's next upcoming season (1 = next season, 0 otherwise).
  club_previous_season: Indicator for whether the game belongs to the club's prior completed season (1 = previous season, 0 otherwise).
  club_timezone: IANA timezone identifier for the home club's arena, used to localise game start times in the schedule.
  series_status_bottom_seed_wins: Number of wins accumulated by the lower-seeded team in the current playoff series as of this scheduled game.
  series_status_game_number_of_series: Sequential game number within the playoff series (e.g., 1 through 7 for a best-of-seven).
  series_status_needed_to_win: Wins still required by the leading team to clinch and advance in the current playoff series.
  series_status_round: Playoff round number to which the current series belongs (1 = first round, 4 = Stanley Cup Final).
  series_status_series_abbrev: Short abbreviation identifying the specific playoff series slot (e.g., 'A', 'B') within the bracket for this game.
  series_status_series_letter: Single-letter label assigned to the playoff series in the bracket structure, used to pair teams across rounds.
  series_status_series_title: Human-readable display title for the playoff series (e.g., 'Eastern Conference First Round').
  series_status_top_seed_wins: Number of wins accumulated by the higher-seeded team in the current playoff series as of this scheduled game.
  series_url: NHL api-web URL path to the dedicated page for the current playoff series associated with this scheduled game.
  special_event_name_default: English display name for a special promotional or marquee event designation attached to the game (e.g., 'Winter Classic', 'Heritage Classic').
  special_event_name_fr: French display name for a special promotional or marquee event designation attached to the game, used in bilingual NHL communications.
  special_event_parent_id: NHL api-web identifier for the parent special-event record grouping multiple games under the same marquee event umbrella.
coaches:
  bio: Long-form biographical narrative for the coach, as provided by the NHL api-web endpoint.
  birth_state_province_code: Two-letter state or province code of the coach's birth location (e.g., 'ON' for Ontario, 'MI' for Michigan).
  featured_image: URL of the coach's featured promotional or profile image on the NHL platform.
  hockey_hof_link: URL to the coach's Hockey Hall of Fame profile page, if they are an inductee.
  in_iihf_hockey_hof: Boolean flag indicating whether the coach is inducted into the IIHF Hockey Hall of Fame.
  instagram: Instagram handle or profile URL for the coach's official social media presence.
  stanley_cup: Number of Stanley Cup championships won by the coach as a head coach or assistant coach.
  top100_player_link: URL to the coach's NHL Top 100 players recognition page, if applicable.
  twitter: Twitter/X handle or profile URL for the coach's official social media presence.
country:
  country3_code: Three-letter ISO country code used by the NHL api-web country reference endpoint.
  country_name: Full English display name of the country as provided by the NHL api-web country reference.
  has_player_stats: Flag (1/0) indicating whether the NHL api-web tracks player statistics for this country.
  ioc_code: International Olympic Committee three-letter country code assigned to this nation.
  nationality_name: Nationality label string used on player profiles in the NHL api-web (e.g., 'Canadian', 'American').
  olympic_url: URL to the country's Olympic profile page linked from the NHL api-web country record.
  thumbnail_url: URL to a small thumbnail image representing the country's flag or emblem in the NHL api-web.
draft_latest:
  next_up: Indicates whether this draft slot is the next pick to be made in the current draft.
  pick_display_pick_number: The formatted overall pick number displayed publicly for this draft selection.
  pick_draft_type_code: Short code identifying the type of draft (e.g., amateur, Rule 5) for this pick.
  pick_draft_type_description: Human-readable description of the draft type associated with this pick.
  pick_headshot_link: URL to the headshot image of the drafted player on the MLB Stats API CDN.
  pick_home_city: City of the draftee's listed home address at the time of the draft.
  pick_home_country: Country of the draftee's listed home address at the time of the draft.
  pick_home_state: State or province of the draftee's listed home address at the time of the draft.
  pick_is_drafted: Boolean flag indicating whether this draft slot has been filled with an actual selection.
  pick_is_pass: Boolean flag indicating whether the selecting team passed on this pick rather than making a selection.
  pick_person_active: Boolean flag indicating whether the drafted player is currently on an active MLB roster.
  pick_person_bat_side_code: Single-letter code for the player's batting handedness (e.g., R, L, S for switch).
  pick_person_bat_side_description: Full description of the player's batting side (e.g., Right, Left, Switch).
  pick_person_birth_city: City where the drafted player was born.
  pick_person_birth_country: Country where the drafted player was born.
  pick_person_birth_date: Date of birth of the drafted player in ISO 8601 format.
  pick_person_birth_state_province: State or province where the drafted player was born.
  pick_person_boxscore_name: Abbreviated name format used for the player on official MLB box scores.
  pick_person_current_age: Age of the drafted player in years at the time of the data retrieval.
  pick_person_draft_year: The MLB draft year in which this player was originally selected.
  pick_person_first_last_name: Player's name formatted as first name followed by last name.
  pick_person_first_name: The player's legal or preferred first name.
  pick_person_full_fml_name: Player's full name in first-middle-last order as recorded by the MLB Stats API.
  pick_person_full_lfm_name: Player's full name in last-first-middle order as recorded by the MLB Stats API.
  pick_person_full_name: Player's complete display name as used throughout the MLB Stats API.
  pick_person_gender: Recorded gender of the drafted player.
  pick_person_height: Player's height in feet-and-inches notation (e.g., 6' 2").
  pick_person_id: Unique MLB Stats API (MLBAM) identifier for the drafted player.
  pick_person_init_last_name: Player's name formatted as first initial followed by last name (e.g., J. Smith).
  pick_person_is_player: Boolean flag indicating whether this person is classified as an active player in the MLB Stats API.
  pick_person_is_verified: Boolean flag indicating whether the player's profile has been verified by MLB.
  pick_person_last_first_name: Player's name formatted as last name followed by first name.
  pick_person_last_init_name: Player's name formatted as last name followed by first initial.
  pick_person_last_name: The player's legal or preferred last name.
  pick_person_link: Relative URL path to the player's resource in the MLB Stats API.
  pick_person_middle_name: The player's middle name as recorded by the MLB Stats API.
  pick_person_name_first_last: Player's display name in first-last format, typically matching the broadcast name.
  pick_person_name_slug: URL-safe slug derived from the player's name for use in web links.
  pick_person_pitch_hand_code: Single-letter code for the player's pitching handedness (e.g., R, L, S).
  pick_person_pitch_hand_description: Full description of the player's pitching hand (e.g., Right, Left, Switch).
  pick_person_primary_position_abbreviation: Short abbreviation for the player's primary fielding position (e.g., SS, CF, SP).
  pick_person_primary_position_code: Numeric or short code identifying the player's primary fielding position.
  pick_person_primary_position_name: Full name of the player's primary fielding position (e.g., Shortstop, Center Field).
  pick_person_primary_position_type: Broad classification of the player's position role (e.g., Pitcher, Infielder, Outfielder).
  pick_person_strike_zone_bottom: Lower boundary of the player's personalized strike zone in feet from the ground.
  pick_person_strike_zone_top: Upper boundary of the player's personalized strike zone in feet from the ground.
  pick_person_use_last_name: The last name the player prefers to use publicly, which may differ from the legal last name.
  pick_person_use_name: The first name or nickname the player prefers to use publicly.
  pick_person_weight: Player's weight in pounds as recorded by the MLB Stats API.
  pick_person_xref_ids: Serialized cross-reference identifiers linking the player to external data systems.
  pick_pick_number: Overall pick number of this selection counting sequentially across all rounds of the draft.
  pick_pick_round: Draft round in which this pick was made (e.g., '1', '2', 'CB-A' for competitive balance).
  pick_round_pick_number: Pick number within the specific draft round (i.e., the Nth pick in that round).
  pick_school_city: City of the high school or college the draftee attended before being drafted.
  pick_school_country: Country of the school the draftee attended.
  pick_school_name: Name of the high school or college the draftee attended before being drafted.
  pick_school_school_class: Academic class or level of the draftee at their school (e.g., High School, Junior, Senior).
  pick_school_state: State of the school the draftee attended.
  pick_signing_bonus: Reported or slotted signing bonus amount associated with this draft pick.
  pick_team_abbreviation: Standard two- or three-letter abbreviation for the MLB team that made this pick.
  pick_team_active: Boolean flag indicating whether the selecting MLB franchise is currently active.
  pick_team_all_star_status: All-Star game affiliation status of the team (e.g., American League, National League).
  pick_team_club_name: Informal club or nickname portion of the team's full name (e.g., Yankees, Red Sox).
  pick_team_division_id: MLB Stats API identifier for the division the selecting team belongs to.
  pick_team_division_link: Relative URL path to the division resource in the MLB Stats API.
  pick_team_division_name: Full name of the division the selecting team belongs to (e.g., AL East).
  pick_team_file_code: Lowercase file-system-safe code used internally by MLB to identify the team.
  pick_team_first_year_of_play: Year in which the selecting franchise first played as an MLB team.
  pick_team_franchise_name: Historical franchise name that persists across any team relocations or renames.
  pick_team_id: Unique MLB Stats API identifier for the team that made this draft pick.
  pick_team_league_id: MLB Stats API identifier for the league (American or National) of the selecting team.
  pick_team_league_link: Relative URL path to the league resource in the MLB Stats API.
  pick_team_league_name: Full name of the league the selecting team belongs to (e.g., American League).
  pick_team_link: Relative URL path to the team resource in the MLB Stats API.
  pick_team_location_name: Geographic location name (city/metro) associated with the team (e.g., New York).
  pick_team_name: Full official name of the MLB team that made this pick (e.g., New York Yankees).
  pick_team_season: MLB season year for which this team's metadata snapshot applies.
  pick_team_short_name: Shortened version of the team name used in space-constrained display contexts.
  pick_team_sport_id: MLB Stats API identifier for the sport classification (MLB = 1).
  pick_team_sport_link: Relative URL path to the sport resource in the MLB Stats API.
  pick_team_sport_name: Full name of the sport classification for the team (e.g., Major League Baseball).
  pick_team_spring_league_abbreviation: Abbreviation for the spring training league the team participates in (e.g., Cactus, Grapefruit).
  pick_team_spring_league_id: MLB Stats API identifier for the team's spring training league.
  pick_team_spring_league_link: Relative URL path to the spring training league resource in the MLB Stats API.
  pick_team_spring_league_name: Full name of the spring training league the team belongs to.
  pick_team_spring_venue_id: MLB Stats API identifier for the team's spring training ballpark.
  pick_team_spring_venue_link: Relative URL path to the spring training venue resource in the MLB Stats API.
  pick_team_team_code: Short internal code used by MLB to identify the team in system contexts.
  pick_team_team_name: The nickname portion of the team's full name (e.g., Yankees, Dodgers).
  pick_team_venue_id: MLB Stats API identifier for the team's regular-season home ballpark.
  pick_team_venue_link: Relative URL path to the team's regular-season home venue in the MLB Stats API.
  pick_team_venue_name: Name of the team's regular-season home ballpark (e.g., Yankee Stadium).
  pick_year: MLB draft year for which this pick record applies.
draft_picks:
  display_abbrev_default: Short display abbreviation for the selected player's nationality or amateur league affiliation shown in the NHL draft picks listing.
draft_rankings:
  category_key: Machine-readable slug identifying the scouting or ranking category (e.g., 'north-american-skater', 'international-skater') that the prospect belongs to in the NHL draft rankings.
draft_rankings_now:
  category_key: Short identifier string for the scouting category or ranking list under which the prospect is evaluated (e.g., 'NA-SKATER', 'GOALIE').
espn_mlb_player_stats:
  batting_bipa: Batting average on balls in the air (fly balls and line drives), measuring in-play success on airborne contact.
  batting_mlb_rating: ESPN's composite MLB rating for the batter reflecting overall offensive performance.
  batting_off_warbr: Offensive Wins Above Replacement (Baseball Reference methodology) attributable to the batter's hitting contributions.
  batting_patience_ratio: Ratio of walks to strikeouts, measuring a batter's plate discipline and ability to work counts.
  batting_runs_created_per27_outs: Bill James Runs Created per 27 outs, estimating how many runs a lineup of this batter would score per game.
  batting_warbr: Total Wins Above Replacement (Baseball Reference methodology) for the batter including offense and baserunning.
  fielding_assists: Number of assists recorded by the fielder when a thrown ball contributes to an out.
  fielding_balls_in_zone: Number of batted balls that entered the fielder's defined defensive zone.
  fielding_catcher_caught_stealing: Number of opposing baserunners thrown out attempting to steal a base by this catcher.
  fielding_catcher_caught_stealing_pct: Percentage of opposing stolen base attempts that resulted in the catcher throwing out the runner.
  fielding_catcher_earned_runs: Earned runs allowed while this catcher was behind the plate, used in catcher ERA calculations.
  fielding_catcher_era: ERA of pitchers while this specific catcher was behind the plate over the season.
  fielding_catcher_stolen_bases_allowed: Number of successful stolen bases allowed by the catcher during the season.
  fielding_catcher_third_innings_played: Total one-third innings played behind the plate by the catcher, expressed in thirds.
  fielding_def_warbr: Defensive Wins Above Replacement (Baseball Reference methodology) attributable to the player's fielding.
  fielding_double_plays: Number of double plays the fielder participated in during the season.
  fielding_errors: Number of fielding errors charged to the player during the season.
  fielding_extra_bases: Extra bases allowed by the outfielder due to errors or misplays on balls hit into their zone.
  fielding_fielding_pct: Fielding percentage calculated as successful chances divided by total chances (putouts + assists + errors).
  fielding_full_innings_played: Number of complete innings (three outs per side) the player appeared in the field.
  fielding_games_played: Number of games in which the player appeared defensively at their position.
  fielding_games_started: Number of games the player started at their primary defensive position.
  fielding_hits: Number of hits recorded while this fielder was positioned, relevant for zone-rating calculations.
  fielding_is_qualified: Indicator flag for whether the player meets minimum innings requirements to qualify for fielding rate stats.
  fielding_is_qualified_catcher: Indicator flag for whether the catcher meets the minimum innings threshold to qualify for catcher-specific rate stats.
  fielding_is_qualified_pitcher: Indicator flag for whether the pitcher qualifies for pitcher fielding rate statistics.
  fielding_opportunities: Total fielding opportunities defined as putouts plus assists plus errors for the player.
  fielding_outfield_assists: Number of outfield assists, recorded when an outfielder throws out a runner.
  fielding_outs_made: Total outs the fielder was directly responsible for recording during the season.
  fielding_outs_on_field: Total outs recorded across all innings the player was present on the field.
  fielding_part_innings_played: Number of fractional (partial) innings the player appeared in the field, expressed as a count of thirds.
  fielding_passed_balls: Number of pitches ruled as passed balls charged to the catcher during the season.
  fielding_pickoffs: Number of baserunners picked off by pitchers while this catcher was behind the plate or this fielder was at their position.
  fielding_putouts: Number of putouts recorded by the fielder where they made the final play to retire a batter or runner.
  fielding_range_factor: Range factor per nine innings (putouts + assists) / innings * 9, measuring a fielder's defensive range.
  fielding_successful_chances: Total successful fielding chances defined as putouts plus assists (errors excluded).
  fielding_team_games_played: Number of games the player's team played while the player was on the active roster.
  fielding_total_bases: Total bases allowed by the outfielder on balls hit into their zone, used in advanced defensive metrics.
  fielding_total_chances: Total fielding chances (putouts + assists + errors) offered to the player during the season.
  fielding_triple_plays: Number of triple plays in which the fielder participated during the season.
  fielding_zone_rating: Percentage of batted balls in the fielder's defined zone that were successfully converted into outs.
espn_nfl_game_rosters:
  athlete_href: ESPN API hyperlink reference URL for the athlete resource.
  college_athlete_href: ESPN API hyperlink reference URL for the athlete's college profile resource.
  contract_bonus: Signing or roster bonus amount (in dollars) associated with the player's current contract.
  contract_href: ESPN API hyperlink reference URL for the player's full contract resource.
  contract_season_href: ESPN API hyperlink reference URL for the specific season-level contract detail resource.
  contract_signed_through: Final year of the player's current contract, expressed as a four-digit season year.
  contract_team_href: ESPN API hyperlink reference URL for the team associated with the player's contract.
  contracts_href: ESPN API hyperlink reference URL for the full list of the player's historical contract records.
  draft_pick_href: ESPN API hyperlink reference URL for the draft-pick record associated with this player.
  draft_team_href: ESPN API hyperlink reference URL for the team that originally drafted this player.
  jersey_right: Secondary or alternate jersey number display string used by ESPN (e.g., for special-game uniforms).
  position_href: ESPN API hyperlink reference URL for the player's positional classification resource.
  projections_href: ESPN API hyperlink reference URL for the player's statistical projection resource.
  statistics_href: ESPN API hyperlink reference URL for the player's career statistics resource.
  team_alternate_ids_sdr: SportsDataverse SDR alternate identifier for the team, used for cross-source joins.
espn_nfl_player_stats:
  defensive_assist_tackles: Number of assisted tackles credited to the player (helped bring down the ball carrier but was not the primary tackler).
  defensive_avg_interception_yards: Average yards gained per interception returned by the player.
  defensive_avg_sack_yards: Average yards lost per sack the player recorded against the opposing quarterback.
  defensive_avg_stuff_yards: Average yards lost per run stuff (tackle behind the line of scrimmage) recorded by the player.
  defensive_blocked_field_goal_touchdowns: Number of touchdowns scored by the player after blocking an opponent's field goal attempt and returning it.
  defensive_blocked_punt_ez_rec_td: Number of touchdowns scored by recovering a blocked punt in the end zone.
  defensive_blocked_punt_touchdowns: Number of touchdowns scored by the player after blocking an opponent's punt and returning it.
  defensive_hurries: Number of times the player pressured the quarterback into an early or errant throw without recording a sack.
  defensive_interceptions_interception_touchdowns: Number of touchdowns scored by the player on interception returns.
  defensive_interceptions_interception_yards: Total yards gained by the player on interception returns.
  defensive_interceptions_interceptions: Total number of passes intercepted by the player.
  defensive_kicks_blocked: Total number of kicks (field goals or extra points) the player blocked.
  defensive_long_interception: Longest single interception return in yards recorded by the player.
  defensive_misc_touchdowns: Number of defensive touchdowns scored via miscellaneous means not captured by other specific categories.
  defensive_missed_field_goal_return_td: Number of touchdowns scored by returning a missed field goal attempt.
  defensive_one_pt_safeties_made: Number of one-point safeties recorded by the player's defense (scored when the opposing team is downed in their own end zone during a try).
  defensive_passes_batted_down: Number of passes the player knocked down at the line of scrimmage without recording an interception.
  defensive_passes_defended: Total number of passes the player broke up or deflected, including both pass deflections and interceptions.
  defensive_points_allowed: Total points allowed by the player's team during games the player appeared in.
  defensive_qb_hits: Number of times the player legally hit the quarterback during or just after a pass attempt.
  defensive_sack_yards: Total yards lost by the opposing offense as a result of the player's sacks.
  defensive_safeties: Number of safeties recorded by the player (tackling the ball carrier in their own end zone).
  defensive_solo_tackles: Number of unassisted tackles credited solely to the player.
  defensive_stuff_yards: Total yards lost by the offense on run stuffs recorded by the player.
  defensive_stuffs: Number of times the player tackled a ball carrier for a loss on a rushing play.
  defensive_tackles_for_loss: Total number of tackles resulting in a loss of yards for the opposing offense.
  defensive_tackles_yards_lost: Total yards lost by the opposing offense on the player's tackles for loss.
  defensive_team_games_played: Number of games played by the player's team in which the player appeared on the defensive side.
  defensive_total_tackles: Combined total of solo tackles and assisted tackles recorded by the player.
  defensive_two_pt_returns: Number of two-point conversion attempts the player's defense returned for a defensive conversion score.
  defensive_yards_allowed: Total yards allowed by the player's defense during games the player appeared in.
  general_defensive_fumbles_touchdowns: Number of touchdowns scored by recovering or returning an opponent's fumble on the defensive side.
  general_fumbles: Total number of times the player fumbled the ball regardless of who recovered it.
  general_fumbles_forced: Number of fumbles the player forced from opposing ball carriers.
  general_fumbles_forced_primary: Number of fumbles forced where the player was credited as the primary forcer rather than an assist.
  general_fumbles_lost: Number of fumbles by the player that were subsequently recovered by the opposing team.
  general_fumbles_recovered: Number of fumbles (own or opponent's) recovered by the player.
  general_fumbles_recovered_yards: Total yards gained on fumble recoveries returned by the player.
  general_fumbles_touchdowns: Number of touchdowns scored by the player on fumble recoveries.
  general_offensive_fumbles_touchdowns: Number of touchdowns scored by recovering an offensive team fumble (e.g., a fumble recovered in the end zone).
  general_offensive_two_pt_returns: Number of two-point conversion attempts the player's offense returned defensively for a score.
  passing_adj_qbr: ESPN's Adjusted Total Quarterback Rating, which adjusts raw QBR for opponent strength and clutch situations on a 0–100 scale.
  passing_avg_gain: Average yards gained per passing attempt including sacks.
  passing_completion_pct: Percentage of pass attempts that resulted in a completed reception (completions divided by attempts).
  passing_espnqb_rating: ESPN's proprietary composite quarterback rating blending efficiency, usage, and situational performance into a single metric.
  passing_interception_pct: Percentage of pass attempts that resulted in an interception (interceptions divided by attempts).
  passing_interceptions: Total number of passes thrown that were intercepted by the opposing defense.
  passing_long_passing: Longest completed pass in yards recorded by the player during the period.
  passing_net_passing_attempts: Total pass attempts minus sacks taken, representing meaningful dropbacks.
  passing_net_passing_yards: Passing yards minus yards lost on sacks, giving a net aerial production figure.
  passing_net_passing_yards_per_game: Net passing yards (after sack yardage deduction) per game played.
  passing_net_total_yards: Combined net rushing and net passing yards accumulated by the player.
  passing_net_yards_per_game: Net total offensive yards (rushing plus net passing) per game.
  passing_net_yards_per_pass_attempt: Net passing yards divided by total pass attempts including sacks, penalizing passers for yardage lost in the pocket.
  passing_passing_attempts: Total number of pass attempts thrown by the player.
  passing_passing_big_plays: Number of passing plays that gained 20 or more yards.
  passing_passing_first_downs: Number of pass completions that resulted in a first down.
  passing_passing_fumbles: Number of times the player fumbled while in the act of passing or being sacked.
  passing_passing_fumbles_lost: Number of passing-related fumbles that were recovered by the opposing team.
  passing_passing_touchdown_pct: Percentage of pass attempts that resulted in a touchdown (touchdowns divided by attempts).
  passing_passing_touchdowns: Total number of touchdown passes thrown by the player.
  passing_passing_yards: Total aerial yards gained on completions thrown by the player.
  passing_passing_yards_after_catch: Total yards gained by receivers after catching the ball on passes thrown by the player.
  passing_passing_yards_at_catch: Total yards gained through the air (prior to the catch) on completions thrown by the player.
  passing_passing_yards_per_game: Gross passing yards per game played by the quarterback.
  passing_qb_rating: Traditional NFL passer rating computed from completion percentage, yards per attempt, touchdown percentage, and interception percentage on a roughly 0–158.3 scale.
  passing_quarterback_rating: Alternate or supplemental quarterback rating value; may represent a different calculation context from passing_qb_rating (e.g., situational or opponent-adjusted).
  passing_sack_yards_lost: Total yards lost by the player as a result of being sacked behind the line of scrimmage.
  passing_sacks: Total number of times the player was sacked behind the line of scrimmage while attempting to pass.
  passing_team_games_played: Number of games played by the player's team during which the player accumulated passing statistics.
  passing_total_offensive_plays: Total number of offensive plays (pass attempts, rushes, and sacks) run with the player as the primary ball handler.
  passing_total_points_per_game: Average total points scored by the player's team per game.
  passing_total_touchdowns: Total touchdowns (passing, rushing, and receiving) scored by or credited to the player.
  passing_total_yards: Combined total of passing, rushing, and receiving yards accumulated by the player.
  passing_total_yards_from_scrimmage: Total yards from scrimmage (rushing plus receiving) credited to the player in addition to passing yards.
  passing_two_point_pass_convs: Number of successful two-point conversion attempts thrown by the player.
  passing_two_pt_pass: Number of two-point conversion passes the player successfully completed.
  passing_two_pt_pass_attempts: Number of two-point conversion pass attempts thrown by the player regardless of outcome.
  passing_yards_from_scrimmage_per_game: Yards from scrimmage (rushing plus receiving) per game for a player who also has passing statistics recorded.
  passing_yards_per_completion: Average yards gained per completed pass attempt.
  passing_yards_per_game: Gross passing yards per game (equivalent to passing_passing_yards_per_game; alternate label).
  passing_yards_per_pass_attempt: Gross passing yards divided by total pass attempts, not penalizing for sacks.
  receiving_avg_gain: Average yards gained per reception by the player.
  receiving_espnwr_rating: ESPN's proprietary composite wide receiver / pass-catcher rating blending efficiency and usage metrics.
  receiving_long_reception: Longest single reception in yards recorded by the player during the period.
  receiving_net_total_yards: Combined net rushing and receiving yards accumulated by the player.
  receiving_net_yards_per_game: Net total offensive yards (rushing plus receiving) per game for the player.
  receiving_receiving_big_plays: Number of receptions that gained 20 or more yards.
  receiving_receiving_first_downs: Number of receptions that resulted in a first down.
  receiving_receiving_fumbles: Number of times the player fumbled after making a reception.
  receiving_receiving_fumbles_lost: Number of post-reception fumbles by the player that were recovered by the opposing team.
  receiving_receiving_targets: Total number of times the player was the intended target of a pass attempt.
  receiving_receiving_touchdowns: Total number of touchdown receptions credited to the player.
  receiving_receiving_yards: Total yards gained by the player on all receptions.
  receiving_receiving_yards_after_catch: Total yards gained by the player after making contact with the ball (yards after catch).
  receiving_receiving_yards_at_catch: Total air yards at the point of the catch (depth of target) on receptions by the player.
  receiving_receiving_yards_per_game: Receiving yards per game played by the player.
  receiving_receptions: Total number of passes successfully caught by the player.
  receiving_team_games_played: Number of games played by the player's team during which the player accumulated receiving statistics.
  receiving_total_offensive_plays: Total number of offensive plays run during which the player was active on the field.
  receiving_total_points_per_game: Average total points scored by the player's team per game (context for the receiver's role).
  receiving_total_touchdowns: Total touchdowns (rushing and receiving) scored by the player.
  receiving_total_yards: Combined total rushing and receiving yards accumulated by the player.
  receiving_total_yards_from_scrimmage: Total yards from scrimmage (rushing plus receiving) credited to the player.
  receiving_two_point_rec_convs: Number of successful two-point conversion receptions caught by the player.
  receiving_two_pt_reception: Number of two-point conversion passes the player successfully caught.
  receiving_two_pt_reception_attempts: Number of two-point conversion targets thrown to the player regardless of outcome.
  receiving_yards_from_scrimmage_per_game: Total yards from scrimmage per game for the player.
  receiving_yards_per_game: Receiving yards per game (equivalent label to receiving_receiving_yards_per_game).
  receiving_yards_per_reception: Average yards gained per reception, also known as yards per catch.
  rushing_avg_gain: Average yards gained per rushing attempt by the player.
  rushing_espnrb_rating: ESPN's proprietary composite running back rating blending efficiency and usage metrics.
  rushing_long_rushing: Longest single rushing play in yards recorded by the player during the period.
  rushing_net_total_yards: Combined net rushing and receiving yards accumulated by the player.
  rushing_net_yards_per_game: Net total offensive yards per game for the player.
  rushing_rushing_attempts: Total number of rushing attempts carried by the player.
  rushing_rushing_big_plays: Number of rushing plays that gained 10 or more yards.
  rushing_rushing_first_downs: Number of rushing attempts that resulted in a first down.
  rushing_rushing_fumbles: Number of times the player fumbled while carrying the ball on a rushing play.
  rushing_rushing_fumbles_lost: Number of rushing fumbles by the player that were recovered by the opposing team.
  rushing_rushing_touchdowns: Total number of rushing touchdowns scored by the player.
  rushing_rushing_yards: Total yards gained by the player on all rushing attempts.
  rushing_rushing_yards_per_game: Rushing yards per game played by the player.
  rushing_stuff_yards_lost: Total yards lost on rushing plays where the player was tackled behind the line of scrimmage (stuffed).
  rushing_stuffs: Number of rushing attempts where the player was tackled at or behind the line of scrimmage.
  rushing_team_games_played: Number of games played by the player's team during which the player accumulated rushing statistics.
  rushing_total_offensive_plays: Total number of offensive plays run with the player active in a rushing role.
  rushing_total_points_per_game: Average total points scored by the player's team per game.
  rushing_total_touchdowns: Total touchdowns (rushing and receiving) scored by the player.
  rushing_total_yards: Combined total rushing and receiving yards accumulated by the player.
  rushing_total_yards_from_scrimmage: Total yards from scrimmage (rushing plus receiving) credited to the player.
  rushing_two_point_rush_convs: Number of successful two-point conversion rushes scored by the player.
  rushing_two_pt_rush: Number of two-point conversion rushes the player successfully converted.
  rushing_two_pt_rush_attempts: Number of two-point conversion rush attempts by the player regardless of outcome.
  rushing_yards_from_scrimmage_per_game: Total yards from scrimmage per game for the player.
  rushing_yards_per_game: Rushing yards per game (equivalent label to rushing_rushing_yards_per_game).
  rushing_yards_per_rush_attempt: Average yards gained per rushing attempt by the player.
  scoring_defensive_points: Total points scored by the player's defense via safeties, defensive touchdowns, and blocked kick returns.
  scoring_field_goals: Total number of field goals successfully made by the player during the period.
  scoring_kick_extra_points: Total number of extra point attempts (PAT kicks) by the player.
  scoring_kick_extra_points_made: Total number of extra points successfully kicked through the uprights by the player.
  scoring_misc_points: Points scored via miscellaneous methods not captured by other scoring categories.
  scoring_one_pt_safeties_made: Number of one-point safeties recorded, scored when the defense stops an offense that is attempting a two-point conversion in their own end zone.
  scoring_passing_touchdowns: Total passing touchdowns thrown by the player, contributing to their total scoring line.
  scoring_receiving_touchdowns: Total receiving touchdowns scored by the player.
  scoring_return_touchdowns: Total touchdowns scored by the player on kick or punt returns.
  scoring_rushing_touchdowns: Total rushing touchdowns scored by the player.
  scoring_total_points: Total points contributed by the player across all scoring methods (touchdowns, PATs, field goals, etc.).
  scoring_total_points_per_game: Average total points contributed by the player per game.
  scoring_total_touchdowns: Total touchdowns scored or thrown by the player across all methods.
  scoring_total_two_point_convs: Total number of successful two-point conversions scored or thrown by the player.
  scoring_two_point_pass_convs: Number of successful two-point conversion passes thrown by the player.
  scoring_two_point_rec_convs: Number of successful two-point conversion receptions caught by the player.
  scoring_two_point_rush_convs: Number of successful two-point conversion rushes scored by the player.
espn_nfl_schedule:
  away_current_rank: Current AP or ESPN power ranking of the away team at the time of the game.
  away_linescores: Comma-separated or serialized quarter-by-quarter score totals for the away team.
  away_records: Serialized win-loss-tie record(s) for the away team (e.g., overall, home, away, conference).
  home_current_rank: Current AP or ESPN power ranking of the home team at the time of the game.
  home_linescores: Comma-separated or serialized quarter-by-quarter score totals for the home team.
  home_records: Serialized win-loss-tie record(s) for the home team (e.g., overall, home, away, conference).
  status_is_tbd_flex: Boolean flag indicating whether the game's broadcast slot is designated as a flex/TBD window.
  venue_address_country: Two-letter ISO country code or country name for the country where the venue is located.
espn_nhl_game_rosters:
  athlete_href: ESPN API hypermedia URL linking to the full athlete resource for this player, usable to fetch detailed biographical and statistical data.
  contracts_href: ESPN API hypermedia URL pointing to the contract history resource for this player.
  draft_team_href: ESPN API hypermedia URL linking to the team that originally drafted this player.
  jersey_right: Right-aligned display string for the player's jersey number, used in ESPN scoreboard rendering contexts.
  position_href: ESPN API hypermedia URL pointing to the position resource that defines this player's positional classification.
  statistics_href: ESPN API hypermedia URL linking to the statistics resource for this player's season or career totals.
  team_alternate_ids_sdr: Alternate team identifier from the ESPN SDR (Sports Data Repository) system, used to cross-reference team records across ESPN data sources.
espn_nhl_player_stats:
  defensive_avg_goals_against: Average goals allowed per game by a goaltender over the selected season and season type, equivalent to goals-against average (GAA).
  defensive_avg_shots_against: Average number of shots on goal faced by a goaltender per game over the selected season and season type.
  defensive_blocked_shots: Total number of shots blocked by a skater before reaching the goaltender over the selected season and season type.
  defensive_empty_net_goals_against: Number of goals allowed by a goaltender into an empty net (opponent pulled goalie) over the selected season and season type.
  defensive_even_strength_saves: Total saves made by a goaltender while both teams were at full strength (5-on-5) over the selected season and season type.
  defensive_goals_against: Total goals allowed by a goaltender over the selected season and season type.
  defensive_hits: Total body checks delivered by a skater over the selected season and season type as tracked by ESPN.
  defensive_overtime_losses: Number of games a goaltender's team lost in overtime (OT or shootout) while the goaltender was the decision goalie over the selected season.
  defensive_power_play_saves: Total saves made by a goaltender while the opponent had a power-play advantage over the selected season and season type.
  defensive_save_pct: Percentage of shots stopped by a goaltender, calculated as saves divided by shots against, over the selected season and season type.
  defensive_saves: Total saves made by a goaltender across all game situations over the selected season and season type.
  defensive_shootout_save_pct: Percentage of shootout attempts stopped by a goaltender, calculated as shootout saves divided by shootout shots faced over the season.
  defensive_shootout_saves: Total number of shootout attempts stopped by a goaltender over the selected season and season type.
  defensive_shootout_shots_against: Total number of penalty-shootout attempts faced by a goaltender over the selected season and season type.
  defensive_short_handed_saves: Total saves made by a goaltender while the goaltender's team was short-handed (killing a penalty) over the selected season and season type.
  defensive_shots_against: Total shots on goal faced by a goaltender across all game situations over the selected season and season type.
  defensive_shutouts: Total number of games in which a goaltender allowed zero goals over the selected season and season type.
  general_game_started: Number of games in which the player was the starting goaltender over the selected season and season type.
  general_losses: Total regulation-time losses recorded by a goaltender as the decision goalie over the selected season and season type.
  general_production: Composite production metric combining goals, assists, and other scoring contributions for a skater, as defined by ESPN, over the selected season.
  general_shifts: Total number of shifts a skater took during the selected season and season type.
  general_shifts_per_game: Average number of shifts per game taken by a skater over the selected season and season type.
  general_team_games_played: Total number of regular-season or playoff games played by the player's team during the selected season and season type.
  general_ties: Number of games that ended in a tie credited to a goaltender, applicable to seasons before the NHL eliminated ties in 2005-06.
  general_time_on_ice: Cumulative time on ice for a skater or goaltender across all games in the selected season and season type, in total seconds or minutes as provided by ESPN.
  general_time_on_ice_per_game: Average time on ice per game for a skater or goaltender over the selected season and season type.
  general_wins: Total wins recorded by a goaltender as the decision goalie over the selected season and season type.
  offensive_avg_goals: Average goals scored per game by a skater over the selected season and season type.
  offensive_avg_shots: Average shots on goal taken per game by a skater over the selected season and season type.
  offensive_faceoff_percent: Percentage of faceoffs won by the player, calculated as faceoffs won divided by total faceoffs taken, over the selected season and season type.
  offensive_faceoffs_lost: Total number of faceoffs lost by the player over the selected season and season type.
  offensive_faceoffs_won: Total number of faceoffs won by the player over the selected season and season type.
  offensive_game_tying_goals: Number of goals scored by a skater that tied the game at the time of the goal, over the selected season and season type.
  offensive_points_per_game: Average points (goals plus assists) earned per game by a skater over the selected season and season type.
  offensive_power_play_assists: Total assists recorded by a skater while on the power play over the selected season and season type.
  offensive_shootout_attempts: Total number of penalty-shootout attempts taken by a skater over the selected season and season type.
  offensive_shootout_goals: Total goals scored by a skater in penalty shootouts over the selected season and season type.
  offensive_shootout_shot_pct: Percentage of penalty-shootout attempts by a skater that resulted in a goal over the selected season and season type.
  offensive_short_handed_assists: Total assists recorded by a skater while killing a penalty (shorthanded) over the selected season and season type.
  offensive_short_handed_goals: Total goals scored by a skater while the player's team was shorthanded over the selected season and season type.
  offensive_total_face_offs: Total number of faceoffs taken by the player across all situations over the selected season and season type.
  penalties_avg_fights: Average number of fights per game involving the player over the selected season and season type, as tracked by ESPN.
  penalties_boarding_penalties: Total number of boarding infractions (hitting an opponent into the boards from behind) called against the player over the selected season and season type.
  penalties_charging_penalties: Total number of charging infractions (skating excessive distance to deliver a hit) called against the player over the selected season and season type.
  penalties_cross_checking_penalties: Total number of cross-checking infractions (using the shaft of the stick to check an opponent) called against the player over the selected season and season type.
  penalties_diving_penalties: Total number of diving or embellishment infractions called against the player over the selected season and season type.
  penalties_elbowing_penalties: Total number of elbowing infractions (using the elbow to check an opponent) called against the player over the selected season and season type.
  penalties_fighting_penalties: Total number of fighting majors assessed to the player over the selected season and season type.
  penalties_game_misconducts: Total number of game misconduct penalties assessed to the player, resulting in ejection, over the selected season and season type.
  penalties_goalie_interference_penalties: Total number of goalie interference infractions called against the player for impeding the goaltender over the selected season and season type.
  penalties_high_sticking_penalties: Total number of high-sticking infractions (stick contacting an opponent above the shoulders) called against the player over the selected season and season type.
  penalties_holding_penalties: Total number of holding infractions (impeding an opponent with the hands or arms) called against the player over the selected season and season type.
  penalties_hooking_penalties: Total number of hooking infractions (using the stick to impede an opponent's movement) called against the player over the selected season and season type.
  penalties_instigator_penalties: Total number of instigator penalties assessed to the player for initiating a fight over the selected season and season type.
  penalties_interference_penalties: Total number of interference infractions (impeding a player not in possession of the puck) called against the player over the selected season and season type.
  penalties_major_penalties: Total number of five-minute major penalties assessed to the player over the selected season and season type.
  penalties_match_penalties: Total number of match penalties assessed to the player for deliberately injuring an opponent, resulting in ejection, over the selected season and season type.
  penalties_minor_penalties: Total number of two-minute minor penalties assessed to the player over the selected season and season type.
  penalties_misconducts: Total number of ten-minute misconduct penalties assessed to the player over the selected season and season type.
  penalties_roughing_penalties: Total number of roughing infractions (unnecessary physical altercations after the whistle) called against the player over the selected season and season type.
  penalties_slashing_penalties: Total number of slashing infractions (swinging the stick at an opponent) called against the player over the selected season and season type.
  penalties_stick_holding_penalties: Total number of stick-holding infractions called against the player for grabbing an opponent's stick over the selected season and season type.
  penalties_time_between_fights: Average time elapsed between fights involving the player during the selected season and season type, as tracked by ESPN.
  penalties_tripping_penalties: Total number of tripping infractions (using a stick, arm, or leg to cause an opponent to fall) called against the player over the selected season and season type.
  penalties_unsportsmanlike_penalties: Total number of unsportsmanlike conduct penalties assessed to the player over the selected season and season type.
  rpi_losses: Total losses recorded under ESPN's RPI-based standings metric for the player's team over the selected season and season type.
  rpi_ot_losses: Overtime losses recorded under ESPN's RPI-based standings metric for the player's team over the selected season and season type.
  rpi_points: Standings points accumulated under ESPN's RPI-based standings metric for the player's team over the selected season and season type.
  rpi_points_against: Total goals or points allowed used in ESPN's RPI-based standings computation for the player's team over the selected season and season type.
  rpi_points_for: Total goals or points scored used in ESPN's RPI-based standings computation for the player's team over the selected season and season type.
  rpi_power_rank: ESPN Power Rank position for the player's team within the selected season and season type, derived from the RPI standings model.
  rpi_rpi: Rating Percentage Index (RPI) value for the player's team, reflecting strength of schedule and win/loss record, over the selected season and season type.
  rpi_sos: Strength of Schedule (SOS) component of the ESPN RPI calculation for the player's team over the selected season and season type.
  rpi_wins: Total wins recorded under ESPN's RPI-based standings metric for the player's team over the selected season and season type.
espn_nhl_schedule:
  away_linescores: Period-by-period goal totals for the away team, stored as an array of integer scores indexed by period.
  away_records: Serialized win-loss-overtime record string for the away team at the time of the scheduled game.
  home_linescores: Period-by-period goal totals for the home team, stored as an array of integer scores indexed by period.
  home_records: Serialized win-loss-overtime record string for the home team at the time of the scheduled game.
  venue_address_country: Country name or code for the country in which the game venue is located, as provided by ESPN's schedule endpoint.
game_changes:
  schedule_date: The calendar date for which schedule changes are being reported, identifying when rescheduled or suspended games occurred.
game_pace:
  hits_per9_inn: Average number of hits allowed per nine innings across all games in the sample period.
  pitches_per9_inn: Average number of pitches thrown per nine innings across all games in the sample period.
  plate_appearances_per9_inn: Average number of plate appearances occurring per nine innings across all games in the sample period.
  pr_portal_calculated_fields_time_per7_inn_game: Calculated average game time per seven-inning game as produced by the MLB Stats API pace portal.
  pr_portal_calculated_fields_time_per9_inn_game: Calculated average game time per nine-inning game as produced by the MLB Stats API pace portal.
  pr_portal_calculated_fields_total7_inn_games: Calculated total count of seven-inning games as tallied by the MLB Stats API pace portal.
  pr_portal_calculated_fields_total9_inn_games: Calculated total count of nine-inning games as tallied by the MLB Stats API pace portal.
  runs_per9_inn: Average number of runs scored per nine innings across all games in the sample period.
  time_per77_plate_appearances: Average time per 77 plate appearances, used as a normalized pace benchmark by MLB.
  time_per7_inn_game: Average elapsed clock time per seven-inning game formatted as hours and minutes.
  time_per7_inn_game_without_extra_inn: Average elapsed clock time per seven-inning game excluding games that went to extra innings.
  time_per9_inn: Average elapsed clock time per nine-inning game formatted as hours and minutes.
  total7_inn_games: Total number of seven-inning games played (including doubleheader games).
  total7_inn_games_completed_early: Number of seven-inning games that were called or completed before the full seven innings were played.
  total7_inn_games_scheduled: Total number of seven-inning games that were scheduled in the sample period.
  total7_inn_games_without_extra_inn: Number of seven-inning games completed without requiring extra innings.
  total9_inn_games: Total number of nine-inning games played in the sample period.
  total9_inn_games_completed_early: Number of nine-inning games that were called or suspended before completing nine full innings.
  total9_inn_games_scheduled: Total number of nine-inning games that were scheduled in the sample period.
  total9_inn_games_without_extra_inn: Number of nine-inning games completed without requiring extra innings.
game_timestamps:
  timecode: A timestamp string representing a specific point in time used to query the MLB Stats API for game state changes.
goalie_detail:
  player_games_played: Total number of regular-season games the goalie appeared in for the season covered by this NHL EDGE detail record.
  player_goals_against_avg: Goals-against average (GAA) for the goalie during the season, reflecting the average number of goals allowed per 60 minutes played.
  player_losses: Number of regulation losses credited to the goalie for the season in this NHL EDGE detail record.
  player_overtime_losses: Number of overtime or shootout losses (OTL) credited to the goalie during the season.
  player_save_pctg: Save percentage (SV%) for the goalie during the season, expressed as a decimal ratio of saves to shots faced.
  player_shoots_catches: Hand on which the goalie catches (glove side), typically 'L' for left or 'R' for right.
  player_wins: Number of wins credited to the goalie for the season in this NHL EDGE detail record.
  seasons_with_edge_stats: Serialized list of seasons for which NHL EDGE player-tracking data is available for this goalie.
  shot_location_details: Serialized detailed breakdown of shot locations faced by the goalie, derived from NHL EDGE tracking data.
  shot_location_summary: Serialized summary of shot-location zones faced by the goalie, aggregated from NHL EDGE tracking data.
  stats_games_above900_league_avg: League-average value for the 'games above .900 save percentage' EDGE metric, used as a comparative baseline for the goalie.
  stats_games_above900_percentile: Percentile rank among all NHL goalies for the 'games above .900 save percentage' EDGE metric during the season.
  stats_games_above900_value: Goalie's own count of games in which save percentage exceeded .900, as tracked by the NHL EDGE system.
  stats_goal_differential_per60_league_avg: League-average goals-saved-above-expected differential per 60 minutes, used as the EDGE baseline comparator for the goalie.
  stats_goal_differential_per60_percentile: Percentile rank among all NHL goalies for the goals-differential-per-60 EDGE metric during the season.
  stats_goal_differential_per60_value: Goalie's goals-saved-above-expected differential per 60 minutes of play, as computed by the NHL EDGE system.
  stats_goal_support_avg_league_avg: League-average goal-support value (average goals scored for the goalie while in net), used as the EDGE baseline comparator.
  stats_goal_support_avg_percentile: Percentile rank among all NHL goalies for average goal support received while the goalie was in net.
  stats_goal_support_avg_value: Average number of goals scored by the goalie's team per game while this goalie was in net, as tracked by NHL EDGE.
  stats_goals_against_avg_league_avg: League-average GAA value used as the EDGE comparative baseline for this goalie's goals-against-average metric.
  stats_goals_against_avg_percentile: Percentile rank among all NHL goalies for goals-against average as reported in the NHL EDGE detail.
  stats_goals_against_avg_value: Goalie's goals-against average value as reported in the NHL EDGE detail stat block (mirrors player_goals_against_avg at the EDGE layer).
  stats_point_pctg_league_avg: League-average points percentage (team winning percentage when the goalie starts) used as the EDGE comparative baseline.
  stats_point_pctg_percentile: Percentile rank among all NHL goalies for team points percentage in games the goalie started, per NHL EDGE.
  stats_point_pctg_value: Team points percentage in games started by this goalie during the season, as tracked by the NHL EDGE system.
high_low:
  exemptions: Serialized list of exemption codes or player IDs excluded from the high/low statistical split calculation.
  sort_stat_high_low_types: Serialized list of high/low result type codes (e.g., high, low) applicable to this stat leader query.
  sort_stat_org_types: Serialized list of organization types (e.g., MLB, MiLB) in scope for this high/low stat sort.
  sort_stat_stat_groups: Serialized list of statistical group identifiers (e.g., hitting, pitching) used to filter this high/low query.
  sort_stat_streak_levels: Serialized list of streak level codes defining the streak lengths tracked in this high/low query.
home_run_derby:
  current_team_abbreviation: The standard two- or three-letter abbreviation for the player's current MLB team (e.g., 'NYY', 'LAD').
  current_team_active: Boolean flag indicating whether the player's current team is an active MLB franchise.
  current_team_all_star_status: The All-Star designation status of the player's current team (e.g., which league's All-Star pool the team belongs to).
  current_team_club_name: The short club nickname for the player's current team, typically the city-less portion of the franchise name.
  current_team_division_id: The MLB Stats API numeric identifier for the division in which the player's current team competes.
  current_team_division_link: The MLB Stats API relative URL linking to the division resource for the player's current team.
  current_team_division_name: The full name of the division in which the player's current team competes (e.g., 'American League East').
  current_team_file_code: The lowercase alphabetic file code used by MLB for identifying the team in media and data assets.
  current_team_first_year_of_play: The calendar year in which the player's current franchise first played MLB games.
  current_team_franchise_name: The historical franchise name for the player's current team, which may differ from the current team name for relocated clubs.
  current_team_league_id: The MLB Stats API numeric identifier for the league (American League or National League) of the player's current team.
  current_team_league_link: The MLB Stats API relative URL linking to the league resource for the player's current team.
  current_team_league_name: The full name of the league (e.g., 'American League') in which the player's current team competes.
  current_team_location_name: The city or metropolitan area name associated with the player's current team.
  current_team_parent_org_id: The MLB Stats API numeric identifier for the parent organization (major-league affiliate) of the player's current team.
  current_team_parent_org_name: The name of the parent major-league organization for the player's current team.
  current_team_season: The MLB season year for which the player's current team metadata is reported.
  current_team_short_name: A shortened display name for the player's current team, often used in space-constrained UI contexts.
  current_team_sport_id: The MLB Stats API numeric identifier for the sport classification (e.g., 1 for MLB) of the player's current team.
  current_team_sport_link: The MLB Stats API relative URL linking to the sport resource associated with the player's current team.
  current_team_sport_name: The name of the sport classification for the player's current team (e.g., 'Major League Baseball').
  current_team_spring_league_abbreviation: The abbreviation for the Cactus League or Grapefruit League in which the player's current team participates during spring training.
  current_team_spring_league_id: The MLB Stats API numeric identifier for the spring training league of the player's current team.
  current_team_spring_league_link: The MLB Stats API relative URL linking to the spring training league resource for the player's current team.
  current_team_spring_league_name: The full name of the spring training league (e.g., 'Cactus League') for the player's current team.
  current_team_spring_venue_id: The MLB Stats API numeric identifier for the spring training ballpark used by the player's current team.
  current_team_spring_venue_link: The MLB Stats API relative URL linking to the spring training venue resource for the player's current team.
  current_team_team_code: The three-letter internal team code used by MLB in legacy data systems and some API references.
  current_team_team_name: The full official name of the player's current team, including both city and nickname.
  current_team_venue_id: The MLB Stats API numeric identifier for the regular-season home ballpark of the player's current team.
  current_team_venue_link: The MLB Stats API relative URL linking to the regular-season venue resource for the player's current team.
  current_team_venue_name: The official name of the regular-season home ballpark for the player's current team.
