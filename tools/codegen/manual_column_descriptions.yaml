  def_times_hurried: Number of times the defensive player hurried (pressured but did not sack or hit) the quarterback, from Pro Football Reference.
  passing_bad_throw_pct: Percentage of pass attempts classified as bad throws by Pro Football Reference (passes the passer should not have attempted or severely underthreww/overthrew).
