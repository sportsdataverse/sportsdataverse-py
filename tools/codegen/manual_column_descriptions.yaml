  fg_missed_30_39: Number of field goal attempts from 30–39 yards that were missed (not blocked) during the period.
  fg_missed_40_49: Number of field goal attempts from 40–49 yards that were missed (not blocked) during the period.
  fg_missed_50_59: Number of field goal attempts from 50–59 yards that were missed (not blocked) during the period.
  fg_missed_60_: Number of field goal attempts from 60 yards or longer that were missed (not blocked) during the period.
  fg_missed_distance: Cumulative distance in yards of all missed field goal attempts during the game or season period.
  fg_missed_list: List of distances (in yards) of each missed field goal attempt during the game or season period.
