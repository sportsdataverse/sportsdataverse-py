load_nfl_team_stats:
  def_safeties: Number of safeties scored by the defense (opponent tackled in their own end zone) during the period.
  fg_att: Total number of field goal attempts by the team's kicker during the game or season period.
  fg_blocked: Total number of field goal attempts that were blocked by the opposing defense during the period.
