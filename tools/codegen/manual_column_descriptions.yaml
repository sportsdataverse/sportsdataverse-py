injuries:
  display_name: Athlete's full display name as shown on ESPN.
  id: ESPN numeric identifier for the athlete.
  injuries: 'Injury entries for the athlete (list of dicts, stringified): status, type, details, dates.'
landing:
  clock_in_intermission: Boolean flag indicating whether the game clock is currently paused during an intermission period between regulation periods.
  clock_running: Boolean flag indicating whether the game clock is actively counting down at the time the NHL api-web landing payload was captured.
  clock_seconds_remaining: Integer count of seconds remaining in the current period at the time the NHL api-web landing payload was captured.
  clock_time_remaining: Remaining time in the current period formatted as MM:SS, as provided by the NHL api-web game landing endpoint.
  limited_scoring: Boolean flag indicating whether the game is subject to a limited-scoring designation (e.g., a low-scoring or shootout-resolved game) per NHL api-web metadata.
  ot_in_use: Boolean flag indicating whether overtime rules are in effect for this game, as determined by the NHL api-web game landing endpoint.
  reg_periods: Number of regulation periods scheduled for this game (typically 3 for NHL, may differ for special-format games).
  shootout_in_use: Boolean flag indicating whether a shootout is in use as the tiebreaker format for this game per NHL api-web game landing metadata.
  summary_penalties: Serialized summary of penalty events for the game, flattened from the nested NHL api-web landing payload penalties sub-object.
  summary_scoring: Serialized summary of scoring events for the game, flattened from the nested NHL api-web landing payload scoring sub-object.
  summary_three_stars: Serialized representation of the three-star selections for the game, flattened from the nested NHL api-web landing payload.
  venue_location_default: Default-language display string for the city or location associated with the game's venue, as provided by the NHL api-web landing endpoint.
leagues:
  has_playoff_points: Boolean flag indicating whether this league uses a playoff points system to determine postseason seeding.
  has_split_season: Boolean flag indicating whether this league divides its season into two halves with separate standings (as used historically in some minor leagues).
  has_wild_card: Boolean flag indicating whether this league includes a wild card playoff format for postseason eligibility.
  num_games: The total number of regular-season games scheduled per team in this league for the given season.
  num_wildcard_teams: The number of wild card berths available for postseason entry in this league for the given season.
  org_code: The organizational code identifying the parent body (e.g., 'MLB') governing this league within the MLB Stats API hierarchy.
  season_state: A string describing the current phase of the league's season (e.g., 'inProgress', 'offseason', 'preseason').
