  def_targets: Number of passing attempts thrown at or into the coverage area of this defender during the week.
  def_times_blitzed: Number of times this defender was sent as a blitzer on a passing play during the week.
  def_times_hitqb: Number of times this defender made contact with the quarterback as part of a pass rush during the week.
  def_times_hurried: Number of times this defender hurried the quarterback on a pass rush without recording a sack during the week.
  def_yards_after_catch: Total yards gained by receivers after the catch on completions allowed by this defender during the week.
  def_yards_allowed: Total receiving yards allowed by this defender in coverage during the week per Pro Football Reference.
  def_yards_allowed_per_cmp: Receiving yards allowed per completion by this defender in coverage during the week.
  def_yards_allowed_per_tgt: Receiving yards allowed per target thrown at this defender in coverage during the week.
load_nfl_pfr_weekly_pass:
  def_times_blitzed: Number of pass plays on which the defense sent a blitz, as experienced by the quarterback in this weekly log.
  def_times_hitqb: Number of times the quarterback was hit by a defender on a pass play in this weekly game log.
  def_times_hurried: Number of times the quarterback was hurried (pressured into an early throw) without being sacked or hit.
