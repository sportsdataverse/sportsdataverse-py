  fumble_recovery_tds: Number of touchdowns scored by the team on fumble recoveries (own or opponent).
  fumble_recovery_yards_opp: Total yards gained by the team on returns of opponent fumble recoveries.
  fumble_recovery_yards_own: Total yards gained after recovering their own fumbles.
  gwfg_att: Number of game-winning field goal attempts (potential go-ahead kicks in the final moments).
  gwfg_blocked: Number of game-winning field goal attempts that were blocked by the opposing defense.
