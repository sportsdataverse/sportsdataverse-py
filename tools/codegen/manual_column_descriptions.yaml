  passing_drop_pct: Percentage of pass attempts dropped by the receiver, isolating receiver-side incompletions from passer error.
  passing_drops: Raw count of catchable passes dropped by the intended receiver, from Pro Football Reference charting.
  receiving_drop: Number of catchable targets dropped by the receiver in the given game or season, from Pro Football Reference advanced receiving data.
  receiving_drop_pct: Percentage of targets that resulted in a drop by the receiver, from Pro Football Reference advanced receiving data.
  times_pressured_pct: Percentage of pass-blocking snaps on which the lineman or back allowed the quarterback to be pressured, from Pro Football Reference.
  times_sacked: Total number of times the defensive player recorded a sack of the quarterback, from Pro Football Reference.
load_player_stats:
