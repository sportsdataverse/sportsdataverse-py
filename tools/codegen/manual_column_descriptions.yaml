  zone_time_details_offensive_zone_ev_pctg: Percentage of even-strength ice time this team spends in the offensive zone, as measured by NHL EDGE player-tracking data.
  zone_time_details_offensive_zone_ev_rank: Team's league rank by even-strength offensive-zone time percentage, where rank 1 indicates the team spending the most time in the offensive zone at even strength.
  zone_time_details_offensive_zone_league_avg: League-average percentage of all-situation ice time that teams spend in the offensive zone, from NHL EDGE zone-time tracking data.
  zone_time_details_offensive_zone_pctg: Percentage of all-situation ice time this team spends in the offensive zone, as measured by NHL EDGE player-tracking data.
  zone_time_details_offensive_zone_rank: Team's league rank by overall offensive-zone time percentage (all situations), where rank 1 indicates the team with the most offensive-zone presence.
team_roster:
