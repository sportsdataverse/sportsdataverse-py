  conferenceFullName: Full name of the conference the team belonged to during this historical period (e.g., 'American Football
    Conference').
  currentLogo: URL to the team's logo image that was current during this historical period.
  divisionFullName: Full name of the division the team belonged to during this historical period (e.g., 'AFC West').
  nickName: Team nickname (e.g., 'Chiefs', 'Raiders') used during this historical period.
  teamType: Classification of the team type (e.g., 'NFL', 'AFL') indicating the league affiliation during this historical
    period.
  venues: List or serialized representation of venue(s) used by the team during this historical period.
nfl_week_games:
  awayTeam_currentLogo: URL for the away team's current primary logo image as served by the NFL Shield API.
  awayTeam_fullName: Full name of the away team (e.g., 'Kansas City Chiefs').
  awayTeam_id: NFL Shield team identifier for the away team.
  broadcastInfo_audioNetworks: Serialized list of radio networks carrying the game's audio broadcast.
  broadcastInfo_awayNetworkChannels: Serialized list of TV/streaming channels designated as the away team's local broadcast.
  broadcastInfo_homeNetworkChannels: Serialized list of TV/streaming channels designated as the home team's local broadcast.
  broadcastInfo_internationalWatchOptions: Serialized list of international streaming or broadcast options for viewers outside
    the United States.
  broadcastInfo_streamingNetworks: Serialized list of streaming platforms (e.g., Peacock, Amazon Prime Video) carrying the
    game.
  broadcastInfo_territory: Geographic territory or market designation for which this broadcast record applies.
  extensions: Serialized JSON or string of additional extension metadata attached to the game record by the NFL Shield API.
  externalIds: Serialized list of external system identifiers (e.g., partner IDs, league IDs) mapped to this game.
  homeTeam_currentLogo: URL for the home team's current primary logo image as served by the NFL Shield API.
  homeTeam_fullName: Full name of the home team (e.g., 'Dallas Cowboys').
  homeTeam_id: NFL Shield team identifier for the home team.
  international: Boolean flag indicating whether this game is designated as an international (outside the United States) game.
  seasonType: Phase of the season in which this game takes place (e.g., 'REG', 'POST', 'PRE').
  ticketUrl: URL to the official ticket purchasing page for this game.
  ticketVendors: Serialized list of authorized ticket vendors or marketplaces for this game.
  venue_country: Country name or ISO code indicating where the game's venue is located.
  version: API response version integer returned by the NFL Shield API for this game record.
  weekType: Classification of the week type within the season (e.g., 'REG', 'WC', 'DIV', 'CONF', 'SB').
nfl_weekly_game_details:
  awayTeamStandings: Serialized standings record for the away team (wins, losses, ties, division rank) at the time of this
    game.
  awayTeam_currentLogo: URL for the away team's current primary logo image as served by the NFL Shield API.
  awayTeam_fullName: Full name of the away team (e.g., 'San Francisco 49ers').
  awayTeam_id: NFL Shield team identifier for the away team.
  broadcastInfo_audioNetworks: Serialized list of radio networks carrying this game's audio broadcast.
  broadcastInfo_awayNetworkChannels: Serialized list of TV/streaming channels designated as the away team's local broadcast
    for this game.
  broadcastInfo_homeNetworkChannels: Serialized list of TV/streaming channels designated as the home team's local broadcast
    for this game.
  broadcastInfo_internationalWatchOptions: Serialized list of international streaming or broadcast options available for this
    game.
  broadcastInfo_streamingNetworks: Serialized list of streaming platforms carrying this game.
  broadcastInfo_territory: Geographic territory or market designation for this broadcast record.
  driveChart_drives: Total number of drives recorded in the drive chart for this game.
  driveChart_gameId: NFL Shield game identifier as embedded in the drive chart payload for this game.
  driveChart_offset: Pagination offset integer for the drive chart response from the NFL Shield API.
  driveChart_plays: Total number of plays recorded across all drives in the drive chart for this game.
  driveChart_scoringSummaries: Total number of scoring summary entries in the drive chart for this game.
  extensions: Serialized JSON or string of additional extension metadata attached to this game record.
  externalIds: Serialized list of external system identifiers mapped to this game across partner platforms.
  homeTeamStandings: Serialized standings record for the home team (wins, losses, ties, division rank) at the time of this
    game.
  homeTeam_currentLogo: URL for the home team's current primary logo image as served by the NFL Shield API.
  homeTeam_fullName: Full name of the home team (e.g., 'Philadelphia Eagles').
  homeTeam_id: NFL Shield team identifier for the home team.
  international: Boolean flag indicating whether this game is designated as an international game played outside the United
    States.
  replays: Serialized list of official game replay or condensed-game links associated with this game.
  seasonType: Phase of the season in which this game takes place (e.g., 'REG', 'POST', 'PRE').
  summary_attendance: Announced or official attendance figure (number of fans) at the game.
  summary_awayTeam_hasPossession: Boolean flag indicating whether the away team had possession at the most recent play update.
  summary_awayTeam_score: Away team's current or final score as a string.
  summary_awayTeam_teamId: NFL Shield team identifier for the away team as embedded in the game summary payload.
  summary_awayTeam_timeouts: Serialized or numeric representation of remaining timeouts for the away team.
  summary_clock: Current game clock value at the time of the summary snapshot (e.g., '2:11' remaining).
  summary_distance: Yards to go for a first down at the time of the summary snapshot.
  summary_down: Current down (1–4) at the time of the game summary snapshot.
  summary_gameBookUrl: URL to the official NFL gamebook PDF for this game.
  summary_gameId: NFL Shield game identifier as embedded in the game summary payload.
  summary_homeTeam_hasPossession: Boolean flag indicating whether the home team had possession at the most recent play update.
  summary_homeTeam_score: Home team's current or final score as a string.
  summary_homeTeam_teamId: NFL Shield team identifier for the home team as embedded in the game summary payload.
  summary_homeTeam_timeouts: Serialized or numeric representation of remaining timeouts for the home team.
  summary_isGoalToGo: Boolean flag indicating whether the current offensive situation is goal-to-go at the summary snapshot.
  summary_isRedZone: Boolean flag indicating whether the offense is in the red zone (inside the opponent's 20-yard line) at
    the summary snapshot.
  summary_offset: Pagination offset integer for the game summary response from the NFL Shield API.
  summary_phase: Current phase of the game at the time of the summary snapshot (e.g., 'INGAME', 'FINAL', 'PREGAME').
  summary_quarter: Current quarter of the game at the time of the summary snapshot (as a string, e.g., '4' or 'OT').
  summary_startTime: Scheduled or actual kickoff start time of the game as an ISO-formatted datetime string.
  summary_weather: Serialized weather conditions at game time (e.g., temperature, wind speed, precipitation).
  summary_yardLine: Human-readable yardline string indicating field position at the time of the summary snapshot.
  taggedVideos: Serialized list of video clips tagged to this game by the NFL Shield API (e.g., highlights, press conferences).
  ticketUrl: URL to the official ticket purchasing page for this game.
  ticketVendors: Serialized list of authorized ticket vendors or marketplaces for this game.
  venue_country: Country name or ISO code indicating where this game's venue is located.
  version: API response version integer returned by the NFL Shield API for this game detail record.
  weekType: Classification of the week type within the season (e.g., 'REG', 'WC', 'DIV', 'CONF', 'SB').
nfl_weeks:
  byeTeams: Serialized list of team abbreviations that have a bye week during this NFL schedule week.
  dateBegin: ISO-formatted date on which this NFL week's games begin (typically Thursday).
  dateEnd: ISO-formatted date on which this NFL week's games conclude (typically Monday night).
  seasonType: Phase of the season for this week (e.g., 'REG' for regular season, 'POST' for postseason).
  weekType: Classification of the week type (e.g., 'REG', 'WC', 'DIV', 'CONF', 'SB', 'PRE').
nfl_weeks_by_date:
  byeTeams: Comma-separated list of team abbreviations on bye during this week.
  dateBegin: Start date of the NFL week period in ISO 8601 format.
  dateEnd: End date of the NFL week period in ISO 8601 format.
  seasonType: Season segment for this week (e.g., 'REG' for regular season, 'POST' for playoffs, 'PRE' for preseason).
  weekType: Descriptive label for the type of week (e.g., 'Regular Season', 'Wild Card', 'Super Bowl').
nhl_scoreboard:
  away_team_name_default: Full English-language team name for the away team, as returned by the NHL api-web scoreboard feed.
  away_team_name_fr: Full French-language team name for the away team, as returned by the NHL api-web scoreboard feed.
  home_team_name_default: Full English-language team name for the home team, as returned by the NHL api-web scoreboard feed.
  home_team_name_fr: Full French-language team name for the home team, as returned by the NHL api-web scoreboard feed.
  period_descriptor_ot_periods: Number of overtime periods played when the game extended beyond regulation, as reported in
    the scoreboard period descriptor.
  scoreboard_date: Calendar date (YYYY-MM-DD) for which this scoreboard snapshot was retrieved from the NHL api-web feed.
  series_status_bottom_seed_team_abbrev: Three-letter abbreviation for the lower-seeded team in the playoff series context
    embedded in the scoreboard game entry.
  series_status_bottom_seed_wins: Number of wins accumulated by the lower-seeded team in the current playoff series as of
    this scoreboard snapshot.
  series_status_game: Game number within the current playoff series (e.g., 1 through 7) for the game represented in this scoreboard
    row.
  series_status_round: Playoff round number for this game's series (1 = first round, 2 = second round, etc.).
  series_status_series_abbrev: Short abbreviation string identifying the specific playoff series matchup (e.g., 'A1' for a
    particular bracket slot).
  series_status_top_seed_team_abbrev: Three-letter abbreviation for the higher-seeded team in the playoff series context embedded
    in the scoreboard game entry.
  series_status_top_seed_wins: Number of wins accumulated by the higher-seeded team in the current playoff series as of this
    scoreboard snapshot.
  tickets_link: URL to the English-language ticket purchase page for the game, as provided by the NHL api-web scoreboard.
  tickets_link_fr: URL to the French-language ticket purchase page for the game, as provided by the NHL api-web scoreboard.
ohl_game_corsi:
  corsi_against: Total shot attempts (goals, saves, missed shots, and blocked shots) directed against the player's team while
    that player was on the ice in the OHL game.
  corsi_for: Total shot attempts (goals, saves, missed shots, and blocked shots) directed toward the opposing team while the
    player was on the ice in the OHL game.
  corsi_for_pct: Share of all shot attempts while the player was on the ice that were directed toward the opponent, expressed
    as a percentage (Corsi For / (Corsi For + Corsi Against)).
  corsi_for_per60: The player's Corsi For rate normalized to a 60-minute pace, enabling comparison across players with different
    ice times.
  corsi_includes_missed: Boolean flag indicating whether missed shots are included in the Corsi totals for this record.
  fenwick_against: Unblocked shot attempts (goals, saves, and missed shots only) directed against the player's team while
    that player was on the ice.
  fenwick_for: Unblocked shot attempts (goals, saves, and missed shots only) directed toward the opposing team while the player
    was on the ice.
  fenwick_for_pct: Share of all unblocked shot attempts while the player was on the ice that were directed toward the opponent,
    expressed as a percentage (Fenwick For / (Fenwick For + Fenwick Against)).
  toi_seconds: Total time on ice for the player during the game, recorded in seconds.
ohl_leaders:
  photo_small: URL of a small-format headshot image of the player from the OHL HockeyTech feed.
  stat_formatted: Human-readable string representation of the leader's statistical value for display purposes (e.g., '42',
    '1.85', '93.5%').
  team_logo_small: URL of the small-format team logo image for the player's OHL club.
  type_formatted: Human-readable label describing the statistical category for which the player appears on the leaders list
    (e.g., 'Points', 'Goals', 'Save Percentage').
ohl_pbp:
  on_ice_away: Jersey numbers or player IDs of away-team skaters on the ice at the time of this play.
  on_ice_home: Jersey numbers or player IDs of home-team skaters on the ice at the time of this play.
  scoring_chance: Boolean flag indicating whether this play was classified as a scoring chance by the HockeyTech data feed.
ohl_player_stats:
  shots_wide: Count of shot attempts by the player that missed the net wide, as tracked by OHL shot-location data.
  sopt_track_faceoffs: Flag indicating whether faceoff tracking is enabled for this player's statistical record in the HockeyTech
    system.
ohl_player_toi:
  avg_shift_s: Average duration of the player's individual shifts during the game or season, measured in seconds.
  num_shifts: Total number of shifts the player took during the game or tracked period.
  toi_seconds: Total time on ice for the player during the game or tracked period, expressed in seconds.
ohl_standings:
  goals_diff: Net goal differential for the team (goals for minus goals against) displayed as a signed string.
  past_10: Team record over the most recent ten games, formatted as a W-L or W-OTL-L string.
  percentage: Team points percentage expressed as a string, calculated as points earned divided by maximum possible points.
pbp:
  details_assist1_player_id: NHL api-web player identifier for the primary (first) assist credited on a goal event in the
    play-by-play feed.
  details_assist1_player_total: Running season assist total for the primary assist player at the time of the goal event in
    the play-by-play feed.
  details_assist2_player_id: NHL api-web player identifier for the secondary (second) assist credited on a goal event in the
    play-by-play feed.
  details_assist2_player_total: Running season assist total for the secondary assist player at the time of the goal event
    in the play-by-play feed.
  details_away_score: Cumulative away-team score at the moment of the play event in the NHL api-web play-by-play feed.
  details_away_sog: Cumulative shots on goal by the away team at the moment of the play event in the NHL api-web play-by-play
    feed.
  details_blocking_player_id: NHL api-web player identifier for the skater who blocked a shot on the blocked-shot event in
    the play-by-play feed.
  details_committed_by_player_id: NHL api-web player identifier for the player who committed the infraction on a penalty event
    in the play-by-play feed.
  details_desc_key: Short descriptor key providing additional classification of the play event (e.g., penalty type or shot
    outcome) in the NHL api-web play-by-play feed.
  details_discrete_clip: NHL api-web clip identifier for the discrete video clip of this play event in the play-by-play feed
    (English feed).
  details_discrete_clip_fr: NHL api-web clip identifier for the discrete video clip of this play event in the play-by-play
    feed (French feed).
  details_drawn_by_player_id: NHL api-web player identifier for the player who drew (was the victim of) the penalty on a penalty
    event in the play-by-play feed.
  details_duration: Duration of the penalty in minutes as specified in the play event details of the NHL api-web play-by-play
    feed.
  details_event_owner_team_id: NHL api-web team identifier for the team credited with or responsible for the play event in
    the play-by-play feed.
  details_goalie_in_net_id: NHL api-web player identifier for the goaltender who was in the net at the time of the shot, goal,
    or missed-shot event in the play-by-play feed.
  details_highlight_clip: NHL api-web identifier for the broadcast highlight clip associated with this play event in the play-by-play
    feed (English feed).
  details_highlight_clip_fr: NHL api-web identifier for the broadcast highlight clip associated with this play event in the
    play-by-play feed (French feed).
  details_highlight_clip_sharing_url: Public sharing URL for the English-language broadcast highlight clip of this play event
    from the NHL api-web play-by-play feed.
  details_highlight_clip_sharing_url_fr: Public sharing URL for the French-language broadcast highlight clip of this play
    event from the NHL api-web play-by-play feed.
  details_hittee_player_id: NHL api-web player identifier for the skater who received the body check on a hit event in the
    play-by-play feed.
  details_hitting_player_id: NHL api-web player identifier for the skater who delivered the body check on a hit event in the
    play-by-play feed.
  details_home_score: Cumulative home-team score at the moment of the play event in the NHL api-web play-by-play feed.
  details_home_sog: Cumulative shots on goal by the home team at the moment of the play event in the NHL api-web play-by-play
    feed.
  details_losing_player_id: NHL api-web player identifier for the skater who lost the faceoff on a faceoff event in the play-by-play
    feed.
  details_player_id: NHL api-web player identifier for the primary player involved in the play event (used on giveaway, takeaway,
    and similar single-player events).
  details_reason: Primary reason or description for the play event (e.g., specific penalty infraction name) as provided in
    the NHL api-web play-by-play details.
  details_scoring_player_id: NHL api-web player identifier for the skater who scored the goal on a goal event in the play-by-play
    feed.
  details_scoring_player_total: Running season goal total for the scoring player at the time of the goal event in the NHL
    api-web play-by-play feed.
  details_secondary_reason: Secondary descriptive reason or sub-classification for the play event as provided in the NHL api-web
    play-by-play details (e.g., penalty sub-type).
  details_shooting_player_id: NHL api-web player identifier for the skater who took the shot on a shot-on-goal, missed-shot,
    or blocked-shot event in the play-by-play feed.
  details_shot_type: Classification of the shot attempt (e.g., wrist shot, slap shot, backhand, deflection) as provided in
    the NHL api-web play-by-play details.
  details_type_code: Structured sub-type code providing additional classification within the play event category in the NHL
    api-web play-by-play feed.
  details_winning_player_id: NHL api-web player identifier for the skater who won the faceoff on a faceoff event in the play-by-play
    feed.
  details_x_coord: Horizontal rink coordinate (feet from centre ice, positive toward right side) of the play event location
    in the NHL api-web play-by-play feed.
  details_y_coord: Vertical rink coordinate (feet from centre ice, positive toward one end) of the play event location in
    the NHL api-web play-by-play feed.
  details_zone_code: Ice zone where the play event occurred, coded as 'O' (offensive), 'D' (defensive), or 'N' (neutral) relative
    to the event owner team in the play-by-play feed.
  home_team_defending_side: Ice end ('left' or 'right') that the home team is defending in the current period, used to orient
    x/y coordinates in the NHL api-web play-by-play feed.
  ppt_replay_url: URL to the power-play tracking replay video associated with this play event in the NHL api-web play-by-play
    feed.
  type_code: Numeric event-type code identifying the category of play (e.g., goal, shot, hit, penalty, faceoff) in the NHL
    api-web play-by-play feed.
  type_desc_key: String key describing the event type category (e.g., 'goal', 'shot-on-goal', 'hit', 'faceoff') in the NHL
    api-web play-by-play feed.
person_game_stats:
  exemptions: Serialized list of statistical exemptions or special-case flags applied to this player's game-log splits.
play_by_play:
  about_at_bat_index: The sequential index of the at-bat within the game to which this play or pitch event belongs.
  about_captivating_index: A numeric score assigned by the MLB Stats API reflecting how compelling or exciting a given play
    was, based on leverage and game context.
  about_end_time: The ISO 8601 timestamp marking the end of the play event, used for temporal sequencing within the game feed.
  about_half_inning: Indicates whether the play occurred in the top or bottom half of the inning (e.g., 'top' or 'bottom').
  about_has_out: Boolean flag indicating whether this play resulted in at least one out being recorded.
  about_has_review: Boolean flag indicating whether this play was subject to a manager's challenge or umpire review.
  about_inning: The inning number in which this play or pitch event occurred.
  about_is_complete: Boolean flag indicating whether the at-bat or play event has concluded (i.e., reached a terminal result).
  about_is_scoring_play: Boolean flag indicating whether this play resulted in one or more runs being scored.
  about_is_top_inning: Boolean flag indicating whether this play occurred in the top half of the inning (true) or bottom half
    (false).
  about_start_time: The ISO 8601 timestamp marking the start of the play event, used for temporal sequencing within the game
    feed.
  action_index: A serialized list of indices identifying action-type events (e.g., stolen bases, pickoffs) that occurred within
    the at-bat.
  count_balls: The ball count in the current at-bat at the time of this pitch or play event.
  count_outs: The number of outs recorded in the current half-inning at the time of this pitch or play event.
  count_strikes: The strike count in the current at-bat at the time of this pitch or play event.
  matchup_bat_side_code: A single-character code indicating the batter's handedness for this matchup (e.g., 'L' for left,
    'R' for right, 'S' for switch).
  matchup_bat_side_description: The human-readable description of the batter's hitting side for this matchup (e.g., 'Left',
    'Right', 'Switch').
  matchup_batter_full_name: The full name of the batter involved in this plate appearance.
  matchup_batter_hot_cold_zones: A serialized representation of the batter's hot and cold zone effectiveness data for this
    matchup context.
  matchup_batter_id: The MLB Stats API (MLBAM) numeric identifier for the batter in this play's matchup.
  matchup_batter_link: The MLB Stats API relative URL linking to the batter's player resource for this matchup.
  matchup_pitch_hand_code: A single-character code indicating the pitcher's throwing hand for this matchup (e.g., 'L' for
    left, 'R' for right).
  matchup_pitch_hand_description: The human-readable description of the pitcher's throwing arm for this matchup (e.g., 'Left',
    'Right').
  matchup_pitcher_full_name: The full name of the pitcher involved in this plate appearance.
  matchup_pitcher_hot_cold_zones: A serialized representation of the pitcher's hot and cold zone effectiveness data for this
    matchup context.
  matchup_pitcher_id: The MLB Stats API (MLBAM) numeric identifier for the pitcher in this play's matchup.
  matchup_pitcher_link: The MLB Stats API relative URL linking to the pitcher's player resource for this matchup.
  matchup_post_on_first_full_name: The full name of the baserunner on first base after the play concluded, if applicable.
  matchup_post_on_first_id: The MLB Stats API (MLBAM) numeric identifier for the runner on first base after the play concluded.
  matchup_post_on_first_link: The MLB Stats API relative URL linking to the player resource of the runner on first base after
    the play.
  matchup_post_on_second_full_name: The full name of the baserunner on second base after the play concluded, if applicable.
  matchup_post_on_second_id: The MLB Stats API (MLBAM) numeric identifier for the runner on second base after the play concluded.
  matchup_post_on_second_link: The MLB Stats API relative URL linking to the player resource of the runner on second base
    after the play.
  matchup_post_on_third_full_name: The full name of the baserunner on third base after the play concluded, if applicable.
  matchup_post_on_third_id: The MLB Stats API (MLBAM) numeric identifier for the runner on third base after the play concluded.
  matchup_post_on_third_link: The MLB Stats API relative URL linking to the player resource of the runner on third base after
    the play.
  matchup_splits_batter: A string describing the batter's situational split relevant to this matchup (e.g., 'vs. Right' or
    'vs. Left').
  matchup_splits_men_on_base: A string describing the baserunner configuration applicable to the batter's situational split
    for this plate appearance.
  matchup_splits_pitcher: A string describing the pitcher's situational split relevant to this matchup (e.g., 'vs. Left' or
    'vs. Right').
  pitch_index: A serialized list of indices identifying individual pitch events that occurred within this at-bat.
  play_end_time: The ISO 8601 timestamp marking the conclusion of the entire play (as distinct from a single pitch event)
    within the game feed.
  play_events: A serialized representation of the sequence of individual pitch and action events comprising this at-bat.
  result_away_score: The away team's cumulative run total at the conclusion of this play.
  result_description: A human-readable text description of the play result as reported by the MLB Stats API (e.g., 'Strikeout',
    'Single to left field').
  result_event: The short categorical label for the play outcome as classified by the MLB Stats API (e.g., 'Strikeout', 'Home
    Run', 'Walk').
  result_event_type: The snake-cased type identifier for the play outcome used internally by the MLB Stats API (e.g., 'strikeout',
    'home_run').
  result_home_score: The home team's cumulative run total at the conclusion of this play.
  result_is_out: Boolean flag indicating whether the play resulted in the batter being retired (i.e., an out was charged to
    the batter).
  result_rbi: The number of runs batted in credited to the batter as a result of this play.
  result_type: The high-level category of the play result as classified by the MLB Stats API (e.g., 'atBat', 'action').
  review_details_challenge_team_id: The MLB Stats API numeric identifier for the team that initiated the manager's challenge
    review on this play.
  review_details_in_progress: Boolean flag indicating whether the umpire review of this play was still ongoing at the time
    of data capture.
  review_details_is_overturned: Boolean flag indicating whether the original on-field call was reversed as a result of the
    replay review.
  review_details_review_type: The type of review mechanism applied to this play (e.g., 'managerChallenge', 'umpireReview').
  runner_index: A serialized list of indices identifying baserunner movement events that occurred during or after this play.
  runners: A serialized representation of baserunner movement records for this play, including starting base, ending base,
    and relevant event types.
