  skating_speed_bursts_over20_percentile: Percentile rank among all NHL skaters for frequency of skating speed bursts exceeding
    20 mph per game.
  skating_speed_bursts_over20_value: Number of skating bursts the skater reached or exceeded 20 mph per game on average during
    the tracking period.
  skating_speed_speed_max_imperial: Skater's maximum recorded skating speed in miles per hour during the tracking period.
  skating_speed_speed_max_league_avg_imperial: League-average maximum skating speed in miles per hour, used as the baseline
    for this skater's percentile.
  skating_speed_speed_max_league_avg_metric: League-average maximum skating speed in kilometers per hour, used as the baseline
    for this skater's percentile.
  skating_speed_speed_max_metric: Skater's maximum recorded skating speed in kilometers per hour during the tracking period.
  skating_speed_speed_max_overlay_player_first_name_default: First name of the skater who achieved the maximum skating speed
    in the context of the overlay comparison play.
  skating_speed_speed_max_overlay_player_last_name_default: Last name of the skater who achieved the maximum skating speed
    in the context of the overlay comparison play.
  skating_speed_speed_max_overlay_time_in_period: Elapsed time within the period (mm:ss) at which the skater's maximum skating
    speed was recorded.
  skating_speed_speed_max_percentile: Percentile rank among all NHL skaters for maximum skating speed recorded during the
    tracking period.
  sog_details: JSON-serialized per-game shot-on-goal tracking details for the skater across the tracking period.
  sog_summary: JSON-serialized summary of shot-on-goal tracking data aggregated over the tracking period for the skater.
  top_shot_speed_imperial: Skater's highest recorded shot speed in miles per hour during the tracking period.
  top_shot_speed_league_avg_imperial: League-average top shot speed in miles per hour, used as the baseline for this skater's
    shot-speed percentile.
  top_shot_speed_league_avg_metric: League-average top shot speed in kilometers per hour, used as the baseline for this skater's
    shot-speed percentile.
  top_shot_speed_metric: Skater's highest recorded shot speed in kilometers per hour during the tracking period.
  top_shot_speed_percentile: Percentile rank among all NHL skaters for highest recorded shot speed during the tracking period.
  total_distance_skated_imperial: Total cumulative distance skated by the player in miles during the tracking period.
  total_distance_skated_league_avg_imperial: League-average total distance skated in miles per game, used as the baseline
    for this skater's distance percentile.
  total_distance_skated_league_avg_metric: League-average total distance skated in kilometers per game, used as the baseline
    for this skater's distance percentile.
  total_distance_skated_metric: Total cumulative distance skated by the player in kilometers during the tracking period.
  total_distance_skated_percentile: Percentile rank among all NHL skaters for total distance skated per game during the tracking
    period.
  zone_time_details_defensive_zone_league_avg: League-average percentage of on-ice time skaters spend in the defensive zone,
    used as the baseline for this player's percentile.
  zone_time_details_defensive_zone_pctg: Percentage of the skater's total on-ice time spent in the defensive zone during the
    tracking period.
  zone_time_details_defensive_zone_percentile: Percentile rank among all NHL skaters for percentage of ice time spent in the
    defensive zone.
  zone_time_details_neutral_zone_league_avg: League-average percentage of on-ice time skaters spend in the neutral zone, used
    as the baseline for this player's percentile.
  zone_time_details_neutral_zone_pctg: Percentage of the skater's total on-ice time spent in the neutral zone during the tracking
    period.
  zone_time_details_neutral_zone_percentile: Percentile rank among all NHL skaters for percentage of ice time spent in the
    neutral zone.
  zone_time_details_offensive_zone_league_avg: League-average percentage of on-ice time skaters spend in the offensive zone,
    used as the baseline for this player's percentile.
  zone_time_details_offensive_zone_pctg: Percentage of the skater's total on-ice time spent in the offensive zone during the
    tracking period.
  zone_time_details_offensive_zone_percentile: Percentile rank among all NHL skaters for percentage of ice time spent in the
    offensive zone.
cfb_compute_results:
  away_team: Team name of the away team in the simulated game (returned games frame).
  game_type: Game classification in the seedr engine schema - REG (regular season), CONF_CHAMP (conference championship)
    or POST (postseason/CFP).
  home_team: Team name of the home team in the simulated game (returned games frame).
  neutral: Neutral-site flag (1 = neutral site, 0 = true home game; only non-neutral games receive the ELO home bump).
  result: Home-team margin of victory (home score minus away score) - real results are preserved and the target week's unplayed
    games are filled from the ELO model.
  sim: Simulation identifier the game row belongs to (1..n simulated seasons; ELO ratings never mix across simulations).
  week: Week of the season the game is played in; only games matching the requested week_num are filled.
cfb_games_from_schedule:
  away_team: Team name of the away team, passed through from the schedule frame.
  game_type: Derived game classification - CONF_CHAMP when the schedule notes mention a (non-CFP, non-national) championship,
    REG for regular-season rows, POST otherwise.
  home_team: Team name of the home team, passed through from the schedule frame.
  neutral: Neutral-site flag derived from the schedule's neutral_site column (1 = neutral site, 0 = home game).
  result: Home-team margin (home_points minus away_points); null when either score is missing, marking the game as unplayed
    for the simulation engine.
  season: Season the game belongs to; consumed as the sim/season identifier by cfb_standings and cfb_simulations.
  week: Week of the season the game is scheduled in, passed through from the schedule frame.
cfb_playoff_seeds:
  conf_champ: Whether the team is its conference's champion - the CONF_CHAMP game winner when one was played, otherwise the
    conference's rank-1 team; always false for independents.
  conf_games: Number of conference regular-season games played (both teams in the same conference; CONF_CHAMP games excluded).
  conf_losses: Losses in conference regular-season games.
  conf_pct: Conference win percentage - (conf_wins + 0.5 * conf_ties) / conf_games, 0.0 with no conference games; the primary
    sort key for conference ranks.
  conf_pd: Point differential summed over conference regular-season games only; the POINTS-depth tiebreaker rung.
  conf_rank: Rank within the conference from the tiebreaker cascade (1 = best); null for independents.
  conf_ties: Ties in conference regular-season games.
  conf_wins: Wins in conference regular-season games.
  conference: Conference the team belongs to; null or "FBS Independents" marks an independent.
  games: Total games played across all game types (regular season, conference championship and postseason).
  losses: Losses across all played games.
  pd: Point differential (points for minus points against, via game margins) summed over all played games.
  seed: College Football Playoff seed under the straight-seeding rule (1 = best); null for teams outside the field. The five
    best-ordered conference champions are guaranteed inclusion.
  sim: Season or simulation identifier the standings row belongs to.
  sos: Strength of schedule, conference-REG-scoped (unlike nflseedR's overall games-weighted version) - mean of conference
    opponents' conference win pct across all conference games played; 0.0 for independents.
  sov: Strength of victory, conference-REG-scoped (unlike nflseedR's overall games-weighted version) - mean of defeated conference
    opponents' conference win pct, one term per conference victory; 0.0 for independents or teams without conference wins.
  team: Team name (join key across the seedr engine frames).
  ties: Ties across all played games.
  win_pct: Overall win percentage - (wins + 0.5 * ties) / games, 0.0 when no games have been played.
  wins: Wins across all played games (conference championship and postseason included).
cfb_simulations:
  conference: Conference the team belongs to; null or "FBS Independents" marks an independent.
  first_round_bye: Share of simulations in which the team earned a CFP first-round bye (seed 4 or better).
  losses: Mean losses per simulated season (all game types through the conference championship).
  made_playoff: Share of simulations in which the team made the College Football Playoff field.
  team: Team name the simulated probabilities belong to (overall summary frame).
  ties: Mean ties per simulated season.
  win_pct: Mean overall win percentage across the simulated seasons.
  wins: Mean wins per simulated season (all game types through the conference championship).
  won_cfp: Share of simulations in which the team won the College Football Playoff national championship.
  won_conf: Share of simulations in which the team won its conference (CONF_CHAMP game winner, or rank-1 fallback).
cfb_standings:
  conf_champ: Whether the team is its conference's champion - the CONF_CHAMP game winner when one was played, otherwise the
    conference's rank-1 team; always false for independents.
  conf_games: Number of conference regular-season games played (both teams in the same conference; CONF_CHAMP games excluded).
  conf_losses: Losses in conference regular-season games.
  conf_pct: Conference win percentage - (conf_wins + 0.5 * conf_ties) / conf_games, 0.0 with no conference games; the primary
    sort key for conference ranks.
  conf_pd: Point differential summed over conference regular-season games only; the POINTS-depth tiebreaker rung.
  conf_rank: Rank within the conference from the tiebreaker cascade (1 = best); null for independents.
  conf_ties: Ties in conference regular-season games.
  conf_wins: Wins in conference regular-season games.
  conference: Conference the team belongs to; null or "FBS Independents" marks an independent.
  games: Total games played across all game types (regular season, conference championship and postseason).
  losses: Losses across all played games.
  pd: Point differential (points for minus points against, via game margins) summed over all played games.
  sim: Season or simulation identifier the standings row belongs to.
  sos: Strength of schedule, conference-REG-scoped (unlike nflseedR's overall games-weighted version) - mean of conference
    opponents' conference win pct across all conference games played; 0.0 for independents.
  sov: Strength of victory, conference-REG-scoped (unlike nflseedR's overall games-weighted version) - mean of defeated conference
    opponents' conference win pct, one term per conference victory; 0.0 for independents or teams without conference wins.
  team: Team name (join key across the seedr engine frames).
  ties: Ties across all played games.
  win_pct: Overall win percentage - (wins + 0.5 * ties) / games, 0.0 when no games have been played.
  wins: Wins across all played games (conference championship and postseason included).
club_schedule_season:
  club_current_season: Indicator for whether the game falls within the current season for the requesting club (1 = current
    season, 0 otherwise).
  club_next_season: Indicator for whether the game belongs to the club's next upcoming season (1 = next season, 0 otherwise).
  club_previous_season: Indicator for whether the game belongs to the club's prior completed season (1 = previous season,
    0 otherwise).
  club_timezone: IANA timezone identifier for the home club's arena, used to localise game start times in the schedule.
  series_status_bottom_seed_wins: Number of wins accumulated by the lower-seeded team in the current playoff series as of
    this scheduled game.
  series_status_game_number_of_series: Sequential game number within the playoff series (e.g., 1 through 7 for a best-of-seven).
  series_status_needed_to_win: Wins still required by the leading team to clinch and advance in the current playoff series.
  series_status_round: Playoff round number to which the current series belongs (1 = first round, 4 = Stanley Cup Final).
  series_status_series_abbrev: Short abbreviation identifying the specific playoff series slot (e.g., 'A', 'B') within the
    bracket for this game.
  series_status_series_letter: Single-letter label assigned to the playoff series in the bracket structure, used to pair teams
    across rounds.
  series_status_series_title: Human-readable display title for the playoff series (e.g., 'Eastern Conference First Round').
  series_status_top_seed_wins: Number of wins accumulated by the higher-seeded team in the current playoff series as of this
    scheduled game.
  series_url: NHL api-web URL path to the dedicated page for the current playoff series associated with this scheduled game.
  special_event_name_default: English display name for a special promotional or marquee event designation attached to the
    game (e.g., 'Winter Classic', 'Heritage Classic').
  special_event_name_fr: French display name for a special promotional or marquee event designation attached to the game,
    used in bilingual NHL communications.
  special_event_parent_id: NHL api-web identifier for the parent special-event record grouping multiple games under the same
    marquee event umbrella.
coach:
  bio: Free-text biographical summary of the coach's career and background.
  birth_state_province_code: Two-letter state or province code indicating the coach's place of birth.
  featured_image: URL of the featured promotional image associated with the coach's NHL profile.
  hockey_hof_link: URL to the coach's page on the Hockey Hall of Fame website, if inducted.
  in_iihf_hockey_hof: Boolean flag indicating whether the coach is inducted into the IIHF Hockey Hall of Fame.
  instagram: Instagram profile handle or URL associated with the coach.
  stanley_cup: Number of Stanley Cup championships won by the coach as a head coach.
  top100_player_link: URL to the coach's entry on the NHL's Top 100 Players list, if applicable.
  twitter: Twitter (X) handle or URL associated with the coach.
coach_career:
  active_coach: Indicates whether the coach is currently active as an NHL head coach.
  coach_name: Full display name of the NHL head coach.
  end_season: The most recent season the coach held a head-coaching position, encoded as an eight-digit season ID.
  home_win_pctg: Win percentage for all regular-season home games coached.
  jack_adams: Number of Jack Adams Award trophies won by the coach as NHL coach of the year.
  last_coached_date: Date of the coach's most recent game on the bench, in ISO 8601 format.
  losses_in_ot: Total regular-season games the coach's team lost in overtime.
  losses_in_ot_plus_shootout: Total regular-season games the coach's team lost in overtime or a shootout combined.
  losses_in_shootout: Total regular-season games the coach's team lost via shootout.
  road_games: Total regular-season road games coached.
  road_win_pctg: Win percentage for all regular-season road games coached.
  seasons: Number of NHL seasons the coach has served as a head coach.
  stanley_cup_final_appearances: Number of times the coach has led a team to the Stanley Cup Final.
  stanley_cups: Number of Stanley Cup championships won as head coach.
  start_season: The first season the coach served as an NHL head coach, encoded as an eight-digit season ID.
  ties_in_ot: Total regular-season overtime-period ties recorded under pre-shootout rules.
  win_pctg: Overall regular-season win percentage across the coach's entire career.
  wins_in_ot: Total regular-season games the coach's team won in overtime.
  wins_in_ot_plus_shootout: Total regular-season games the coach's team won in overtime or a shootout combined.
coach_career_with_playoffs:
  active_coach: Indicates whether the coach is currently active as an NHL head coach.
  coach_name: Full display name of the NHL head coach.
  end_season: The most recent season the coach held a head-coaching position, encoded as an eight-digit season ID.
  seasons: Number of NHL seasons the coach has served as a head coach, including playoff appearances.
  start_season: The first season the coach served as an NHL head coach, encoded as an eight-digit season ID.
coach_franchise:
  active_coach: Indicates whether the coach is currently active with the franchise.
  coach_name: Full display name of the coach as recorded in NHL records.
  end_season: Last season (in YYYYYYYY format) the coach was behind the bench for this franchise.
  first_coached_date: Calendar date on which the coach first handled a game for this franchise.
  home_win_pctg: Fraction of home games the coach's franchise won during their tenure.
  jack_adams: Number of Jack Adams Awards (NHL coach of the year) won by the coach during this franchise tenure.
  last_coached_date: Calendar date of the coach's most recent game on the bench for this franchise.
  losses_in_ot: Number of games the coach's franchise lost in overtime during the tenure.
  losses_in_ot_plus_shootout: Combined losses in overtime and shootout during the coach's franchise tenure.
  losses_in_shootout: Number of games the coach's franchise lost in a shootout during the tenure.
  road_games: Total regular-season road games coached with this franchise.
  road_win_pctg: Fraction of away games the coach's franchise won during their tenure.
  seasons: Number of NHL seasons the coach spent with this franchise.
  stanley_cup_final_appearances: Number of Stanley Cup Final appearances made while coaching this franchise.
  stanley_cups: Number of Stanley Cup championships won while coaching this franchise.
  start_season: First season (in YYYYYYYY format) the coach served with this franchise.
  ties_in_ot: Number of overtime ties recorded under this coach for this franchise (pre-shootout era).
  win_pctg: Overall win percentage across all regular-season games coached with this franchise.
  wins_in_ot: Number of games the coach's franchise won in overtime during the tenure.
  wins_in_ot_plus_shootout: Combined wins in overtime and shootout during the coach's franchise tenure.
coach_stanley_cup:
  active_coach: Boolean flag indicating whether the coach is currently active as an NHL head coach.
  coach_name: Full name of the head coach in this Stanley Cup championship record.
  longest_streak: Maximum number of consecutive seasons in which the coach won the Stanley Cup.
  longest_streak_description: Human-readable description of the coach's longest consecutive Stanley Cup winning streak.
  seasons_won: Comma-separated list of NHL seasons in which the coach won the Stanley Cup as head coach.
  stanley_cups: Total number of Stanley Cup championships won by this coach as head coach.
coaches:
  bio: Long-form biographical narrative for the coach, as provided by the NHL api-web endpoint.
  birth_state_province_code: Two-letter state or province code of the coach's birth location (e.g., 'ON' for Ontario, 'MI'
    for Michigan).
  featured_image: URL of the coach's featured promotional or profile image on the NHL platform.
  hockey_hof_link: URL to the coach's Hockey Hall of Fame profile page, if they are an inductee.
  in_iihf_hockey_hof: Boolean flag indicating whether the coach is inducted into the IIHF Hockey Hall of Fame.
  instagram: Instagram handle or profile URL for the coach's official social media presence.
  stanley_cup: Number of Stanley Cup championships won by the coach as a head coach or assistant coach.
  top100_player_link: URL to the coach's NHL Top 100 players recognition page, if applicable.
  twitter: Twitter/X handle or profile URL for the coach's official social media presence.
commonplayerinfo:
  display_fi_last: NBA or WNBA Stats value for display fi last in the commonplayerinfo result set.
  display_first_last: NBA or WNBA Stats value for display first last in the commonplayerinfo result set.
  display_last_comma_first: NBA or WNBA Stats value for display last comma first in the commonplayerinfo result set.
  dleague_flag: Flag indicating dleague flag for the requested NBA or WNBA Stats context.
  games_played_current_season_flag: Flag indicating games played current season flag for the requested NBA or WNBA Stats context.
  games_played_flag: Flag indicating games played flag for the requested NBA or WNBA Stats context.
  greatest_75_flag: Flag indicating greatest 75 flag for the requested NBA or WNBA Stats context.
  last_affiliation: NBA or WNBA Stats value for last affiliation in the commonplayerinfo result set.
  nba_flag: Flag indicating NBA flag for the requested NBA or WNBA Stats context.
  playercode: NBA or WNBA Stats value for playercode in the commonplayerinfo result set.
  rosterstatus: NBA or WNBA Stats value for rosterstatus in the commonplayerinfo result set.
  season_exp: NBA or WNBA Stats value for season exp in the commonplayerinfo result set.
commonplayoffseries:
  game_num: NBA or WNBA Stats value for game number in the commonplayoffseries result set.
consecutive_100pt_seasons:
  consecutive100_point_seasons: Number of consecutive NHL regular seasons in which the player reached 100 or more points.
  streak_end_season: The last season of the consecutive 100-point streak, encoded as an eight-digit season ID.
  streak_start_season: The first season of the consecutive 100-point streak, encoded as an eight-digit season ID.
country:
  country3_code: Three-letter ISO country code used by the NHL api-web country reference endpoint.
  country_name: Full English display name of the country as provided by the NHL api-web country reference.
  has_player_stats: Flag (1/0) indicating whether the NHL api-web tracks player statistics for this country.
  ioc_code: International Olympic Committee three-letter country code assigned to this nation.
  nationality_name: Nationality label string used on player profiles in the NHL api-web (e.g., 'Canadian', 'American').
  olympic_url: URL to the country's Olympic profile page linked from the NHL api-web country record.
  thumbnail_url: URL to a small thumbnail image representing the country's flag or emblem in the NHL api-web.
draft_latest:
  next_up: Indicates whether this draft slot is the next pick to be made in the current draft.
  pick_display_pick_number: The formatted overall pick number displayed publicly for this draft selection.
  pick_draft_type_code: Short code identifying the type of draft (e.g., amateur, Rule 5) for this pick.
  pick_draft_type_description: Human-readable description of the draft type associated with this pick.
  pick_headshot_link: URL to the headshot image of the drafted player on the MLB Stats API CDN.
  pick_home_city: City of the draftee's listed home address at the time of the draft.
  pick_home_country: Country of the draftee's listed home address at the time of the draft.
  pick_home_state: State or province of the draftee's listed home address at the time of the draft.
  pick_is_drafted: Boolean flag indicating whether this draft slot has been filled with an actual selection.
  pick_is_pass: Boolean flag indicating whether the selecting team passed on this pick rather than making a selection.
  pick_person_active: Boolean flag indicating whether the drafted player is currently on an active MLB roster.
  pick_person_bat_side_code: Single-letter code for the player's batting handedness (e.g., R, L, S for switch).
  pick_person_bat_side_description: Full description of the player's batting side (e.g., Right, Left, Switch).
  pick_person_birth_city: City where the drafted player was born.
  pick_person_birth_country: Country where the drafted player was born.
  pick_person_birth_date: Date of birth of the drafted player in ISO 8601 format.
  pick_person_birth_state_province: State or province where the drafted player was born.
  pick_person_boxscore_name: Abbreviated name format used for the player on official MLB box scores.
  pick_person_current_age: Age of the drafted player in years at the time of the data retrieval.
  pick_person_draft_year: The MLB draft year in which this player was originally selected.
  pick_person_first_last_name: Player's name formatted as first name followed by last name.
  pick_person_first_name: The player's legal or preferred first name.
  pick_person_full_fml_name: Player's full name in first-middle-last order as recorded by the MLB Stats API.
  pick_person_full_lfm_name: Player's full name in last-first-middle order as recorded by the MLB Stats API.
  pick_person_full_name: Player's complete display name as used throughout the MLB Stats API.
  pick_person_gender: Recorded gender of the drafted player.
  pick_person_height: Player's height in feet-and-inches notation (e.g., 6' 2").
  pick_person_id: Unique MLB Stats API (MLBAM) identifier for the drafted player.
  pick_person_init_last_name: Player's name formatted as first initial followed by last name (e.g., J. Smith).
  pick_person_is_player: Boolean flag indicating whether this person is classified as an active player in the MLB Stats API.
  pick_person_is_verified: Boolean flag indicating whether the player's profile has been verified by MLB.
  pick_person_last_first_name: Player's name formatted as last name followed by first name.
  pick_person_last_init_name: Player's name formatted as last name followed by first initial.
  pick_person_last_name: The player's legal or preferred last name.
  pick_person_link: Relative URL path to the player's resource in the MLB Stats API.
  pick_person_middle_name: The player's middle name as recorded by the MLB Stats API.
  pick_person_name_first_last: Player's display name in first-last format, typically matching the broadcast name.
  pick_person_name_slug: URL-safe slug derived from the player's name for use in web links.
  pick_person_pitch_hand_code: Single-letter code for the player's pitching handedness (e.g., R, L, S).
  pick_person_pitch_hand_description: Full description of the player's pitching hand (e.g., Right, Left, Switch).
  pick_person_primary_position_abbreviation: Short abbreviation for the player's primary fielding position (e.g., SS, CF,
    SP).
  pick_person_primary_position_code: Numeric or short code identifying the player's primary fielding position.
  pick_person_primary_position_name: Full name of the player's primary fielding position (e.g., Shortstop, Center Field).
  pick_person_primary_position_type: Broad classification of the player's position role (e.g., Pitcher, Infielder, Outfielder).
  pick_person_strike_zone_bottom: Lower boundary of the player's personalized strike zone in feet from the ground.
  pick_person_strike_zone_top: Upper boundary of the player's personalized strike zone in feet from the ground.
  pick_person_use_last_name: The last name the player prefers to use publicly, which may differ from the legal last name.
  pick_person_use_name: The first name or nickname the player prefers to use publicly.
  pick_person_weight: Player's weight in pounds as recorded by the MLB Stats API.
  pick_person_xref_ids: Serialized cross-reference identifiers linking the player to external data systems.
  pick_pick_number: Overall pick number of this selection counting sequentially across all rounds of the draft.
  pick_pick_round: Draft round in which this pick was made (e.g., '1', '2', 'CB-A' for competitive balance).
  pick_round_pick_number: Pick number within the specific draft round (i.e., the Nth pick in that round).
  pick_school_city: City of the high school or college the draftee attended before being drafted.
  pick_school_country: Country of the school the draftee attended.
  pick_school_name: Name of the high school or college the draftee attended before being drafted.
  pick_school_school_class: Academic class or level of the draftee at their school (e.g., High School, Junior, Senior).
  pick_school_state: State of the school the draftee attended.
  pick_signing_bonus: Reported or slotted signing bonus amount associated with this draft pick.
  pick_team_abbreviation: Standard two- or three-letter abbreviation for the MLB team that made this pick.
  pick_team_active: Boolean flag indicating whether the selecting MLB franchise is currently active.
  pick_team_all_star_status: All-Star game affiliation status of the team (e.g., American League, National League).
  pick_team_club_name: Informal club or nickname portion of the team's full name (e.g., Yankees, Red Sox).
  pick_team_division_id: MLB Stats API identifier for the division the selecting team belongs to.
  pick_team_division_link: Relative URL path to the division resource in the MLB Stats API.
  pick_team_division_name: Full name of the division the selecting team belongs to (e.g., AL East).
  pick_team_file_code: Lowercase file-system-safe code used internally by MLB to identify the team.
  pick_team_first_year_of_play: Year in which the selecting franchise first played as an MLB team.
  pick_team_franchise_name: Historical franchise name that persists across any team relocations or renames.
  pick_team_id: Unique MLB Stats API identifier for the team that made this draft pick.
  pick_team_league_id: MLB Stats API identifier for the league (American or National) of the selecting team.
  pick_team_league_link: Relative URL path to the league resource in the MLB Stats API.
  pick_team_league_name: Full name of the league the selecting team belongs to (e.g., American League).
  pick_team_link: Relative URL path to the team resource in the MLB Stats API.
  pick_team_location_name: Geographic location name (city/metro) associated with the team (e.g., New York).
  pick_team_name: Full official name of the MLB team that made this pick (e.g., New York Yankees).
  pick_team_season: MLB season year for which this team's metadata snapshot applies.
  pick_team_short_name: Shortened version of the team name used in space-constrained display contexts.
  pick_team_sport_id: MLB Stats API identifier for the sport classification (MLB = 1).
  pick_team_sport_link: Relative URL path to the sport resource in the MLB Stats API.
  pick_team_sport_name: Full name of the sport classification for the team (e.g., Major League Baseball).
  pick_team_spring_league_abbreviation: Abbreviation for the spring training league the team participates in (e.g., Cactus,
    Grapefruit).
  pick_team_spring_league_id: MLB Stats API identifier for the team's spring training league.
  pick_team_spring_league_link: Relative URL path to the spring training league resource in the MLB Stats API.
  pick_team_spring_league_name: Full name of the spring training league the team belongs to.
  pick_team_spring_venue_id: MLB Stats API identifier for the team's spring training ballpark.
  pick_team_spring_venue_link: Relative URL path to the spring training venue resource in the MLB Stats API.
  pick_team_team_code: Short internal code used by MLB to identify the team in system contexts.
  pick_team_team_name: The nickname portion of the team's full name (e.g., Yankees, Dodgers).
  pick_team_venue_id: MLB Stats API identifier for the team's regular-season home ballpark.
  pick_team_venue_link: Relative URL path to the team's regular-season home venue in the MLB Stats API.
  pick_team_venue_name: Name of the team's regular-season home ballpark (e.g., Yankee Stadium).
  pick_year: MLB draft year for which this pick record applies.
draft_picks:
  display_abbrev_default: Short display abbreviation for the selected player's nationality or amateur league affiliation shown
    in the NHL draft picks listing.
draft_picks_now:
  display_abbrev_default: Default-language display abbreviation for the team that currently holds this draft pick.
draft_rankings:
  category_key: Machine-readable slug identifying the scouting or ranking category (e.g., 'north-american-skater', 'international-skater')
    that the prospect belongs to in the NHL draft rankings.
draft_rankings_now:
  category_key: Short identifier string for the scouting category or ranking list under which the prospect is evaluated (e.g.,
    'NA-SKATER', 'GOALIE').
drafthistory:
  draft_type: NBA or WNBA Stats value for draft type in the drafthistory result set.
espn_cfb_game_rosters:
  athlete_href: ESPN API URL reference for the athlete's full profile resource.
  birth_country_alternate_id: Alternate identifier for the athlete's birth country, used in ESPN's nationality lookup system.
  flag_alt: Alt-text description for the athlete's country flag image, typically the country name.
  flag_href: URL to the athlete's nationality flag image on ESPN's CDN.
  flag_rel: Relationship descriptor for the flag image link (e.g., 'flag' or 'country').
  jersey_right: Secondary or alternate jersey number field, distinct from the primary jersey number.
  position_href: ESPN API URL reference for the athlete's position resource.
  statistics_href: ESPN API URL reference for the athlete's game or season statistics resource.
  team_alternate_ids_sdr: ESPN SDR (Sports Data Repository) alternate team identifier for the athlete's team.
espn_cfb_play_participants:
  kicker_player_ids: List of ESPN athlete IDs for all kickers credited on the play (e.g., kickoff, field goal, or PAT attempt).
  kicker_player_names: List of display names for all kickers credited on the play.
  pass_defender_player_id: ESPN athlete ID for the primary pass defender (cornerback or safety) who contested the target on
    the play.
  pass_defender_player_ids: List of ESPN athlete IDs for all pass defenders who contested the target or were credited with
    a pass breakup on the play.
  pass_defender_player_name: Display name of the primary pass defender who contested the target or broke up the pass on the
    play.
  pass_defender_player_names: List of display names for all pass defenders credited on the play.
  passer_player_ids: List of ESPN athlete IDs for all passers credited on the play (supports multi-player lateral/trick plays).
  passer_player_names: List of display names for all passers credited on the play.
  pat_scorer_player_id: ESPN athlete ID for the primary player who scored a point-after-touchdown (PAT) conversion on the
    play.
  pat_scorer_player_ids: List of ESPN athlete IDs for all players credited with a PAT conversion on the play.
  pat_scorer_player_name: Display name of the player who scored the point-after-touchdown conversion on the play.
  pat_scorer_player_names: List of display names for all players credited with a PAT conversion on the play.
  penalized_player_id: ESPN athlete ID for the primary player who committed the penalty on the play.
  penalized_player_ids: List of ESPN athlete IDs for all players penalized on the play.
  penalized_player_name: Display name of the player assessed a penalty on the play.
  penalized_player_names: List of display names for all players penalized on the play.
  punter_player_ids: List of ESPN athlete IDs for all punters credited on the play.
  punter_player_names: List of display names for all punters credited on the play.
  receiver_player_ids: List of ESPN athlete IDs for all intended receivers on the play (supports lateral chains).
  receiver_player_names: List of display names for all intended receivers credited on the play.
  returner_player_id: ESPN athlete ID for the primary player who returned a kick, punt, or interception on the play.
  returner_player_ids: List of ESPN athlete IDs for all returners credited on the play (e.g., during a lateral after a return).
  returner_player_name: Display name of the primary player who returned a kick, punt, or interception on the play.
  returner_player_names: List of display names for all returners credited on the play.
  rusher_player_ids: List of ESPN athlete IDs for all ball carriers credited on the play (supports lateral handoffs).
  rusher_player_names: List of display names for all ball carriers credited on the play.
  sacked_by_player_id: ESPN athlete ID for the primary pass rusher who recorded the sack on the play.
  sacked_by_player_ids: List of ESPN athlete IDs for all pass rushers credited with the sack on the play (includes split-sack
    participants).
  sacked_by_player_name: Display name of the primary pass rusher credited with the sack on the play.
  sacked_by_player_names: List of display names for all pass rushers credited with the sack, including secondary participants
    on split sacks.
  scorer_player_id: ESPN athlete ID for the primary player who scored a touchdown or field goal on the play.
  scorer_player_ids: List of ESPN athlete IDs for all players credited with a scoring event on the play.
  scorer_player_name: Display name of the primary player credited with a touchdown or field goal score on the play.
  scorer_player_names: List of display names for all players credited with scoring on the play.
espn_cfb_player_stats:
  general_defensive_fumbles_touchdowns: Number of touchdowns scored by the player on fumble recoveries attributed to the defensive
    category.
  general_fumbles: Total number of fumbles committed by the player across all offensive and special-teams plays.
  general_fumbles_lost: Number of fumbles the player committed that were recovered by the opposing team.
  general_fumbles_touchdowns: Total touchdowns scored by the player as a result of fumble recoveries, combining offensive
    and defensive occurrences.
  general_offensive_fumbles_touchdowns: Number of touchdowns scored by the player on fumble recoveries credited to the offensive
    category.
  general_offensive_two_pt_returns: Number of two-point conversions the player scored by returning a blocked or intercepted
    two-point attempt on the offensive side.
  passing_adj_qbr: ESPN's adjusted Total Quarterback Rating (QBR) for the player's passing performance, controlling for opponent
    difficulty and game situation.
  passing_avg_gain: Average yards gained per passing play attempt by the quarterback in the passing category.
  passing_completion_pct: Percentage of pass attempts thrown by the quarterback that were completed, calculated as completions
    divided by attempts.
  passing_espnqb_rating: ESPN's proprietary quarterback rating for the player's passing performance, factoring in efficiency
    metrics beyond traditional passer rating.
  passing_interception_pct: Percentage of pass attempts that resulted in an interception, calculated as interceptions divided
    by passing attempts.
  passing_interceptions: Total number of passes thrown by the quarterback that were intercepted by the defense.
  passing_long_passing: Longest single completed pass in yards recorded by the quarterback during the stat period.
  passing_net_passing_yards: Net passing yards gained by the quarterback after subtracting yardage lost on sacks from gross
    passing yards.
  passing_net_passing_yards_per_game: Net passing yards per game for the quarterback, computed as net passing yards divided
    by games played.
  passing_net_total_yards: Combined net yardage from passing and rushing for a quarterback, accounting for sack yardage lost
    in the passing category.
  passing_net_yards_per_game: Net total yards gained per game for the player as recorded in the passing category context.
  passing_net_yards_per_pass_attempt: Net passing yards divided by total pass attempts, including sack yardage lost in the
    denominator's context.
  passing_passing_attempts: Total number of pass attempts thrown by the quarterback, including completions, incompletions,
    and interceptions.
  passing_passing_big_plays: Number of passing plays that gained 20 or more yards as recorded for the quarterback.
  passing_passing_first_downs: Number of first downs gained by the team on passing plays thrown by the quarterback.
  passing_passing_fumbles: Number of fumbles the quarterback committed during passing plays, including fumbled snaps and sack
    fumbles.
  passing_passing_fumbles_lost: Number of fumbles the quarterback committed on passing plays that were recovered by the opposing
    team.
  passing_passing_touchdown_pct: Percentage of pass attempts that resulted in a passing touchdown, calculated as touchdowns
    divided by attempts.
  passing_passing_touchdowns: Total number of touchdown passes thrown by the quarterback.
  passing_passing_yards: Gross passing yards gained by the quarterback on completed passes.
  passing_passing_yards_after_catch: Total yards gained by receivers after the catch on passes thrown by the quarterback.
  passing_passing_yards_at_catch: Total yards gained at the point of the catch (air yards) on passes thrown by the quarterback,
    before any yards after catch.
  passing_passing_yards_per_game: Gross passing yards per game for the quarterback, computed as passing yards divided by games
    played.
  passing_qb_rating: Traditional NCAA passer rating for the quarterback, calculated from completion percentage, yards per
    attempt, touchdown rate, and interception rate.
  passing_quarterback_rating: Traditional passer rating for the quarterback, equivalent to passing_qb_rating, using the standard
    NCAA formula.
  passing_sack_yards_lost: Total yards lost by the quarterback as a result of being sacked, subtracted when computing net
    passing yards.
  passing_sacks: Total number of times the quarterback was sacked (tackled behind the line of scrimmage on a passing play).
  passing_team_games_played: Number of team games played during the stat period, used as the denominator for per-game passing
    rate statistics.
  passing_total_offensive_plays: Total number of offensive plays (pass attempts plus rushes) for the team during the stat
    period, recorded in the passing category context.
  passing_total_points_per_game: Average total points scored per game by the player's team as recorded alongside passing statistics.
  passing_total_touchdowns: Total touchdowns accounted for by the quarterback across passing and rushing in the passing category
    context.
  passing_total_yards: Total offensive yardage (passing plus rushing) accumulated by the quarterback as reported in the passing
    category.
  passing_total_yards_from_scrimmage: Total yards from scrimmage accumulated by the quarterback (passing plus rushing yards)
    in the passing category context.
  passing_two_point_pass_convs: Number of successful two-point conversions the quarterback converted via a passing play.
  passing_two_pt_pass: Indicator or count of two-point conversion passing attempts recorded for the quarterback.
  passing_two_pt_pass_attempts: Total number of two-point conversion attempts the quarterback made via a passing play.
  passing_yards_from_scrimmage_per_game: Average yards from scrimmage per game for the quarterback as reported in the passing
    category.
  passing_yards_per_completion: Average yards gained per completed pass by the quarterback, calculated as passing yards divided
    by completions.
  passing_yards_per_game: Average gross passing yards per game for the quarterback, equivalent to passing_passing_yards_per_game.
  passing_yards_per_pass_attempt: Average yards gained per pass attempt by the quarterback, calculated as passing yards divided
    by attempts.
  receiving_avg_gain: Average yards gained per reception for the player in the receiving category.
  receiving_espnwr_rating: ESPN's proprietary wide receiver / pass-catcher rating for the player's receiving performance.
  receiving_long_reception: Longest single reception in yards recorded by the player during the stat period.
  receiving_net_total_yards: Net total yardage accumulated by the player from receiving and any rushing contributions as reported
    in the receiving category.
  receiving_net_yards_per_game: Net total yards per game for the player as reported in the receiving category context.
  receiving_receiving_big_plays: Number of receiving plays that gained 20 or more yards for the player.
  receiving_receiving_first_downs: Number of first downs gained by the player via receptions.
  receiving_receiving_fumbles: Number of fumbles the player committed after catching a pass.
  receiving_receiving_fumbles_lost: Number of fumbles the player committed on receiving plays that were recovered by the opposing
    team.
  receiving_receiving_targets: Total number of times the player was targeted as the intended receiver on a pass play.
  receiving_receiving_touchdowns: Total number of touchdown receptions scored by the player.
  receiving_receiving_yards: Total yards gained by the player on completed receptions.
  receiving_receiving_yards_after_catch: Total yards gained by the player after the catch on receiving plays.
  receiving_receiving_yards_at_catch: Total air yards gained at the point of the catch on receiving plays, before any yards
    after catch.
  receiving_receiving_yards_per_game: Average receiving yards per game for the player, calculated as receiving yards divided
    by games played.
  receiving_receptions: Total number of completed receptions (catches) recorded by the player.
  receiving_team_games_played: Number of team games played during the stat period, used as the denominator for per-game receiving
    rate statistics.
  receiving_total_offensive_plays: Total number of offensive plays for the team during the stat period, recorded in the receiving
    category context.
  receiving_total_points_per_game: Average total points scored per game by the player's team as recorded alongside receiving
    statistics.
  receiving_total_touchdowns: Total touchdowns scored by the player across all methods as reported in the receiving category
    context.
  receiving_total_yards: Total offensive yardage accumulated by the player as reported in the receiving category.
  receiving_total_yards_from_scrimmage: Total yards from scrimmage for the player (receiving plus rushing yards) as reported
    in the receiving category.
  receiving_two_point_rec_convs: Number of successful two-point conversions the player converted via a reception.
  receiving_two_pt_reception: Indicator or count of two-point conversion receptions recorded for the player.
  receiving_two_pt_reception_attempts: Total number of two-point conversion attempts the player made via a receiving play.
  receiving_yards_from_scrimmage_per_game: Average yards from scrimmage per game for the player as reported in the receiving
    category.
  receiving_yards_per_game: Average receiving yards per game for the player, equivalent to receiving_receiving_yards_per_game.
  receiving_yards_per_reception: Average yards gained per reception for the player, calculated as receiving yards divided
    by receptions.
  rushing_avg_gain: Average yards gained per rushing attempt for the player in the rushing category.
  rushing_espnrb_rating: ESPN's proprietary running back rating for the player's rushing performance.
  rushing_long_rushing: Longest single rushing carry in yards recorded by the player during the stat period.
  rushing_net_total_yards: Net total yardage accumulated by the player from rushing and any receiving contributions as reported
    in the rushing category.
  rushing_net_yards_per_game: Net total yards per game for the player as reported in the rushing category context.
  rushing_rushing_attempts: Total number of rushing attempts (carries) credited to the player.
  rushing_rushing_big_plays: Number of rushing plays that gained 10 or more yards for the player.
  rushing_rushing_first_downs: Number of first downs gained by the player via rushing plays.
  rushing_rushing_fumbles: Number of fumbles the player committed on rushing plays.
  rushing_rushing_fumbles_lost: Number of fumbles the player committed on rushing plays that were recovered by the opposing
    team.
  rushing_rushing_touchdowns: Total number of rushing touchdowns scored by the player.
  rushing_rushing_yards: Total yards gained by the player on rushing attempts.
  rushing_rushing_yards_per_game: Average rushing yards per game for the player, calculated as rushing yards divided by games
    played.
  rushing_stuff_yards_lost: Total yards lost by the player on stuffed rushing plays (carries stopped at or behind the line
    of scrimmage).
  rushing_stuffs: Number of rushing attempts in which the player was stopped at or behind the line of scrimmage.
  rushing_team_games_played: Number of team games played during the stat period, used as the denominator for per-game rushing
    rate statistics.
  rushing_total_offensive_plays: Total number of offensive plays for the team during the stat period, recorded in the rushing
    category context.
  rushing_total_points_per_game: Average total points scored per game by the player's team as recorded alongside rushing statistics.
  rushing_total_touchdowns: Total touchdowns scored by the player across all methods as reported in the rushing category context.
  rushing_total_yards: Total offensive yardage accumulated by the player as reported in the rushing category.
  rushing_total_yards_from_scrimmage: Total yards from scrimmage for the player (rushing plus receiving yards) as reported
    in the rushing category.
  rushing_two_point_rush_convs: Number of successful two-point conversions the player converted via a rushing play.
  rushing_two_pt_rush: Indicator or count of two-point conversion rushing attempts recorded for the player.
  rushing_two_pt_rush_attempts: Total number of two-point conversion attempts the player made via a rushing play.
  rushing_yards_from_scrimmage_per_game: Average yards from scrimmage per game for the player as reported in the rushing category.
  rushing_yards_per_game: Average rushing yards per game for the player, equivalent to rushing_rushing_yards_per_game.
  rushing_yards_per_rush_attempt: Average yards gained per rushing attempt for the player, calculated as rushing yards divided
    by attempts.
  scoring_defensive_points: Total points scored by the player through defensive plays such as defensive touchdowns, safeties,
    or fumble-return scores.
  scoring_field_goals: Total number of field goals made by the player in the scoring category.
  scoring_kick_extra_points: Total number of extra point attempts kicked by the player.
  scoring_kick_extra_points_made: Total number of successful extra points (PATs) kicked by the player.
  scoring_misc_points: Points scored by the player through miscellaneous means not captured by standard scoring categories.
  scoring_one_pt_safeties_made: Number of one-point safeties scored by the player's team, credited in the scoring category.
  scoring_passing_touchdowns: Total touchdown passes thrown by the player as counted in the scoring category.
  scoring_receiving_touchdowns: Total touchdown receptions scored by the player as counted in the scoring category.
  scoring_return_touchdowns: Total touchdowns scored by the player on kick or punt returns as counted in the scoring category.
  scoring_rushing_touchdowns: Total rushing touchdowns scored by the player as counted in the scoring category.
  scoring_total_points: Total points scored by the player across all scoring methods during the stat period.
  scoring_total_points_per_game: Average total points scored by the player per game during the stat period.
  scoring_total_touchdowns: Total touchdowns scored by the player across all methods (passing, rushing, receiving, and return)
    in the scoring category.
  scoring_total_two_point_convs: Total number of successful two-point conversions scored by the player across passing, rushing,
    and receiving attempts.
  scoring_two_point_pass_convs: Number of successful two-point conversions the player scored via a passing play, as counted
    in the scoring category.
  scoring_two_point_rec_convs: Number of successful two-point conversions the player scored via a reception, as counted in
    the scoring category.
  scoring_two_point_rush_convs: Number of successful two-point conversions the player scored via a rushing play, as counted
    in the scoring category.
espn_cfb_schedule:
  away_current_rank: AP or Coaches Poll ranking of the away team at the time of the game (null if unranked).
  away_linescores: Per-period point totals for the away team, stored as an array of quarter/overtime scores.
  away_records: Win-loss record of the away team at the time of the game, as reported by ESPN (e.g., overall or conference
    record).
  date_valid: Boolean flag indicating whether the game's scheduled date is confirmed and valid.
  home_current_rank: AP or Coaches Poll ranking of the home team at the time of the game (null if unranked).
  home_linescores: Per-period point totals for the home team, stored as an array of quarter/overtime scores.
  home_records: Win-loss record of the home team at the time of the game, as reported by ESPN (e.g., overall or conference
    record).
  venue_address_country: Country in which the game venue is located, as provided by ESPN's venue data.
espn_mbb_game_rosters:
  athlete_href: ESPN API URL pointing to the full athlete resource for this player.
  birth_country_alternate_id: Alternate identifier for the player's birth country as provided by ESPN.
  flag_alt: Alt-text string for the player's country flag image, typically the country name.
  flag_href: URL to the player's country flag image as supplied by ESPN.
  flag_rel: Relationship descriptor for the country flag link, indicating the link type (e.g., 'country-flag').
  jersey_right: Right-justified or secondary jersey number display string for the player.
  position_href: ESPN API URL pointing to the full position resource for this player's role.
  statistics_href: ESPN API URL pointing to the player's statistics resource for this game.
  team_alternate_ids_sdr: Alternate team identifier from ESPN's SDR (Sports Data Repository) system.
espn_mbb_player_stats:
  offensive_second_chance_points: Total points scored by the player on second-chance opportunities following an offensive
    rebound.
espn_mbb_schedule:
  away_current_rank: Current national poll ranking of the away team at the time of the game, or null if unranked.
  away_linescores: Period-by-period scoring breakdown for the away team, serialized as a packed integer sequence.
  away_records: Win-loss record string(s) for the away team across applicable record categories (e.g., overall, conference).
  home_current_rank: Current national poll ranking of the home team at the time of the game, or null if unranked.
  home_linescores: Period-by-period scoring breakdown for the home team, serialized as a packed integer sequence.
  home_records: Win-loss record string(s) for the home team across applicable record categories (e.g., overall, conference).
espn_mlb_player_stats:
  batting_bipa: Batting average on balls in the air (fly balls and line drives), measuring in-play success on airborne contact.
  batting_mlb_rating: ESPN's composite MLB rating for the batter reflecting overall offensive performance.
  batting_off_warbr: Offensive Wins Above Replacement (Baseball Reference methodology) attributable to the batter's hitting
    contributions.
  batting_patience_ratio: Ratio of walks to strikeouts, measuring a batter's plate discipline and ability to work counts.
  batting_runs_created_per27_outs: Bill James Runs Created per 27 outs, estimating how many runs a lineup of this batter would
    score per game.
  batting_warbr: Total Wins Above Replacement (Baseball Reference methodology) for the batter including offense and baserunning.
  fielding_assists: Number of assists recorded by the fielder when a thrown ball contributes to an out.
  fielding_balls_in_zone: Number of batted balls that entered the fielder's defined defensive zone.
  fielding_catcher_caught_stealing: Number of opposing baserunners thrown out attempting to steal a base by this catcher.
  fielding_catcher_caught_stealing_pct: Percentage of opposing stolen base attempts that resulted in the catcher throwing
    out the runner.
  fielding_catcher_earned_runs: Earned runs allowed while this catcher was behind the plate, used in catcher ERA calculations.
  fielding_catcher_era: ERA of pitchers while this specific catcher was behind the plate over the season.
  fielding_catcher_stolen_bases_allowed: Number of successful stolen bases allowed by the catcher during the season.
  fielding_catcher_third_innings_played: Total one-third innings played behind the plate by the catcher, expressed in thirds.
  fielding_def_warbr: Defensive Wins Above Replacement (Baseball Reference methodology) attributable to the player's fielding.
  fielding_double_plays: Number of double plays the fielder participated in during the season.
  fielding_errors: Number of fielding errors charged to the player during the season.
  fielding_extra_bases: Extra bases allowed by the outfielder due to errors or misplays on balls hit into their zone.
  fielding_fielding_pct: Fielding percentage calculated as successful chances divided by total chances (putouts + assists
    + errors).
  fielding_full_innings_played: Number of complete innings (three outs per side) the player appeared in the field.
  fielding_games_played: Number of games in which the player appeared defensively at their position.
  fielding_games_started: Number of games the player started at their primary defensive position.
  fielding_hits: Number of hits recorded while this fielder was positioned, relevant for zone-rating calculations.
  fielding_is_qualified: Indicator flag for whether the player meets minimum innings requirements to qualify for fielding
    rate stats.
  fielding_is_qualified_catcher: Indicator flag for whether the catcher meets the minimum innings threshold to qualify for
    catcher-specific rate stats.
  fielding_is_qualified_pitcher: Indicator flag for whether the pitcher qualifies for pitcher fielding rate statistics.
  fielding_opportunities: Total fielding opportunities defined as putouts plus assists plus errors for the player.
  fielding_outfield_assists: Number of outfield assists, recorded when an outfielder throws out a runner.
  fielding_outs_made: Total outs the fielder was directly responsible for recording during the season.
  fielding_outs_on_field: Total outs recorded across all innings the player was present on the field.
  fielding_part_innings_played: Number of fractional (partial) innings the player appeared in the field, expressed as a count
    of thirds.
  fielding_passed_balls: Number of pitches ruled as passed balls charged to the catcher during the season.
  fielding_pickoffs: Number of baserunners picked off by pitchers while this catcher was behind the plate or this fielder
    was at their position.
  fielding_putouts: Number of putouts recorded by the fielder where they made the final play to retire a batter or runner.
  fielding_range_factor: Range factor per nine innings (putouts + assists) / innings * 9, measuring a fielder's defensive
    range.
  fielding_successful_chances: Total successful fielding chances defined as putouts plus assists (errors excluded).
  fielding_team_games_played: Number of games the player's team played while the player was on the active roster.
  fielding_total_bases: Total bases allowed by the outfielder on balls hit into their zone, used in advanced defensive metrics.
  fielding_total_chances: Total fielding chances (putouts + assists + errors) offered to the player during the season.
  fielding_triple_plays: Number of triple plays in which the fielder participated during the season.
  fielding_zone_rating: Percentage of batted balls in the fielder's defined zone that were successfully converted into outs.
espn_nba_player_stats:
  defensive_avg48_blocks: Player's average blocked shots per 48 minutes played.
  defensive_avg48_defensive_rebounds: Player's average defensive rebounds per 48 minutes played.
  defensive_avg48_steals: Player's average steals per 48 minutes played.
  general_avg48_disqualifications: Player's average disqualifications (fouling out) per 48 minutes played.
  general_avg48_ejections: Player's average ejections per 48 minutes played.
  general_avg48_flagrant_fouls: Player's average flagrant fouls assessed per 48 minutes played.
  general_avg48_fouls: Player's average personal fouls committed per 48 minutes played.
  general_avg48_rebounds: Player's average total rebounds (offensive + defensive) per 48 minutes played.
  general_avg48_technical_fouls: Player's average technical fouls assessed per 48 minutes played.
  offensive_avg48_assists: Player's average assists per 48 minutes played.
  offensive_avg48_field_goals_attempted: Player's average field goal attempts per 48 minutes played.
  offensive_avg48_field_goals_made: Player's average field goals made per 48 minutes played.
  offensive_avg48_free_throws_attempted: Player's average free throw attempts per 48 minutes played.
  offensive_avg48_free_throws_made: Player's average free throws made per 48 minutes played.
  offensive_avg48_offensive_rebounds: Player's average offensive rebounds per 48 minutes played.
  offensive_avg48_points: Player's average points scored per 48 minutes played.
  offensive_avg48_three_point_field_goals_attempted: Player's average three-point field goal attempts per 48 minutes played.
  offensive_avg48_three_point_field_goals_made: Player's average three-point field goals made per 48 minutes played.
  offensive_avg48_turnovers: Player's average turnovers committed per 48 minutes played.
espn_nba_schedule:
  away_linescores: Period-by-period point totals for the away team, stored as a list of integer scores.
  away_records: Win-loss record strings for the away team across relevant splits (e.g., overall, home/away, conference).
  home_linescores: Period-by-period point totals for the home team, stored as a list of integer scores.
  home_records: Win-loss record strings for the home team across relevant splits (e.g., overall, home/away, conference).
espn_nfl_game_rosters:
  athlete_href: ESPN API hyperlink reference URL for the athlete resource.
  college_athlete_href: ESPN API hyperlink reference URL for the athlete's college profile resource.
  contract_bonus: Signing or roster bonus amount (in dollars) associated with the player's current contract.
  contract_href: ESPN API hyperlink reference URL for the player's full contract resource.
  contract_season_href: ESPN API hyperlink reference URL for the specific season-level contract detail resource.
  contract_signed_through: Final year of the player's current contract, expressed as a four-digit season year.
  contract_team_href: ESPN API hyperlink reference URL for the team associated with the player's contract.
  contracts_href: ESPN API hyperlink reference URL for the full list of the player's historical contract records.
  draft_pick_href: ESPN API hyperlink reference URL for the draft-pick record associated with this player.
  draft_team_href: ESPN API hyperlink reference URL for the team that originally drafted this player.
  jersey_right: Secondary or alternate jersey number display string used by ESPN (e.g., for special-game uniforms).
  position_href: ESPN API hyperlink reference URL for the player's positional classification resource.
  projections_href: ESPN API hyperlink reference URL for the player's statistical projection resource.
  statistics_href: ESPN API hyperlink reference URL for the player's career statistics resource.
  team_alternate_ids_sdr: SportsDataverse SDR alternate identifier for the team, used for cross-source joins.
espn_nfl_player_stats:
  defensive_assist_tackles: Number of assisted tackles credited to the player (helped bring down the ball carrier but was
    not the primary tackler).
  defensive_avg_interception_yards: Average yards gained per interception returned by the player.
  defensive_avg_sack_yards: Average yards lost per sack the player recorded against the opposing quarterback.
  defensive_avg_stuff_yards: Average yards lost per run stuff (tackle behind the line of scrimmage) recorded by the player.
  defensive_blocked_field_goal_touchdowns: Number of touchdowns scored by the player after blocking an opponent's field goal
    attempt and returning it.
  defensive_blocked_punt_ez_rec_td: Number of touchdowns scored by recovering a blocked punt in the end zone.
  defensive_blocked_punt_touchdowns: Number of touchdowns scored by the player after blocking an opponent's punt and returning
    it.
  defensive_hurries: Number of times the player pressured the quarterback into an early or errant throw without recording
    a sack.
  defensive_interceptions_interception_touchdowns: Number of touchdowns scored by the player on interception returns.
  defensive_interceptions_interception_yards: Total yards gained by the player on interception returns.
  defensive_interceptions_interceptions: Total number of passes intercepted by the player.
  defensive_kicks_blocked: Total number of kicks (field goals or extra points) the player blocked.
  defensive_long_interception: Longest single interception return in yards recorded by the player.
  defensive_misc_touchdowns: Number of defensive touchdowns scored via miscellaneous means not captured by other specific
    categories.
  defensive_missed_field_goal_return_td: Number of touchdowns scored by returning a missed field goal attempt.
  defensive_one_pt_safeties_made: Number of one-point safeties recorded by the player's defense (scored when the opposing
    team is downed in their own end zone during a try).
  defensive_passes_batted_down: Number of passes the player knocked down at the line of scrimmage without recording an interception.
  defensive_passes_defended: Total number of passes the player broke up or deflected, including both pass deflections and
    interceptions.
  defensive_points_allowed: Total points allowed by the player's team during games the player appeared in.
  defensive_qb_hits: Number of times the player legally hit the quarterback during or just after a pass attempt.
  defensive_sack_yards: Total yards lost by the opposing offense as a result of the player's sacks.
  defensive_safeties: Number of safeties recorded by the player (tackling the ball carrier in their own end zone).
  defensive_solo_tackles: Number of unassisted tackles credited solely to the player.
  defensive_stuff_yards: Total yards lost by the offense on run stuffs recorded by the player.
  defensive_stuffs: Number of times the player tackled a ball carrier for a loss on a rushing play.
  defensive_tackles_for_loss: Total number of tackles resulting in a loss of yards for the opposing offense.
  defensive_tackles_yards_lost: Total yards lost by the opposing offense on the player's tackles for loss.
  defensive_team_games_played: Number of games played by the player's team in which the player appeared on the defensive side.
  defensive_total_tackles: Combined total of solo tackles and assisted tackles recorded by the player.
  defensive_two_pt_returns: Number of two-point conversion attempts the player's defense returned for a defensive conversion
    score.
  defensive_yards_allowed: Total yards allowed by the player's defense during games the player appeared in.
  general_defensive_fumbles_touchdowns: Number of touchdowns scored by recovering or returning an opponent's fumble on the
    defensive side.
  general_fumbles: Total number of times the player fumbled the ball regardless of who recovered it.
  general_fumbles_forced: Number of fumbles the player forced from opposing ball carriers.
  general_fumbles_forced_primary: Number of fumbles forced where the player was credited as the primary forcer rather than
    an assist.
  general_fumbles_lost: Number of fumbles by the player that were subsequently recovered by the opposing team.
  general_fumbles_recovered: Number of fumbles (own or opponent's) recovered by the player.
  general_fumbles_recovered_yards: Total yards gained on fumble recoveries returned by the player.
  general_fumbles_touchdowns: Number of touchdowns scored by the player on fumble recoveries.
  general_offensive_fumbles_touchdowns: Number of touchdowns scored by recovering an offensive team fumble (e.g., a fumble
    recovered in the end zone).
  general_offensive_two_pt_returns: Number of two-point conversion attempts the player's offense returned defensively for
    a score.
  passing_adj_qbr: ESPN's Adjusted Total Quarterback Rating, which adjusts raw QBR for opponent strength and clutch situations
    on a 0–100 scale.
  passing_avg_gain: Average yards gained per passing attempt including sacks.
  passing_completion_pct: Percentage of pass attempts that resulted in a completed reception (completions divided by attempts).
  passing_espnqb_rating: ESPN's proprietary composite quarterback rating blending efficiency, usage, and situational performance
    into a single metric.
  passing_interception_pct: Percentage of pass attempts that resulted in an interception (interceptions divided by attempts).
  passing_interceptions: Total number of passes thrown that were intercepted by the opposing defense.
  passing_long_passing: Longest completed pass in yards recorded by the player during the period.
  passing_net_passing_attempts: Total pass attempts minus sacks taken, representing meaningful dropbacks.
  passing_net_passing_yards: Passing yards minus yards lost on sacks, giving a net aerial production figure.
  passing_net_passing_yards_per_game: Net passing yards (after sack yardage deduction) per game played.
  passing_net_total_yards: Combined net rushing and net passing yards accumulated by the player.
  passing_net_yards_per_game: Net total offensive yards (rushing plus net passing) per game.
  passing_net_yards_per_pass_attempt: Net passing yards divided by total pass attempts including sacks, penalizing passers
    for yardage lost in the pocket.
  passing_passing_attempts: Total number of pass attempts thrown by the player.
  passing_passing_big_plays: Number of passing plays that gained 20 or more yards.
  passing_passing_first_downs: Number of pass completions that resulted in a first down.
  passing_passing_fumbles: Number of times the player fumbled while in the act of passing or being sacked.
  passing_passing_fumbles_lost: Number of passing-related fumbles that were recovered by the opposing team.
  passing_passing_touchdown_pct: Percentage of pass attempts that resulted in a touchdown (touchdowns divided by attempts).
  passing_passing_touchdowns: Total number of touchdown passes thrown by the player.
  passing_passing_yards: Total aerial yards gained on completions thrown by the player.
  passing_passing_yards_after_catch: Total yards gained by receivers after catching the ball on passes thrown by the player.
  passing_passing_yards_at_catch: Total yards gained through the air (prior to the catch) on completions thrown by the player.
  passing_passing_yards_per_game: Gross passing yards per game played by the quarterback.
  passing_qb_rating: Traditional NFL passer rating computed from completion percentage, yards per attempt, touchdown percentage,
    and interception percentage on a roughly 0–158.3 scale.
  passing_quarterback_rating: Alternate or supplemental quarterback rating value; may represent a different calculation context
    from passing_qb_rating (e.g., situational or opponent-adjusted).
  passing_sack_yards_lost: Total yards lost by the player as a result of being sacked behind the line of scrimmage.
  passing_sacks: Total number of times the player was sacked behind the line of scrimmage while attempting to pass.
  passing_team_games_played: Number of games played by the player's team during which the player accumulated passing statistics.
  passing_total_offensive_plays: Total number of offensive plays (pass attempts, rushes, and sacks) run with the player as
    the primary ball handler.
  passing_total_points_per_game: Average total points scored by the player's team per game.
  passing_total_touchdowns: Total touchdowns (passing, rushing, and receiving) scored by or credited to the player.
  passing_total_yards: Combined total of passing, rushing, and receiving yards accumulated by the player.
  passing_total_yards_from_scrimmage: Total yards from scrimmage (rushing plus receiving) credited to the player in addition
    to passing yards.
  passing_two_point_pass_convs: Number of successful two-point conversion attempts thrown by the player.
  passing_two_pt_pass: Number of two-point conversion passes the player successfully completed.
  passing_two_pt_pass_attempts: Number of two-point conversion pass attempts thrown by the player regardless of outcome.
  passing_yards_from_scrimmage_per_game: Yards from scrimmage (rushing plus receiving) per game for a player who also has
    passing statistics recorded.
  passing_yards_per_completion: Average yards gained per completed pass attempt.
  passing_yards_per_game: Gross passing yards per game (equivalent to passing_passing_yards_per_game; alternate label).
  passing_yards_per_pass_attempt: Gross passing yards divided by total pass attempts, not penalizing for sacks.
  receiving_avg_gain: Average yards gained per reception by the player.
  receiving_espnwr_rating: ESPN's proprietary composite wide receiver / pass-catcher rating blending efficiency and usage
    metrics.
  receiving_long_reception: Longest single reception in yards recorded by the player during the period.
  receiving_net_total_yards: Combined net rushing and receiving yards accumulated by the player.
  receiving_net_yards_per_game: Net total offensive yards (rushing plus receiving) per game for the player.
  receiving_receiving_big_plays: Number of receptions that gained 20 or more yards.
  receiving_receiving_first_downs: Number of receptions that resulted in a first down.
  receiving_receiving_fumbles: Number of times the player fumbled after making a reception.
  receiving_receiving_fumbles_lost: Number of post-reception fumbles by the player that were recovered by the opposing team.
  receiving_receiving_targets: Total number of times the player was the intended target of a pass attempt.
  receiving_receiving_touchdowns: Total number of touchdown receptions credited to the player.
  receiving_receiving_yards: Total yards gained by the player on all receptions.
  receiving_receiving_yards_after_catch: Total yards gained by the player after making contact with the ball (yards after
    catch).
  receiving_receiving_yards_at_catch: Total air yards at the point of the catch (depth of target) on receptions by the player.
  receiving_receiving_yards_per_game: Receiving yards per game played by the player.
  receiving_receptions: Total number of passes successfully caught by the player.
  receiving_team_games_played: Number of games played by the player's team during which the player accumulated receiving statistics.
  receiving_total_offensive_plays: Total number of offensive plays run during which the player was active on the field.
  receiving_total_points_per_game: Average total points scored by the player's team per game (context for the receiver's role).
  receiving_total_touchdowns: Total touchdowns (rushing and receiving) scored by the player.
  receiving_total_yards: Combined total rushing and receiving yards accumulated by the player.
  receiving_total_yards_from_scrimmage: Total yards from scrimmage (rushing plus receiving) credited to the player.
  receiving_two_point_rec_convs: Number of successful two-point conversion receptions caught by the player.
  receiving_two_pt_reception: Number of two-point conversion passes the player successfully caught.
  receiving_two_pt_reception_attempts: Number of two-point conversion targets thrown to the player regardless of outcome.
  receiving_yards_from_scrimmage_per_game: Total yards from scrimmage per game for the player.
  receiving_yards_per_game: Receiving yards per game (equivalent label to receiving_receiving_yards_per_game).
  receiving_yards_per_reception: Average yards gained per reception, also known as yards per catch.
  rushing_avg_gain: Average yards gained per rushing attempt by the player.
  rushing_espnrb_rating: ESPN's proprietary composite running back rating blending efficiency and usage metrics.
  rushing_long_rushing: Longest single rushing play in yards recorded by the player during the period.
  rushing_net_total_yards: Combined net rushing and receiving yards accumulated by the player.
  rushing_net_yards_per_game: Net total offensive yards per game for the player.
  rushing_rushing_attempts: Total number of rushing attempts carried by the player.
  rushing_rushing_big_plays: Number of rushing plays that gained 10 or more yards.
  rushing_rushing_first_downs: Number of rushing attempts that resulted in a first down.
  rushing_rushing_fumbles: Number of times the player fumbled while carrying the ball on a rushing play.
  rushing_rushing_fumbles_lost: Number of rushing fumbles by the player that were recovered by the opposing team.
  rushing_rushing_touchdowns: Total number of rushing touchdowns scored by the player.
  rushing_rushing_yards: Total yards gained by the player on all rushing attempts.
  rushing_rushing_yards_per_game: Rushing yards per game played by the player.
  rushing_stuff_yards_lost: Total yards lost on rushing plays where the player was tackled behind the line of scrimmage (stuffed).
  rushing_stuffs: Number of rushing attempts where the player was tackled at or behind the line of scrimmage.
  rushing_team_games_played: Number of games played by the player's team during which the player accumulated rushing statistics.
  rushing_total_offensive_plays: Total number of offensive plays run with the player active in a rushing role.
  rushing_total_points_per_game: Average total points scored by the player's team per game.
  rushing_total_touchdowns: Total touchdowns (rushing and receiving) scored by the player.
  rushing_total_yards: Combined total rushing and receiving yards accumulated by the player.
  rushing_total_yards_from_scrimmage: Total yards from scrimmage (rushing plus receiving) credited to the player.
  rushing_two_point_rush_convs: Number of successful two-point conversion rushes scored by the player.
  rushing_two_pt_rush: Number of two-point conversion rushes the player successfully converted.
  rushing_two_pt_rush_attempts: Number of two-point conversion rush attempts by the player regardless of outcome.
  rushing_yards_from_scrimmage_per_game: Total yards from scrimmage per game for the player.
  rushing_yards_per_game: Rushing yards per game (equivalent label to rushing_rushing_yards_per_game).
  rushing_yards_per_rush_attempt: Average yards gained per rushing attempt by the player.
  scoring_defensive_points: Total points scored by the player's defense via safeties, defensive touchdowns, and blocked kick
    returns.
  scoring_field_goals: Total number of field goals successfully made by the player during the period.
  scoring_kick_extra_points: Total number of extra point attempts (PAT kicks) by the player.
  scoring_kick_extra_points_made: Total number of extra points successfully kicked through the uprights by the player.
  scoring_misc_points: Points scored via miscellaneous methods not captured by other scoring categories.
  scoring_one_pt_safeties_made: Number of one-point safeties recorded, scored when the defense stops an offense that is attempting
    a two-point conversion in their own end zone.
  scoring_passing_touchdowns: Total passing touchdowns thrown by the player, contributing to their total scoring line.
  scoring_receiving_touchdowns: Total receiving touchdowns scored by the player.
  scoring_return_touchdowns: Total touchdowns scored by the player on kick or punt returns.
  scoring_rushing_touchdowns: Total rushing touchdowns scored by the player.
  scoring_total_points: Total points contributed by the player across all scoring methods (touchdowns, PATs, field goals,
    etc.).
  scoring_total_points_per_game: Average total points contributed by the player per game.
  scoring_total_touchdowns: Total touchdowns scored or thrown by the player across all methods.
  scoring_total_two_point_convs: Total number of successful two-point conversions scored or thrown by the player.
  scoring_two_point_pass_convs: Number of successful two-point conversion passes thrown by the player.
  scoring_two_point_rec_convs: Number of successful two-point conversion receptions caught by the player.
  scoring_two_point_rush_convs: Number of successful two-point conversion rushes scored by the player.
espn_nfl_schedule:
  away_current_rank: Current AP or ESPN power ranking of the away team at the time of the game.
  away_linescores: Comma-separated or serialized quarter-by-quarter score totals for the away team.
  away_records: Serialized win-loss-tie record(s) for the away team (e.g., overall, home, away, conference).
  home_current_rank: Current AP or ESPN power ranking of the home team at the time of the game.
  home_linescores: Comma-separated or serialized quarter-by-quarter score totals for the home team.
  home_records: Serialized win-loss-tie record(s) for the home team (e.g., overall, home, away, conference).
  status_is_tbd_flex: Boolean flag indicating whether the game's broadcast slot is designated as a flex/TBD window.
  venue_address_country: Two-letter ISO country code or country name for the country where the venue is located.
espn_nhl_game_rosters:
  athlete_href: ESPN API hypermedia URL linking to the full athlete resource for this player, usable to fetch detailed biographical
    and statistical data.
  contracts_href: ESPN API hypermedia URL pointing to the contract history resource for this player.
  draft_team_href: ESPN API hypermedia URL linking to the team that originally drafted this player.
  jersey_right: Right-aligned display string for the player's jersey number, used in ESPN scoreboard rendering contexts.
  position_href: ESPN API hypermedia URL pointing to the position resource that defines this player's positional classification.
  statistics_href: ESPN API hypermedia URL linking to the statistics resource for this player's season or career totals.
  team_alternate_ids_sdr: Alternate team identifier from the ESPN SDR (Sports Data Repository) system, used to cross-reference
    team records across ESPN data sources.
espn_nhl_player_stats:
  defensive_avg_goals_against: Average goals allowed per game by a goaltender over the selected season and season type, equivalent
    to goals-against average (GAA).
  defensive_avg_shots_against: Average number of shots on goal faced by a goaltender per game over the selected season and
    season type.
  defensive_blocked_shots: Total number of shots blocked by a skater before reaching the goaltender over the selected season
    and season type.
  defensive_empty_net_goals_against: Number of goals allowed by a goaltender into an empty net (opponent pulled goalie) over
    the selected season and season type.
  defensive_even_strength_saves: Total saves made by a goaltender while both teams were at full strength (5-on-5) over the
    selected season and season type.
  defensive_goals_against: Total goals allowed by a goaltender over the selected season and season type.
  defensive_hits: Total body checks delivered by a skater over the selected season and season type as tracked by ESPN.
  defensive_overtime_losses: Number of games a goaltender's team lost in overtime (OT or shootout) while the goaltender was
    the decision goalie over the selected season.
  defensive_power_play_saves: Total saves made by a goaltender while the opponent had a power-play advantage over the selected
    season and season type.
  defensive_save_pct: Percentage of shots stopped by a goaltender, calculated as saves divided by shots against, over the
    selected season and season type.
  defensive_saves: Total saves made by a goaltender across all game situations over the selected season and season type.
  defensive_shootout_save_pct: Percentage of shootout attempts stopped by a goaltender, calculated as shootout saves divided
    by shootout shots faced over the season.
  defensive_shootout_saves: Total number of shootout attempts stopped by a goaltender over the selected season and season
    type.
  defensive_shootout_shots_against: Total number of penalty-shootout attempts faced by a goaltender over the selected season
    and season type.
  defensive_short_handed_saves: Total saves made by a goaltender while the goaltender's team was short-handed (killing a penalty)
    over the selected season and season type.
  defensive_shots_against: Total shots on goal faced by a goaltender across all game situations over the selected season and
    season type.
  defensive_shutouts: Total number of games in which a goaltender allowed zero goals over the selected season and season type.
  general_game_started: Number of games in which the player was the starting goaltender over the selected season and season
    type.
  general_losses: Total regulation-time losses recorded by a goaltender as the decision goalie over the selected season and
    season type.
  general_production: Composite production metric combining goals, assists, and other scoring contributions for a skater,
    as defined by ESPN, over the selected season.
  general_shifts: Total number of shifts a skater took during the selected season and season type.
  general_shifts_per_game: Average number of shifts per game taken by a skater over the selected season and season type.
  general_team_games_played: Total number of regular-season or playoff games played by the player's team during the selected
    season and season type.
  general_ties: Number of games that ended in a tie credited to a goaltender, applicable to seasons before the NHL eliminated
    ties in 2005-06.
  general_time_on_ice: Cumulative time on ice for a skater or goaltender across all games in the selected season and season
    type, in total seconds or minutes as provided by ESPN.
  general_time_on_ice_per_game: Average time on ice per game for a skater or goaltender over the selected season and season
    type.
  general_wins: Total wins recorded by a goaltender as the decision goalie over the selected season and season type.
  offensive_avg_goals: Average goals scored per game by a skater over the selected season and season type.
  offensive_avg_shots: Average shots on goal taken per game by a skater over the selected season and season type.
  offensive_faceoff_percent: Percentage of faceoffs won by the player, calculated as faceoffs won divided by total faceoffs
    taken, over the selected season and season type.
  offensive_faceoffs_lost: Total number of faceoffs lost by the player over the selected season and season type.
  offensive_faceoffs_won: Total number of faceoffs won by the player over the selected season and season type.
  offensive_game_tying_goals: Number of goals scored by a skater that tied the game at the time of the goal, over the selected
    season and season type.
  offensive_points_per_game: Average points (goals plus assists) earned per game by a skater over the selected season and
    season type.
  offensive_power_play_assists: Total assists recorded by a skater while on the power play over the selected season and season
    type.
  offensive_shootout_attempts: Total number of penalty-shootout attempts taken by a skater over the selected season and season
    type.
  offensive_shootout_goals: Total goals scored by a skater in penalty shootouts over the selected season and season type.
  offensive_shootout_shot_pct: Percentage of penalty-shootout attempts by a skater that resulted in a goal over the selected
    season and season type.
  offensive_short_handed_assists: Total assists recorded by a skater while killing a penalty (shorthanded) over the selected
    season and season type.
  offensive_short_handed_goals: Total goals scored by a skater while the player's team was shorthanded over the selected season
    and season type.
  offensive_total_face_offs: Total number of faceoffs taken by the player across all situations over the selected season and
    season type.
  penalties_avg_fights: Average number of fights per game involving the player over the selected season and season type, as
    tracked by ESPN.
  penalties_boarding_penalties: Total number of boarding infractions (hitting an opponent into the boards from behind) called
    against the player over the selected season and season type.
  penalties_charging_penalties: Total number of charging infractions (skating excessive distance to deliver a hit) called
    against the player over the selected season and season type.
  penalties_cross_checking_penalties: Total number of cross-checking infractions (using the shaft of the stick to check an
    opponent) called against the player over the selected season and season type.
  penalties_diving_penalties: Total number of diving or embellishment infractions called against the player over the selected
    season and season type.
  penalties_elbowing_penalties: Total number of elbowing infractions (using the elbow to check an opponent) called against
    the player over the selected season and season type.
  penalties_fighting_penalties: Total number of fighting majors assessed to the player over the selected season and season
    type.
  penalties_game_misconducts: Total number of game misconduct penalties assessed to the player, resulting in ejection, over
    the selected season and season type.
  penalties_goalie_interference_penalties: Total number of goalie interference infractions called against the player for impeding
    the goaltender over the selected season and season type.
  penalties_high_sticking_penalties: Total number of high-sticking infractions (stick contacting an opponent above the shoulders)
    called against the player over the selected season and season type.
  penalties_holding_penalties: Total number of holding infractions (impeding an opponent with the hands or arms) called against
    the player over the selected season and season type.
  penalties_hooking_penalties: Total number of hooking infractions (using the stick to impede an opponent's movement) called
    against the player over the selected season and season type.
  penalties_instigator_penalties: Total number of instigator penalties assessed to the player for initiating a fight over
    the selected season and season type.
  penalties_interference_penalties: Total number of interference infractions (impeding a player not in possession of the puck)
    called against the player over the selected season and season type.
  penalties_major_penalties: Total number of five-minute major penalties assessed to the player over the selected season and
    season type.
  penalties_match_penalties: Total number of match penalties assessed to the player for deliberately injuring an opponent,
    resulting in ejection, over the selected season and season type.
  penalties_minor_penalties: Total number of two-minute minor penalties assessed to the player over the selected season and
    season type.
  penalties_misconducts: Total number of ten-minute misconduct penalties assessed to the player over the selected season and
    season type.
  penalties_roughing_penalties: Total number of roughing infractions (unnecessary physical altercations after the whistle)
    called against the player over the selected season and season type.
  penalties_slashing_penalties: Total number of slashing infractions (swinging the stick at an opponent) called against the
    player over the selected season and season type.
  penalties_stick_holding_penalties: Total number of stick-holding infractions called against the player for grabbing an opponent's
    stick over the selected season and season type.
  penalties_time_between_fights: Average time elapsed between fights involving the player during the selected season and season
    type, as tracked by ESPN.
  penalties_tripping_penalties: Total number of tripping infractions (using a stick, arm, or leg to cause an opponent to fall)
    called against the player over the selected season and season type.
  penalties_unsportsmanlike_penalties: Total number of unsportsmanlike conduct penalties assessed to the player over the selected
    season and season type.
  rpi_losses: Total losses recorded under ESPN's RPI-based standings metric for the player's team over the selected season
    and season type.
  rpi_ot_losses: Overtime losses recorded under ESPN's RPI-based standings metric for the player's team over the selected
    season and season type.
  rpi_points: Standings points accumulated under ESPN's RPI-based standings metric for the player's team over the selected
    season and season type.
  rpi_points_against: Total goals or points allowed used in ESPN's RPI-based standings computation for the player's team over
    the selected season and season type.
  rpi_points_for: Total goals or points scored used in ESPN's RPI-based standings computation for the player's team over the
    selected season and season type.
  rpi_power_rank: ESPN Power Rank position for the player's team within the selected season and season type, derived from
    the RPI standings model.
  rpi_rpi: Rating Percentage Index (RPI) value for the player's team, reflecting strength of schedule and win/loss record,
    over the selected season and season type.
  rpi_sos: Strength of Schedule (SOS) component of the ESPN RPI calculation for the player's team over the selected season
    and season type.
  rpi_wins: Total wins recorded under ESPN's RPI-based standings metric for the player's team over the selected season and
    season type.
espn_nhl_schedule:
  away_linescores: Period-by-period goal totals for the away team, stored as an array of integer scores indexed by period.
  away_records: Serialized win-loss-overtime record string for the away team at the time of the scheduled game.
  home_linescores: Period-by-period goal totals for the home team, stored as an array of integer scores indexed by period.
  home_records: Serialized win-loss-overtime record string for the home team at the time of the scheduled game.
  venue_address_country: Country name or code for the country in which the game venue is located, as provided by ESPN's schedule
    endpoint.
espn_wbb_game_rosters:
  athlete_href: ESPN API resource URL for the athlete's full profile endpoint.
  birth_country_alternate_id: Alternate identifier for the athlete's country of birth used in ESPN's country-flag system.
  flag_alt: Alt-text string for the athlete's country-of-birth flag image, typically the country name.
  flag_href: URL of the SVG or PNG flag image representing the athlete's country of birth.
  flag_rel: Relationship descriptor for the athlete's country-of-birth flag link (e.g., "flag").
  jersey_right: Jersey number displayed on the right side of the roster card, used for alternate or secondary number representations.
  position_href: ESPN API resource URL for the athlete's position resource.
  statistics_href: ESPN API resource URL pointing to the athlete's statistics endpoint.
  team_alternate_ids_sdr: Alternate team identifier from ESPN's SDR (Sports Data Reference) system for the athlete's team.
espn_wbb_player_stats:
  offensive_second_chance_points: Points scored by the player on offensive-rebound put-back opportunities during the season.
espn_wbb_schedule:
  away_current_rank: Current AP/coaches poll ranking of the away team at the time of the game.
  away_linescores: Points scored by the away team in each period or half of the game.
  away_records: Win-loss record string for the away team at the time of the game.
  home_current_rank: Current AP/coaches poll ranking of the home team at the time of the game.
  home_linescores: Points scored by the home team in each period or half of the game.
  home_records: Win-loss record string for the home team at the time of the game.
espn_wnba_player_stats:
  defensive_avg48_blocks: Player's blocked shots per 48 minutes of play, drawn from the defensive statistical category.
  defensive_avg48_defensive_rebounds: Player's defensive rebounds per 48 minutes of play, drawn from the defensive statistical
    category.
  defensive_avg48_steals: Player's steals per 48 minutes of play, drawn from the defensive statistical category.
  general_avg48_disqualifications: Player's disqualifications (fouling out) per 48 minutes of play, drawn from the general
    statistical category.
  general_avg48_ejections: Player's ejections per 48 minutes of play, drawn from the general statistical category.
  general_avg48_flagrant_fouls: Player's flagrant fouls per 48 minutes of play, drawn from the general statistical category.
  general_avg48_fouls: Player's personal fouls per 48 minutes of play, drawn from the general statistical category.
  general_avg48_rebounds: Player's total rebounds (offensive plus defensive) per 48 minutes of play, drawn from the general
    statistical category.
  general_avg48_technical_fouls: Player's technical fouls per 48 minutes of play, drawn from the general statistical category.
  offensive_avg48_assists: Player's assists per 48 minutes of play, drawn from the offensive statistical category.
  offensive_avg48_field_goals_attempted: Player's field goal attempts per 48 minutes of play, drawn from the offensive statistical
    category.
  offensive_avg48_field_goals_made: Player's field goals made per 48 minutes of play, drawn from the offensive statistical
    category.
  offensive_avg48_free_throws_attempted: Player's free throw attempts per 48 minutes of play, drawn from the offensive statistical
    category.
  offensive_avg48_free_throws_made: Player's free throws made per 48 minutes of play, drawn from the offensive statistical
    category.
  offensive_avg48_offensive_rebounds: Player's offensive rebounds per 48 minutes of play, drawn from the offensive statistical
    category.
  offensive_avg48_points: Player's points scored per 48 minutes of play, drawn from the offensive statistical category.
  offensive_avg48_three_point_field_goals_attempted: Player's three-point field goal attempts per 48 minutes of play, drawn
    from the offensive statistical category.
  offensive_avg48_three_point_field_goals_made: Player's three-point field goals made per 48 minutes of play, drawn from the
    offensive statistical category.
  offensive_avg48_turnovers: Player's turnovers per 48 minutes of play, drawn from the offensive statistical category.
espn_wnba_schedule:
  away_linescores: Period-by-period point totals for the away team, stored as a list of integer scores.
  away_records: Win-loss record strings for the away team across relevant splits (e.g., overall, home/away, conference).
  home_linescores: Period-by-period point totals for the home team, stored as a list of integer scores.
  home_records: Win-loss record strings for the home team across relevant splits (e.g., overall, home/away, conference).
expansion_draft_picks:
  draft_picks: JSON-serialized list of players selected by this franchise in the NHL expansion draft.
franchisehistory:
  conf_titles: NBA or WNBA Stats value for conf titles in the franchisehistory result set.
  div_titles: NBA or WNBA Stats value for div titles in the franchisehistory result set.
  league_titles: NBA or WNBA Stats value for league titles in the franchisehistory result set.
  po_appearances: NBA or WNBA Stats value for playoff appearances in the franchisehistory result set.
franchiseleaders:
  ast_person_id: Stats API identifier for assists person identifier associated with this NBA or WNBA Stats row.
  ast_player: NBA or WNBA Stats value for assists player in the franchiseleaders result set.
  blk_person_id: Stats API identifier for blocks person identifier associated with this NBA or WNBA Stats row.
  blk_player: NBA or WNBA Stats value for blocks player in the franchiseleaders result set.
  pts_person_id: Stats API identifier for points person identifier associated with this NBA or WNBA Stats row.
  pts_player: Scoring or score-margin metric for points player in the requested NBA or WNBA Stats split.
  reb_person_id: Stats API identifier for rebounds person identifier associated with this NBA or WNBA Stats row.
  reb_player: Rebounding metric for rebounds player in the requested NBA or WNBA Stats split.
  stl_person_id: Stats API identifier for steals person identifier associated with this NBA or WNBA Stats row.
  stl_player: NBA or WNBA Stats value for steals player in the franchiseleaders result set.
game_changes:
  schedule_date: The calendar date for which schedule changes are being reported, identifying when rescheduled or suspended
    games occurred.
game_pace:
  hits_per9_inn: Average number of hits allowed per nine innings across all games in the sample period.
  pitches_per9_inn: Average number of pitches thrown per nine innings across all games in the sample period.
  plate_appearances_per9_inn: Average number of plate appearances occurring per nine innings across all games in the sample
    period.
  pr_portal_calculated_fields_time_per7_inn_game: Calculated average game time per seven-inning game as produced by the MLB
    Stats API pace portal.
  pr_portal_calculated_fields_time_per9_inn_game: Calculated average game time per nine-inning game as produced by the MLB
    Stats API pace portal.
  pr_portal_calculated_fields_total7_inn_games: Calculated total count of seven-inning games as tallied by the MLB Stats API
    pace portal.
  pr_portal_calculated_fields_total9_inn_games: Calculated total count of nine-inning games as tallied by the MLB Stats API
    pace portal.
  runs_per9_inn: Average number of runs scored per nine innings across all games in the sample period.
  time_per77_plate_appearances: Average time per 77 plate appearances, used as a normalized pace benchmark by MLB.
  time_per7_inn_game: Average elapsed clock time per seven-inning game formatted as hours and minutes.
  time_per7_inn_game_without_extra_inn: Average elapsed clock time per seven-inning game excluding games that went to extra
    innings.
  time_per9_inn: Average elapsed clock time per nine-inning game formatted as hours and minutes.
  total7_inn_games: Total number of seven-inning games played (including doubleheader games).
  total7_inn_games_completed_early: Number of seven-inning games that were called or completed before the full seven innings
    were played.
  total7_inn_games_scheduled: Total number of seven-inning games that were scheduled in the sample period.
  total7_inn_games_without_extra_inn: Number of seven-inning games completed without requiring extra innings.
  total9_inn_games: Total number of nine-inning games played in the sample period.
  total9_inn_games_completed_early: Number of nine-inning games that were called or suspended before completing nine full
    innings.
  total9_inn_games_scheduled: Total number of nine-inning games that were scheduled in the sample period.
  total9_inn_games_without_extra_inn: Number of nine-inning games completed without requiring extra innings.
game_timestamps:
  timecode: A timestamp string representing a specific point in time used to query the MLB Stats API for game state changes.
gamerotation:
  in_time_real: Real-time clock value when the player entered the game rotation stint.
  out_time_real: Real-time clock value when the player exited the game rotation stint.
  player_first: NBA or WNBA Stats value for player first in the gamerotation result set.
  player_last: NBA or WNBA Stats value for player last in the gamerotation result set.
  player_pts: Scoring or score-margin metric for player points in the requested NBA or WNBA Stats split.
  pt_diff: NBA or WNBA Stats value for pt diff in the gamerotation result set.
  usg_pct: Percentage or rate for usage percentage in the requested NBA or WNBA Stats split.
gm_career:
  active_gm: Indicates whether the general manager is currently active in an NHL front-office role.
  end_season_id: Season identifier (e.g., 20232024) for the last season the GM held the position.
  gm_of_the_year: Number of times the general manager won the NHL GM of the Year Award during their career.
  losses_in_ot: Number of games the GM's team lost in overtime during their tenure.
  losses_in_ot_plus_shootout: Combined total of overtime and shootout losses recorded during the GM's tenure.
  losses_in_shootout: Number of games the GM's team lost in the shootout portion of a tied game.
  road_games: Total number of away games played by the GM's team across their tenure.
  seasons: Total number of NHL seasons the general manager has served in the role.
  stanley_cup_final_appearances: Number of times the GM's team reached the Stanley Cup Final during their tenure.
  stanley_cups: Number of Stanley Cup championships won by the GM's franchise during their tenure.
  start_season_id: Season identifier (e.g., 20052006) for the first season the GM held the position.
  ties_in_ot: Number of overtime ties recorded under legacy rules during the GM's tenure.
  win_pctg: Career winning percentage for the GM, calculated as wins divided by total games decided.
  wins_in_ot: Number of games the GM's team won in overtime during their tenure.
  wins_in_ot_plus_shootout: Combined total of overtime and shootout wins recorded during the GM's tenure.
gm_franchise:
  active_gm: Indicates whether the general manager is currently active with the franchise.
  end_season_id: NHL season identifier for the last season the GM held the role with this franchise.
  gm_of_the_year: Number of NHL General Manager of the Year awards won during this franchise tenure.
  losses_in_ot: Number of regular-season overtime losses recorded by the franchise under this GM.
  losses_in_ot_plus_shootout: Combined overtime and shootout losses for the franchise during this GM's tenure.
  losses_in_shootout: Number of regular-season shootout losses recorded by the franchise under this GM.
  road_games: Total regular-season away games played by the franchise during this GM's tenure.
  seasons: Number of NHL seasons the GM held the role with this franchise.
  stanley_cup_final_appearances: Number of Stanley Cup Final appearances by the franchise during this GM's tenure.
  stanley_cups: Number of Stanley Cup championships won by the franchise under this GM.
  start_season_id: NHL season identifier for the first season the GM held the role with this franchise.
  ties_in_ot: Number of overtime ties recorded by the franchise under this GM (pre-shootout era).
  win_pctg: Overall win percentage for the franchise across all regular-season games during this GM's tenure.
  wins_in_ot: Number of regular-season overtime wins recorded by the franchise under this GM.
  wins_in_ot_plus_shootout: Combined overtime and shootout wins for the franchise during this GM's tenure.
goalie_5v5_detail:
  save_pctg5v5_details_save_pctg_close_league_avg: League-average 5-on-5 save percentage in close-score situations (one-goal
    games in the third period or overtime) for the current period.
  save_pctg5v5_details_save_pctg_close_percentile: Percentile rank of the goalie's 5-on-5 save percentage in close-score situations
    relative to all qualifying NHL goalies.
  save_pctg5v5_details_save_pctg_close_value: Goalie's 5-on-5 save percentage recorded specifically in close-score situations.
  save_pctg5v5_details_save_pctg_league_avg: League-average 5-on-5 save percentage across all NHL goalies for the current
    period.
  save_pctg5v5_details_save_pctg_percentile: Percentile rank of the goalie's overall 5-on-5 save percentage relative to all
    qualifying NHL goalies.
  save_pctg5v5_details_save_pctg_value: Goalie's overall 5-on-5 save percentage (saves divided by shots faced at even strength).
  save_pctg5v5_details_shots_league_avg: League-average number of 5-on-5 shots faced per game by NHL goalies for the current
    period.
  save_pctg5v5_details_shots_per60_league_avg: League-average rate of 5-on-5 shots faced per 60 minutes of even-strength ice
    time.
  save_pctg5v5_details_shots_per60_percentile: Percentile rank of the goalie's 5-on-5 shots-faced-per-60-minutes rate relative
    to all qualifying NHL goalies.
  save_pctg5v5_details_shots_per60_value: Goalie's rate of 5-on-5 shots faced per 60 minutes of even-strength ice time.
  save_pctg5v5_details_shots_percentile: Percentile rank of the goalie's 5-on-5 shots-faced count relative to all qualifying
    NHL goalies.
  save_pctg5v5_details_shots_value: Total number of 5-on-5 shots the goalie faced during the current period.
  save_pctg5v5_last10: Serialized last-10-game 5-on-5 save percentage trend data for the goalie.
goalie_comparison:
  player_games_played: Total number of regular-season or playoff games the goalie appeared in during the comparison period.
  player_goals_against_avg: Goalie's goals-against average — average goals allowed per 60 minutes of ice time.
  player_losses: Number of decisions recorded as losses for the goalie during the comparison period.
  player_overtime_losses: Number of losses the goalie suffered after regulation time, counting as an overtime loss in the
    standings.
  player_save_pctg: Overall save percentage for the goalie — proportion of shots faced that were stopped.
  player_shoots_catches: Handedness indicator showing which side the goalie catches (L = left-catch, R = right-catch).
  player_wins: Number of decisions recorded as wins for the goalie during the comparison period.
  save_pctg5v5_details_save_pctg: Goalie's save percentage in 5-on-5 even-strength situations only.
  save_pctg5v5_details_save_pctg_close: Save percentage in 5-on-5 situations where the game score was within one goal (close-game
    situations).
  save_pctg5v5_details_shots: Total number of shots the goalie faced in 5-on-5 situations during the comparison period.
  save_pctg5v5_details_shots_per60: Rate of shots faced per 60 minutes of 5-on-5 ice time, reflecting workload intensity.
  save_pctg5v5_last10: Serialized breakdown of the goalie's 5-on-5 save percentage across their last 10 games.
  save_pctg_details_games_above900: Number of games in which the goalie posted a save percentage above .900 during the comparison
    period.
  save_pctg_details_goals_against_avg: Goals-against average from the detailed save-percentage breakdown dataset for this
    goalie.
  save_pctg_details_pctg_games_above900: Proportion of the goalie's games (as a percentage) in which they achieved a save
    percentage above .900.
  save_pctg_details_point_pctg: Team points percentage in games started by this goalie, reflecting their contribution to standings.
  save_pctg_details_save_pctg: Overall save percentage from the detailed breakdown dataset, capturing all situations.
  save_pctg_last10: Serialized summary of the goalie's save percentage across their most recent 10 games.
  seasons_with_edge_stats: Serialized list of season identifiers for which EDGE player-tracking data is available for this
    goalie.
  shot_location_details: Serialized shot-zone breakdown detailing save rates from each ice region (slot, off-wing, etc.).
  shot_location_summary: High-level serialized summary of the goalie's save percentages grouped by shot location zone.
goalie_detail:
  player_games_played: Total number of regular-season games the goalie appeared in for the season covered by this NHL EDGE
    detail record.
  player_goals_against_avg: Goals-against average (GAA) for the goalie during the season, reflecting the average number of
    goals allowed per 60 minutes played.
  player_losses: Number of regulation losses credited to the goalie for the season in this NHL EDGE detail record.
  player_overtime_losses: Number of overtime or shootout losses (OTL) credited to the goalie during the season.
  player_save_pctg: Save percentage (SV%) for the goalie during the season, expressed as a decimal ratio of saves to shots
    faced.
  player_shoots_catches: Hand on which the goalie catches (glove side), typically 'L' for left or 'R' for right.
  player_wins: Number of wins credited to the goalie for the season in this NHL EDGE detail record.
