  player_goals: Number of goals scored by the skater during the relevant tracking period.
  player_shoots_catches: Side on which the skater shoots — L (left) or R (right).
  seasons_with_edge_stats: JSON-serialized list of NHL season identifiers for which EDGE puck-and-player tracking data is
    available for this skater.
