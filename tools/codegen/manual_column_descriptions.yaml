load_cfb_betting_lines:
  abbr: Selection/side this odds row applies to — a team abbreviation for spread and moneyline markets, or 'over'/'under'
    for total markets (the data is long-format, one row per book per selection per market_type).
  book: Name of the sportsbook or oddsmaker that provided the betting line.
  date_time: Date and time of the game to which the betting line applies, as a string.
  game_desc: Human-readable description of the game, typically including team names and context.
  lines: Numeric line for this row's market — the per-side point spread for spread markets or the over/under total points
    for total markets; null for moneyline rows.
  odds: American-odds price for this selection — the juice/vig on spread and total rows, or the moneyline price itself on
    moneyline rows.
  opening_lines: Opening numeric line for this row's market (per-side spread or over/under total points) before line movement;
    null for moneyline rows.
  opening_odds: Opening American-odds price for this selection before line movement (vig on spread/total rows, moneyline price
    on moneyline rows).
load_contracts:
  cols: Placeholder column retained in the contracts loader output schema; contains no meaningful data in this context.
load_depth_charts:
  club_code: Three-letter team abbreviation identifying the NFL club on the depth chart row.
  depth_position: Positional grouping label used to place the player on the team's official depth chart (e.g., 'QB', 'WR1',
    'ILB').
  depth_team: Numeric depth rank indicating whether the player is listed as the starter (1), backup (2), or further reserve
    on the depth chart.
  elias_id: Elias Sports Bureau identifier for the player, used by the NFL for official statistical tracking.
  formation: Offensive or defensive formation context in which the depth chart position applies (e.g., 'Shotgun', 'Nickel').
load_ftn_charting:
  n_defense_box: Number of defenders positioned in the box at the snap, as charted by FTN Data.
load_nfl_contracts:
  cols: Number of contract columns returned in the contracts dataset (metadata artifact from the loader).
load_nfl_depth_charts:
  club_code: Three-letter team abbreviation identifying the NFL club for this depth chart entry.
  depth_position: Specific positional slot on the depth chart (e.g., 'QB1', 'WR2') indicating where the player ranks.
  depth_team: Numeric depth rank (1 = starter, 2 = backup, etc.) of the player at their position.
  elias_id: Elias Sports Bureau player identifier used for official NFL record-keeping and statistics attribution.
  formation: Offensive or defensive formation label (e.g., 'Base 3-4', 'Nickel') associated with this depth chart grouping.
load_nfl_espn_qbr:
  epa_total: Total expected points added across the quarterback's plays (ESPN QBR EPA component).
  exp_sack: QBR points contribution adjustment from expected sacks.
  game_week: Week scope of the QBR aggregation; for season-level rows this is the season-summary tag.
  headshot_href: URL of the quarterback's ESPN headshot image.
  name_display: Quarterback's full display name.
  name_first: Quarterback's first name.
  name_last: Quarterback's last name.
  name_short: Abbreviated display name of the quarterback (e.g. 'P. Mahomes').
  pass: QBR points contribution from pass plays.
  penalty: QBR points contribution from penalties attributed to the quarterback.
  player_id: ESPN athlete identifier for the quarterback.
  pts_added: Points the quarterback added versus a league-average passer (ESPN QBR points-added component).
  qb_plays: Count of qualifying quarterback action plays used to compute QBR.
  qbr_raw: Raw (non-opponent-adjusted) QBR for the period.
  qbr_total: ESPN Total QBR on a 0-100 scale -- the headline opponent-adjusted quarterback rating.
  qualified: Whether the quarterback met ESPN's minimum action-play threshold to qualify for ranking.
  rank: Quarterback's rank by Total QBR among qualified passers for the period.
  run: QBR points contribution from designed runs and scrambles.
  sack: QBR points contribution from sacks taken.
  season: NFL season (year) the Total QBR record covers.
  season_type: Season segment for the record -- regular season or postseason.
  team: Full team name for the quarterback's team during the period.
  team_abb: Team abbreviation for the quarterback's team during the period.
load_nfl_ftn_charting:
  n_defense_box: Number of defenders aligned in the box at the time of the snap, as charted by FTN Data.
load_nfl_officials:
  game_key: Unique nflverse game identifier linking the officiating record to a specific NFL game.
load_nfl_pfr_advstats:
  def_times_blitzed: Number of times the defensive player sent additional rushers on a blitz during the game or season period.
  def_times_hitqb: Number of times the defensive player made contact with the quarterback (hit on the QB) during pass rushes.
  def_times_hurried: Number of times the defensive player hurried or pressured the quarterback without recording a sack.
  passing_bad_throw_pct: Percentage of a passer's attempts classified as bad throws (inaccurate, off-target, or uncatchable).
  passing_bad_throws: Total number of passes thrown by the passer that were classified as inaccurate or poor-quality throws
    per Pro Football Reference.
  passing_drop_pct: Percentage of a passer's catchable targets that were dropped by the intended receiver.
  passing_drops: Total number of catchable passes thrown by the passer that were dropped by receivers per Pro Football Reference.
  receiving_drop: Number of catchable targets the receiver dropped during the game or season period per Pro Football Reference.
  receiving_drop_pct: Percentage of the receiver's catchable targets that were dropped during the game or season period.
  times_pressured_pct: Percentage of the passer's dropbacks during which they faced pressure from the opposing defense.
  times_sacked: Total number of times the passer was sacked during the game or season period per Pro Football Reference.
load_nfl_pfr_def:
  air: Total air yards (depth of target) on passes thrown at the player in coverage, as tracked by Pro Football Reference.
  bats: Number of passes batted down at the line of scrimmage by the player.
  bltz: Number of snaps on which the player blitzed the quarterback, as recorded by Pro Football Reference.
  cmp: Number of passes completed by the opposing quarterback when targeting the player in coverage.
  cmp_percent: Completion percentage allowed by the player in coverage (completions divided by targets).
  comb: Total combined tackles (solo plus assisted) recorded by the player per Pro Football Reference.
  dadot: Depth of target air yards on defended passes — average distance downfield at the point of the throw when the player
    was in coverage.
  gs: Number of games the player started during the season or period covered by this row.
  hrry: Number of times the player hurried the opposing quarterback without recording a full sack, per Pro Football Reference.
  loaded: Indicator or metadata field from the Pro Football Reference data load, typically flagging the data source state
    or row completeness.
  m_tkl: Number of missed tackles attributed to the player by Pro Football Reference.
  m_tkl_percent: Percentage of tackle attempts the player missed out of total tackle opportunities.
  prss: Number of times the player pressured the quarterback (combining sacks, hits, and hurries) per Pro Football Reference.
  qbkd: Number of times the player knocked down the quarterback, making contact after or during a pass attempt.
  rat: Passer rating allowed by the player in coverage — the NFL passer rating of quarterbacks when targeting this defender.
  sk: Number of sacks recorded by the player, bringing the quarterback down behind the line of scrimmage.
  td: Number of touchdowns allowed by the player in coverage.
  tgt: Total number of times the player was the nearest defender on a pass attempt (targets in coverage) per Pro Football
    Reference.
  yac: Yards after catch allowed by the player — yards gained by receivers after the catch when the player was the nearest
    defender.
  yds: Total passing yards allowed by the player in coverage.
  yds_cmp: Average yards allowed per completion when the player was in coverage.
  yds_tgt: Average yards allowed per target thrown at the player in coverage.
load_nfl_pfr_pass:
  completed_air_yards: Total air yards on completed passes only, measuring how far the ball traveled downfield through the
    air to the point of completion.
  completed_air_yards_per_completion: Average air yards per completed pass, representing the passer's typical depth of target
    on successful throws.
  completed_air_yards_per_pass_attempt: Average completed air yards per pass attempt (including incompletions), a rate measure
    of downfield passing efficiency.
  intended_air_yards: Total air yards on all pass attempts including incompletions, measuring aggregate downfield targeting
    intent from Pro Football Reference.
  intended_air_yards_per_pass_attempt: Average intended air yards per pass attempt, capturing the passer's average depth of
    target regardless of completion outcome.
  pass_yards_after_catch: Total yards gained by receivers after the catch, isolating the yards generated after initial ball
    reception from Pro Football Reference.
  pass_yards_after_catch_per_completion: Average yards after catch per completion, measuring how much yardage receivers generate
    on the ground after catching the ball.
  scramble_yards_per_attempt: Average yards gained per scramble attempt by the quarterback, from Pro Football Reference advanced
    passing stats.
  scrambles: Total number of quarterback scrambles (designed dropback converted to a run) recorded by Pro Football Reference.
load_nfl_pfr_rec:
  adot: Average depth of target — mean air yards at point of throw on pass attempts directed at the receiver, per Pro Football
    Reference.
  brk_tkl: Number of broken tackles credited to the player after a reception, per Pro Football Reference.
  drop: Number of catchable passes the player dropped (failed to secure after the ball reached the receiver's hands).
  drop_percent: Percentage of catchable targets that the player dropped.
  gs: Number of games the player started at a receiver position during the period covered.
  loaded: Indicator or metadata field from the Pro Football Reference data load, flagging the row's data source state or completeness.
  rat: Passer rating generated on passes thrown to the player — the NFL passer rating when the receiver is targeted.
  rec: Total receptions made by the player during the period covered.
  rec_br: Receptions per broken tackle — number of receptions for each broken tackle the player forced after the catch, per
    Pro Football Reference.
  td: Total receiving touchdowns scored by the player.
  tgt: Total number of times the player was the intended receiver on a pass attempt.
  x1d: Number of receptions by the player that resulted in a first down.
  yac: Total yards gained by the player after the catch.
  yac_r: Average yards after the catch per reception.
  ybc: Total yards the ball traveled in the air (before the catch) on receptions by the player.
  ybc_r: Average air yards before the catch per reception.
  yds: Total receiving yards gained by the player on all receptions.
load_nfl_pfr_rush:
  att: Total rushing attempts by the player during the period covered.
  att_br: Rushing attempts per broken tackle, measuring how often the player required contact to break free.
  brk_tkl: Number of broken tackles recorded on rushing plays.
  gs: Number of games started by the player during the period covered.
  loaded: Source or load-batch identifier indicating which data file or release this row was pulled from.
  td: Total rushing touchdowns scored during the period covered.
  x1d: Number of first downs gained via rushing during the period covered.
  yac: Yards after contact accumulated on rushing plays.
  yac_att: Yards after contact per rushing attempt.
  ybc: Yards before contact accumulated on rushing plays, measuring yards gained in open field before being touched.
  ybc_att: Yards before contact per rushing attempt.
  yds: Total rushing yards gained during the period covered.
load_nfl_pfr_weekly_def:
  def_adot: Average depth of target (in yards) against this defender on passing plays during the week.
  def_air_yards_completed: Total air yards on completed passes allowed by the defender during the week.
  def_completion_pct: Completion percentage allowed by the defender on targets thrown in their coverage during the week.
  def_completions_allowed: Number of completions allowed by the defender on passes thrown into their coverage during the week.
  def_missed_tackle_pct: Percentage of the defender's tackle opportunities that resulted in a missed tackle during the week.
  def_missed_tackles: Number of missed tackles recorded against this defender during the week per Pro Football Reference.
  def_passer_rating_allowed: NFL passer rating of quarterbacks when targeting this defender in coverage during the week.
  def_pressures: Total number of quarterback pressures (hurries + hits + sacks) generated by the defender during the week.
  def_receiving_td_allowed: Number of receiving touchdowns allowed by the defender while in coverage during the week.
  def_tackles_combined: Total combined tackles (solo + assisted) recorded by the defender during the week per Pro Football
    Reference.
  def_targets: Number of passing attempts thrown at or into the coverage area of this defender during the week.
  def_times_blitzed: Number of times this defender was sent as a blitzer on a passing play during the week.
  def_times_hitqb: Number of times this defender made contact with the quarterback as part of a pass rush during the week.
  def_times_hurried: Number of times this defender hurried the quarterback on a pass rush without recording a sack during
    the week.
  def_yards_after_catch: Total yards gained by receivers after the catch on completions allowed by this defender during the
    week.
  def_yards_allowed: Total receiving yards allowed by this defender in coverage during the week per Pro Football Reference.
  def_yards_allowed_per_cmp: Receiving yards allowed per completion by this defender in coverage during the week.
  def_yards_allowed_per_tgt: Receiving yards allowed per target thrown at this defender in coverage during the week.
load_nfl_pfr_weekly_pass:
  def_times_blitzed: Number of pass plays on which the defense sent a blitz, as experienced by the quarterback in this weekly
    log.
  def_times_hitqb: Number of times the quarterback was hit by a defender on a pass play in this weekly game log.
  def_times_hurried: Number of times the quarterback was hurried (pressured into an early throw) without being sacked or hit.
  passing_bad_throw_pct: Percentage of pass attempts that were charted as poor throws (inaccurate, off-target, or otherwise
    below expectation), per Pro Football Reference.
  passing_bad_throws: Number of pass attempts charted as poor or inaccurate throws by the quarterback in this weekly log.
  passing_drop_pct: Percentage of catchable targets that were dropped by receivers on passes thrown by the quarterback.
  passing_drops: Number of catchable passes thrown by the quarterback that were dropped by receivers.
  receiving_drop: Number of catchable targets the player (as receiver) dropped in this weekly game.
  receiving_drop_pct: Percentage of catchable targets the player dropped in this weekly game.
  times_pressured_pct: Percentage of pass plays on which the quarterback faced defensive pressure in this weekly game.
  times_sacked: Number of times the quarterback was sacked in this weekly game log.
load_nfl_pfr_weekly_rec:
  passing_drop_pct: Percentage of pass targets that resulted in a drop, as tracked by Pro Football Reference.
  passing_drops: Number of passes dropped by intended receivers on targeted throws.
  receiving_broken_tackles: Number of broken tackles recorded by the receiver after the catch.
  receiving_drop: Number of catchable passes dropped by the receiver during the week.
  receiving_drop_pct: Percentage of catchable targets that were dropped by the receiver during the week.
  receiving_int: Number of passes intended for the receiver that were intercepted.
  receiving_rat: Passer rating when targeting this receiver, reflecting QB efficiency on those throws.
  rushing_broken_tackles: Number of broken tackles recorded by the player on rushing plays during the week.
load_nfl_pfr_weekly_rush:
  receiving_broken_tackles: Number of broken tackles the player recorded after a reception in this weekly game log.
  rushing_broken_tackles: Number of broken tackles the player recorded on rushing plays in this weekly game log.
  rushing_yards_after_contact: Total rushing yards gained by the player after initial contact with a defender in this weekly
    game log.
  rushing_yards_after_contact_avg: Average rushing yards gained after initial contact per rushing attempt in this weekly game
    log.
  rushing_yards_before_contact: Total rushing yards gained by the player before making contact with a defender in this weekly
    game log.
  rushing_yards_before_contact_avg: Average rushing yards gained before first contact per rushing attempt in this weekly game
    log.
load_nfl_player_stats:
  opponent_team: Abbreviation or name of the opposing team faced by the player in a given game or week.
load_nfl_players:
  birth_date: Player's date of birth (ISO YYYY-MM-DD).
  college_conference: Athletic conference of the player's college.
  college_name: Name of the college the player attended.
  common_first_name: Player's commonly used first name (the name they go by, which may differ from their legal first name).
