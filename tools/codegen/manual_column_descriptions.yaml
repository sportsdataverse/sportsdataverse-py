    Passing only.
  avg_completed_air_yards: Average air yards on completed passes only, measuring depth of actual completions. Passing only.
  avg_intended_air_yards: Average depth of target on all pass attempts, regardless of completion. Passing/receiving.
  avg_time_to_throw: Average time in seconds from snap to release for the passer, as tracked by NFL Next Gen Stats. Passing
    only.
  completion_percentage: Actual completion percentage for the passer during the slice. Passing only.
  completion_percentage_above_expectation: Completion percentage above the model-expected completion rate (CPOE/CPAE). Passing
    only.
  completions: Completed passes for the passer during the slice. Passing only.
  expected_completion_percentage: Model-expected completion percentage based on target depth, separation, and coverage, from
    NFL Next Gen Stats. Passing only.
