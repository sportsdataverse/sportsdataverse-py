  categories: Article categories (list, stringified).
  content_key: Internal content key.
  data_source_identifier: Source-system identifier.
  description: Article summary/description.
  headline: Article headline.
  id: ESPN numeric identifier for the article.
  images: Article images (list, stringified).
  last_modified: Last-modified timestamp (ISO 8601).
  links_api_artwork_href: ESPN API URL for the artwork image associated with this news article.
  links_api_self_href: ESPN API canonical self-link for the article resource.
  links_app_sportscenter_href: SportsCenter app deep link.
  links_mobile_href: Mobile article URL.
  links_sportscenter_href: Deep-link URL to this news article within the ESPN SportsCenter app or web experience.
  links_web_href: Web article URL.
  links_web_self_dsi_href: Alternate canonical web URL for this news article using ESPN's DSI routing.
  links_web_self_href: Primary canonical web URL for this news article on ESPN.com.
  now_id: ESPN 'now' feed id.
  premium: Whether the article is premium/paywalled.
  published: Publish timestamp (ISO 8601).
  type: Article type (Story, Media, HeadlineNews, etc.).
nfl_combine_profiles:
  armLength: Arm length of the prospect measured at the NFL Combine, expressed in inches.
  athleticismScore: Composite athleticism score assigned to the prospect based on Combine athletic drills.
  benchPress: Raw bench press result string from the NFL Combine (reps at 225 lbs), may include designation notes.
  benchPress_designation: Designation label for the bench press result (e.g., indicating official or pro-day measurement).
  benchPress_repetitions: Number of repetitions completed at 225 lbs on the bench press at the NFL Combine.
  bio: Biographical narrative text about the prospect published in the NFL Combine profile.
  broadJump: Raw broad jump result string from the NFL Combine, may include designation notes.
  broadJump_designation: Designation label for the broad jump result (e.g., official Combine or pro-day measurement).
  broadJump_inches: Broad jump distance in inches recorded at the NFL Combine.
  collegeClass: College class year of the prospect at the time of the NFL Draft (e.g., 'Senior', 'Junior').
  combineAttendance: Indicates whether the prospect attended and participated in the NFL Scouting Combine.
  draftGrade: Numerical draft grade assigned to the prospect by NFL evaluators.
  draftProjection: Projected draft round or range for the prospect based on scouting evaluations.
  fortyYardDash: Raw forty-yard dash result string from the NFL Combine, may include designation notes.
  fortyYardDash_designation: Designation label for the forty-yard dash time (e.g., official Combine or pro-day measurement).
  fortyYardDash_seconds: Forty-yard dash time in seconds recorded at the NFL Combine.
  handSize: Hand size of the prospect measured at the NFL Combine, expressed in inches.
  nflComparison: NFL player comparison cited by scouts to describe the prospect's projected pro style or ceiling.
  overview: Scouting overview narrative providing a summary of the prospect's abilities and profile.
  person_collegeNames: Name(s) of the college(s) attended by the prospect.
  person_displayName: Full display name of the prospect as used in NFL Combine records.
  person_esbId: ESPN-Elias Sports Bureau (ESB) identifier for the prospect.
  person_firstName: First name of the prospect.
  person_hometown: Hometown city or region of the prospect.
  person_lastName: Last name of the prospect.
  positionGroup: Position group the prospect is evaluated under at the NFL Combine (e.g., 'WR', 'OL').
  proFortyYardDash: Raw pro-day forty-yard dash result string for the prospect, may include designation notes.
  proFortyYardDash_designation: Designation label for the pro-day forty-yard dash (e.g., 'pro day' measurement).
  proFortyYardDash_seconds: Pro-day forty-yard dash time in seconds for the prospect.
  productionScore: Composite college production score assigned to the prospect based on statistical output.
  profileAuthor: Name of the scout or analyst who authored the prospect's combine profile.
  sixtyYardShuttle: Raw sixty-yard shuttle drill result string from the NFL Combine, may include designation notes.
  sizeScore: Composite size score assigned to the prospect based on height, weight, and arm length measurements.
  sourcesTellUs: Scouting intelligence notes from team and media sources about the prospect's draft stock or fit.
  strengths: Narrative description of the prospect's key strengths as identified by scouts.
  tenYardSplit: Raw ten-yard split time string from the NFL Combine, may include designation notes.
  tenYardSplit_designation: Designation label for the ten-yard split time (e.g., official Combine or pro-day measurement).
  tenYardSplit_seconds: Ten-yard split time in seconds recorded at the NFL Combine, measuring initial burst off the line.
  threeConeDrill: Raw three-cone drill result string from the NFL Combine, may include designation notes.
  threeConeDrill_designation: Designation label for the three-cone drill time (e.g., official Combine or pro-day measurement).
  threeConeDrill_seconds: Three-cone drill time in seconds recorded at the NFL Combine, measuring change-of-direction ability.
  twentyYardShuttle: Raw twenty-yard short shuttle result string from the NFL Combine, may include designation notes.
  twentyYardShuttle_designation: Designation label for the twenty-yard shuttle time (e.g., official Combine or pro-day measurement).
  twentyYardShuttle_seconds: Twenty-yard short shuttle time in seconds recorded at the NFL Combine.
  verticalJump: Raw vertical jump result string from the NFL Combine, may include designation notes.
  verticalJump_designation: Designation label for the vertical jump measurement (e.g., official Combine or pro-day measurement).
  verticalJump_inches: Vertical jump height in inches recorded at the NFL Combine.
  weaknesses: Narrative description of the prospect's key weaknesses or areas needing development as identified by scouts.
nfl_draft_picks:
  draftNumberOverall: Overall pick number in the NFL Draft, counting sequentially from pick 1 across all rounds.
  draftPosition: Pick number within the draft round (e.g., the 3rd pick of round 2).
  draftRound: Round of the NFL Draft in which the pick occurs.
  personId: NFL.com Shield API identifier for the player associated with this draft pick.
  pickIsIn: Indicates whether the draft pick selection has been officially submitted to the league.
  teamId: NFL.com Shield API identifier for the team holding this draft pick.
  tradeNote: Text note describing any trade involving this pick, if applicable.
  tweetSent: Indicates whether an announcement tweet was sent for this draft pick selection.
  tweetsSent: Indicates whether all scheduled announcement tweets for this pick have been sent.
nfl_game_pbp:
  clockTime: Game clock time at the start of the play, formatted as MM:SS within the quarter.
  driveNetYards: Net yards gained on the current drive up to and including this play.
  drivePlayCount: Number of offensive plays run on the current drive up to and including this play.
  driveSequenceNumber: Sequential identifier for the drive within the game, starting at 1.
  driveTimeOfPossession: Elapsed time of possession for the current drive, formatted as MM:SS.
  endClockTime: Game clock time at the end of the play, formatted as MM:SS within the quarter.
  endYardLine: Yard line where the ball was placed at the conclusion of the play.
  firstDown: Indicates whether the play resulted in a first down.
  goalToGo: Indicates whether the offensive team is in a goal-to-go situation at the start of the play.
  isBigPlay: Classification label indicating whether this play is designated as a big play by the NFL.
  latestPlay: Indicates whether this play is the most recent play recorded in the live feed.
  nextPlayIsGoalToGo: Indicates whether the next play will begin in a goal-to-go situation.
  nextPlayType: Play type category anticipated or assigned to the next play in sequence.
  orderSequence: Sequential ordering value used to sort plays within the game in chronological order.
  penaltyOnPlay: Indicates whether a penalty was called on this play.
  playClock: Play clock value in seconds at the snap of the ball.
  playDeleted: Indicates whether this play record has been marked as deleted or voided.
  playDescription: Official text description of the play as provided by the NFL.
  playDescriptionWithJerseyNumbers: Play description text augmented with player jersey numbers for participant identification.
  playReviewStatus: Status of any official review of the play (e.g., confirmed, overturned, stands).
  playStats: Internal NFL stat identifier linking this play to associated statistical records.
  playType: Categorical classification of the play type (e.g., PASS, RUSH, PUNT, KICKOFF).
  possessionTeam_abbreviation: Abbreviated team name for the team with offensive possession on this play.
  possessionTeam_franchise_currentLogo: URL of the current primary logo for the possessing team's franchise.
  possessionTeam_franchise_decorativeElementsColor: Decorative elements color for the possessing team's franchise branding,
    as a hex code.
  possessionTeam_franchise_largeTypeColor: Large-type display color for the possessing team's franchise branding, as a hex
    code.
  possessionTeam_franchise_primaryColor: Primary brand color for the possessing team's franchise, expressed as a hex color
    code.
  possessionTeam_franchise_secondaryColor: Secondary brand color for the possessing team's franchise, expressed as a hex color
    code.
  possessionTeam_franchise_tertiaryColor: Tertiary brand color for the possessing team's franchise, expressed as a hex color
    code.
  possessionTeam_id: NFL.com Shield API identifier for the team with offensive possession on this play.
  possessionTeam_nickName: Nickname (mascot name) of the team with offensive possession on this play.
  prePlayByPlay: Narrative text describing the game situation or setup immediately before this play.
  quarter: Game quarter in which the play occurred (1–4 for regulation, 5 for overtime).
  scoringPlay: Indicates whether this play resulted in points being scored.
  scoringPlayType: Type of scoring event on this play (e.g., TD, FG, SAFETY, PAT).
  scoringTeam: Abbreviation or identifier of the team that scored on this play, if applicable.
  scoringTeam_abbreviation: Abbreviated team name for the team that scored on this play.
  scoringTeam_franchise_currentLogo: URL of the current primary logo for the scoring team's franchise.
  scoringTeam_franchise_decorativeElementsColor: Decorative elements color for the scoring team's franchise branding, as a
    hex code.
  scoringTeam_franchise_largeTypeColor: Large-type display color for the scoring team's franchise branding, as a hex code.
  scoringTeam_franchise_primaryColor: Primary brand color for the scoring team's franchise, expressed as a hex color code.
  scoringTeam_franchise_secondaryColor: Secondary brand color for the scoring team's franchise, expressed as a hex color code.
  scoringTeam_franchise_tertiaryColor: Tertiary brand color for the scoring team's franchise, expressed as a hex color code.
  scoringTeam_id: NFL.com Shield API identifier for the team that scored on this play.
  scoringTeam_nickName: Nickname (mascot name) of the team that scored on this play.
  shortDescription: Short narrative summary of the play outcome (e.g., 'PENALTY', 'TOUCHDOWN').
  specialTeamsPlay: Indicates whether this play was a special teams play.
  stPlayType: Special teams play sub-type classification (e.g., PUNT, KICKOFF, FG_ATTEMPT) when applicable.
  timeOfDay: Wall-clock time of day when the play occurred, typically in local or Eastern time.
  visitor_team: Abbreviation or name of the visiting (away) team in this game.
  yardLine: Yard line on the field where the ball was placed at the start of the play.
  yardsToGo: Number of yards needed to gain a first down at the start of the play.
nfl_game_summaries:
  awayTeam_hasPossession: Indicates whether the away team has offensive possession at this point in the game.
  awayTeam_score_ot: Away team points scored in overtime.
  awayTeam_score_q1: Away team points scored in the first quarter.
  awayTeam_score_q2: Away team points scored in the second quarter.
  awayTeam_score_q3: Away team points scored in the third quarter.
  awayTeam_score_q4: Away team points scored in the fourth quarter.
  awayTeam_score_total: Away team total points scored through the current point in the game.
  awayTeam_teamId: NFL.com Shield API identifier for the away team in this game.
  awayTeam_timeouts_remaining: Number of timeouts remaining for the away team at this game state snapshot.
  awayTeam_timeouts_used: Number of timeouts used by the away team through this point in the game.
  gameBookUrl: URL pointing to the official NFL Game Book PDF for this game.
  gameId: NFL.com Shield API identifier for the game.
  homeTeam_hasPossession: Indicates whether the home team has offensive possession at this point in the game.
  homeTeam_score_ot: Home team points scored in overtime.
  homeTeam_score_q1: Home team points scored in the first quarter.
  homeTeam_score_q2: Home team points scored in the second quarter.
  homeTeam_score_q3: Home team points scored in the third quarter.
  homeTeam_score_q4: Home team points scored in the fourth quarter.
  homeTeam_score_total: Home team total points scored through the current point in the game.
  homeTeam_teamId: NFL.com Shield API identifier for the home team in this game.
  homeTeam_timeouts_remaining: Number of timeouts remaining for the home team at this game state snapshot.
  homeTeam_timeouts_used: Number of timeouts used by the home team through this point in the game.
  isGoalToGo: Indicates whether the current offensive situation is a goal-to-go scenario.
  isRedZone: Indicates whether the ball is inside the opponent's 20-yard line (red zone).
  offset: Byte or record offset within the game data stream, used for incremental polling of live game state.
  quarter: Current game quarter as a string label (e.g., '1', '2', 'OT').
  yardLine: Current ball position on the field expressed as a yard-line string (e.g., 'OPP 35').
nfl_injuries:
  injuries: Structured description of the player's reported injury or injuries, typically listing affected body part(s).
  injuryStatus: Official NFL injury status designation for the player (e.g., 'Questionable', 'Out', 'IR', 'Doubtful').
  person_commonFirstName: Commonly used or preferred first name for the player (may differ from legal first name).
  person_displayName: Full display name of the player as shown on official NFL roster and injury report materials.
  person_firstName: Player's legal first name as recorded in the NFL player database.
  person_gsisId: Global Statistical Information System (GSIS) identifier — the NFL's official unique player ID used across
    league data systems.
  person_headshot: URL to the player's official NFL headshot image.
  person_lastName: Player's last name as recorded in the NFL player database.
  practiceDays: Comma-separated list or encoded representation of the practice days the player participated in during the
    injury report week.
  practiceStatus: Player's practice participation designation for the most recent session (e.g., 'Limited Participant', 'Did
    Not Practice', 'Full Participant').
  practices: Structured record of the player's weekly practice participation details used to compile the official injury report.
  seasonType: Type of NFL season the injury report covers (e.g., 'Regular Season', 'Postseason', 'Preseason').
  team_currentLogo: URL to the current official logo image of the player's team.
  team_fullName: Full official name of the team the player belongs to (e.g., 'Kansas City Chiefs').
nfl_ngs_gamecenter_overview:
  esbId: Elias Sports Bureau identifier for the player, used to link to official NFL records and statistics.
  gameId: Unique identifier for the NFL game in the NGS/Shield data system.
  jerseyNumber: Jersey number worn by the player during the game.
  passYards: Total passing yards accumulated by the player (relevant for quarterbacks) in the NGS gamecenter overview.
  playerName: Full display name of the player as shown in the NFL Next Gen Stats gamecenter.
  shortName: Abbreviated display name of the player (e.g., 'P.Mahomes') used in compact UI contexts.
  teamAbbr: Two- or three-letter abbreviation identifying the player's team (e.g., 'KC', 'PHI').
  teamId: Unique numeric identifier for the player's team in the NFL NGS/Shield data system.
  touchdowns: Total number of touchdowns scored or thrown by the player in the NGS gamecenter overview.
  zones: Serialized or structured representation of field zones targeted or covered by the player during the game.
nfl_ngs_leaders:
  leader_esbId: Elias Sports Bureau identifier for the statistical leader, used to link to official NFL records.
  leader_firstName: First name of the statistical leader player.
  leader_gsisId: NFL GSIS (Game Statistics and Information System) identifier for the statistical leader player.
  leader_headshot: URL to the player's official headshot image as provided by the NFL NGS system.
  leader_inPlayDist: Total in-play distance traveled (in yards) by the statistical leader during the highlighted play.
  leader_jerseyNumber: Jersey number worn by the statistical leader player.
  leader_lastName: Last name of the statistical leader player.
  leader_maxSpeed: Maximum recorded speed (in miles per hour) reached by the statistical leader during the highlighted play.
  leader_playerName: Full display name of the statistical leader player as shown in NFL NGS.
  leader_position: Specific position designation of the statistical leader (e.g., 'QB', 'WR', 'CB').
  leader_positionGroup: Broader position group of the statistical leader (e.g., 'Offense', 'Defense', 'Special Teams').
  leader_shortName: Abbreviated display name of the statistical leader (e.g., 'P.Mahomes') for compact UI usage.
  leader_teamAbbr: Two- or three-letter abbreviation identifying the statistical leader's team.
  leader_teamId: Unique numeric identifier for the statistical leader's team in the NFL NGS/Shield system.
  leader_week: NFL week number during which the statistical leader achieved the highlighted performance.
  leader_yards: Total yards associated with the statistical leader's highlighted play or performance metric.
  play_absoluteYardlineNumber: Absolute yard line number (1–100) on the field where the highlighted play occurred.
  play_actualYardlineForFirstDown: Yard line the offense must reach to convert a first down on the highlighted play.
  play_actualYardsToGo: Actual distance in yards the offense needed to gain a first down on the highlighted play.
  play_down: Down number (1–4) on which the highlighted play occurred.
  play_endGameClock: Game clock time (MM:SS) at the end of the highlighted play.
  play_gameClock: Game clock time (MM:SS) at the start of the highlighted play.
  play_gameId: Unique identifier for the NFL game in which the highlighted play occurred.
  play_gameKey: Alternate numeric key for the NFL game in which the highlighted play occurred, used in official NFL systems.
  play_health_ballTracking: Indicator of whether ball-tracking data from the NGS health/tracking system is available for this
    play.
  play_health_playerTracking: Indicator of whether player-tracking data from the NGS health/tracking system is available for
    this play.
  play_homeScore: Home team's score at the time of the highlighted play.
  play_isBigPlay: Boolean flag indicating whether the highlighted play is classified as a 'big play' in the NGS system.
  play_isChangeOfPossession: Boolean flag indicating whether the highlighted play resulted in a change of ball possession.
  play_isEndQuarter: Boolean flag indicating whether the highlighted play occurred at the end of a quarter.
  play_isGoalToGo: Boolean flag indicating whether the highlighted play occurred in a goal-to-go situation.
  play_isPenalty: Boolean flag indicating whether the highlighted play involved a penalty.
  play_isSTPlay: Boolean flag indicating whether the highlighted play was a special teams play.
  play_isScoring: Boolean flag indicating whether the highlighted play resulted in a score.
  play_playDescription: Full text description of the highlighted play as recorded by official NFL scorers.
  play_playDirection: Direction of the highlighted play on the field (e.g., left, middle, right).
  play_playId: Unique identifier for the specific play within the game in the NFL NGS/Shield system.
  play_playState: State or status of the highlighted play (e.g., 'APPROVED', 'CHALLENGED') in the NGS system.
  play_playStats: Serialized statistical outcomes or stat codes associated with the highlighted play.
  play_playType: Text label describing the type of the highlighted play (e.g., 'PASS', 'RUSH', 'KICK').
  play_playTypeCode: Numeric or short code identifying the play type of the highlighted play in the NGS system.
  play_possessionTeamId: Unique identifier for the team that had possession of the ball during the highlighted play.
  play_preSnapHomeScore: Home team's score immediately before the snap on the highlighted play.
  play_preSnapVisitorScore: Visitor team's score immediately before the snap on the highlighted play.
  play_quarter: Quarter (1–4, or 5 for overtime) in which the highlighted play occurred.
  play_sequence: Sequential order number of the play within the game or drive as recorded in the NGS system.
  play_startGameClock: Game clock time (MM:SS) at the start of the highlighted play.
  play_timeOfDayUTC: Wall-clock timestamp in UTC representing the real-world time the highlighted play occurred.
  play_visitorScore: Visitor team's score at the time of the highlighted play.
  play_yardline: Formatted yard line string (e.g., 'KC 35') indicating the field position of the highlighted play.
  play_yardlineNumber: Numeric yard line (1–50) indicating the field position of the highlighted play.
  play_yardlineSide: Team abbreviation indicating which team's side of the field the highlighted play occurred on.
  play_yardsToGo: Number of yards needed for a first down at the start of the highlighted play.
