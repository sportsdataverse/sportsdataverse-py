# Functions intentionally excluded from the docs-coverage gate (with reason).
# Keep this SMALL -- it is escape-hatch only, not a backlog dump.
#
# Each list holds bare function/class names (no module prefix) that the
# --coverage gate should NOT flag as missing even when they are absent from the
# rendered docs corpus. Add an inline ``# reason`` comment for every entry.
#
# Do NOT seed this with the current documentation gaps -- those are meant to be
# FIXED (a doc page added) in later tasks, not papered over here.
#
# WHY THESE NAMES ARE EXCLUDED
# =============================
# Every name below is a cross-cutting internal symbol that leaks into league
# namespaces via ``from ... import *`` in subpackage __init__ files.  None of
# them are user-facing data wrappers, loaders, or sport-specific utilities.
# They fall into three buckets:
#
#   1. Shared HTTP / JSON utilities (dl_utils.py):
#        download              -- canonical HTTP gateway (internal; users never call it)
#        flatten_json_iterative -- recursive JSON flattener (parser-layer helper)
#        key_check             -- safe dict-key accessor (parser-layer helper)
#        underscore            -- camelCase -> snake_case string transform (internal)
#
#   2. Error types (errors.py):
#        SeasonNotFoundError   -- exception class; not a data function
#        season_not_found_error -- constructor/raiser helper for SeasonNotFoundError
#
#   3. Parser-dispatch registries (per-sport *_parsers.py):
#        parser_for_mlb_api    -- registry lookup for MLB Stats API parsers
#        parser_for_edge       -- registry lookup for NHL EDGE API parsers
#        parser_for_nhl_api_web -- registry lookup for NHL Web API parsers
#        parser_for_nhl_records -- registry lookup for NHL Records API parsers
#        parser_for_nhl_stats_rest -- registry lookup for NHL Stats REST parsers
#
