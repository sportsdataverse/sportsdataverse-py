  home_team_tickets_provider_url: 'Home team: ticket shop URL.'
  home_team_updated_at: 'Home team: CMS update time of the record (ISO 8601 UTC).'
  is_completed: true once the game is final.
  play_off_game: Game of the playoff series (1, 2, ...); null outside the playoffs.
  play_off_game_level: Playoff round label.
  played_date_time: Actual start time (ISO 8601 UTC).
  published_at: CMS publish time of the record (ISO 8601 UTC).
  round: Round number of the game in the season schedule.
  scheduled_date_time: Scheduled face-off time (ISO 8601 UTC).
  season: Season END year (2026 = 2025/26).
  slug: Game slug yyyymmdd-home-away (lower-case CMS short names); the /api/game?slug=
