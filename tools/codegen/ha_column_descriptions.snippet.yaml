  away_team_document_id: 'Away team: CMS (Strapi) document id (string; stable across
    drafts and locales).'
  away_team_logo_url: Logo URL of the away team.
  away_team_main_color_hex: 'Away team: primary colour (hex).'
  away_team_name: 'Away team: short club name (the teams list''s name).'
  away_team_published_at: 'Away team: CMS publish time of the record (ISO 8601 UTC).'
  away_team_team_arena: 'Away team: home arena.'
  away_team_tickets_provider_url: 'Away team: ticket shop URL.'
  away_team_updated_at: 'Away team: CMS update time of the record (ISO 8601 UTC).'
  cms_season: 'CMS season key as sent (season_2026 = 2026/27: a START year).'
  created_at: CMS creation time of the record (ISO 8601 UTC).
  current_period: Live period while the game runs; empty string '' before and after.
  current_period_start: Start time of the live period; null outside a live game.
  decided_in: How the game was decided (FT, OT, SO); empty for a game not yet played.
  ended_date_time: End time (ISO 8601 UTC).
  game_cms_id: CMS (Strapi) record id of the game.
  game_document_id: CMS (Strapi) document id of the game.
  game_type: 'Game type (phase): HA regular season, HAPlayoff playoffs, HAkval playout.'
