    request key.
  updated_at: CMS update time of the record (ISO 8601 UTC).
  venue: Arena name on the CMS game record.
ha_games:
  arena: Arena the game is played in, as the games table names it.
  attendance: Attendance; null for an unplayed game (0 for a played one means unknown).
  away_expulsions_in_minutes: 'Away team: penalty minutes.'
  away_powerplay_efficiency: 'Away team: power-play percentage; sent as text, 0 or
    null.'
  away_powerplay_goals: 'Away team: power-play goals.'
  away_powerplay_num_pp: 'Away team: power plays.'
  away_score: Away goals, final.
  away_shots_efficiency: 'Away team: shooting percentage (goals per 100 shots); sent
    as text, 0 or null.'
  away_shots_goal: 'Away team: goals.'
  away_shots_total: 'Away team: shots on goal.'
  away_team_code: Display code of the away team, not the StatNet id.
  date: Game date (YYYY-MM-DD).
  decided_in: How the game was decided (FT, OT, SO); empty for a game not yet played.
  home_expulsions_in_minutes: 'Home team: penalty minutes.'
  home_powerplay_efficiency: 'Home team: power-play percentage; sent as text, 0 or
    null.'
  home_powerplay_goals: 'Home team: power-play goals.'
  home_powerplay_num_pp: 'Home team: power plays.'
  home_score: Home goals, final.
  home_shots_efficiency: 'Home team: shooting percentage (goals per 100 shots); sent
    as text, 0 or null.'
  home_shots_goal: 'Home team: goals.'
  home_shots_total: 'Home team: shots on goal.'
  home_team_code: Display code of the home team (AIK, MoDo, MORA, NVIF, ÖIK), not
    the StatNet id.
  is_played: True when the game has been played (decided_in is not empty).
  most_points: Top point scorers of the game, JSON list of {player, team (StatNet
    id), points}.
  period_scores: Goals per period, JSON list of {Home, Away}; null for an unplayed
    game.
  season: Season END year (2026 = 2025/26).
ha_goalie_stats:
  ga: 'Goals against: goals allowed in the season and phase.'
  gaa: Goals-against average.
  gp: Games played in the season and phase.
  gpi: Games played in (appeared).
  l: Losses credited to the goalkeeper.
  mip: Minutes played, total mm:ss string ('1726:51').
  player_name: Player name (the table carries no player id).
  rank: Rank in the table.
  season: Season END year (2026 = 2025/26).
  so: Shutouts recorded by the goalkeeper.
  svs: Saves made by the goalkeeper.
  svs_perc: Save percentage ('92.61').
  t: Ties credited to the goalkeeper (0 in the overtime era).
  team_statnet_id: StatNet team id (AIK, MODO, MIK, NYB, OSIK), not the display code.
  valid_ranking: 1 when the goalkeeper qualifies for the ranked list (minimum games),
    else 0.
  w: Wins credited to the goalkeeper.
ha_leaders:
  family_name: Family name of the player.
  first_name: First name of the player.
  headshot: Headshot URL (medium rendition).
  headshot_medium: Medium headshot URL.
  headshot_small: Small headshot URL.
  jersey_number: Jersey number of the player.
  metric: Metric code (echo of the request metric).
  metric_value: Value of the metric (a count, a percentage or a clock, as text).
  player_name: Player name (the table carries no player id).
  player_statnet_id: StatNet player id (the same id space as SHL's isa id, verified
    on one player).
  position: 'Playing position: F forward, D defence (G goalkeeper on goalie metrics).'
  rank: Rank in the table.
  slug: Player slug; joins ha_players.
  team_code: Display code of the team (AIK, MoDo, MORA, NVIF, ÖIK), not the StatNet
    id.
  team_logo: Logo URL of the player's team.
  team_main_color: Team primary colour (hex).
  team_name: Team label as shown on the card (the display team code).
  team_statnet_id: StatNet team id (AIK, MODO, MIK, NYB, OSIK), not the display code.
ha_pbp:
  assist1_jersey_today: First assist's jersey number in this game.
  assist1_name: First assist, by name (no id).
  assist1_season_assists: First assist's season assists after this goal.
  assist2_jersey_today: Second assist's jersey number in this game.
  assist2_name: Second assist, by name (no id).
  assist2_season_assists: Second assist's season assists after this goal.
  away_statnet_id: StatNet team id of the away team.
  event_description: Shot outcome, goal strength (EQ), penalty text or timeout note.
  event_type: 'Event type: Shot, Goal, Penalty, GoalkeeperEvent or Timeout.'
  home_statnet_id: StatNet team id of the home team (AIK, MODO, MIK).
  is_entering: 'Goalkeeper event: true when the goalkeeper enters, false when he leaves.'
  is_penalty_shot: Goal scored on a penalty shot.
  period: Period number the event belongs to.
  period_label: Period label ('Period 1').
  player_family_name: 'Player: family name of the player.'
  player_first_name: 'Player: first name of the player.'
  player_jersey_number: 'Player: jersey number of the player.'
  player_statnet_id: StatNet player id (the same id space as SHL's isa id, verified
    on one player).
  running_score: Score after the goal, home-away.
  scorer_season_goals: Scorer's season goals after this goal.
  statnet_game_number: StatNet game number (23401 = 2026/27 game 1); the play-by-play
    request key.
  team_code: Display code of the team (AIK, MoDo, MORA, NVIF, ÖIK), not the StatNet
    id.
  team_name: Team label as shown on the card (the display team code).
  team_statnet_id: StatNet team id (AIK, MODO, MIK, NYB, OSIK), not the display code.
  time: Seconds into the period.
