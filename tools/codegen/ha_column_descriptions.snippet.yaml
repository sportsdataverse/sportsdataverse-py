ha_skater_stats:
  a: Assists credited to the skater.
  bks: Blocked shots (0 in seasons before tracking).
  g: Goals scored by the skater.
  gp: Games played in the season and phase.
  gwg: Game-winning goals.
  hits: Hits (0 in seasons before tracking).
  minus: Goals against while on ice (minus count).
  pim: Penalty minutes.
  player_name: Player name (the table carries no player id).
  plus: Even-strength / short-handed goals for while on ice (plus count).
  plus_minus: 'Plus/minus: the Plus count less the Minus count.'
  ppg: Power-play goals.
  rank: Rank in the table.
  season: Season END year (2026 = 2025/26).
  sog: Shots on goal by the skater.
  team_statnet_id: StatNet team id (AIK, MODO, MIK, NYB, OSIK), not the display code.
  toi_gp: Average time on ice per game, mm:ss string ('0:00' = not tracked, e.g. 2010).
  tp: Points (goals + assists).
  tppg: Points per game.
ha_standings:
  games_played: Games played in the season and phase.
  goal_difference: Goal difference.
  goals: Goals scored by the team (goals for).
  goals_against: Goals conceded by the team.
  overtime_and_shootout_losses: Overtime losses, shootout losses included.
  overtime_and_shootout_wins: Overtime wins, shootout wins included.
  penalty_kill_perc: Penalty-kill percentage; empty-string placeholder '' in every
    sample.
  power_play_perc: Power-play percentage; empty-string placeholder '' in every sample.
  rank: Rank in the table.
  regulation_losses: Regulation losses only.
  regulation_wins: Regulation wins only (the team table's wins_total also counts OT
    and shootout wins).
  season: Season END year (2026 = 2025/26).
  shootouts_losses: Shootout losses as sent (0 in every sampled row).
  shootouts_wins: 'Shootout wins as sent (0 in every sampled row: they are counted
    in overtime_and_shootout_wins).'
  team_code: Display code of the team (AIK, MoDo, MORA, NVIF, ÖIK), not the StatNet
    id.
  team_code_mixed: 'Upstream standings teamCode: the StatNet id for some clubs (MODO),
    the display code for others (MORA, NVIF, ÖIK). Join on team_code instead.'
  ties: Ties (0 in the overtime era).
  total_points: Standings points of the team.
ha_team_stats:
  g: Goals scored by the team.
  ga: 'Goals against: goals allowed in the season and phase.'
  gapg: Goals against per game (number).
  gfg: Games in which the team scored the first goal (inferred from the label; unverified).
  gp: Games played in the season and phase.
  gpg: Goals for per game (number).
  leading: Games or situations leading (StatNet 'Leading'; meaning unverified).
  losses_total: Losses in total, overtime and shootout losses included (otl and sol
    are subsets).
  otl: Overtime losses.
  otw: Overtime wins (a subset of wins_total).
  p_gp: Points per game.
  points: 'Standings points: 3 per regulation win, 2 per overtime/shootout win, 1
    per overtime/shootout loss (2025 IFB: 102 + 14 + 3 = 119).'
  rank: Rank in the table.
  season: Season END year (2026 = 2025/26).
  sol: Shootout losses.
  sow: Shootout wins (a subset of wins_total).
  team_code: Display code of the team (AIK, MoDo, MORA, NVIF, ÖIK), not the StatNet
    id.
  trailing: Games or situations trailing (StatNet 'Trailing'; meaning unverified).
  wins_total: Wins in total, overtime and shootout wins included (otw and sow are
    subsets).
ha_teams:
  full_name: Full club name (the teams list's fullName).
  logos_icon: 'Logo: icon-size logo URL.'
  logos_large: 'Logo: large logo URL.'
  logos_medium: 'Logo: medium logo URL.'
  logos_small: 'Logo: small logo rendition (500 px).'
  logos_xlarge: 'Logo: extra-large logo URL.'
  name: Short club name (the teams list's name).
  season: Season END year (2026 = 2025/26).
  team_code: Display code of the team (AIK, MoDo, MORA, NVIF, ÖIK), not the StatNet
    id.
  team_statnet_id: StatNet team id (AIK, MODO, MIK, NYB, OSIK), not the display code.
