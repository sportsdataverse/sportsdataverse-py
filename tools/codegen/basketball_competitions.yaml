# Registry of the per-competition convenience families minted over the three multi-competition
# basketball platforms (FIBA GDAP + game pages, Genius LiveStats, Sportradar Atrium).
#
# One entry = one competition = one prefix. Adding a competition is a one-entry change here, then
#   python tools/codegen/gen_basketball_competitions.py
# which rewrites sportsdataverse/basketball/_competitions_registry.py (package data: the wheel ships
# only the package, so the runtime cannot read tools/). tests/basketball/test_competition_factories.py
# pins every fact below to its source (copied from sdv-internal-refs, never read from the checkout).
#
# Common fields:  key (stable id), prefix (function-name prefix, `<prefix>_schedule`), label,
#   gender (men | women | both; "women"/"both" entries are the wehoop mirror's to port), season_rule.
# fiba:   family_id = GDAP competitionMarketingNameId (the competition family; one edition per season);
#   example_season = a season that has an edition, used by the docstring examples.
# genius: org = Genius (hosted) ORG code; live_org = the LiveStats ORG of its /u/{ORG}/{matchId}/ shells (NZNBL is
#   NZN there; leagues.json live_org); label_include / label_exclude = case-insensitive regexes over the
#   competition label of genius_competitions(org) that pick THE competition of a season (an org lists
#   cups, play-offs and youth leagues beside the headline league). The minted game functions apply the same
#   rule to the competition name of the game's /u/ shell, so a game of another org or competition is refused.
#   Verified live on 2026-10-17 (9 Genius requests through a residential proxy): the WBBL and SLB choosers pick
#   'Championship 2025-26' for season 2026 (comp 41751 / 41897), and the /u/ shells of WBBL match 2767806 and
#   SLB match 2702542 name that same competition ('Championship 2025-26', same comp_id), which "Championship"
#   accepts. FFBB: /u/FFBB/2875354/ names 'LIGUE FEMININE 2' (comp 49551, 2026-27), which the anchored
#   ^ligue feminine( de basket)?$ rightly refuses; the chooser labels it accepts ('LIGUE FEMININE' 2017-18 comp
#   18540, 'LIGUE FEMININE DE BASKET' 2018-19 comp 21849) are the refs leagues.json chooser rows. The FFBB hosted
#   schedule of comp 21849 was refused on 2026-10-17 ('answered None'): its first block is an unfilled play-off slot
#   ('To be determined', match 1145701) with no team or match link, so it named no competition; the runtime now gives
#   such a slot the scope the page's other blocks prove. Re-checked live on 2026-10-18 (15 requests): the FFBB chooser
#   lists LFB for Genius years 2017 and 2018 only (18540 'LIGUE FEMININE', 21849 'LIGUE FEMININE DE BASKET'), both
#   schedules parse (176 and 168 matches), lfb_pbp(1148688) (2019 final) passes its /u/ check, and /u/FFBB/869758/
#   names 'LIGUE FEMININE' (comp 18540). The oldest chooser season of ESAKE (5426), FRB (11929) and FUBB (21546) has no
#   such slot; the WBBL, SLB, BAL and NZNBL hosted schedules (oldest and current, plain and embednf) answered HTTP 500
#   'A website error has occurred' that day, a host-side failure the scope rule cannot change.
# atrium: website_id = the embed site config id (one site carries many competitions).
#
# Left out on purpose (already have a dedicated home, so a second prefix would only duplicate it):
#   Genius CEBL, BNXT, IBBA, LKL, KZS; and orgs the hosted schedule does not serve (POL, CBFFE, BSN,
#   LNBP history, NBL, SPB, HKS embed-only). Not yet minted for lack of a verified GDAP family id: BCL Asia
#   (a 2025-04-01..06-01 games window lists only its "BCL Asia-East" qualifier, comp 208932, category CCCQ-1).
#
# FIBA family ids, verified against the live GDAP API (digital-api.fiba.basketball/hapi, the public APIM key):
#   201/320/306/112/211 from fiba/README.md; 352, 179, 297 by getGdapCompetitionById on 2026-10-17 (Paris 2024
#   women 208723, AfroBasket 2025 208938, Women's EuroBasket 2025 208854). On 2026-10-18 the 2025 editions were
#   found with getgdapgamesbetweentwodates (final-day windows) and getGdapCompetitionById gave each family id:
#     EuroBasket 208853 -> 208, AmeriCup 208811 -> 184, Asia Cup 208895 -> 195, EuroCup Women 208856 -> 165
#     ("FIBA Women's European Club Competitions - Tier 2"), BCL Americas 208898 -> 110, Women's AmeriCup 208812 -> 303,
#     Women's Asia Cup Division A 208896 -> 305, Women's AfroBasket 208937 -> 302, Intercontinental Cup 208979 -> 215.
#   getgdapcompetitionsbyseasonsandcompetitionmarketingname(season 2025) lists exactly that one edition for 305, 165,
#   208, 184, 195, 110 and 302 (Division B of the Women's Asia Cup, 208897, is not in family 305); 303 and 215 were
#   not listed (budget), only fetched by id.
fiba:
  - {key: world_cup, prefix: fiba_wc, example_season: 2023, label: "FIBA Basketball World Cup", family_id: 201, gender: men,
     season_rule: "event year (World Cup 2023 = 2023)"}
  - {key: womens_world_cup, prefix: fiba_wwc, example_season: 2022, label: "FIBA Women's Basketball World Cup", family_id: 306, gender: women,
     season_rule: "event year (2022 = 2022)"}
  - {key: olympics_men, prefix: fiba_oly, example_season: 2024, label: "Men's Olympic Basketball Tournament", family_id: 320, gender: men,
     season_rule: "event year (Paris 2024 = 2024)"}
  - {key: olympics_women, prefix: fiba_woly, example_season: 2024, label: "Women's Olympic Basketball Tournament", family_id: 352, gender: women,
     season_rule: "event year (Paris 2024 = 2024)"}
  - {key: bcl, prefix: fiba_bcl, example_season: 2025, label: "Basketball Champions League (FIBA Men's European Club Competitions Tier 1)", family_id: 112,
     gender: men, season_rule: "END year (2024-25 = 2025)"}
  - {key: euroleague_women, prefix: fiba_elw, example_season: 2025, label: "EuroLeague Women (FIBA Women's European Club Competitions Tier 1)", family_id: 211,
     gender: women, season_rule: "END year (2024-25 = 2025)"}
  - {key: afrobasket, prefix: fiba_afrobasket, example_season: 2025, label: "FIBA AfroBasket", family_id: 179, gender: men,
     season_rule: "event year (2025 = 2025)"}
  - {key: womens_eurobasket, prefix: fiba_weurobasket, example_season: 2025, label: "FIBA Women's EuroBasket", family_id: 297, gender: women,
     season_rule: "event year (2025 = 2025)"}
  - {key: eurobasket, prefix: fiba_eurobasket, example_season: 2025, label: "FIBA EuroBasket", family_id: 208, gender: men,
     season_rule: "event year (2025 = 2025)"}
  - {key: americup, prefix: fiba_americup, example_season: 2025, label: "FIBA AmeriCup", family_id: 184, gender: men,
     season_rule: "event year (2025 = 2025)"}
  - {key: asia_cup, prefix: fiba_asiacup, example_season: 2025, label: "FIBA Asia Cup", family_id: 195, gender: men,
     season_rule: "event year (2025 = 2025)"}
  - {key: intercontinental_cup, prefix: fiba_icup, example_season: 2025, label: "FIBA Intercontinental Cup", family_id: 215,
     gender: men, season_rule: "event year (Singapore 2025 = 2025)"}
  - {key: bcl_americas, prefix: fiba_bcla, example_season: 2025, label: "Basketball Champions League Americas", family_id: 110,
     gender: men, season_rule: "END year (2024-25 = 2025)"}
  - {key: eurocup_women, prefix: fiba_ecw, example_season: 2025, label: "EuroCup Women (FIBA Women's European Club Competitions Tier 2)",
     family_id: 165, gender: women, season_rule: "END year (2024-25 = 2025)"}
  - {key: womens_americup, prefix: fiba_wamericup, example_season: 2025, label: "FIBA Women's AmeriCup", family_id: 303,
     gender: women, season_rule: "event year (2025 = 2025)"}
  - {key: womens_asia_cup, prefix: fiba_wasiacup, example_season: 2025, label: "FIBA Women's Asia Cup (Division A)", family_id: 305,
     gender: women, season_rule: "event year (2025 = 2025)"}
  - {key: womens_afrobasket, prefix: fiba_wafrobasket, example_season: 2025, label: "FIBA Women's AfroBasket", family_id: 302,
     gender: women, season_rule: "event year (2025 = 2025)"}
genius:
  - {key: wbbl, prefix: wbbl, label: "Women's British Basketball League", org: WBBL, live_org: WBBL, gender: women,
     label_include: "Championship", label_exclude: "Play-?Offs",
     season_rule: "END year; the label span 2025-26 = 2026"}
  - {key: slb, prefix: slb, label: "Super League Basketball (UK)", org: SLB, live_org: SLB, gender: men,
     label_include: "Championship", label_exclude: "^$",
     season_rule: "END year; the label span 2025-26 = 2026"}
  - {key: bal, prefix: bal, label: "Basketball Africa League", org: BAL, live_org: BAL, gender: men,
     label_include: ".", label_exclude: "^$",
     season_rule: "calendar year (BAL 2025 = 2025); 2023 lists two competitions, so pass comp_id"}
  - {key: nznbl, prefix: nznbl, label: "New Zealand National Basketball League", org: NZNBL, live_org: NZN, gender: men,
     label_include: "national basketball league|sals nbl", label_exclude: "rapid|women",
     season_rule: "calendar year (2025 = 2025)"}
  - {key: esake, prefix: esake, label: "Greek Basket League (ESAKE)", org: ESAKE, live_org: ESAKE, gender: men,
     label_include: "basket league|gbl", label_exclude: "super cup|woman",
     season_rule: "END year; Genius year + 1 (2022-23 = 2023)"}
  - {key: lfb, prefix: lfb, label: "Ligue Feminine de Basket (France, FFBB)", org: FFBB, live_org: FFBB, gender: women,
     label_include: "^ligue feminine( de basket)?$", label_exclude: "^$",
     season_rule: "END year; Genius year + 1 (2018-19 = 2019); Genius hosts only 2018 and 2019"}
  - {key: lnbm, prefix: lnbm, label: "Liga Nationala de Baschet Masculin (Romania)", org: FRB, live_org: FRB, gender: men,
     label_include: "lnbm|liga nationala de baschet masculin", label_exclude: "^$",
     season_rule: "END year; Genius year + 1 (2016-17 = 2017)"}
  - {key: lub, prefix: lub, label: "Liga Uruguaya de Basquetbol", org: FUBB, live_org: FUBB, gender: men,
     label_include: "liga uruguaya|^lub", label_exclude: "amistosos|femenina",
     season_rule: "END year; Genius year + 1 (2025-26 = 2026)"}
atrium:
  - {key: lnb, prefix: lnb, label: "LNB (France)", website_id: 12, gender: men,
     season_rule: "END year (2026 = 2025-26; the site's own year is the START year)"}
  - {key: lnbp, prefix: lnbp, label: "LNBP (Mexico, with COPA VALUE and LNBP FEMENIL)", website_id: 14, gender: both,
     season_rule: "calendar year"}
  - {key: nbl1, prefix: nbl1, label: "NBL1 (Australia)", website_id: 3, gender: both,
     season_rule: "calendar year, Mar-Aug (END year); conferences are competition_ids"}
  - {key: lmb, prefix: lmb, label: "Liga Mayor de Baloncesto (El Salvador)", website_id: 13, gender: both,
     season_rule: "calendar year"}
  - {key: lpb, prefix: lpb, label: "LPB / LPBF Liga Profesional de Baloncesto (Panama)", website_id: 22, gender: both,
     season_rule: "calendar year"}
