# Registry of the per-competition convenience families minted over the three multi-competition
# basketball platforms (FIBA GDAP + game pages, Genius LiveStats, Sportradar Atrium).
#
# One entry = one competition = one prefix. Adding a competition is a one-entry change here, then
#   python tools/codegen/gen_basketball_competitions.py
# which rewrites sportsdataverse/basketball/_competitions_registry.py (package data: the wheel ships
# only the package, so the runtime cannot read tools/). tests/basketball/test_competition_factories.py
# pins every fact below to its source (copied from sdv-internal-refs, never read from the checkout).
#
# Common fields:  key (stable id), prefix (function-name prefix, `<prefix>_schedule`), label,
#   gender (men | women | both; "women"/"both" entries are the wehoop mirror's to port), season_rule.
# fiba:   family_id = GDAP competitionMarketingNameId (the competition family; one edition per season);
#   example_season = a season that has an edition, used by the docstring examples.
# genius: org = Genius ORG code; label_include / label_exclude = case-insensitive regexes over the
#   competition label of genius_competitions(org) that pick THE competition of a season (an org lists
#   cups, play-offs and youth leagues beside the headline league).
# atrium: website_id = the embed site config id (one site carries many competitions).
#
# Left out on purpose (already have a dedicated home, so a second prefix would only duplicate it):
#   Genius CEBL, BNXT, IBBA, LKL, KZS; and orgs the hosted schedule does not serve (POL, CBFFE, BSN,
#   LNBP history, NBL, SPB, HKS embed-only). Not yet minted for lack of a verified GDAP family id:
#   EuroBasket (men), AmeriCup, Asia Cup, EuroCup Women, BCL Americas/Asia.
fiba:
  - {key: world_cup, prefix: fiba_wc, example_season: 2023, label: "FIBA Basketball World Cup", family_id: 201, gender: men,
     season_rule: "event year (World Cup 2023 = 2023)"}
  - {key: womens_world_cup, prefix: fiba_wwc, example_season: 2022, label: "FIBA Women's Basketball World Cup", family_id: 306, gender: women,
     season_rule: "event year (2022 = 2022)"}
  - {key: olympics_men, prefix: fiba_oly, example_season: 2024, label: "Men's Olympic Basketball Tournament", family_id: 320, gender: men,
     season_rule: "event year (Paris 2024 = 2024)"}
  - {key: olympics_women, prefix: fiba_woly, example_season: 2024, label: "Women's Olympic Basketball Tournament", family_id: 352, gender: women,
     season_rule: "event year (Paris 2024 = 2024)"}
  - {key: bcl, prefix: fiba_bcl, example_season: 2025, label: "Basketball Champions League (FIBA Men's European Club Competitions Tier 1)", family_id: 112,
     gender: men, season_rule: "END year (2024-25 = 2025)"}
  - {key: euroleague_women, prefix: fiba_elw, example_season: 2025, label: "EuroLeague Women (FIBA Women's European Club Competitions Tier 1)", family_id: 211,
     gender: women, season_rule: "END year (2024-25 = 2025)"}
  - {key: afrobasket, prefix: fiba_afrobasket, example_season: 2025, label: "FIBA AfroBasket", family_id: 179, gender: men,
     season_rule: "event year (2025 = 2025)"}
  - {key: womens_eurobasket, prefix: fiba_weurobasket, example_season: 2025, label: "FIBA Women's EuroBasket", family_id: 297, gender: women,
     season_rule: "event year (2025 = 2025)"}
genius:
  - {key: wbbl, prefix: wbbl, label: "Women's British Basketball League", org: WBBL, gender: women,
     label_include: "Championship", label_exclude: "Play-?Offs",
     season_rule: "END year; the label span 2025-26 = 2026"}
  - {key: slb, prefix: slb, label: "Super League Basketball (UK)", org: SLB, gender: men,
     label_include: "Championship", label_exclude: "^$",
     season_rule: "END year; the label span 2025-26 = 2026"}
  - {key: bal, prefix: bal, label: "Basketball Africa League", org: BAL, gender: men,
     label_include: ".", label_exclude: "^$",
     season_rule: "calendar year (BAL 2025 = 2025); 2023 lists two competitions, so pass comp_id"}
  - {key: nznbl, prefix: nznbl, label: "New Zealand National Basketball League", org: NZNBL, gender: men,
     label_include: "national basketball league|sals nbl", label_exclude: "rapid|women",
     season_rule: "calendar year (2025 = 2025)"}
  - {key: esake, prefix: esake, label: "Greek Basket League (ESAKE)", org: ESAKE, gender: men,
     label_include: "basket league|gbl", label_exclude: "super cup|woman",
     season_rule: "END year; Genius year + 1 (2022-23 = 2023)"}
  - {key: lfb, prefix: lfb, label: "Ligue Feminine de Basket (France, FFBB)", org: FFBB, gender: women,
     label_include: "^ligue feminine( de basket)?$", label_exclude: "^$",
     season_rule: "END year; Genius year + 1 (2018-19 = 2019)"}
  - {key: lnbm, prefix: lnbm, label: "Liga Nationala de Baschet Masculin (Romania)", org: FRB, gender: men,
     label_include: "lnbm|liga nationala de baschet masculin", label_exclude: "^$",
     season_rule: "END year; Genius year + 1 (2016-17 = 2017)"}
  - {key: lub, prefix: lub, label: "Liga Uruguaya de Basquetbol", org: FUBB, gender: men,
     label_include: "liga uruguaya|^lub", label_exclude: "amistosos|femenina",
     season_rule: "END year; Genius year + 1 (2025-26 = 2026)"}
atrium:
  - {key: lnb, prefix: lnb, label: "LNB (France)", website_id: 12, gender: men,
     season_rule: "END year (2026 = 2025-26; the site's own year is the START year)"}
  - {key: lnbp, prefix: lnbp, label: "LNBP (Mexico, with COPA VALUE and LNBP FEMENIL)", website_id: 14, gender: both,
     season_rule: "calendar year"}
  - {key: nbl1, prefix: nbl1, label: "NBL1 (Australia)", website_id: 3, gender: both,
     season_rule: "calendar year, Mar-Aug (END year); conferences are competition_ids"}
  - {key: lmb, prefix: lmb, label: "Liga Mayor de Baloncesto (El Salvador)", website_id: 13, gender: both,
     season_rule: "calendar year"}
  - {key: lpb, prefix: lpb, label: "LPB / LPBF Liga Profesional de Baloncesto (Panama)", website_id: 22, gender: both,
     season_rule: "calendar year"}
