# Probe record (2026-10-05, same-run 200 controls on the data key: explore/browse, nfl/league/*):
#  - REMOVED fs_feed / fs_images / fs_layouts / fs_videos (/fs/{feed,images,layouts,videos}):
#    404 {"fault":"Unable to identify proxy for host: secure"} with BOTH the data and the feed key,
#    so we do not ship endpoints that always raise (same precedent as espn_site_v2.yaml's calendar paths).
#  - REMOVED explore_favorite (/bifrost/v1/explore/favorite/{section}/main): 400 for sports/players,
#    404 for nfl/cfb/teams, ids/sections taken from a live explore/browse payload; never returned data.
#  - KEPT scorechip: chip id nfl11195 comes from a live league/scores-segment payload; the route
#    400s when api-version is sent and returns 200 with apikey only, so it declares no api_version.
#  - KEPT topevents_scoreboard_segment: segment ids (0, 1) come from topevents/scoreboard/main;
#    league-style ids (2026-3-1) 404.
api: fox_api
host: https://api.foxsports.com
name_pattern: fox_api_{short}
module: fox_api
parser_module: fox.fox_api_parsers
qualifier: ''
docstring:
  example_import: true
  see_also:
  - name: Fox Sports
    url: https://www.foxsports.com/
    note: the public site this API renders
  - name: sdv-swagger Fox Sports OpenAPI
    url: https://github.com/sportsdataverse/sdv-swagger
    note: the endpoint spec these wrappers were cleaned from
endpoints:
- short: scoreboard
  summary: GET /bifrost/v1/{sport}/scoreboard/main -- Fox Sports API scoreboard.
  path: /bifrost/v1/{sport}/scoreboard/main
  parser: parse_fox_api_events
  path_params:
  - name: sport
    required: true
    type: str
    description: Fox sport/league slug as used in foxsports.com URLs, e.g. ``nfl``, ``cfb``, ``nba``, ``cbk``, ``wcbk``, ``mlb``, ``nhl``.
  extra_params:
  - name: apikey
    query_key: apikey
    type: str
    default: jE7yBJVRNAwdDesMgTzTXUUSx1It41Fq
    description: Public Fox Sports data-tier key shipped in the foxsports.com web bundle (not a secret); override only if Fox rotates it.
  - name: api_version
    query_key: api-version
    type: str
    default: '1.1'
    description: Fox API version (``api-version`` query key).
  - name: group_id
    query_key: groupId
    type: int
    description: Conference / group id filter.
  example_args:
    sport: nfl
- short: scorechip
  summary: GET /bifrost/v1/{sport}/scorechip/{chip_id} -- one game's score chip (this route 400s if api-version is sent).
  path: /bifrost/v1/{sport}/scorechip/{chip_id}
  parser: parse_fox_api_scorechip
  path_params:
  - name: sport
    required: true
    type: str
    description: Fox sport/league slug as used in foxsports.com URLs, e.g. ``nfl``, ``cfb``, ``nba``, ``cbk``, ``wcbk``, ``mlb``, ``nhl``.
  - name: chip_id
    required: true
    type: str
    description: 'Score-chip id: the league slug plus the numeric game id, e.g. ``nfl11195``.'
  extra_params:
  - name: apikey
    query_key: apikey
    type: str
    default: jE7yBJVRNAwdDesMgTzTXUUSx1It41Fq
    description: Public Fox Sports data-tier key shipped in the foxsports.com web bundle (not a secret); override only if Fox rotates it.
  example_args:
    sport: nfl
    chip_id: nfl11195
