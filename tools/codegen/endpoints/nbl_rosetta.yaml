api: nbl_rosetta
docstring:
  example_import: true
  notes:
  - 'Unofficial: the JSON proxy behind nbl.com.au (not an API the NBL documents or
    supports). The terms of use were not reviewed; payloads are not redistributed
    as release assets.'
  - 'Gated by a referer, not a key: every request carries Origin / Referer set to
    nbl.com.au (the runtime sends them); without them the host answers 403 MISSING_API_KEY,
    which is raised as AssetFetchError.'
  - 'Fills a hole in ESPN: ESPN''s nbl feed has box scores but no plays for the 2025-26
    NBL season (the stats provider changed from Genius Sports to Sportradar DataCore
    that year). nbl_rosetta_match_pbp has the full event log with shot x/y for 2025-26
    and, in the same shape, back to 2011-12 (WNBL about 2014-15). Matches from 1979
    have box scores only.'
  - One host serves three organisations; pass org='nbl' (default), 'wnbl' or 'nbl1'.
    NBL1 is the second tier (men's and women's conferences, calendar-year seasons).
  - Season = the END year (2026 = 2025-26) everywhere. Rosetta's own year is the START
    year for the NBL and WNBL from 1998-99 and a calendar year for NBL1 and the 1979-1997
    winter seasons; the runtime maps it. Year 1998 holds two seasons (calendar 1998
    and 1998-99).
  - 'Ids: <entity>_id columns are DataCore ids (UUID v1; join on them), rosetta_<entity>_id
    Rosetta''s own. match_id is the DataCore fixture id every match route is keyed
    on.'
  - Unknown ids, orgs and types answer 200 with no rows (NoDataError). Rosetta caches
    a body per path and serves it whatever the query string, so a page cut by someone
    else's limit is refused (AssetFetchError); retry after the cache entry expires.
  raises:
  - 'sportsdataverse.errors.NoDataError: Rosetta answered 404 or no rows (an unknown
    match, team, player or season id, an org or season type with nothing, or no season
    in progress).'
  - 'sportsdataverse.errors.AssetFetchError: the 403 gate body, a stub or error envelope,
    a page cut by Rosetta''s path cache, or a body for another org, season or entity
    than the one asked for.'
  see_also:
  - name: NBL
    note: the site whose JSON proxy these wrappers read
    url: https://www.nbl.com.au/
  - name: hoopR
    note: SportsDataverse men's basketball (R)
    url: https://hoopR.sportsdataverse.org
  - name: wehoop
    note: SportsDataverse women's basketball (R)
    url: https://wehoop.sportsdataverse.org
endpoints:
- example_args:
    org: nbl
  extra_params:
  - description: Rows to return. Omitted = a page large enough for the whole list
      (a short page cut by Rosetta's path cache is refused).
    name: limit
    query_key: limit
    type: int
  parser: parse_nbl_rosetta_seasons
  path: /{org}/seasons
  path_params:
  - choices:
    - nbl
    - wnbl
    - nbl1
    default: nbl
    description: 'Organisation: nbl (men''s NBL), wnbl (women''s) or nbl1 (the second
      tier, men''s and women''s conferences).'
    name: org
    required: false
    type: str
  returns_schema: native/nbl_rosetta/seasons
  short: seasons
  summary: 'Every season of an organisation: regular, preseason, in-season cups and
    test seasons, with dates.'
- example_args:
    org: nbl
  parser: parse_nbl_rosetta_seasons
  path: /{org}/seasons/current
  path_params:
  - choices:
    - nbl
    - wnbl
    - nbl1
    default: nbl
    description: 'Organisation: nbl (men''s NBL), wnbl (women''s) or nbl1 (the second
      tier, men''s and women''s conferences).'
    name: org
    required: false
    type: str
  returns_schema: native/nbl_rosetta/seasons_current
  short: seasons_current
  summary: 'The season in progress (empty between seasons: NoDataError).'
- example_args:
    org: nbl
    season: 2026
    season_type: regular
  extra_params:
  - description: Rows to return. Omitted = a page large enough for the whole list
      (a short page cut by Rosetta's path cache is refused).
    name: limit
    query_key: limit
    type: int
  - description: Rows to skip. Pages can overlap, so prefer one large limit.
    name: offset
    query_key: offset
    type: int
  parser: parse_nbl_rosetta_matches
  path: /{org}/matches/in/season/{season}/{season_type}
  path_params:
  - description: 'Season END year (2026 = 2025-26). The runtime maps it to Rosetta''s
      year: the START year for the NBL and WNBL from 1998-99, the calendar year for
      NBL1 and the NBL / WNBL winter seasons up to 1998. END 1998 and 1999 both read
      Rosetta year 1998, which holds two seasons; the matches frame keeps the one
      asked for.'
    name: season
    required: true
    type: int
  - choices:
    - nbl
    - wnbl
    - nbl1
    default: nbl
    description: 'Organisation: nbl (men''s NBL), wnbl (women''s) or nbl1 (the second
      tier, men''s and women''s conferences).'
    name: org
    required: false
    type: str
  - choices:
    - all
    - regular
    - preseason
    - in_season
    - test
    default: all
    description: 'Season type: all (every type of the year), regular (includes finals),
      preseason, in_season (cups, Blitz, NBAxNBL, All-Star) or test.'
    name: season_type
    required: false
    type: str
  returns_schema: native/nbl_rosetta/matches
  short: matches
  summary: 'Matches of a season: ids, teams, venue, status, scores and start time
    (UTC).'
- example_args:
    org: nbl
  extra_params:
  - description: Rows to return. Omitted = a page large enough for the whole list
      (a short page cut by Rosetta's path cache is refused).
    name: limit
    query_key: limit
    type: int
