api: nhl_records
host: https://records.nhl.com/site/api
name_pattern: nhl_records_{short}
module: nhl_records
parser_module: nhl.nhl_records_parsers
qualifier: ''
passthrough_query: true
runtime_imports:
- _get
- format_nhl_season
endpoints:
- short: awards
  returns_schema: native/nhl_records/awards
  summary: List all NHL award / trophy records.
  path: /award-details
  parser: parse_nhl_records
- short: awards_by_franchise
  returns_schema: native/nhl_records/awards_by_franchise
  summary: List award records for a single franchise.
  path: /award-details/{franchise_id}
  path_params:
  - name: franchise_id
    type: int
    required: true
  example_args:
    franchise_id: 1
  parser: parse_nhl_records
- short: awards_trophy_season
  returns_schema: native/nhl_records/awards_trophy_season
  summary: Retrieve the trophy winner for a specific season.
  path: /award-details/trophy/{trophy_id}/season/{season_id}
  path_params:
  - name: trophy_id
    type: int
    required: true
  - name: season_id
    type: int
    required: true
  example_args:
    trophy_id: 1
    season_id: X
  parser: parse_nhl_records
- short: coaches
  returns_schema: native/nhl_records/coaches
  summary: List NHL head coaches.
  path: /coach
  parser: parse_nhl_records
- short: coach
  returns_schema: native/nhl_records/coach
  summary: Retrieve one coach by their numeric ID.
  path: /coach/{coach_id}
  path_params:
  - name: coach_id
    type: int
    required: true
  example_args:
    coach_id: X
  parser: parse_nhl_records
- short: coach_career
  returns_schema: native/nhl_records/coach_career
  summary: Coach career-records (regular season).
  path: /coach-career-records/{coach_id}
  now_variant: /coach-career-records
  now_toggle: coach_id
  path_params:
  - name: coach_id
    type: int
    required: false
  parser: parse_nhl_records
- short: coach_career_with_playoffs
  returns_schema: native/nhl_records/coach_career_with_playoffs
  summary: Coach career records inclusive of regular season + playoffs.
  path: /coach-career-records-regular-plus-playoffs
  parser: parse_nhl_records
- short: coach_franchise
  returns_schema: native/nhl_records/coach_franchise
  summary: Coach records scoped to individual franchise stints.
  path: /coach-franchise-records/{coach_id}
  now_variant: /coach-franchise-records
  now_toggle: coach_id
  path_params:
  - name: coach_id
    type: int
    required: false
  parser: parse_nhl_records
- short: coach_stanley_cup
  returns_schema: native/nhl_records/coach_stanley_cup
  summary: Coach Stanley Cup Final win streak and consecutive-cup records.
  path: /coach-stanley-cup-streak
  parser: parse_nhl_records
- short: franchises
  returns_schema: native/nhl_records/franchises
  summary: List all NHL franchises (historical and active).
  path: /franchise
  parser: parse_nhl_records
- short: franchise_detail
  returns_schema: native/nhl_records/franchise_detail
  summary: Franchise detail records (extended metadata per franchise).
  path: /franchise-detail
  parser: parse_nhl_records
- short: franchise_team_totals
  returns_schema: native/nhl_records/franchise_team_totals
  summary: All-time team totals per franchise (regular season).
  path: /franchise-team-totals
  parser: parse_nhl_records
- short: franchise_season_results
  returns_schema: native/nhl_records/franchise_season_results
  summary: Season-by-season results for each franchise.
  path: /franchise-season-results
  parser: parse_nhl_records
- short: franchise_playoff_appearances
  returns_schema: native/nhl_records/franchise_playoff_appearances
  summary: Franchise playoff appearance counts and streak information.
  path: /franchise-playoff-appearances
  parser: parse_nhl_records
- short: franchise_totals
  returns_schema: native/nhl_records/franchise_totals
  summary: League-wide franchise totals (all-time aggregate per franchise).
  path: /franchise-totals
  parser: parse_nhl_records
- short: all_time_record_vs_franchise
  returns_schema: native/nhl_records/all_time_record_vs_franchise
  summary: All-time head-to-head records between every franchise pairing.
  path: /all-time-record-vs-franchise
  parser: parse_nhl_records
- short: skater_career_stats
  summary: Skater career statistics (all-time, regular season).
  path: /skater-career-statistics
  parser: parse_nhl_records
- short: skater_career_leaders
  summary: All-time skater career leaderboards.
  path: /skater-career-leaders
  parser: parse_nhl_records
- short: consecutive_100pt_seasons
  returns_schema: native/nhl_records/consecutive_100pt_seasons
  summary: Skaters with the most consecutive 100-point seasons.
  path: /consecutive-100-point-seasons
  parser: parse_nhl_records
- short: goalie_career_stats
  returns_schema: native/nhl_records/goalie_career_stats
  summary: Goaltender career statistics (regular season).
  path: /goalie-career-stats
  parser: parse_nhl_records
- short: goalie_career_stats_with_playoffs
  returns_schema: native/nhl_records/goalie_career_stats_with_playoffs
  summary: Goaltender career stats inclusive of regular season and playoffs.
  path: /goalie_career_stats_incl_playoffs
  parser: parse_nhl_records
- short: goalie_season_stats
  returns_schema: native/nhl_records/goalie_season_stats
  summary: Goaltender single-season statistics.
  path: /goalie-season-stats
  parser: parse_nhl_records
- short: goalie_win_streak
  returns_schema: native/nhl_records/goalie_win_streak
  summary: Goaltenders with the longest consecutive-win streaks.
  path: /goalie-win-streak
  parser: parse_nhl_records
- short: goalie_shutout_streak
  returns_schema: native/nhl_records/goalie_shutout_streak
  summary: Goaltenders with the longest consecutive-shutout streaks.
  path: /goalie-shutout-streak
  parser: parse_nhl_records
- short: goalie_win_plateaus
  returns_schema: native/nhl_records/goalie_win_plateaus
  summary: "Goaltenders who reached each win plateau (100, 200, 300 \u2026)."
  path: /goalie-win-plateaus
  parser: parse_nhl_records
- short: goalie_playoff_streak
  returns_schema: native/nhl_records/goalie_playoff_streak
  summary: Goaltender consecutive playoff-win streaks.
  path: /goalie-playoff-streak
  parser: parse_nhl_records
- short: goalie_undefeated_streak
  returns_schema: native/nhl_records/goalie_undefeated_streak
  summary: Goaltender longest undefeated streaks (wins + ties).
  path: /goalie-undefeated-streak
  parser: parse_nhl_records
- short: draft
  returns_schema: native/nhl_records/draft
  summary: Retrieve NHL Entry Draft picks.
  path: /draft/{draft_id}
  now_variant: /draft
  now_toggle: draft_id
  path_params:
  - name: draft_id
    type: int
    required: false
  parser: parse_nhl_records
- short: draft_by_team
  returns_schema: native/nhl_records/draft_by_team
  summary: All draft picks made by a single team.
  path: /draft/byTeam/{team_id}
  path_params:
  - name: team_id
    type: int
    required: true
  example_args:
    team_id: 10
  parser: parse_nhl_records
- short: draft_prospect
  returns_schema: native/nhl_records/draft_prospect
  summary: Draft prospect records.
  path: /draft-prospect/{prospect_id}
  now_variant: /draft-prospect
  now_toggle: prospect_id
  path_params:
  - name: prospect_id
    type: int
    required: false
  parser: parse_nhl_records
- short: draft_lottery_odds
  returns_schema: native/nhl_records/draft_lottery_odds
  summary: Draft lottery odds (current year or filtered by season).
  path: /draft-lottery-odds
  parser: parse_nhl_records
- short: expansion_draft_picks
  returns_schema: native/nhl_records/expansion_draft_picks
  summary: Expansion draft picks (e.g. Vegas 2017, Seattle 2021).
  path: /expansion-draft-picks
  parser: parse_nhl_records
- short: allstar_skater_career
  returns_schema: native/nhl_records/allstar_skater_career
  summary: All-Star Game career statistics for skaters.
  path: /all-star-skater-career-stats
  parser: parse_nhl_records
- short: allstar_goalie_career
  returns_schema: native/nhl_records/allstar_goalie_career
  summary: All-Star Game career statistics for goaltenders.
  path: /all-star-goaltender-career-stats
  parser: parse_nhl_records
- short: allstar_coach_career
  returns_schema: native/nhl_records/allstar_coach_career
  summary: All-Star Game career records for coaches.
  path: /all-star-coach-career-stats
  parser: parse_nhl_records
- short: allstar_skater_game
  returns_schema: native/nhl_records/allstar_skater_game
  summary: All-Star Game single-game scoring records for skaters.
  path: /all-star-skater-game-stats
  parser: parse_nhl_records
- short: allstar_goalie_game
  returns_schema: native/nhl_records/allstar_goalie_game
  summary: All-Star Game single-game stats for goaltenders.
  path: /all-star-goaltender-game-stats
  parser: parse_nhl_records
- short: attendance
  returns_schema: native/nhl_records/attendance
  summary: NHL arena attendance records.
  path: /attendance
  parser: parse_nhl_records
- short: hof_players
  returns_schema: native/nhl_records/hof_players
  summary: Hockey Hall of Fame player inductees.
  path: /hof/players
  parser: parse_nhl_records
- short: hof_players_by_office
  returns_schema: native/nhl_records/hof_players_by_office
  summary: Hall of Fame players for a specific induction office/category.
  path: /hof/players/{office_id}
  path_params:
  - name: office_id
    type: int
    required: true
  example_args:
    office_id: X
  parser: parse_nhl_records
- short: gm_career
  returns_schema: native/nhl_records/gm_career
  summary: General Manager career records.
  path: /general-manager/{gm_id}
  now_variant: /general-manager-career-records
  now_toggle: gm_id
  path_params:
  - name: gm_id
    type: int
    required: false
  parser: parse_nhl_records
- short: gm_franchise
  returns_schema: native/nhl_records/gm_franchise
  summary: General Manager records scoped to franchise stints.
  path: /general-manager-franchise-records
  parser: parse_nhl_records
- short: home_team_record
  returns_schema: native/nhl_records/home_team_record
  summary: League-wide home-team win/loss record by season.
  path: /home-team-record
  parser: parse_nhl_records
- short: away_team_record
  returns_schema: native/nhl_records/away_team_record
  summary: League-wide away-team win/loss record by season.
  path: /away-team-record
  parser: parse_nhl_records
