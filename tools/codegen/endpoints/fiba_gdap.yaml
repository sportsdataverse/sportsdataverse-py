api: fiba_gdap
docstring:
  example_import: true
  notes:
  - FIBA's terms restrict this source. The GDAP developer-portal terms limit API use
    to 'Authorized Users' (federations, organisers, FIBA partners) and say any broader
    use 'is not authorised'; the fiba.basketball terms say no portion of the site
    may be duplicated, redistributed or manipulated. The package owner reviewed both
    clauses on 2026-10-12, accepted them and approved the full intake, published data
    releases included. Users who are not themselves authorised by FIBA should check
    the terms before using the wrappers.
  - The GDAP subscription key is public (fiba.basketball ships it in every page);
    the runtime reads it from the live page at run time and never logs it. Officials'
    contact details and coaches' and officials' dates of birth are dropped from every
    body.
  - 'Id key spaces: competition_id is one per edition (2023 World Cup = 208182) and
    game_id is global across competitions (the <gameId> of a game-page URL). team_id
    is per team per competition (Germany is 279569 at the 2023 World Cup and 281545
    at Paris 2024), while organisation_id is the stable federation or club (64 = Germany,
    every year); the game page''s T_<id> and the play-by-play oId are organisation
    ids, not team ids.'
  raises:
  - 'sportsdataverse.errors.NoDataError: FIBA has nothing for the request (HTTP 404,
    GDAP answered {} or [] for an unknown id, a listed game whose teams are not drawn yet,
    or a game page with no box score).'
  - 'sportsdataverse.errors.AssetFetchError: the fetch failed, or the answer is not
    about the request (an error envelope, HTTP 401 after a key refresh, HTTP 500,
    a body for another game, competition, team, player, federation, family or season,
    the HTTP 200 ''not-found shell'' of a wrong game page, a live game).'
  - 'ValueError: HTTP 400 / 422, a malformed id, season or date, or a game page requested
    without comp.'
  see_also:
  - name: FIBA
    note: the federation whose events and clubs the wrappers read
    url: https://www.fiba.basketball/
endpoints:
- example_args:
    comp: 208182
  extra_params:
  - description: 'Required. FIBA competition id (GDAP key space), one per edition:
      competition.competitionId of any game row (208182 = World Cup 2023, 208722 =
      Paris 2024 men, 208850 = BCL 2024-25). Find it with fiba_gdap_editions or fiba_gdap_games_between.'
    name: comp
    query_key: gdapCompetitionId
    required: true
    transform: _int_id
    type: int
  - description: Optional; the site passes its discipline format. 5x5 answers the
      same as omitting it (verified on awards and rosters)
    name: discipline_format
    query_key: disciplineFormat
    type: str
  parser: parse_fiba_gdap_awards
  path: /getgdapcompetitionawardsbyid
  returns_schema: native/fiba_gdap/awards
  short: awards
  summary: Awards of a competition (MVP, All-Star Five...).
- example_args:
    comp: 208182
  extra_params:
  - description: 'Required. FIBA competition id (GDAP key space), one per edition:
      competition.competitionId of any game row (208182 = World Cup 2023, 208722 =
      Paris 2024 men, 208850 = BCL 2024-25). Find it with fiba_gdap_editions or fiba_gdap_games_between.'
    name: comp
    query_key: gdapCompetitionId
    required: true
    transform: _int_id
    type: int
  parser: parse_fiba_gdap_competition
  path: /getGdapCompetitionById
  returns_schema: native/fiba_gdap/competition
  short: competition
  summary: 'One competition (edition): season, dates, hosts, zone, category and competition
    family.'
- example_args:
    family_id: 201
    season: 2023
  extra_params:
  - description: 'Required. Competition family id (competitionMarketingName.competitionMarketingNameId):
      201 = World Cup, 320 = men''s Olympics, 306 = Women''s World Cup, 112 = BCL
      tier 1, 211 = EuroLeague Women.'
    name: family_id
    query_key: competitionMarketingNameId
    required: true
    transform: _int_id
    type: int
  - description: 'Season key: the END year for club competitions (BCL 2024-25 = 2025),
      the event year for national-team events (World Cup 2023 = 2023); qualifiers
      carry the TARGET tournament year (World Cup 2027 qualifiers played in 2025 =
      2027). Sent unchanged. First season, inclusive; omitted = no lower bound.'
    name: season
    query_key: fromSeason
    transform: _season
    type: int
  - description: Last season, inclusive (same key as season). Omitted with season
      given = the same season.
    name: to_season
    query_key: toSeason
    transform: _season
    type: int
  parser: parse_fiba_gdap_editions
  path: /getgdapcompetitionsbyseasonsandcompetitionmarketingname
  returns_schema: native/fiba_gdap/editions
  short: editions
  summary: Every edition of a competition family between two seasons.
- example_args:
    federation_id: 64
  extra_params:
  - description: Required. Federation organisationId, stable across competitions (64
      = Germany; teamA.organisationId)
    name: federation_id
    query_key: gdapFederationId
    required: true
    transform: _int_id
    type: int
  parser: parse_fiba_gdap_federation_games
  path: /getgdapfederationgamesbyfederationid
  returns_schema: native/fiba_gdap/federation_games
  short: federation_games
  summary: A federation's recent and upcoming national-team games.
- example_args:
    as_of_date: '2025-09-15'
    category: men
    zone_id: 1
  extra_params:
  - default: men
    description: 'Ranking category: men or women (the site also knows boys/girls)'
    name: category
    query_key: gdapCategory
    type: str
  - default: 1
    description: Ranking zone id from getgdaprankingzones (1 = World, 2 = Africa,
      3 = Americas, 4 = Asia, 5 = Europe)
    name: zone_id
    query_key: zoneRankingId
    transform: _int_id
    type: int
  - description: 'Ranking as of this date, ISO 8601: the latest ranking published
      on or before it (2026-03-10 answers the 2026-03-03 ranking). Omitted = the latest
      ranking'
    name: as_of_date
    query_key: asOfDate
    type: str
