api: acb
docstring:
  example_import: true
  notes:
  - 'Legal notice (sdv-internal-refs/acb/README.md, aviso legal of acb.com read 2026-10-12):
    ACEB, S.A.U. claims intellectual property in the site''s databases (the EU sui
    generis database right) among its other content. It authorises viewing and private
    copies for personal or journalistic use with the source credited, and requires
    prior express consent for distribution, reproduction or public communication.
    These wrappers fetch on the user''s behalf; a published data release or a hosted
    mirror needs the owner''s decision first. robots.txt allows the paths.'
  - 'Unofficial and unsupported: api2.acb.com is the .NET API behind acb.com and live.acb.com,
    not a documented public API. It needs the header ``X-APIKEY``, a public key shipped
    in acb.com''s bundle: ``acb_runtime`` sends the documented value (``$ACB_API_KEY``
    overrides it), re-reads the live bundle once on a 401, and never prints the key.'
  - 'Seasons: the API keys a season by ``editionId`` = season START year - 1935 (91
    = 2026-27, 48 = 1983-84, the first). The wrappers take ``season``, the END year
    (2027 = 2026-27), and ``acb_runtime`` sends ``editionId = season - 1936``. A route
    that omits ``season`` serves the current edition. ``team_id`` is a season-team
    entry (new every season); ``club_id`` is the stable club.'
  - 'Coverage: box scores from 1983-84 (old seasons carry only the whole-game period,
    quarter 0); play-by-play and shots from 2016-17 (earlier games answer empty lists,
    which raise NoDataError). Shot coordinates come in two systems, split by match
    id: millimetres from the attacked basket from 2020-21 (``coord_system`` mm), a
    0-100 full-court percent grid before (grid). A game that is not finished (``matchFinished``
    false) raises AssetFetchError for the routes that report it.'
  raises:
  - 'sportsdataverse.errors.NoDataError: the ACB has nothing for the request (an unknown
    id, play-by-play or shots before 2016-17, a club with no games that season); a
    game outside a playoff series is zero rows.'
  - 'sportsdataverse.errors.AssetFetchError: the fetch failed or the answer is not
    the one asked for (a rejected key, an error envelope or stub, a body for another
    season, round, club or player, a game that is not finished).'
  - 'ValueError: a missing or non-integer id, or a season before 1984 (raised before
    any request), or the API''s HTTP 400 / 422.'
  raw_doc: 'the raw body (``dict``): the route''s JSON plus ``_request`` (the ids
    asked for, in snake_case, with ``season`` the END year)'
  see_also:
  - name: ACB
    note: the league site whose API these wrappers read
    url: https://www.acb.com
  - name: wehoop
    note: SportsDataverse women's basketball (R)
    url: https://wehoop.sportsdataverse.org
  - name: hoopR
    note: SportsDataverse men's basketball (R)
    url: https://hoopR.sportsdataverse.org
endpoints:
- example_args:
    match_id: 105401
  extra_params:
  - description: 'Required. ACB match id (integer), one global sequence for every
      competition: legacy ids (seasons up to 2019-20) sit below about 20000 (12559
      = the 2005-06 final); ids from 2020-21 start around 100000 (105401 = Barca 89-86
      Valencia Basket, Liga 2026-27 round 3).'
    name: match_id
    query_key: matchId
    required: true
    type: int
  parser: parse_acb_match_header
  path: /matchdata/MatchHeader/match-header
  returns_schema: native/acb/match_header
  short: match_header
  summary: 'Match header: teams, status, score, bonus, current period and the content
    the site offers.'
