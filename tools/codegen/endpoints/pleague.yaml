api: pleague
docstring:
  example_import: true
  notes:
  - 'Unofficial use of a public source: these wrappers read pleagueofficial.com (P.
    LEAGUE+, Taiwan''s men''s league), keyless, behind Cloudflare (the runtime needs
    curl_cffi: pip install curl_cffi). Release flag: the data release needs owner
    sign-off. The site''s /user-policy (members'' terms, section 11) reserves all
    content on the site to the service and its rights holders and forbids use, copying,
    adaptation or distribution without authorisation (it says nothing about automated
    access); robots.txt holds only Cloudflare content-signal comment lines with no
    Allow, Disallow or Crawl-delay rule. Use for reference only; payloads are not
    redistributed as release assets. The runtime waits at least 1 s before every request,
    retries included.'
  - 'Coverage: schedules, standings and player tables from 2020-21 (season=2021);
    box scores for every finished game from 2020-21; play-by-play (with shot x / y)
    from 2022-23 (gid 191 on). 2020-21 and 2021-22 pages embed an empty game uuid,
    so they have no play-by-play and no Preciser data. A game is keyed by gid: ONE
    global integer sequence over every stage and season. Only finished games are served
    (status 已完賽): an unplayed game, or a box or play-by-play that does not match its
    game page (the routes echo no id, so the runtime checks scores, quarters and points),
    raises AssetFetchError.'
  - 'Seasons are END years (2025 = the slug ''2024-25''). Translation: 客隊 / 主隊 = away
    / home, 已完賽 = finished, 熱身賽 / 例行賽 / 季後賽 / 總冠軍賽 = pre-season / regular season /
    playoffs / finals, 主裁判 = referee, 第一檢查員 / 第二檢查員 = first / second umpire, 洋將 =
    import, 本土 = local, 勝 / 敗 = win / loss. Names stay as printed. Ids: team_id (1-8)
    is stable across renames; box player_id is the player-team membership; the box
    random_id is unreliable before 2022-23 (join on player_id, and box to Preciser
    shots on person_id). The date of birth is dropped from the player frame; officials
    appear by name only.'
  raises:
  - 'sportsdataverse.errors.NoDataError: the source has nothing for the request (an
    unknown game, a stage the season does not have, a game with no play-by-play or
    vendor data).'
  - 'sportsdataverse.errors.AssetFetchError: the fetch failed or the answer is not
    the one asked for (a page or body for another game, an unfinished game, a body
    that does not match its game page, layout drift, a play-by-play phrase outside
    the observed vocabulary).'
  raw_doc: 'the raw record (``dict``): the page record (the refs capture shape), the
    box body as the site sends it, or the parsed play-by-play record, plus ``_request``
    (kind and the season, stage, game or player asked for)'
  see_also:
  - name: P. LEAGUE+
    note: the league site whose pages and PHP routes these wrappers read
    url: https://pleagueofficial.com
  - name: hoopR
    note: SportsDataverse men's basketball (R)
    url: https://hoopR.sportsdataverse.org
  - name: wehoop
    note: SportsDataverse women's basketball (R)
    url: https://wehoop.sportsdataverse.org
endpoints:
- example_args:
    season: 2025
  extra_params:
  - choices:
    - pre-season
    - regular-season
    - playoffs
    - finals
    default: regular-season
    description: 'Stage: pre-season (熱身賽, exhibition games), regular-season (例行賽),
      playoffs (季後賽) or finals (總冠軍賽). A stage a season does not have (2025-26 pre-season)
      answers NoDataError.'
    name: stage
    query_key: stage
    type: str
  parser: parse_pleague_schedule
  path: /schedule/{season}
  path_params:
  - description: Required. Season END year (2025 = the site's slug '2024-25'). ``pleague_runtime``
      sends the slug ``f'{season - 1}-{season % 100:02d}'``. The first season is 2020-21
      (``season=2021``); earlier slugs redirect.
    name: season
    required: true
    type: int
  returns_schema: native/pleague/schedule
  short: schedule
  summary: 'Schedule and results of one season and stage (pre-season, regular season,
    playoffs or finals): one row per game, away team first.'
- example_args:
    gid: 197
  parser: parse_pleague_game
  path: /game/{gid}
  path_params:
  - description: 'Required. P. LEAGUE+ game id on the site: ONE global integer sequence
      over every stage and season (197 = the 2022-23 opener, 662 = the 2025-26 opener),
      e.g. 197; ``gid`` in pleague_schedule. Only finished games are served.'
    name: gid
    required: true
    type: int
  returns_schema: native/pleague/game
  short: game
  summary: 'Header of one finished game: date, venue, both clubs with their score
    and the Preciser game uuid.'
- example_args:
    gid: 197
  parser: parse_pleague_periods
  path: /game/{gid}
  path_params:
  - description: 'Required. P. LEAGUE+ game id on the site: ONE global integer sequence
      over every stage and season (197 = the 2022-23 opener, 662 = the 2025-26 opener),
      e.g. 197; ``gid`` in pleague_schedule. Only finished games are served.'
    name: gid
    required: true
    type: int
  returns_schema: native/pleague/periods
  short: periods
  summary: Points each team scored in each quarter and overtime of one finished game.
- example_args:
    gid: 197
  parser: parse_pleague_officials
  path: /game/{gid}
  path_params:
  - description: 'Required. P. LEAGUE+ game id on the site: ONE global integer sequence
      over every stage and season (197 = the 2022-23 opener, 662 = the 2025-26 opener),
      e.g. 197; ``gid`` in pleague_schedule. Only finished games are served.'
    name: gid
    required: true
    type: int
  returns_schema: native/pleague/officials
  short: officials
  summary: The referee and the two umpires printed under the header of one finished
    game (names only).
- example_args:
    gid: 197
  extra_params:
  - description: 'Required. P. LEAGUE+ game id on the site: ONE global integer sequence
      over every stage and season (197 = the 2022-23 opener, 662 = the 2025-26 opener),
      e.g. 197; ``gid`` in pleague_schedule. Only finished games are served.'
    name: gid
    query_key: gid
    required: true
    type: int
  parser: parse_pleague_box_players
  path: /api/boxscore.preciser.php
  returns_schema: native/pleague/box_players
  short: box_players
  summary: 'Player box score of one finished game: minutes, points, shooting splits,
    rebounds, assists, plus/minus, and the ratings from 2022-23; did-not-play rows
    included.'
- example_args:
    gid: 197
  extra_params:
  - description: 'Required. P. LEAGUE+ game id on the site: ONE global integer sequence
      over every stage and season (197 = the 2022-23 opener, 662 = the 2025-26 opener),
      e.g. 197; ``gid`` in pleague_schedule. Only finished games are served.'
    name: gid
    query_key: gid
    required: true
    type: int
  parser: parse_pleague_box_teams
  path: /api/boxscore.preciser.php
  returns_schema: native/pleague/box_teams
  short: box_teams
  summary: 'Team totals of one finished game: the box score''s total row, home then
    away.'
- example_args:
    gid: 197
  extra_params:
  - description: 'Required. P. LEAGUE+ game id on the site: ONE global integer sequence
      over every stage and season (197 = the 2022-23 opener, 662 = the 2025-26 opener),
      e.g. 197; ``gid`` in pleague_schedule. Only finished games are served.'
    name: gid
    query_key: gid
    required: true
    type: int
  parser: parse_pleague_pbp
  path: /api/playbyplay.php
  returns_schema: native/pleague/pbp
  short: pbp
  summary: Play-by-play of one finished game (2022-23 on) in game order, with shot
    x / y and the clip references.
- example_args:
    season: 2025
  parser: parse_pleague_standings
  path: /standings/{season}
  path_params:
  - description: Required. Season END year (2025 = the site's slug '2024-25'). ``pleague_runtime``
      sends the slug ``f'{season - 1}-{season % 100:02d}'``. The first season is 2020-21
      (``season=2021``); earlier slugs redirect.
    name: season
    required: true
    type: int
  returns_schema: native/pleague/standings
  short: standings
  summary: 'Regular-season standings of one season: record, scoring averages, home
    / away and recent form.'
- example_args:
    season: 2025
    stage_sn: 2
  parser: parse_pleague_stat_player
  path: /stat-player/{season}/{stage_sn}
  path_params:
  - description: Required. Season END year (2025 = the site's slug '2024-25'). ``pleague_runtime``
      sends the slug ``f'{season - 1}-{season % 100:02d}'``. The first season is 2020-21
      (``season=2021``); earlier slugs redirect.
    name: season
    required: true
    type: int
  - description: 'Required. Stage select value of the player table: 2 = regular season,
      3 = playoffs, 4 = finals.'
    name: stage_sn
    required: true
    type: int
  returns_schema: native/pleague/stat_player
  short: stat_player
  summary: 'Player season averages and totals of one season and stage: shooting, rebounds,
    assists and fouls.'
- example_args:
    player_page_id: 1JbPozLB
  parser: parse_pleague_player
  path: /player/{player_page_id}
  path_params:
  - description: Required. The 8-character page id of /player/{id} (e.g. '1JbPozLB'
      = Lai Ting-En); ``player_page_id`` in pleague_stat_player, ``random_id`` in
      pleague_box_players from 2022-23 (unreliable before).
    name: player_page_id
    required: true
    type: str
  returns_schema: native/pleague/player
  short: player
  summary: 'One player''s profile: names, club, jersey, position, height, weight and
    birthplace.'
- example_args:
    player_page_id: 1JbPozLB
  parser: parse_pleague_player_seasons
  path: /player/{player_page_id}
  path_params:
  - description: Required. The 8-character page id of /player/{id} (e.g. '1JbPozLB'
      = Lai Ting-En); ``player_page_id`` in pleague_stat_player, ``random_id`` in
      pleague_box_players from 2022-23 (unreliable before).
    name: player_page_id
    required: true
    type: str
  returns_schema: native/pleague/player_seasons
  short: player_seasons
  summary: One player's season totals and per-game averages, league and East Asia
    Super League, with a career row.
getter_module: sportsdataverse.basketball.plg.pleague_runtime
host: https://pleagueofficial.com
module: pleague
name_pattern: pleague_{short}
parser_columns: true
parser_module: basketball.plg.pleague_parsers
passthrough_query: false
qualifier: ''
runtime_imports:
- _get
schema_prefix: pleague_
