api: pleague_preciser
docstring:
  example_import: true
  notes:
  - 'Unofficial use of a THIRD-PARTY host: api.preciser.io is the analytics vendor
    behind the P. LEAGUE+ game page, not the league''s own API. It is keyless, CORS-open,
    has no robots.txt (404) and no terms were found; it serves the data the league''s
    own game page displays. Release flag: the data release needs owner sign-off (and
    the league''s /user-policy reserves its content). The runtime waits at least 1
    s before every request, retries included.'
  - 'Wrappers take the Preciser game uuid (the uuid column of pleague_game; empty
    before 2022-23, which have no vendor data). Pass the optional gid to verify the
    body against the site''s game page and box: the shot list and the rotation echo
    nothing about the game, so only then is the made-shot count, the roster and the
    court time checked (rotation minutes within 30 s of the box). An unknown uuid
    answers 200 [] (NoDataError) or HTTP 500 (AssetFetchError).'
  - 'Id key spaces: the vendor names teams by uuid (home_id / away_id of the shot
    list, home_team.id of the summary) and persons by personId (the same value as
    the box row''s person); the site''s team_id (1-8, stable across seasons and renames)
    joins to a uuid only through the standings logo file name (photonew.preciser.io/plg/teams/<uuid>.png).'
  - 'Shot x / y are in the VENDOR frame (percent of the court, the home team always
    attacks x = 95) while the site''s play-by-play x / y are in the physical court
    frame (teams swap ends at half-time): x_vendor = 100 - x_pbp and y_vendor = 100
    - y_pbp in the halves where the home team attacks x < 50. The court is 28.75 x
    15.25 m. Clip urls carry a vendor access key (?key=); the runtime scrubs it from
    every body and no frame keeps a url.'
  - 'Clubs, site team_id -> Preciser team uuid (the file name of the club logo): 1
    = e86394aa-3d88-11ed-8ba8-7f44ba46b0b1 (勇士, Taipei Fubon Braves); 2 = e865bb20-3d88-11ed-a956-7f44ba46b0b1
    (領航猿, Taoyuan Pauian Pilots (Taoyuan Pilots from 2024-25)); 3 = e8674343-3d88-11ed-98b4-7f44ba46b0b1
    (攻城獅, Hsinchu Jko Lioneers (Toplus Lioneers from 2023-24)); 4 = e869743f-3d88-11ed-925e-7f44ba46b0b1
    (夢想家, Formosa Taishin Dreamers (Formosa Dreamers from 2022-23)); 5 = e86cac11-3d88-11ed-8637-7f44ba46b0b1
    (鋼鐵人, Kaohsiung 17LIVE Steelers); 6 = e86b0ecc-3d88-11ed-bed5-7f44ba46b0b1 (國王,
    New Taipei Kings); 7 = 3c3a601a-358a-11ed-ab92-711c34ed1298 (獵鷹, TSG Ghosthawks);
    8 = bf957f5a-9389-11f0-812c-a38482ec4d30 (洋基工程, Yankey Ark).'
  raises:
  - 'sportsdataverse.errors.NoDataError: the source has nothing for the request (an
    unknown game, a stage the season does not have, a game with no play-by-play or
    vendor data).'
  - 'sportsdataverse.errors.AssetFetchError: the fetch failed or the answer is not
    the one asked for (a page or body for another game, an unfinished game, a body
    that does not match its game page, layout drift, a play-by-play phrase outside
    the observed vocabulary).'
  raw_doc: 'the raw record (``dict``): ``{''data'': <the vendor''s game object>, ''_request'':
    {...}}`` with the clip access key scrubbed'
  see_also:
  - name: Preciser
    note: the analytics vendor (third party) behind the P. LEAGUE+ game page
    url: https://api.preciser.io
  - name: P. LEAGUE+
    note: the league site that embeds the vendor's widgets and holds the game uuid
    url: https://pleagueofficial.com
  - name: hoopR
    note: SportsDataverse men's basketball (R)
    url: https://hoopR.sportsdataverse.org
  - name: wehoop
    note: SportsDataverse women's basketball (R)
    url: https://wehoop.sportsdataverse.org
endpoints:
- example_args:
    uuid: e6f98675-3e5b-11ed-949e-5d17350689cf
  extra_params:
  - description: Optional. The site's game id for this uuid. When given the runtime
      also fetches the site's game page and box (cached) and checks the vendor body
      against them (uuid, final score, made shots, roster and minutes); the uuid must
      be the game page's. Without it only the checks the body allows by itself run.
    name: gid
    query_key: gid
    type: int
  parser: parse_pleague_preciser_shots
  path: /v1/chart-data/id/{uuid}
  path_params:
  - description: Required. The Preciser game uuid the site's game page embeds (``uuid``
      of pleague_game; empty before 2022-23, which have no vendor data), e.g. 'e6f98675-3e5b-11ed-949e-5d17350689cf'
      (gid 197).
    name: uuid
    required: true
    type: str
  returns_schema: native/pleague_preciser/shots
  short: shots
  summary: Every field-goal attempt of one finished game with court x / y (vendor
    frame), zone, style and result.
- example_args:
