    name: game_id
    query_key: game_id
    required: true
    type: int
  fixed_params:
    method: getGameInfo
  parser: parse_ibba_segev_game_info
  path: /realtimestat_heb/api/
  returns_schema: native/ibba_segev/game_info
  short: game_info
  summary: 'Game header: tip-off, competition, both teams and the game state (scores
    are in the box score).'
