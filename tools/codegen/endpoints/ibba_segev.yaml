api: ibba_segev
docstring:
  example_import: true
  notes:
  - 'Access (sdv-internal-refs/ibba/README.md): Segev Stats is the live-stats vendor
    behind basket.co.il''s game pages; its JSON-RPC API is keyless, unofficial and
    not documented for outside use. The wrappers space requests at least one second
    apart and read only finished games; payloads are not redistributed as release
    assets. The host serves JSON as text/html.'
  - 'Games and ids. ``game_id`` is one flat Segev id space across seasons AND competitions:
    men''s Winner League, Winner Cup, women''s, Leumit, youth, school and pre-season
    games share it, so read ``competition`` from ``ibba_segev_game_info`` (team names
    do not separate men from women reliably). There is no game list: league game ids
    come from ``ibba_games.segev_game_id`` (2025-26 on), the women''s league and Leumit
    from a scan or Genius Sports org IBBA. Segev team and player ids are stable across
    seasons (Jaylen Hoard = player 1000 in games 50 and 419), unlike the IBBA season
    registrations, and are not IBBA ids.'
  - 'Play-by-play: actions name the player by Segev id and by JERSEY number, ``score``
    reads away-home, and shot ``x`` / ``y`` are one half-court frame (x 0-1470 across,
    basket near 735; y out from the baseline, rim near 112-140); which sideline is
    x = 0 and the metric scale are unverified. Segev renamed its team game stats between
    2025-26 and 2026-27; the parsers unify them. Unfinished games and ids of another
    game are refused.'
  raises:
  - 'sportsdataverse.errors.NoDataError: Segev has nothing for the request (HTTP 404,
    ''game not found'', a finished game with no actions).'
  - 'sportsdataverse.errors.AssetFetchError: the fetch failed or the answer is not
    the one asked for (a non-200, an error or changed envelope, a body for another
    game, a game that is not final).'
  raw_doc: 'the raw JSON-RPC envelope (``dict``): ``result`` with the method''s block
    plus ``_request`` (the method and game id sent)'
  see_also:
  - name: Segev Stats
    note: the live-stats vendor behind the Israeli league game pages
    url: https://stats.segevstats.com
  - name: wehoop
    note: SportsDataverse women's basketball (R)
    url: https://wehoop.sportsdataverse.org
  - name: hoopR
    note: SportsDataverse men's basketball (R)
    url: https://hoopR.sportsdataverse.org
