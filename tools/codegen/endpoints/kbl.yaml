  parser: parse_kbl_playoff_games
  path: /league/playoff/{season}
  path_params:
  - description: Season END year (2026 = 2025-26; the inaugural 1997 season is 1997,
      the latest 2027). kbl_runtime maps it to the KBL seasonCode (47 = 2025-26).
    name: season
    required: true
    type: int
  returns_schema: native/kbl/playoff_games
  short: playoff_games
  summary: The games of the playoff bracket (2024-25 on; the older bracket format
    lists no games).
- example_args:
    season: 2025
  parser: parse_kbl_round_mvps
  path: /league/round-mvp/{season}
  path_params:
  - description: Season END year (2026 = 2025-26; the inaugural 1997 season is 1997,
      the latest 2027). kbl_runtime maps it to the KBL seasonCode (47 = 2025-26).
    name: season
    required: true
    type: int
  returns_schema: native/kbl/round_mvps
  short: round_mvps
  summary: The round MVPs of a season with their totals over the round.
- example_args: {}
  parser: parse_kbl_current_standings
  path: /league/rank/team
  returns_schema: native/kbl/current_standings
  short: current_standings
  summary: 'Current standings of the active season (no parameter): record, games behind,
