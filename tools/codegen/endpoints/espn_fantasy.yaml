api: espn_fantasy
docstring:
  example_import: true
  notes:
  - 'Public data only. No cookie is ever sent, so these wrappers read every game''s
    league-agnostic routes and the PUBLIC leagues ESPN lists in espn_fantasy_league_directory.
    A private league answers HTTP 401: reading one needs its owner''s espn_s2 / SWID
    cookies, which this package does not take.'
  - 'Season ids are ESPN''s: the start year for football (2026 = fall 2026), the end
    year for basketball and hockey (2026-27 = 2027). Ids are Int64; team_id is unique
    only inside one league. No member or owner account id is returned.'
  raises:
  - 'sportsdataverse.errors.NoDataError: ESPN answered 404 (unknown game, season or
    id).'
  - 'AssetFetchError: also raised for a private league (HTTP 401).'
  see_also:
  - name: ESPN Fantasy
    note: the fantasy platform these routes serve; public leagues are listed in its
      draft lobby
    url: https://fantasy.espn.com/
endpoints:
- example_args:
    game: ffl
    league_default_id: 1
    season: 2026
  fixed_params:
    view: mSettings
  parser: parse_espn_fantasy_scoring
  path: /games/{game}/seasons/{season}/segments/0/leaguedefaults/{league_default_id}
  path_params:
  - choices:
    - ffl
    - fba
    - flb
    - fhl
    - wfba
    description: 'Fantasy game: ffl (football), fba (men''s basketball), flb (baseball),
      fhl (hockey), wfba (women''s basketball).'
    name: game
    required: true
    type: str
  - description: 'ESPN''s season id: the START year for ffl (2026 = the fall 2026
      season), the END year for fba / fhl (2026-27 = 2027); flb and wfba fit in one
      year. espn_fantasy_games gives each game''s current one.'
    name: season
    required: true
    type: int
  - description: Default-settings template id (league_default_id in espn_fantasy_league_directory).
    name: league_default_id
    required: true
    type: int
  returns_schema: native/espn_fantasy/default_scoring
  short: default_scoring
  summary: Scoring items of one of ESPN's default league-settings templates (points
    per stat).
- example_args: {}
  parser: parse_espn_fantasy_games
  path: /games
  returns_schema: native/espn_fantasy/games
  short: games
  summary: Every ESPN fantasy game (ffl, fba, flb, fhl, wfba) with its current season
    and scoring period.
- example_args:
    game: fba
    league_id: 1535462463
    scoring_period_id: 37
    season: 2027
  extra_params:
  - description: 'Scoring period: the NFL week for ffl, one day of the season for
      the other games. Omitted = the league''s current period.'
    name: scoring_period_id
    query_key: scoringPeriodId
    type: int
  fixed_params:
    view: mBoxscore
  parser: parse_espn_fantasy_league_boxscores
  path: /games/{game}/seasons/{season}/segments/0/leagues/{league_id}
  path_params:
  - choices:
    - ffl
    - fba
    - flb
    - fhl
    - wfba
    description: 'Fantasy game: ffl (football), fba (men''s basketball), flb (baseball),
      fhl (hockey), wfba (women''s basketball).'
    name: game
    required: true
    type: str
  - description: 'ESPN''s season id: the START year for ffl (2026 = the fall 2026
      season), the END year for fba / fhl (2026-27 = 2027); flb and wfba fit in one
      year. espn_fantasy_games gives each game''s current one.'
    name: season
    required: true
    type: int
  - description: Public league id (league_id in espn_fantasy_league_directory). A
      private league answers HTTP 401 without its owner's cookies and is out of scope.
    name: league_id
    required: true
    type: int
  returns_schema: native/espn_fantasy/league_boxscores
  short: league_boxscores
  summary: 'Box scores of a public league for one scoring period: each player''s fantasy
    points by matchup.'
- example_args:
    game: fba
    season: 2027
  parser: parse_espn_fantasy_league_directory
  path: /games/{game}/seasons/{season}/leaguedirectory/{league_sub_type}
  path_params:
  - choices:
    - ffl
    - fba
    - flb
    - fhl
    - wfba
    description: 'Fantasy game: ffl (football), fba (men''s basketball), flb (baseball),
