    name: season
    required: true
    type: int
  - choices:
    - DRAFT_LOBBY
    - MOCKDRAFT_LOBBY
    default: DRAFT_LOBBY
    description: 'DRAFT_LOBBY: ESPN-run public leagues with an upcoming or running
      draft. MOCKDRAFT_LOBBY: mock-draft rooms.'
    name: league_sub_type
    required: false
    type: str
  returns_schema: native/espn_fantasy/league_directory
  short: league_directory
  summary: 'ESPN''s public-league directory: the public leagues anyone can join, readable
    by league id.'
