api: sihf_api_web
host: https://data.sihf.ch/statistic/api/cms
name_pattern: sihf_{short}
module: sihf_api_web
parser_module: hockey.sihf.sihf_api_web_parsers
getter_module: sportsdataverse.hockey.sihf.sihf_runtime
qualifier: web
schema_prefix: sihf_
# The generated wrappers pass each endpoint's documented column names (columns=), so an empty
# season table parses to a zero-row frame with its documented schema.
parser_columns: true
docstring:
  example_import: true
  raises:
  - 'sportsdataverse.errors.NoDataError: SIHF answered 404 (unknown game), or it ignored a requested season
    / league / phase and served another one.'
  see_also:
  - name: SIHF
    note: the Swiss Ice Hockey Federation site whose statistics the API serves
    url: https://www.sihf.ch/
endpoints:
- short: results
  summary: 'Games of a league season: date, teams, score, per-period score, decision, status and game_id.'
  path: /table
  fixed_params:
    alias: results
    searchQuery: 1//
  extra_params:
  - name: season
    query_key: Season
    type: int
    required: true
    description: Required. Season by its END year (2026 = 2025-26). A season SIHF does not have raises
      NoDataError (the API itself silently answers another one).
  - name: league_id
    query_key: League
    type: int
    default: 1
    description: 'SIHF league id: 1 = National League, 2 = Swiss League, 100 = MyHockey League, 3 = 1.
      Liga, 43 = SWHL B, 113 = U21-Elit (the body''s League filter lists them). An id SIHF does not have
      for the season raises NoDataError.'
  - name: phase_id
    query_key: Phase
    type: int
    description: 'SIHF phase id (regular season, a playoff round, ...; the body''s Phase filter lists
      them). None = no phase filter: the season summary over every phase (player / goalie tables), every
      game (results), the regular-season table (standings).'
  - name: language
    query_key: language
    type: str
    default: en
    choices:
    - en
    - de
    - fr
    - it
    kw_only: true
    description: 'Response language. Only part of the body is translated: status, position and penalty
      names stay German.'
  example_args:
    season: 2026
    league_id: 1
  parser: parse_sihf_table
  returns_schema: native/sihf_api_web/results
- short: standings
  summary: 'League table of a season (every game, or home / away games only): rank, games, points, regulation
    / overtime / shootout wins and losses, goals, streak.'
  path: /table
  fixed_params:
    alias: standing
    searchQuery: 1//
  extra_params:
  - name: season
    query_key: Season
    type: int
    required: true
    description: Required. Season by its END year (2026 = 2025-26). A season SIHF does not have raises
      NoDataError (the API itself silently answers another one).
  - name: league_id
    query_key: League
    type: int
    default: 1
    description: 'SIHF league id: 1 = National League, 2 = Swiss League, 100 = MyHockey League, 3 = 1.
      Liga, 43 = SWHL B, 113 = U21-Elit (the body''s League filter lists them). An id SIHF does not have
      for the season raises NoDataError.'
  - name: phase_id
    query_key: Phase
    type: int
    description: 'SIHF phase id (regular season, a playoff round, ...; the body''s Phase filter lists
      them). None = no phase filter: the regular-season table.'
  - name: venue
    query_key: ContentType
    type: str
    default: All
    choices:
    - All
    - Home
    - Away
    kw_only: true
    description: 'Which games the table counts: All (the full table), Home or Away. Always sent: without
      it SIHF answers the away-games table (26 of the 52 National League games).'
  - name: language
    query_key: language
    type: str
    default: en
    choices:
    - en
    - de
    - fr
    - it
    kw_only: true
    description: 'Response language. Only part of the body is translated: status, position and penalty
      names stay German.'
  example_args:
    season: 2026
    league_id: 1
  parser: parse_sihf_table
  returns_schema: native/sihf_api_web/standings
