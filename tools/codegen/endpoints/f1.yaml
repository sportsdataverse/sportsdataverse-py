  - description: Rows to skip (paging on the innermost rows counted by `MRData.total`).
      Default 0.
    name: offset
    query_key: offset
    type: str
  parser: parse_f1_mrdata
  path: /{season}/constructorStandings.json
  path_params:
  - description: Four-digit season year, or `current`.
    name: season
    required: true
    type: str
  returns_schema: native/f1/constructor_standings
  short: constructor_standings
  summary: Constructors' championship standings after the season's last round.
