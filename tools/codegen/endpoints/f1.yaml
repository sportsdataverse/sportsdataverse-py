api: f1
docstring:
  example_import: true
  notes:
  - 'Data license CC BY-NC-SA 4.0 (non-commercial, attribution, share-alike): sdv-py
    wraps the API on the caller''s behalf and never republishes Jolpica payloads as
    release assets.'
  - 'Rate limit 4 requests/second burst, 500 requests/hour sustained, unauthenticated,
    per IP and shared by every process on the machine. Paging: ``limit`` is capped
    at 100 (a larger value is clamped and echoed in ``MRData.limit``); ``offset``
    pages the innermost rows counted by ``MRData.total``.'
  - '``season`` accepts ``current``; ``round`` accepts ``last`` / ``next``. Paths
    are case-insensitive.'
  raises:
  - 'sportsdataverse.errors.NoDataError: the Jolpica API returned 404 (unknown season,
    round or driver id).'
  see_also:
  - name: Jolpica F1 API
    note: the Ergast-compatible API this family wraps (docs, terms, rate limit)
    url: https://github.com/jolpica/jolpica-f1
  - name: f1dataR
    note: the R twin over the same API; wrapper and column names follow it (integer
      columns are typed here)
    url: https://scottyd22.github.io/f1dataR/
  - name: FastF1
    note: timing, telemetry and session data that sdv-py does not wrap
    url: https://docs.fastf1.dev/
endpoints:
- example_args: {}
  extra_params:
  - description: Page size. Default 30, maximum 100 (a larger value is clamped to
      100 and echoed in `MRData.limit`).
    name: limit
    query_key: limit
    type: str
  - description: Rows to skip (paging on the innermost rows counted by `MRData.total`).
      Default 0.
    name: offset
    query_key: offset
    type: str
  parser: parse_f1_mrdata
  path: /circuits.json
  returns_schema: native/f1/circuits
  short: circuits
  summary: All circuits.
- example_args:
    season: 2024
  extra_params:
