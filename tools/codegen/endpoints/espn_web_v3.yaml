api: espn_web_v3
host: web_v3
name_pattern: espn_{prefix}_{short}
endpoints:
- short: athlete_overview
  returns_schema: athlete_overview
  scope: universal
  path: /{sport}/{league}/athletes/{athlete_id}/overview
  path_params:
  - name: athlete_id
    type: int|str
    required: true
  parser: parse_athlete_overview
  example_args:
    athlete_id: '4239'
- short: athlete_stats
  returns_schema: athlete_stats
  scope: universal
  path: /{sport}/{league}/athletes/{athlete_id}/stats
  path_params:
  - name: athlete_id
    type: int|str
    required: true
  extra_params:
  - name: season
    query_key: season
    type: int|str
  parser: parse_athlete_stats
  example_args:
    athlete_id: '4239'
  league_example_args:  # an athlete of each league (4239 is an NBA id); live-checked 2026-10-18
    wnba:
      athlete_id: '3149391'
    mbb:
      athlete_id: '4684793'
    wbb:
      athlete_id: '4433403'
    nfl:
      athlete_id: '3139477'
    mlb:
      athlete_id: '39832'
- short: athlete_gamelog
  returns_schema: athlete_gamelog
  scope: universal
  path: /{sport}/{league}/athletes/{athlete_id}/gamelog
  path_params:
  - name: athlete_id
    type: int|str
    required: true
  extra_params:
  - name: season
    query_key: season
    type: int|str
  parser: parse_athlete_gamelog
  example_args:
    athlete_id: '4239'
- short: athlete_splits
  returns_schema: athlete_splits
  scope: universal
  path: /{sport}/{league}/athletes/{athlete_id}/splits
  path_params:
  - name: athlete_id
    type: int|str
    required: true
  extra_params:
  - name: season
    query_key: season
    type: int|str
  parser: parse_athlete_splits
  example_args:
    athlete_id: '4239'
- short: leaders
  scope: universal
  path: /{sport}/{league}/statistics/byathlete
  # Live-probed 2026-10-26 (cfb 2023, nba 2024): football takes category as '<group>:<category>'
  # (offense:passing, offense:rushing, offense:receiving, defense:defensive, scoring:scoring all answer;
  # a bare 'passing' is HTTP 400); basketball takes the bare name ('offensive'; 'general:offensive' is
  # a 400). sort is '<category>.<statName>:<asc|desc>'; 'passingYards:desc' without its category is a 400.
  extra_params:
  - name: category
    query_key: category
    type: str
    description: "Leaderboard population: the athletes ranked in that category, whose values it fills (other categories
      come back null). Football takes `<group>:<category>` (`offense:passing`, `offense:rushing`, `offense:receiving`,
      `defense:defensive`, `scoring:scoring`); a bare `passing` is rejected with HTTP 400 (ValueError). Basketball takes
      the bare name (`offensive`)."
  - name: season
    query_key: season
    type: int|str
  - name: season_type
    query_key: seasontype
    type: int
  - name: limit
    query_key: limit
    type: int
    default: 50
  - name: page
    query_key: page
    type: int
    default: 1
  - name: sort
    query_key: sort
    type: str
    description: "Sort key `<category>.<statName>:<asc|desc>`, the names in the payload's categories (`passing.passingYards:desc`,
      `offensive.avgPoints:desc`). A stat without its category is rejected with HTTP 400 (ValueError)."
  parser: parse_leaders
  returns_schema: leaders
