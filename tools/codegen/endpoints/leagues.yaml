hosts:
  site_v2: "https://site.api.espn.com/apis/site/v2/sports"
  site_v2_alt: "https://site.api.espn.com/apis/v2/sports"
  web_v3: "https://site.web.api.espn.com/apis/common/v3/sports"
  core_v2: "https://sports.core.api.espn.com/v2/sports"
  # ESPN's FPI surface. The core_v2 powerindex endpoint returns only $ref links;
  # this host serves the resolved Football Power Index table directly.
  fitt_v3: "https://site.web.api.espn.com/apis/fitt/v3/sports"
  # espn.com's own page data (gamecast, boxscore, schedule, scoreboard, rankings)
  # as JSON. Keyed by league slug only -- no {sport} segment. See espn_cdn.yaml.
  cdn: "https://cdn.espn.com/core"
leagues:
  - {prefix: nba, sport: basketball, league: nba, scopes: [universal]}
  - {prefix: wnba, sport: basketball, league: wnba, scopes: [universal]}
  - {prefix: nbagl, sport: basketball, league: nba-development, scopes: [universal]}
  - {prefix: nbl, sport: basketball, league: nbl, scopes: [universal], group: basketball}
  - {prefix: fiba, sport: basketball, league: fiba, scopes: [universal], group: basketball}
  - {prefix: olympics_mbk, sport: basketball, league: mens-olympics-basketball, scopes: [universal], group: basketball}
  - {prefix: olympics_wbk, sport: basketball, league: womens-olympics-basketball, scopes: [universal], group: basketball}
  - {prefix: nbasl_lv, sport: basketball, league: nba-summer-las-vegas, scopes: [universal], group: basketball}
  - {prefix: nbasl_ut, sport: basketball, league: nba-summer-utah, scopes: [universal], group: basketball}
  - {prefix: nbasl_ca, sport: basketball, league: nba-summer-california, scopes: [universal], group: basketball}
  - {prefix: nbasl_sac, sport: basketball, league: nba-summer-sacramento, scopes: [universal], group: basketball}
  - {prefix: nbasl_orl, sport: basketball, league: nba-summer-orlando, scopes: [universal], group: basketball}
  - {prefix: nbasl_gs, sport: basketball, league: nba-summer-golden-state, scopes: [universal], group: basketball}
  - {prefix: mbb, sport: basketball, league: mens-college-basketball, scopes: [universal, ncaa]}
  - {prefix: wbb, sport: basketball, league: womens-college-basketball, scopes: [universal, ncaa]}
  - {prefix: cfb, sport: football, league: college-football, scopes: [universal, ncaa, football]}
  - {prefix: nfl, sport: football, league: nfl, scopes: [universal, football]}
  - {prefix: mlb, sport: baseball, league: mlb, scopes: [universal, mlb]}
  - {prefix: nhl, sport: hockey, league: nhl, scopes: [universal]}
  - {prefix: mch, sport: hockey, league: mens-college-hockey, scopes: [universal, ncaa], group: hockey}
  - {prefix: wch, sport: hockey, league: womens-college-hockey, scopes: [universal, ncaa], group: hockey}
  - {prefix: college_baseball, sport: baseball, league: college-baseball, scopes: [universal, ncaa], group: baseball}
  - {prefix: college_softball, sport: baseball, league: college-softball, scopes: [universal, ncaa], group: baseball}
  - {prefix: ufl, sport: football, league: ufl, scopes: [universal], group: football}
  - {prefix: xfl, sport: football, league: xfl, scopes: [universal], group: football}
  - {prefix: cfl, sport: football, league: cfl, scopes: [universal], group: football}
  # --- Soccer: one league-parameterized catch-all family + curated headline aliases ---
  - {prefix: soccer, sport: soccer, league: eng.1, league_param: true, scopes: [universal]}
  - {prefix: epl, sport: soccer, league: eng.1, scopes: [universal], group: soccer}
  - {prefix: laliga, sport: soccer, league: esp.1, scopes: [universal], group: soccer}
  - {prefix: bundesliga, sport: soccer, league: ger.1, scopes: [universal], group: soccer}
  - {prefix: seriea, sport: soccer, league: ita.1, scopes: [universal], group: soccer}
  - {prefix: ligue1, sport: soccer, league: fra.1, scopes: [universal], group: soccer}
  - {prefix: mls, sport: soccer, league: usa.1, scopes: [universal], group: soccer}
  - {prefix: ligamx, sport: soccer, league: mex.1, scopes: [universal], group: soccer}
  - {prefix: ucl, sport: soccer, league: uefa.champions, scopes: [universal], group: soccer}
  - {prefix: uel, sport: soccer, league: uefa.europa, scopes: [universal], group: soccer}
  - {prefix: nwsl, sport: soccer, league: usa.nwsl, scopes: [universal], group: soccer}
  - {prefix: wwc, sport: soccer, league: fifa.wwc, scopes: [universal], group: soccer}
  - {prefix: wc, sport: soccer, league: fifa.world, scopes: [universal], group: soccer}
  # --- Cricket: param-mode catch-all (headline cricket aliases land later after slug discovery) ---
  - {prefix: cricket, sport: cricket, league: eng.1, league_param: true, scopes: [universal]}
  # --- Lacrosse: param-mode family over league=pll | mens-college-lacrosse | womens-college-lacrosse.
  # ESPN's lacrosse surface is thin (no athletes, rosters, play-by-play or player box scores), so
  # ``endpoints`` allowlists the shorts a live probe (2026-11-25, real event and team ids) saw return
  # data for at least one of the three. College-only: rankings, season_week_rankings. PLL-only: draft,
  # teams_site, standings, franchises, franchise. season_group_teams answers for pll and the women,
  # season_group_children for the men (checked with each league's own group id). The examples carry those
  # probed ids (``league_example_args: lacrosse`` in espn_site_v2 / espn_core_v2; the college-only routes name
  # a college league), and tests/test_espn_live.py runs every one. ---
  - prefix: lacrosse
    sport: lacrosse
    league: pll
    league_param: true
    scopes: [universal, ncaa]
    endpoints:
      - scoreboard
      - summary
      - news
      - draft
      - teams_site
      - team
      - team_schedule
      - standings
      - conferences
      - rankings
      - league_root
      - season_pointer
      - seasons
      - season_info
      - season_types
      - season_type
      - season_groups
      - season_group
      - season_group_teams
      - season_group_children
      - season_teams
      - season_team
      - events
      - event
      - event_competition
      - event_competitors
      - event_competitor
      - event_competitor_linescores
      - event_status
      - event_broadcasts
      - teams_core
      - team_core
      - season_week_rankings
      - franchises
      - franchise
  # --- Golf: param-mode family over league=pga | lpga | liv | eur | champions-tour. A golf event is a
  # field of players (no teams, rosters or standings), so ``endpoints`` allowlists the shorts a live probe
  # (2026-11-25, the 2026 Masters and CME Group Tour Championship) saw return data; the golf-scoped
  # ``leaderboard`` adds the full field with positions and player status. ``leaders`` answered for pga only. ---
  - prefix: golf
    sport: golf
    league: pga
    league_param: true
    scopes: [universal, golf]
    endpoints:
      - scoreboard
      - leaderboard
      - news
      - statistics_league
      - athlete_overview
      - leaders
      - league_root
      - season_pointer
      - seasons
      - season_info
      - season_types
      - season_type
      - season_type_leaders
      - season_athletes
      - athletes_index
      - athlete_core
      - athlete_statisticslog
      - athlete_seasons
      - events
      - event
      - event_competition
      - event_competitors
      - event_competitor
      - event_competitor_linescores
      - event_competitor_statistics
      - event_status
      - event_broadcasts
      - event_leaders
      - venues
      - venue
      - tournaments
