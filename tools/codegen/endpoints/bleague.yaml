api: bleague
docstring:
  example_import: true
  notes:
  - 'Unofficial and unsupported: the game contexts are JSON objects in B.LEAGUE''s
    own public S3 bucket (b-league.s3.amazonaws.com, the store its game pages read),
    and schedule / standings / game_detail are pages of www.bleague.jp parsed here.
    Neither host publishes terms for this use (the site''s /terms/ answers 404; robots.txt
    sets a Crawl-delay only for msnbot and bingbot), and ``bleague_runtime`` spaces
    requests at least 1 s apart. SportsDataverse has not ruled on the site''s terms,
    so payloads are not redistributed as release assets.'
  - 'Seasons: the site''s ``Year`` is the season START year; every wrapper takes ``season``,
    the END year (2026 = 2025-26), and ``bleague_runtime`` sends ``season - 1``. Game
    wrappers take the global ``schedule_key`` (one integer sequence across B1, B2,
    B3 and every season: 1 = the 2016-17 opener, 5856 in 2020-21, 500017 in 2022-23,
    504734 / 505508 B1 / B2 and 10693 B3 in 2025-26); list a day''s keys with ``bleague_schedule``.
    The runtime reads the feed at run time: v2 (B1/B2 from 2020-21), then v1 (B3 and
    B1/B2 2018-2020), then the game page''s embedded copy (the only source of 2016-17
    and 2017-18).'
  - 'Coverage: game wrappers serve FINISHED games only (an unfinished game raises
    AssetFetchError; 2019-20 game 4153 is an unfinished feed). The two feeds differ:
    v2 ids are strings, v1 ids integers (both become text here); v1 adds leaders and
    the score track; the team-rebound codes 18 / 19 are swapped between them and a
    v1 substitution is one row where v2 has two (see ``bleague_pbp``). Shot x / y
    exist from 2022-23 on v2 only, ``side`` from 2025-26; before that ``bleague_shots``
    is empty. Player and team names are Japanese (English names only on the box score
    and header); the code tables are in ``bleague_codes``.'
  raises:
  - 'sportsdataverse.errors.NoDataError: B.LEAGUE has nothing for the request (a ScheduleKey
    no source holds, a schedule day without games, HTTP 404).'
  - 'sportsdataverse.errors.AssetFetchError: the fetch failed or the answer is not
    the one asked for (an unfinished game, a context or page for another game, season,
    tab or day, an error or changed body, a truncated schedule list).'
  - 'ValueError: a non-integer or out-of-range argument, or HTTP 400 / 422.'
  raw_doc: 'the raw body (``dict``): the game context (``Game``, ``PlayByPlays``,
    ``HomeBoxscores``, ``AwayBoxscores``, ``Summaries`` and on v1 ``Leaders``, ``Points``)
    stamped ``_request`` (``schedule_key``, ``feed``), or the schedule / standings
    page record'
  see_also:
  - name: B.LEAGUE
    note: the Japan Professional Basketball League site whose pages and game store
      these wrappers read
    url: https://www.bleague.jp
  - name: wehoop
    note: SportsDataverse women's basketball (R)
    url: https://wehoop.sportsdataverse.org
  - name: hoopR
    note: SportsDataverse men's basketball (R)
    url: https://hoopR.sportsdataverse.org
endpoints:
- example_args:
    schedule_key: 504734
  extra_params:
  - description: 'Optional guard: the season END year the game must belong to. A context
      whose Year differs raises AssetFetchError. Omitted = no check (the key alone
      selects the game).'
    name: season
    query_key: season
    required: false
    type: int
  parser: parse_bleague_game_info
  path: /contexts/{schedule_key}
  path_params:
  - description: Required. B.LEAGUE ScheduleKey (integer, one global sequence across
      B1, B2, B3 and every season), e.g. 504734 = B1 2025-26 sec 1, Alvark Tokyo v
      Utsunomiya Brex; list a day's keys with bleague_schedule.
    name: schedule_key
    required: true
    type: int
  returns_schema: native/bleague/game_info
  short: game_info
  summary: 'Game header: competition, round, venue, officials, tip-off, both teams
    and the scores.'
- example_args:
