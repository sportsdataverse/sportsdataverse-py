api: cbs_napi
docstring:
  example_import: true
  raises:
  - 'requests.exceptions.RequestException: Connection-level failure after ``dl_utils.download``
    exhausts its retries. An unknown id is NOT an exception -- NAPI answers it with
    HTTP 200 plus an ``{error|errors|warnings}`` envelope, which parses to a zero-row
    frame.'
  see_also:
  - name: CBS Sports NAPI registry
    note: the API's own self-documenting endpoint catalog (data origin)
    url: https://api.cbssports.com/napi/resource/endpoint/registry
  - name: nflfastR
    note: R sister package; NAPI is cross-sport, this is its NFL counterpart
    url: https://www.nflfastr.com
endpoints:
- extra_params:
  - description: CSV list of player IDs to retrieve.
    name: player_resource
    query_key: PlayerResource
    type: str
  - description: CSV list of team IDs to retrieve.
    name: team_resource
    query_key: TeamResource
    type: str
  - description: CSV list of game IDs to retrieve.
    name: game_resource
    query_key: GameResource
    type: str
  - description: CSV list of venue IDs to retrieve
    name: venue_resource
    query_key: VenueResource
    type: str
  - description: CSV list of event IDs to retrieve
    name: event_resource
    query_key: EventResource
    type: str
  - description: CSV list of game IDs to retrieve.
    name: featured_game_resource
    query_key: FeaturedGameResource
    type: str
  - description: CSV list of golf event markets IDs to retrieve
    name: golf_event_markets_resource
    query_key: GolfEventMarketsResource
    type: str
  parser: parse_cbs_napi
  path: /resource/bulk
  returns_schema: native/cbs_napi/bulk
  short: bulk
  summary: Resolve resources in bulk to save HTTP traffic.
- example_args:
    client_name: cbs
  extra_params:
  - description: 'Allowed: league, season.'
    name: resources
    query_key: resources
    type: str
  - description: View option.  Filter by leagueId.
    name: league_id
    query_key: leagueId
    type: str
  - description: View option.  Filter by a certain classifier.
    name: classifier
    query_key: classifier
    type: str
  - description: View option.  Filter by a custom key name.
    name: key_name
    query_key: keyName
    type: str
  parser: parse_cbs_napi
