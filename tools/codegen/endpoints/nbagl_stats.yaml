    parsed_doc: A dict of DataFrames keyed by result-set name (``GPLeaders``, ``PTSLeaders``,
      ``ASTLeaders``, ``STLLeaders``, ``OREBLeaders``, ``DREBLeaders``, ``REBLeaders``,
      ``BLKLeaders``, ``FGMLeaders``, ``FGALeaders``, ``FG_PCTLeaders``, ``TOVLeaders``,
      ``FG3MLeaders``, ``FG3ALeaders``, ``FG3_PCTLeaders``, ``PFLeaders``, ``FTMLeaders``,
      ``FTALeaders``, ``FT_PCTLeaders``)
  example_args:
    league_id: '20'
  extra_params:
  - default: '20'
    name: league_id
    query_key: LeagueID
    type: str
  - default: PerGame
    name: per_mode_simple
    query_key: PerMode
    type: str
  - default: Regular Season
    description: 'Season type, a label: ``Regular Season``, ``Pre Season`` or ``Playoffs``
      (each endpoint takes a subset; the G League has no ``All Star`` rows). Not ESPN''s
      numeric code: ``3`` is HTTP 400. A default season follows it: ``Playoffs`` rolls
      over in May.'
    name: season_type
    query_key: SeasonType
    type: str
  - default: '10'
    name: topx
    query_key: TopX
    type: str
