    season: 2024-25
  extra_params:
  - default: '20'
    name: league_id
    query_key: LeagueID
    type: str
  - default: PerGame
    name: per_mode_simple
    query_key: PerMode
    type: str
  - default: Team
    name: player_or_team
    query_key: PlayerOrTeam
    type: str
  - default: null
    description: 'Season label, e.g. ``2024-25``. Defaults at call time by a calendar
      cutoff, the month after a season''s first games, so it can lag the newest rows
      by a few weeks. A G League regular season starts in late December and becomes
      the default in January (``2025-26`` from January 2026); a draft combine (May)
      in June. With season type ``Playoffs`` (or ``commonplayoffseries``) it rolls
      over in May, after the late-March playoffs start; the G League has no All-Star
      rows. A month table cannot follow a lockout or pandemic calendar: pass a season
      then. Without one stats.nba.com answers an empty HTTP 500 or every season summed.'
    name: season
    query_key: Season
    transform: season_latest_with_data
    type: str
  - default: Regular Season
