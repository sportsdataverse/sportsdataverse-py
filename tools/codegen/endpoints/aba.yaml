api: aba
docstring:
  example_import: true
  notes:
  - 'Unofficial use of a public source: these wrappers read the leagues'' own PHP
    sites (www.aba-liga.com, druga.aba-liga.com), keyless, with no bot wall; payloads
    are not redistributed as release assets. www.aba-liga.com/robots.txt is the single
    line ``User-agent: *`` (nothing disallowed, no Crawl-delay) and druga has no robots.txt;
    no terms page was found. The runtime waits at least 1 s per host before every
    request.'
  - 'Coverage: box scores from 2001-02; play-by-play, the starter and on-court markers,
    the shot chart and the minute-by-minute score from 2017-18 (earlier games answer
    an empty pbp and NoDataError for the helpers). A game is keyed by (game_no, season,
    league_id): game_no restarts at 1 for every season and league. Team and player
    ids are global; the calendar carries club names only. Club names are the club''s
    CURRENT name on every season: join on team_id.'
  - 'Only finished games are served: an unplayed game, or one whose period scores,
    team totals or play-by-play do not add up to the final score, raises AssetFetchError,
    as does a page for another game, season or league than asked. The three live-match
    helpers echo nothing about the game, so the runtime fetches the same game''s match
    page first (one extra request) and checks the helper against it.'
  - 'Times: ``CET`` means Central European wall-clock time including summer time (the
    label never changes); ABA League 2 prints ``Local time``. Officials appear by
    name only; the player bio (birth date and place, nationality) is the public player
    profile.'
  raises:
  - 'sportsdataverse.errors.NoDataError: the site has nothing for the request (an
    unknown game or season, a season before 2001-02, a helper with no data before
    2017-18).'
  - 'sportsdataverse.errors.AssetFetchError: the fetch failed or the answer is not
    the one asked for (a page for another game, season or league, an unfinished game,
    a helper that does not belong to the game, layout drift).'
  raw_doc: 'the raw record (``dict``): the page record (the refs capture shape) or,
    for the three live-match helpers, ``{''rows'': [...]}``, plus ``_request`` (kind,
    season, sez, league and the game or player asked for)'
  see_also:
  - name: ABA League
    note: the league site whose pages and chart helpers these wrappers read
    url: https://www.aba-liga.com
  - name: hoopR
    note: SportsDataverse men's basketball (R)
    url: https://hoopR.sportsdataverse.org
  - name: wehoop
    note: SportsDataverse women's basketball (R)
    url: https://wehoop.sportsdataverse.org
endpoints:
- example_args:
    game_no: 6
    season: 2026
  extra_params:
  - choices:
    - aba
    - aba2
    default: aba
    description: 'League: ``aba`` (ABA League, www.aba-liga.com, site code lea=1)
      or ``aba2`` (ABA League 2, druga.aba-liga.com, lea=2). Both sites serve one
      database; the runtime asks the league''s own host.'
    name: league
    query_key: league
    type: str
  parser: parse_aba_game
  path: /match/{game_no}/{season}/Overview
  path_params:
  - description: Required. Game number within the season AND league (it restarts at
      1 for every season and league), e.g. 6; ``game_no`` in aba_calendar. Playoff
      games that were not needed leave gaps.
    name: game_no
    required: true
    type: int
  - description: Required. Season END year (2026 = 2025-26). ``aba_runtime`` sends
      the site's START-year key ``sez = season - 2001`` (25). The ABA League's first
      season is 2001-02 (``season=2002``).
    name: season
    required: true
    type: int
  returns_schema: native/aba/game
  short: game
  summary: 'Header of one finished game: round, date, venue, attendance, both clubs
    with their score, commissioner and referees.'
