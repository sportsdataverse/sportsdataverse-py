api: nhl_edge
host: https://api-web.nhle.com
name_pattern: nhl_edge_{short}
module: nhl_edge
parser_module: nhl.nhl_edge_parsers
qualifier: ''
runtime_imports:
- _get
- format_nhl_season
endpoints:
- short: skater_detail
  summary: Pull EDGE detail stats for a single skater.
  path: /v1/edge/skater-detail/{player_id}/{season}/{game_type}
  now_variant: /v1/edge/skater-detail/{player_id}/now
  now_toggle: season
  path_params:
  - name: player_id
    type: int
    required: true
  - name: season
    type: int|str
    required: false
    transform: format_nhl_season
  - name: game_type
    type: int
    required: false
    default: 2
  example_args:
    player_id: 8480801
  parser: parse_edge_detail
- short: skater_comparison
  summary: Pull EDGE comparison data for a single skater.
  path: /v1/edge/skater-comparison/{player_id}/{season}/{game_type}
  now_variant: /v1/edge/skater-comparison/{player_id}/now
