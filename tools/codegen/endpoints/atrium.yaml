api: atrium
docstring:
  example_import: true
  notes:
  - 'Unofficial: this is the public endpoint the Sportradar Atrium / Synergy ``Connect``
    widget calls from every visitor''s browser (keyless; the host has no robots.txt).
    The data is Sportradar''s and the leagues''. The wrappers read it on the caller''s
    behalf, one request at least 1 s after the last, and never republish it as release
    assets. Keep crawls small and incremental.'
  - '``website_id`` picks the league site (12 LNB France, 14 LNBP Mexico, 3 NBL1 Australia,
    13 El Salvador, 22 Panama, 236 Austria, 326 Montenegro); one site carries many
    competitions. Seasons are END years (``season=2026``): the site''s own year is
    the START year on LNB and the calendar year elsewhere, and a year can hold several
    competitions, so pair ``season`` with ``competition_id`` (see ``atrium_seasons``)
    or pass ``season_id`` directly. ``atrium_end_year(website_id, year)`` maps a site''s
    own year to that END year.'
  - 'Columns are configured per site: a statistic one site omits is null. The player
    and team ids are shared across sites; the player stat tables carry names only,
    so ``person_id`` there is decoded from the widget link beside each name.'
  raises:
  - 'sportsdataverse.errors.NoDataError: the site has nothing for the request (no
    such season, an empty fixture list, a game with no play-by-play yet, an unknown
    id answered 404, a fixture id the site does not serve: unknown, or a game of another
    site, which the API answers alike with an empty game, so it is not called a wrong
    scope).'
  - 'AssetFetchError: also raised for an error body, a stub, or a body that belongs
    to another site, type, season, game, player or team than the one asked for.'
  see_also:
  - name: Sportradar Connect widget
    note: the widget whose embed API these wrappers read
    url: https://widget.eui.connect.sportradar.com/
  - name: hoopR
    note: SportsDataverse men's basketball (R)
    url: https://hoopR.sportsdataverse.org
  - name: wehoop
    note: SportsDataverse women's basketball (R)
    url: https://wehoop.sportsdataverse.org
endpoints:
- example_args:
    website_id: 14
  extra_params:
  - description: Season END year (2026 = 2025-26 on LNB, site 12, whose own year is
      the START year; the calendar year on the other sites). Needs competition_id
      when several competitions share that year (see atrium_seasons). Omit season
      and season_id for the site's default season.
    name: season
    query_key: season
    type: int
  - description: Season UUID (season_id in atrium_seasons); sent as is, skipping the
      END-year lookup of season.
    name: season_id
    query_key: seasonId
    type: str
  - description: Competition UUID (competition_id in atrium_seasons). Picks the season
      together with season, and is then not sent; with neither season nor season_id
      the API filters by it.
    name: competition_id
    query_key: competitionId
    type: str
  - description: Team UUID (entity_id in atrium_teams or any fixture row).
    name: entity_id
    query_key: entityId
    type: str
  - description: Round (journee) number to show; the pages that take it list their
      rounds.
    name: round_number
    query_key: roundNumber
    type: int
  - description: 'Tab: FIXTURES (upcoming) or RESULTS (played). Omitted = the site''s
      default tab.'
    name: sub
    query_key: sub
    type: str
  - description: Locale of the labels, e.g. en-EN or fr-FR. Omitted = the site's own
      language. Ids and codes never change.
    name: locale
    query_key: locale
    type: str
  parser: parse_atrium_fixtures
  path: /{website_id}/fixtures
  path_params:
  - description: 'Site config id: which league site''s widget this is (12 LNB France,
      14 LNBP Mexico, 3 NBL1 Australia, 13 El Salvador, 22 Panama, 236 Austria, 326
      Montenegro). Not a league id: one site serves several competitions.'
    name: website_id
    required: true
    type: int
  returns_schema: native/atrium/fixtures
  short: fixtures
  summary: Fixtures (schedule and results) of a season, home and away side by side.
- example_args:
    website_id: 12
  extra_params:
  - description: Locale of the labels, e.g. en-EN or fr-FR. Omitted = the site's own
      language. Ids and codes never change.
    name: locale
    query_key: locale
    type: str
  parser: parse_atrium_seasons
  path: /{website_id}/fixtures
  path_params:
  - description: 'Site config id: which league site''s widget this is (12 LNB France,
      14 LNBP Mexico, 3 NBL1 Australia, 13 El Salvador, 22 Panama, 236 Austria, 326
      Montenegro). Not a league id: one site serves several competitions.'
    name: website_id
    required: true
    type: int
  returns_schema: native/atrium/seasons
  short: seasons
  summary: Every season (competition and year) a site lists, with the sdv END year
    of each.
