  path: /teams/teamList
  returns_schema: native/cba/teams
  short: teams
  summary: 'The current team list: logo, team id, club name and display name.'
- example_args:
    month: 12
    year: 2025
  extra_params:
  - description: Required. CALENDAR year (not the season).
    name: year
    query_key: year
    required: true
    type: int
  - description: Required. Calendar month, 1-12.
    name: month
    query_key: month
    required: true
    type: int
  parser: parse_cba_schedule_month
  path: /schedules/month
  returns_schema: native/cba/schedule_month
  short: schedule_month
  summary: Game count per day of one calendar month.
- example_args:
    day: '2025-12-12'
  extra_params:
