api: cba
docstring:
  example_import: true
  notes:
  - 'Unofficial and unsupported: the routes cbaleague.com''s own data site (a Vue
    SPA) calls. SportsDataverse has not ruled on the site''s terms, so payloads are
    not redistributed as release assets. Requests are spaced at least 1 s apart; keep
    use small.'
  - 'Access: every response body is AES-128-ECB encrypted with a public key shipped
    in the site''s bundle; ``cba_runtime`` decrypts it (stdlib implementation, no
    dependency) and refuses anything that does not decrypt. The host blocks datacenter
    IPs at TCP: set the environment variable CBA_PROXY to a residential proxy URL
    (it is never logged). Without it the request goes direct and fails from a datacenter.'
  - 'Seasons: the API''s season is the START year; every ``season`` argument here
    is the END year (2026 = 2025-26) and the runtime sends season - 1. Columns named
    ``season`` keep the wire value (the START year, so sdv END = season + 1). The
    season list reaches 1995-96; box data before 2009-10 is unverified.'
  - 'Coverage: game wrappers serve FINISHED games only (an unfinished game raises
    AssetFetchError). Play-by-play is verified on 2017-18 and 2025-26 only and is
    absent for 2009-10 (NoDataError). There are NO shot x/y coordinates in this API:
    shot location exists only as team and player zone splits. Play-by-play has no
    player or team ids (Chinese sentence text plus surnames). Box data has 12-minute
    quarters in 2009-10 and 2017-18 and 10-minute quarters in 2025-26; the women''s
    CBA is not covered (no official source).'
  - 'Not game data: cba_game_team_shots and cba_game_team_four answer the two teams''
    SEASON tables (the shot zones are the teams'' current profile; the four factors
    are the previous season), whichever game is asked for; rows cannot be scoped to
    the game. The reference lists (cba_team_options, cba_team_counts) and cba_report_status
    are not echoed by the API, so their scope is unchecked.'
  - 'Duplicate rows: in some games (2025-26 game 100105799) the advanced-box and extras
    routes repeat player rows (26 rows for 12 players); the repeats are not always
    copies. cba_player_advanced and cba_player_extras keep the FIRST row per player_id.'
  - Text fields are Chinese (names, sentences, position and nationality labels); the
    column descriptions carry the English glosses, and tools/codegen/notes/cba_glossary.yaml
    holds the full nationality, position, team-name and play-by-play phrase glossaries.
  - 'Personal data: the operator ids (createdBy / lastModifiedBy, one holds a mobile
    number) are removed from every body. Players'' public bio fields (birth date,
    height, weight) are kept.'
  raises:
  - 'sportsdataverse.errors.NoDataError: the host answered 404, or the game has no
    play-by-play (2009-10).'
  - 'sportsdataverse.errors.AssetFetchError: the fetch failed or the answer is not
    the one asked for (an unfinished game, a body that does not decrypt or an unencrypted
    error envelope, an empty body, a body for another game or season, a partial play-by-play
    set, a dead connection).'
  raw_doc: the raw DECRYPTED JSON (``list`` or ``dict``); a game route that answers
    an object also carries ``_request`` (the game id), and play-by-play is merged
    over every period into ``{records, total}``
  see_also:
  - name: CBA data
    note: the Chinese Basketball Association data site whose API these wrappers read
    url: https://www.cbaleague.com/data/
  - name: hoopR
    note: SportsDataverse men's basketball (R)
    url: https://hoopR.sportsdataverse.org
endpoints:
- example_args: {}
  parser: parse_cba_seasons
  path: /com-code-tables/getSeason
  returns_schema: native/cba/seasons
  short: seasons
  summary: Every season of the CBA data site, newest first (the upcoming season is
    the default), 1995-96 on.
- example_args: {}
  parser: parse_cba_match_types
  path: /com-code-tables/getMatchType
  returns_schema: native/cba/match_types
  short: match_types
  summary: The match types (regular season, playoffs, preseason, all-star, relegation
    play-off) with their ids.
- example_args:
    season: 2026
  extra_params:
  - description: Required. Season END year (2026 = the 2025-26 season). The API takes
      the START year (2025), so cba_runtime sends season - 1.
    name: season
    query_key: season
    required: true
    type: int
  fixed_params:
    type: 2
  parser: parse_cba_team_options
  path: /com-code-tables/getTeam
  returns_schema: native/cba/team_options
  short: team_options
  summary: 'The teams of one season as a select list: team id and the season''s display
    name.'
- example_args: {}
