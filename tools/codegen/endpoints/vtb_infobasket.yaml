api: vtb_infobasket
docstring:
  example_import: true
  notes:
  - 'Owner flag: the VTB United League is run from
    Russia and several clubs are owned or sponsored by sanctioned state companies
    (the KHL precedent); Infobasket is the Russian basketball federation''s stats
    platform. Fetching on your own machine is fine; any published data release, hosted
    mirror or redistribution needs owner (sanctions / legal) sign-off first. No accounts
    or payments are involved.'
  - 'Unofficial and unsupported: both hosts are keyless public JSON backends of vtb-league.com.
    No terms of use are published; robots.txt is a 404 on api.vtb-league.com and org.infobasket.su
    (no rules; vtb-league.com disallows only /wp/wp-admin/). The runtime waits at
    least 1 s before every request, retries included, and honours Retry-After on 429
    / 503. No key, cookie or proxy is used (live-verified direct from the droplet
    2026-10-12).'
  - 'Seasons are END years (2026 = 2025-26) on both backends. Infobasket keys everything
    by competition id: vtb_infobasket_seasons maps the END year to the season-level
    CompID, and the season-keyed wrappers do that mapping for you. CompID means three
    things: a season (50714), a stage below it (50720 regular season, 54281 playoff;
    stage-level wrappers take the stage id from vtb_infobasket_comp_issue) and, in
    the player season stats, an END year.'
  - 'Ids: the v2 matchId is the Infobasket GameID, the v2 teamId the Infobasket TeamID
    and the v2 venueId the Infobasket ArenaId. team_id is the key on every team route;
    comp_team_id (a registration in one stage) and the club-record id of the team
    page are other key spaces. person_id is one person across clubs and seasons.'
  - 'Errors are HTTP 200: an unknown id answers {MessageType, Message}, an unknown
    game the string ''BadRequest''; both are AssetFetchError (a failed fetch), never
    an empty frame. A body for another game, person, team, competition or season than
    the one asked for is AssetFetchError too, as is a game that is not final (box
    score, plays and header need GameStatus 1) and a partial GetTeamStats page. An
    empty list is NoDataError.'
  - 'Coverage: calendars and box scores from 2009-10; play-by-play and shot x/y from
    2022-23 only (earlier games give an empty pbp frame), officials in the line-ups
    from 2022-23. Shot x/y are decimetres from the basket centre (orientation unverified).
    Counting statistics are null instead of 0 on the wire (the parsers fill 0), percentages
    and averages are comma-decimal strings (the parsers return floats), the paint
    statistics are broken and dropped, and dates come in three encodings (the parsers
    return ISO strings; .NET instants as Moscow time with its +03:00 offset).'
  - 'Personal data: the runtime removes licence numbers, contact and operator-account
    fields for everyone and the birth dates, birth years and ages of coaches, referees
    and other officials from every body (also with return_parsed=False). Players''
    public bio (birth date, height, weight, nationality) is kept.'
  - 'Stage CompIDs: the team routes (TeamRoster, TeamStats, TeamGames) also accept
    a stage CompID; pass it as params={''compId'': 50720} instead of season. Other
    tags (vtbyouth, wbc, wpremier, rfb) answer through the tag argument; only vtb
    was captured.'
  raises:
  - 'sportsdataverse.errors.NoDataError: the host has nothing for the request (an
    empty list, a league the API does not know, a season with no rows).'
  - 'sportsdataverse.errors.AssetFetchError: the fetch failed or the answer is unknown
    or partial: an error envelope or string (HTTP 200), a game that is not final,
    a partial or possibly truncated page, or a body for another game, person, team,
    competition, league or season than the one asked for.'
  - 'ValueError: a season the competition tag does not have, or an argument that is
    not an integer id.'
  see_also:
  - name: VTB United League
    note: the league site whose backends these wrappers read
    url: https://www.vtb-league.com/
  - name: hoopR
    note: SportsDataverse men's basketball package (R)
    url: https://hoopR.sportsdataverse.org
