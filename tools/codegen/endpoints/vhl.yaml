api: vhl
docstring:
  example_import: true
  notes:
  - 'Owner flag (sdv-internal-refs/vhl/README.md): the VHL is run by Russian league
    operators, and several clubs are owned or sponsored by sanctioned state companies.
    Fetching on your own machine is fine; a published data release or a hosted mirror
    needs the owner''s sanctions / legal sign-off first.'
  raises:
  - 'sportsdataverse.errors.NoDataError: the VHL has nothing for the request (a season
    without that stage, a game not in the season''s calendar, an unknown game, player
    or team page).'
  - 'sportsdataverse.errors.AssetFetchError: the page could not be fetched, or it
    is not the page asked for (another season, game or player; a missing table or
    header drift).'
  raw_doc: 'the page''s parsed record (``dict``): the sdv-internal-refs capture shape,
    plus ``_request`` (season, stage, tn and the ids asked for)'
  see_also:
  - name: VHL
    note: the league site whose pages these wrappers read
    url: https://www.vhlru.ru/en/
  - name: fastRhockey
    note: SportsDataverse hockey package (R)
    url: https://fastRhockey.sportsdataverse.org
endpoints:
- example_args:
    season: 2026
  extra_params:
  - choices:
    - regular
    - playoff
    default: regular
    description: 'Season stage: regular (default) or playoff.'
    name: stage
    query_key: stage
    type: str
  parser: parse_vhl_schedule
  path: /en/calendar/{season}/0/
  path_params:
  - description: Season END year (2026 = 2025/26; the calendar covers 2010/11 on).
      The runtime maps it, with ``stage``, to the site's tournament id (tn) in this
      path segment.
    name: season
    required: true
    type: int
  returns_schema: native/vhl/schedule
  short: schedule
  summary: 'Schedule and results of one season stage: every game with its club ids,
    score and decision.'
- example_args:
    game_id: 899223
    season: 2026
  extra_params:
  - description: Required. Game id (game_id in vhl_schedule; the report's and the
      broadcast's idgame), e.g. 899223.
    name: game_id
    query_key: idgame
    required: true
    type: int
  - choices:
    - regular
    - playoff
    default: regular
    description: 'Season stage: regular (default) or playoff.'
    name: stage
    query_key: stage
    type: str
  parser: parse_vhl_game_info
  path: /en/report/{season}/
