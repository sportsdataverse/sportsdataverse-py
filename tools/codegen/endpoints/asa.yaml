api: asa
docstring:
  example_import: true
  raises:
  - 'sportsdataverse.errors.NoESPNDataError: the ASA API returned 404 (route not published
    for that league).'
  - 'requests.exceptions.RequestException: Connection-level failure after ``dl_utils.download``
    exhausts its retries.'
  see_also:
  - name: itscalledsoccer
    note: official ASA R/Python client over the same API
    url: https://github.com/American-Soccer-Analysis/itscalledsoccer
  - name: American Soccer Analysis
    note: data origin (xG, g+, xPass models)
    url: https://www.americansocceranalysis.com/
endpoints:
- example_args:
    league_slug: mls
  parser: parse_asa
  path: /{league_slug}/games
  path_params:
  - name: league_slug
    required: true
    type: str
  returns_schema: native/asa/games
  short: games
  summary: Games/fixtures with final scores, venue/official/manager FKs.
- example_args:
    league_slug: mls
  extra_params:
  - description: Filter to one or more seasons. Comma-list accepted (`2022,2023`).
    name: season_name
    query_key: season_name
    type: str
  - description: Filter to a competition stage, e.g. `Regular Season`. **URL-encode
      spaces.**
    name: stage_name
    query_key: stage_name
    type: str
  - description: Drop players/teams below this minutes-played threshold.
    name: minimum_minutes
    query_key: minimum_minutes
    type: str
  - description: 'Filter by general position code: GK, CB, FB, DM, CM, AM, W, ST (player/GK
      routes).'
    name: general_position
    query_key: general_position
    type: str
  - description: '`true` => one row per entity per team (splits traded players).'
    name: split_by_teams
    query_key: split_by_teams
    type: str
  - description: '`true` => one row per entity per season.'
    name: split_by_seasons
    query_key: split_by_seasons
    type: str
  - description: '`true` => one row per entity per game.'
    name: split_by_games
    query_key: split_by_games
    type: str
  - description: Lower date bound (`YYYY-MM-DD`), where the route supports date windows.
    name: start_date
    query_key: start_date
    type: str
  - description: Upper date bound (`YYYY-MM-DD`), where the route supports date windows.
    name: end_date
    query_key: end_date
    type: str
  parser: parse_asa
  path: /{league_slug}/games/xgoals
  path_params:
  - name: league_slug
    required: true
    type: str
  returns_schema: native/asa/games_xgoals
  short: games_xgoals
  summary: Per-game expected-goals + expected points for both sides.
