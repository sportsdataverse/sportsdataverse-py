  extra_params:
  - choices:
    - bbl
    - dbbl
    default: bbl
    description: 'League: `bbl` (men, easyCredit Basketball Bundesliga, api.basketball-bundesliga.de)
      or `dbbl` (women, Toyota Damen-Basketball-Bundesliga, api-1.dbbl.scb.world).
