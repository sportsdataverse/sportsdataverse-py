api: scb
docstring:
  example_import: true
  notes:
  - 'Unofficial use of a public source: these wrappers read the front-end API of the
    German Bundesliga sites (easycredit-bbl.de, toyota-dbbl.de), run by SCB; payloads
    are not redistributed as release assets.'
  - 'Legal notice: the BBL Impressum forbids storing BBL content (`Inhalte`) in an
    information system without BBL''s written permission. That is a copyright term,
    not a robots rule (the API host has no robots.txt). The owner reviewed it and
    accepted the intake (2026-10-12 ruling); keep requests slow (the runtime waits
    at least 1 s per host) and raise any published data release with the owner. The
    DBBL host is the same operator and API; its site notice was not separately reviewed.'
  - 'Both hosts need two headers: a constant `x-api-key` and an `x-api-secret` that
    rotates. The runtime derives the secret on first use from the key embedded in
    an easycredit-bbl.de page (reversed, `:` turned into `-`) and never logs or returns
    it.'
  raises:
  - 'sportsdataverse.errors.NoDataError: the API has nothing for the request (an unknown
    id, a game before 2002-03 or not yet started, an empty table, a playoff bracket
    not yet drawn).'
  see_also:
  - name: easyCredit BBL
    note: the BBL site whose API these wrappers read
    url: https://www.easycredit-bbl.de/
  - name: Toyota DBBL
    note: the DBBL site (same API, second host)
    url: https://www.toyota-dbbl.de/
  - name: hoopR
    note: SportsDataverse men's basketball package (R)
    url: https://hoopR.sportsdataverse.org
  - name: wehoop
    note: SportsDataverse women's basketball package (R)
    url: https://wehoop.sportsdataverse.org
endpoints:
- example_args: {}
  extra_params:
  - choices:
    - bbl
    - dbbl
    default: bbl
    description: 'League: `bbl` (men, easyCredit Basketball Bundesliga, api.basketball-bundesliga.de)
      or `dbbl` (women, Toyota Damen-Basketball-Bundesliga, api-1.dbbl.scb.world).
      The two share one API; game ids overlap, so a game is (league, game_id).'
    name: league
    query_key: league
    type: str
  parser: parse_scb_seasons
  path: /seasons
  returns_schema: native/scb/seasons
  short: seasons
  summary: Seasons, newest first, with the active flag (BBL back to 1966, DBBL 2024
    on).
- example_args:
    season: 2027
  extra_params:
  - choices:
    - bbl
    - dbbl
    default: bbl
    description: 'League: `bbl` (men, easyCredit Basketball Bundesliga, api.basketball-bundesliga.de)
      or `dbbl` (women, Toyota Damen-Basketball-Bundesliga, api-1.dbbl.scb.world).
      The two share one API; game ids overlap, so a game is (league, game_id).'
    name: league
    query_key: league
    type: str
  parser: parse_scb_season_players
  path: /seasons/{season}
  path_params:
  - description: Season END year (2026 = 2025-26, the sdv key). Sent to the API as
      its START-year seasonId (season - 1).
    name: season
    required: true
    transform: season_id
    type: int
  returns_schema: native/scb/season_players
  short: season_players
  summary: 'Every player registered in a season: the id crosswalk (season_player_id,
    real_player_id, season_team_id).'
- example_args:
