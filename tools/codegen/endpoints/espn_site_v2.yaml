api: espn_site_v2
host: site_v2
name_pattern: espn_{prefix}_{short}
endpoints:
- short: scoreboard
  scope: universal
  path: /{sport}/{league}/scoreboard
  extra_params:
  # A range (YYYYMMDD-YYYYMMDD) is HTTP 400 "Failed to get events endpoint." on every
  # league scoreboard (nba, nfl, nhl, mlb, cfb, mbb, eng.1; checked 2026-11-17). The
  # Core v2 ``events`` route does take a range.
  - name: dates
    query_key: dates
    type: int|str
    description: >-
      One day (YYYYMMDD) or one calendar year (YYYY). A range (YYYYMMDD-YYYYMMDD) is
      rejected with HTTP 400; request each day, or use the Core v2 ``events`` wrapper.
  - name: week
    query_key: week
    type: int
  - name: season_type
    query_key: seasontype
    type: int
  - name: groups
    query_key: groups
    type: int|str
  - name: limit
    query_key: limit
    type: int
    default: 500
  # Without ``groups`` the college basketball scoreboard is a short featured list: on
  # 2026-11-15 it held 6 of 44 Division I men's games and 12 of 72 women's. ``groups=50``
  # is Division I in both leagues (the hand-written mbb/wbb schedules already send it).
  league_defaults:
    mbb:
      groups: 50
    wbb:
      groups: 50
  parser: parse_scoreboard
  returns_schema: scoreboard
  example_args:
    dates: '20240115'
# Golf only. The tournament leaderboard lives at /golf/leaderboard with the league as a
# query param (``/golf/{league}/leaderboard`` is 404), so the slug travels as ``league=``
# (``league_query``). It carries what the scoreboard lacks: the displayed position (``T5``)
# and tie flag, player status (cut, withdrawn), holes completed, total strokes, earnings and
# cup points. Checked 2026-11-25 for pga, lpga, liv, eur and champions-tour.
- short: leaderboard
  scope: golf
  path: /{sport}/leaderboard
  league_query: league
  summary: >-
    Tournament leaderboard: the full field of one golf event (the current one when
    ``event_id`` is omitted), one row per player.
  extra_params:
  - name: event_id
    query_key: event
    type: int|str
    description: ESPN event (tournament) id; omitted, the tour's current or most recent event.
  # The registry entry delegates to golf_espn_parsers; golf wrappers call parse_golf_leaderboard
  # directly (generate._SPORT_PARSER_OVERRIDES).
  parser: parse_leaderboard
  returns_schema: leaderboard
  example_args:
    event_id: '401811941'
- short: summary
  scope: universal
  path: /{sport}/{league}/summary
  extra_params:
  - name: event_id
    query_key: event
    type: int|str
  parser: parse_summary
  returns_schema: summary
  # parse_summary (and the soccer/cricket overrides) returns one frame per section
  # when section=None, the same dict the espn_cdn game pages document.
  docstring:
    parsed_doc: a dict of ``polars.DataFrame``s keyed by summary section
# Base calendar works (current-season week labels/dates). The /calendar/{offseason,
# regular-season,postseason,ondays} sub-paths 404 at ESPN for every league/season
# (verified nfl/cfb/nhl) -- removed so we don't ship endpoints that always raise
# NoESPNDataError. Per-season week detail is available via the scoreboard/schedule.
- short: calendar
  returns_schema: calendar
  scope: universal
  path: /{sport}/{league}/calendar
  parser: parse_items
- short: news
  scope: universal
  path: /{sport}/{league}/news
  extra_params:
  - name: limit
    query_key: limit
    type: int
    default: 50
  parser: parse_news
  returns_schema: news
- short: injuries
  scope: universal
  path: /{sport}/{league}/injuries
  parser: parse_injuries
  returns_schema: injuries
  docstring:
    notes:
    - >-
      Current injuries only, for every team in one request. College baseball and softball
      answered HTTP 500 on 2026-11-17 (out of season), which raises ``AssetFetchError``.
- short: transactions
  returns_schema: transactions
  scope: universal
  path: /{sport}/{league}/transactions
  extra_params:
  # Rolling feed with no `count` field: the default returned 25 for every league
  # that publishes one. There is no natural total to cover, so 500 is a deliberate
  # ceiling, not a proof of completeness -- pass a larger `limit` if you need more.
  - name: limit
    query_key: limit
    type: int
    default: 500
  parser: parse_transactions
- short: conferences
  returns_schema: conferences
  scope: universal
  path: /{sport}/{league}/groups
  parser: parse_groups
- short: statistics_league
  returns_schema: statistics_league
  scope: universal
  path: /{sport}/{league}/statistics
  parser: parse_items
- short: draft
  returns_schema: draft
  scope: universal
  path: /{sport}/{league}/draft
  parser: parse_items
- short: teams_site
  scope: universal
  path: /{sport}/{league}/teams
  extra_params:
  - name: limit
    query_key: limit
    type: int
    default: 1000
  parser: parse_teams
  returns_schema: teams
- short: team
  returns_schema: team
  scope: universal
  path: /{sport}/{league}/teams/{team_id}
  path_params:
  - name: team_id
    type: int|str
    required: true
  parser: parse_single_entity
  example_args:
    team_id: '4'
- short: team_roster
  scope: universal
  path: /{sport}/{league}/teams/{team_id}/roster
  path_params:
  - name: team_id
    type: int|str
    required: true
  extra_params:
  # ESPN pages this at 100 with no signal that it did. CFB rosters routinely
  # exceed that (Alabama 120, Auburn 113, LSU 108 -- measured 2026-08-29), so
  # every CFB roster scraped through this wrapper was silently truncated.
  - name: limit
    query_key: limit
    type: int
    default: 500
  parser: parse_team_roster
  returns_schema: team_roster
  example_args:
    team_id: '4'
- short: team_schedule
  scope: universal
  path: /{sport}/{league}/teams/{team_id}/schedule
  path_params:
  - name: team_id
    type: int|str
    required: true
  extra_params:
  - name: season
    query_key: season
    type: int|str
  parser: parse_team_schedule
  returns_schema: team_schedule
  example_args:
    team_id: '4'
- short: team_record
  summary: >-
    Deprecated: ESPN answers this team route with an empty object.
  deprecated:
    replacement: team
    note: >-
      ESPN answered HTTP 200 with an empty object for nba, nfl and college-football (2026-11-17). The team document carries the record (its ``record.items``).
  returns_schema: team_record
  scope: universal
  path: /{sport}/{league}/teams/{team_id}/record
  path_params:
  - name: team_id
    type: int|str
    required: true
  parser: parse_items
  example_args:
    team_id: '4'
- short: team_depthcharts
  returns_schema: team_depthcharts
  scope: universal
  path: /{sport}/{league}/teams/{team_id}/depthcharts
  path_params:
  - name: team_id
    type: int|str
    required: true
  parser: parse_items
  example_args:
    team_id: '4'
- short: team_injuries
  summary: >-
    Deprecated: ESPN answers this team route with an empty object.
  deprecated:
    replacement: injuries
    note: >-
      ESPN answered HTTP 200 with an empty object for nba, nfl and college-football (2026-11-17). The league feed lists every team; filter it by team.
  scope: universal
  path: /{sport}/{league}/teams/{team_id}/injuries
  path_params:
  - name: team_id
    type: int|str
    required: true
  parser: parse_injuries
  returns_schema: injuries
  example_args:
    team_id: '4'
- short: team_transactions
  summary: >-
    Deprecated: ESPN answers this team route with an empty object.
  deprecated:
    replacement: transactions
    note: >-
      ESPN answered HTTP 200 with an empty object for nba, nfl and college-football (2026-11-17). The league feed lists every team; filter it by team.
  returns_schema: team_transactions
  scope: universal
  path: /{sport}/{league}/teams/{team_id}/transactions
  path_params:
  - name: team_id
    type: int|str
    required: true
  parser: parse_items
  example_args:
    team_id: '4'
- short: team_history
  summary: >-
    Deprecated: ESPN answers this team route with an empty object.
  deprecated:
    note: >-
      ESPN answered HTTP 200 with an empty object for nba, nfl and college-football (2026-11-17). ESPN publishes no season-by-season team history route.
  returns_schema: team_history
  scope: universal
  path: /{sport}/{league}/teams/{team_id}/history
  path_params:
  - name: team_id
    type: int|str
    required: true
  parser: parse_items
  example_args:
    team_id: '4'
- short: team_news
  summary: >-
    Deprecated: ESPN answers this team route with an empty object.
  deprecated:
    replacement: news
    note: >-
      ESPN answered HTTP 200 with an empty object for nba, nfl and college-football (2026-11-17). The league feed takes ``params={'team': <team_id>}``.
  scope: universal
  path: /{sport}/{league}/teams/{team_id}/news
  path_params:
  - name: team_id
    type: int|str
    required: true
  extra_params:
  - name: limit
    query_key: limit
    type: int
    default: 50
  parser: parse_news
  returns_schema: news
  example_args:
    team_id: '4'
- short: team_leaders
  summary: >-
    Deprecated: ESPN answers this team route with an empty object.
  deprecated:
    replacement: season_type_leaders
    note: >-
      ESPN answered HTTP 200 with an empty object for nba, nfl and college-football (2026-11-17). That is the league list; ESPN's per-team leaders are on the Core v2 route seasons/{season}/types/{type}/teams/{team_id}/leaders.
  returns_schema: team_leaders
  scope: universal
  path: /{sport}/{league}/teams/{team_id}/leaders
  path_params:
  - name: team_id
    type: int|str
    required: true
  parser: parse_items
  example_args:
    team_id: '4'
- short: athlete_info
  returns_schema: athlete_info
  scope: universal
  path: /{sport}/{league}/athletes/{athlete_id}
  path_params:
  - name: athlete_id
    type: int|str
    required: true
  parser: parse_single_entity
  example_args:
    athlete_id: '4239'
- short: athlete_bio
  returns_schema: athlete_bio
  scope: universal
  path: /{sport}/{league}/athletes/{athlete_id}/bio
  path_params:
  - name: athlete_id
    type: int|str
    required: true
  parser: parse_single_entity
  example_args:
    athlete_id: '4239'
- short: athlete_news
  scope: universal
  path: /{sport}/{league}/athletes/{athlete_id}/news
  path_params:
  - name: athlete_id
    type: int|str
    required: true
  parser: parse_news
  returns_schema: news
  example_args:
    athlete_id: '4239'
- short: standings
  scope: universal
  path: /{sport}/{league}/standings
  host: site_v2_alt
  extra_params:
  - name: season
    query_key: season
    type: int|str
  - name: group
    query_key: group
    type: int|str
  - name: standings_type
    query_key: type
    type: str
  parser: parse_standings
  returns_schema: standings
- short: rankings
  returns_schema: rankings
  scope: ncaa
  path: /{sport}/{league}/rankings
  parser: parse_rankings
