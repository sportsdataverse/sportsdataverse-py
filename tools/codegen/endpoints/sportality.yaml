api: sportality
docstring:
  example_import: true
  notes:
  - 'Unofficial: the JSON API behind www.basketligaen.dk, the Danish men''s basketball
    league (Basketligaen, series code DBL). The site runs on the Sportality platform
    (the vendor behind the SHL and HockeyAllsvenskan wrappers). The terms page was
    not read; payloads are not redistributed as release assets.'
  - 'Stats provider: genius-basketball, a relay of Genius Sports LiveStats. The Genius
    match, team and person ids in play-by-play, box scores and stats tables (game_id,
    team_id, player_id, all Int64) join the genius family; the platform uuids (game,
    team, athlete, ssgt) are not Genius ids and exist only on this site. The Genius
    ORG code of Denmark is not exposed.'
  - Season = the END year (2026 = 2025/26) everywhere; the runtime maps it, with game_type
    ('regular' or 'finals', the playoffs), to the site's ssgt (season + series + game
    type) through layout-info. Schedules, standings and season tables start in 2002/03;
    game-level data (play-by-play with shot x/y, box scores, team stats) starts in
    2023/24.
  - 'Source defects the runtime refuses (AssetFetchError): an unfinished game or a
    truncated play-by-play feed, a box score or feed that names another game, a cut
    stats table. The 2002/03 regular-season schedule lists 109 finished games where
    its own standings count 110: a source gap.'
  - 'Personal data is removed from every body: birth dates, e-mail addresses, phone
    numbers, addresses and contact blocks.'
  - 'No women''s league: Dameligaen has its own domain (dameligaen.dk), which answers
    401 to anonymous requests.'
  raises:
  - 'sportsdataverse.errors.NoDataError: the site answered 404, an empty body (gameday
    routes before 2023/24, or an unknown game), a table with no rows, or the season
    and game type are not in layout-info.'
  - 'sportsdataverse.errors.AssetFetchError: an error envelope or non-JSON 200, another
    game / team / athlete / ssgt than the one asked for, an unfinished game or truncated
    play-by-play, a cut stats table, or any other failed fetch (a 500 is the site''s
    answer for an unknown uuid and is not retried).'
  see_also:
  - name: Basketligaen
    note: the Danish men's basketball league site whose API this is
    url: https://www.basketligaen.dk/
  - name: hoopR
    note: the SportsDataverse men's basketball package for R
    url: https://hoopR.sportsdataverse.org
