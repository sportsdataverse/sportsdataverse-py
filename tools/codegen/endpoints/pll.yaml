api: pll
docstring:
  example_import: true
  notes:
  - 'Runtime only: each call sends one GET to ``stats.premierlacrosseleague.com/api``, the proxy
    behind the Premier Lacrosse League''s own stats site. sdv-py publishes no release assets from
    this API and ships no bulk or backfill tooling for it. Requests from one process are spaced at
    least half a second apart.'
  - 'No token: the stats routes need no key and the site keeps its upstream key server-side. The
    proxy answers only requests carrying the stats site''s own Referer (the runtime sends it);
    without it the answer is HTTP 403 "Origin not allowed" (AssetFetchError). No environment
    variable is read.'
  - 'Seasons 2019 to 2026 (``year``). The per-game wrappers (game, play-by-play, box scores,
    insights) work from 2021: the 2019 and 2020 game slugs contain "@" and the proxy refuses
    them (NoDataError).'
  - 'Ids are strings. Per-game wrappers take ``event_slug`` (from ``pll_schedule``; the slug
    format changes by season, so read it, never build it), team wrappers ``team_slug`` (from
    ``pll_team_season_stats``, e.g. waterdogs, boston-cannons) and player wrappers
    ``player_slug`` (from ``pll_player_season_stats``). Team codes (WAT) and six-digit player ids
    are columns, not route keys.'
  - 'ESPN: ``espn_lacrosse_*`` (league pll) already carries PLL scoreboards, schedules, standings
    and team pages, but ESPN''s PLL summary has no play-by-play and empty box scores; these
    wrappers add play-by-play, box scores, season and advanced stats, leaders, rosters and bios.
    The two share no game id: join on the UTC start time and the team codes (ESPN''s
    abbreviations equal ``team_id`` here).'
  raises:
  - 'sportsdataverse.errors.NoDataError: an unknown game, team or player slug, or a 2019-2020
    game slug on a per-game route (HTTP 404).'
  - 'ValueError: the API rejected a parameter (a missing year, a season segment or stat name
    outside its allowed list; HTTP 400).'
  - 'sportsdataverse.errors.AssetFetchError: the 403 origin refusal, any other failed fetch, or a
    200 that is not the ``{data: ...}`` envelope.'
  see_also:
  - name: PLL Stats
    note: the league's stats site whose API these wrappers read
    url: https://stats.premierlacrosseleague.com/
  - name: espn_lacrosse_scoreboard
    note: ESPN's PLL and college lacrosse scoreboards
    url: https://py.sportsdataverse.org/docs/lacrosse/
endpoints:
- example_args:
    year: 2026
  extra_params:
  - description: Season, 2019 onward.
    name: year
    query_key: year
    required: true
    type: int
  - description: True adds the Championship Series games (the pre-season sixes event); omitted,
      the regular season and playoffs only.
    name: include_champ_series
    query_key: includeCS
    type: bool
  parser: parse_pll_schedule
  path: /api/v4/events
  returns_schema: native/pll/schedule
  short: schedule
  summary: 'A season''s schedule and results: one row per game (teams, score, UTC start time,
    segment, week, venue, broadcast and the event_slug every per-game wrapper takes).'
- example_args:
    event_slug: 2026-ev-4
  parser: parse_pll_game
  path: /api/v4/events/{event_slug}
  path_params:
  - description: Game slug (event_slug in pll_schedule), e.g. 2026-ev-4.
    name: event_slug
    transform: slug
    type: str
  returns_schema: native/pll/game
  short: game
  summary: 'One game''s header: teams and records, score by period, clock, venue, broadcast and
    the pregame win probability.'
- example_args:
    event_slug: 2026-ev-4
  parser: parse_pll_play_by_play
  path: /api/v4/events/{event_slug}/playlogs
  path_params:
  - description: Game slug (event_slug in pll_schedule), 2021 onward.
    name: event_slug
    transform: slug
    type: str
  returns_schema: native/pll/play_by_play
  short: play_by_play
  summary: 'A game''s play-by-play: one row per logged play (clock, play type, shot value, the
    players involved, the win probability after it; the score is the running score on shot rows only).'
- example_args:
    event_slug: 2026-ev-4
  parser: parse_pll_player_box
  path: /api/v4/events/{event_slug}/players/stats
  path_params:
  - description: Game slug (event_slug in pll_schedule), 2021 onward.
    name: event_slug
    transform: slug
    type: str
  returns_schema: native/pll/player_box
  short: player_box
  summary: 'A game''s player box score: one row per player (points, 1- and 2-point goals, assists,
    shots, ground balls, turnovers, faceoffs, saves, penalties, touches, passes).'
- example_args:
    event_slug: 2026-ev-4
  parser: parse_pll_team_box
  path: /api/v4/events/{event_slug}/teams/stats
  path_params:
  - description: Game slug (event_slug in pll_schedule), 2021 onward.
    name: event_slug
    transform: slug
    type: str
  returns_schema: native/pll/team_box
  short: team_box
  summary: 'A game''s team box score: one row per team (scoring, shooting, faceoffs, clears, saves,
    special teams, possessions and time of possession).'
- example_args:
    event_slug: 2026-ev-4
  parser: parse_pll_game_insights
  path: /api/v4/events/{event_slug}/insights
  path_params:
  - description: Game slug (event_slug in pll_schedule), 2021 onward.
    name: event_slug
    transform: slug
    type: str
  returns_schema: native/pll/game_insights
  short: game_insights
  summary: 'The league''s written insights on a game: one row per streak, milestone or matchup note.'
- example_args:
    year: 2026
  extra_params:
  - description: Season, 2019 onward.
    name: year
    query_key: year
    required: true
    type: int
  - description: True for the Championship Series table instead of the season's.
    name: champ_series
    query_key: champSeries
    type: bool
  parser: parse_pll_standings
  path: /api/v4/standings
  returns_schema: native/pll/standings
  short: standings
  summary: 'Standings: one row per team (record, scores for and against, conference record; seeds,
    null until the league sets them).'
- example_args:
    year: 2026
  extra_params:
  - description: Season; omitted, the current one.
    name: year
    query_key: year
    type: int
  - choices: [regular, post, champseries]
    default: regular
    description: Season segment.
    name: season_segment
    query_key: seasonSegment
    type: str
  parser: parse_pll_team_season_stats
  path: /api/v4/teams/season-stats
  returns_schema: native/pll/team_season_stats
  short: team_season_stats
  summary: 'Every team''s season totals and rates: one row per team (offense, defense, faceoffs,
    clears and rides, power play and penalty kill).'
- example_args:
    team_slug: waterdogs
    year: 2026
  extra_params:
  - description: Season; omitted, the current one.
    name: year
    query_key: year
    type: int
  parser: parse_pll_team_stats
  path: /api/v4/teams/{team_slug}/stats
  path_params:
  - description: Team slug (team_slug in pll_team_season_stats), e.g. waterdogs, boston-cannons.
    name: team_slug
    transform: slug
    type: str
  returns_schema: native/pll/team_stats
  short: team_stats
  summary: 'One team''s record and stat lines for a season: one row per segment it played (regular
    season, playoffs).'
- example_args:
    team_slug: waterdogs
    year: 2026
  extra_params:
  - description: Season; omitted, the current one.
    name: year
    query_key: year
    type: int
  - choices: [regular, post, champseries]
    default: regular
    description: Season segment.
    name: season_segment
    query_key: seasonSegment
    type: str
  parser: parse_pll_team_roster
  path: /api/v4/teams/{team_slug}/roster
  path_params:
  - description: Team slug (team_slug in pll_team_season_stats), e.g. waterdogs.
    name: team_slug
    transform: slug
    type: str
  returns_schema: native/pll/team_roster
  short: team_roster
  summary: 'One team''s roster: one row per player (jersey, position, bio, injury and contract
    status).'
- example_args:
    year: 2026
  extra_params:
  - description: Season; omitted, the current one.
    name: year
    query_key: year
    type: int
  - choices: [regular, post, champseries]
    default: regular
    description: Season segment (the API requires one).
    name: season_segment
    query_key: seasonSegment
    type: str
  parser: parse_pll_player_season_stats
  path: /api/v4/players/season-stats
  returns_schema: native/pll/player_season_stats
  short: player_season_stats
  summary: 'Every player''s stat line for a season segment: one row per player (scoring, shooting,
    faceoffs, goalie, passing and per-touch rates).'
- example_args:
    year: 2026
  extra_params:
  - description: Season; omitted, the current one.
    name: year
    query_key: year
    type: int
  - choices: [regular, post, champseries]
    default: regular
    description: Season segment.
    name: season_segment
    query_key: seasonSegment
    type: str
  parser: parse_pll_player_advanced_stats
  path: /api/v4/players/stats/advanced
  returns_schema: native/pll/player_advanced_stats
  short: player_advanced_stats
  summary: 'Advanced player stats for a season: one row per player (settled, fast-break and
    assisted goals, assist types, left- and right-handed shooting).'
- example_args:
    limit: 5
    year: 2026
  extra_params:
  - description: Season; omitted, the current one.
    name: year
    query_key: year
    type: int
  - choices: [regular, post, champseries]
    default: regular
    description: Season segment.
    name: season_segment
    query_key: seasonSegment
    type: str
  - description: Players per stat; omitted, the API's default.
    name: limit
    query_key: limit
    type: int
  - description: Stat name or list of stat names in the API's spelling (points, assists, savePct,
      faceoffPct, ...); omitted, every stat. A name outside the API's list raises ValueError.
    name: stats
    query_key: stats
    type: str|List[str]
  parser: parse_pll_season_leaders
  path: /api/v4/players/stats/season-leaders
  returns_schema: native/pll/season_leaders
  short: season_leaders
  summary: 'A season''s leaderboards in long format: one row per stat and ranked player.'
- example_args:
    limit: 5
    stats: points
  extra_params:
  - description: Stat name or list of stat names in the API's spelling (points, goals, assists,
      saves, groundBalls, faceoffsWon, ...); required.
    name: stats
    query_key: stats
    required: true
    type: str|List[str]
  - description: Players per stat; omitted, the API's default.
    name: limit
    query_key: limit
    type: int
  parser: parse_pll_career_leaders
  path: /api/v4/players/stats/career-leaders
  returns_schema: native/pll/career_leaders
  short: career_leaders
  summary: 'All-time PLL leaderboards in long format: one row per stat and ranked player, with
    games and seasons played.'
- example_args:
    player_slug: michael-sowers
  extra_params:
  - description: Season the profile is read for; omitted, the current one.
    name: year
    query_key: year
    type: int
  parser: parse_pll_player
  path: /api/v4/players/{player_slug}
  path_params:
  - description: Player slug (player_slug in pll_player_season_stats), e.g. michael-sowers.
    name: player_slug
    transform: slug
    type: str
  returns_schema: native/pll/player
  short: player
  summary: 'One player''s profile: team, position, jersey, birth date, height, weight, hometown,
    school, injury and contract status, seasons played, biography.'
- example_args:
    player_slug: michael-sowers
  parser: parse_pll_player_seasons
  path: /api/v4/players/{player_slug}/stats/seasons
  path_params:
  - description: Player slug (player_slug in pll_player_season_stats), e.g. michael-sowers.
    name: player_slug
    transform: slug
    type: str
  returns_schema: native/pll/player_seasons
  short: player_seasons
  summary: 'One player''s stat line for every season and segment he played.'
- example_args:
    glg_league: intlm
    year: 2026
  extra_params:
  - description: Edition year.
    name: year
    query_key: year
    type: int
  parser: parse_pll_schedule
  path: /api/glg/{glg_league}/games
  path_params:
  - choices: [intlm, intlw]
    default: intlm
    description: intlm for the men's tournament, intlw for the women's.
    name: glg_league
    required: false
    type: str
  returns_schema: native/pll/glg_schedule
  short: glg_schedule
  summary: 'Global Lacrosse Games (national teams) schedule and results: one row per game, in
    the pll_schedule columns.'
- example_args:
    glg_league: intlm
    year: 2026
  extra_params:
  - description: Edition year.
    name: year
    query_key: year
    type: int
  parser: parse_pll_standings
  path: /api/glg/{glg_league}/standings
  path_params:
  - choices: [intlm, intlw]
    default: intlm
    description: intlm for the men's tournament, intlw for the women's.
    name: glg_league
    required: false
    type: str
  returns_schema: native/pll/glg_standings
  short: glg_standings
  summary: 'Global Lacrosse Games standings: one row per national team, in the pll_standings
    columns.'
- example_args:
    year: 2026
  extra_params:
  - description: Season.
    name: year
    query_key: year
    required: true
    type: int
  parser: parse_pll_schedule
  path: /api/wll/v1/events
  returns_schema: native/pll/wll_schedule
  short: wll_schedule
  summary: 'Women''s Lacrosse League schedule and results: one row per game, in the pll_schedule
    columns (the proxy serves no other WLL route).'
getter_module: sportsdataverse.lacrosse.pll_runtime
host: https://stats.premierlacrosseleague.com
module: pll
name_pattern: pll_{short}
parser_module: lacrosse.pll_parsers
passthrough_query: false
qualifier: ''
runtime_imports:
- _get
schema_prefix: pll_
