      fiba_gdap_editions or fiba_gdap_games_between.'
    name: comp
    query_key: comp
    required: true
    transform: _int_id
    type: int
  parser: parse_fiba_gamepage_box_players
  path: /en/games/{game_id}
  path_params:
  - description: 'FIBA game id (global): gameId of a gdap schedule row, e.g. 100720
