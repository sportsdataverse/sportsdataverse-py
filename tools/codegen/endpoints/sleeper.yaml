api: sleeper
docstring:
  example_import: true
  raises:
  - 'sportsdataverse.errors.NoDataError: the Sleeper API returned 404 (unknown user,
    league or draft id).'
  see_also:
  - name: Sleeper API docs
    note: official route reference (keyless, read-only, ~1000 req/min; fetch /players/nfl
      at most once a day)
    url: https://docs.sleeper.com/
endpoints:
- example_args:
    draft_id: '257270643320426496'
  parser: parse_sleeper
  path: /draft/{draft_id}
  path_params:
  - name: draft_id
    required: true
    type: str
  returns_schema: native/sleeper/draft
  short: draft
  summary: A draft
- example_args:
    draft_id: '257270643320426496'
  parser: parse_sleeper
  path: /draft/{draft_id}/picks
  path_params:
  - name: draft_id
    required: true
    type: str
  returns_schema: native/sleeper/draft_picks
  short: draft_picks
  summary: Picks of a draft
- example_args:
    league_id: '289646328504385536'
  parser: parse_sleeper
  path: /league/{league_id}/drafts
  path_params:
  - name: league_id
    required: true
    type: str
  returns_schema: native/sleeper/drafts
  short: drafts
  summary: Drafts of a league
- example_args:
    league_id: '289646328504385536'
  parser: parse_sleeper
  path: /league/{league_id}
  path_params:
  - name: league_id
    required: true
    type: str
  returns_schema: native/sleeper/league
  short: league
  summary: A league
- example_args:
    league_id: '289646328504385536'
    week: '1'
  parser: parse_sleeper
  path: /league/{league_id}/matchups/{week}
  path_params:
  - name: league_id
    required: true
    type: str
  - name: week
    required: true
    type: str
  returns_schema: native/sleeper/matchups
  short: matchups
  summary: Matchups for a week
- example_args: {}
  parser: parse_sleeper
  path: /players/nfl
  returns_schema: native/sleeper/players
  short: players
  summary: All NFL players (large; fetch at most once per day)
- example_args:
    league_id: '289646328504385536'
  parser: parse_sleeper
  path: /league/{league_id}/rosters
  path_params:
  - name: league_id
    required: true
    type: str
  returns_schema: native/sleeper/rosters
  short: rosters
  summary: Rosters in a league
- example_args: {}
  parser: parse_sleeper
  path: /state/nfl
  returns_schema: native/sleeper/state
  short: state
  summary: Current NFL week and season state
- example_args:
    league_id: '289646328504385536'
  parser: parse_sleeper
  path: /league/{league_id}/traded_picks
  path_params:
  - name: league_id
    required: true
    type: str
  returns_schema: native/sleeper/traded_picks
  short: traded_picks
  summary: Traded draft picks
- example_args:
    league_id: '289646328504385536'
    week: '1'
  parser: parse_sleeper
  path: /league/{league_id}/transactions/{week}
  path_params:
  - name: league_id
    required: true
    type: str
  - name: week
    required: true
    type: str
  returns_schema: native/sleeper/transactions
  short: transactions
  summary: Transactions for a week
- example_args: {}
  extra_params:
  - description: Hours to look back (default 24).
    name: lookback_hours
    query_key: lookback_hours
    type: str
  - description: Number of players (default 25).
    name: limit
    query_key: limit
    type: str
  parser: parse_sleeper
  path: /players/nfl/trending/add
  returns_schema: native/sleeper/trending_adds
  short: trending_adds
  summary: Trending adds (lookback_hours, limit)
- example_args:
    username: '457511950237696'
  parser: parse_sleeper
  path: /user/{username}
  path_params:
  - name: username
    required: true
    type: str
  returns_schema: native/sleeper/user
  short: user
  summary: Look up a user by username or id
- example_args:
    season: '2018'
    user_id: '457511950237696'
  parser: parse_sleeper
  path: /user/{user_id}/leagues/nfl/{season}
  path_params:
  - name: user_id
    required: true
    type: str
  - name: season
    required: true
    type: str
  returns_schema: native/sleeper/user_leagues
  short: user_leagues
  summary: Leagues a user is in for a season
- example_args:
    league_id: '289646328504385536'
  parser: parse_sleeper
  path: /league/{league_id}/users
  path_params:
  - name: league_id
    required: true
    type: str
  returns_schema: native/sleeper/users
  short: users
  summary: Users in a league
- example_args:
    league_id: '289646328504385536'
  parser: parse_sleeper
  path: /league/{league_id}/winners_bracket
  path_params:
  - name: league_id
    required: true
    type: str
  returns_schema: native/sleeper/winners_bracket
  short: winners_bracket
  summary: Playoff bracket
host: https://api.sleeper.app/v1
module: sleeper
name_pattern: sleeper_{short}
parser_module: nfl.sleeper_parsers
passthrough_query: false
qualifier: ''
runtime_imports:
- _get
