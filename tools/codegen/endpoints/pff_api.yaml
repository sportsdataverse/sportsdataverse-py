    name: week
    query_key: week
    type: str
  - description: Franchise (team) id.
    name: franchise_id
    query_key: franchise_id
    type: int
  parser: parse_pff_report
  path: /v1/teams/overview
  returns_schema: native/pff/team_overview
  short: team_overview
  summary: Season-to-date team report, one row per team
- example_args:
    franchise_id: 7
    league: nfl
    season: 2022
  extra_params:
