api: pff_api
auth: true
docstring:
  example_import: true
  headers_doc: 'optional headers dict reused across calls; an ``Authorization: Bearer
    <key>`` here wins over ``api_key=`` (a keyword accepted by every wrapper) and
    the ``PFF_API_KEY`` / ``SDV_PY_PFF_API_KEY`` environment. With no key anywhere
    the call raises RuntimeError -- there is no anonymous access.'
  raises:
  - 'RuntimeError: No PFF API key (pass ``api_key=`` or set ``PFF_API_KEY``).'
  - 'NoDataError: PFF answered 404 (no such route, report or team).'
  - 'AssetFetchError: The request was refused or failed (401/403/429/5xx) -- the answer
    is unknown, never an empty frame.'
  - 'ValueError: PFF rejected the parameters (400 ``invalid_parameter`` / 422).'
  raw_doc: 'The decoded JSON body. /v1 routes return the Premium Stats envelope (``{report_slug:
    rows}``); /v2 routes return ``{..meta.., columns, rows}``.'
  see_also:
  - name: PFF Developer API
    note: reference + CLI guide
    url: https://developer.pff.com
  - name: nflverse
    note: NFL data ecosystem
    url: https://nflverse.nflverse.com
endpoints:
- parser: parse_pff_report
  path: /v1/leagues
  returns_schema: native/pff/leagues
  short: ref_leagues
  summary: List the leagues you can read, with their seasons and weeks
- example_args:
    league: nfl
    season: 2022
    week: 1
  extra_params:
  - description: League slug, and the FIRST positional argument of every command that
      takes one — every command except the facet leaderboards, where --league stays
      a flag because --game alone is a complete request.
    name: league
    query_key: league
    required: true
    type: str
  - description: Season, as a four-digit year, taken as a positional argument.
    name: season
    query_key: season
    required: true
    type: int
  - description: Week, and the THIRD positional argument of games — the one command
      that takes a single week number rather than a comma-separated list.
    name: week
    query_key: week
    required: true
    type: int
  - description: Franchise (team) id.
    name: franchise_id
    query_key: franchise_id
    type: int
  parser: parse_pff_report
  path: /v1/games
  returns_schema: native/pff/games
  short: ref_games
  summary: List game results for a league, season and week
- example_args:
    league: nfl
    name: burrow
  extra_params:
  - description: League slug, and the FIRST positional argument of every command that
      takes one — every command except the facet leaderboards, where --league stays
      a flag because --game alone is a complete request.
    name: league
    query_key: league
    required: true
    type: str
  - description: Exact player-id lookup, ref-players only.
    name: id
    query_key: id
    type: int
  - description: Free-text player-name search, ref-players only.
    name: name
    query_key: name
    type: str
  parser: parse_pff_report
  path: /v1/players
  returns_schema: native/pff/players
  short: ref_players
  summary: Search the player directory by name or id
- example_args:
    league: nfl
    season: 2022
  extra_params:
  - description: League slug, and the FIRST positional argument of every command that
      takes one — every command except the facet leaderboards, where --league stays
      a flag because --game alone is a complete request.
    name: league
    query_key: league
    required: true
    type: str
  - description: Season, as a four-digit year.
    name: season
    query_key: season
    type: int
  - description: Week filter.
    name: week
    query_key: week
    type: str
  - description: Franchise (team) id.
    name: franchise_id
    query_key: franchise_id
    type: int
  parser: parse_pff_report
  path: /v1/teams
