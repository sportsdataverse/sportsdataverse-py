api: sports247
host: https://ipa.247sports.com
name_pattern: sports247_{short}
module: sports247
parser_module: cfb.sports247_parsers
getter_module: sportsdataverse.cfb.sports247_runtime
qualifier: ''
passthrough_query: true
runtime_imports:
- _get
endpoints:
- short: teams
  returns_schema: native/sports247/sports247_teams
  summary: "247Sports RDB college team directory (teamId / institutionKey / conference) for a sport."
  path: /rdb/v1/teams/
  extra_params:
  - name: sport_key
    query_key: sportKey
    type: int
    default: 1
    description: "247Sports sport key (1 = football, 2 = basketball)."
  - name: year
    query_key: year
    type: int
  - name: institution_type
    query_key: institutionType
    type: str
  parser: parse_sports247_teams
- short: institution_rankings
  returns_schema: native/sports247/sports247_institution_rankings
  summary: "247Sports team recruiting-class rankings (247 rank/rating + industry composite) for a sport and class year."
  path: /rdb/v1/rankings/{sport_key}/{year}/institutionrankings/
  path_params:
  - name: year
    type: int|str
    required: true
  - name: sport_key
    type: int
    required: false
    default: 1
    description: "247Sports sport key (1 = football, 2 = basketball)."
  extra_params:
  - name: pagesize
    query_key: pagesize
    type: int
    default: 50
  - name: page
    query_key: page
    type: int
  - name: use_composite
    query_key: useComposite
    type: str
  - name: conference_abbreviation
    query_key: conferenceAbbreviation
    type: str
  - name: institution_key
    query_key: institutionKey
    type: int
  parser: parse_sports247_institution_rankings
  example_args:
    year: 2026
    sport_key: 1
