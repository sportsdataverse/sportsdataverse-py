api: genius
docstring:
  example_import: true
  notes:
  - 'Access (sdv-internal-refs/genius-livestats/README.md): the Genius hosts publish
    no robots.txt and no terms. CloudFront refuses datacenter IPs on the LiveStats
    and hosted hosts: from a server set the optional ``GENIUS_PROXY`` environment
    variable to an http(s) proxy URL (it is never logged or printed). The wrappers
    space requests at least one second apart and read only the Genius hosts; keep
    crawls slow and incremental. Some league sites (the NZ NBL) forbid AI crawlers
    in their own robots.txt, which does not cover these hosts.'
  - 'Org and season. Every competition is an ORG code plus a competition id (``comp_id``):
    ``genius_competitions`` lists an org''s competitions with the sdv END-year ``season``
    (a START-year org lists 2025-26 as season 2026), ``genius_match_competition``
    maps a game to its competition, and ``data.json`` itself names no date, competition
    or season. The hosted ORG can differ from the LiveStats ORG of ``/u/`` (NZNBL
    vs NZN). Match ids are one global sequence across every Genius customer.'
  - '``data.json`` carries no global team or player id: ``tno`` (1 or 2) and ``pno``
    are in-game numbers. Join players across games on name, team code and shirt number;
    global team ids come from the hosted schedule, the widget or ``genius_competition_games``.
    Only finished games are read.'
  raises:
  - 'sportsdataverse.errors.NoDataError: Genius has nothing for the request (an unknown
    match id or ORG, an org without hosted pages, a competition with no games).'
  - 'sportsdataverse.errors.AssetFetchError: the fetch failed (the CloudFront block,
    a rate limit, a 5xx), the game is not finished, or the body is for another match,
    competition or ORG.'
  raw_doc: 'the body or page record (``dict`` / ``list``): ``data.json`` as served
    plus ``_request`` (the match id asked for), or the sdv-internal-refs capture shape
    of a page'
  see_also:
  - name: Genius Sports LiveStats
    note: the platform whose public pages these wrappers read
    url: https://fibalivestats.dcd.shared.geniussports.com/
  - name: hoopR
    note: SportsDataverse men's basketball (R)
    url: https://hoopR.sportsdataverse.org
  - name: wehoop
    note: SportsDataverse women's basketball (R)
    url: https://wehoop.sportsdataverse.org
endpoints:
- example_args:
    match_id: 2902690
  parser: parse_genius_game
  path: /data/{match_id}/data.json
  path_params:
  - description: Genius match id (match_id in genius_schedule, genius_widget_games
      or genius_competition_games), e.g. 2902690.
    name: match_id
    required: true
    type: int
  returns_schema: native/genius/game
  short: game
  summary: 'One row per finished game: period and clock state, both teams'' names,
    codes and scores, officials.'
- example_args:
    match_id: 2902690
  parser: parse_genius_team_box
  path: /data/{match_id}/data.json
  path_params:
  - description: Genius match id (match_id in genius_schedule, genius_widget_games
      or genius_competition_games), e.g. 2902690.
    name: match_id
    required: true
    type: int
  returns_schema: native/genius/team_box
  short: team_box
  summary: 'Team box score of a finished game: score by period, fouls, timeouts and
    the team totals.'
- example_args:
    match_id: 2902690
  parser: parse_genius_player_box
  path: /data/{match_id}/data.json
  path_params:
  - description: Genius match id (match_id in genius_schedule, genius_widget_games
      or genius_competition_games), e.g. 2902690.
    name: match_id
    required: true
    type: int
  returns_schema: native/genius/player_box
  short: player_box
  summary: 'Player box score of a finished game: minutes, shooting, rebounds, assists
    and the efficiency formulas.'
- example_args:
    match_id: 2902690
  parser: parse_genius_pbp
  path: /data/{match_id}/data.json
  path_params:
  - description: Genius match id (match_id in genius_schedule, genius_widget_games
      or genius_competition_games), e.g. 2902690.
    name: match_id
    required: true
    type: int
  returns_schema: native/genius/pbp
  short: pbp
  summary: Play-by-play of a finished game, newest action first, with the running
    score and lead.
- example_args:
    match_id: 2902690
  parser: parse_genius_shots
  path: /data/{match_id}/data.json
  path_params:
  - description: Genius match id (match_id in genius_schedule, genius_widget_games
      or genius_competition_games), e.g. 2902690.
    name: match_id
    required: true
    type: int
  returns_schema: native/genius/shots
  short: shots
  summary: 'Shot chart of a finished game: court x/y (percent of the full court),
    result and shooter.'
- example_args:
    comp_id: 49915
  parser: parse_genius_competition_games
  path: /data/competition/{comp_id}.json
  path_params:
  - description: 'Genius competition id: one per org competition-season (comp_id in
      genius_competitions), e.g. 49915.'
    name: comp_id
    required: true
    type: int
  returns_schema: native/genius/competition_games
  short: competition_games
  summary: The recent-games window of a competition, with the global Genius team ids.
- example_args:
    match_id: 2902690
    org: ESAKE
  parser: parse_genius_match_competition
  path: /u/{org}/{match_id}/
  path_params:
  - description: 'LiveStats ORG of the game''s shell (can differ from the hosted ORG:
      NZN vs NZNBL).'
    name: org
    required: true
    type: str
  - description: Genius match id (match_id in genius_schedule, genius_widget_games
      or genius_competition_games), e.g. 2902690.
    name: match_id
    required: true
    type: int
  returns_schema: native/genius/match_competition
  short: match_competition
  summary: The competition (comp_id and name) a game belongs to, from its LiveStats
    HTML shell.
- example_args:
    org: ESAKE
  host: https://hosted.dcd.shared.geniussports.com
  parser: parse_genius_competitions
  path: /{org}/en/schedule
  path_params:
  - description: Genius ORG code of the league (ESAKE, CEBL, BNXT, WBBL, ...); see
      genius_competitions.
    name: org
    required: true
    type: str
  returns_schema: native/genius/competitions
  short: competitions
  summary: Every competition of an org from the hosted WebStats chooser, with its
    END-year season.
- example_args:
    comp_id: 47852
    org: CEBL
  extra_params:
  - default: -1
    description: Round to list; -1 (default) lists every round of the competition.
    name: round_number
    query_key: roundNumber
    type: int
  host: https://hosted.dcd.shared.geniussports.com
  parser: parse_genius_schedule
  path: /{org}/en/competition/{comp_id}/schedule
  path_params:
  - description: Genius ORG code of the league (ESAKE, CEBL, BNXT, WBBL, ...); see
      genius_competitions.
    name: org
    required: true
    type: str
  - description: 'Genius competition id: one per org competition-season (comp_id in
      genius_competitions), e.g. 49915.'
    name: comp_id
    required: true
    type: int
  returns_schema: native/genius/schedule
  short: schedule
  summary: 'Every match of a competition (hosted WebStats): ids, status, venue, teams
    and scores.'
- example_args:
    comp_id: 49946
    org: HKS
  extra_params:
  - default: -1
    description: Round to list; -1 (default) lists every round of the competition.
    name: round_number
    query_key: roundNumber
    type: int
  host: https://hosted.dcd.shared.geniussports.com
  parser: parse_genius_schedule
  path: /embednf/{org}/en/competition/{comp_id}/schedule
  path_params:
  - description: Genius ORG code of the league (ESAKE, CEBL, BNXT, WBBL, ...); see
      genius_competitions.
    name: org
    required: true
    type: str
  - description: 'Genius competition id: one per org competition-season (comp_id in
      genius_competitions), e.g. 49915.'
    name: comp_id
    required: true
    type: int
  returns_schema: native/genius/schedule_embed
  short: schedule_embed
  summary: Every match of a competition from the JSON-wrapped embed page (orgs whose
    plain pages answer 500).
- example_args:
    widget_key: RFJIN037I07QV520B7WEXKV1GYNA31
  host: https://widget.wh.geniussports.com
  parser: parse_genius_widget_games
  path: /widget/?{widget_key}
  path_params:
  - description: The league site's public widget key (the bare query string of widget.wh.geniussports.com/widget/).
    name: widget_key
    required: true
    type: str
  returns_schema: native/genius/widget_games
  short: widget_games
  summary: The latest games a league site's results widget shows (needs no proxy).
getter_module: sportsdataverse.basketball.genius.genius_runtime
host: https://fibalivestats.dcd.shared.geniussports.com
module: genius
name_pattern: genius_{short}
parser_columns: true
parser_module: basketball.genius.genius_parsers
passthrough_query: false
qualifier: ''
runtime_imports:
- _get
schema_prefix: genius_
