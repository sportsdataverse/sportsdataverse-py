- example_args:
    game_id: 20261105000325
  parser: parse_nationalleague_player_box
  path: /games/{game_id}
  path_params:
  - description: SIHF game id, 14 digits `<season(4)><competition(4)><sequence(6)>`
      (game_id in nl_schedule; the same id as the sihf family's game_id), e.g. 20261105000325.
    name: game_id
    required: true
    type: int
  returns_schema: native/nationalleague/player_box
  short: player_box
  summary: 'One game''s player box score: goals, assists, shots, faceoffs, ice time,
    goaltending.'
- example_args:
    game_id: 20261105000325
  parser: parse_nationalleague_team_stats
  path: /games/{game_id}
  path_params:
  - description: SIHF game id, 14 digits `<season(4)><competition(4)><sequence(6)>`
      (game_id in nl_schedule; the same id as the sihf family's game_id), e.g. 20261105000325.
    name: game_id
    required: true
    type: int
  returns_schema: native/nationalleague/team_stats
  short: team_stats
  summary: 'One game''s team totals: shots by period, faceoffs by zone, power play
    and penalty kill.'
- example_args:
    game_id: 20261105000325
  parser: parse_nationalleague_shots
  path: /games/{game_id}
  path_params:
  - description: SIHF game id, 14 digits `<season(4)><competition(4)><sequence(6)>`
      (game_id in nl_schedule; the same id as the sihf family's game_id), e.g. 20261105000325.
    name: game_id
    required: true
    type: int
  returns_schema: native/nationalleague/shots
  short: shots
  summary: One game's shot attempts with rink location (metres) and expected goals
    (xG); NL games only.
- example_args:
    phase: 4940
    season: 2026
  extra_params:
  - description: 'Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes
      every list, and /player/{playerId} gp (51 vs 7), so it scopes. Lists are served
      for 2019-2027 (the app''s season picker, /api/content/metadata `seasons`) and
      patchily before: 2012 and 2017 answered, 2010/2014/2015/2016/2018 answered `[]`
      (probed 2026-10-12).'
    name: season
    query_key: season
    type: int
  - description: 'SIHF phase id (see x-phase-ids). Omitted = the regular season: `/player?season=2026`
      and `phase=4940` answer byte-identical bodies, `phase=5297` (playoffs) a different
      one (max gp 19 vs 52). Phase ids change every season; whether the metadata ids
      apply to 2027 is unverified.'
    name: phase
    query_key: phase
    type: int
  parser: parse_nationalleague_player_stats
  path: /player
  returns_schema: native/nationalleague/player_stats
  short: player_stats
  summary: Season stats for every player, with playerId.
- example_args:
    phase: 4940
    season: 2026
    take: 3
  extra_params:
  - description: Number of rows (take=3 answered 3).
    name: take
    query_key: take
    type: int
  - description: 'Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes
      every list, and /player/{playerId} gp (51 vs 7), so it scopes. Lists are served
      for 2019-2027 (the app''s season picker, /api/content/metadata `seasons`) and
      patchily before: 2012 and 2017 answered, 2010/2014/2015/2016/2018 answered `[]`
      (probed 2026-10-12).'
    name: season
    query_key: season
    type: int
  - description: SIHF phase id (see x-phase-ids). On /player, omitting it served the
      regular season (byte-identical to phase=4940); that default is assumed but unverified
      on this route. Phase ids change every season; whether the metadata ids apply
      to 2027 is unverified.
    name: phase
    query_key: phase
    type: int
  parser: parse_nationalleague_player_stats
  path: /player/topscorer
  returns_schema: native/nationalleague/top_scorers
  short: top_scorers
  summary: Top scorers (same row shape as /player).
