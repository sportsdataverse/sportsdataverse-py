api: nationalleague
docstring:
  example_import: true
  notes:
  - 'robots.txt on www.nationalleague.ch disallows /api. The owner approved building
    on it on 2026-10-12 for polite, incremental use: requests are spaced at least
    1 s apart, and a bulk backfill or a published mirror needs the owner''s sign-off
    first.'
  - 'Crawl incrementally: fetch a finished game once (keyed by game_id), find new
    games with one nl_schedule call per run, and fetch season tables at most once
    per game day.'
  raises:
  - 'sportsdataverse.errors.NoDataError: a 404, or an empty answer (no games or rows
    for that season, team or phase).'
  - 'sportsdataverse.errors.AssetFetchError: a failed fetch, an error object in a
    200, a body without the ids it must carry, or an answer for another season, team,
    game or player.'
  see_also:
  - name: National League
    note: the league site whose app serves this API
    url: https://www.nationalleague.ch/
  - name: fastRhockey
    note: the SportsDataverse hockey package for R
    url: https://fastRhockey.sportsdataverse.org
endpoints:
- example_args:
    season: 2026
  extra_params:
  - description: 'Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes
      every list, and /player/{playerId} gp (51 vs 7), so it scopes. Lists are served
      for 2019-2027 (the app''s season picker, /api/content/metadata `seasons`) and
      patchily before: 2012 and 2017 answered, 2010/2014/2015/2016/2018 answered `[]`
      (probed 2026-10-12).'
    name: season
    query_key: season
    type: int
  parser: parse_nationalleague_games
  path: /games
  returns_schema: native/nationalleague/schedule
  short: schedule
  summary: 'Schedule and results for one season: NL plus exhibitions.'
- example_args:
    season: 2027
  extra_params:
  - description: 'The running season''s END year (2027 on 2026-10-12). Season END
      year: `2026` = 2025/26. Diffing 2026 vs 2027 changes every list, and /player/{playerId}
      gp (51 vs 7), so it scopes. Lists are served for 2019-2027 (the app''s season
      picker, /api/content/metadata `seasons`) and patchily before: 2012 and 2017
      answered, 2010/2014/2015/2016/2018 answered `[]` (probed 2026-10-12).'
    name: season
    query_key: season
    type: int
  parser: parse_nationalleague_games
  path: /games/current
  returns_schema: native/nationalleague/current_games
  short: current_games
  summary: The current or next game day.
- example_args:
    season: 2026
    team_id: 101144
  extra_params:
  - description: 'Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes
      every list, and /player/{playerId} gp (51 vs 7), so it scopes. Lists are served
      for 2019-2027 (the app''s season picker, /api/content/metadata `seasons`) and
      patchily before: 2012 and 2017 answered, 2010/2014/2015/2016/2018 answered `[]`
      (probed 2026-10-12).'
    name: season
    query_key: season
    type: int
  parser: parse_nationalleague_games
  path: /games/team/{team_id}
  path_params:
  - description: SIHF team id (team_id in nl_standings; the same id as the sihf family's
      team_id), e.g. 101144 = EV Zug.
    name: team_id
    required: true
    type: int
  returns_schema: native/nationalleague/team_schedule
  short: team_schedule
  summary: One team's games for one season.
- example_args:
    season: 2026
  extra_params:
  - description: 'Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes
      every list, and /player/{playerId} gp (51 vs 7), so it scopes. Lists are served
      for 2019-2027 (the app''s season picker, /api/content/metadata `seasons`) and
      patchily before: 2012 and 2017 answered, 2010/2014/2015/2016/2018 answered `[]`
      (probed 2026-10-12).'
    name: season
    query_key: season
    type: int
  parser: parse_nationalleague_bracket
  path: /games/playoffs
  returns_schema: native/nationalleague/playoffs
  short: playoffs
  summary: 'Playoff and play-in series by round: one row per game, with its series
    score.'
- example_args:
    season: 2026
  extra_params:
  - description: 'Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes
      every list, and /player/{playerId} gp (51 vs 7), so it scopes. Lists are served
      for 2019-2027 (the app''s season picker, /api/content/metadata `seasons`) and
      patchily before: 2012 and 2017 answered, 2010/2014/2015/2016/2018 answered `[]`
      (probed 2026-10-12).'
    name: season
    query_key: season
    type: int
  parser: parse_nationalleague_bracket
  path: /games/playouts
  returns_schema: native/nationalleague/playouts
  short: playouts
  summary: 'Playout and league-qualification series by round: one row per game, with
    its series score.'
- example_args:
    game_id: 20261105000325
  parser: parse_nationalleague_game_overview
  path: /games/{game_id}
  path_params:
  - description: SIHF game id, 14 digits `<season(4)><competition(4)><sequence(6)>`
      (game_id in nl_schedule; the same id as the sihf family's game_id), e.g. 20261105000325.
    name: game_id
    required: true
    type: int
  returns_schema: native/nationalleague/game_overview
  short: game_overview
  summary: 'One game''s header: teams, date, status, final and per-period score, coaches,
    referees, arena, attendance.'
- example_args:
    game_id: 20261105000325
  parser: parse_nationalleague_pbp
  path: /games/{game_id}
  path_params:
  - description: SIHF game id, 14 digits `<season(4)><competition(4)><sequence(6)>`
      (game_id in nl_schedule; the same id as the sihf family's game_id), e.g. 20261105000325.
    name: game_id
    required: true
    type: int
  returns_schema: native/nationalleague/pbp
  short: pbp
  summary: 'One game''s event timeline: goals with assists, penalties, goaltender
    changes, revoked goals.'
- example_args:
    game_id: 20261105000325
  parser: parse_nationalleague_lineups
  path: /games/{game_id}
  path_params:
  - description: SIHF game id, 14 digits `<season(4)><competition(4)><sequence(6)>`
