  short: team_player_stats
  summary: Season stats for one team's players.
- example_args:
    phase: 4940
    player_id: 305519
    season: 2026
  extra_params:
  - description: 'Omitted = the current season: /player/305519 without it answered
      2027 (gp 7; 51 for season=2026). Season END year: `2026` = 2025/26. Diffing
      2026 vs 2027 changes every list, and /player/{playerId} gp (51 vs 7), so it
