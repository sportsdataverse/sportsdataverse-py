    name: player_id
    required: true
    type: int
  returns_schema: native/nationalleague/player_season
  short: player_season
  summary: One player's season stats.
- example_args:
    phase: 4940
    season: 2026
  extra_params:
  - description: 'Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes
