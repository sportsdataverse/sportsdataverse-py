api: khl_rest
auth: true
docstring:
  example_import: true
  headers_doc: extra request headers merged over the defaults (X-Requested-With, Origin,
    Referer); the session cookie jar and sessid are kept in-process, so nothing needs
    reusing across calls.
  notes:
  - 'Owner flag: the KHL and its webcaster platform
    are run by Russian operators, some clubs by sanctioned state companies. Fetching
    on your own machine is fine; any published data release, hosted mirror or redistribution
    needs owner (sanctions / legal) sign-off first.'
  - 'The documented curl request is schematic: the runtime primes a session (adds
    the form field ``sessid``), maps ``season`` / ``stage`` to the form field ``values[tournament]``
    (the tournament id) and sends the X-Requested-With, Origin and Referer headers.'
  raises:
  - 'sportsdataverse.errors.AssetFetchError: khl.ru answered an error envelope (status
    != success), a 307 again after re-priming the session, or a page for another game
    / player / tournament than the one requested.'
  - 'sportsdataverse.errors.NoDataError: khl.ru answered no rows, or the season has
    no such stage.'
  raw_doc: the raw khl.ru envelope ``Dict`` (``{status, data, errors}``)
  see_also:
  - name: KHL
    note: the league site whose front end these routes feed
    url: https://www.khl.ru/
  - name: fastRhockey
    note: SportsDataverse hockey package (R)
    url: https://fastRhockey.sportsdataverse.org
endpoints:
- body: form
  example_args:
    season: 2026
  extra_params:
  - description: Season by its END year (2026 = 2025-26), mapped to the KHL tournament
      id (tnId) through the webcaster season table (khl_webcaster_stages). None =
      the site's current season.
    name: season
    query_key: season
    type: int
  - choices:
    - regular
    - playoff
    default: regular
    description: 'Which stage of the season: regular or playoff.'
    name: stage
    query_key: stage
    type: str
  - description: khl.ru tournament id (tnId), sent as is instead of season / stage
      (1369 = 2025-26 regular season, 1370 its playoff; the schedule's tournament_id
      column). The All-Star games have their own.
    kw_only: true
    name: tournament_id
    query_key: values[tournament]
    type: int
  method: post
  parser: parse_khl_schedule
  path: /calendar/list/
  returns_schema: native/khl_rest/schedule
  short: schedule
  summary: Season schedule and results of a tournament, one row per game (All-Star
    games dropped).
- body: form
