    - defenses
    - forwards
    - skaters
    - all
    description: 'Position group: goalies, defenses, forwards, skaters or all. None
      = the site''s default. goalies fetches every page and returns one list sorted
      by games played, then wins (both descending), then name; page is ignored for
      it. A partial list raises AssetFetchError.'
    name: position
    query_key: values[amplua_full]
    type: str
  - description: Club slug (khl_stat_filters, filter clubs_full) or all. None = every
      club.
    name: club
    query_key: values[clubs_full]
    type: str
  - default: 1
    description: 1-based page (skaters); ignored for goalies. Loop until a page comes
      back shorter than per_page.
    name: page
    query_key: nav[page]
    type: int
  - default: 20
    description: 'Rows per page: 12, 20, 24 or 36. Keep 20: the site computes page
      counts and ranks for 20.'
    kw_only: true
    name: per_page
    query_key: nav[count]
    type: int
