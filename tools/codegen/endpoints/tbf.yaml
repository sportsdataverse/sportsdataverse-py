api: tbf
docstring:
  example_import: true
  notes:
  - 'Official TBF app API, unofficial for SportsDataverse: the backend of the Turkish
    Basketball Federation''s mobile app (miniappapi.tbf.org.tr), which serves BSL,
    TBL, KBSL and the other TBF leagues. It needs no key; robots.txt answers 404 on
    the host, and ``tbf_runtime`` spaces requests at least 1 s apart. SportsDataverse
    has not ruled on TBF''s terms, so payloads are not redistributed as release assets.
    The vendor''s origin hosts (nikayazilim.com) serve the same data without Cloudflare
    but are deliberately not used, redirects are never followed, and www.tbf.org.tr''s
    interactive Turnstile is neither used nor automated.'
  - 'Coverage: season and competition are parameters (``bsl`` Basketbol Super Ligi,
    back to 1966-67 in the league list; ``tbl`` second tier; ``kbsl`` women, both
    from 2015-16). Game wrappers serve FINISHED games only (an unfinished game raises
    AssetFetchError). Box scores exist from 2006-07 (no starters flagged that season);
    play-by-play and shots from 2025-26 only, an earlier finished game raises NoDataError.
    Every game carries a Genius LiveStats id (``genius_id``, joins the ``genius``
    family) from 2018-19 on some seasons and on every game of 2025-26 and later. Birth
    dates, contact details, photos and logos are dropped. Names and category labels
    are Turkish; the column descriptions give the English gloss.'
  raises:
  - 'sportsdataverse.errors.NoDataError: TBF has nothing for the request (an unknown
    game or player, a season the league list lacks, an empty list, a finished game
    before 2025-26 asked for play-by-play or shots).'
  - 'sportsdataverse.errors.AssetFetchError: the fetch failed or the answer is not
    the one asked for (an unfinished game, a body for another game, season, league
    or team, an error envelope, a redirect, a partial page or a changed capped list).'
  raw_doc: 'the raw body (``dict``): the TBF envelope ``{data, isSuccess, message,
    problemDetails}`` with personal fields redacted, plus ``_request`` (the season,
    competition, game and team ids the runtime resolved)'
  see_also:
  - name: TBF
    note: the Turkish Basketball Federation whose app backend these wrappers read
    url: https://www.tbf.org.tr
  - name: wehoop
    note: SportsDataverse women's basketball (R)
    url: https://wehoop.sportsdataverse.org
  - name: hoopR
    note: SportsDataverse men's basketball (R)
    url: https://hoopR.sportsdataverse.org
endpoints:
- example_args: {}
  parser: parse_tbf_seasons
  path: /Season/get-seasons
  returns_schema: native/tbf/seasons
  short: seasons
  summary: The 20 most recent TBF seasons, domestic and international (a server cap),
    newest first.
- example_args:
    season: 2027
  extra_params:
  - description: Required. Season END year (2027 = the 2026-2027 season). TBF keys
      a league-season by internal season and activity ids; ``tbf_runtime`` reads them
      from the league's season list by the END year of the label. A year the list
      lacks raises NoDataError.
    name: season
    query_key: season
    required: true
    type: int
  parser: parse_tbf_leagues
  path: /League/get-leagues-for-filter
  returns_schema: native/tbf/leagues
  short: leagues
  summary: 'The featured leagues (league-season activities) of one TBF season: BSL,
    TBL, KBSL and the others.'
- example_args:
    competition: bsl
