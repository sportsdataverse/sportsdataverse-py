api: nflpro
host: https://pro.nfl.com
name_pattern: nfl_pro_{short}
module: nflpro
parser_module: nfl.nflpro_parsers
getter_module: sportsdataverse.nfl.nflpro_runtime
qualifier: ''
# pro.nfl.com serves the Next Gen Stats data that nextgenstats.nfl.com stopped
# serving. /api/secured/* needs a USER-BOUND bearer carrying an active NFL+ Premium
# entitlement -- a client-credentials token is not user-bound and 401s on every
# route. nflpro_runtime._get resolves the token (NFLPRO_TOKEN, or an NFLPRO_EMAIL /
# NFLPRO_PW browser login) and pages on `offset` until the row count reaches the
# envelope's own `total`, because these responses truncate silently at the page size.
auth: true
docstring:
  headers_doc: >-
    optional pre-minted auth headers dict from ``nflpro_headers_gen()`` to reuse across calls (obtaining a token costs a browser login). A token is resolved when omitted; note an anonymous/client-credentials token is NOT usable here -- every ``/api/secured/*`` route 401s without an active NFL+ plan.
  example_import: true
  raises:
  - 'NFLProAuthError: No user-bound NFL Pro token could be resolved (pass ``token=``
    or ``email=``/``password=``, or set ``NFLPRO_TOKEN``, or ``NFLPRO_EMAIL``/``NFLPRO_PW``),
    or the resolved token carries no active NFL_PLUS_* plan.'
  - 'ValueError: pro.nfl.com returned HTTP 200 with an empty body -- how it signals
    rejected query params, since it sends no error envelope.'
endpoints:
- short: players_offense_passing_season
  summary: "GET /api/secured/stats/players-offense/passing/season — one row per passer for the season — quarterback passing incl. Next Gen time-to-throw, aggressiveness and CPOE."
  path: /api/secured/stats/players-offense/passing/season
  parser: parse_nfl_pro_stats
  returns_schema: native/nflpro/players_offense_passing_season
  extra_params:
  - {name: season, query_key: season, type: int, default: 2024, description: "Season, as the STARTING year (2024 = the 2024-25 NFL season)."}
  - {name: season_type, query_key: seasonType, type: str, default: REG, description: "Season type code (string): PRE, REG, or POST -- not ESPN's numeric 1/2/3."}
  - {name: limit, query_key: limit, type: int, default: 500, description: "Page size. Responses truncate silently at this many rows; the getter pages on ``offset`` until it has them all."}
  - {name: offset, query_key: offset, type: int, default: null, description: "Zero-based row offset. The getter pages on this automatically; set it only to fetch a specific slice."}
  - {name: sort_key, query_key: sortKey, type: str, default: null, description: "Field name to sort by, e.g. ``epa``."}
  - {name: sort_value, query_key: sortValue, type: str, default: null, description: "Sort direction: ``ASC`` or ``DESC``."}
  - {name: qualified, query_key: qualifiedPasser, type: bool, default: null, description: "Restrict to players meeting the league qualifying threshold."}
  example_args: {season: 2024, season_type: REG}
