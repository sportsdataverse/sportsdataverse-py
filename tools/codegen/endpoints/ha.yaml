api: ha
docstring:
  example_import: true
  raises:
  - 'sportsdataverse.errors.NoDataError: the site has nothing for the request (a season
    before 2005/06, an unknown or pre-2025/26 game, a phase not played).'
  - 'ValueError: a value outside its enumerated set, or a field the site requires
    is missing.'
  see_also:
  - name: HockeyAllsvenskan
    note: the site whose own API routes these wrappers read
    url: https://hockeyallsvenskan.se/
  - name: fastRhockey
    note: SportsDataverse hockey package (R)
    url: https://fastRhockey.sportsdataverse.org
endpoints:
- parser: parse_ha_schedule
  path: /pages/matcher
  returns_schema: native/ha/schedule
  short: schedule
  summary: 'The current season''s games (CMS records, decoded from the schedule page):
    slug, StatNet game number and team ids, start time, score.'
- example_args:
    slug: 20260918-aik-modo
  extra_params:
  - description: Game slug yyyymmdd-home-away (slug in ha_schedule), e.g. 20260918-aik-modo.
    name: slug
    query_key: slug
    required: true
    type: str
  parser: parse_ha_schedule
  path: /api/game
  returns_schema: native/ha/game
  short: game
  summary: 'One game''s CMS record by slug (2025/26 onward): StatNet game number and
    team ids, scores by period, venue, attendance.'
- body:
  - description: StatNet game number (statnet_game_number in ha_schedule / ha_game),
      e.g. 23401.
    key: statNetGameNumber
    name: statnet_game_number
    required: true
    type: int|str
  - description: StatNet team id of the home team, e.g. AIK.
    key: homeStatNetId
    name: home_statnet_id
    required: true
    type: str
  - description: StatNet team id of the away team, e.g. MODO.
    key: awayStatNetId
    name: away_statnet_id
    required: true
    type: str
  - description: Scheduled start (scheduled_date_time in ha_schedule), ISO 8601 UTC.
      Required by the site.
    key: scheduledDateTime
    name: scheduled_date_time
    required: true
    type: str
  - description: Actual start (played_date_time), ISO 8601 UTC. Optional.
    key: playedDateTime
    name: played_date_time
    type: str
  example_args:
    away_statnet_id: MODO
    home_statnet_id: AIK
    scheduled_date_time: '2026-09-18T17:00:00.000Z'
    statnet_game_number: 23401
  format: json
  method: post
  parser: parse_ha_pbp
  path: /api/play-by-play
  returns_schema: native/ha/pbp
  short: pbp
  summary: 'One game''s events (2025/26 onward): shots with outcome, goals with assists
    and strength, penalties, goalkeeper changes, timeouts. No coordinates, no on-ice
    players.'
- body:
  - description: Season END year (2026 = 2025/26); the site's START-year key is sent
      as season - 1. Omitted = the season in progress. Stats and standings start in
      2005/06 (2006).
    key: season
    name: season
    type: int
  - choices:
    - HA
    - HAPlayoff
    - HAkval
    default: HA
    description: 'Game type: HA regular season, HAPlayoff playoffs, HAkval playout
      (relegation series).'
    key: phase
    name: phase
    type: str
  - choices:
    - all
    - home
    - away
    default: all
    description: Home / away split.
    key: team_side
    name: team_side
    type: str
  - default: all
    description: 'Team filter: all, or one team of the site''s filter list (values
      not probed).'
    key: team
    name: team
    type: str
  - default: all
    description: 'Opponent filter: all, or one team (values not probed).'
    key: against_team
    name: against_team
    type: str
  - choices:
    - all
    - W
    - T
    - L
    default: all
    description: 'Result filter: W win, T tie, L loss.'
    key: all_results
    name: all_results
    type: str
  - choices:
    - all
    - played
    default: all
    description: 'Game status filter: played drops the season''s unplayed games.'
    key: game_status
    name: game_status
    type: str
  - choices:
    - all
    - ft
    - ot
    - so
    - wo
    default: all
    description: 'How the game was decided: ft full time, ot overtime, so shootout,
      wo walkover.'
    key: decided_in
    name: decided_in
    type: str
  example_args:
    season: 2026
  format: json
  method: post
  parser: parse_ha_games
  path: /api/all-time-games-stats
  returns_schema: native/ha/games
  short: games
  summary: 'Every game of a season, played or scheduled (is_played): date, display
    team codes, score, periods, arena, attendance, shots and power play. No game id.'
- body:
  - description: Season END year (2026 = 2025/26); the site's START-year key is sent
      as season - 1. Omitted = the season in progress. Stats and standings start in
      2005/06 (2006).
    key: season
    name: season
    type: int
  - choices:
    - HA
    - HAPlayoff
    - HAkval
    default: HA
    description: 'Game type: HA regular season, HAPlayoff playoffs, HAkval playout
      (relegation series).'
    key: phase
    name: phase
    type: str
  - choices:
    - all
    - home
    - away
    default: all
    description: Home / away standings split.
    key: location
    name: location
    type: str
  example_args:
    season: 2026
  format: json
  method: post
  parser: parse_ha_standings
  path: /api/league-standings-all-time
  returns_schema: native/ha/standings
  short: standings
  summary: Standings of a season. Wins and losses are REGULATION only; overtime counts
    include shootouts.
- body:
  - description: Season END year (2026 = 2025/26); the site's START-year key is sent
      as season - 1. Omitted = the season in progress. Stats and standings start in
      2005/06 (2006).
    key: season
    name: season
    type: int
  - choices:
    - HA
    - HAPlayoff
    - HAkval
    default: HA
    description: 'Game type: HA regular season, HAPlayoff playoffs, HAkval playout
      (relegation series).'
    key: phase
    name: phase
    type: str
  - choices:
    - summary
    - points
    - goals
    - time_on_ice
    - power_play
    - penalty_kill
    - equal_strength
    - penalties
    - plus_minus
    - faceoffs
    - offensive
    - defensive
    - shootouts
    - corsi_fenwick_pdo
    default: summary
    description: Stats category (column set), one of summary, points, goals, time_on_ice,
      power_play, penalty_kill, equal_strength, penalties, plus_minus, faceoffs, offensive,
      defensive, shootouts, corsi_fenwick_pdo. Anything else answers zero rows.
    key: categories
    name: category
    type: str
  - choices:
    - all
    - forward
    - back
    - goalkeeper
    default: all
    description: Position filter (back = defence).
    key: position
    name: position
    type: str
  - choices:
    - all
    - junior
    - rookie
    default: all
    description: Age-group filter.
    key: ages
    name: ages
    type: str
  - choices:
    - all
    - home
    - away
    default: all
    description: Home / away split.
    key: team_side
    name: team_side
    type: str
  - default: all
    description: 'Team filter: all, or one team of the site''s filter list (values
      not probed).'
    key: team
    name: team
    type: str
  - default: all
    description: 'Opponent filter: all, or one team (values not probed).'
    key: against_team
    name: against_team
    type: str
  - choices:
    - all
    - W
    - T
    - L
    default: all
    description: 'Result filter: W win, T tie, L loss.'
    key: all_results
    name: all_results
    type: str
  - choices:
    - all
    - played
    default: all
    description: 'Game status filter: played drops the season''s unplayed games.'
    key: game_status
    name: game_status
    type: str
  - choices:
    - all
    - ft
    - ot
    - so
    - wo
    default: all
    description: 'How the game was decided: ft full time, ot overtime, so shootout,
      wo walkover.'
    key: decided_in
    name: decided_in
    type: str
  example_args:
    category: summary
    season: 2026
  format: json
  method: post
  parser: parse_ha
  path: /api/all-time-skaters-stats
  returns_schema: native/ha/skater_stats
  short: skater_stats
  summary: Skater stats of a season, one category (column set) per call. Names and
    StatNet team ids, no player ids.
- body:
  - description: Season END year (2026 = 2025/26); the site's START-year key is sent
