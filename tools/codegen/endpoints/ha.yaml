  parser: parse_ha_team_stats
  path: /api/all-time-teams-stats
  returns_schema: native/ha/team_stats
  short: team_stats
  summary: Team stats of a season, one category per call. W / L are totals including
    overtime and shootout (wins_total / losses_total).
- body:
  - description: Season END year (2026 = 2025/26); the site's START-year key is sent
      as season - 1. Omitted = the season in progress. Stats and standings start in
      2005/06 (2006).
    key: season
