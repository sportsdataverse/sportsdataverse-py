  parser: parse_ha_teams
  path: /api/all-time-goalkeepers-stats
  returns_schema: native/ha/teams
  short: teams
  summary: 'Teams of a season with both team keys: StatNet team id <-> display code
    (from the stats tables'' teams list).'
- body:
  - description: 'Leaderboard metric. Seen on the site: TP, G, A, PlusMinus, Hits,
      FOPerc, TOI/GP (skaters).'
    key: metric
    name: metric
    required: true
    type: str
  - choices:
    - HA
    - HAPlayoff
    - HAkval
    default: HA
    description: 'Game type: HA regular season, HAPlayoff playoffs, HAkval playout
      (relegation series).'
    key: phase
    name: phase
    type: str
  - description: Team filter; omitted = the whole league (values not probed).
    key: team
    name: team
    type: str
  - description: True for a goalkeeper metric.
    key: isGoalkeeper
    name: is_goalkeeper
    type: bool
  example_args:
    metric: TP
  format: json
  method: post
  parser: parse_ha_leaders
  path: /api/player-leaderboard
  returns_schema: native/ha/leaders
  short: leaders
  summary: Current-season top 25 of one metric, with the StatNet player id (the only
    stats route that has one).
- body:
  - description: 'Team display code (CMS short name: AIK, MORA, ÖIK, ...). Required:
      the directory pages unreliably league-wide.'
    key: teamShortName
    name: team
    required: true
    type: str
  - choices:
    - familyName
    - firstName
    default: familyName
    description: 'Sort: familyName or firstName.'
    key: orderBy
    name: order_by
    type: str
  - description: Free-text name search; omitted = everyone.
    key: searchQuery
    name: search_query
    type: str
  example_args:
    team: AIK
  format: json
  method: post
  parser: parse_ha_players
  path: /api/all-players
  returns_schema: native/ha/players
  short: players
  summary: 'One team''s players from the CMS directory: CMS ids, position, jersey,
    birth date, size, headshots. One team per call (league-wide paging is unreliable).'
getter_module: sportsdataverse.hockey.ha.ha_runtime
host: https://hockeyallsvenskan.se
module: ha
name_pattern: ha_{short}
parser_columns: true
parser_module: hockey.ha.ha_parsers
passthrough_query: false
qualifier: ''
runtime_imports:
- _get
schema_prefix: ha_
