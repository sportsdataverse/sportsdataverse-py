# An entry is needed for every ESPN team the automatic match cannot settle: no in-country reep row
# shares one of its normalized names (no candidate), or several do (ambiguous). The build refuses to
# write the crosswalk while such a team has no entry. An entry also overrules a wrong automatic match.
#
#   espn_team_id  ESPN Site v2 team id (text)
#   espn_name     ESPN display name at review time (for the reader; not used by the build)
#   reep_id       the reep team row that is this club, or null when no reep row is this club
#   reason        what decided it
#
# Reviewed 2026-11-26 against reep data_version 2026.25. The deciding evidence, in order: the row is
# the senior men's (or, for NWSL, senior women's) first team, not a reserve, academy, women's, beach,
# predecessor or namesake club; its founding date and Wikidata entity; the provider ids it carries.
# Where reep holds the same club twice (two Wikidata entities), the row carrying the provider ids is
# the club; the other holds none or a duplicate.
