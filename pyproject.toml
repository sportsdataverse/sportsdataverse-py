[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "sportsdataverse"
version = "0.0.50"
description = "Retrieve Sports data in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["nfl", "college football", "data", "epa", "statistics", "web scraping"]
authors = [
    { name = "Saiem Gilani", email = "saiem.gilani@gmail.com" },
]
maintainers = [
    { name = "Saiem Gilani", email = "saiem.gilani@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "attrs>=20.3.0",
    "beautifulsoup4>=4.11.0",
    "inflection>=0.5.1",
    "lxml>=4.9.0",
    "matplotlib>=3.5.0",
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "polars>=1.0,<2.0",
    "pyarrow>=14.0.0",
    "pyjanitor>=0.23.1",
    "pyreadr>=0.4.9",
    "requests>=2.28.0",
    "scipy>=1.10.0",
    "tqdm>=4.50.0",
    "xgboost>=1.7.0",
]


[project.optional-dependencies]
tests = [
    "black>=22.3.0",
    "flake8>=5.0.0",
    "isort>=5.10.1",
    "mypy>=1.0.0",
    "pycln>=2.1.6",
    "pydocstyle>=6.3.0",
    "pytest>=6.0.2",
    "pytest-cov>=2.10.1",
    "pytest-xdist>=2.1.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-markdown-builder>=0.6.0",
    "sphinx-material>=0.0.35",
]
models = [
    "beautifulsoup4>=4.11.0",
    "inflection>=0.5.1",
    "requests>=2.28.0",
    "lxml>=4.9.0",
    "pyarrow>=14.0.0",
    "pyjanitor>=0.23.1",
    "pyreadr>=0.4.9",
    "scipy>=1.10.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.50.0",
    "attrs>=20.3.0",
    "xgboost>=1.7.0",
]
all = [
    # Mirrors `tests + docs + models`. Kept explicit (rather than referencing
    # the other groups) because PEP 621 does not have a "union of groups"
    # mechanism that older pip / build-frontends understand uniformly.
    "black>=22.3.0",
    "flake8>=5.0.0",
    "isort>=5.10.1",
    "mypy>=1.0.0",
    "pycln>=2.1.6",
    "pydocstyle>=6.3.0",
    "pytest>=6.0.2",
    "pytest-cov>=2.10.1",
    "pytest-xdist>=2.1.0",
    "ruff>=0.1.0",
    "sphinx>=7.0.0",
    "sphinx-markdown-builder>=0.6.0",
    "sphinx-material>=0.0.35",
    "beautifulsoup4>=4.11.0",
    "inflection>=0.5.1",
    "requests>=2.28.0",
    "lxml>=4.9.0",
    "pyarrow>=14.0.0",
    "pyjanitor>=0.23.1",
    "pyreadr>=0.4.9",
    "scipy>=1.10.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.50.0",
    "attrs>=20.3.0",
    "xgboost>=1.7.0",
]


[project.urls]
Homepage = "https://github.com/sportsdataverse/sportsdataverse-py"
Documentation = "https://py.sportsdataverse.org/"
Repository = "https://github.com/sportsdataverse/sportsdataverse-py"
"Bug Tracker" = "https://github.com/sportsdataverse/sportsdataverse-py/issues"
Changelog = "https://github.com/sportsdataverse/sportsdataverse-py/blob/main/CHANGELOG.md"


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "Sphinx-docs*", "docs*", "examples*", "archive*"]

[tool.setuptools.package-data]
sportsdataverse = ["cfb/models/*", "nfl/models/*"]


[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312", "py313", "py314"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist

    # The following are specific to Black, you probably don't want those.
    | blib2to3
    | tests/data
)/
'''


[tool.isort]
profile = "black"
line_length = 120


[tool.zimports]
black-line-length = 120
keep-unused-type-checking = true
