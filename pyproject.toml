[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "sportsdataverse"
version = "0.0.71"
description = "Retrieve Sports data in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
    # Leagues + sports
    "nba",
    "wnba",
    "nfl",
    "college football",
    "ncaa basketball",
    "mlb",
    "nhl",
    # Data sources
    "espn",
    "mlb stats api",
    "statcast",
    "baseball savant",
    "nhl edge",
    "nhl api-web",
    # Concepts
    "data",
    "epa",
    "statistics",
    "win probability",
    "play-by-play",
    "web scraping",
    "polars",
    "parser",
]
authors = [
    { name = "Saiem Gilani", email = "saiem.gilani@gmail.com" },
]
maintainers = [
    { name = "Saiem Gilani", email = "saiem.gilani@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "attrs>=20.3.0",
    "beautifulsoup4>=4.11.0",
    "inflection>=0.5.1",
    "lxml>=4.9.0",
    "matplotlib>=3.5.0",
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "polars>=1.0,<2.0",
    "pyarrow>=14.0.0",
    "pyjanitor>=0.23.1",
    "pyreadr>=0.4.9",
    "requests>=2.28.0",
    "scipy>=1.10.0",
    "tqdm>=4.50.0",
    "scikit-learn>=1.0.0",
    "xgboost>=2.0.0",
    "rapidfuzz>=3.13.0",
]


[project.optional-dependencies]
tests = [
    "black>=22.3.0",
    "curl_cffi>=0.6.0",
    "flake8>=5.0.0",
    "isort>=5.10.1",
    "mypy>=1.0.0",
    "pycln>=2.1.6",
    "pydocstyle>=6.3.0",
    "pytest>=6.0.2",
    "pytest-cov>=2.10.1",
    "pytest-xdist>=2.1.0",
    "ruff>=0.1.0",
]
models = [
    "beautifulsoup4>=4.11.0",
    "inflection>=0.5.1",
    "requests>=2.28.0",
    "lxml>=4.9.0",
    "pyarrow>=14.0.0",
    "pyjanitor>=0.23.1",
    "pyreadr>=0.4.9",
    "scipy>=1.10.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.50.0",
    "attrs>=20.3.0",
    "scikit-learn>=1.0.0",
    "xgboost>=2.0.0",
]
all = [
    # Mirrors `tests + models`. Kept explicit (rather than referencing the other
    # groups) because PEP 621 does not have a "union of groups" mechanism that
    # older pip / build-frontends understand uniformly.
    "black>=22.3.0",
    "curl_cffi>=0.6.0",
    "flake8>=5.0.0",
    "isort>=5.10.1",
    "mypy>=1.0.0",
    "pycln>=2.1.6",
    "pydocstyle>=6.3.0",
    "pytest>=6.0.2",
    "pytest-cov>=2.10.1",
    "pytest-xdist>=2.1.0",
    "ruff>=0.1.0",
    "beautifulsoup4>=4.11.0",
    "inflection>=0.5.1",
    "requests>=2.28.0",
    "lxml>=4.9.0",
    "pyarrow>=14.0.0",
    "pyjanitor>=0.23.1",
    "pyreadr>=0.4.9",
    "scipy>=1.10.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.50.0",
    "attrs>=20.3.0",
    "scikit-learn>=1.0.0",
    "xgboost>=2.0.0",
]


[project.urls]
Homepage = "https://github.com/sportsdataverse/sportsdataverse-py"
Documentation = "https://py.sportsdataverse.org/"
Repository = "https://github.com/sportsdataverse/sportsdataverse-py"
"Bug Tracker" = "https://github.com/sportsdataverse/sportsdataverse-py/issues"
Changelog = "https://github.com/sportsdataverse/sportsdataverse-py/blob/main/CHANGELOG.md"

# Console script — `sdv` CLI for find-team / find-athlete / find-event /
# list-functions / function-count / cache subcommands. See
# `sportsdataverse/cli.py` for the argparse-driven dispatch.
[project.scripts]
sdv = "sportsdataverse.cli:main"


# PEP 735 dependency groups — dev-only deps that shouldn't ship as
# user-facing extras. uv sync resolves these by name (`uv sync --group test`)
# or in bulk (`uv sync --all-groups --all-extras`).
#
# `[project.optional-dependencies]` above is retained for legacy
# `pip install sportsdataverse[tests]` invocations; new contributor flows
# should prefer `uv sync --all-groups --all-extras`.
[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    # Executes examples/notebooks/*.ipynb as pytest items (`pytest --nbmake`).
    # Opt-in via the flag, so the normal suite is unaffected; the live-tests-cron
    # workflow runs it against the real APIs.
    "nbmake>=1.5",
]
lint = [
    "mypy>=1.0",
    # Stubs for `requests` so the mypy ratchet can check modules that import it
    # (e.g. errors.py, mlb_statcast_runtime.py via dl_utils). Without these mypy
    # emits an import-untyped error under the strict gate.
    "types-requests>=2.28.0",
    # Pinned to match the pre-commit ruff hook (.pre-commit-config.yaml). The codegen
    # generator formats its output with this ruff, so build/--check and the commit hook
    # must agree byte-for-byte; a floating version reintroduces format drift.
    "ruff==0.15.12",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    "build>=1.0",
    # Parses function docstrings (Google/NumPy/Sphinx) so the codegen autodoc pages
    # can render Args/Returns/Examples tables. Build-time only; never ships to users.
    "docstring_parser>=0.16",
    "ipykernel>=6.0",  # for executing examples/notebooks/*.ipynb locally
    "jinja2>=3.1",
    # tools/codegen/render_notebooks.py executes the example notebooks and renders
    # them to docs/docs/tutorials/ (run weekly in live-tests-cron). nbclient runs
    # them; nbconvert turns them into markdown. Build/CI-time only.
    "json5>=0.15.0",
    "nbclient>=0.10",
    "nbconvert>=7.0",
    "nbformat>=5.0",
    "pre-commit>=3.0",
    "pyyaml>=6.0",
    "twine>=4.0",
]


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*", "examples*", "archive*"]

[tool.setuptools.package-data]
# ``py.typed`` is the PEP 561 marker that tells downstream type checkers this
# package ships inline type information.
sportsdataverse = ["cfb/models/*", "mbb/models/*", "nfl/models/*", "py.typed"]


[tool.isort]
profile = "black"
# Note: `known_first_party = ["functions", "queries", "db_utils"]` was the
# copy-pasted starter; sdv-py's first-party package is `sportsdataverse`.
known_first_party = ["sportsdataverse"]
add_imports = ["from __future__ import annotations"]


[tool.ruff]
line-length = 120
fix = true
show-fixes = true
exclude = [
    "venv",
    "env",
    ".venv",
    ".env",
    "__pycache__",
    "build",
    "dist",
    "*.ipynb",
    # Deliberately-malformed lint fixture (tests the unparseable-file path);
    # it is not real source and ruff cannot build its AST.
    "tests/contracts/fixtures/lint_python/broken.py",
]


[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
    "E501",  # line too long — long URLs / docstring tables
    "E402",  # module-level imports not at top — sometimes intentional after sys.path setup
    "F601",  # repeated dict literal key
    "F841",  # local variable assigned but never used (legacy pbp parsers)
    # The codebase intentionally uses `pl.col(...) == True/False` for polars
    # boolean masks because the polars expression engine requires it
    # (`is True/False` doesn't work on `pl.Expr`). See CLAUDE.md.
    "E712",
]


[tool.ruff.lint.per-file-ignores]
# Star-imports + re-exports are intentional in package __init__ files.
"sportsdataverse/__init__.py" = ["F401", "F403"]
"sportsdataverse/**/__init__.py" = ["F401", "F403"]


[tool.ruff.format]
skip-magic-trailing-comma = false
# Always emit LF so generated/formatted files are byte-identical across
# platforms (Windows runs otherwise produced CRLF, showing as phantom diffs).
line-ending = "lf"


[tool.mypy]
# 3.12 (not the 3.9 floor): modern dep stubs (numpy 2.3+, which itself requires py3.11+)
# use PEP 695 `type` aliases that mypy rejects under an older target. The curated modules
# below stay 3.9-compatible regardless; this only sets the type-checker's target syntax.
python_version = "3.12"
# Strict-typing ratchet via ``files`` (NOT ``[[tool.mypy.overrides]]``): the gate
# checks ONLY the curated modules listed below, in isolation. This is deliberate
# and load-bearing -- ``files`` scopes *which* modules are checked, whereas
# ``[[tool.mypy.overrides]]`` only tunes per-module strictness and cannot keep the
# legacy surface out of scope. A whole-package run (what an overrides-based gate
# would do) surfaces ~95 genuine pre-existing type errors plus ~2800 missing
# annotations in not-yet-typed modules, which would make the gate permanently red.
# ``follow_imports = "skip"`` makes imported symbols ``Any`` so a checked module
# never drags an unchecked one into scope. Promote a module by appending it here
# once it types cleanly. Run locally with ``uv run mypy`` (no args -- list is here).
follow_imports = "skip"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
files = [
