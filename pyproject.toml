[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "sportsdataverse"
version = "0.0.52"
description = "Retrieve Sports data in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
    # Leagues + sports
    "nba",
    "wnba",
    "nfl",
    "college football",
    "ncaa basketball",
    "mlb",
    "nhl",
    # Data sources
    "espn",
    "mlb stats api",
    "statcast",
    "baseball savant",
    "nhl edge",
    "nhl api-web",
    # Concepts
    "data",
    "epa",
    "statistics",
    "win probability",
    "play-by-play",
    "web scraping",
    "polars",
    "parser",
]
authors = [
    { name = "Saiem Gilani", email = "saiem.gilani@gmail.com" },
]
maintainers = [
    { name = "Saiem Gilani", email = "saiem.gilani@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "attrs>=20.3.0",
    "beautifulsoup4>=4.11.0",
    "inflection>=0.5.1",
    "lxml>=4.9.0",
    "matplotlib>=3.5.0",
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "polars>=1.0,<2.0",
    "pyarrow>=14.0.0",
    "pyjanitor>=0.23.1",
    "pyreadr>=0.4.9",
    "requests>=2.28.0",
    "scipy>=1.10.0",
    "tqdm>=4.50.0",
    "xgboost>=2.0.0",
]


[project.optional-dependencies]
tests = [
    "black>=22.3.0",
    "flake8>=5.0.0",
    "isort>=5.10.1",
    "mypy>=1.0.0",
    "pycln>=2.1.6",
    "pydocstyle>=6.3.0",
    "pytest>=6.0.2",
    "pytest-cov>=2.10.1",
    "pytest-xdist>=2.1.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-markdown-builder>=0.6.0",
    "sphinx-material>=0.0.35",
]
models = [
    "beautifulsoup4>=4.11.0",
    "inflection>=0.5.1",
    "requests>=2.28.0",
    "lxml>=4.9.0",
    "pyarrow>=14.0.0",
    "pyjanitor>=0.23.1",
    "pyreadr>=0.4.9",
    "scipy>=1.10.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.50.0",
    "attrs>=20.3.0",
    "xgboost>=2.0.0",
]
all = [
    # Mirrors `tests + docs + models`. Kept explicit (rather than referencing
    # the other groups) because PEP 621 does not have a "union of groups"
    # mechanism that older pip / build-frontends understand uniformly.
    "black>=22.3.0",
    "flake8>=5.0.0",
    "isort>=5.10.1",
    "mypy>=1.0.0",
    "pycln>=2.1.6",
    "pydocstyle>=6.3.0",
    "pytest>=6.0.2",
    "pytest-cov>=2.10.1",
    "pytest-xdist>=2.1.0",
    "ruff>=0.1.0",
    "sphinx>=7.0.0",
    "sphinx-markdown-builder>=0.6.0",
    "sphinx-material>=0.0.35",
    "beautifulsoup4>=4.11.0",
    "inflection>=0.5.1",
    "requests>=2.28.0",
    "lxml>=4.9.0",
    "pyarrow>=14.0.0",
    "pyjanitor>=0.23.1",
    "pyreadr>=0.4.9",
    "scipy>=1.10.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.50.0",
    "attrs>=20.3.0",
    "xgboost>=2.0.0",
]


[project.urls]
Homepage = "https://github.com/sportsdataverse/sportsdataverse-py"
Documentation = "https://py.sportsdataverse.org/"
Repository = "https://github.com/sportsdataverse/sportsdataverse-py"
"Bug Tracker" = "https://github.com/sportsdataverse/sportsdataverse-py/issues"
Changelog = "https://github.com/sportsdataverse/sportsdataverse-py/blob/main/CHANGELOG.md"

# Console script — `sdv` CLI for find-team / find-athlete / find-event /
# list-functions / function-count / cache subcommands. See
# `sportsdataverse/cli.py` for the argparse-driven dispatch.
[project.scripts]
sdv = "sportsdataverse.cli:main"


# PEP 735 dependency groups — dev-only deps that shouldn't ship as
# user-facing extras. uv sync resolves these by name (`uv sync --group test`)
# or in bulk (`uv sync --all-groups --all-extras`).
#
# `[project.optional-dependencies]` above is retained for legacy
# `pip install sportsdataverse[tests]` invocations; new contributor flows
# should prefer `uv sync --all-groups --all-extras`.
[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
]
lint = [
    "mypy>=1.0",
    "ruff>=0.6",
]
docs = [
    "sphinx>=7.0",
    "sphinx-markdown-builder>=0.6",
    "sphinx-material>=0.0.35",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
    "build>=1.0",
    "twine>=4.0",
    "ipykernel>=6.0",  # for executing examples/notebooks/*.ipynb locally
    "nbformat>=5.0",
    "pre-commit>=3.0",
]


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "Sphinx-docs*", "docs*", "examples*", "archive*"]

[tool.setuptools.package-data]
sportsdataverse = ["cfb/models/*", "nfl/models/*"]


[tool.isort]
profile = "black"
# Note: `known_first_party = ["functions", "queries", "db_utils"]` was the
# copy-pasted starter; sdv-py's first-party package is `sportsdataverse`.
known_first_party = ["sportsdataverse"]
add_imports = ["from __future__ import annotations"]


[tool.ruff]
line-length = 120
fix = true
show-fixes = true
exclude = [
    "venv",
    "env",
    ".venv",
    ".env",
    "__pycache__",
    "build",
    "dist",
    "*.ipynb",
]


[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
    "E501",  # line too long — long URLs / docstring tables
    "E402",  # module-level imports not at top — sometimes intentional after sys.path setup
    "F601",  # repeated dict literal key
    "F841",  # local variable assigned but never used (legacy pbp parsers)
    # The codebase intentionally uses `pl.col(...) == True/False` for polars
    # boolean masks because the polars expression engine requires it
    # (`is True/False` doesn't work on `pl.Expr`). See CLAUDE.md.
    "E712",
]


[tool.ruff.lint.per-file-ignores]
# Star-imports + re-exports are intentional in package __init__ files.
"sportsdataverse/__init__.py" = ["F401", "F403"]
"sportsdataverse/**/__init__.py" = ["F401", "F403"]


[tool.ruff.format]
skip-magic-trailing-comma = false
