# Metric registry -- one entry per BASE metric (``sportsdataverse.registry``).
#
# Display metadata only: descriptions stay in manual_column_descriptions.yaml.
# Read by a strict reader (PyYAML does not ship in the wheel): a line is a comment,
# a blank, an entry opener ``- key: NAME``, a two-space ``field: value`` or a
# four-space ``name: value`` row of a ``variants:`` block. Values are plain
# strings, ``null`` or ``{}``. tests/test_metric_registry.py pins the reader
# against PyYAML on this file.
#
# key            base column name; the resolver strips _off/_def/_margin,
#                _pass/_rush and _rank/_pct/_n/_pos_pct/_conf_pct
# label          full title (Game on Paper SDV_BASE_METRIC_TITLES, verbatim)
# short          column header; the resolver rewrites it per phase (EPA/Play -> EPA/DB)
# axis           chart axis label
# format         num2 | num1 | pct1 | int  (GOP [1,2,2] | [1,2,1] | [100,2,1] | [1,2,0])
# polarity       higher | lower, from the offense / player perspective
#                (cfbfastR-cfb-data team_summaries rank directions)
# family         efficiency | explosiveness | volume | tendency | situational | drive | adjusted
#                (consumers do not colour ``tendency``: style, not quality)
# qualifier      dropbacks | carries | targets | null -- the denominator a
#                phase-bound metric is measured against
# glossary_slug  the web glossary anchor, or null until one exists
# variants       per-basis siblings of the same quantity ({} when none)

