# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pycqa/isort
    rev: "5.12.0"
    hooks:
      - id: isort
        args: [--add-import, "from __future__ import annotations"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.14
    hooks:
      # Run the linter.
      - id: ruff-check
      - id: ruff-format
        # # Run the formatter.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-ast
      - id: check-toml
      - id: check-json
      - id: check-xml
      - id: check-yaml
        exclude: ^recipe/meta\.yaml$
      - id: check-symlinks
      - id: end-of-file-fixer
        # - id: check-vcs-permalinks
      - id: requirements-txt-fixer
      - id: check-added-large-files
        args: [--maxkb=10000]
      - id: debug-statements
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0 # Use the ref you want to point at
    hooks:
      - id: python-use-type-annotations
      - id: python-no-eval
      - id: python-no-log-warn
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
      - id: text-unicode-replacement-char
      - id: python-check-mock-methods
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma
  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: v0.0.3
    hooks:
      - id: sync-pre-commit-deps
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.36.1
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
  - repo: https://github.com/google/yamlfmt
    rev: v0.19.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/thlorenz/doctoc
    rev: "v2.2.0" # substitute a tagged version
    hooks:
      - id: doctoc
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".markdownlint-cli2.yaml"]
  # Sync the docusaurus CHANGELOG copy from the repo-root master copy
  # whenever CHANGELOG.md is touched. Until 0.0.51 this sync was done
  # manually (`cp CHANGELOG.md docs/src/pages/CHANGELOG.md`); the hook
  # makes drift impossible. The hook stages the synced file
  # automatically so `git commit` sees both copies in the same commit.
  - repo: local
    hooks:
      - id: sync-docs-changelog
        name: sync-docs-changelog
        entry: python -c "import shutil, subprocess, sys; shutil.copy('CHANGELOG.md', 'docs/src/pages/CHANGELOG.md'); subprocess.run(['git', 'add', 'docs/src/pages/CHANGELOG.md'])"
        language: system
        files: ^CHANGELOG\.md$
        pass_filenames: false
