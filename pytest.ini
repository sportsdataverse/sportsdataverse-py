[pytest]
markers =
    sequential
testpaths =
    tests

# Suppress noise that's not from sportsdataverse code:
# - sphinxcontrib-jsmath ships a legacy .pth file that calls
#   pkg_resources.declare_namespace('sphinxcontrib') at every Python
#   startup. The package's last release (1.0.1) is from 2019, has no
#   modern replacement, and is pulled in transitively by sphinx; we
#   can't upgrade or drop it.
# - The pkg_resources `is deprecated as an API` UserWarning is the
#   same provenance — emitted by .venv's pkg_resources/__init__.py
#   at import time, not by any first-party code.
filterwarnings =
    ignore:Deprecated call to `pkg_resources.declare_namespace.'sphinxcontrib'.`:DeprecationWarning
    ignore:pkg_resources is deprecated as an API:UserWarning:pkg_resources
