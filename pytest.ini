[pytest]
markers =
    sequential
testpaths =
    tests

# Suppress noise that's not from sportsdataverse code:
# - sphinxcontrib-jsmath ships a legacy .pth file that calls
#   pkg_resources.declare_namespace('sphinxcontrib') at every Python
#   startup. The package's last release (1.0.1) is from 2019, has no
#   modern replacement, and is pulled in transitively by sphinx; we
#   can't upgrade or drop it.
# - The pkg_resources `is deprecated as an API` UserWarning is the
#   same provenance — emitted by .venv's pkg_resources/__init__.py
#   at import time, not by any first-party code.
#
# Every other warning is an ERROR (the first line; pytest applies the last matching filter).
# A test that exercises a warning path asserts it with pytest.warns(..., match=...); one that
# trips a warning incidentally filters exactly that message, with a comment naming the test
# that asserts it. The main-only live job passes -W default, so upstream data only reports.
filterwarnings =
    error
    ignore:Deprecated call to `pkg_resources.declare_namespace.'sphinxcontrib'.`:DeprecationWarning
    ignore:pkg_resources is deprecated as an API:UserWarning:pkg_resources
    # kloppy (the soccer extra) never closes the spooled buffer kloppy/io.py opens for each input, so
    # its ResourceWarning fires at garbage collection, in whichever test happens to be running.
    ignore:Unclosed file <kloppy.infra.io.buffered_stream.BufferedStream:ResourceWarning
