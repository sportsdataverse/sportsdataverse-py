config:
  # Default state for all rules
  default: true
  # Path to configuration file to extend
  extends: null
  # MD001/heading-increment : Heading levels should only increment by one level at a time
  MD001:
    front_matter_title: "^\\s*title\\s*[:=]"
  # MD003/heading-style : Heading style
  MD003:
    style: "consistent"
  # MD004/ul-style : Unordered list style
  MD004:
    style: "consistent"
  # MD005/list-indent : Inconsistent indentation for list items at the same level
  MD005: true
  # MD007/ul-indent : Unordered list indentation
  MD007:
    indent: 2
    start_indented: false
    start_indent: 2
  # MD009/no-trailing-spaces : Trailing spaces
  MD009:
    br_spaces: 2
    code_blocks: false
    list_item_empty_lines: false
    strict: false
  # MD010/no-hard-tabs : Hard tabs
  MD010:
    code_blocks: true
    ignore_code_languages: []
    spaces_per_tab: 1
  # MD011/no-reversed-links : Reversed link syntax
  MD011: true
  # MD012/no-multiple-blanks : Multiple consecutive blank lines
  MD012:
    maximum: 2
  # MD013/line-length : Line length
  MD013:
    line_length: 130
    heading_line_length: 130
    code_block_line_length: 130
    code_blocks: true
    tables: false
    headings: true
    strict: false
    stern: false
  # MD014/commands-show-output : Dollar signs used before commands without showing output
  MD014: true
  MD018: true
  MD019: true
  MD020: true
  MD021: true
  # MD022/blanks-around-headings
  MD022:
    lines_above: 1
    lines_below: 1
  MD023: true
  MD024:
    siblings_only: false
  # MD025/single-title/single-h1
  MD025:
    front_matter_title: "^\\s*title\\s*[:=]"
    level: 1
  MD026:
    punctuation: ".,;:!。，；：！"
  MD027:
    list_items: true
  MD028: true
  MD029:
    style: "one_or_ordered"
  MD030:
    ul_single: 1
    ol_single: 1
    ul_multi: 1
    ol_multi: 1
  MD031:
    list_items: true
  MD032: true
  MD033:
    allowed_elements: []
    table_allowed_elements: []
  MD034: true
  MD035:
    style: "consistent"
  # Emphasis-as-heading and bare-language-on-fences are widespread in our
  # auto-generated Sphinx markdown — leave them off so the doc rebuild
  # doesn't fight markdownlint.
  MD036: false
  MD037: true
  MD038: true
  MD039: true
  MD040: false
  MD041: false
  MD042: true
  MD043: false
  MD044:
    names: []
    code_blocks: true
    html_elements: true
  MD045: true
  MD046:
    style: "consistent"
  MD047: true
  MD048:
    style: "consistent"
  MD049:
    style: "consistent"
  MD050:
    style: "consistent"
  MD051:
    ignore_case: false
    ignored_pattern: ""
  MD052:
    ignored_labels:
      - "x"
    shortcut_syntax: false
  MD053:
    ignored_definitions:
      - "//"
  MD054:
    autolink: true
    inline: true
    full: true
    collapsed: true
    shortcut: true
    url_inline: true
  MD055:
    style: "consistent"
  MD056: true
  MD058: true
  MD059:
    prohibited_texts:
      - "click here"
      - "here"
      - "link"
      - "more"
  MD060:
    style: "any"
    aligned_delimiter: false
# Globs that markdownlint-cli2 should NOT lint. Keep auto-generated Sphinx
# output and Docusaurus pages out of scope; we don't want the build to
# fight the docs pipeline.
ignores:
  - "Sphinx-docs/_build/**"
  - "docs/docs/**"
  - "docs/build/**"
  - "docs/node_modules/**"
  - "node_modules/**"
  - ".venv/**"
  - "dev/**"
  - "archive/**"
